# External Secrets Operator —— oracle-k3s values
#
# 2026-08-10 新建。此前 `just install-eso` 只有内联 `--set metrics.service.enabled=true`，
# 没有任何 values 文件，三个 Deployment 全部吃 chart 默认的 `resources: {}` → **BestEffort**。
#
# 为什么在 oracle 上更要紧：QoS 是 kubelet 驱逐排序的**第一级**判据（先看用量是否超
# request；BestEffort 的 request 恒为 0，所以永远落在"超"那一档），排在标了 `bulk`(-10)
# 的个人应用**前面**被驱逐 —— 与 reference/k8s-qos-resource-management.md 的设计意图相反。
# 而 oracle 只有 9080Mi allocatable，是真会碰到内存压力的那个集群。
# webhook 挂掉 = externalsecret-validate（failurePolicy: Fail）拒绝所有 ExternalSecret 写入。
#
# 数值按 Prometheus 实测 7d 峰值填，CPU p95 均 ≤2m 故统一 10m：
#   controller 202Mi · cert-controller 215Mi · webhook 73Mi
# ⚠️ 数值刻意与 homelab 的 k8s/helm/values/external-secrets.yaml **不同**：
#    oracle 侧 controller/cert-controller 的实测峰值明显更高（管的 ExternalSecret 更多）。
resources:
  requests:
    cpu: 10m
    memory: 224Mi
  limits:
    memory: 448Mi

webhook:
  port: 9443
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 240Mi
    limits:
      memory: 448Mi

# 与 homelab 一致：暴露 metrics 给 kube-prometheus-stack（Prometheus 在 homelab，
# 跨集群抓取见 reference/observability-multicluster.md）。
metrics:
  service:
    enabled: true
