# Cilium CNI values for oracle-k3s (single-node)
# Cilium provides the data plane, Gateway API ingress, and ClusterMesh control plane.
# Docs: https://docs.cilium.io/en/stable/installation/k8s-install-helm/

# --- kube-proxy replacement: required for Cilium Gateway API ---
# K3s must also set disable-kube-proxy: true in /etc/rancher/k3s/config.yaml.
kubeProxyReplacement: true

# --- API server address: required when kube-proxy is disabled ---
k8sServiceHost: "10.0.0.26"
k8sServicePort: 6443

cluster:
  name: oracle-k3s
  id: 2

# --- Routing: VXLAN tunnel (consistent with homelab) ---
routingMode: tunnel
tunnelProtocol: vxlan

# --- IPAM: oracle-k3s Pod CIDR ---
ipam:
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.52.0.0/16"

# --- Operator: single node, no anti-affinity needed ---
operator:
  replicas: 1

# --- Hubble: observability ---
hubble:
  enabled: true
  tls:
    enabled: true
    auto:
      enabled: true
      # Cilium chart expects "cronJob" (capital J). Using "cronjob" skips certgen resources
      # and leaves Hubble Relay waiting for hubble-relay-client-certs forever.
      method: cronJob
      # Keep the default 1-year lifetime; longer self-signed certs break some macOS clients.
      certValidityDuration: 365
  relay:
    enabled: true
  ui:
    enabled: true
  # 2026-11-10 网络策略阶段 0：只开 drop 和 policy 两个指标，粒度到 workload 名、不带 IP（同 homelab）。
  # oracle 没有 Prometheus Operator，不建 ServiceMonitor：由 otel-collector 抓 hubble-metrics:9965
  # 再 remote-write 到 homelab（monitoring/otel-collector-config.yaml 的 prometheus/hubble）。
  # 开它会给 DaemonSet 加 hostPort 9965，pod 模板变了，helm 会自己滚 agent。
  metrics:
    enabled:
      - "drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace"
      - "policy:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace,traffic_direction"
  # 2026-11-15 流量日志 → Loki。来龙去脉、字段掩码和过滤规则的理由都写在 homelab 那份
  # （k8s/cilium/values.yaml 的 hubble.export），这里只是同一份配置。
  # ⚠️ 与 homelab 唯一的差别是 flows 多排除 loki-gateway → loki：nginx 不复用连接，
  #    2026-11-15 实测占本节点新建连接的一半，而这条边本身没有信息量。
  export:
    dynamic:
      enabled: true
      config:
        content:
          - name: flows
            filePath: /var/run/cilium/hubble/flows.log
            fileMaxSizeMb: 10
            fileMaxBackups: 2
            fieldMask: &flowmask
              - verdict
              - drop_reason_desc
              - traffic_direction
              - event_type
              - trace_observation_point
              - is_reply
              - IP.source
              - IP.destination
              - IP.source_xlated
              - l4.TCP.destination_port
              - l4.UDP.destination_port
              - source.identity
              - source.cluster_name
              - source.namespace
              - source.workloads
              - destination.identity
              - destination.cluster_name
              - destination.namespace
              - destination.workloads
              - egress_denied_by
              - ingress_denied_by
            includeFilters:
              - event_type: [{ type: 4 }]
                tcp_flags: [{ SYN: true }]
                reply: [false]
              - event_type: [{ type: 4 }]
                protocol: ["udp"]
                reply: [false]
            excludeFilters:
              - source_label: ["reserved:host"]
              - destination_label: ["reserved:health"]
              - destination_port: ["53"]
              - event_type: [{ type: 4, match_sub_type: true, sub_type: 11 }]
              - source_pod: ["monitoring/loki-gateway"]
                destination_pod: ["monitoring/loki-"]
          - name: verdicts
            filePath: /var/run/cilium/hubble/verdicts.log
            fileMaxSizeMb: 10
            fileMaxBackups: 2
            fieldMask: *flowmask
            includeFilters:
              - verdict: ["DROPPED", "AUDIT"]
            excludeFilters:
              - drop_reason_desc: ["UNSUPPORTED_L3_PROTOCOL"]

# --- 网络策略阶段 0（2026-11-10）---
# ☠️ 这两项只改 cilium-config ConfigMap：chart 的 rollOutCiliumPods=false。这次因为同时开了
#    hubble.metrics（pod 模板变了）才会自动滚 agent；以后单独改它们（例如翻 enforce）必须
#    `kubectl --context oracle-k3s -n kube-system rollout restart ds/cilium`，再跑
#    `cilium-dbg config | grep PolicyAuditMode` 核实。
# ⚠️ audit 窗口内 oracle 原有的策略也只记录不拦截：readlist 的 no-egress、argocd 的 4 条 NP，
#    以及 base/deny-oci-imds.yaml（IMDSv1 已关，SSRF 仍拿不到凭据；实例主体当前无任何权限）。
policyDenyResponse: icmp   # 出口被策略拒绝时回 ICMP 不可达：应用立即报错，不再静默超时
policyAuditMode: true      # audit 窗口：全集群策略只记录不拦截。soak 通过后改 false，即翻 enforce

# --- Gateway API: Cilium-managed ingress ---
gatewayAPI:
  enabled: true
  # 2026-07-06: ZITADEL 迁 oracle 后，console v1 gRPC(auth.v1/admin.v1) 需 Cilium honour
  # Service appProtocol(zitadel:8080→h2c)，否则 gRPC-web 转原生 gRPC 走 HTTP/1.1 → 404。
  # 与 homelab k8s/cilium/values.yaml 一致。见 records/zitadel-console-grpc-404.md
  enableAppProtocol: true

# --- ClusterMesh ---
clustermesh:
  useAPIServer: true
  config:
    enabled: true
    # 2026-08-05 补：**这段之前是缺的**，只存在于 live helm release 的 stored values 里
    # （由 `cilium clustermesh connect` 写入）。而本目录的 `just deploy-cilium` 带
    # `--reset-values` —— 跑一次就会把对端条目连根删掉，ClusterMesh 静默断开
    # （kvstoremesh 变成 0 remote clusters，不报任何错）。
    # 对称物是 homelab 的 k8s/cilium/values.yaml，它一直有这段。
    #
    # 写进来之后 endpoint 条目本身是幂等的了。
    #
    # ⚠️⚠️ **但 `deploy-cilium` 整体仍然不幂等 —— 2026-08-10 实测证伪了上面这条**：
    # 原注释说「仍要跑 connect 的唯一场景是任一集群重建」。错。`--reset-values`
    # **同时**会把 `cilium clustermesh connect` 交换来的**跨集群 CA 信任**冲掉，
    # 而那份信任不在本文件里、也不可能在（证书不入库）。当天一次只为改 resources 的
    # 例行部署就断了 mesh，形态极具迷惑性：
    #   - `cilium-dbg troubleshoot clustermesh` 六项全 ✅（TCP/TLS/CA/客户端证书都"正常"）
    #     —— 因为 KVStoreMesh 架构下 agent 连的是**本地** apiserver，那段当然通
    #   - NodePort 32379 从 Tailscale 双向 TCP 可达，两节点 ip rule 5200 也都在
    #   - 唯一真判据是 `cilium status` 的 `remote configuration: retrieved=false`
    #     和 **对端 etcd 容器**日志里的 `remote error: tls: bad certificate`
    #
    # 结论：**任何一侧跑完 `deploy-cilium`，都要接着跑一次**
    #   `just connect-clustermesh 100.94.186.7:32379 100.107.166.37:32379`
    # （它带 `--allow-mismatching-ca`，正是为两集群各自自签 CA 的情况设计的）。
    # ips 必须是对端的 **Tailscale IP**（不是 VCN 私网 IP），配合 NodePort 32379。
    clusters:
      - name: homelab
        ips:
          - 100.94.186.7
        port: 32379
  apiserver:
    service:
      type: NodePort
      nodePort: 32379
    # 2026-08-05 补：此前三个容器（apiserver/etcd/kvstoremesh）**完全没有 requests/limits**
    # → BestEffort。24GB 时无所谓，缩到 12GB 后它是节点内存压力下最先被算账的一档。
    # 值对齐 homelab 的 k8s/cilium/values.yaml；实测用量 apiserver 32Mi / etcd 13Mi /
    # kvstoremesh 22Mi，留足余量。（priorityClassName 不用设：chart 已给
    # system-cluster-critical，实测 pod priority = 2000000000。）
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { cpu: 500m, memory: 192Mi }
    etcd:
      resources:
        requests: { cpu: 25m, memory: 96Mi }
        limits: { cpu: 500m, memory: 256Mi }
    kvstoremesh:
      resources:
        requests: { cpu: 15m, memory: 64Mi }
        limits: { cpu: 300m, memory: 192Mi }

# ☠️ xDS 模式必须显式钉死（2026-11-20）。chart 的默认值在补丁版之间翻过：1.20.0 对「新装」默认 `ads`
# （我们没设，于是静默拿到 ads，两集群现网都是 `envoy-xds-mode: ads`），1.20.5 改成默认不设、
# agent 回落到 `split`。不钉的话，一次例行 `deploy-cilium` 就会悄悄把 Envoy 的配置下发通道换掉，
# 而入口流量全走 Envoy。同类事故见 versions.just 头部（2026-08-10 漏 --version 静默升了 minor）。
# 钉 ads 而不是 split：保持现网行为不变，并拿到 1.20.3/1.20.4 里的 ADS 修复。
envoy:
  xdsMode: ads

# --- cgroup: K3s mounts cgroup v2 at /sys/fs/cgroup ---
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
