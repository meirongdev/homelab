# Tetragon —— oracle 专属 values（叠加在 security/tetragon/values-common.yaml 之上）
# 由 ArgoCD Helm App 部署（argocd/applications/tetragon-oracle.yaml），dest ns: tetragon
# 2026-11-24 起取代 Falco。两集群共用的部分都在 values-common.yaml，这里只放 oracle 的差异。

tetragon:
  # --- agent 资源 ---
  # request 照抄 homelab 的稳态口径（50m / 160Mi）：oracle 2 OCPU / 12G，CPU requests 本来就占到 ~67%，
  # 别在这里多报。
  # memory limit 512Mi（与 homelab 同值；2026-11-25 从上线时的 768Mi 收紧）。上线时先给宽，是因为当天 Falco 刚因 7.0 内核
  #   加载 BPF 时把校验器内存记在容器 memcg 上被 OOM（峰值 520Mi，见 docs/records/2026-11-24-oracle-kernel-7-falco-to-tetragon.md）。
  #   oracle 实测（arm64 + 7.0.0-1016，看 cgroup 的 memory.peak，不看 working set）：
  #     · 首次加载两条策略 185Mi；
  #     · 再**新建**一条策略（临时 tp- 测试策略）→ 293Mi，**更新**它（agent 内部 delete+add）→ 308Mi，删掉后峰值不回落、
  #       当前占用停在 267Mi（Go 堆不还给系统，反复改策略会累积，homelab 也见过 ~210Mi 的残留）。
  #   512Mi = 更新路径峰值 308Mi 的 1.66 倍（homelab 是 373Mi 的 1.37 倍）。被 OOM = 检测静默失效，所以按更新路径定，
  #   不按稳态定。测法：tp- 前缀的策略不触发告警，匹配一个不存在的路径就永远不命中，测完删掉。
  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # oracle 没有 Prometheus / ServiceMonitor CRD：指标由 oracle 的 OTel Collector 抓
  # （cloud/oracle/manifests/monitoring/otel-collector-config.yaml 的 prometheus/tetragon），
  # remote write 到 homelab Prometheus，打 cluster=oracle-k3s。
  prometheus:
    serviceMonitor:
      enabled: false
