# Cilium CNI values for oracle-k3s (single-node)
# Cilium provides the data plane, Gateway API ingress, and ClusterMesh control plane.
# Docs: https://docs.cilium.io/en/stable/installation/k8s-install-helm/

# --- kube-proxy replacement: required for Cilium Gateway API ---
# K3s must also set disable-kube-proxy: true in /etc/rancher/k3s/config.yaml.
kubeProxyReplacement: true

# --- API server address: required when kube-proxy is disabled ---
k8sServiceHost: "10.0.0.26"
k8sServicePort: 6443

cluster:
  name: oracle-k3s
  id: 2

# --- Routing: VXLAN tunnel (consistent with homelab) ---
routingMode: tunnel
tunnelProtocol: vxlan

# --- IPAM: oracle-k3s Pod CIDR ---
ipam:
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.52.0.0/16"

# --- Operator: single node, no anti-affinity needed ---
operator:
  replicas: 1

# --- Hubble: observability ---
hubble:
  enabled: true
  tls:
    enabled: true
    auto:
      enabled: true
      # Cilium chart expects "cronJob" (capital J). Using "cronjob" skips certgen resources
      # and leaves Hubble Relay waiting for hubble-relay-client-certs forever.
      method: cronJob
      # Keep the default 1-year lifetime; longer self-signed certs break some macOS clients.
      certValidityDuration: 365
  relay:
    enabled: true
  ui:
    enabled: true

# --- Gateway API: Cilium-managed ingress ---
gatewayAPI:
  enabled: true
  # 2026-07-06: ZITADEL 迁 oracle 后，console v1 gRPC(auth.v1/admin.v1) 需 Cilium honour
  # Service appProtocol(zitadel:8080→h2c)，否则 gRPC-web 转原生 gRPC 走 HTTP/1.1 → 404。
  # 与 homelab k8s/cilium/values.yaml 一致。见 records/zitadel-console-grpc-404.md
  enableAppProtocol: true

# --- ClusterMesh ---
clustermesh:
  useAPIServer: true
  config:
    enabled: true
    # 2026-08-05 补：**这段之前是缺的**，只存在于 live helm release 的 stored values 里
    # （由 `cilium clustermesh connect` 写入）。而本目录的 `just deploy-cilium` 带
    # `--reset-values` —— 跑一次就会把对端条目连根删掉，ClusterMesh 静默断开
    # （kvstoremesh 变成 0 remote clusters，不报任何错）。
    # 对称物是 homelab 的 k8s/cilium/values.yaml，它一直有这段。
    #
    # 写进来之后 endpoint 条目本身是幂等的了。
    #
    # ⚠️⚠️ **但 `deploy-cilium` 整体仍然不幂等 —— 2026-08-10 实测证伪了上面这条**：
    # 原注释说「仍要跑 connect 的唯一场景是任一集群重建」。错。`--reset-values`
    # **同时**会把 `cilium clustermesh connect` 交换来的**跨集群 CA 信任**冲掉，
    # 而那份信任不在本文件里、也不可能在（证书不入库）。当天一次只为改 resources 的
    # 例行部署就断了 mesh，形态极具迷惑性：
    #   - `cilium-dbg troubleshoot clustermesh` 六项全 ✅（TCP/TLS/CA/客户端证书都"正常"）
    #     —— 因为 KVStoreMesh 架构下 agent 连的是**本地** apiserver，那段当然通
    #   - NodePort 32379 从 Tailscale 双向 TCP 可达，两节点 ip rule 5200 也都在
    #   - 唯一真判据是 `cilium status` 的 `remote configuration: retrieved=false`
    #     和 **对端 etcd 容器**日志里的 `remote error: tls: bad certificate`
    #
    # 结论：**任何一侧跑完 `deploy-cilium`，都要接着跑一次**
    #   `just connect-clustermesh 100.94.186.7:32379 100.107.166.37:32379`
    # （它带 `--allow-mismatching-ca`，正是为两集群各自自签 CA 的情况设计的）。
    # ips 必须是对端的 **Tailscale IP**（不是 VCN 私网 IP），配合 NodePort 32379。
    clusters:
      - name: homelab
        ips:
          - 100.94.186.7
        port: 32379
  apiserver:
    service:
      type: NodePort
      nodePort: 32379
    # 2026-08-05 补：此前三个容器（apiserver/etcd/kvstoremesh）**完全没有 requests/limits**
    # → BestEffort。24GB 时无所谓，缩到 12GB 后它是节点内存压力下最先被算账的一档。
    # 值对齐 homelab 的 k8s/cilium/values.yaml；实测用量 apiserver 32Mi / etcd 13Mi /
    # kvstoremesh 22Mi，留足余量。（priorityClassName 不用设：chart 已给
    # system-cluster-critical，实测 pod priority = 2000000000。）
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { cpu: 500m, memory: 192Mi }
    etcd:
      resources:
        requests: { cpu: 25m, memory: 96Mi }
        limits: { cpu: 500m, memory: 256Mi }
    kvstoremesh:
      resources:
        requests: { cpu: 15m, memory: 64Mi }
        limits: { cpu: 300m, memory: 192Mi }

# --- cgroup: K3s mounts cgroup v2 at /sys/fs/cgroup ---
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
