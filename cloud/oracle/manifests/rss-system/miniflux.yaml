apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: rss-system
  labels:
    app: miniflux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      containers:
        - name: miniflux
          image: miniflux/miniflux@sha256:42f14382a035e9d9bbc33910ca53f72d47177f75c3c638d2c5a85adf5582d538  # 当前运行 digest 固定（原 :latest）
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: miniflux-db-secret
                  key: database-url
            - name: RUN_MIGRATIONS
              value: "1"
            - name: CREATE_ADMIN
              value: "1"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: miniflux-admin-secret
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-admin-secret
                  key: password
            # --- ZITADEL OIDC SSO (native; local admin login above stays as fallback) ---
            # BASE_URL makes Miniflux build absolute/redirect URLs as https://rss.meirong.dev
            # (it sits behind Cloudflare Tunnel → Cilium Gateway, not localhost).
            - name: BASE_URL
              value: https://rss.meirong.dev
            - name: OAUTH2_PROVIDER
              value: oidc
            # Bare issuer — Miniflux appends /.well-known/openid-configuration itself.
            - name: OAUTH2_OIDC_DISCOVERY_ENDPOINT
              value: https://auth.meirong.dev
            - name: OAUTH2_OIDC_PROVIDER_NAME
              value: ZITADEL
            - name: OAUTH2_REDIRECT_URL
              value: https://rss.meirong.dev/oauth2/oidc/callback
            # Auto-provision a Miniflux user on first SSO login (keyed by OIDC sub/email).
            # The existing local admin can instead link SSO under Settings → keeps admin rights.
            - name: OAUTH2_USER_CREATION
              value: "1"
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: miniflux-admin-secret
                  key: oauth-client-id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: miniflux-admin-secret
                  key: oauth-client-secret
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  namespace: rss-system
spec:
  type: ClusterIP
  selector:
    app: miniflux
  ports:
    - port: 8080
      targetPort: 8080
      name: http
# ─────────────────────────────────────────────────────────────────────────────
# rss-postgres（手搓 Deployment + PG15 + postgres-exporter sidecar + NodePort 31087
# + miniflux-db-pvc）已于 2026-08-06 退役，数据迁入 CNPG 共享集群：
#     apps-pg-rw.databases.svc.cluster.local:5432/miniflux   (PG17)
# 清单见 cloud/oracle/manifests/databases/，设计见
# docs/decisions/shared-postgres-platform.md。
# miniflux 的连接串由 rss-system/secrets.yaml 的 ExternalSecret 模板拼出。
#
# ⚠️ 以后本 ns 的应用**不要**再在这里内联一个 postgres：加 Database/DatabaseRole CR
# 到 databases ns 即可（那两种 CR 的 spec.cluster 没有 namespace 字段，必须与
# Cluster 同 ns）。
# ─────────────────────────────────────────────────────────────────────────────
