apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsshub
  namespace: rss-system
  labels:
    app: rsshub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsshub
  template:
    metadata:
      labels:
        app: rsshub
    spec:
      priorityClassName: bulk   # 非核心，与同文件 browserless 一致（2026-08-12 补齐）
      containers:
        - name: rsshub
          # 2026-10-11 digest 刷新（原 sha256:2580aabb…）。动因：旧 digest 带 vm2 CVE-2026-100721
          # Critical；新 digest 实测 vm2 升至 3.12.2（修复版本），多架构 index digest（amd64 + arm64）
          # 本地 Trivy 扫描验证 Critical 为 0。
          image: diygod/rsshub@sha256:0b6576b501f8562def759bc76c5829a030409a099960cbe492a88d99ac9973e4  # 当前 :latest 的多架构 index digest（amd64 + arm64）
          ports:
            - containerPort: 1200
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: CACHE_TYPE
              value: redis
            - name: REDIS_URL
              value: redis://rsshub-redis:6379/
            - name: PUPPETEER_WS_ENDPOINT
              value: ws://rsshub-browserless:3000
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 1200
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 1200
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rsshub
  namespace: rss-system
spec:
  type: ClusterIP
  selector:
    app: rsshub
  ports:
    - port: 1200
      targetPort: 1200
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsshub-redis
  namespace: rss-system
  labels:
    app: rsshub-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsshub-redis
  template:
    metadata:
      labels:
        app: rsshub-redis
    spec:
      priorityClassName: bulk   # 非核心，与同文件 browserless 一致（2026-08-12 补齐）
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rsshub-redis
  namespace: rss-system
spec:
  type: ClusterIP
  selector:
    app: rsshub-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsshub-browserless
  namespace: rss-system
  labels:
    app: rsshub-browserless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsshub-browserless
  template:
    metadata:
      labels:
        app: rsshub-browserless
    spec:
      priorityClassName: bulk
      containers:
        - name: browserless
          image: browserless/chrome@sha256:57d19e414d9fe4ae9d2ab12ba768c97f38d51246c5b31af55a009205c136012f  # 当前运行 digest 固定（原 :latest）
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: MAX_CONCURRENT_SESSIONS
              value: "10"
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rsshub-browserless
  namespace: rss-system
spec:
  type: ClusterIP
  selector:
    app: rsshub-browserless
  ports:
    - port: 3000
      targetPort: 3000
      name: http
