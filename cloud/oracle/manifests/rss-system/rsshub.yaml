apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsshub
  namespace: rss-system
  labels:
    app: rsshub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsshub
  template:
    metadata:
      labels:
        app: rsshub
    spec:
      priorityClassName: bulk   # 非核心，与同文件 browserless 一致（2026-08-12 补齐）
      containers:
        - name: rsshub
          # 2026-08-04 digest 刷新（原 sha256:5bd34215…，已落后 upstream :latest）。
          # 动因：旧 digest 带 libgnutls30 CVE-2026-33845/42010 + protobufjs CVE-2026-41242。
          # 2026-09-14 再刷一次（原 sha256:b419ecc3…）。动因：旧 digest 的 Debian perl 停在
          # 5.40.1-6，带 CVE-2026-13221/42496/8376 三条 Critical；乘以 perl 源码包拆出的
          # 4 个二进制包 = 该次 TrivyImageCriticalVulnerabilities 15 条里的 12 条。
          # 新 digest 实测四个包（perl / perl-base / libperl5.40 / perl-modules-5.40）都是
          # 5.40.1-6+deb13u1，且 **amd64 与 arm64 两个变体分别 dpkg -l 核过**——节点是 arm64，
          # 真正在跑的是 arm64 变体，而 trivy 默认只扫 amd64，只核后者等于没核。
          image: diygod/rsshub@sha256:2580aabbec453a4f11fd86af97f8b48a826e685623418d8f8cfdd21dceb459fd  # 当前 :latest 的多架构 index digest（amd64 + arm64）
          ports:
            - containerPort: 1200
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: CACHE_TYPE
              value: redis
            - name: REDIS_URL
              value: redis://rsshub-redis:6379/
            - name: PUPPETEER_WS_ENDPOINT
              value: ws://rsshub-browserless:3000
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 1200
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 1200
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rsshub
  namespace: rss-system
spec:
  type: ClusterIP
  selector:
    app: rsshub
  ports:
    - port: 1200
      targetPort: 1200
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsshub-redis
  namespace: rss-system
  labels:
    app: rsshub-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsshub-redis
  template:
    metadata:
      labels:
        app: rsshub-redis
    spec:
      priorityClassName: bulk   # 非核心，与同文件 browserless 一致（2026-08-12 补齐）
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rsshub-redis
  namespace: rss-system
spec:
  type: ClusterIP
  selector:
    app: rsshub-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsshub-browserless
  namespace: rss-system
  labels:
    app: rsshub-browserless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rsshub-browserless
  template:
    metadata:
      labels:
        app: rsshub-browserless
    spec:
      priorityClassName: bulk
      containers:
        - name: browserless
          image: browserless/chrome@sha256:57d19e414d9fe4ae9d2ab12ba768c97f38d51246c5b31af55a009205c136012f  # 当前运行 digest 固定（原 :latest）
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: MAX_CONCURRENT_SESSIONS
              value: "10"
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rsshub-browserless
  namespace: rss-system
spec:
  type: ClusterIP
  selector:
    app: rsshub-browserless
  ports:
    - port: 3000
      targetPort: 3000
      name: http
