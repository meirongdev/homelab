---
# Provisioner script — creates admin account + all monitors on first deploy
# Run manually: just provision-uptime-kuma
apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-kuma-provisioner
  namespace: personal-services
data:
  provision.py: |
    #!/usr/bin/env python3
    import os, sys, time, urllib.request

    UPTIME_KUMA_URL = os.environ.get("UPTIME_KUMA_URL", "http://uptime-kuma:3001")
    USERNAME = os.environ.get("ADMIN_USERNAME", "admin")
    PASSWORD = os.environ["ADMIN_PASSWORD"]

    # oracle-k3s local services: direct ClusterDNS via local CNI.
    # homelab services: public URLs via Cloudflare/Cilium Gateway, so status reflects real external reachability.
    # This keeps cross-cluster networking off the critical path for status monitoring.
    MONITORS = [
        # --- oracle-k3s local services ---
        {"name": "Homepage",       "url": "http://homepage.homepage.svc:3000"},
        {"name": "Miniflux",       "url": "http://miniflux.rss-system.svc:8080"},
        {"name": "IT-Tools",       "url": "http://it-tools.personal-services.svc:80"},
        {"name": "Squoosh",        "url": "http://squoosh.personal-services.svc:8080"},
        # BentoPDF 是纯静态站，`/` 直接 200 —— 不像前任 stirling-pdf 要探 /login 绕开登录重定向。
        {"name": "BentoPDF",       "url": "http://bentopdf.personal-services.svc:8080/"},
        {"name": "Uptime Kuma",    "url": "http://uptime-kuma.personal-services.svc:3001"},
        # --- public-URL probes (Cloudflare → Cilium Gateway) ---
        # Auth-protected services may redirect to their own login page; treat 2xx-3xx as healthy external reachability.
        # Do not follow redirects into full login exchanges.
        # ⚠️ 这组不再等同于「homelab 的服务」：Grafana/Vault/Open Notebook 在 homelab，
        # 而 Calibre-Web 与 ArgoCD 已于 2026-08-02~03 迁去 oracle。探的是端到端公网可达性，
        # 与后端落在哪个集群无关，故仍走公网 URL；但只有前三个能当 homelab 的存活信号（见下方 dead-man 注释）。
        {"name": "Grafana",        "url": "https://grafana.meirong.dev/",       "accepted_statuscodes": ["300-399"], "maxredirects": 0},
        {"name": "HashiCorp Vault","url": "https://vault.meirong.dev/",         "accepted_statuscodes": ["300-399"], "maxredirects": 0},
        {"name": "Calibre-Web",    "url": "https://book.meirong.dev/",          "accepted_statuscodes": ["300-399"], "maxredirects": 0},
        # Open Notebook: OPEN_NOTEBOOK_PASSWORD 开着时 / 可能直接 200（Next.js 客户端渲染登录页）
        # 也可能 3xx 跳 /login——两段都收，等实测出稳定状态码后再收紧。
        {"name": "Open Notebook",  "url": "https://notebook.meirong.dev/",      "accepted_statuscodes": ["200-299", "300-399"], "maxredirects": 0},
        {"name": "ArgoCD",         "url": "https://argocd.meirong.dev/",        "accepted_statuscodes": ["200-299", "300-399"]},
        # Multica（homelab）。未登录时 Next.js 落地页大概率客户端渲染直接 200，
        # 也可能 3xx 跳登录 —— 两段都收，等实测出稳定状态码再收紧（同 Open Notebook 的处理）。
        # ⚠️ 这条只证明 service 端活着。执行任务的 daemon 在 M2 MacBook 上，
        # 它挂了这个探测**依然全绿** —— daemon 的存活得看 `multica daemon status`。
        {"name": "Multica",        "url": "https://multica.meirong.dev/",       "accepted_statuscodes": ["200-299", "300-399"], "maxredirects": 0},
        # ZITADEL（oracle）2026-08-12 补：此前**整个清单里没有它**——身份提供方是全站
        # SSO 的单点依赖，却是唯一没有存活探测的对外服务。
        # 副作用同样重要：它因此是 5 个 SLO 里唯一没有探测底噪的，7 天仅 138 个真实请求
        # （~0.8 req/h），97.9% 的 5m 窗口为空 → SLI 长期无样本、可用性目标失真
        # （其余服务三千级的 3xx 计数正是这组探测穿过 gateway 留下的）。
        # 实测 2026-08-12：/ → 302 /ui/login，故与上面同款只收 3xx、不跟随跳转。
        {"name": "ZITADEL",        "url": "https://auth.meirong.dev/",          "accepted_statuscodes": ["300-399"], "maxredirects": 0},
        # 备份服务（原 Kopia）现已迁移 Tailscale NodePort（https://100.94.186.7:31515，自签 cert），不再有公网入口，故不在此处探测。
        # Timeslot: oracle-k3s local service, direct ClusterDNS bypasses SSO
        {"name": "Timeslot",       "url": "http://timeslot.personal-services.svc:8080/api/slots"},
        # Trends: GitHub 趋势追踪, /healthz returns 200
        {"name": "Trends",         "url": "http://trends.personal-services.svc:8080/healthz"},
        # readlist: 技术书评分/书单, /healthz returns 200。
        # ⚠️ 这条只证明 web pod 活着 —— readlist 是夜间管道服务，三个 CronJob 全挂了它
        # 照样绿（用最后一次发布的 run 服务）。数据新鲜度只有指标能看见，见
        # k8s/helm/manifests/monitoring/alerts/readlist-alerts.yaml。
        {"name": "readlist",       "url": "http://readlist.personal-services.svc:8080/healthz"},
        # Jobs SG: 在 homelab，故走公网 URL（与上面 Grafana/Vault 同理）。
        # 探 /healthz 而不是 / —— / 服务的是 report/latest.html，第一份周报出来前是 404，
        # 拿它当探针会让监控在首周一直红。/healthz 只验 DB 能打开。
        {"name": "Jobs SG",        "url": "https://jobs.meirong.dev/healthz"},
        # --- 集群外托管的站点（2026-08-23 补：此前这三个**一个监控都没有**）---
        # 它们既不在 homelab 也不在 oracle：Cloudflare Pages / GitHub Pages / Cloudflare
        # Workers。所以这三条探的是「外部托管 + DNS 记录」还活着，与两个集群无关。
        # ⚠️ **别把它们当集群存活信号** —— 下面 dead-man's switch 那段只认
        # Grafana/Vault/Open Notebook 那组；这三条全绿完全不代表集群还在。
        # 📌 副作用（这次是好的）：它们不经 Cilium Gateway，所以不会像上面那组一样给
        # gateway 指标灌进探测底噪；代价是这三个也就没有 gateway 侧的 SLI。
        # 归属与「谁该监控它们」见 docs/decisions/home-stack-repo-boundary.md。
        {"name": "Blog",           "url": "https://meirong.dev/"},
        # DNS-only（灰云）+ GitHub Pages → 这条探的是 GitHub，**不经 Cloudflare 边缘**，
        # 所以 WAF/限流那几层对它一条都不生效（见 reference/networking-ingress.md）。
        {"name": "Playgrounds",    "url": "https://playgrounds.meirong.dev/"},
        # home-stack（另一个仓库部署的 Worker）。⚠️ 探针必须是真实存在的路径：
        # 2026-08-23 起它的未知路径返回**真 404**（此前是 soft 404 的 200），
        # 拿一个不存在的路径当探针会永久红。`/` 是 SSR 首页，稳定 200。
        {"name": "Home Stack",     "url": "https://stack.meirong.dev/"},
    ]

    # 300s（原 120s）：v2 全新安装要先跑完全部 old_migrations 补丁才开始监听，
    # 而本 Job 作为 PostSync hook 会在 Deployment 刚滚动完就起跑。
    def wait_ready(timeout=300):
        deadline = time.time() + timeout
        while time.time() < deadline:
            try:
                urllib.request.urlopen(UPTIME_KUMA_URL, timeout=5)
                print("Uptime Kuma is ready.")
                return
            except Exception:
                print("Waiting for Uptime Kuma...")
                time.sleep(5)
        print("ERROR: Uptime Kuma not ready after timeout", file=sys.stderr)
        sys.exit(1)

    wait_ready()

    from uptime_kuma_api import UptimeKumaApi, MonitorType, NotificationType

    # ⚠️⚠️ socket.io 建连后的**第一个调用有竞态**，2026-08-05 在全新 2.5.0 上实测：
    # 构造返回时 sio.connected 已经是 True，但 engine.io 还在做 polling→websocket
    # 升级，此刻发出的第一个调用会有相当高概率**丢失** —— 客户端等满 timeout 抛
    # TimeoutError，而服务端根本没收到（当时 user 表仍为 0，能确证没到）。
    # 构造后 sleep 1s 就稳定复现成功；换更大的 timeout 完全治不了（丢了就是丢了）。
    #
    # 所以这里 sleep + 重试双保险：本脚本是 ArgoCD PostSync hook，它失败会让整个
    # App 的 sync 被标记失败（还会因 retry 把 revision 钉住），不值得为省 2 秒冒险。
    # 顺带用 need_setup() 当探针：它成功就说明这条连接真的可用，且它的返回值正好是
    # 下面要用的判据。
    #
    # timeout 给足（库默认 10s）：oracle 是免费层 ARM，setup 那步要跑 bcrypt。
    def connect_api(attempts=5):
        last = None
        for n in range(1, attempts + 1):
            api = UptimeKumaApi(UPTIME_KUMA_URL, timeout=120)
            time.sleep(2)
            try:
                return api, api.need_setup()
            except Exception as e:
                last = e
                print(f"Socket handshake attempt {n}/{attempts} failed: {type(e).__name__}")
                try:
                    api.disconnect()
                except Exception:
                    pass
                time.sleep(3)
        print(f"ERROR: no usable socket.io session after {attempts} attempts: {last}", file=sys.stderr)
        sys.exit(1)

    api, needs_setup = connect_api()

    # 显式判断该 setup 还是该 login。原先写的是 `try: setup() except: login()` ——
    # 那会把上面那个 TimeoutError 一并归成"账号已存在"，于是转去 login 报
    # authIncorrectCreds，真实原因被吃掉、排查时完全看不出是握手丢包。
    if needs_setup:
        api.setup(username=USERNAME, password=PASSWORD)
        print("Admin account created.")
    else:
        print("Already initialized, skipping setup.")

    # setup() 只建用户，不会让当前 socket 进入已认证状态 —— 两条路径都要再 login。
    api.login(username=USERNAME, password=PASSWORD)
    print("Logged in.")

    STATUS_PAGE_SLUG   = "homelab"
    STATUS_PAGE_TITLE  = "Homelab Status"
    STATUS_PAGE_DOMAIN = "status.meirong.dev"

    # --- Notification (Telegram) = dead-man's switch ---
    # oracle Uptime Kuma pings homelab public services (Grafana/Vault/Open Notebook) + oracle
    # services. Attaching a Telegram notification to ALL monitors means: homelab down → its services
    # unreachable → Uptime Kuma → Telegram Bot API (oracle → internet direct), with NO dependency
    # on homelab. oracle直连 api.telegram.org，无需中间层。
    # ⚠️ 2026-08-03：ArgoCD/Calibre 迁 oracle 后**不再是 homelab 的存活信号**（它们挂了说明
    # oracle 挂了）。homelab 侧的探针只剩上面那三个，别再往 homelab 搬服务而不补探针。
    # Same bot/group/topic as homelab Alertmanager's telegramConfigs — 「🚨 Homelab 告警」话题。
    TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
    TELEGRAM_CHAT_ID = -1003981213530
    TELEGRAM_MESSAGE_THREAD_ID = 2
    NOTIF_NAME = "Telegram (dead-man)"
    if TELEGRAM_BOT_TOKEN:
        # delete+recreate so the token always reflects the current secret (idempotent refresh);
        # delete+recreate so the token always reflects the current secret (idempotent refresh).
        # otherwise it stays isDefault+attached and keeps firing (and failing) against monitors.
        for n in api.get_notifications():
            if n["name"] == NOTIF_NAME:
                api.delete_notification(n["id"])
                print(f"Removed stale notification '{n['name']}'.")
        api.add_notification(
            name=NOTIF_NAME,
            type=NotificationType.TELEGRAM,
            isDefault=True,        # auto-attach to future monitors
            applyExisting=True,    # attach to all existing monitors now
            telegramBotToken=TELEGRAM_BOT_TOKEN,
            telegramChatID=str(TELEGRAM_CHAT_ID),
            telegramMessageThreadID=str(TELEGRAM_MESSAGE_THREAD_ID),
        )
        print(f"Telegram notification '{NOTIF_NAME}' created + applied to all monitors.")
    else:
        print("WARNING: TELEGRAM_BOT_TOKEN not set — no notification channel (dead-man's switch inactive).")

    # --- Push monitor for homelab Alertmanager Watchdog (dead-man's switch) ---
    # Homelab Alertmanager fires Watchdog → webhook → status.meirong.dev/api/push/... → Uptime Kuma.
    # If homelab goes down, pushes stop → Uptime Kuma marks DOWN → Telegram notification fires.
    # Both clusters have internet via Cloudflare, so the webhook goes public-internet path.
    #
    # 库不在 add_monitor 上暴露 pushToken，但 Kuma 服务端接受它 —— web UI 就是在客户端
    # 生成 token 后塞进同一个 payload。不传的话服务端会自己生成一个随机 token，
    # 那永远对不上 Alertmanager 的 webhook URL（dead-man's switch 静默失效）。
    # 绕过库的 kwarg 白名单注入：
    # ⚠️ 2026-08-05 换到 uptime-kuma-api-v2 后已重新实测这条 monkeypatch 仍然有效：
    # 全新 2.5.0 上建 PUSH 监控后直接查库确认 monitor.push_token 落的就是下面的常量
    # （注意 fork 的 get_monitors() 不回传 pushToken 字段，只用 API 断言会得到假阴性，
    #  验证要查库或直接打 /api/push——未知 token 返回 404、正确 token 返回 200）。
    _orig_build_monitor_data = UptimeKumaApi._build_monitor_data
    def _build_monitor_data_with_push_token(self, *args, pushToken=None, **kwargs):
        data = _orig_build_monitor_data(self, *args, **kwargs)
        if pushToken is not None:
            data["pushToken"] = pushToken
        return data
    UptimeKumaApi._build_monitor_data = _build_monitor_data_with_push_token

    PUSH_TOKEN = "alertmanager-watchdog-homelab"
    PUSH_MONITOR_NAME = "Alertmanager Watchdog"
    push_existing = {m["name"]: m for m in api.get_monitors()}
    if PUSH_MONITOR_NAME in push_existing:
        print(f"Push monitor '{PUSH_MONITOR_NAME}' already exists.")
    else:
        api.add_monitor(type=MonitorType.PUSH, name=PUSH_MONITOR_NAME, pushToken=PUSH_TOKEN, interval=60)
        print(f"Push monitor '{PUSH_MONITOR_NAME}' created (push token: {PUSH_TOKEN}).")

    # --- Monitors ---
    existing = {m["name"]: m for m in api.get_monitors()}
    print(f"Existing monitors: {set(existing.keys()) or '(none)'}")

    for m in MONITORS:
        extra = {}
        if "accepted_statuscodes" in m:
          extra["accepted_statuscodes"] = m["accepted_statuscodes"]
        else:
          extra["accepted_statuscodes"] = ["200-299"]

        # Pass through optional monitor parameters used by Uptime Kuma HTTP checks.
        for field in ("ignoreTls", "maxredirects", "timeout", "method"):
          if field in m:
            extra[field] = m[field]
        if m["name"] in existing:
            # Always update URL and accepted_statuscodes to ensure they stay in sync
            api.edit_monitor(existing[m["name"]]["id"], url=m["url"], **extra)
            print(f"  updated {m['name']} -> {m['url']} (accepted={extra['accepted_statuscodes']})")
            continue
        api.add_monitor(type=MonitorType.HTTP, name=m["name"], url=m["url"], interval=60, **extra)
        print(f"  added {m['name']} -> {m['url']}")

    # --- Prune stale monitors ---
    # Declarative reconciliation: anything left in Kuma that isn't declared above (e.g. a
    # decommissioned service's monitor, like the old Gotify check) gets removed, so retiring
    # a service from MONITORS actually retires it here too instead of leaving a permanently-red
    # orphan on the public status page.
    keep_names = {m["name"] for m in MONITORS} | {PUSH_MONITOR_NAME}
    for name, mon in existing.items():
        if name not in keep_names:
            api.delete_monitor(mon["id"])
            print(f"  removed stale monitor '{name}' (id={mon['id']}, no longer declared)")

    # --- Public status page ---
    # ☠️ **不能直接拿 add 之后的 get_monitors() 去拼状态页。** 客户端那份监控列表由
    # 服务端推事件填充，`add_monitor()` 返回时新监控还没进去 —— 于是 publicGroupList
    # 会**漏掉本次新增的那几条**，状态页因此「落后一次运行」。
    #
    # 2026-08-23 实测到全过程：加 Blog/Playgrounds/Home Stack 三条，ArgoCD 的 PostSync
    # hook 报 Succeeded、日志三条 add 全绿、集群里 ConfigMap 也是新的，**可状态页上一条
    # 都没有**；而同一次运行却把上一次（08-18）新增的 Multica 补了上去 —— 同一种滞后。
    # 症状之坏在于：监控其实在跑、告警也会响，只是公开状态页上「看不见它们」，
    # 日志里没有任何异常可查（三条都是绿的 `added`）。
    #
    # 所以这里改成「等到所有声明的监控都出现在服务端返回里再存状态页」。
    # 等不到就**响亮地警告但不失败**：本脚本是 PostSync hook，失败会让整个 App 的
    # sync 失败，而「状态页少一条」远不值那个代价 —— 且下一次运行会自愈。
    expected_names = {m["name"] for m in MONITORS} | {PUSH_MONITOR_NAME}
    monitors_now, missing = [], expected_names
    for attempt in range(1, 7):
        monitors_now = api.get_monitors()
        missing = expected_names - {m["name"] for m in monitors_now}
        if not missing:
            break
        print(f"  status page: 服务端还没返回 {sorted(missing)}，重取 {attempt}/6")
        time.sleep(2)
    if missing:
        print(f"WARNING: 状态页可能漏掉 {sorted(missing)}（下次运行会自愈）", file=sys.stderr)

    monitor_entries  = [{"id": m["id"], "sendUrl": False} for m in monitors_now]
    existing_pages   = {p["slug"] for p in api.get_status_pages()}

    if STATUS_PAGE_SLUG not in existing_pages:
        api.add_status_page(slug=STATUS_PAGE_SLUG, title=STATUS_PAGE_TITLE)
        print(f"Status page '{STATUS_PAGE_SLUG}' created.")

    api.save_status_page(
        slug=STATUS_PAGE_SLUG,
        title=STATUS_PAGE_TITLE,
        description="Real-time status of Homelab services",
        theme="auto",
        published=True,
        showTags=False,
        domainNameList=[STATUS_PAGE_DOMAIN],
        customCSS="",
        footerText="",
        showPoweredBy=False,
        publicGroupList=[{
            "name": "Services",
            "weight": 1,
            "monitorList": monitor_entries,
        }],
    )
    print(f"Status page updated: https://{STATUS_PAGE_DOMAIN}")

    api.disconnect()
    print("Provisioning complete.")
---
# ArgoCD PostSync hook：每次 sync 后运行，重新校准 uptime-kuma monitors(脚本幂等)。
# 改 MONITORS 后 git push → ArgoCD 同步 → 此 hook 自动 reprovision(贴合 CLAUDE.md 意图)。
# hook-delete-policy: 成功即删 + 下次创建前先删;失败则保留 Job 供排查并使 sync 标记失败。
# 集群已纳入 homelab ArgoCD(2026-06-04);亦可手动 kubectl apply -f 跑。
apiVersion: batch/v1
kind: Job
metadata:
  name: uptime-kuma-provisioner
  namespace: personal-services
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provisioner
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            # 2026-08-05: uptime-kuma-api==1.2.1 → uptime-kuma-api-v2==1.0.3。
            # 前者官方只支持 Kuma 1.21.3-1.23.2 且项目已停更，实测打 2.5.0 时
            # add_monitor(HTTP) 直接报 SQL 列不匹配、save_status_page() 报 KeyError:'incident'
            # —— 而本 Job 是 ArgoCD PostSync hook，它失败会让整个 App sync 失败。
            # fork（import 名相同，drop-in）实测对 2.5.0 全部调用面通过。
            - pip install --quiet uptime-kuma-api-v2==1.0.3 && python /scripts/provision.py
          env:
            - name: UPTIME_KUMA_URL
              value: "http://uptime-kuma.personal-services.svc:3001"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-admin
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-admin
                  key: password
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-admin
                  key: telegram_bot_token
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: uptime-kuma-provisioner
