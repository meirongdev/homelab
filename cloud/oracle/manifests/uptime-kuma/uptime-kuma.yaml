---
# ⚠️ 2026-08-05 v1→v2 升级：**换了新 PVC 名**（原 uptime-kuma-data）。
# v1(1.23.17) 的 kuma.db 有 462MB / 289 万条心跳，v2 首启会做一次不可中断的
# Aggregate Table 迁移（官方文档：中断就得从备份恢复），而历史数据本身不需要留。
# 故按"全新安装 + provisioner 重建配置"走：换名 = 拿到干净卷，且**旧卷原样留着**
# 可随时改回来回滚。旧的 uptime-kuma-data PVC 带 Prune=false，ArgoCD 不会删它，
# 确认新实例稳定后手工 `kubectl delete pvc uptime-kuma-data` 收回节点磁盘。
# 备份归属不用改：备份脚本用 /localpath/*uptime-kuma-data* glob、H4 用子串匹配，
# 新名字含旧名字 → 两边自动覆盖。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data-v2
  namespace: personal-services
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: personal-services
  labels:
    app: uptime-kuma
  annotations:
    # RollingUpdate->Recreate migration: ArgoCD's apply can't drop the API-defaulted
    # spec.strategy.rollingUpdate block (fails validation), so replace (PUT) the object.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  # Single-writer RWO PVC (uptime-kuma-data, SQLite). Default RollingUpdate would
  # run a 2nd pod on the same volume; Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      # Override DNS to avoid Tailscale/OracleVCN search domain timeouts.
      # dnsPolicy: None + explicit dnsConfig fully replaces the generated resolv.conf
      # so taild*.ts.net and *.oraclevcn.com search domains are NOT inherited.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.53.0.10   # oracle-k3s CoreDNS ClusterIP
        searches:
          - personal-services.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      initContainers:
        # ⚠️ 没有这个 init，v2 全新安装会**卡在交互式建库页**：实测日志停在
        # `SETUP-DATABASE ... Waiting for user action...`，要人去 Web UI 上点选
        # SQLite/MariaDB。而 `/` 在该状态下同样返回 302，探针一样过 —— 于是 Pod
        # 显示 Ready 但服务其实不可用，provisioner 随后 login 失败。
        # v2 读 data/db-config.json 决定数据库类型（server/database.js readDBConfig），
        # 没有对应的环境变量可用，只能预置文件。存在则不覆盖（幂等）。
        - name: seed-db-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              f=/app/data/db-config.json
              if [ -s "$f" ]; then
                echo "db-config.json 已存在，保持原样:"; cat "$f"
              else
                printf '{\n    "type": "sqlite"\n}\n' > "$f"
                echo "已写入 db-config.json:"; cat "$f"
              fi
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: uptime-kuma
          # 2026-08-05: :1 → :2.5.0。原 `:1` 实际是 1.23.17（v1 末版，2025-10-20 后
          # 不再更新），v1 线 EOL，带 liquidjs RCE(CVE-2026-45618, CVSS 10.0)等 npm CVE。
          # 实测 2.5.0 内 liquidjs 10.26.0(=修复版)、fast-xml-parser 5.8.0(>修复版)。
          # 钉具体版本而非 `:2` —— 这次迁移够敏感，版本要在 git 里看得见。
          # ⚠️ 不用 -rootless 变体：官方迁移文档明确 rootless 在 v1→v2 会有启动问题。
          #
          # ⚠️ 必须是 **-slim**（2026-08-05 实测定性，别改回裸 :2.5.0）：
          # v2 的裸镜像换成 Debian 12 底并**内置 chromium + mariadb-server**，实测
          # 裸 :2.5.0 报 **121 条 Critical**（chromium/chromium-common 各 51 = 102 条，
          # mariadb 系 12 条，其余 mesa/GL），而 v1 只有 5 条 —— 升级反而把
          # TrivyImageCriticalVulnerabilities 从 73 推到 189。
          # -slim 实测 **8 条**（其中 6 条已在 trivy ignoreFile：stdlib/tar/grpc/protobufjs，
          # 余 2 条 libgnutls30 见 values/trivy-operator-oracle.yaml 的豁免理由）。
          # 两个变体逐项比对过：**只差 chromium**（ping/curl 都在），app 版本同为 2.5.0，
          # liquidjs 10.26.0 / fast-xml-parser 5.8.0 / protobufjs 7.2.6 与裸镜像完全一致
          # → 丢掉的只有 "Real Browser" 监控类型，本实例 16 个监控是 15 http + 1 push，
          # 且 db-config.json 为 sqlite（内置 mariadb-server 同样从未启用），故不受影响。
          # 若将来要用 Real Browser 监控，得换回裸镜像并连带接受 chromium 那 102 条。
          image: louislam/uptime-kuma:2.5.0-slim
          ports:
            - containerPort: 3001
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            # Oracle Cloud VMs have no IPv6 internet. Cloudflare domains return AAAA
            # records which Node.js/curl prefers by default, causing 48s timeouts.
            # Force DNS to resolve to IPv4 so monitors reach homelab services reliably.
            - name: NODE_OPTIONS
              value: "--dns-result-order=ipv4first"
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
      # ⚠️ push-shim(nginx POST→GET 边车)已于 2026-08-05 随 v2 升级一并删除。
      # 它存在的唯一理由是 v1 的推送端点是 `router.get("/api/push/:token")`、只收 GET，
      # 而 Alertmanager 的 webhook 只会 POST。v2 改成了 `router.all(...)`
      # （server/routers/api-router.js），实测 POST /api/push/<token> 直接返回 200、
      # 未知 token 返回 404 —— 边车成了纯粹的死重，顺带少一个镜像的 CVE 面。
      # 网关侧对应删掉了 /api/push → 3002 的那条 rule（见 base/gateway.yaml）。
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data-v2
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: personal-services
spec:
  type: ClusterIP
  selector:
    app: uptime-kuma
  ports:
    - port: 3001
      targetPort: 3001
      name: http
    # 3002/push-shim 已随边车一并删除（v2 的 /api/push 原生收 POST），见 Deployment 注释。
