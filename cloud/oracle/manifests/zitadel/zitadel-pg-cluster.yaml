# CNPG Cluster —— 目标库,取代冻结的 bitnamilegacy/postgresql:15.4.0（evolution-roadmap Phase C）。
# 2026-07-18 起并行部署验证；ZITADEL 仍指向旧库直到 cutover（单独一步，见 decisions/ 记录）。
# 单实例：无 HA 意义（单人 homelab，母文档结论），不过度工程。
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-pg
  namespace: zitadel
spec:
  instances: 1
  # 2026-08-04: 17.6 → 17.10-standard-bookworm。裸 `17.6` tag 是 **bullseye(deb11)** 底,
  # 带 4 条 CVE-2022-37454(XKCP SHA-3 缓冲区溢出, CVSS 9.8, 来自 python3.9)+ libgnutls30
  # 两条。实测新镜像:debian 12.15、libgnutls30 3.7.9-2+deb12u7(=修复版)、**已无 python3.9**
  # → 6 条 Critical 全消。写 `-standard-` 而非 `-minimal-` 是为保住裸 tag 原有的扩展集合。
  # 同 major(17)内的 minor 升级,CNPG 滚动重启单实例即可;instances:1 → 期间 zitadel 短暂断库。
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-standard-bookworm

  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      # 复用现有 zitadel-pg-app-secret（username=zitadel，密码=Vault secret/homelab/zitadel
      # db-password）——cutover 后 ZITADEL 自己的 ExternalSecret 无需改密码，只改 Host。
      secret:
        name: zitadel-pg-app-secret

  enableSuperuserAccess: true
  superuserSecret:
    name: zitadel-pg-superuser-secret

  # 2026-08-05 缩容到 12GB 时加。SSO 的库被驱逐 = 全站登录挂，值得最高一档。
  # ⚠️ ZITADEL 应用本身**设不了**——chart 9.34.1 没有 priorityClassName 这个 values 键
  # （逐键确认过），塞进去会被静默忽略。它留在 priority 0，靠 meirong-bulk(-10)
  # 把可牺牲的应用压到它下面来保证相对次序。
  priorityClassName: meirong-critical

  storage:
    storageClass: local-path
    size: 8Gi

  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 512Mi
