# （本文件的 Namespace 已于 2026-08-03 拆到 namespace.yaml —— 理由见该文件头注）
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        masterkey: "{{ .masterkey }}"
  data:
    - secretKey: masterkey
      remoteRef:
        key: secret/homelab/zitadel
        property: master-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-config
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zitadel-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        config-yaml: |
          Database:
            Postgres:
              User:
                Password: "{{ .db_password }}"
              Admin:
                Password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: secret/homelab/zitadel
        property: db-password
---
# DB 历史:2026-07-06 迁来时用 bitnami PG(bitnamilegacy 冻结镜像,安全债);
# 2026-07-18 经 pg_dump/pg_restore 迁至 CNPG 集群 zitadel-pg(见 zitadel-pg-cluster.yaml),
# 旧 zitadel-db HelmChart + zitadel-postgres-auth ExternalSecret 同日退役移除。
# 完整记录:decisions/ + docs/plans/architecture/2026-07-07-tech-debt-and-evolution.md Phase C。
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: zitadel
  namespace: kube-system
spec:
  repo: https://charts.zitadel.com
  chart: zitadel
  # 2026-08-04: 9.24.0(app v4.10.1) → 9.34.1(app v4.13.1)。动因是 CVE-2026-29191
  # (CVSS 9.3, /saml-post 端点 XSS → 1-click 账号接管) —— 公网身份面上唯一真正紧急的
  # CVE,修复版 4.12.0。同时带走 pgx v5.7.6 的 CVE-2026-33815/33816(v4.13.1 已用 pgx v5.9.1)。
  # 刻意**不**升到 chart 10.x：那是 chart 大版本(values schema 可能改),9.34.1 是 9 系
  # 最后一版,已逐键核对本文件用到的 8 个 values 路径全部存活(masterkeySecretName /
  # configSecretName / configmapConfig / resources / ingress.enabled / login.resources /
  # login.ingress.enabled / login.service.appProtocol)。
  # ⚠️ 升级会重跑 zitadel-init / zitadel-setup Job 做 DB 迁移,期间 auth.meirong.dev 短暂不可用。
  version: 9.34.1
  targetNamespace: zitadel
  createNamespace: true
  valuesContent: |-
    zitadel:
      masterkeySecretName: zitadel-masterkey
      configSecretName: zitadel-config
      configmapConfig:
        ExternalSecure: true
        ExternalDomain: auth.meirong.dev
        ExternalPort: 443
        TLS:
          Enabled: false
        Database:
          Postgres:
            Host: zitadel-pg-rw
            Port: 5432
            Database: zitadel
            MaxOpenConns: 20
            MaxIdleConns: 10
            MaxConnLifetime: 30m
            MaxConnIdleTime: 5m
            User:
              Username: zitadel
              SSL:
                Mode: disable
            Admin:
              Username: postgres
              SSL:
                Mode: disable
    # PSA restricted 达标所需的三个字段（2026-08-10 加）。chart 默认的 securityContext 只给
    # runAsNonRoot/runAsUser/readOnlyRootFilesystem/privileged 四项，**缺** restricted 要求的
    # allowPrivilegeEscalation:false / capabilities.drop[ALL] / seccompProfile —— 实测
    # `kubectl label ns zitadel …enforce=restricted --overwrite --dry-run=server` 会列出 4 个
    # 违规 Pod（chart 渲的那批；zitadel-pg 由 CNPG 渲，四项本就齐全）。
    #
    # ⚠️ 顺序不能反：**先有这段，再把 ns 翻 restricted**。反过来做当下毫无感觉（PSA 不动
    # 运行中的 Pod），但下一次 chart 升级时 zitadel-init / zitadel-setup 两个 Job 会被挡在
    # 准入外，表现为「升级卡在 DB 迁移中途」——那是最难收拾的时刻。
    #
    # 这两个键是 chart 全局键，实测（helm template 9.34.1）会落到**全部 9 个容器**上：
    # zitadel · login(含 wait-for-zitadel init) · init · setup 的 4 个容器 · cleanup。
    # 不是 login.startupProbe.timeoutSeconds 那种写了被静默丢弃的键——改这里仍建议先渲一遍。
    # 卷类型也已核过（configMap/secret/emptyDir/projected），都在 restricted 白名单内。
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    # 2026-08-10: CPU request 50m→10m。实测 7d p95 仅 8m —— ZITADEL 稳态几乎不吃 CPU
    # （登录是低频突发，limit 500m 足够 burst）。oracle allocatable 只有 1800m，
    # 补完 BestEffort 后 requests 一度 83%，这类纯占位的 request 是首要回收对象。
    resources:
      requests:
        cpu: 10m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 384Mi
    ingress:
      enabled: false
    login:
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          # 2026-08-09: 250m → 500m。见下面探针注释:chart **不允许**改
          # timeoutSeconds(恒为 API 默认 1s),所以让它在争抢时也能 1 秒内答上探针的
          # 唯一杠杆就是给足 CPU。requests 不动(25m)→ 不占节点可调度额度。
          cpu: 500m
          # 2026-08-24: 192Mi→320Mi。7d 峰值 162Mi = **84%**，且是本轮 KRR 分诊里
          # 唯一「基线在爬」的形状：一周内空闲底噪 96→106Mi、尖峰 131→145→160Mi。
          # （其余 >80% 的都是 08-18 / 08-22 两次一次性尖峰，不动。）
          # ⚠️ 这不是 grafana 那种 GOMEMLIMIT 随 limit 联动的假象（见
          #   k8s/helm/values/kube-prometheus-stack.yaml 的 2026-08-24 更正）——
          #   zitadel-login 是 Next.js/Node，没有把 limit 接成 GC 目标的机制，
          #   抬 limit 就是真的多给头寸。抬完峰值占比约 51%。
          # requests 不动（96Mi）：底噪 ~105Mi 只略高于 request，不值得在 oracle
          #   内存 requests 73% 的账本上再占 32Mi。
          memory: 320Mi
      # ☠️ 2026-08-09:补 startupProbe + 放宽 liveness。zitadel-login 累计重启 27 次,
      # 其中 08-09 00:33 那半小时内连崩 6 次 —— 全部挤在节点重启之后。
      # 判据:lastState 是 exitCode **0** / reason=Completed。这不是"正常退出",
      # 是 Next.js 优雅处理了 liveness 杀进程发来的 SIGTERM(uptime-kuma 那次记的是
      # 143,因为它不处理 SIGTERM)。**别被 exit 0 骗过去以为应用是自己退的。**
      # 原配置:无 startupProbe、liveness initialDelaySeconds=0 + periodSeconds=5
      # × failureThreshold=3 → 容器一起来 15 秒内就可能被杀;而节点重启后整机争抢,
      # 250m 上限下 Next.js 答不上 1 秒超时的探针。应用本身 "Ready in 2.5s",
      # 不是启动慢,是探针太急。
      #
      # ⚠️ **`timeoutSeconds` 写了也没用**(2026-08-09 用 `helm template` 实测):
      # chart 9.34.1 的模板只渲染 initialDelaySeconds / periodSeconds /
      # failureThreshold 三个键,timeoutSeconds **被静默丢弃**,探针恒为 API 默认 1s。
      # 这是本次最关键的旋钮却拧不动 —— 所以改用「多容忍几次」+「给足 CPU」两条路
      # 绕过去。要改这段前先 `helm template` 渲一遍确认键真的落地,别照 values 猜。
      startupProbe:
        # 存在期间 liveness/readiness 被挂起。45×2s=90s 冷启预算(实测 2.5s,~36x 余量)。
        enabled: true
        periodSeconds: 2
        failureThreshold: 45
      livenessProbe:
        # 6×10s=60s 连续失败才杀(原为 3×5s=15s)。节点重启的争抢风暴要持续整整一分钟
        # 才会误杀,而正常抖动几秒就过去了。
        enabled: true
        periodSeconds: 10
        failureThreshold: 6
      readinessProbe:
        # 保持不变:readiness 失败只是摘出 Service,不重启容器,本来就该敏感。
        enabled: true
        periodSeconds: 5
        failureThreshold: 3
      ingress:
        enabled: false
      service:
        appProtocol: ""
    # ☠️ 2026-08-30 —— 升 k3s 时被这个咬到，且**每次升 k3s 补丁都会复发**。
    # chart 的 tools.kubectl.image.tag 默认留空，其语义是「自动取**集群的 k8s 版本**」
    # （values 注释原话：It should be left empty to automatically default to the
    # Kubernetes cluster version）。而 docker.io/alpine/k8s 的 tag 是人工发布的，
    # **跟不上 k8s 的补丁节奏**：集群升到 v1.35.8 的当天，alpine/k8s 最新的 1.35.x
    # 只到 1.35.6 → setup Job 的 3 个 machinekey/PAT 容器全部 ImagePullBackOff
    # （"1.35.8: not found"）。
    #
    # 失败形态值得记：ZITADEL **本体不受影响**（主 pod 没重启、auth.meirong.dev 照常
    # 302），挂的只是 k3s 重启后 helm-controller 重新 reconcile 拉起的 setup Job ——
    # 也就是说 SSO 看着好好的，一个 Job 在后台无限重试。不主动看 pod 就发现不了。
    #
    # 因此**显式钉住**，不再跟随集群版本。升级规则：kubectl 与集群同 minor 即可
    # （k8s 支持 ±1 minor 偏移），所以升 k8s minor 时才需要动这里，升补丁不用。
    # ⚠️ oracle 是 arm64：换 tag 前必须确认该 tag 是**多架构 manifest list**
    #    （1.35.6 已核：linux/amd64 + linux/arm64）。
    tools:
      kubectl:
        image:
          tag: "1.35.6"
