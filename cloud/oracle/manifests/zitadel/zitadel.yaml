# （本文件的 Namespace 已于 2026-08-03 拆到 namespace.yaml —— 理由见该文件头注）
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        masterkey: "{{ .masterkey }}"
  data:
    - secretKey: masterkey
      remoteRef:
        key: secret/homelab/zitadel
        property: master-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-config
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zitadel-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        config-yaml: |
          Database:
            Postgres:
              User:
                Password: "{{ .db_password }}"
              Admin:
                Password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: secret/homelab/zitadel
        property: db-password
---
# DB 历史:2026-07-06 迁来时用 bitnami PG(bitnamilegacy 冻结镜像,安全债);
# 2026-07-18 经 pg_dump/pg_restore 迁至 CNPG 集群 zitadel-pg(见 zitadel-pg-cluster.yaml),
# 旧 zitadel-db HelmChart + zitadel-postgres-auth ExternalSecret 同日退役移除。
# 完整记录:decisions/ + docs/plans/architecture/2026-07-07-tech-debt-and-evolution.md Phase C。
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: zitadel
  namespace: kube-system
spec:
  repo: https://charts.zitadel.com
  chart: zitadel
  # 2026-08-04: 9.24.0(app v4.10.1) → 9.34.1(app v4.13.1)。动因是 CVE-2026-29191
  # (CVSS 9.3, /saml-post 端点 XSS → 1-click 账号接管) —— 公网身份面上唯一真正紧急的
  # CVE,修复版 4.12.0。同时带走 pgx v5.7.6 的 CVE-2026-33815/33816(v4.13.1 已用 pgx v5.9.1)。
  # 刻意**不**升到 chart 10.x：那是 chart 大版本(values schema 可能改),9.34.1 是 9 系
  # 最后一版,已逐键核对本文件用到的 8 个 values 路径全部存活(masterkeySecretName /
  # configSecretName / configmapConfig / resources / ingress.enabled / login.resources /
  # login.ingress.enabled / login.service.appProtocol)。
  # ⚠️ 升级会重跑 zitadel-init / zitadel-setup Job 做 DB 迁移,期间 auth.meirong.dev 短暂不可用。
  version: 9.34.1
  targetNamespace: zitadel
  createNamespace: true
  valuesContent: |-
    zitadel:
      masterkeySecretName: zitadel-masterkey
      configSecretName: zitadel-config
      configmapConfig:
        ExternalSecure: true
        ExternalDomain: auth.meirong.dev
        ExternalPort: 443
        TLS:
          Enabled: false
        Database:
          Postgres:
            Host: zitadel-pg-rw
            Port: 5432
            Database: zitadel
            MaxOpenConns: 20
            MaxIdleConns: 10
            MaxConnLifetime: 30m
            MaxConnIdleTime: 5m
            User:
              Username: zitadel
              SSL:
                Mode: disable
            Admin:
              Username: postgres
              SSL:
                Mode: disable
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 384Mi
    ingress:
      enabled: false
    login:
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          cpu: 250m
          memory: 192Mi
      ingress:
        enabled: false
      service:
        appProtocol: ""
