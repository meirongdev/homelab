# ⚠️ Namespace 单独成文件，**不要**把它塞回其他清单里。
# 2026-08-03 事故教训：`personal-services` 的 Namespace 当时内嵌在 calibre-web.yaml
# 顶部。calibre 迁 oracle 时 `git rm` 掉那个文件 → ArgoCD prune 掉 Namespace →
# **级联删除了同 ns 下毫不相关的 open-notebook 全部数据**（PVC 上的 Prune=false
# 护栏无效，因为被 prune 的是 ns 不是 PVC）。
# 复盘见 docs/records/2026-08-03-namespace-prune-cascade.md
# ZITADEL (SSO) — migrated from homelab 2026-07-06 (fault-domain separation).
# homelab 侧那份清单（k8s/helm/manifests/zitadel.yaml）已随 cutover 删除（commit 1186f6c），
# 本文件是唯一副本。ExternalSecrets read secret/homelab/zitadel (SAME source → byte-identical
# masterkey; a copy would risk making every DB-encrypted key undecryptable → total SSO break).
# ExternalDomain stays auth.meirong.dev; PG data migrated via pg_dump so instance/keys/apps
# preserved（DB 现为 CNPG zitadel-pg，见 zitadel-pg-cluster.yaml，就在本 ns 里，不在 databases）。
apiVersion: v1
kind: Namespace
metadata:
  name: zitadel
  labels:
    # PSA restricted —— 2026-08-10 分两步走完（ROADMAP #13 已关闭）。
    #
    # 起点很糟：**本文件此前一个 PSA 标签都没有**，于是吃 PSA 内置默认 enforce=privileged
    # 且 warn/audit 全空。实测（server dry-run）一个 hostPID+hostNetwork+privileged+hostPath:/
    # 的 Pod 在本 ns 能建成、且零 warning —— 全 oracle 唯一连审计线索都没有的 ns，
    # 偏偏装着 SSO 与身份库 zitadel-pg（Cluster 就在本 ns，不在 databases）。
    # 也没有任何东西兜底：`just harden-psa` 只跑 k3s-homelab 上下文，集群没配
    # AdmissionConfiguration 默认档，当时 CI 也没有对应规则（现已补 H5）。
    #
    # 第一步先落 baseline（零风险：现存 Pod 无 hostNetwork/hostPID/hostPath/privileged），
    # 第二步在 zitadel.yaml 补齐 securityContext 三项后翻 restricted。
    # 翻之前照例先问准入本人，而不是读 values 猜：
    #   kubectl label ns zitadel pod-security.kubernetes.io/enforce=restricted --overwrite --dry-run=server
    # 补齐前它点名 4 个违规 Pod，补齐后零 warning —— 才真正翻的。
    #
    # ☠️ **zitadel.yaml 里那段 securityContext 现在是承重墙**：本 ns 是 restricted，一旦那段
    # 被删/被 chart 大版本升级冲掉，下一次 helm upgrade 的 zitadel-init / zitadel-setup Job
    # 会被准入直接拒掉，症状是"升级卡在 DB 迁移中途"——而**运行中的 Pod 毫无异样**，
    # 因为 PSA 只在创建/更新时评估。改那段前先 `helm template` 渲一遍再 dry-run 问一次准入。
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
