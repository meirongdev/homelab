# ⚠️ Namespace 单独成文件，**不要**把它塞回其他清单里。
# 2026-08-03 事故教训：`personal-services` 的 Namespace 当时内嵌在 calibre-web.yaml
# 顶部。calibre 迁 oracle 时 `git rm` 掉那个文件 → ArgoCD prune 掉 Namespace →
# **级联删除了同 ns 下毫不相关的 open-notebook 全部数据**（PVC 上的 Prune=false
# 护栏无效，因为被 prune 的是 ns 不是 PVC）。
# 复盘见 docs/records/2026-08-03-namespace-prune-cascade.md
# ZITADEL (SSO) — migrated from homelab 2026-07-06 (fault-domain separation).
# homelab 侧那份清单（k8s/helm/manifests/zitadel.yaml）已随 cutover 删除（commit 1186f6c），
# 本文件是唯一副本。ExternalSecrets read secret/homelab/zitadel (SAME source → byte-identical
# masterkey; a copy would risk making every DB-encrypted key undecryptable → total SSO break).
# ExternalDomain stays auth.meirong.dev; PG data migrated via pg_dump so instance/keys/apps
# preserved（DB 现为 CNPG zitadel-pg，见 zitadel-pg-cluster.yaml，就在本 ns 里，不在 databases）。
apiVersion: v1
kind: Namespace
metadata:
  name: zitadel
  labels:
    # PSA baseline —— 2026-08-10 补。**此前本文件一个 PSA 标签都没有**，于是吃 PSA 内置
    # 默认：enforce=privileged 且 warn/audit 全空。实测（server dry-run）一个
    # hostPID+hostNetwork+privileged+hostPath:/ 的 Pod 在本 ns 能建成、且零 warning ——
    # 全 oracle 唯一连审计线索都没有的 ns，偏偏装着 SSO 与身份库 zitadel-pg。
    # 没有别的东西兜底：`just harden-psa` 只跑 k3s-homelab 上下文且列表里没有 zitadel，
    # 集群也没配 AdmissionConfiguration 默认档。
    #
    # baseline 是零风险档：现存 5 个 Pod（zitadel / login / init / setup / zitadel-pg）
    # 无 hostNetwork/hostPID/hostPath/privileged，
    # `kubectl label ns zitadel …enforce=baseline --overwrite --dry-run=server` 无任何 warning。
    #
    # ⚠️ **暂不上 restricted**：同一条 dry-run 打 restricted 会列出 4 个违规 Pod（chart 渲的
    # 那批缺 allowPrivilegeEscalation:false / capabilities.drop[ALL] / seccompProfile；
    # zitadel-pg 由 CNPG 渲，四样齐全，已达标）。顺序**必须**是先补 zitadel.yaml 的
    # valuesContent（securityContext + podSecurityContext，chart 9.34.1 实测会落到全部
    # 9 个容器上，不是 timeoutSeconds 那种被静默丢弃的键）→ 再翻 enforce。
    # 反过来做当下无感（PSA 不动运行中的 Pod），但下次 chart 升级时 zitadel-init /
    # zitadel-setup Job 会被挡在准入外 → 升级卡在 DB 迁移中途。见 ROADMAP 开放项 #13。
    #
    # warn/audit 直接给 restricted：**在此期间每次建 Pod 都会打 restricted warning，这是
    # 刻意的**（那 3 个缺口的持续可见性），别靠把标签降回 baseline 来"消噪音"。
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
