---
# personal-services 命名空间的防御性护栏 —— 2026-08-02 随 calibre 从 homelab 迁入。
#
# 为什么必须跟着搬：这组护栏当初就是为 **ebook-sync-monitor** 加的。
# 早年那个 CronJob 没有 concurrencyPolicy、没有 history limit，泄漏了 92 个卡住的
# Job pod，把单节点顶过 110 pod 上限，**阻塞了全集群的新调度**。CronJob 本身已加固，
# 但护栏让「再次失控」不可能打垮节点 —— 在 namespace 边缘就被拒绝。
#
# ⚠️ 迁移时最容易漏的一类东西：风险工作负载搬走了，护栏却留在原地。
# 迁移前 oracle 的 personal-services **没有任何 ResourceQuota/LimitRange**（实测确认）。
#
# 本 ns 在 oracle 上的常驻 pod 比 homelab 多（it-tools/squoosh/bentopdf/timeslot/
# trends/excalidraw×2/uptime-kuma + calibre ≈ 11），30 仍有充足余量。
# 只限制 pod 数与 Job 对象数，**不设 cpu/memory 配额** —— 那会要求每个容器都声明
# requests，是另一个量级的约束，不是这里要解决的问题。
apiVersion: v1
kind: LimitRange
metadata:
  name: personal-services-defaults
  namespace: personal-services
spec:
  limits:
    # 没声明 resources 的容器拿到合理默认值，而不是被当成 0-request / 无上限。
    # 典型受益者是 `timeslot`：本仓库之外的手工 Helm release（chart timeslot-0.1.0，
    # 无 ArgoCD tracking-id），自己没写 resources。2026-08-05 缩容到 2 OCPU 时
    # 默认值 50m→15m：节点 allocatable 只有 1800m（不是 2000m，k3s 预留 200m），
    # 一个没人认领的默认值不该吃掉其中 2.8%。
    #
    # ⚠️ **LimitRange 只在准入时注入，不追溯已存在的 Pod**（2026-08-10 修正）：
    # 本文件此处原先断言「timeslot 就是靠这条拿到 50m/15m 的」，实测是**错的** ——
    # timeslot 的 Pod 建于 2026-03-07，比本 LimitRange（2026-08-02）早 5 个月，
    # 从没经过带这条规则的准入，一直是 `resources: {}` 的 **BestEffort**
    # （0 request、无上限），比注释担心的「吃掉 2.8%」更糟：BestEffort 在 kubelet
    # 驱逐排序里恒排第一档，排在标了 `bulk`(-10) 的应用前面。
    # 已 `kubectl -n personal-services rollout restart deploy/timeslot` 补上，
    # 现为 Burstable（15m/64Mi + 500m/256Mi，实测确认）。
    # 教训：新增/修改 LimitRange 后，要对该 ns 里**早于它**的 Deployment 逐个重启，
    # 否则护栏只对新建 Pod 生效，而 `kubectl get limitrange` 看起来一切正常。
    # 查法：`kubectl -n <ns> get pods -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass`
    # 里任何 BestEffort 都是漏网的。
    - type: Container
      defaultRequest:
        cpu: 15m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: personal-services-object-caps
  namespace: personal-services
spec:
  hard:
    # 非终态 pod。稳态约 12 个；30 是宽裕余量，但远低于节点 110 上限，
    # 失控的控制器会被卡在这里而不是饿死整个集群。
    pods: "30"
    # Job 对象总数（任何状态）。当年泄漏的是 92 个累积 Job，这条在最早的点上拦住它。
    # 2026-08-05: 15 → 20。readlist 上线把本 ns 的 CronJob 从 3 个
    # （ebook-sync-monitor / calibre-metadata-updater / open-notebook-ingest）
    # 加到 6 个（+ readlist-snapshot/ingest/score）。算一遍最坏情况：
    #   稳态 5（实测）+ readlist 稳态 3 = 8；六个 CronJob 全失败时 ≈ 11；
    #   而首次部署要手动建 4 个引导 Job（见 runbooks/readlist-bootstrap.md）→ 15，
    #   **正好顶到旧上限被拒**。20 留出余量，且仍远低于节点 110 pod 上限——
    #   失控的控制器照样卡在这里，而不是饿死整个集群。
    count/jobs.batch: "20"
