---
# Calibre-Web-Automated —— 2026-08-02 从 homelab 迁入 oracle-k3s。
#
# 动机是磁盘：homelab 是 124GB 的笔记本 VM（迁移前已用 65%），书库 23GB + config
# 是那台机器上最大的单一数据集；oracle 有 194GB、迁移前只用了 39GB（其中 29GB 还是
# 容器镜像，全部 PVC 加起来才 1.3GB）。
#
# 镜像 digest 原样沿用 —— 已核实 sha256:4ff5be5c… 是**多架构 manifest list**
# （含 linux/arm64），不是 amd64 专属 digest，故 aarch64 的 oracle 可直接拉。
# （对照旧网关 oauth2-proxy 那个坑：那次 pin 的是单架构 digest。）
#
# ⚠️ NETWORK_SHARE_MODE=true / CWA_WATCH_MODE=poll 当年是为 NFS 加的。
# 2026-08-29 更正旧注释「迁 local-path 后已无必要」：NSM=true 如今是主动选择——
# 关掉它上游会每摄入一个文件就 chown -R 全库（no-op chown 也刷 ctime → restic
# 全库重读），详见下方 permission-fixer 容器的注释。poll 才是真·可清理遗产
# （local-path 上 inotify 可用），动不动均可。
#
# 迁移过程与取舍见 docs/plans/architecture/2026-08-02-homelab-to-oracle-workload-migration.md
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # migrated NFS→local-path 2026-07-06 (sqlite app.db/cwa.db fsync; Phase 2).
  # processed_books(11G) 一并迁；thumbnails(12k 小文件,可重建)未迁,calibre 会按需重建。
  name: calibre-web-automated-config-local
  namespace: personal-services
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # 书库迁 local-path（2026-07-11）：实际数据 24G，原静态 NFS PV 使 calibre 全家
  # 硬依赖 106 在线（07-08 106 宕机 3 天 → calibre-web Error / cronjob 卡死）。
  # RWO 在单节点集群上多 pod 共挂没有问题（RWO 是节点级语义）。
  # 冷备份：restic 夜备直接纳入书库目录 + vzdump 周备整 VM。
  # 迁移前快照保留于 192.168.50.106:/storage/calibre（未删）。
  name: calibre-books-local
  namespace: personal-services
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: personal-services
  labels:
    app: calibre-web
spec:
  # 迁移期曾短暂置 0 —— 让 23GB 书库与 config 落在静止的卷上再起。
  # ⚠️ 顺带记录一个既有性质：空卷上 disable-auto-convert init 容器必然失败
  #    （"no such table: cwa_settings"，它假定 cwa.db 已存在）——即**光靠 Git
  #    无法从零重建 calibre**，必须先恢复 config PVC。
  replicas: 1
  # SQLite (/config/cwa.db) is held with an exclusive write lock by the live
  # calibre-web container; a rolling update would let the new pod's
  # disable-auto-convert init container race the old pod for that lock.
  strategy:
    type: Recreate
    # Explicit null so server-side apply drops any prior rollingUpdate block
    # K8s rejects rollingUpdate when type=Recreate.
    rollingUpdate: null
  # ☠️ 默认值 10 会让 10 个 replicas=0 的历史 ReplicaSet 长期滞留，而
  #    trivy-operator 给每个 ReplicaSet 都建一份 exposedsecret/vulnerability 报告、
  #    **只重扫还有副本的那个**。于是 2026-08-30 给 slapdtest 私钥加的 path 豁免
  #    只让活着的 rs 归零，10 份旧报告永久停在豁免前的快照上 →
  #    `trivy_image_exposedsecrets` 恒 >0 → TrivyExposedSecretFound 每 30 分钟
  #    往 Telegram 推一条，永不自愈（records/2026-08-31-trivy-stale-replicaset-reports.md）。
  #    Recreate 策略本来也回滚不了，留 10 份历史无意义。
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
    spec:
      priorityClassName: bulk
      securityContext:
        fsGroup: 1000
        # 2026-08-29: 书库 PV 是 local 型 → kubelet 会做 fsGroup 属主管理，默认策略
        # Always = 每次 pod 重启都递归 chown/chmod 整个 ~24.5G 书库（kubelet 干的，
        # 无容器日志）→ 全部文件 ctime 刷新 → 当晚 restic 视全库 changed 整库重读，
        # 备份内存峰值 100–160Mi → 600–970Mi（节点重启 08-22×2/08-26/08-27 精确对应
        # 峰值晚 08-23/27/28）。OnRootMismatch = 卷根目录 gid/权限已符合预期就跳过。
        # ⚠️ kubelet 对"符合预期"的判断含目录 setgid 位（它扫完目录是 2777），所以
        # 下面两处 fixer 的 find 谓词必须用 -perm -775（至少含）而非 -perm 775
        # （精确等于），否则 fixer 把 2777 改回 0777 剥掉 setgid → 下次启动又判
        # "不匹配"再全量扫，两者打架。归因全文与备份侧数据见
        # backup/overlays/oracle/cronjob-patch.yaml 的 2026-08-29 注释。
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: disable-auto-convert
          image: python:3.11-slim
          command:
            - python3
            - -c
            - |
              import sqlite3, sys
              db_path = '/config/cwa.db'
              try:
                db = sqlite3.connect(db_path, timeout=30)
                cursor = db.cursor()
                cursor.execute("UPDATE cwa_settings SET auto_convert = 0;")
                db.commit()
                cursor.execute("SELECT auto_convert FROM cwa_settings;")
                result = cursor.fetchone()
                if not result or result[0] != 0:
                    print(f"[INIT] verification failed, auto_convert is {result}")
                    sys.exit(1)
                print(f"[INIT] auto_convert set to: {result[0]}")
                db.close()
              except Exception as e:
                print(f"[INIT] could not modify cwa.db: {e}")
                sys.exit(1)
          volumeMounts:
            - name: config
              mountPath: /config
        - name: fix-permissions-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -u
              MARKER=/library/.permissions-baseline-v1
              if [ -f "$MARKER" ]; then
                echo "[init] marker found — skipping full scan (~1900 books on NFS would cost ~90s)"
                echo "[init] permission-fixer sidecar will catch incremental drift within 30s"
                exit 0
              fi
              echo "[init] no marker — applying baseline permissions once..."
              # -perm -664/-775 = "至少含这些位"：别剥 kubelet fsGroup 扫描给目录加的
              # setgid（2777，含 -775），否则与 OnRootMismatch 打架（见 pod securityContext 注释）。
              # 664/2775 = 属组写：全库 gid 恒为 abc(1000)、web 进程 gid 也是 1000，
              # 属组写即可让 web 编辑书库，不必 world-writable（666/2777 是旧目标）。
              # ⚠️ dir 的 chmod 必须带 setgid 位（2775）：数字 chmod 会清掉特殊位，
              # 写 775 会把 2777 剥成 0775（2026-08-29 存量收紧时实测踩过）。
              find /library -type f ! -perm -664 -exec chmod 664 {} + 2>/dev/null || true
              find /library -type d ! -perm -775 -exec chmod 2775 {} + 2>/dev/null || true
              touch "$MARKER"
              echo "[init] baseline applied + marker placed"
          volumeMounts:
            - name: books
              mountPath: /library
      containers:
        - name: calibre-web
          image: crocodilestick/calibre-web-automated@sha256:4ff5be5cd6f18d91cc72bf316260d8c34c980f09a862372bc77d25c9ddb0efef
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Shanghai"
            - name: NETWORK_SHARE_MODE
              value: "true"
            - name: TRUSTED_PROXY_COUNT
              value: "1"
            - name: CWA_WATCH_MODE
              value: "poll"
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # startupProbe gates liveness/readiness until the app finishes its
          # slow NFS-backed cold start (~50s); allows up to 30×10s = 5min.
          startupProbe:
            httpGet:
              path: /login
              port: 8083
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          # timeoutSeconds defaults to 1s — far too tight for an NFS-backed
          # (NETWORK_SHARE_MODE=true) /login render. Under NFS latency spikes
          # the 1s default failed 5× and kubelet killed the container, causing
          # a chronic restart loop. 10s gives the render room; a true hang
          # (>5×30s) still triggers a restart.
          livenessProbe:
            httpGet:
              path: /login
              port: 8083
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /login
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /calibre-library
            - name: books
              mountPath: /cwa-book-ingest
              subPath: ingest
        # 2026-08-29 删除 log-exporter sidecar（`tail -F /config/calibre-web.log`）。
        # 它自始至终没产出过一行：该路径在本镜像里根本不存在（/config 下唯一的日志是
        # epub-fixer.log），而 `tail -F` 对不存在的文件配上 `2>/dev/null` 就是永久静默。
        # 实测 Loki 近 7 天：k8s_container_name="calibre-web" 1898 行、"log-exporter" 0 行。
        # 且它的前提也早已不成立 —— 引入时的理由是「linuxserver.io 镜像不输出 stdout」，
        # 但本镜像现在把应用日志（cps.py / cwa-* 服务）全打到 stdout，OTel 直接采得到。
        # ⚠️ 想给别的服务照搬「文件日志 + sidecar」模式前，先按
        # docs/reference/observability-otel-logging.md 模式 B 的「先验证再加」跑一遍：
        # 这个 sidecar 的坑就是加了之后没人验证过它真的在产日志。
        # Fixes permissions on files created by the cwa-ingest pipeline, which runs
        # as root and produces files that the web process (uid 1000) cannot edit.
        # ⚠️ 2026-08-29 核查：这不是可顺手删掉的 NFS 遗产，前提今天仍成立——
        #  ① ingest 仍以 root 跑（web 进程是 abc/1000），实测 umask 0022 → 无本容器时
        #    新书落盘 root:1000 644（group 只读，web 改不了内容）、新目录 2755（写不进）。
        #    08-24 摄入的书至今 uid 0，全靠本容器修成 664 才可编辑（属组写，见下）。
        #  ② 上游其实自带修复（ingest_processor.py set_library_permissions：每处理一个
        #    文件就在 finally 里 chown -R abc:abc 全库），但 NETWORK_SHARE_MODE=true
        #    会跳过它且无 chmod 兜底 —— 本容器就是在替被关掉的它干活。
        #  ③ 别用「关 NSM 换上游方案」退役本容器：那等于每摄入一本书 chown -R 一遍
        #    ~24.5G 书库，且实测属主不变的 no-op chown 也刷 ctime → 每次摄入当晚
        #    restic 全库重读（正是 fsGroupChangePolicy=OnRootMismatch 修掉的那类
        #    内存峰值）。本容器只 chmod 漂移的新文件，restic 只多读本来就要读的新书。
        #  ④ UMASK=000 让文件生来 666 也不通：本镜像没插桩 UMASK env
        #    （/etc/s6-overlay 里 grep 不到），设了不生效。
        #  退役条件 = 上游换机制（ingest 降权，或 NSM 模式补 chmod 兜底，盯 CWA
        #  release note）；届时同步处理 fix-permissions-init、securityContext 的
        #  fsGroup 注释、docs/reference/k8s-qos-resource-management.md 拿它举例那行。
        - name: permission-fixer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -u
              echo "[fix-perms] starting permission fixer loop"
              while true; do
                # -perm -664/-775（至少含）而非精确匹配：别剥 kubelet fsGroup 扫描给目录
                # 加的 setgid（2777，含 -775），否则与 OnRootMismatch 打架（见 securityContext 注释）。
                # 664/2775 = 属组写（web gid=1000=abc、全库 gid 恒为 abc）：让 web 可编辑即可，
                # 不必 world-writable。
                # ⚠️ dir 的 chmod 必须带 setgid 位（2775）：数字 chmod 会清特殊位，写 775
                # 会把 2777 剥成 0775（2026-08-29 存量收紧实测踩过，kubelet 判定即失效）。
                # 存量已于 2026-08-29 一次性收紧到 664/2775；fixer 只补缺位不降权。
                # -print 让 wc -l 数真实修过的路径：原写法数的是 chmod 的 stdout，恒为 0，
                # "fixed N files" 从没打印过，排障时会被误读成 "fixer 没干过活"。
                files=$(find /library -type f ! -perm -664 -print -exec chmod 664 {} + 2>/dev/null | wc -l)
                dirs=$(find /library -type d ! -perm -775 -print -exec chmod 2775 {} + 2>/dev/null | wc -l)
                if [ "$files" -gt 0 ] || [ "$dirs" -gt 0 ]; then
                  echo "[fix-perms] fixed $files files and $dirs directories"
                fi
                # 5 分钟一轮（2026-08-02 从 30s 上调）：全量递归扫整个库（实测 5870 文件
                # + 3866 目录），30s 一轮占空比约 50%，在 100m limit 下实测 CPU 节流
                # 91.6%，长期触发 CPUThrottlingHigh，还白白吃这台单节点笔记本的热预算。
                # 改 300s 后实测平均占用降到 0.0007 core。
                # 摄入后权限最多晚 5 分钟修好——ingest 本就不是交互式路径，可接受。
                sleep 300
              done
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              # limit 100m→1000m（2026-08-02）。不是"多给资源"，是消除 CFS 节流的结构性
              # 误报：本容器是单线程 busybox find 的突发型负载（每轮只要约 0.2 CPU-秒，
              # 然后睡 5 分钟）。CPU limit <1 core 时，配额小于单线程一个周期能跑满的
              # 100ms → 这 0.2s 必然被切成多个周期反复节流；throttled/periods 只统计
              # "有活可跑"的周期，占空比越低这个比值反而越难看（500m 时仍有 66.7%），
              # CPUThrottlingHigh(>25%) 就会一直复燃。
              # limit = 1000m 时单线程最多用满一个周期的 100ms，配额恰好够 → 结构上
              # 不可能被节流。代价是每 5 分钟约 0.2s 的单核突发，约 0.07% 一个核，
              # 对 5600H 的 CPU/热预算可忽略；requests 保持 1m，调度不受影响。
              cpu: 1000m
              memory: 32Mi
          volumeMounts:
            - name: books
              mountPath: /library
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: calibre-web-automated-config-local
        - name: books
          persistentVolumeClaim:
            claimName: calibre-books-local
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  namespace: personal-services
spec:
  # ⚠️ homelab 上这里是 NodePort:30083。迁 oracle 时改回 ClusterIP：全仓库无任何
  # 消费者引用 30083（sync-ebooks.sh 与 cleanup-duplicates.py 都走 kubectl exec/cp，
  # 不碰 NodePort），而 oracle 是公网节点、homelab 在 NAT 后面 —— 没理由在云主机上
  # 多开一个对外端口。入口只经 Cloudflare Tunnel → oracle-gateway → 本 Service。
  type: ClusterIP
  selector:
    app: calibre-web
  ports:
    - port: 8083
      targetPort: 8083
      name: http
