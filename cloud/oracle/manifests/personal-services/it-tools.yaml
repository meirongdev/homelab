apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-tools
  namespace: personal-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: it-tools
  template:
    metadata:
      labels:
        app: it-tools
    spec:
      priorityClassName: meirong-bulk
      containers:
        - name: it-tools
          # 2026-08-05: sha-749c71f → sha-ffb28a7。旧镜像几个月没重建，Trivy 报 3 条
          # Critical（libssl3/libcrypto3 3.5.5-r0 + nginx 1.28.2-r1 的 CVE-2026-42945
          # 任意代码执行, CVSS 8.1）。源仓库 meirongdev/it-tools 已把运行期 base 钉到
          # nginx:1.30-alpine、构建期钉 node 22 + corepack，实测产出镜像
          # nginx-1.30.4-r1 / libssl3-3.5.7-r0 → 3 条全消。
          #
          # imagePullPolicy: Always —— 源仓库加了每周定时重建，同一个 sha-* tag 会被
          # 换成 base 更新的镜像（代码没变）。默认的 IfNotPresent 会让节点一直用旧
          # 缓存，定时重建等于没生效。
          image: ghcr.io/meirongdev/it-tools:sha-ffb28a7
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: it-tools
  namespace: personal-services
spec:
  selector:
    app: it-tools
  ports:
    - port: 80
      targetPort: 80
---
# HTTPRoute: tool.meirong.dev -> it-tools
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: it-tools
  namespace: personal-services
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oracle-gateway
      namespace: kube-system
      port: 80
  hostnames:
    - "tool.meirong.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: it-tools
          port: 80
          weight: 1
