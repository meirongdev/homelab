# book.meirong.dev -> calibre-web (personal-services)，oracle-k3s 侧。
# 2026-08-02 随 calibre 从 homelab 迁入。
#
# ⚠️ 不需要 ReferenceGrant —— oracle 的 base/gateway.yaml 已有
# allow-gateway-to-personal-services，覆盖本 ns 的 HTTPRoute→Service 引用。
# （homelab 侧要单独建，是因为那边的 gateway 清单里没有这条通配授权。）
#
# ⚠️ 光有这条路由不会把域名切过来，而且会制造重复 CNAME：两侧 external-dns 都是
# --policy=upsert-only 且 owner TXT 不同。正确顺序见
# docs/runbooks/argocd-control-plane-on-oracle.md「域名切换」（同一套流程）。
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre-web
  namespace: personal-services
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oracle-gateway
      namespace: kube-system
      port: 80
  hostnames:
    - "book.meirong.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: calibre-web
          port: 8083
          weight: 1
