# BentoPDF —— 替代 stirling-pdf（2026-08-11），复用 pdf.meirong.dev。
#
# 与 stirling-pdf 的根本差别：**BentoPDF 是纯客户端应用**。所有 PDF 处理在浏览器里
# 用 WASM 完成，文件从不上传。所以这里没有 PVC、没有 ExternalSecret、没有 OIDC ——
# 服务端只是一个 nginx 静态站，没有任何服务端状态可保护，"不做权限管理、谁都能用"
# 是它的自然形态，而不是把认证关掉。
#
# 这也顺带解掉了 stirling-pdf 的老问题：它是 Java/Spring + 内嵌 H2，7d 内存峰值
# 一度到 limit 的 82%（全集群最高），且因 H2 单写者锁必须用 Recreate 滚动策略。
#
# ⚠️ WASM 从 jsDelivr CDN 运行时加载（PyMuPDF / Ghostscript / CoherentPDF，均 AGPL，
#    上游刻意不打进镜像）。即：镜像里只有前端，**部分功能依赖第三方 CDN 可达**。
#    代价是 pdf.meirong.dev 页面会从 cdn.jsdelivr.net 拉可执行 WASM（供应链面）。
#    上游支持自托管 WASM（README 的 "WASM Configuration" / 气隙部署），需要额外配置，
#    2026-08-11 决定先用默认，自托管留作后续。
#
# 许可：AGPL-3.0（商业许可 $79 是给闭源分发用的，自托管未修改版走 AGPL 即可）。
# 上游同时发 `bentopdf`（含营销页）与 `bentopdf-simple`（去掉 hero/FAQ，功能相同），
# 自托管用后者。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bentopdf
  namespace: personal-services
  labels:
    app: bentopdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bentopdf
  template:
    metadata:
      labels:
        app: bentopdf
    spec:
      # 无状态静态站，被驱逐后秒起、零数据损失 —— oracle 内存 requests 已 ~91%，
      # 这类应用正是 bulk 的目标（与前任 stirling-pdf 保持一致）。
      priorityClassName: bulk
      containers:
        - name: bentopdf
          # v1.15.4 的**多架构 index digest**（不是 amd64 分支 digest）——
          # oracle 是 arm64，已确认该 tag 同时发布 linux/amd64 与 linux/arm64。
          # ⚠️ 别 pin `latest`：实测 latest(ba67d44f…) 与 v1.15.4(ed728002…) 是两个不同构建。
          image: ghcr.io/alam00000/bentopdf-simple@sha256:ed728002dede243e99da3b5f66a88ef4aa842962d5fc1313a75ab841cc9af237
          ports:
            - containerPort: 8080
          # 镜像自带 nginx 1.28 + USER 101，本就非 root；这里显式声明，
          # 满足 ns 的 PSA enforce=baseline 且顺带够到 restricted 的大部分要求。
          # ⚠️ 不设 readOnlyRootFilesystem：entrypoint 要 envsubst 写 /etc/nginx/conf.d。
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # 静态文件服务，开销极小。显式声明而不吃 LimitRange 默认值
          # （默认 15m/64Mi + 500m/256Mi 对一个 nginx 偏大）。
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bentopdf
  namespace: personal-services
spec:
  selector:
    app: bentopdf
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
# HTTPRoute: pdf.meirong.dev -> bentopdf
# 沿用 stirling-pdf 的域名。external-dns 是 `policy: upsert-only`，记录本来就在，
# 这里换后端不产生 DNS 变更（也正因如此，退役 stirling 不会留下悬空记录）。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bentopdf
  namespace: personal-services
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oracle-gateway
      namespace: kube-system
      port: 80
  hostnames:
    - "pdf.meirong.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: bentopdf
          port: 8080
          weight: 1
