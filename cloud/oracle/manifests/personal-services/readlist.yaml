# readlist —— 技术书多维评分 + 公开书单站（单 Go 二进制:只读 API + 内嵌 SPA + SQLite/WAL）
#
# 需求/评分标准/源码的真相源在 meirongdev/readlist；**部署清单的真相源是本文件**。
# 当前部署版本：**v0.5.0**（2026-08-09 升级）。上游修三个结构性缺陷（snapshot 覆写
# ingest 写回的外部 pubdate / HN 拿含副标题的整名匹配 / mentions 被 editions 烧光预算），
# 它们共同让 timeless 与 fresh-releases 两个旗舰榜恒为空。部署侧改动 = 4 处 image tag
# + `TITLE_WHITELIST_FILE` env + `readlist-title-whitelist` ConfigMap 挂进 ingest
# CronJob（v0.4.0 忽略该 env，清单先于镜像推送是安全的）。无 schema 迁移。
# 升级后判读：C 维第一晚就该非 0、F 维单调爬升不再隔夜归零；HN 查询标记带 matcher
# 版本，旧标记自动重查——**无需清库、无需手动引导**。兜底告警见 readlist-alerts.yaml
# 的 ReadlistCommunityDimEmpty / ReadlistFreshnessEvidenceLost；判读细节见
# docs/runbooks/readlist-bootstrap.md 第 3 步。
#
# ── 以下 v0.4.0 段落保留作历史口径（2026-08-08 升级；**那次只换了 4 处 image tag**——
# 上游 `deploy/oracle/readlist.yaml` 在 v0.3.0→v0.4.0 之间确实动过，但改的只是它
# 自己那 4 行 image tag（v0.1.0→v0.3.0，commit f0abb9e，是参照件补自己的版本号），
# 没有形状改动；无 schema 迁移（`0001_schema.sql` 只改了一行注释，而 store.go 的
# 迁移器按**文件名**记录、不校验 checksum，不会因此报 dirty）。
# v0.1.0 → v0.2.0 的部署侧改动是 livenessProbe 切 /livez、两个探针显式
# timeoutSeconds、三个 CronJob 加 timeZone）。
#
# ⚠️ v0.4.0 的三个 breaking 全落在**公开面口径与前端**，不在部署形状：
#   · 公开榜从 7 份收敛到 **3 份**：timeless / fresh-releases / to-read-next
#     （internal 只剩 library-hygiene；ship-this-week、deep-dive、ai-llm、
#     read-and-loved、publisher-picks 已删）——删掉的正是 v0.3.0 时实测为空的那几个。
#   · 证据徽章改按「**实际参与排序的维度**」评（`score.GradedDims`：只有在某份 preset
#     里占非零权重的维度才算数）。按 v0.4.0 的 presets.yaml 权重推出，graded 集 =
#     **{A, C, T, readability}**；D / P / **F** 三维没有任何榜给权重，从此不影响徽章。
#     ⚠️ **换镜像当天 `readlist_grade_counts` 不会动**：徽章是 score 作业算完写进 run
#     的，web 只读已发布 run。要等下一次 score（01:40 UTC）用新镜像重算才变——
#     别据此判断"升级没生效"。
#     升级前基线（2026-08-08 实测）：works_total=2035，A=0 B=22 C=273 D=1740；
#     dim_measured：A=80 C=0 D=0 F=295 P=0 T=1736 readability=2035。
#     ⚠️ 升级后的分布**尚未观测，别预设方向**：F 退出评级往好处走，但 C 进了 graded
#     集而它的 measured 是 **0**，两者反向。（F 的 measured=295 恰好等于 2035−1740，
#     **疑似**旧 D 级的主因，未验证。）今晚 score 跑完照实回填这里。
#   · SPA 撤掉权重滑块回到纯展示层，另加「关于」页。
#   公开面即时可见的变化（2026-08-08 升级后**实测**）：`/api/v1/catalog` = **15** 本
#   （timeless 0 / fresh-releases 3 / to-read-next 12），榜单 7 → 3 份。作对照的
#   「v0.3.0 时 22 本」是 2026-08-06 的记录，那时全库 2,045 本、与今天的 2,035 不是
#   同一快照，两个数不构成严格的前后对比。
#
# v0.3.0 起仍然成立的口径（别当成已废）：
#   · `/api/v1/catalog` 是「**公开榜单的并集**」而非全库；internal 榜不算公开。
#     站上书少的根因是证据两头没补齐——C/D/P 三维实测覆盖仍为 0（需上游 LLM 标注上线），
#     A（口碑）则卡在 calibre 标识符/简介补全（2026-08-06 实测：2,053 本里仅 990 本有
#     任意 identifier、980 本有简介，ingest 因此「无标识符跳过 1,055 个版次」）。
#   · `/api/v1/matrix/{run}` **已删除**（原按任意历史 run 寻址）。引用它的地方要一并清。
#   · 不按 grade 过滤这条**保留**：上榜但缺维的书照样列出并标注缺哪几维。
#   指标口径**没变**（`readlist_works_total` 仍是全库数），故 readlist-alerts.yaml 无需改；
#   但 ReadlistNoExternalEvidence 里 D 的语义随之收紧（现在 D = 有**参与排序**的维度为
#   unknown），该告警只会比以前更难触发，不会反过来误报。
#
# 上游 `deploy/oracle/readlist.yaml` 只是参照件，抄过来时按本集群实际改了 4 处，
# 每一处都别改回去：
#   1. Gateway 是 `oracle-gateway`/ns `kube-system`/port 80 —— 参照件写的
#      `cilium-gateway`/ns `gateway` 在本集群**不存在**，照抄会得到 ResolvedRefs=False；
#   2. 登记进 `cloud/oracle/manifests/kustomization.yaml`（**根**那一份）——
#      参照件说的 `personal-services/kustomization.yaml` 在本仓库不存在；
#   3. requests 按本集群实测下调（见下方各容器注释）—— 2026-08-05 缩到 2 OCPU 后
#      节点只有 1800m 可分配，实测已占 1372m(76%)，参照件的 50m/100m 太阔；
#   4. web pod 加 emptyDir `/tmp` —— 参照件开了 readOnlyRootFilesystem 却没给可写临时
#      目录，而 kind 的清单**没开只读根**，等于这条路径从没被验过。
#
# ☠️ 还有一处是**不要改回去**的删除：参照件与 kind 清单里的 `readlist init`
#    initContainer 在本集群**故意不加**，原因见下方 Deployment 处的长注释
#    （它会把演示语料写进空库）。v0.4.0 里 init 仍在幂等检查**之前**无条件调
#    `corpus.Seed(db)`（`cmd/readlist/main.go:63`，v0.4.0 已复核；v0.5.0 未改 init，
#    2026-08-09 复核结论不变），行为一如既往，别被上游 kind 清单带跑偏。
#
# ns `personal-services` 由 uptime-kuma/namespace.yaml 创建，这里不建（H1）。
# ReferenceGrant 不需要：base/gateway.yaml 的 allow-gateway-to-personal-services 已覆盖本 ns。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: readlist-config
  namespace: personal-services
data:
  DB_PATH: /data/readlist.db
  API_LISTEN_ADDR: ":8080"
  STANDARD_VERSION: "1.0"
  # 保留的历史 run 数(回滚窗口)。每夜一个 run ≈ 1.5 万行，不回收会写满 PVC。
  KEEP_RUNS: "5"
  # 阅读轨迹公开（2026-08-05 确认）：「下一本读什么」= 高分 ∩ 未读 是本站最有用的榜，
  # 它需要这个。改 "false" 即刻转私有，to-read-next / read-and-loved 两榜随之为空。
  EXPOSE_READ_STATUS: "true"
  # snapshot 的输入：calibre 的两个源库（只有 snapshot CronJob 挂这两个卷）。
  SOURCE_METADATA_DB: /library-src/metadata.db
  SOURCE_APP_DB: /config-src/app.db
  SNAPSHOT_DIR: /data/snapshot
  # calibre-web app.db 里的用户 id。首次 snapshot 必须核对它报出的 reading 行数——
  # id 填错的表现不是报错，而是**静默 0 行**（阅读状态本就只覆盖 23 本，很容易看漏）。
  CALIBRE_USER_ID: "1"
  # ingest 每次运行的外部请求预算。打满就干净停下，次日接着跑（NFR-9）。
  # 首轮全量 editions 约需 1,000–1,500 次请求、HN 声量再加一批 → 3 晚上下跑完。
  # v0.5.0 起每晚有 MENTIONS_RESERVE（默认 Budget/4=200）给 HN 保底：editions 烧到
  # 只剩保底线就让位 —— 否则 C 维（技术圈声量）在 bootstrap 后头几晚恒为 0，
  # timeless 榜（needs C:measured）持续为空（2026-08-05→08 生产实测）。
  INGEST_BUDGET: "800"
  # 主标题白名单文件（v0.5.0 起生效；v0.4.0 忽略此变量）。见下方同名 ConfigMap。
  TITLE_WHITELIST_FILE: /whitelist/main-titles.txt
---
# ── HN 主标题白名单 ─────────────────────────────────────────────────────────
# 主标题（第一个冒号前）≤2 词的书默认不查 HN —— "Clean Code" 这类短语会把大量
# 泛指帖误认成对这本书的提及，而误认会污染整个 C 维（R-3 宁少不多）。
# 想让这类书拿到声量维，把主标题加进下面的名单（每行一个，# 注释）。
# ⚠️ 加名单前先想清楚误认代价：白名单放行后按词边界短语匹配，"clean code" 会命中
#   一切标题里含这个短语的 HN 帖（含泛指用法）。命中可逐条否决（mention_overrides，
#   按 objectID），但那是手工活。只放「短语用法几乎只指这本书」的标题。
apiVersion: v1
kind: ConfigMap
metadata:
  name: readlist-title-whitelist
  namespace: personal-services
data:
  main-titles.txt: |
    # 每行一个主标题；# 开头为注释。改这个文件 = git push，次日 01:20 ingest 生效。
    # 候选（刻意先不启用 —— 逐个评估误认率后再放行）：
    #   Clean Code
    #   Effective Java
    #   Refactoring
    #   Code Complete
    #   Fluent Python
---
# Google Books API key。⚠️ 不是可选的锦上添花：实测 2026-08-05 匿名配额按**共享项目**计，
# 一次探测请求就直接 429 → A 维(读者评分)与 F 维(时效)基本拿不到数据，而 ingest 拿到的
# publishedDate 又是**修 pubdate 污染的唯一来源**（snapshot 那三种来源一律记 unknown）。
# Vault: secret/oracle-k3s/readlist，key GOOGLE_BOOKS_KEY（2026-08-05 已写入）。
#   kubectl --context k3s-homelab exec -n vault vault-0 -- \
#     sh -c 'VAULT_TOKEN=<root> vault kv put secret/oracle-k3s/readlist GOOGLE_BOOKS_KEY=xxx'
#   ⚠️ `VAULT_TOKEN=$VAULT_TOKEN` 那种写法在本集群 403（pod 内该变量是空的），要用 root token。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readlist-secrets
  namespace: personal-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: readlist-secrets
    creationPolicy: Owner
  data:
    - secretKey: google-books-key
      remoteRef:
        key: oracle-k3s/readlist
        property: GOOGLE_BOOKS_KEY
---
# SQLite 落节点本地盘（local-path，单节点无冗余）；Prune=false 护栏防 ArgoCD 误删。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readlist-data
  namespace: personal-services
  labels:
    # 备份归属。⚠️ 这个 label 只是标记，**真正生效的是**
    # backup/overlays/oracle/backup-script.yaml 里 `for pat in ...` 那份显式白名单
    # （已加 readlist-data）。CI 规则 H4 卡的是白名单，不是这个 label。
    backup.homelab/sqlite: "true"
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # 卷上有不可再生数据：evidence（重建要烧 2–3 天 Google Books 配额）、
      # publisher_map、overrides、title_whitelist —— 人工投入或昂贵缓存，丢了要重来。
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readlist
  namespace: personal-services
  labels:
    app: readlist
spec:
  replicas: 1
  # SQLite 单写锁：滚动更新会让新旧 pod 抢同一个 db 文件的写锁（同 trends）。
  # rollingUpdate: null 是防 ArgoCD OutOfSync 漂移，别删。
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: readlist
  template:
    metadata:
      labels:
        app: readlist
        readlist.role: web
    spec:
      priorityClassName: bulk
      securityContext:
        # distroless nonroot 的 uid/gid；让进程对 local-path 卷可写。
        fsGroup: 65532
      # ☠️ **不要加 `readlist init` 的 initContainer。** 上游参照件把它去掉是**对的**，
      # 我在 2026-08-05 自作聪明加回来过，代价是污染了一次生产库：
      #   `init` 在幂等检查**之前**无条件调 `corpus.Seed(db)`，而 seed 是**演示语料**
      #   ——写死的假 Google/OpenLibrary 评分、假 HN 提及次数、假 depth/level 标注、
      #   假个人星级。空库上它会真的写进去，然后被当成真证据打分并公开。
      #   实测证据：ingest 报「HN 提及 0 条」，站上却显示 Fluent Python「HN 提及 5 次」
      #   ——正是 seedBooks 里那条 `mentions: {1,2,3,6,8}`。
      # Seed 自带「editions 非空则跳过」的保护，所以它只在**空库**上开火 ——
      # 这恰恰是最危险的时刻：PVC 重建、从残缺备份恢复、首次部署。
      # 生产不需要它：内容本来就来自 snapshot + score，且 serve 在空库上会自愈
      # 发布一个**0 本书**的 run（诚实的空站），引导按 runbooks/readlist-bootstrap.md 走。
      containers:
        - name: readlist
          # 版本化不可变 tag（多架构 index，含 linux/arm64——本集群是 ARM，每次升级
          # 都要核对 registry 确有 arm64 变体）。用 tag 而非 `:main`，故**不需要**
          # imagePullPolicy: Always。
          image: ghcr.io/meirongdev/readlist:v0.5.0
          command: ["readlist", "serve"]
          envFrom:
            - configMapRef:
                name: readlist-config
          ports:
            - containerPort: 8080
              name: http
          # ⚠️ 两个探针**必须走不同端点**（v0.2.0 起）：
          #   readiness → /healthz（查库）：库慢/还没打分 = 暂时别收流量；
          #   liveness  → /livez  （**不碰库**）：进程还在就别重启。
          # 反过来（liveness 查库）就是自伤：爬虫把请求堆在唯一那条 SQLite 连接上
          # → /healthz 排队超时 → kubelet 在高负载时杀掉唯一副本，而 SQLite 单写锁
          # 决定了没有第二个副本能顶上。边缘限流挡不住——阈值之下的正常流量就够了。
          # timeoutSeconds 必须显式给：默认只有 1 秒，正是排队时最先被击穿的那个值。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              # 15m 与 trends 同口径（同样是 Go + SQLite + 内嵌 SPA 的只读站）。
              # 参照件写 50m —— 节点只剩约 428m 可分配，不值当。
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem 下 SQLite 仍可能要落临时文件（排序/VACUUM 的
            # temp b-tree）。kind 的清单没开只读根，等于**这条路径没被验过**，
            # 给个 emptyDir 兜住，成本为零。
            - name: tmp
              mountPath: /tmp
      volumes:
        # ⚠️ Web pod **永不挂 calibre 的任何卷**。公开应用的任何 bug 都碰不到书库，
        # 也碰不到 app.db 里的密码 hash / OIDC 凭据（blast radius 论证见上游 architecture §2）。
        - name: data
          persistentVolumeClaim:
            claimName: readlist-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: readlist
  namespace: personal-services
spec:
  type: ClusterIP
  selector:
    app: readlist
  ports:
    - port: 8080
      targetPort: http
      name: http
---
# readlist.meirong.dev -> readlist:8080（2026-08-06 公开；与本 ns 其它公开服务同形状）
#
# ⚠️ 域名用 **readlist.** 而不是 books./book. —— 与私有书库 book.meirong.dev 只差
# 一个字母，误配代价太高（一个只发元数据与评分，一个是书库本身）。
# 通配隧道 + external-dns 自动建 CNAME，**不需要**改 cloudflare/terraform；
# ReferenceGrant 也不需要（base/gateway.yaml 已有覆盖本 ns 的通配授权）。
# external-dns 是 upsert-only：日后再摘路由**不会**删 CNAME，要清得手工删。
#
# 公开面发的是 work 的 title+author（不发书本身）。**v0.3.0 起暴露面已大幅收窄**：
#   行集合 = 7 个公开榜的并集（约百余本），不再是全库约 2,000 本；`/api/v1/matrix/{run}`
#   已删除。这就是 ROADMAP #11 说的「修法 C」，2026-08-06 随 v0.3.0 落地。
#   两个 internal 榜（publisher-picks / library-hygiene，`visibility: internal`）不进
#   公开集合 —— 注意 library-hygiene 恰恰是「元数据最差的书」，正好是最不该外发的那批。
#
#   ☠️ **残余风险仍在，别当成已解决**：准入过滤（修法 B）**没做**——`internal/calibre`
#   读了 tags 但不据此筛选。所以丢进 calibre 的非书文档照样参与打分，只要它**碰巧上了
#   任一公开榜**，title+author 就仍会上公网；那种东西的"元数据"本身就是真人姓名。
#   收窄只是把命中概率从「必然」降到「偶然」，判据依旧只有人眼。
#   往书库里放简历/合同/发票之前先想一下。
#
#   2026-08-06 历史实例：一条第三方简历（BHRC / Mint Wu）此前出现在公开 catalog 里，
#   已从 calibre 移除并重跑 score，全部公开端点核验 0 命中。
#
#   ⚠️ 上游 review-2026-08-05-b 的 C1 提议给 catalog 做 SSR + sitemap。C 已落地，
#      这道硬前置解除；但**做 SSR 前仍建议先补 B**，否则偶发泄漏会被搜索引擎收录固化。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: readlist
  namespace: personal-services
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oracle-gateway
      namespace: kube-system
      port: 80
  hostnames:
    - "readlist.meirong.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: readlist
          port: 8080
          weight: 1
---
# ── 快照：唯一接触 calibre 的工作负载 ────────────────────────────────────
# 秒级短命 Job，**无网络出口**（见下面的 NetworkPolicy）。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: readlist-snapshot
  namespace: personal-services
spec:
  schedule: "5 1 * * *"
  timeZone: Etc/UTC # 与代码里一律 Now().UTC() 的口径对齐；不写则跟随**节点**时区
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: readlist
            readlist.role: snapshot
        spec:
          restartPolicy: OnFailure
          priorityClassName: bulk
          securityContext:
            fsGroup: 65532
          containers:
            - name: snapshot
              image: ghcr.io/meirongdev/readlist:v0.5.0
              command: ["readlist", "snapshot"]
              envFrom:
                - configMapRef:
                    name: readlist-config
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: library
                  mountPath: /library-src
                - name: config
                  mountPath: /config-src
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: readlist-data
            # RWO 在单节点上可被多 pod 挂载 —— RWO 是**节点级**语义，
            # calibre-web / open-notebook-ingest 已有同样论证。
            # metadata.db 是 WAL，**必须 RW 挂载**：WAL 的读路径也要写 -shm，
            # 只读挂载会得到 "attempt to write a readonly database"。
            # readlist 只做 VACUUM INTO，不改书目。
            - name: library
              persistentVolumeClaim:
                claimName: calibre-books-local
            # ☠️ app.db 含密码 hash / 会话 / OIDC 凭据 → 只读挂载，且 readlist 只导出
            # 3 张表的少数几列（有测试断言凭据不出现在产物里）。绝不整库快照。
            - name: config
              persistentVolumeClaim:
                claimName: calibre-web-automated-config-local
---
# 能碰书库的容器，连不出去。这是标准 networking.k8s.io NetworkPolicy——
# 本集群没有自建 CiliumNetworkPolicy，但 Cilium 会正常执行标准 NetworkPolicy。
# ⚠️ 空 egress = 全部拒绝，**含 DNS**。snapshot 只读本地文件，不需要解析任何域名。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: readlist-snapshot-no-egress
  namespace: personal-services
spec:
  podSelector:
    matchLabels:
      readlist.role: snapshot
  policyTypes: ["Egress"]
  egress: []
---
# ── 摄入外部证据：唯一需要出网的工作负载 ─────────────────────────────────
# 与 snapshot 分开，正是为了让「碰书库」和「能出网」永不出现在同一个 pod 里。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: readlist-ingest
  namespace: personal-services
spec:
  schedule: "20 1 * * *"
  timeZone: Etc/UTC # 与代码里一律 Now().UTC() 的口径对齐；不写则跟随**节点**时区
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1 # 配额受限，失败别急着重试
      template:
        metadata:
          labels:
            app: readlist
            readlist.role: ingest
        spec:
          restartPolicy: OnFailure
          priorityClassName: bulk
          securityContext:
            fsGroup: 65532
          containers:
            - name: ingest
              image: ghcr.io/meirongdev/readlist:v0.5.0
              command: ["readlist", "ingest"]
              envFrom:
                - configMapRef:
                    name: readlist-config
              env:
                # optional: true 是刻意的 —— ESO 挂了的话 ingest 应该降级跑
                # （OpenLibrary + HN 仍可用），而不是起不来。
                - name: GOOGLE_BOOKS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: readlist-secrets
                      key: google-books-key
                      optional: true
              resources:
                requests:
                  # 网络 IO 为主 + 礼貌限速，不吃 CPU。
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                # 主标题白名单（TITLE_WHITELIST_FILE 指向这里）。挂 ConfigMap 保证
                # 文件一定存在 —— v0.5.0 起「配了路径却读不到」会让 ingest 大声失败。
                - name: title-whitelist
                  mountPath: /whitelist
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: readlist-data
            - name: title-whitelist
              configMap:
                name: readlist-title-whitelist
---
# ── 重算评分：纯离线（score 禁止发起网络请求，上游 system-design §9）─────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: readlist-score
  namespace: personal-services
spec:
  schedule: "40 1 * * *"
  timeZone: Etc/UTC # 与代码里一律 Now().UTC() 的口径对齐；不写则跟随**节点**时区
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: readlist
            readlist.role: score
        spec:
          restartPolicy: OnFailure
          priorityClassName: bulk
          securityContext:
            fsGroup: 65532
          containers:
            - name: score
              image: ghcr.io/meirongdev/readlist:v0.5.0
              command: ["readlist", "score"]
              envFrom:
                - configMapRef:
                    name: readlist-config
              resources:
                requests:
                  # 三个 Job 里最重的一个（2,054 本 × 7 维），但仍是秒到分钟级。
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: 1
                  memory: 384Mi
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: readlist-data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: readlist-score-no-egress
  namespace: personal-services
spec:
  podSelector:
    matchLabels:
      readlist.role: score
  policyTypes: ["Egress"]
  egress: []
