---
# Timeslot（slot.meirong.dev）：预约时段小站，自研，镜像 ghcr.io/meirongdev/timeslot。
#
# 2026-09-02 之前这里只有 HTTPRoute，Deployment/Service/PVC/ConfigMap/Secret 是 `just deploy-timeslot`
# 手工 helm 装的（sparse clone 上游 chart + kubectl patch 修 chart 的两个 bug），是清单外唯一的
# manual-helm 工作负载，AGENTS.md 的 manual-helm 例外表里没有它。现在整组资源进 kustomize 树由
# ArgoCD 接管；按 docs/decisions/no-helm-chart-for-in-house-apps.md，自研应用不打 chart。
#
# 接管时刻意与现网对象逐字段对齐：selector 不可变；SSA 只接管**声明了的**字段，没声明的旧字段会
# 原样留在 live 对象上。所以保留了 chart 的「ConfigMap 模板 + initContainer 渲染口令」这一形状，
# 只改三处：镜像钉 digest（现网 :latest 实际就解析到它）、resources 按实测填（1m / 8Mi）、
# priorityClassName bulk。
#
# ☠️ 口令（2026-09-02 查明，待处理）：initContainer 读的 Secret `timeslot-secrets` 是当年 helm 装出来的，
# 里面是**上游 chart 的默认口令**（chart 在公开仓库，等于公开）——`deploy-timeslot` 配方声称从 Vault
# `secret/oracle-k3s/timeslot` 取值，但 Vault 里根本没有这个路径（ESO 实测 SecretSyncedError）。
# 该 Secret 不在 git、不在 ESO，是本文件唯一的清单外依赖，刻意先沿用以保证接管本身零风险。
# 轮换步骤（需要 Vault 写权限，两步）：
#   1. VAULT_ADDR=https://vault.meirong.dev vault kv put secret/oracle-k3s/timeslot admin_password=<新随机口令>
#   2. 本文件加一段 ExternalSecret（target `timeslot-admin`，remoteRef key oracle-k3s/timeslot /
#      property admin_password），把下面 secretKeyRef.name 改成 timeslot-admin，push；
#      稳定后 `kubectl -n personal-services delete secret timeslot-secrets`。
# 再往后（可选）：ESO 整份渲染 config.json，删掉 initContainer 与 ConfigMap。
#
# 合并后一次性清理 helm 的 release 存档（ArgoCD 不会动它们；`helm list` 会一直显示 timeslot 直到删掉）：
#   kubectl --context oracle-k3s -n personal-services delete secret \
#     sh.helm.release.v1.timeslot.v1 sh.helm.release.v1.timeslot.v2
# ☠️ 不要 `helm uninstall timeslot`：那会真删 Deployment / PVC。
# 应用配置模板。口令占位符由 initContainer 用 awk 替换（上游 chart 用 sed + $(...) 会被 shell
# 当命令替换展开成空串，这是被修掉的 chart bug 之一）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: timeslot-config
  namespace: personal-services
data:
  config.json: |
    {
      "listen_addr":       ":8080",
      "db_path":           "/data/timeslot.db",
      "admin_user":        "admin",
      "admin_password":    "$(ADMIN_PASSWORD)",
      "slot_duration_min": 30,
      "buffer_before_min": 120,
      "max_days_ahead":    30,
      "timezone":          "Asia/Shanghai"
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timeslot-pvc
  namespace: personal-services
  annotations:
    # sqlite 预约数据；备份归属见 backup/overlays/oracle/backup-script.yaml（H4）
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeslot
  namespace: personal-services
  labels:
    app.kubernetes.io/name: timeslot
    app.kubernetes.io/instance: timeslot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timeslot
      app.kubernetes.io/instance: timeslot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timeslot
        app.kubernetes.io/instance: timeslot
    spec:
      priorityClassName: bulk
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: config-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              awk -v pw="$ADMIN_PASSWORD" '{gsub(/\$\(ADMIN_PASSWORD\)/, pw)}1' /config-template/config.json > /config/config.json
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timeslot-secrets   # 见文件头 ☠️：helm 遗留、含 chart 默认口令，轮换后改 timeslot-admin
                  key: admin_password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-rendered
              mountPath: /config
      containers:
        - name: timeslot
          # 与现网运行中的 imageID 一致（2026-09-02 核对）；换版本改这一行
          image: ghcr.io/meirongdev/timeslot/timeslot@sha256:27c17dace6f713015f2f9df451a647e9c971daee7a22a444db6e0512e57f5230
          args: ["-config", "/config/config.json"]
          ports:
            - name: http
              containerPort: 8080
          # 实测 1m / 8Mi（Go + sqlite，单用户）。limit 留 10 倍余量，别按空载再收。
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # /admin/ 要 Basic Auth，探针打它恒 401 → CrashLoop，这是被修掉的另一个 chart bug
          livenessProbe:
            httpGet:
              path: /api/slots
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/slots
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config-rendered
              mountPath: /config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: timeslot-pvc
        - name: config-template
          configMap:
            name: timeslot-config
        - name: config-rendered
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: timeslot
  namespace: personal-services
  labels:
    app.kubernetes.io/name: timeslot
    app.kubernetes.io/instance: timeslot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: timeslot
    app.kubernetes.io/instance: timeslot
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# HTTPRoute: slot.meirong.dev -> timeslot
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: timeslot
  namespace: personal-services
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oracle-gateway
      namespace: kube-system
      port: 80
  hostnames:
    - "slot.meirong.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # No SSO: timeslot has its own Basic Auth on /admin/ and the API (/api/slots)
      # is intentionally public (for blog embedding). SSO's --pass-authorization-header=true
      # would inject Authorization: Bearer, overwriting the browser's Basic Auth → 401.
      backendRefs:
        - group: ""
          kind: Service
          name: timeslot
          port: 8080
          weight: 1
