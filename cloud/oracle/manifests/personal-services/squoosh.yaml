apiVersion: apps/v1
kind: Deployment
metadata:
  name: squoosh
  namespace: personal-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: squoosh
  template:
    metadata:
      labels:
        app: squoosh
    spec:
      containers:
        - name: squoosh
          # 2026-08-05: dko0/squoosh:1.12.0 → 自建镜像。原镜像上游 2022-07 停更，入口是
          # Node 16(EOL)静态服务器，Trivy 报 15 条 Critical。自建只取其静态产物换进
          # nginx:1.31-alpine → 15 条清零。理由与实现见 images/squoosh/Dockerfile。
          #
          # ⚠️ 推送顺序：本行依赖 .github/workflows/squoosh-image.yml 先构建出镜像。
          # 与 images/squoosh/** 同一次 push 的话，ArgoCD(3 分钟轮询)可能早于
          # CI(多架构构建约 2-4 分钟)，squoosh 会短暂 ImagePullBackOff。分两次推更稳。
          #
          # imagePullPolicy: Always —— 自建镜像的价值全在 base 新鲜度：base 出 CVE 时
          # 重跑 workflow 会把 :1.12.0 指向新构建，但 tag 不变时 IfNotPresent 会让节点
          # 一直用旧缓存，重建等于没生效。
          image: ghcr.io/meirongdev/squoosh:1.12.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: squoosh
  namespace: personal-services
spec:
  selector:
    app: squoosh
  ports:
    - port: 8080
      targetPort: 8080
---
# HTTPRoute: squoosh.meirong.dev -> squoosh
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: squoosh
  namespace: personal-services
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: oracle-gateway
      namespace: kube-system
      port: 80
  hostnames:
    - "squoosh.meirong.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: squoosh
          port: 8080
          weight: 1
