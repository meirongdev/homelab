# apps-pg 凭据 —— 复用 Vault `oracle-k3s/miniflux` 的 db_password，**不新开 Vault 值**。
# 目的：cutover 时 miniflux 自己的 ExternalSecret 只需改 Host，密码两边始终一致
# （同 zitadel-pg-secrets.yaml 复用 secret/homelab/zitadel 的思路）。
#
# ⚠️ 这一个 Secret 在 apps-pg-cluster.yaml 里被引用**两次**，用途不同但值相同：
#   ① bootstrap.initdb.secret            —— 新集群里 miniflux 角色的口令
#   ② externalClusters[rss-postgres]     —— 连**旧库**做一次性 import 的口令
# 之所以是同一个值：旧库 rss-postgres 的 POSTGRES_USER 就是 miniflux，它同时是那个
# 实例的超级用户（见 rss-system/miniflux.yaml）。旧库销毁后 ② 失效，但 ① 仍在用，
# **不要连这个 Secret 一起删**。
#
# ⚠️ remoteRef.key 用裸路径 `oracle-k3s/miniflux`（不带 `secret/` 前缀）——
# ClusterSecretStore `vault-backend` 已声明 path: "secret" 作为 KV 挂载点
# （base/vault-store.yaml）。仓库里两种写法都有且都能同步（ESO 容忍冗余前缀），
# 这里跟 rss-system/secrets.yaml 对齐：同一个 Vault 路径、同一个 property。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apps-pg-miniflux-app
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: apps-pg-miniflux-app
    creationPolicy: Owner
    deletionPolicy: Retain
    # CNPG 的 initdb.secret 要求 kubernetes.io/basic-auth（username + password）
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: miniflux
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: oracle-k3s/miniflux
        property: db_password
