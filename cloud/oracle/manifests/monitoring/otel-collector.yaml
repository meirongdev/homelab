---
# OTel Collector DaemonSet for oracle-k3s
# Collects:
#   - container logs        → Loki，集群内直达（2026-08-02 Loki 迁入本集群前是跨 Tailscale）
#   - cloudflared metrics   → homelab Prometheus via Tailscale (prometheusremotewrite)
#   - cilium-envoy metrics  → homelab Prometheus（网关 L7 RED 指标，oracle 网关 SLO 数据源）
#   - application traces    → Tempo，集群内直达（同 Loki）
# ⚠️ 日志/追踪与指标的方向**不再一致**：Loki/Tempo 在本集群，Prometheus 仍在 homelab
#    （它要贴着抓取目标，不搬）。排查时别默认「所有遥测都往同一个方向走」。
# Architecture: apps/filelog/prometheus -> memory_limiter/k8sattributes/resource/batch -> otlphttp / prometheusremotewrite / otlp
# 2026-07-31 对齐 2026 OTel 实践（docs/decisions/otel-2026-alignment.md）：
#   filelog 换 container operator；file_storage checkpoint + 跨 Tailscale 持久发送队列；
#   补 k8s.cluster.name semconv；镜像 0.120.0→0.156.0（与 homelab collector 同版本）。
#   保持 contrib 发行版：prometheusremotewrite exporter 不在 k8s 裁剪发行版里。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # nodes/metrics: 直连 kubelet :10250 抓 /metrics/cadvisor（KRR 依赖的容器用量指标）。
  # kubelet 自己做 SubjectAccessReview，走 metrics 子资源——只给 "nodes" 不够
  # （2026-07-30 实测：无此条时 HTTP 403）。homelab 侧 kube-prometheus-stack 的
  # ClusterRole 同样含 nodes/metrics。
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: monitoring
---
# ClusterIP Service — applications send OTLP traces/logs here
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: health
      port: 13133
      targetPort: 13133
      protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      priorityClassName: high
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.156.0
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 13133
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              # Sole logs+metrics+traces pipeline for oracle-k3s — under-resourcing
              # it means an OOM blinds the whole cluster. memory_limiter (below) is
              # kept well under this ceiling to account for Go RSS > heap.
              cpu: 500m
              memory: 512Mi
          # 显式 root：/var/log/pods 只读 + /var/lib/otelcol checkpoint/队列可写
          # （hostPath root:root；节点日志代理的通行惯例，同 homelab collector）
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /etc/otel/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: otel-state
              mountPath: /var/lib/otelcol
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        # filelog checkpoint + 发送队列的持久化目录（bbolt 文件）
        - name: otel-state
          hostPath:
            path: /var/lib/otelcol
            type: DirectoryOrCreate
      tolerations:
        - operator: Exists
