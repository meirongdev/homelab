---
# OTel Collector DaemonSet for oracle-k3s
# Collects:
#   - container logs        → Loki，集群内直达（2026-08-02 Loki 迁入本集群前是跨 Tailscale）
#   - cloudflared metrics   → homelab Prometheus via Tailscale (prometheusremotewrite)
#   - cilium-envoy metrics  → homelab Prometheus（网关 L7 RED 指标，oracle 网关 SLO 数据源）
#   - application traces    → Tempo，集群内直达（同 Loki）
# ⚠️ 日志/追踪与指标的方向**不再一致**：Loki/Tempo 在本集群，Prometheus 仍在 homelab
#    （它要贴着抓取目标，不搬）。排查时别默认「所有遥测都往同一个方向走」。
# Architecture: apps/filelog/prometheus -> memory_limiter/k8sattributes/resource/batch -> otlphttp / prometheusremotewrite / otlp
# 2026-07-31 对齐 2026 OTel 实践（docs/decisions/otel-2026-alignment.md）：
#   filelog 换 container operator；file_storage checkpoint + 跨 Tailscale 持久发送队列；
#   补 k8s.cluster.name semconv；镜像 0.120.0→0.156.0（与 homelab collector 同版本）。
#   保持 contrib 发行版：prometheusremotewrite exporter 不在 k8s 裁剪发行版里。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # nodes/metrics: 直连 kubelet :10250 抓 /metrics/cadvisor（KRR 依赖的容器用量指标）。
  # kubelet 自己做 SubjectAccessReview，走 metrics 子资源——只给 "nodes" 不够
  # （2026-07-30 实测：无此条时 HTTP 403）。homelab 侧 kube-prometheus-stack 的
  # ClusterRole 同样含 nodes/metrics。
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: monitoring
---
# ClusterIP Service — applications send OTLP traces/logs here
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: health
      port: 13133
      targetPort: 13133
      protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.156.0
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 13133
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # Sole logs+metrics+traces pipeline for oracle-k3s — under-resourcing
              # it means an OOM blinds the whole cluster. memory_limiter (below) is
              # kept well under this ceiling to account for Go RSS > heap.
              cpu: 500m
              memory: 512Mi
          # 显式 root：/var/log/pods 只读 + /var/lib/otelcol checkpoint/队列可写
          # （hostPath root:root；节点日志代理的通行惯例，同 homelab collector）
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /etc/otel/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: otel-state
              mountPath: /var/lib/otelcol
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        # filelog checkpoint + 发送队列的持久化目录（bbolt 文件）
        - name: otel-state
          hostPath:
            path: /var/lib/otelcol
            type: DirectoryOrCreate
      tolerations:
        - operator: Exists
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      # 持久化存储（bbolt）：filelog checkpoint + otlphttp/otlp 发送队列共用一个实例
      #（每个组件在目录下各得一个独立文件）
      file_storage:
        directory: /var/lib/otelcol
        create_directory: true

    receivers:
      # OTLP receiver — applications send traces/logs/metrics here
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/monitoring_otel-collector*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        # checkpoint 落盘：重启从断点续读（此前无 checkpoint + start_at:end，
        # 每次重启都会丢掉停机窗口内产生的日志）
        storage: file_storage
        operators:
          # container operator：自动识别 docker/containerd/CRI 三种格式、按 CRI logtag
          # 重组分段长行（>16KB 日志此前会被手写链拆成多条）、从文件路径提取
          # k8s.pod.uid/name、k8s.namespace.name、k8s.container.name 等资源属性。
          # 2026-07-31 取代此前 ~60 行手写 router/regex/move 链（与 homelab 对齐）。
          - type: container
            add_metadata_from_filepath: true

      # cloudflared metrics — ClusterIP within cloudflare namespace
      prometheus/cloudflared:
        config:
          scrape_configs:
            - job_name: 'cloudflared'
              scrape_interval: 30s
              static_configs:
                - targets: ['cloudflared-metrics.cloudflare.svc.cluster.local:2000']
                  labels:
                    cluster: oracle-k3s
                    tunnel: cloudflared

      # Node Exporter — host-level CPU/memory/disk/network metrics
      # node-exporter runs with hostNetwork:true, accessible via node IP
      prometheus/node-exporter:
        config:
          scrape_configs:
            - job_name: 'node-exporter'
              scrape_interval: 15s
              static_configs:
                - targets: ['10.0.0.26:9100']
                  labels:
                    cluster: oracle-k3s

      # Kube State Metrics — K8s object state (pods, deployments, etc.)
      prometheus/kube-state-metrics:
        config:
          scrape_configs:
            - job_name: 'kube-state-metrics'
              scrape_interval: 30s
              static_configs:
                - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']
                  labels:
                    cluster: oracle-k3s

      # Cilium Gateway Envoy L7 指标 —— zitadel 等 oracle 入口可用性 SLO
      # (k8s/helm/manifests/monitoring/slos.yaml › oracle-gateway-availability) 的数据源。
      # 对应 homelab 侧的 cilium-envoy ServiceMonitor；oracle 无 Prometheus Operator，
      # 由 otel-collector 直接抓取 headless Service cilium-envoy(:9964)。
      # keep 正则与 homelab 一致：只保留 RED SLI 所需请求指标，丢弃其余 ~5000 条 Envoy 内部指标。
      prometheus/cilium-envoy:
        config:
          scrape_configs:
            - job_name: 'cilium-envoy'
              scrape_interval: 30s
              static_configs:
                - targets: ['cilium-envoy.kube-system.svc.cluster.local:9964']
                  labels:
                    cluster: oracle-k3s
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: 'envoy_cluster_upstream_rq(_xx|_total|_time_(bucket|sum|count))?|envoy_http_downstream_rq(_xx|_time_(bucket|sum|count))?'
                  action: keep

      # External Secrets Operator metrics → homelab Prometheus (cluster=oracle-k3s).
      # Surfaces ExternalSecret/SecretStore Ready=False so a stale/expired
      # vault-token (silent secret-sync failure) trips the shared PrometheusRule.
      # Requires the ESO metrics Service — `just install-eso` now sets
      # metrics.service.enabled=true.
      prometheus/external-secrets:
        config:
          scrape_configs:
            - job_name: 'external-secrets'
              scrape_interval: 30s
              static_configs:
                - targets: ['external-secrets-metrics.external-secrets.svc.cluster.local:8080']
                  labels:
                    cluster: oracle-k3s

      # external-dns metrics → homelab Prometheus (cluster=oracle-k3s). oracle-k3s has no
      # Prometheus Operator, so (unlike homelab's ServiceMonitor) the controller's :7979
      # metrics are scraped here and remote-written. Surfaces reconcile-stalled / registry &
      # source errors so a silently-failing oracle external-dns (expired token, rate limit)
      # trips the shared external-dns PrometheusRule. The chart exposes the metrics Service
      # by default (no serviceMonitor needed).
      prometheus/external-dns:
        config:
          scrape_configs:
            - job_name: 'external-dns'
              scrape_interval: 30s
              static_configs:
                - targets: ['external-dns.external-dns.svc.cluster.local:7979']
                  labels:
                    cluster: oracle-k3s

      # OpenCost 成本指标 → homelab Prometheus (cluster=oracle-k3s)。oracle 无 Prometheus
      # Operator，故（不同于 homelab 的 ServiceMonitor）在此直抓 :9003 再 remote-write。
      # 注意 OpenCost 本身以 collector 数据源运行（直读 kubelet，不查 Prometheus）——
      # 这里只是把它的**输出**接进中枢，不构成反向依赖。
      # honor_labels 与上游 extraScrapeConfigs 一致；OpenCost 的成本指标自身不带 cluster
      # 标签，故由此处 target label 补上（homelab 侧对应 ServiceMonitor 的 metricRelabelings）。
      # 见 docs/plans/observability/2026-07-30-opencost-multicluster.md
      prometheus/opencost:
        config:
          scrape_configs:
            - job_name: 'opencost'
              honor_labels: true
              scrape_interval: 60s
              scrape_timeout: 10s
              static_configs:
                - targets: ['opencost.opencost.svc.cluster.local:9003']
                  labels:
                    cluster: oracle-k3s

      # kubelet cAdvisor 容器用量 → homelab Prometheus (cluster=oracle-k3s)。
      # 唯一消费者是 KRR（robusta-dev/krr），它只查这两个指标：
      #   container_cpu_usage_seconds_total / container_memory_working_set_bytes
      # 该端点共 ~9200 条 series，keep 正则只留 ~280 条（丢 97%），跨 Tailscale 增量可忽略
      # ——做法同上面的 cilium-envoy job。
      # 不加这条时 oracle 侧 KRR 只能看当前运行的 Pod、没有历史，推荐值无意义。
      # 需 ClusterRole 含 nodes/metrics（见本文件顶部）。
      # 见 docs/plans/observability/2026-07-30-krr-rightsizing.md
      prometheus/cadvisor:
        config:
          scrape_configs:
            - job_name: 'kubelet-cadvisor'
              scheme: https
              metrics_path: /metrics/cadvisor
              scrape_interval: 60s
              scrape_timeout: 15s
              tls_config:
                # k3s kubelet 服务证书自签，且 SAN 不含 10.0.0.26 → 跳过校验
                # （同本文件其他 exporter 的 tls.insecure 取向；流量不出节点）
                insecure_skip_verify: true
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets: ['10.0.0.26:10250']
                  labels:
                    cluster: oracle-k3s
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes)'
                  action: keep
                # cAdvisor 会为每个 Pod 额外吐一条 container="" 的汇总序列，KRR 用不到
                - source_labels: [container]
                  regex: ''
                  action: drop

    processors:
      memory_limiter:
        limit_mib: 400
        spike_limit_mib: 100
        check_interval: 5s
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.container.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
      resource:
        attributes:
          # `cluster` 是全部 dashboard/告警/SLO 的运营标签，保留；
          # `k8s.cluster.name` 是 OTel semconv 规范属性（两个都打，见 ADR）。
          - key: cluster
            value: oracle-k3s
            action: upsert
          - key: k8s.cluster.name
            value: oracle-k3s
            action: upsert
      batch:
        send_batch_size: 10000
        timeout: 5s

    exporters:
      # Logs → Loki，**集群内直达**（2026-08-02 Loki 从 homelab 迁入本集群后，
      # 这条从跨 Tailscale NodePort 变成 svc 直连；同时去掉持久化发送队列——
      # 那是为跨 WAN 链路中断准备的，同节点内不需要）
      otlphttp:
        endpoint: "http://loki-gateway.monitoring.svc.cluster.local/otlp"
        tls:
          insecure: true
      # Metrics → homelab Prometheus via Tailscale (Prometheus Remote Write)
      # （刻意不加持久化队列：PRW exporter 的 WAL 上游仍是 experimental 且有已知问题；
      #   指标断点在下一个抓取周期自愈，容忍度远高于日志/追踪）
      prometheusremotewrite:
        endpoint: "http://100.94.186.7:31090/api/v1/write"
        tls:
          insecure: true
        external_labels:
          cluster: oracle-k3s
      # Traces → Tempo，集群内直达（同上，2026-08-02 起 Tempo 在本集群）
      otlp/tempo:
        endpoint: "tempo.monitoring.svc.cluster.local:4317"
        tls:
          insecure: true
      debug:
        verbosity: basic

    service:
      extensions: [health_check, file_storage]
      telemetry:
        logs:
          level: warn
      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlphttp]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/tempo]
        metrics/cloudflared:
          receivers: [prometheus/cloudflared]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        metrics/node-exporter:
          receivers: [prometheus/node-exporter]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        metrics/kube-state-metrics:
          receivers: [prometheus/kube-state-metrics]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        metrics/external-secrets:
          receivers: [prometheus/external-secrets]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        metrics/external-dns:
          receivers: [prometheus/external-dns]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        metrics/cilium-envoy:
          receivers: [prometheus/cilium-envoy]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        metrics/opencost:
          receivers: [prometheus/opencost]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        metrics/cadvisor:
          receivers: [prometheus/cadvisor]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
