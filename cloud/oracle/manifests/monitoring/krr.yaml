# KRR (robusta-dev/krr) — 资源 requests/limits 右尺寸推荐（oracle-k3s）
# 每周一 09:15 跑一次（homelab 侧 09:00，错峰），结果推到同一个 Telegram 话题。
#
# 与 homelab 版（k8s/helm/manifests/monitoring/krr.yaml）的差异只有三处：
#   ① Prometheus 指向中枢（oracle 本地没有 Prometheus），经 Tailscale NodePort 31090
#   ② -l=oracle-k3s
#   ③ bot token 需本集群自己的 ExternalSecret（跨集群读同一个 Vault 路径，同 falcosidekick）
#
# 前置：otel-collector 的 prometheus/cadvisor receiver 必须已在跑，否则中枢 Prometheus 里
# 没有 oracle 的 container_cpu_usage_seconds_total / container_memory_working_set_bytes，
# KRR 只能看当前运行的 Pod、没有历史，推荐值无意义。
# 见 docs/plans/2026-07-30-krr-rightsizing.md
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: krr-telegram
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: krr-telegram
    creationPolicy: Owner
  data:
    - secretKey: bot-token
      remoteRef:
        key: homelab/telegram
        property: bot_token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krr
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krr
rules:
  # 全部只读：KRR 只做推荐，不改任何工作负载（enforcer 组件未部署）
  - apiGroups: [""]
    resources: ["configmaps", "namespaces", "nodes", "pods", "replicationcontrollers", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: krr
subjects:
  - kind: ServiceAccount
    name: krr
    namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: krr
  namespace: monitoring
spec:
  schedule: "15 9 * * 1" # 每周一 09:15（homelab 09:00，错峰避免同时压中枢 Prometheus）
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels: { app: krr }
          annotations:
            # 由 `just gen-embedded-scripts` 写入 krr-mem-profile.py 的 sha256 前 16 位。
            # CronJob 每轮都新建 pod、必然读到当前 ConfigMap，所以这里**不是**为了触发重启
            # （那是 Deployment 才有的问题）；留着是为了让「脚本改了」在 git diff 与 ArgoCD
            # 上可见，且与 E1 的另一半规则保持同一个形状。
            checksum/krr-mem-profile-py: "e9cf9040fa96348d"
        spec:
          restartPolicy: Never
          serviceAccountName: krr
          initContainers:
            - name: krr
              # v1.30.0 提供 linux/arm64（oracle 是 Ampere A1）；:latest 是单架构，别用
              # 2026-09-13 v1.29.0 → v1.30.0：v1.29.0 的 Debian 13 基底带 perl-base
              # 5.40.1-6，含 3 条 Critical（CVE-2026-13221 正则处理 / CVE-2026-42496
              # Archive::Tar 符号链接路径穿越 / CVE-2026-8376 正则编译堆溢出，均修在
              # 5.40.1-6+deb13u1），两集群各 2 份报告 → 合计 6 条，把
              # TrivyImageCriticalVulnerabilities 顶成 firing。
              # ☠️ 这里**不是**「升到已修版本」：v1.30.0 干脆不装 perl —— 实测 arm64 与
              #    amd64 两个变体都既无 perl-base 包、也无 /usr/bin/perl，漏洞包不复存在。
              #    （照本仓惯例实测镜像内容，不看 release notes。）
              # CLI 逐项验过无变化：krr.py 仍在 /app，--prometheus-url/--prometheus-label/
              # --history-duration/--max-workers/--width/--formatter=table/--fileoutput/
              # --quiet 全在，-l 仍是 --prometheus-cluster-label 的短选项。
              # 钉的是**多架构 index digest**（含 linux/arm64 + linux/amd64），不是单架构的。
              image: docker.io/robustadev/krr:v1.30.0@sha256:b8d782e568c7d23aac6460e69dd136e44eca67e8cbfce19915197a48dc28e23f
              command: ["python", "krr.py", "simple"]
              args:
                # 中枢 Prometheus 的 Tailscale NodePort（与 otel remote-write 同一入口，
                # 该端口暴露的是完整 Prometheus HTTP API，query 可用）
                - --prometheus-url=http://100.94.186.7:31090
                - --prometheus-label=cluster
                # 短选项不支持 `-l=value` 语法（会被当成值 "=oracle-k3s"），必须拆成两项
                - -l
                - oracle-k3s
                - --history-duration=168
                - --max-workers=3
                # 输出是附件不是终端，放宽避免 namespace/容器名被截断成 "personal…"
                - --width=300
                - --formatter=table
                - --fileoutput=/out/krr.txt
                - --quiet
              volumeMounts:
                - { name: out, mountPath: /out }
              resources:
                requests: { cpu: "50m", memory: "256Mi" }
                limits: { memory: "1Gi" }
            # 内存构成附表：把 RSS/PSS/USS 追加到 KRR 报告尾部。homelab 侧同一份脚本。
            # 为什么必须有它：KRR 的内存推荐是 max(working_set)+15%，而 working_set **含页缓存** ——
            # 它系统性地诱导上调。实测（2026-09-09，oracle）otel-collector 的建议值 52% 是页缓存、
            # databases/postgres 80%，而 argocd/application-controller 的 +400Mi 是真的（页缓存 4%）。
            # ☠️ 这个集群尤其吃不起照抄：机械应用整份报告是净 +3468Mi，而 allocatable 8869Mi
            #    已用 6689Mi(75%) —— 加完直接排不下。
            # ⚠️ PROM_URL 与上面 KRR 用的是同一个中枢 Prometheus（homelab 的 Tailscale NodePort），
            #    否则两张表的数据源不同、不可比。
            - name: mem-profile
              image: docker.io/robustadev/krr:v1.30.0@sha256:b8d782e568c7d23aac6460e69dd136e44eca67e8cbfce19915197a48dc28e23f
              command: ["python", "/scripts/krr-mem-profile.py"]
              env:
                - { name: PROM_URL, value: "http://100.94.186.7:31090" }
                - { name: CLUSTER, value: oracle-k3s }
                # 与上面 KRR 的 --history-duration=168 同窗口，否则两张表不可比
                - { name: WINDOW, value: 168h }
                - { name: OUT, value: /out/krr.txt }
              volumeMounts:
                - { name: out, mountPath: /out }
                - { name: mem-profile, mountPath: /scripts, readOnly: true }
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits: { memory: "256Mi" }
          containers:
            - name: notify
              # 8.21.0：8.11.1 的 alpine libssl3/libcrypto3 停在 3.3.2-r4，
              # 带 Critical CVE-2026-31789（需 ≥3.3.7-r0）。两集群的 krr 保持同版本。
              image: docker.io/curlimages/curl:8.21.0
              env:
                - name: BOT_TOKEN
                  valueFrom:
                    secretKeyRef: { name: krr-telegram, key: bot-token }
                - name: CLUSTER
                  value: oracle-k3s
                - name: CHAT_ID
                  value: "-1003981213530"
                - name: THREAD_ID
                  value: "2"
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  F=/out/krr.txt
                  if [ ! -s "$F" ]; then
                    echo "KRR 输出为空/缺失，判为失败" >&2
                    exit 1
                  fi
                  D=$(date +%F)
                  curl -sS --fail-with-body -X POST \
                    "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
                    -F "chat_id=${CHAT_ID}" \
                    -F "message_thread_id=${THREAD_ID}" \
                    -F "caption=📊 KRR 资源推荐 · ${CLUSTER} · ${D}
                  窗口 7d · strategy=simple（CPU p95 / 内存 max+15%）" \
                    -F "document=@${F};filename=krr-${CLUSTER}-${D}.txt" \
                    -o /dev/null -w "telegram HTTP %{http_code}\n"
              volumeMounts:
                - { name: out, mountPath: /out, readOnly: true }
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits: { memory: "64Mi" }
          volumes:
            - name: out
              emptyDir: {}
            - name: mem-profile
              configMap:
                name: krr-mem-profile
                defaultMode: 0755
