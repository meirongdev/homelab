# Loki ruler 的告警规则（LogQL）。
#
# 投递链路：oracle 的 loki-0（`-target=all`，ruler 在单体里）→ 跨 Tailscale POST 到
# homelab 的 Alertmanager（NodePort 31093，见 k8s/helm/manifests/monitoring/monitoring-external.yaml）
# → 既有的 Telegram 路由/模板。ruler 的开关与目录在 cloud/oracle/values/loki.yaml 的 `rulerConfig`。
#
# ⚠️ 两个必须同时对上的细节，错一个规则就静默不加载：
#   1. label `loki_rule` —— chart 的 sidecar（容器 loki-sc-rules）按 `LABEL=loki_rule` WATCH
#      ConfigMap；没有这个标签它根本不看这个对象。
#   2. 注解 `k8s-sidecar-target-directory: /rules/fake` —— sidecar 默认把文件平铺进 `/rules`，
#      而 Loki 的本地 ruler 存储要求 `<dir>/<租户>/`。`auth_enabled: false` ⇒ 单租户，
#      租户名固定是 **fake**。少了这个注解，文件落在 /rules 下，ruler 视而不见。
#   验证：`curl http://100.107.166.37:31080/prometheus/api/v1/rules` 里能看到本组。
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: monitoring
  labels:
    loki_rule: "1"
  annotations:
    k8s-sidecar-target-directory: /rules/fake
data:
  # ✅ 投递链路已于 2026-08-11 用一条临时 info 级自检规则端到端验证过（提交 a50ed88，
  #    验证后即删）。实测结果，供日后排障时当基线：
  #      ruler 侧 loki_prometheus_notifications_sent_total{alertmanager=".../31093/api/v2/alerts"} 0→1，
  #               errors_total=0、dropped_total=0
  #      Alertmanager 侧 收到该告警，`receivers=['null']`（severity=info 落回根路由的 null）
  #      Telegram 计数 35→35 不变，即自检没有打扰任何人
  #    要复现这个自检：加一条必然触发的规则并标 `severity: info` 即可 —— 不要用
  #    critical/warning，那会真的发到 Telegram。
  cilium-gateway-api.yaml: |
    groups:
      - name: cilium-gateway-api
        interval: 1m
        rules:
          # 2026-08-11 补：此前**没有任何告警**覆盖「Gateway API 控制器未初始化」，
          # 两集群因此静默瘫痪 30 小时（新路由全部 503，旧路由照常 200 所以无人察觉）。
          # 完整复盘：docs/records/2026-08-11-gateway-api-crd-stall.md
          #
          # 该日志由 cilium-operator 在**启动时**做 Gateway API CRD 前置检查失败时打印，
          # 两集群的日志都进同一个 Loki，靠 `cluster` 标签区分。
          - alert: CiliumGatewayAPIControllerNotInitialized
            expr: |
              sum by (cluster) (
                count_over_time(
                  {k8s_namespace_name="kube-system", k8s_container_name="cilium-operator"}
                  |= "Required GatewayAPI resources are not found" [1h]
                )
              ) > 0
            for: 2m
            labels:
              severity: critical
              component: ingress
            annotations:
              summary: "{{ $labels.cluster }} 的 Cilium Gateway API 控制器未初始化 —— 新路由全部不会生效"
              description: |
                cilium-operator 启动时的 Gateway API CRD 前置检查失败，**整个 Gateway API
                控制器没有启动**。后果非常隐蔽：
                  · 已建路由照常工作（datapath 早已编程），公网域名全部 200
                  · Pod 健康、Deployment 可用、ArgoCD Synced —— 没有任何其它信号
                  · 但**任何新增/修改的 HTTPRoute 都不会被调和**，新服务上线即 503
                典型诱因：升级了 Cilium 却没同步升 Gateway API CRD。

                处置：
                  cd k8s/helm      && just deploy-gateway-api-crds   # homelab
                  cd cloud/oracle  && just deploy-gateway-api-crds   # oracle-k3s
                看具体缺什么：
                  kubectl -n kube-system logs deploy/cilium-operator | grep -A3 "Required GatewayAPI"

                ⚠️ 本条是**启动期边沿触发**的：日志只在 operator 启动时打印一次，所以用了
                1h 窗口。它能在故障引入后一小时内报出来，但**告警自动 resolved 不等于已修复**
                —— 真正的验收是上面那条 just 配方结尾的自检，或确认新建 HTTPRoute 能拿到
                `.status`（`kubectl -n <ns> get httproute <name> -o jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'`）。
  # ───────────────────────────────────────────────────────────────────────────
  # Tetragon 运行时检测（两集群）。2026-11-20 加（homelab），2026-11-24 起 oracle 也跑 Tetragon（取代 Falco）。
  #
  # 为什么用日志而不是指标：Tetragon 会在 pod 删除后清掉该 pod 的指标序列（实测），寿命短的 pod 里
  # 的命中可能在被评估前就没了；日志行不会消失。健康类（引擎死了/策略没加载/丢事件）走 Prometheus，
  # 见 k8s/helm/manifests/monitoring/alerts/tetragon-alerts.yaml。
  #
  # 数据源：两集群的 tetragon DaemonSet → export-stdout 容器 → 各自的 OTel → 本 Loki，靠 `cluster` 标签区分。
  # 规则**不按集群过滤**：两边跑同一份策略（security/tetragon/policies/）与同一份导出过滤
  # （security/tetragon/values-common.yaml 的 exportDenyList：kube-system / cilium / 宿主（namespace 为空）
  # 以及 databases 的 `pg_isready -U postgres` 探针都挡在导出之外，这里看不到）。
  # ☠️ 反过来说，**一个集群独有的负载只在那个集群的基线里**：11-24 oracle 上线头一个小时，「应用起 shell」
  # 就被 CNPG 的 WAL 归档、browserless、s6 等 homelab 没有的负载触发（见那条规则的放行清单）。
  # 告警说明里的 kubectl context：homelab 的叫 k3s-homelab，其余与 cluster 标签同名（oracle-k3s）。
  #
  # ⚠️ 每个方向都对着现网 Loki 验过：真实窗口 [5m] 返回 0；放宽到 [3h] 命中了测试 pod（2 个策略 × 2 个
  # 节点共 4 条序列）；去掉 `tp-` 排除后多出 tp-exp-binaries，证明排除是起作用的。
  # ⚠️ 没有做端到端的真实推送验证（那会真的往 Telegram 发一条）。ruler → Alertmanager → Telegram
  # 这段已在 2026-08-11 用 info 级自检验证过，见本文件上方。
  #
  # ⚠️ 同一次 open 在日志里会出现两条事件（原因未查），所以只按「有没有」告警，不看次数。
  # ⚠️ 策略名以 `tp-` 开头的视为临时测试策略，不告警：做对照实验时别再往群里发消息。
  #    另一个不发消息的测法：测试 pod 放 kube-system（exportDenyList 不导出），用
  #    `tetra getevents --namespace kube-system --pods <pod>` 在 agent 上直接看。
  #    ☠️ 别在导出的 ns 里 `grep -r … /etc`：会顺带打开 /etc/shadow，触发凭据策略（11-24 就这么误发过一条）。
  tetragon-runtime.yaml: |
    groups:
      - name: tetragon-runtime
        interval: 1m
        rules:
          - alert: TetragonRuntimePolicyHit
            expr: |
              sum by (cluster, policy, ns, pod, binary, fn) (
                count_over_time(
                  {k8s_namespace_name="tetragon", k8s_container_name="export-stdout"}
                  |= "\"process_kprobe\""
                  | json policy="process_kprobe.policy_name", ns="process_kprobe.process.pod.namespace", pod="process_kprobe.process.pod.name", binary="process_kprobe.process.binary", fn="process_kprobe.function_name"
                  | policy!~"tp-.*"
                  [5m]
                )
              ) > 0
            labels:
              severity: warning
              component: runtime-security
            annotations:
              summary: "{{ $labels.cluster }} 容器内触发 Tetragon 策略 {{ $labels.policy }}：{{ $labels.ns }}/{{ $labels.pod }} 的 {{ $labels.binary }}（{{ $labels.fn }}）"
              description: |
                容器里的进程做了「正常业务几乎不会做」的事：
                  · container-escape-syscalls：ptrace / process_vm_writev / 装卸内核模块 / kexec / open_by_handle_at
                  · sensitive-file-access：打开 /etc/shadow、sudoers、/root/.ssh 等凭据路径
                策略是**只观察**的（没有拦截），所以进程已经成功执行了，需要人判断是不是误报。

                先看是谁、做了什么：
                  # Loki
                  {k8s_namespace_name="tetragon", cluster="{{ $labels.cluster }}"} |= "process_kprobe" |= "{{ $labels.pod }}"
                  # 事件全文（含 argv、父进程、容器 id）
                  kubectl --context {{ if eq $labels.cluster "homelab" }}k3s-homelab{{ else }}{{ $labels.cluster }}{{ end }} -n tetragon logs ds/tetragon -c export-stdout --since=15m | grep {{ $labels.pod }}
                再看这个 pod：`kubectl --context {{ if eq $labels.cluster "homelab" }}k3s-homelab{{ else }}{{ $labels.cluster }}{{ end }} -n {{ $labels.ns }} describe pod {{ $labels.pod }}`，
                是不是刚 `kubectl exec` 进去过、镜像是不是预期的那一个。

                ⚠️ 这条告警只覆盖**导出之后**的事件：kube-system / cilium / 宿主进程在
                security/tetragon/values-common.yaml 的 exportDenyList 里被丢弃，不会到这里。
                已知噪声（apps-pg 的 pg_isready 探针）同理，日志里没有它，见
                security/tetragon/policies/sensitive-file-access.yaml。

          # 应用进程起了 shell（2026-11-22）：webshell / RCE 最典型的形态——node、python、java 这类业务
          # 进程本不该 fork 出 sh。数据源是 Tetragon 默认就有的 process_exec，不需要新 TracingPolicy。
          #
          # 判据刻意收窄成「父进程是应用」：父进程是 containerd-shim / runc 的 shell 是容器入口、exec 探针
          # 或 `kubectl exec`，三者混在一起分不开（7 天 689 次 shell 里 ~600 次是这类，Trivy 扫描 Job 就占 ~500），
          # 报它只会把人训练成忽略告警。代价：**`kubectl exec` 进去起的 shell 不在这条的视野里**——
          # 能 exec 的人已经有 API 权限，那是另一层的事。shell 再起 shell 也不报（第一个 shell 已经报过了）。
          #
          # 放行清单按「父进程参数 + 子进程参数」精确写，**不要按 namespace 放行**（那等于给整个 ns 开后门）：
          #   · litellm：Prisma 在 `prisma --version` / `migrate deploy` 时用 `sh -c "ldconfig -p | … grep libssl"`
          #     探测 OpenSSL，每次 pod 启动 6 条。只放行「父进程是 prisma 且命令是 ldconfig -p」这一种组合。
          #   · open-notebook：supervisord（python）按配置拉起 worker（`dash -c "uv run …"`），等同容器入口。
          #   · kube-bench（审计命令）、apk（backup 的包触发器）按父进程排除。
          #   以下四条是 2026-11-24 oracle 上线头一小时冒出来的（homelab 没有这些负载，7 天基线里看不到）：
          #   · CNPG：postgres 的 archive_command 是 `sh -c "/controller/manager wal-archive …"`，每次切 WAL 段一次
          #     （zitadel-pg、apps-pg）。只放行「父进程是 postgres 且命令是 manager wal-archive/restore」。
          #   · s6-overlay：`s6-supervise` 用 `bash ./run <服务>` 拉起服务（calibre 那组），等同 supervisord。
          #   · rsshub-browserless：node `./build/index.js` 用 `sh -c "cat /proc/stat … | grep cpu"` 取 CPU 负载。
          #   · rsshub：容器入口经 npm 起 `dash -c "cross-env NODE_ENV=production … node dist/index.mjs"`。
          #   后两类在 Tetragon 启动时会给存量进程补发 exec 事件（flags=procFS），所以每次 agent 或容器重启都会再来。
          # 基线：homelab 用完整管道回放 7 天，**只命中 11-20 两次策略测试的 tp-exp pod**（python3 → sh），这正好
          # 是正向对照；分别去掉 Prisma / supervisord 两条放行，对应的 12 / 2 条合法事件会冒出来。
          # ☠️ oracle 的基线截至 11-24 只有上线后的一小时：每天/每小时才跑一次的合法 shell 还可能冒出来，
          # 冒出来就照同样写法补一条精确放行，并重放确认只多排除了那一种。
          - alert: TetragonAppSpawnedShell
            expr: |
              sum by (cluster, ns, pod, parent, binary) (
                count_over_time(
                  {k8s_namespace_name="tetragon", k8s_container_name="export-stdout"}
                  |= "\"process_exec\""
                  | json binary="process_exec.process.binary", args="process_exec.process.arguments", ns="process_exec.process.pod.namespace", pod="process_exec.process.pod.name", parent="process_exec.parent.binary", pargs="process_exec.parent.arguments"
                  | ns!=""
                  | binary=~".*/(sh|bash|ash|dash|zsh|ksh|busybox)"
                  | parent!~".*/(containerd-shim-runc-v2|runc|sh|bash|ash|dash|zsh|ksh|busybox|kube-bench|apk)|/lib/apk/exec/.*"
                  | pargs!~".*supervisord.*"
                  | (pargs!~".*node_modules/\\.bin/prisma.*" or args!~".*ldconfig -p.*")
                  | (parent!~".*/postgresql/[0-9]+/bin/postgres" or args!~".*/controller/manager wal-(archive|restore) .*")
                  | (parent!~".*/s6-supervise" or args!~"\\./run( .*)?")
                  | (pargs!~"\\./build/index\\.js" or args!~".*cat /proc/stat 2>/dev/null [|] grep cpu.*")
                  | (parent!~".*/node" or args!~".*cross-env NODE_ENV=production .*node dist/index[.]mjs.*")
                  [5m]
                )
              ) > 0
            labels:
              severity: warning
              component: runtime-security
            annotations:
              summary: "{{ $labels.cluster }} 容器里的应用进程起了 shell：{{ $labels.ns }}/{{ $labels.pod }} 的 {{ $labels.parent }} → {{ $labels.binary }}"
              description: |
                业务进程（不是容器入口、不是 kubectl exec）fork 出了 shell，这是 webshell / 命令注入的典型形态。
                基线里除了策略测试之外为零，所以先按真的处理，再判断是不是新的合法行为。

                看它执行了什么（argv 在事件里）：
                  # Loki
                  {k8s_namespace_name="tetragon", k8s_container_name="export-stdout", cluster="{{ $labels.cluster }}"} |= "process_exec" |= "{{ $labels.pod }}" |= "{{ $labels.binary }}"
                  kubectl --context {{ if eq $labels.cluster "homelab" }}k3s-homelab{{ else }}{{ $labels.cluster }}{{ end }} -n tetragon logs ds/tetragon -c export-stdout --since=15m | grep {{ $labels.pod }}
                再看同一个 pod 在这前后还做了什么（同一条查询去掉 binary 过滤），以及它最近有没有发版：
                `kubectl --context {{ if eq $labels.cluster "homelab" }}k3s-homelab{{ else }}{{ $labels.cluster }}{{ end }} -n {{ $labels.ns }} describe pod {{ $labels.pod }}`。

                确认是合法的新行为（比如升级后某个库开始在启动时调 shell）：在
                cloud/oracle/manifests/monitoring/loki-rules.yaml 照 Prisma / CNPG 那几条写**父进程参数 + 命令**的
                精确放行，别按 namespace 放行，改完重放确认只多排除了这一种。
                ⚠️ kube-system / cilium / 宿主进程被 exportDenyList 丢弃，不在这条的视野里。

          # 无文件 / 临时目录执行（2026-11-24，移植自 Falco 的「Execution from /dev/shm」「Fileless execution via
          # memfd_create」，并近似「Drop and execute new binary in container」最常见的形态：下载器把载荷写进可写
          # 临时目录再执行）。process_exec 自带，不需要新 TracingPolicy。
          #   · /proc/<pid>/fd/N：fexecve(memfd) 的形态。runc 的 `init` 自我重执行同样长这样，已在
          #     values-common.yaml 的 exportDenyList 里按「父进程 runc + 参数 init」三条件精确挡掉，**别放宽那一条**。
          #   · /dev/shm 实测**能执行**（容器里没挂 noexec，11-24 在 oracle 上 cp busybox 进去跑成功了）。
          # 验证（11-24）：oracle 测试 pod 里 /tmp、/dev/shm、memfd 三种执行全部命中；两集群全部可用历史
          # （homelab 7 天 5397 条 exec + oracle 上线后）回放 0 命中——/tmp 原本担心噪声，实测为零。
          - alert: TetragonFilelessExec
            expr: |
              sum by (cluster, ns, pod, parent, binary) (
                count_over_time(
                  {k8s_namespace_name="tetragon", k8s_container_name="export-stdout"}
                  |= "\"process_exec\""
                  | json binary="process_exec.process.binary", ns="process_exec.process.pod.namespace", pod="process_exec.process.pod.name", parent="process_exec.parent.binary"
                  | ns!=""
                  | binary=~"/dev/shm/.*|/proc/(self|[0-9]+)/fd/[0-9]+|/memfd:.*|.*[(]deleted[)]|/tmp/.*|/var/tmp/.*"
                  [5m]
                )
              ) > 0
            labels:
              severity: warning
              component: runtime-security
            annotations:
              summary: "{{ $labels.cluster }} 容器里从临时目录 / 内存执行程序：{{ $labels.ns }}/{{ $labels.pod }} 的 {{ $labels.parent }} → {{ $labels.binary }}"
              description: |
                镜像里的程序不会放在 /tmp、/dev/shm，也不会从 memfd（/proc/self/fd/N）执行——这是「下载载荷再执行」
                或无文件执行的形态。基线为零，先按真的处理。
                  # 事件全文（含 argv、父进程）
                  {k8s_namespace_name="tetragon", k8s_container_name="export-stdout", cluster="{{ $labels.cluster }}"} |= "process_exec" |= "{{ $labels.pod }}"
                  kubectl --context {{ if eq $labels.cluster "homelab" }}k3s-homelab{{ else }}{{ $labels.cluster }}{{ end }} -n {{ $labels.ns }} describe pod {{ $labels.pod }}
                合法的新行为（某个工具在 /tmp 解压再运行）照 TetragonAppSpawnedShell 的写法加**父进程 + 程序**的精确放行。

          # 攻击工具命令行（2026-11-24，移植自 Falco 的「Netcat Remote Code Execution in Container」
          # 「Search Private Keys or Passwords」「Find AWS Credentials」「Remove Bulk Data from Disk」
          # 「Debugfs Launched in Privileged Container」，以及「Clear Log Activities」里截断 /var/log 的那一半）。
          # 只看程序名 + 参数，不加内核钩子：
          #   · nc/ncat/socat 带 -e / -c / --exec / EXEC: / SYSTEM:（反弹 shell）
          #   · grep/find/rg 的参数里有私钥标记、ssh 私钥名、云凭据 / kubeconfig / docker 凭据文件名
          #   · shred / wipefs / mkfs* / debugfs（任何参数）；truncate 作用于 /var/log
          #   · busybox 直接调用（`busybox nc -e …`）：此时程序是 /bin/busybox，子命令在参数里，单独一支。
          #     经软链调用（alpine 的 /bin/grep → busybox）Tetragon 报的是调用路径 /bin/grep，走上面几支（11-24 核过
          #     kube-bench 的 alpine 镜像）。
          # 刻意不含「password」字样：grep password 的合法用法太多，加了只会被训练成忽略。
          # 验证（11-24）：oracle 测试 pod 里 nc -e、busybox nc -e、grep 私钥标记、find id_rsa、shred 全部命中，
          # 对照（nc -h、grep localhost、find hosts）不命中；两集群全部可用历史回放 0 命中。
          - alert: TetragonAttackToolExec
            expr: |
              sum by (cluster, ns, pod, binary) (
                count_over_time(
                  {k8s_namespace_name="tetragon", k8s_container_name="export-stdout"}
                  |= "\"process_exec\""
                  | json binary="process_exec.process.binary", args="process_exec.process.arguments", ns="process_exec.process.pod.namespace", pod="process_exec.process.pod.name"
                  | ns!=""
                  | ( binary=~".*/(nc|ncat|netcat|nc[.]traditional|nc[.]openbsd|socat)" and args=~"(.* )?(-e|-c|--exec|--sh-exec|--lua-exec)( .*)?|.*(EXEC|SYSTEM):.*" ) or ( binary=~".*/(grep|egrep|fgrep|rg|find)" and args=~"(?i).*(BEGIN [A-Z ]*PRIVATE KEY|id_rsa|id_dsa|id_ecdsa|id_ed25519|aws_secret_access_key|[.]aws/credentials|[.]kube/config|[.]docker/config[.]json|[.]git-credentials|[.]pgpass|[.]netrc).*" ) or binary=~".*/(shred|wipefs|debugfs|mkfs([.][a-z0-9]+)?)" or ( binary=~".*/truncate" and args=~".*/var/log/.*" ) or ( binary=~".*/busybox" and args=~"(?i)((nc|netcat) (.* )?(-e|-c) .*|(grep|egrep|fgrep|find) .*(BEGIN [A-Z ]*PRIVATE KEY|id_rsa|id_dsa|id_ecdsa|id_ed25519|aws_secret_access_key|[.]aws/credentials|[.]kube/config|[.]docker/config[.]json|[.]git-credentials|[.]pgpass|[.]netrc).*|(shred|wipefs|debugfs|mkfs[.a-z0-9]*)( .*)?)" )
                  [5m]
                )
              ) > 0
            labels:
              severity: warning
              component: runtime-security
            annotations:
              summary: "{{ $labels.cluster }} 容器里运行了攻击常用的命令：{{ $labels.ns }}/{{ $labels.pod }} 的 {{ $labels.binary }}"
              description: |
                反弹 shell（nc -e）、翻找私钥 / 云凭据、擦盘 / 清日志、debugfs 这类命令在正常业务里不会出现，基线为零。
                看完整命令行（argv 已按 redactionFilters 脱敏）：
                  {k8s_namespace_name="tetragon", k8s_container_name="export-stdout", cluster="{{ $labels.cluster }}"} |= "process_exec" |= "{{ $labels.pod }}" |= "{{ $labels.binary }}"
                  kubectl --context {{ if eq $labels.cluster "homelab" }}k3s-homelab{{ else }}{{ $labels.cluster }}{{ end }} -n {{ $labels.ns }} describe pod {{ $labels.pod }}
                规则写法与边界见 cloud/oracle/manifests/monitoring/loki-rules.yaml 里这条规则上方的注释。
