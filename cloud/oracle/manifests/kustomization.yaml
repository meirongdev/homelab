apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Base infrastructure
  - base/vault-store.yaml
  - base/namespace-cloudflare.yaml
  - base/cloudflare-tunnel.yaml
  - base/gateway.yaml
  # CoreDNS 扩展：把 OCI VCN 私有后缀交给 OCI 解析器，修 musl pod 的阵发性 DNS 失败
  # （2026-08-13 备份 Job 三连挂的根因，来龙去脉全在文件头注释里）
  - base/coredns-custom.yaml
  # PriorityClasses（控制面驱逐优先级，见 base/priorityclasses.yaml）
  - base/priorityclasses.yaml
  # external-dns: ns + Cloudflare token ExternalSecret (chart is ArgoCD-managed, see
  # argocd/applications/external-dns-oracle.yaml + cloud/oracle/values/external-dns.yaml)
  - base/namespace-external-dns.yaml
  - base/external-dns.yaml
  # 共享数据库平台（2026-08-06）。CNPG Cluster `apps-pg` —— 应用不再各自起 postgres，
  # 加 Database/DatabaseRole CR 即可（必须与 Cluster 同 ns，见 apps-pg-cluster.yaml）。
  # cnpg-operator 本身是独立 ArgoCD App（argocd/applications/cnpg-operator.yaml）。
  # ⚠️ 排在 rss-system 之前只是可读性——kustomize 不按列表顺序 apply。
  - databases/namespace.yaml
  - databases/apps-pg-secrets.yaml
  - databases/apps-pg-cluster.yaml
  # RSS system —— 工作负载已于 2026-09-08 拆给独立 App `oracle-rss`
  # （argocd/applications/oracle-rss.yaml，目录源 cloud/oracle/manifests/rss-system）。
  # ☠️ `namespace.yaml` 刻意**留在本树**：Namespace 被 prune 会级联删光 ns 下一切，
  #    `Prune=false` 拦不住（2026-08-03 的事故）。新 App 用 directory.exclude 排除它。
  #    别"顺手"把这行也搬走。
  # ⚠️ rss 的 HTTPRoute 与 ReferenceGrant 不在 rss-system/ 目录里，而在 base/gateway.yaml，
  #    因此也仍归本树 —— 拆分不影响对外路由。
  - rss-system/namespace.yaml
  # Homepage
  - homepage/namespace.yaml
  - homepage/homepage.yaml
  # Uptime Kuma —— 工作负载已于 2026-09-08 拆给 `oracle-uptime-kuma` App。
  # ☠️ 这一行 namespace.yaml 声明的是 **personal-services**（不是 uptime-kuma），
  #    而且是**整个 personal-services ns 的唯一来源** —— calibre-web / readlist /
  #    excalidraw 和 5 个 PVC 全在那个 ns 里。被 prune 会级联删光，别动它。
  - uptime-kuma/namespace.yaml
  # Observability
  # 2026-08-02 起本集群不再只是「轻量采集端」：Loki(日志)+Tempo(追踪) 已从 homelab 迁入
  # （工作负载由独立的 loki / tempo Helm App 部署，同 falco 模式；此处只放 NodePort 入口）。
  # Prometheus/Grafana/Alertmanager 仍在 homelab——它们要贴着抓取目标，不搬。
  # 工作负载已于 2026-09-08 拆给 `oracle-monitoring` App（kustomize 源，
  # cloud/oracle/manifests/monitoring/kustomization.yaml —— configMapGenerator 也搬过去了）。
  # ☠️ namespace.yaml 留在本树（ns 被 prune 会级联删光）。
  - monitoring/namespace.yaml
  # OpenCost 成本归因：仅 namespace（工作负载由独立 opencost-oracle Helm App 部署，同 falco 模式）
  # 见 docs/plans/observability/2026-07-30-opencost-multicluster.md
  - opencost/namespace.yaml
  # Falco 运行时检测：namespace + falcosidekick→Telegram token（Falco 工作负载由独立 falco Helm App 部署）
  - falco/namespace.yaml
  - falco/falcosidekick-secret.yaml
  # Backup: serverless restic → 106 ZFS 仓库（Tailscale sftp）。见 plans/2026-07-06-…backup-redesign.md
  # 2026-07-07 与 homelab 合并为 kustomize base+overlay（repo 根 backup/）
  - ../../../backup/overlays/oracle
  # Gotify 已于 2026-07 下线（Falco/dead-man's switch/RSS 推送均已迁 Telegram 或砍掉）
  # ZITADEL (SSO): 迁自 homelab 2026-07-06。auth.meirong.dev 已切 oracle tunnel。
  # ⚠️ bootstrap 依赖（不入 git）: Secret `login-client`(zitadel ns，Login V2 PAT，从 homelab 拷入，
  #   因 setup job 在已恢复的 DB 上跳过创建它)；masterkey/db-password 经 ESO 读 secret/homelab/zitadel。
  # 工作负载（ZITADEL 本体 + CNPG Cluster 与凭据）已于 2026-09-08 拆给
  # `oracle-zitadel` App。☠️ namespace.yaml 留在本树。
  - zitadel/namespace.yaml
  # ArgoCD 控制面（2026-08-02 从 homelab 迁入）。这里只放 ns 与两个 ESO 凭据；
  # ArgoCD 工作负载本身是 manual-helm（`cd k8s/helm && just deploy-argocd`），
  # 刻意不让 GitOps 控制器自管自己。
  - argocd/namespace.yaml
  - argocd/homelab-cluster-external-secret.yaml
  - argocd/argocd-oidc-external-secret.yaml
  # 入口路由。2026-08-02 按 runbook 的顺序挂上：先摘 homelab 侧路由 → 删 Cloudflare 的
  # CNAME(argocd) 与 owner TXT(cname-argocd) → 才挂这一行。顺序反了会建出重复 CNAME
  # （两侧 external-dns 都是 upsert-only 且 owner TXT 不同，谁也删不掉对方的记录）。
  - argocd/route-argocd.yaml
  # Personal services (IT-Tools, Stirling-PDF, Squoosh, Timeslot, Trends, Excalidraw, Calibre-Web)
  # calibre 全家 2026-08-02 从 homelab 迁入（动机是磁盘：书库 23GB 是那台笔记本 VM 上
  # 最大的单一数据集）。open-notebook-ingest 跟着**书**走 —— 它挂载书库 PVC，而
  # open-notebook 应用本身留在 homelab，故改成经公网 API 推送。
  # 护栏必须与 ebook-sync-monitor 同在（它当年泄漏 92 个 Job pod 打爆过节点）
  # 入口路由。2026-08-03 按顺序挂上：先摘 homelab 侧路由 → 删 CF 的 CNAME(book) 与
  # owner TXT(cname-book) → 才挂这一行。顺序反了会建出重复 CNAME。
  # ⚠️ calibre-metadata/ 目录也**不在**这棵 kustomize 树里 —— 它是独立的 ArgoCD App
  # （argocd/applications/calibre-metadata.yaml），因为一次性 enrich Job 需要专门的
  # ignoreDifferences（job-controller 会注入 suspend/selector/labels，否则永久 OutOfSync）。
  # bentopdf 2026-08-11 取代 stirling-pdf（同域名 pdf.meirong.dev）。
  # 纯客户端 WASM 应用：无 PVC / 无 ExternalSecret / 无 OIDC。
  # readlist（技术书评分/书单站，2026-08-05 上线）。它是本 ns 里**唯一跨应用读别人卷**的
  # 工作负载：snapshot CronJob 挂 calibre-books-local(RW，WAL 要写 -shm) 与
  # calibre-web-automated-config-local(只读)，故必须排在 calibre-web.yaml 之后理解——
  # 但 kustomize 不按列表顺序 apply，真正的依赖是那两个 PVC 存在（已存在）。

# ⚠️ otel-collector 的 configMapGenerator 已随 monitoring 组搬到
# cloud/oracle/manifests/monitoring/kustomization.yaml（2026-09-08，开放项 #13）。
# 那里的文件头写着为什么它不能退化成普通 ConfigMap、也不能改成 ArgoCD 目录源。
# ⚠️ 实测搬家前后生成名一致（otel-collector-config-5989tb9bmm），故 DaemonSet 不滚动。
