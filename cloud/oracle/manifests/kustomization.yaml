apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Base infrastructure
  - base/vault-store.yaml
  - base/cloudflare-tunnel.yaml
  - base/gateway.yaml
  # external-dns: ns + Cloudflare token ExternalSecret (chart is ArgoCD-managed, see
  # argocd/applications/external-dns-oracle.yaml + k8s/helm/values/external-dns-oracle.yaml)
  - base/external-dns.yaml
  # RSS system
  - rss-system/namespace.yaml
  - rss-system/secrets.yaml
  - rss-system/miniflux.yaml
  - rss-system/rsshub.yaml
  - rss-system/karakeep.yaml
  - rss-system/redpanda-connect.yaml
  # Homepage
  - homepage/namespace.yaml
  - homepage/homepage.yaml
  # Uptime Kuma
  - uptime-kuma/namespace.yaml
  - uptime-kuma/uptime-kuma.yaml
  - uptime-kuma/secrets.yaml
  - uptime-kuma/provisioner.yaml
  # Observability
  # 2026-08-02 起本集群不再只是「轻量采集端」：Loki(日志)+Tempo(追踪) 已从 homelab 迁入
  # （工作负载由独立的 loki / tempo Helm App 部署，同 falco 模式；此处只放 NodePort 入口）。
  # Prometheus/Grafana/Alertmanager 仍在 homelab——它们要贴着抓取目标，不搬。
  - monitoring/namespace.yaml
  - monitoring/otel-collector.yaml
  - monitoring/exporters.yaml
  - monitoring/monitoring-external.yaml
  # KRR 右尺寸推荐周报（查中枢 Prometheus，结果推 Telegram）
  - monitoring/krr.yaml
  # OpenCost 成本归因：仅 namespace（工作负载由独立 opencost-oracle Helm App 部署，同 falco 模式）
  # 见 docs/plans/observability/2026-07-30-opencost-multicluster.md
  - opencost/namespace.yaml
  # Falco 运行时检测：namespace + falcosidekick→Telegram token（Falco 工作负载由独立 falco Helm App 部署）
  - falco/namespace.yaml
  - falco/falcosidekick-secret.yaml
  # Backup: serverless restic → 106 ZFS 仓库（Tailscale sftp）。见 plans/2026-07-06-…backup-redesign.md
  # 2026-07-07 与 homelab 合并为 kustomize base+overlay（repo 根 backup/）
  - ../../../backup/overlays/oracle
  # Gotify 已于 2026-07 下线（Falco/dead-man's switch/RSS 推送均已迁 Telegram 或砍掉）
  # ZITADEL (SSO): 迁自 homelab 2026-07-06。auth.meirong.dev 已切 oracle tunnel。
  # ⚠️ bootstrap 依赖（不入 git）: Secret `login-client`(zitadel ns，Login V2 PAT，从 homelab 拷入，
  #   因 setup job 在已恢复的 DB 上跳过创建它)；masterkey/db-password 经 ESO 读 secret/homelab/zitadel。
  - zitadel/zitadel.yaml
  # ZITADEL DB 迁 CloudNativePG（Phase 0，并行部署验证；cutover 是单独一步，见
  # decisions/ 记录）。cnpg-operator 本身是独立 ArgoCD App（argocd/applications/cnpg-operator.yaml）。
  - zitadel/zitadel-pg-secrets.yaml
  - zitadel/zitadel-pg-cluster.yaml
  # Personal services (IT-Tools, Stirling-PDF, Squoosh, Timeslot, Trends, Excalidraw)
  - personal-services/it-tools.yaml
  - personal-services/stirling-pdf.yaml
  - personal-services/squoosh.yaml
  - personal-services/timeslot.yaml
  - personal-services/trends.yaml
  - personal-services/excalidraw.yaml

# ⚠️ otel-collector 的配置必须走 configMapGenerator，不能写成普通 ConfigMap 资源。
# 2026-08-02 实测踩坑：把配置改成写 oracle 本地 Loki 后，ConfigMap 更新了、
# DaemonSet spec 没变 → **Pod 根本不重启**（实测 age 2d5h / 0 restart），
# 而 OTel Collector 只在启动时读一次配置文件 → 改动静默不生效，日志仍旧发往老地址。
# （homelab 侧没这个问题：Helm chart 会在 pod template 上打 configmap checksum 注解。）
# configMapGenerator 给生成的 ConfigMap 名字加内容哈希后缀，并自动重写 DaemonSet 的
# volume 引用 → 配置一变，名字就变，DaemonSet 随之滚动。改配置只需改
# monitoring/otel-collector-config.yaml。
configMapGenerator:
  - name: otel-collector-config
    namespace: monitoring
    files:
      - config.yaml=monitoring/otel-collector-config.yaml
