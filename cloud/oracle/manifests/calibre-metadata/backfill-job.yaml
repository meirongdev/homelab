---
# 回补作业。**刻意用「挂起的 CronJob」而不是裸 Job**，这是从 enrich-job.yaml 那个
# 坑里学到的：裸 `kind: Job` 的 `spec.template` 在 API server 层不可变，改任何一个
# 字段（哪怕只是 requests 或一个 env）都会 apply 报 `field is immutable`
# → calibre-metadata App 永久 OutOfSync，且失败的 sync 会把 revision 钉住、
# 后续修复提交一起卡住（enrich-job.yaml 里有整段注释在讲这个代价）。
#
# 而本作业**天生就要改参数反复跑**：先 DRY_RUN=1 看命中率，再 DRY_RUN=0 小批试写，
# 最后分批推进 LIMIT。用裸 Job 等于每改一次就要 `kubectl delete job` —— 而删掉重建
# 会让它**从头再跑一遍**。CronJob 的 jobTemplate 是可变的，改完 git push 即可。
#
# suspend: true —— 永不自动触发。每次要跑就手动派生一个 Job：
#   kubectl --context oracle-k3s -n personal-services create job backfill-dry-1 \
#     --from=cronjob/calibre-metadata-backfill
# 看日志：
#   kubectl --context oracle-k3s -n personal-services logs -f job/backfill-dry-1
# 跑完自己清：
#   kubectl --context oracle-k3s -n personal-services delete job backfill-dry-1
#
# ⚠️ 手动派生的 Job 不在 git 里，ArgoCD 不认识它，也不会 prune 它 —— 记得自己删，
#    否则完成的 Job pod 会一直占着 `personal-services` 的 pod 配额视图。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: calibre-metadata-backfill
  namespace: personal-services
spec:
  # ── 2026-08-24：补 startingDeadlineSeconds（CronJobSpec 字段）──────────────
  # Forbid 下每次"上一轮还在跑"都记作 missed，累计 >100 次后 CronJob **永久停止
  # 调度**且不自愈（上游 CronJob 文档的 "too many missed start times"）。设了它，
  # 控制器改为从该窗口往前数 missed，而不是从上次排期一路数下去。
  # 3600s 照 backup 的先例：本作业独立、无级间依赖（不像 readlist 那条流水线要
  # 压到 600s），语义是"一小时内没起来就等下一轮"。
  startingDeadlineSeconds: 3600
  # 2026-08-08 从「永不自动跑」改成**每周日 06:00 UTC**。
  # 起因：新导入的书此前只能拿到夜间 updater 从文件内嵌抠的封面，
  # 标识符/简介/标签/出版社全都要人手动跑一次才有 —— 等于整条流水线只对存量有效。
  #
  # 只有本作业适合自动跑，判据是「**只填空、绝不覆盖、幂等**」：
  #   · correct 会覆盖已有值 → 保持挂起，跑前要人备份并核对；
  #   · covers  产出低（13/54）且要烧 Google 配额 → 保持挂起；
  #   · llm     生成内容而非查证 → 保持挂起，必须人工核样本。
  #
  # 06:00 UTC 刻意避开三个窗口：readlist ingest 01:20（**共用同一份
  # Google Books 配额**）、restic 备份 03:00、calibre-metadata-updater 04:00。
  suspend: false
  schedule: "0 6 * * 0" # 每周日 06:00 UTC
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # activeDeadlineSeconds 是 **JobSpec** 字段，必须在 jobTemplate.spec 下 ——
      # 放到 CronJob 的 spec 下是未知字段、会被静默丢弃。
      # 它是**断卡死的开关，不是性能预算**：Forbid 下卡住的 Job 无限期占着
      # "上一轮还在跑"，把后续排期全顶掉，而没 deadline 就没人杀它。到点标 Failed
      # → KubeJobFailed(warning) 当晚响，不再静默堵下去。
      # 实测**只有 2 次**、均 ~593s；且它走网络抓 Google Books（方差风险高）→ 给到 7200s ≈ 12x
      activeDeadlineSeconds: 7200
      # 2026-08-06 从 0 改成 2，理由同 correct-job.yaml：脚本**幂等**（每次重新查
      # 「还有空字段的书」，已填好的不再命中），而作业跑在 bulk(-10)、
      # 节点内存常年 90%+，被驱逐是常态。backoffLimit=0 会让一次驱逐判死整个作业。
      backoffLimit: 2
      ttlSecondsAfterFinished: 259200 # 3 天
      template:
        metadata:
          labels:
            app: calibre-metadata
            role: backfill
        spec:
          restartPolicy: Never
          priorityClassName: bulk
          containers:
            - name: backfill
              image: crocodilestick/calibre-web-automated@sha256:4ff5be5cd6f18d91cc72bf316260d8c34c980f09a862372bc77d25c9ddb0efef
              command: ["python3", "/scripts/backfill_metadata.py"]
              env:
                # ⚠️ 没有它 calibre 的二进制起不来（libcalibre-launcher.so 找不到）。
                - name: LD_LIBRARY_PATH
                  value: "/app/calibre/lib"
                - name: TZ
                  value: "Asia/Shanghai"
                # ── 这两个按需改，改完 git push 即可（CronJob 模板可变，这正是不用裸 Job 的原因）──
                # "1" = 只报告不写库。
                # 已于 2026-08-06 完成两轮验证后才置 0：
                #   · DRY_RUN=1 LIMIT=8  → 8/8 命中、cov 全 1.00、ISBN 路径走通；
                #   · DRY_RUN=0 LIMIT=3  → 逐字段比对确认只补空缺（id=3 已有 tags 被正确跳过），
                #     pubdate/title/authors/comment/publisher 逐字节未变。
                # 换库、换数据源或改匹配门之后，**先翻回 "1" 重跑一轮**再置 0。
                - name: DRY_RUN
                  value: "0"
                # ⚠️ 定时跑的三个参数是一套，别单独改其中一个：
                #
                # ORDER_MODE=newest —— **不加这个定时就是空转**。默认的 `ORDER BY id`
                #   升序配上 LIMIT，每次都是同一批最低 id 的老书（那批恰恰是反复
                #   失败的硬骨头），新导入的书 id 最大、永远轮不到。
                # RECENT_DAYS=30 —— 只看最近 30 天加入的。不加的话每周都会在那批
                #   查不到的老书上重烧 Google Books 配额，而那份配额和 readlist 的
                #   夜间 ingest 是共用的。
                # LIMIT=150 —— 约 25–30 分钟。一次导入几百本的话，剩下的下周继续
                #   （只要还在 30 天窗口内）。
                #
                # 脚本每本一次 commit，中途被杀不回滚已完成的部分，重跑自然跳过已补好的。
                # 要**手动全量**跑存量时，派生后把这三个改成 ORDER_MODE=id、
                # RECENT_DAYS=0、LIMIT 给足。
                - name: ORDER_MODE
                  value: "newest"
                - name: RECENT_DAYS
                  value: "30"
                - name: LIMIT
                  value: "150"
              resources:
                requests:
                  # 主要是等网络（每本约 3s），CPU 只在 fetch 起进程的瞬间用。
                  # 节点 2 OCPU、requests 已占约 77%，这里克制一点。
                  cpu: 100m
                  memory: 256Mi
                limits:
                  # 写 "1" 而非 1000m：API server 会把 1000m 规范化成 1，
                  # 不一致会让 SSA diff 永久 OutOfSync（同 enrich-job.yaml 的教训）。
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: calibre-library
                  mountPath: /calibre-library
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: calibre-library
              persistentVolumeClaim:
                claimName: calibre-books-local
            - name: scripts
              configMap:
                name: metadata-backfill-script
                defaultMode: 0755
