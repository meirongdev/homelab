---
apiVersion: batch/v1
kind: Job
metadata:
  name: calibre-metadata-enrich
  namespace: personal-services
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800  # 7天后自动清理
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: metadata-enrich
          image: crocodilestick/calibre-web-automated@sha256:4ff5be5cd6f18d91cc72bf316260d8c34c980f09a862372bc77d25c9ddb0efef
          command:
            - python3
            - /scripts/enrich_metadata.py
          env:
            - name: LD_LIBRARY_PATH
              value: "/app/calibre/lib"
            - name: TZ
              value: "Asia/Shanghai"
          resources:
            # ⚠️ 2026-08-05 缩容那轮把全集群 CPU requests 砍了一遍，**这里刻意维持 200m**：
            # 本文件是裸 `kind: Job`（不是 CronJob），`spec.template` 在 API server 层
            # 不可变。集群里 `calibre-metadata-enrich` 还在（Complete，`ttlSecondsAfterFinished`
            # 7 天），改这个值 → apply 报 `field is immutable` → calibre-metadata App
            # 永久 OutOfSync，且失败的 sync 会把 revision 钉住、后续修复提交一起卡住。
            # 一次性 Job 不常驻，200m 只在它真正运行的几秒钟内占坑，不值得为它冒这个险。
            # 真要改：先 `kubectl delete job calibre-metadata-enrich`——但那会让它**重跑一遍**富集。
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # 写 "1" 而非 1000m: API server 会把 1000m 规范化为 1，Job template 不可变，
              # 二者不一致会让 SSA diff 永久 OutOfSync 且无法 apply（field is immutable）。
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: calibre-library
              mountPath: /calibre-library
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: calibre-library
          persistentVolumeClaim:
            claimName: calibre-books-local
        - name: scripts
          configMap:
            name: metadata-enrich-script
            defaultMode: 0755
