---
# argocd-image-updater 的两个凭据。2026-08-02 随 ArgoCD 控制面从 homelab 迁入本集群
# （原位置 k8s/helm/manifests/vault-eso/github-external-secret.yaml，已删）——
# 它们的 target namespace 是 `argocd`，而 homelab 上这个 ns 已随控制面退役。
# 两条都**同源读取** Vault secret/homelab/github，不复制凭据。
#
# ⚠️ 现状：image-updater 处于闲置（`kubectl get imageupdater -A` 为 0 个 CR），
# 唯一带旧式注解的是 oracle-k3s App 且无对应 CR ——即实际没在更新任何镜像。
# 迁移刻意保持现状不做取舍变更；「补 CR 接上还是退役」是 ROADMAP 上的独立开放项。
---
# ExternalSecret 1: GHCR registry auth
# 创建 docker config JSON secret，供 Image Updater 拉取 GHCR 镜像元数据
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-ghcr-auth
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-image-updater-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .pat }}","auth":"{{ printf "%s:%s" .username .pat | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: secret/homelab/github
        property: username
    - secretKey: pat
      remoteRef:
        key: secret/homelab/github
        property: pat
---
# ExternalSecret 2: Git write-back credentials
# Image Updater 用此 secret 向 GitHub repo 提交镜像 tag 更新
# （oracle-k3s App 的 write-back-method: git:secret:argocd/git-creds 指的就是它）
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-git-creds
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: git-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/homelab/github
        property: username
    - secretKey: password
      remoteRef:
        key: secret/homelab/github
        property: pat
