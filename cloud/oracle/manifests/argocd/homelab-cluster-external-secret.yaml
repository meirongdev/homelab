# ESO 物化 oracle ArgoCD 的 **homelab** 外部集群凭据。
# 与 k8s/helm/manifests/vault-eso/argocd-oracle-cluster-external-secret.yaml 完全对称，
# 只是方向相反 —— 2026-08-02 ArgoCD 控制面从 homelab 迁到 oracle 后，被纳管的
# 外部集群从 oracle 变成了 homelab。
#
# Vault: secret/homelab/argocd-homelab-cluster (keys: bearerToken, caData)
#   - bearerToken: homelab kube-system/argocd-manager SA 的不过期 token
#   - caData:      homelab 集群 CA(base64 PEM，即 argocd-manager-token Secret 的 ca.crt)
#   SA/CRB/token Secret 是 bootstrap 资源，刻意不进 GitOps（否则 ArgoCD 要靠自己创建
#   自己纳管本集群所需的凭据，成环）。重建命令见
#   docs/runbooks/argocd-control-plane-on-oracle.md。
#
# server 走 Tailscale：homelab k3s 的 apiserver 证书 SAN 已含 100.94.186.7（实测确认），
# 故 caData 可正常校验，无需 insecure。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-cluster
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: homelab-cluster
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
      data:
        name: homelab
        server: https://100.94.186.7:6443
        config: |
          {
            "bearerToken": "{{ .bearerToken }}",
            "tlsClientConfig": {
              "caData": "{{ .caData }}"
            }
          }
  data:
    - secretKey: bearerToken
      remoteRef:
        key: secret/homelab/argocd-homelab-cluster
        property: bearerToken
    - secretKey: caData
      remoteRef:
        key: secret/homelab/argocd-homelab-cluster
        property: caData
