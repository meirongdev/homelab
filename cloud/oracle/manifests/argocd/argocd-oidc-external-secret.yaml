# argocd-oidc: ZITADEL OIDC client 凭据，供 ArgoCD 原生 SSO（不用 dex）。
# 2026-08-02 随 ArgoCD 控制面从 homelab 迁入本集群，内容与
# k8s/helm/manifests/vault-eso/argocd-oidc-external-secret.yaml 逐字相同 ——
# **同源读取同一个 Vault path**，不复制凭据。
#
# ArgoCD 解析 argocd-cm 里的 `$argocd-oidc:oidc.clientID` / `$argocd-oidc:oidc.clientSecret`
# 时，会在 argocd namespace 里找带 app.kubernetes.io/part-of=argocd 标签的 Secret，
# 该标签由下面的 target template 打上。与 ArgoCD 自管的 `argocd-secret` 分开放，
# 避免 ESO 和 ArgoCD 抢所有权。
#
# ⚠️ ZITADEL 侧的 client 不需要任何改动：回调地址仍是 https://argocd.meirong.dev/auth/callback
# ——域名不变，只是背后换了集群。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        oidc.clientID: "{{ .clientID }}"
        oidc.clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientID
      remoteRef:
        key: secret/homelab/argocd-oidc
        property: oauth_client_id
    - secretKey: clientSecret
      remoteRef:
        key: secret/homelab/argocd-oidc
        property: oauth_client_secret
