# ⚠️ Namespace 单独成文件，**不要**把它塞回其他清单里。
# 2026-08-03 事故教训：`personal-services` 的 Namespace 当时内嵌在 calibre-web.yaml
# 顶部。calibre 迁 oracle 时 `git rm` 掉那个文件 → ArgoCD prune 掉 Namespace →
# **级联删除了同 ns 下毫不相关的 open-notebook 全部数据**（PVC 上的 Prune=false
# 护栏无效，因为被 prune 的是 ns 不是 PVC）。
# 复盘见 docs/records/2026-08-03-namespace-prune-cascade.md
# Namespace + Cloudflare API token for the oracle-k3s external-dns instance (the chart itself
# is ArgoCD-managed: argocd/applications/external-dns-oracle.yaml, values/external-dns-oracle.yaml).
#
# Reuses the SAME meirong.dev zone token homelab's instance uses (Vault secret/homelab/external-dns,
# property=api_token) — it's a zone-scoped Cloudflare API token, so it works for oracle's
# subdomains too (same zone). oracle's vault-backend ClusterSecretStore reaches homelab's Vault
# over Tailscale, and already reads other homelab/* paths (telegram, zitadel), so this is the
# established cross-cluster secret pattern.
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    name: external-dns
    # external-dns runs unprivileged — baseline is safe (matches rss-system et al).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
