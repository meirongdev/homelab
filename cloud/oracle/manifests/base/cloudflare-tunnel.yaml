# （本文件的 Namespace 已于 2026-08-03 拆到 namespace-cloudflare.yaml —— 理由见该文件头注）
# Cloudflare Tunnel deployment for oracle-k3s (independent from homelab)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-token
  namespace: cloudflare
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-tunnel-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: oracle-k3s/cloudflare
        property: token
---
# ⚠️ 单副本是**结论不是疏忽**（2026-08-13 从 2 副本降下来，实测依据见文件尾注）。
# oracle-k3s 是单节点集群，2 副本**原理上**就拿不到任何节点级 HA；而隧道级冗余本就
# 来自 cloudflared 自身：单个进程持有 4 条边缘连接、跨 3 个 colo（kix03/04/05）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  replicas: 1
  # 滚动更新仍然无空窗：默认 25%/25% 在 1 副本下算出
  # maxUnavailable=floor(0.25)=0、maxSurge=ceil(0.25)=1 —— 新 pod ready 后旧 pod 才退。
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      priorityClassName: high
      containers:
        - name: cloudflared
          # 2026-08-04 digest 刷新（原 sha256:404528c1…，已落后 upstream :latest）。
          # 动因：旧 digest 带 libssl3t64 CVE-2026-31789（deb13u2 已修）。
          image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf  # 当前 :latest 的多架构 index digest
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
          ports:
            - containerPort: 2000
              name: metrics
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# ClusterIP service for cloudflared metrics
# Scraped by OTel Collector running in-cluster (no NodePort needed)
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflare
  labels:
    app: cloudflared
spec:
  type: ClusterIP
  selector:
    app: cloudflared
  ports:
    - port: 2000
      targetPort: 2000
      name: metrics
---
# ☠️ 这里**故意没有 PodDisruptionBudget**（2026-08-13 随降副本一并删除）。
# 单副本下 PDB 只有两种结果，都没用：
#   minAvailable: 1  → disruptionsAllowed = 0 → `kubectl drain` 永久卡死
#   maxUnavailable: 1 → disruptionsAllowed = 1 → 恒定放行，等于没有约束
# 单节点集群上它本来也从未起过作用（驱逐后无处可调度）。
#
# ── 降到单副本的实测依据（2026-08-13）──────────────────────────────
# 1. 单节点 = 没有节点级 HA 可拿。历史上每次 cloudflared 重启都是节点重启：
#    两副本同秒 exit=255 @2026-08-13T12:20:48Z，节点开机 20:18:23 (+08)；
#    `last -x` 显示 oracle 6 天内重启 5 次（08-08/10/11/13×2）。2 副本挡住的次数为 0。
#    另见 records/2026-08-01-oracle-k3s-dns-outage.md 的「两副本相继退出」。
# 2. 节点 memory requests 已达 allocatable 的 85%，省下的 64Mi request 不是白拿。
# 3. 7 天峰值并发 3 个请求，单 pod 实占 ~15Mi RSS / ~0m CPU。
# 唯一失去的能力：单 pod 独立崩溃时 ~15–25s 的 502。靠 CloudflaredAllReplicasDown 兜底
# （KSM 序列 cluster="oracle-k3s" 已确认存在，经 OTel remote-write 回 homelab Prometheus）。
