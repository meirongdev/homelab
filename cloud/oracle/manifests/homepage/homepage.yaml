---
# ServiceAccount for K8s API access (service discovery widgets)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Matthew's Homelab
    favicon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/kubernetes.png
    theme: dark
    color: slate
    headerStyle: boxed
    disableCollapse: true
    hideVersion: true
    useEqualHeights: true
    layout:
      个人服务:
        style: row
        columns: 3
      RSS & 自动化:
        style: row
        columns: 3
      监控:
        style: row
        columns: 3
      基础设施:
        style: row
        columns: 3

  bookmarks.yaml: |
    - 账户:
        - 登录 / SSO:
            - abbr: "🔑"
              href: https://auth.meirong.dev
    - 开发工具:
        - GitHub:
            - abbr: GH
              href: https://github.com
        - Claude:
            - abbr: AI
              href: https://claude.ai

  services.yaml: |
    - 个人服务:
        - Blog:
            icon: https://meirong.dev/favicon.ico
            href: https://meirong.dev
            description: 个人博客

        - Calibre-Web:
            icon: calibre-web.png
            href: https://book.meirong.dev
            description: 电子书管理

        # 2026-08-03 补上：它一直在线（HTTPRoute draw.meirong.dev + 两个 pod）、
        # services.md 里也列着，但从来没进过这张首页。
        # 2026-08-04 去掉 oauth2-proxy，根路径直接 200，不再 302 跳 ZITADEL。
        - Excalidraw:
            icon: excalidraw.png
            href: https://draw.meirong.dev
            description: 协作白板
            kubernetes:
              namespace: personal-services
              container: excalidraw
              label_selector: app=excalidraw

        - IT-Tools:
            icon: it-tools.png
            href: https://tool.meirong.dev
            description: 开发者工具箱

        # homelab 集群的服务（同 Calibre-Web）：不写 kubernetes: 块——
        # Homepage 跑在 oracle-k3s，查不到 homelab 的 pod 状态。
        - Jobs SG:
            icon: mdi-briefcase-search
            href: https://jobs.meirong.dev
            description: 新加坡 SWE 岗位市场（实时快照 + 周报）

        # 2026-08-08 升级后路径变了：`/` 从「周报静态文件」变成**实时市场快照**
        # （周报移到 `/reports` 与 `/w/{YYYY-Www}`），运维统计从 `/daily` 改名
        # `/ops`（`/daily` 仍 301 过去，但别再往新地方写旧路径）。
        # 两者更新节奏不同：快照随请求渲染、`/ops` 每天 02:20 SGT ingest 落地后刷新，
        # 各给一个入口，不要合并。
        - Jobs SG · Ops:
            icon: mdi-chart-line
            href: https://jobs.meirong.dev/ops
            description: 每日抓取统计（SGT 日历日）

        - Open Notebook:
            icon: open-notebook.png
            href: https://notebook.meirong.dev
            description: AI 研读笔记本（本地模型）

        # 集群外的站点（GitHub Pages，仓库 meirongdev/playgrounds）：没有 HTTPRoute、
        # 没有 pod，所以不写 kubernetes: 块，DNS 也不由 external-dns 建 ——
        # CNAME 在 cloudflare/terraform/main.tf 的 external_origin_dns 里显式管。
        - Playgrounds:
            icon: mdi-code-braces
            href: https://playgrounds.meirong.dev
            description: 各语言官方在线 Playground 导航

        # 只发元数据与评分，**不发书** —— 与 Calibre-Web(book.meirong.dev) 是两个东西，
        # 域名刻意用 readlist. 而不是 books.，差一个字母的误配代价太高。
        - readlist:
            icon: mdi-book-open-page-variant
            href: https://readlist.meirong.dev
            description: 技术书多维评分与书单（下一本读什么）
            kubernetes:
              namespace: personal-services
              container: readlist
              label_selector: app=readlist

        - BentoPDF:
            icon: bentopdf.png
            href: https://pdf.meirong.dev
            description: PDF 工具箱（纯浏览器处理，免登录）

        - Squoosh:
            icon: photopea.png
            href: https://squoosh.meirong.dev
            description: 图片压缩工具

        - Timeslot:
            icon: mdi-calendar-clock
            href: https://slot.meirong.dev
            description: 日历预约系统
            kubernetes:
              namespace: personal-services
              app: timeslot

        - Trends:
            icon: mdi-trending-up
            href: https://trends.meirong.dev
            description: GitHub 趋势追踪
            kubernetes:
              namespace: personal-services
              container: trends
              label_selector: app=trends

    - RSS & 自动化:
        - Miniflux:
            icon: miniflux.png
            href: https://rss.meirong.dev
            description: RSS 阅读器
            kubernetes:
              namespace: rss-system
              container: miniflux
              label_selector: app=miniflux

    - 监控:
        - Uptime Kuma:
            icon: uptime-kuma.png
            href: https://status.meirong.dev
            description: 服务可用性监控
            kubernetes:
              namespace: personal-services
              container: uptime-kuma
              label_selector: app=uptime-kuma

        - Grafana:
            icon: grafana.png
            href: https://grafana.meirong.dev
            description: 可视化监控面板

        - Prometheus:
            icon: prometheus.png
            description: 指标采集 (Agent → Homelab)

        - Loki:
            icon: loki.png
            description: 日志聚合 (→ Homelab)

    - 基础设施:
        - PostgreSQL:
            icon: postgres.png
            description: 共享应用库 apps-pg (CNPG, PG17)
            kubernetes:
              # 2026-08-06：rss-system/rss-postgres（手搓 Deployment, PG15）退役，
              # 迁入 databases ns 的 CNPG 共享集群 apps-pg。
              # 2026-08-03 那次修正的教训仍适用：选择器必须指到**数据库 pod**，
              # 不是应用 pod —— 后者里没有名为 postgres 的容器，状态会一直取不到。
              namespace: databases
              container: postgres
              label_selector: cnpg.io/cluster=apps-pg

        - HashiCorp Vault:
            icon: vault.png
            href: https://vault.meirong.dev
            description: 凭证与密钥管理 (Homelab)

        - ArgoCD:
            icon: argo-cd.png
            href: https://argocd.meirong.dev
            description: GitOps 持续部署 (Homelab)

        - ZITADEL:
            icon: zitadel.png
            href: https://auth.meirong.dev
            description: 单点登录 / 身份中心 (Homelab)

  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
        locale: zh-CN

    - search:
        provider: google
        target: _blank

  kubernetes.yaml: |
    mode: default

  docker.yaml: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      # bulk(-10)：纯门户 UI，非核心（2026-08-12 oracle 分档补齐）
      priorityClassName: bulk
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28  # 当前运行 digest 固定（原 :latest）
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "localhost:8080,localhost:3000,127.0.0.1:8080,127.0.0.1:3000,home.meirong.dev"
          resources:
            requests:
              cpu: 15m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: homepage-config
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  type: ClusterIP
  selector:
    app: homepage
  ports:
    - port: 3000
      targetPort: 3000
      name: http
