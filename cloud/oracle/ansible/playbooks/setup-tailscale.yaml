---
# 共用逻辑在 tailscale/ansible/roles/tailscale_node（roles_path 见 ansible.cfg）。
# 本文件只保留 oracle 差异：非默认 CIDR、UDP GRO 修复、firewalld trusted。
- name: Setup Tailscale on Oracle K3s node
  hosts: oracle_masters
  become: true
  vars:
    # ClusterMesh underlay (2026-07-07): advertise only this node's OWN VCN IP as /32 so
    # the peer cluster routes VXLAN(8472/udp) to it over Tailscale. Pod-CIDR advertisement
    # removed — cross-cluster pod traffic rides Cilium ClusterMesh VXLAN, not Tailscale
    # subnet routes. See docs/reference/tailscale-network.md.
    tailscale_advertise_routes: "10.0.0.26/32"
    # No static peer-CIDR routes (they blackhole host traffic when the peer stops
    # advertising); firewalld keeps trusting tailscale0 itself via the role.
    tailscale_peer_routes: []
    tailscale_fix_udp_gro: true # A1 虚拟网卡 UDP GRO 转发修复
    tailscale_firewalld_trusted: true # Oracle 镜像默认启用 firewalld，需信任 tailscale0
  roles:
    - tailscale_node
  tasks:
    # --- Tailscale/CNI recursion guard (2026-07-07) ---
    # tailscaled advertises cilium_host (10.52.0.x) as a candidate WireGuard endpoint;
    # the homelab node can "reach" it through ClusterMesh VXLAN (which rides Tailscale)
    # and would select it: WireGuard-over-VXLAN-over-WireGuard. Drop 41641 to/from the
    # CNI ranges so those candidates never validate and the public path wins.
    # Mirrors k8s-node's tailscale-no-cni-endpoint.service (homelab playbook).
    - name: Recursion guard — drop 41641 to own CNI range (INPUT)
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --direct --add-rule ipv4 filter INPUT 0 -p udp --dport 41641 -d 10.52.0.0/16 -j DROP
      register: fw_in
      changed_when: "'ALREADY_ENABLED' not in fw_in.stderr"

    - name: Recursion guard — drop 41641 to peer CNI range (OUTPUT)
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --direct --add-rule ipv4 filter OUTPUT 0 -p udp --dport 41641 -d 10.42.0.0/16 -j DROP
      register: fw_out
      changed_when: "'ALREADY_ENABLED' not in fw_out.stderr"

    - name: Reload firewalld to apply recursion guard
      ansible.builtin.service:
        name: firewalld
        state: reloaded
      when: fw_in.changed or fw_out.changed

    # --- Tailscale ip rule 收敛器（2026-08-12 重构，取代 boot-oneshot）---
    # 守一条不变量：5200 `to 100.64.0.0/10 lookup 52`。挡的是 Cilium identity-mark
    # 撞 Tailscale fwmark（2026-08-09 定性）：`identity & 0xFF == 0x08` 的 pod（1/256
    # 抽签）出向被劫进 main 表，到整个 100.64/10 黑洞。取证全文见
    # docs/reference/tailscale-network.md；homelab 侧对应
    # k8s/ansible/playbooks/setup-tailscale.yaml（它多守一条 5260 LAN 直通）。
    #
    # ☠️ 为什么从"开机 oneshot"改成"收敛器"（2026-08-12 review 发现两台节点全线失守）：
    # 单元 active(exited)"看起来修过"，规则却不在，且 homepage（identity 138760，
    # 低字节 0x08）到 100.64/10 全超时。凶手不是 tailscaled，是 **systemd-networkd**：
    # `ManageForeignRoutingPolicyRules` 默认 yes —— networkd (重)启动/重配时清扫一切
    # 非它管理的 ip rule。8-11 06:40 unattended-upgrades 重启本节点 networkd，规则被清；
    # tailscaled 的四条(5210-5270) 有 netlink 监听自愈，这条没有守护者。
    # A/B 实测（本节点 2026-08-12）：默认配置重启 networkd → 5200 三秒内被清（抓现行）；
    # 装上下面的 drop-in 再重启 → 幸存。中签的代价不小：otel remote-write 与 krr 都靠
    # 100.94.186.7 打回 homelab，一断就是跨集群遥测停摆。
    # 全程取证见 docs/records/2026-08-12-tailscale-iprule-guard-drift.md
    #
    # 防线一（根因）：networkd drop-in 关掉外来规则/路由清扫。
    # 防线二（兜底）：幂等断言脚本 + timer 每 5 分钟重申 —— 对**任何**删除者收敛，
    # 并写 node-exporter textfile 指标（exporters.yaml 已开 textfile collector），
    # 失守可告警（k8s/helm/manifests/monitoring/alerts/tailscale-iprule-alerts.yaml）。
    - name: Stop systemd-networkd sweeping foreign ip rules/routes (root cause of the 2026-08-11 drift)
      ansible.builtin.copy:
        dest: /etc/systemd/networkd.conf.d/10-no-foreign-sweep.conf
        mode: "0644"
        content: |
          # ManageForeignRoutingPolicyRules 默认 yes：networkd (重)启动/重配时清扫一切
          # 非它管理的 ip rule —— 2026-08-11 unattended-upgrades 重启 networkd，把
          # 5200 防护规则清掉（tailscaled 的规则有 netlink 监听自愈，这条没有）。
          # ManageForeignRoutes 同理设 no：table 52 与 Cilium 的路由对 networkd 也是"外来"的。
          # 见 docs/records/2026-08-12-tailscale-iprule-guard-drift.md
          [Network]
          ManageForeignRoutingPolicyRules=no
          ManageForeignRoutes=no
      register: networkd_sweep_conf

    - name: Restart systemd-networkd to load sweep config (only when changed; verified non-disruptive)
      ansible.builtin.service:
        name: systemd-networkd
        state: restarted
      when: networkd_sweep_conf.changed

    - name: Install assert-tailscale-ip-rules script
      ansible.builtin.copy:
        dest: /usr/local/sbin/assert-tailscale-ip-rules
        mode: "0755"
        content: |
          #!/bin/sh
          # Tailscale 相关 ip rule 收敛器 —— tailscale-ip-rules.timer 每 5 分钟执行。
          # ansible 管理（cloud/oracle/ansible/playbooks/setup-tailscale.yaml），别在节点上手改。
          set -u

          TEXTFILE_DIR=/var/lib/node_exporter/textfile
          STATE_FILE=/var/lib/tailscale-iprule-reasserts.count
          PROM_FILE=$TEXTFILE_DIR/tailscale_iprule.prom

          mkdir -p "$TEXTFILE_DIR"

          reasserted=0
          present_lines=""

          # assert <priority> <ip rule 匹配/添加参数...>
          assert() {
            prio=$1; shift
            n=$(ip rule show | grep -c "^${prio}:.*$*")
            if [ "$n" -eq 0 ]; then
              ip rule add "$@" priority "$prio" && reasserted=$((reasserted + 1))
              present=0
            else
              # 并发竞态可能留下重复规则；收敛到恰好一条
              while [ "$n" -gt 1 ]; do ip rule del "$@" priority "$prio"; n=$((n - 1)); done
              present=1
            fi
            present_lines="${present_lines}tailscale_iprule_present{priority=\"${prio}\"} ${present}
          "
          }

          # ⚠️ 增删 assert 行时同步改下面写死的 tailscale_iprule_rules_expected
          assert 5200 to 100.64.0.0/10 lookup 52

          total=$(cat "$STATE_FILE" 2>/dev/null || echo 0)
          case "$total" in *[!0-9]*|"") total=0 ;; esac
          total=$((total + reasserted))
          printf '%s\n' "$total" > "$STATE_FILE"

          TMP="$PROM_FILE.tmp.$$"
          {
            printf '# HELP tailscale_iprule_present 断言前该规则是否在位（0=本轮发现缺失并已补）\n'
            printf '# TYPE tailscale_iprule_present gauge\n'
            printf '%s' "$present_lines"
            printf '# HELP tailscale_iprule_reasserts_total 发现缺失并补齐的累计次数（状态文件持久）\n'
            printf '# TYPE tailscale_iprule_reasserts_total counter\n'
            printf 'tailscale_iprule_reasserts_total %s\n' "$total"
            printf '# HELP tailscale_iprule_rules_expected 应断言的规则条数（写死，与上面 assert 行数同步）\n'
            printf '# TYPE tailscale_iprule_rules_expected gauge\n'
            printf 'tailscale_iprule_rules_expected 1\n'
          } > "$TMP" && mv "$TMP" "$PROM_FILE"

          if [ "$reasserted" -gt 0 ]; then
            echo "REASSERT: $reasserted ip rule(s) were missing and re-added"
          fi
          exit 0

    - name: Install tailscale-ip-rules service
      ansible.builtin.copy:
        dest: /etc/systemd/system/tailscale-ip-rules.service
        mode: "0644"
        content: |
          [Unit]
          Description=Assert Tailscale-related ip rule invariants (convergent guard)
          After=tailscaled.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          # 两遍断言夹 20s：覆盖"断言刚跑完就撞上一次清扫"（如开机 90s 处 timer 首跑
          # 撞云初始化的网络重配），失守窗口从"下个 tick(5min)"缩到 ~20s。
          # 刻意没有 RemainAfterExit（timer 触发才会真正重跑 ExecStart）、没有 ExecStop
          # （规则永不自动移除——旧单元的 ExecStop 正是迁移时的坑）。
          # ⚠️ 没有 PartOf=tailscaled：实测 restart 传播对已死的 oneshot 是空操作，
          # 且 tailscaled 重启本来就不清规则（清规则的是 networkd，已由 drop-in 根治）
          # —— timer 是唯一的、也是足够的重申机制。
          ExecStart=/usr/local/sbin/assert-tailscale-ip-rules
          ExecStart=/bin/sleep 20
          ExecStart=/usr/local/sbin/assert-tailscale-ip-rules

    - name: Install tailscale-ip-rules timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/tailscale-ip-rules.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Re-assert Tailscale ip rules every 5 minutes (convergence loop)

          [Timer]
          OnBootSec=90
          OnUnitActiveSec=5min

          [Install]
          WantedBy=timers.target

    # 旧单元退役。⚠️ 它的 ExecStop 会顺手删规则——后面立即 start 断言服务补回。
    - name: Retire legacy one-shot rule unit (superseded by convergent guard)
      ansible.builtin.systemd:
        name: tailscale-cgnat-route.service
        enabled: false
        state: stopped
      failed_when: false

    - name: Remove legacy unit file
      ansible.builtin.file:
        path: /etc/systemd/system/tailscale-cgnat-route.service
        state: absent

    - name: Enable and start the convergence timer
      ansible.builtin.systemd:
        name: tailscale-ip-rules.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Assert rules now (also repairs what legacy ExecStop just removed)
      ansible.builtin.systemd:
        name: tailscale-ip-rules.service
        state: started
