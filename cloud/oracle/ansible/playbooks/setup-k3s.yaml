- name: Install prerequisites on Oracle K3s node
  hosts: oracle_masters
  become: true
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - git
          - python3-firewall  # required for ansible.posix.firewalld module
        state: present
        update_cache: true

- name: Configure OS for K3s
  hosts: oracle_masters
  become: true
  tasks:
    # OCI Ubuntu 24.04 uses firewalld (nftables backend) — not UFW.
    # OCI Security List handles external ingress at the cloud level;
    # firewalld handles it at the OS level. Both must allow K3s ports.
    - name: Allow K3s API port (6443) in firewalld
      ansible.posix.firewalld:
        port: 6443/tcp
        zone: public
        permanent: true
        state: enabled
      notify: Reload firewalld

    - name: Allow HTTP (80) in firewalld
      ansible.posix.firewalld:
        port: 80/tcp
        zone: public
        permanent: true
        state: enabled
      notify: Reload firewalld

    - name: Allow HTTPS (443) in firewalld
      ansible.posix.firewalld:
        port: 443/tcp
        zone: public
        permanent: true
        state: enabled
      notify: Reload firewalld

    # K3s Cilium overlay needs pod/service CIDRs and interfaces trusted
    # in firewalld, otherwise the nftables filter_FORWARD chain will reject
    # pod egress traffic with "admin-prohibited".
    - name: Trust K3s pod CIDR (10.52.0.0/16) in firewalld
      ansible.posix.firewalld:
        source: 10.52.0.0/16
        zone: trusted
        permanent: true
        state: enabled
      notify: Reload firewalld

    - name: Trust K3s service CIDR (10.53.0.0/16) in firewalld
      ansible.posix.firewalld:
        source: 10.53.0.0/16
        zone: trusted
        permanent: true
        state: enabled
      notify: Reload firewalld

    - name: Trust cni0 interface in firewalld
      ansible.posix.firewalld:
        interface: cni0
        zone: trusted
        permanent: true
        state: enabled
      notify: Reload firewalld

    # Cilium VXLAN overlay interface (replaces flannel.1)
    - name: Trust cilium_vxlan interface in firewalld
      ansible.posix.firewalld:
        interface: cilium_vxlan
        zone: trusted
        permanent: true
        state: enabled
      notify: Reload firewalld

    # Cilium-specific ports
    - name: Allow Cilium health check (4240) in firewalld
      ansible.posix.firewalld:
        port: 4240/tcp
        zone: public
        permanent: true
        state: enabled
      notify: Reload firewalld

    - name: Allow Cilium VXLAN overlay (8472) in firewalld
      ansible.posix.firewalld:
        port: 8472/udp
        zone: public
        permanent: true
        state: enabled
      notify: Reload firewalld

    - name: Allow Hubble Relay (4244) in firewalld
      ansible.posix.firewalld:
        port: 4244/tcp
        zone: public
        permanent: true
        state: enabled
      notify: Reload firewalld

    - name: Allow ClusterMesh API server (32379) in firewalld
      ansible.posix.firewalld:
        port: 32379/tcp
        zone: public
        permanent: true
        state: enabled
      notify: Reload firewalld

    # OCI instances use iptables-legacy alongside nftables; set FORWARD ACCEPT.
    # 这条是**真正起作用且真正持久**的一条：policy 进 /etc/iptables/rules.v4
    # （`:FORWARD ACCEPT`），netfilter-persistent 开机恢复，Cilium 也不会改 policy。
    - name: Set FORWARD policy to ACCEPT (required for pod-to-pod routing)
      ansible.builtin.iptables:
        chain: FORWARD
        policy: ACCEPT

    # ⚠️ 2026-08-05 删掉了两条 `-A FORWARD -s 10.52.0.0/16 -j ACCEPT` /
    #    `-d 10.53.0.0/16 -j ACCEPT`。它们**永远无法收敛**，留着只会让
    #    `just check-node-drift`（ansible --check）永久报 2 条假 changed，
    #    把漂移检测变成噪音。完整证据链：
    #      1. rules.v4 里确实存了这两条，netfilter-persistent 开机 20:41:45 执行成功；
    #      2. 但 20:44 cilium-agent 起来后，`iptables -S FORWARD` 里只剩
    #         CILIUM_FORWARD 跳转和 wg0 两条 —— Cilium 重建 FORWARD 链时丢掉了外来规则
    #         （本集群 kube-proxy-replacement=true + enable-ipv4-masquerade=true，
    #          Cilium 全权管 iptables）；
    #      3. 而 FORWARD policy 本就是 ACCEPT（上一条任务），这两条纯属冗余。
    #    结论：pod↔pod 转发靠的是 policy ACCEPT + Cilium 自己的 CILIUM_FORWARD，
    #    不是这两条。要验证只需看 policy，`just verify-node` 已覆盖。

    - name: Persist iptables rules across reboots
      ansible.builtin.shell: |
        mkdir -p /etc/iptables
        iptables-save > /etc/iptables/rules.v4
      changed_when: true

    # Ubuntu 默认 fs.inotify.max_user_instances=128，root 进程（k3s/containerd/
    # 各 pod）会将其占满，导致依赖 inotify 的 pod 起不来——falco 曾因此
    # "could not initialize inotify handler" CrashLoop 23 天。homelab 节点为
    # 8192，此处保持一致。
    - name: Raise inotify instance limit (falco etc. need inotify handles)
      ansible.posix.sysctl:
        name: fs.inotify.max_user_instances
        value: '8192'
        sysctl_file: /etc/sysctl.d/99-inotify.conf
        state: present
        reload: true

    # OCI 的 Ubuntu 镜像带了一个 microk8s 装机残留：/etc/sysctl.d/20-microk8s-hugepages.conf
    # 里 vm.nr_hugepages = 1024，即 **2GiB 被锁成 hugetlb**。本机跑的是 k3s，从来没有
    # 任何 pod 申请过 hugepages（实测 HugePages_Free == HugePages_Total == 1024）。
    # 代价是实打实的：这 2GiB 直接从 node allocatable 里扣掉（capacity−allocatable 差额
    # 恰好等于它）。24GB 时占 8% 还能忍，2026-08-05 缩到 12GB 后占 17%，
    # 不清掉 allocatable 只剩 9.7GiB，低于实测 30d 内存峰值 10.2GiB → 一开机就进驱逐。
    - name: Remove leftover microk8s hugepages reservation (frees 2GiB)
      ansible.builtin.file:
        path: /etc/sysctl.d/20-microk8s-hugepages.conf
        state: absent

    - name: Zero hugepages (node capacity only refreshes on kubelet restart)
      ansible.posix.sysctl:
        name: vm.nr_hugepages
        value: '0'
        sysctl_file: /etc/sysctl.d/99-no-hugepages.conf
        state: present
        reload: true

    # ☠️ 2026-08-09：本节点 **5 天内非正常重启 3 次**（08-06 04:39、08-08 09:32、
    # 08-08 23:58，`last -x` 里都没有对应的 shutdown 记录），而每次都查不出原因 ——
    # 因为 journald 默认 `#Storage=auto`，且 `/var/log/journal` 不存在，
    # auto 在这种情况下退化为 **volatile（只写 /run，重启即蒸发）**。
    # 实测判据：`journalctl --list-boots` 只有 **1 条**记录，`journalctl -b -1` 空。
    # 对照组：两台 DGX 有持久 journal，所以 08-07 那串重启一登上去就能确认
    # 是内核升级链（有干净 shutdown），而 oracle 这边只能靠猜。
    # ⚠️ 只建目录还不够也不会立刻生效：Storage=auto 要**目录先存在**才落盘，
    # 且 journald 需要重启才会改用新路径 —— 故三步齐全（建目录 + 显式 persistent + 重启）。
    # 保留量给 200M：12GB 小盘，够覆盖数次重启的回溯窗口而不占地方。
    - name: Ensure persistent journal directory exists
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: '2755'

    # ⚠️ 这一步不能省：OCI 的 Ubuntu 镜像**没有** /etc/systemd/journald.conf.d/
    # （只有 resolved.conf.d），而 ansible 的 copy 模块不会建父目录 ——
    # 2026-08-09 首次跑就是栽在这里：
    # `Destination directory /etc/systemd/journald.conf.d does not exist`。
    - name: Ensure /etc/systemd/journald.conf.d exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure journald to keep logs across reboots
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/10-persistent.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by ansible (setup-k3s.yaml) —— 见该文件内注释里的重启复盘理由。
          [Journal]
          Storage=persistent
          SystemMaxUse=200M
      notify: Restart journald

  # firewalld reload 是**动作**不是状态：写成普通任务的话每次 `--check` 都报 changed，
  # 两条就足以把 `just check-node-drift` 的信号淹掉。改 handler 后只在真有规则变更时触发。
  handlers:
    - name: Reload firewalld
      ansible.builtin.service:
        name: firewalld
        state: reloaded

    # ⚠️ 两步缺一不可（2026-08-09 实测踩过）：只 restart **不会**迁移到 /var。
    # 重启后 `journalctl --header` 仍指向 /run/log/journal、`/var/log/journal/` 空着，
    # 看起来配置生效了其实没有。journald 要收到 SIGUSR1 才会把 /run 刷到 /var
    # 并切换活动日志 —— 那正是 `journalctl --flush` 做的事。
    # （boot 时由 systemd-journal-flush.service 负责；但那时 /var/log/journal
    #  还不存在，所以它报 success 也没用，必须在建完目录后再刷一次。）
    - name: Restart journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted

    - name: Flush journal from /run to /var (journald 需 SIGUSR1 才切换存储)
      ansible.builtin.command: journalctl --flush
      changed_when: false

- name: Write K3s config file
  hosts: oracle_masters
  become: true
  tasks:
    - name: Create K3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Write /etc/rancher/k3s/config.yaml
      register: k3s_config
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
        content: |
          write-kubeconfig-mode: "644"
          disable:
            - servicelb
            - traefik
          node-name: oracle-k3s
          tls-san:
            # Tailscale IP — 唯一的外部 API 端点：ArgoCD 集群注册、本机 kubectl
            # (fetch-kubeconfig.yaml 写的就是 {{ ansible_host }}) 都经此。
            # 节点内网 IP (10.0.0.26) 由 k3s 自动加入证书 SAN，无需在此声明。
            #
            # 这里**刻意不含 OCI 公网 IP**（2026-08-10）：一是本仓库不提交公网地址
            # （CI: scripts/check-public-ips.py），二是没有任何客户端走公网连 6443。
            # 代价：`https://<公网IP>:6443` 会 TLS SAN 不匹配。破窗时不需要它——
            # SSH 进节点后本地 /etc/rancher/k3s/k3s.yaml 走 127.0.0.1。
            - 100.107.166.37
          cluster-cidr: "10.52.0.0/16"
          service-cidr: "10.53.0.0/16"
          flannel-backend: "none"
          disable-network-policy: true
          disable-kube-proxy: true
          # 2026-08-05 缩容到 2 OCPU / 12GB 时加。此前**一条 reserved 都没配**：
          # capacity−allocatable 的差额恰好等于那 2GiB hugepages，说明 kubelet 认为
          # 整机内存全部可分配给 pod。而 k3s-server 进程自己实测 RSS 2021Mi、
          # containerd 240Mi ——共约 2.3GiB 是调度器完全看不见的。24GB 上无所谓，
          # 12GB 上是整机 19%，不声明就等于允许调度器超卖到必然 OOM。
          #
          # memory=2560Mi：k3s 2021 + containerd 240 + tailscaled/sshd/journald 等约 200，
          #   再留一点余量。CPU 200m 同理（k3s-server idle 就要 ~150m）。
          # eviction-hard 500Mi：默认 100Mi 在 12GB 机器上太晚——到那一步内核 OOM killer
          #   往往已经随机挑了个受害者，kubelet 有序驱逐（按 QoS + Pod Priority）就没机会跑。
          kubelet-arg:
            - "system-reserved=cpu=200m,memory=2560Mi"
            - "eviction-hard=memory.available<500Mi,nodefs.available<10%"

    # 本 playbook **刻意不自动重启 k3s** —— 那等于在一条随手可跑的命令里重启整个集群。
    # 但 config.yaml 改了不重启就完全不生效，静默失效比报错更坑，所以这里显式喊一声。
    - name: Warn that config.yaml changes need a k3s restart to take effect
      ansible.builtin.debug:
        msg: >-
          config.yaml 已变更，但 k3s 未重启 —— kubelet-arg（system-reserved /
          eviction-hard）此刻**尚未生效**。改 shape 的场景请照
          docs/runbooks/oracle-k3s-shape-downsize.md 走（停机重启会一并生效）；
          只想立刻生效则手动 `sudo systemctl restart k3s`（全集群 pod 会重建）。
      when: k3s_config is changed

- name: Install K3s single node
  hosts: oracle_masters
  become: true
  tasks:
    - name: Check if K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s (reads flags from /etc/rancher/k3s/config.yaml)
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      when: not k3s_binary.stat.exists
      changed_when: true

    - name: Wait for K3s to be ready
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_ready
      until: k3s_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

- name: Install Gateway API CRDs (Cilium Gateway dependency)
  hosts: oracle_masters
  become: true
  tasks:
    # k3s 内置 traefik 被 disable（见上面的 config），不再提供 Gateway API CRD。
    # Cilium Gateway 依赖标准 Gateway API CRD，必须独立安装（与 homelab 一致：v1.2.1 standard channel）。
    # 切勿改回让 traefik 托管这些 CRD —— disable traefik 会触发 helm-delete-traefik-crd
    # 把 CRD 一起删掉，导致 Gateway/HTTPRoute 级联回收、路由全断。
    # 见 docs/plans/networking/2026-06-04-oracle-k3s-argocd-gitops.md 事故复盘。
    - name: Apply Gateway API CRDs v1.2.1 (standard channel)
      ansible.builtin.command:
        cmd: >-
          k3s kubectl apply -f
          https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
      register: gwapi_crd
      changed_when: "'created' in gwapi_crd.stdout or 'configured' in gwapi_crd.stdout"

- name: Configure systemd-resolved fallback upstream (DNS redundancy)
  hosts: oracle_masters
  become: true
  tasks:
    # OCI VCN 通过 DHCP 只推一个上游 169.254.169.254 —— 它不可达时全网 DNS 抖（2026-08-01 outage,
    # 见 docs/records/2026-08-01-oracle-k3s-dns-outage.md)。加 1.1.1.1 做 fallback，主上游不可达时自动切换。
    - name: Ensure /etc/systemd/resolved.conf.d exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: Write OCI DNS fallback drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/10-oci-fallback.conf
        content: |
          [Resolve]
          FallbackDNS=1.1.1.1 2606:4700:4700::1111
        mode: "0644"
      register: dns_dropin

    - name: Restart systemd-resolved to apply fallback
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when: dns_dropin.changed

- name: Verify cluster
  hosts: oracle_masters
  become: true
  tasks:
    - name: Display cluster status
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: cluster_status
      changed_when: false

    - name: Show cluster status
      ansible.builtin.debug:
        msg: "{{ cluster_status.stdout_lines }}"
