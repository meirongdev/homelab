# squoosh 的 nginx 站点配置 —— 逐条对齐原镜像内 serve.json + build/_headers 的行为。
# 改这个文件前先读 images/squoosh/Dockerfile 的头注（为什么要自建）。

server {
  # 8080 而非 80：沿用 dko0/squoosh 的端口，k8s 侧 containerPort/Service/探针不用改。
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # ⚠️ 必需，别删：nginx 默认用 $scheme://$host:$server_port 拼绝对 Location，
  # 而 $server_port 是上面的 8080 → 经 Cilium Gateway 出去后 /editor 会 301 到
  # `http://squoosh.meirong.dev:8080/`，外部直接打不开（本地实测复现过）。
  # 关掉绝对跳转，改发相对 Location（`/`），代理层怎么改端口都不影响。
  absolute_redirect off;

  # ⚠️ squoosh 用 SharedArrayBuffer 跑多线程 WASM 编解码器。浏览器只在
  # COOP:same-origin + COEP:require-corp 同时存在时才放行 SharedArrayBuffer——
  # 漏掉任意一条，页面能打开但**所有压缩操作静默失败**。
  # 两条头抄自镜像内 serve.json 与 build/_headers（原 `serve` 就是这么发的）。
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header Cross-Origin-Opener-Policy   same-origin  always;
  # 原 serve.json 对 **/* 一律 no-cache（上游注释说 rollup 的 cache-busting 不可靠）。
  add_header Cache-Control                no-cache     always;

  # 原 serve.json 的 redirects: /editor → /
  rewrite ^/editor/?$ / permanent;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
