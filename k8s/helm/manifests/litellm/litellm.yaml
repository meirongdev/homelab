# LiteLLM — self-hosted LLM gateway (homelab).
#
# Public surface: llm.meirong.dev (Cloudflare Tunnel → Cilium Gateway → HTTPRoute).
# Auth model (此前的 oauth2-proxy 已不需要 — LiteLLM 管理面自带认证):
#   - inference (/v1/*, /openai, /anthropic, /genai): master key + virtual keys,
#     Authorization: Bearer sk-…  (LITELLM_MASTER_KEY 已设 ⇒ 默认强制 key 鉴权)
#   - admin UI (/ui): LiteLLM 自带登录 (UI_USERNAME/UI_PASSWORD, Vault→ESO)
# Config: config.yaml in git (model_list); keys/spend live in Postgres —— 2026-08-25 起
#   是共享实例 `databases/apps-pg` 的 litellm 租户，不再是本 ns 自带的 litellm-pg。
# 自托管上游: DGX (DeepSeek-V4.1-Flash-1017) + Mac Studio OMLX (Qwen3.8-27B) + MacPro M2 OMLX (Ornith-1.5-35B 等)。
#   裸别名 DeepSeek-V4.1-Flash-1017 = 同组三级 DGX → Studio → M2，按 order 降级 + 健康检查剔除（2026-11-15 起，
#   见 docs/reference/litellm-gateway.md「自动降级」）；各上游另有指名别名。
#   homelab 内部的 key 经 key 级 aliases（在 Postgres）改道 homelab/qwen3.8-27b = Studio → DGX → M2（2026-11-15 起）。
# 升版：改 image digest + 注释 tag → git push。不要追 main-stable。
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  # ⚠️ api_base 必须带 /v1 后缀 —— LiteLLM 不会自动补。
  # api_key: dummy 不是机密（DGX 推理引擎不设鉴权；Mac OMLX 0.7 起配了 key，但开着
  # allow_unauthenticated_inference，推理接口不验 key），因此可留在 git。
  # ☠️ 引擎之间有个要命的差别：**SGLang 和 TensorFold（2026-11-15 实测）接受任意 model 名**
  #    照常作答，只有 vLLM 会 404。所以「请求成功了」不能证明别名指对了栈，
  #    判据只能是 `/v1/models` 报的 served name（或响应体里的 `model`）。
  # 强制 key 鉴权由 env LITELLM_MASTER_KEY 实现（general_settings.master_key 语义=require a key for all calls）。
  config.yaml: |
    model_list:
      # ── DGX（主；custom_dgx/ 前缀是历史约定，保留）──
      # 现状（2026-11-15 起）：DeepSeek-V4.1-Flash-1017，TensorFold（Zig）双机 TP=2，端点 100.97.87.120:8000。
      # 历次换栈与各栈参数见 docs/reference/litellm-gateway.md「DGX 主力栈」。
      # ☠️ 换栈时端口可能跟着变（:8000 / :8888 都被不同的栈用过，旧端口会直接不监听），
      #    只改模型名不改 api_base = 把消费方指向空端口。端口也区分不了后端，改之前先
      #    `curl -s http://100.97.87.120:<port>/v1/models` 看 served name 再动手。
      # upstream_compat 的两条 model_info 声明（upstream_reasoning_efforts / upstream_system_first）
      # 这个栈**都不需要**：2026-11-15 实测 reasoning_effort 七档（none…max）全收，对话中间的
      # system 消息 chat 与 /v1/responses 都收。☠️ 换栈时重测（坑 E）：对本别名传
      # "reasoning_effort": "bogus" 看 400 原文列出的集合，再发一条中间带 system 的请求；
      # 有一项被拒就把对应声明加回这两条（两条必须一致）。
      - model_name: custom_dgx/DeepSeek-V4.1-Flash-1017
        litellm_params:
          model: openai/DeepSeek-V4.1-Flash-1017
          api_base: http://100.97.87.120:8000/v1
          api_key: dummy
      # ── 无前缀别名 DeepSeek-V4.1-Flash-1017：DGX → Studio → M2 三级自动降级 ──
      # 2026-11-15 前靠 router_settings.fallbacks 串别名；现在改为同组 order + 健康检查（理由见下面那组的注释）。
      # ☠️ 别往模型条目的 litellm_params 里写 fallbacks：那是透传给 SDK 的 kwarg，从来没生效过
      #    （docs/records/2026-09-19-litellm-fallbacks-never-active.md）。
      # 与裸引擎同名是刻意的（下游改 base_url 即可绕过网关），代价是换模型时两边都得动。
      # ☠️ 改别名必须同步改 Postgres 里各虚拟 key 的 models 白名单，否则「清单正确 + Synced + 调用全 403」。
      #    2026-09-19 实测受影响的是 **16 把里的 8 把**；2026-11-15 是 13 把里的 11 把 + 账户 ext-team-1
      #    （外部 key 多了；账户级白名单也要改，zcode-agent 那把 key 自己的 models 是空的）。
      # ── 自动降级（2026-11-15 起）：同一个 model_name 下三条 deployment，order 1 DGX → 2 Studio → 3 M2 ──
      # 客户端只认这个名字，背后由谁作答由网关按上游健康状况决定；DGX 宕机、恢复都不用改配置。两层机制叠加，
      # 都用线上同 digest 镜像在本地实测过（docs/reference/litellm-gateway.md「自动降级」）：
      #   · 请求级：上一级失败（拒绝连接 / 5xx）就在同一个请求里试下一级，chat / responses、流式与否都行。
      #   · 健康检查剔除（文件末尾 general_settings + router_settings）：每 30s 探一次，探不通的不再参与选路，
      #     下一轮探通了自动回到 order 1。
      #   ☠️ 只靠请求级不够：整机离线时 SYN 没回应，每个请求要先挨约 406s 才降级（实测：内核 SYN 重试约 127s
      #      × SDK 共 3 次），而且单上游组默认不冷却，下一个请求照挨。
      # ⚠️ 降级不区分错误类型：DGX 回的参数级 400 也会被 Studio 接走、不再报出来（OMLX 什么 reasoning_effort 都收）。
      #    调参数、核档位一律用 custom_dgx/ 前缀那条。降级也不看 key 白名单，窄 key 不必为此加 Studio / M2。
      # ☠️ 换栈时这一组与下面兼容别名那组要一起改，general_settings.background_health_check_model_groups 里的名字也要跟着换
      #    （漏了 = 不再探活，整机离线时退回每请求 406s）。
      # ⚠️ 别用 YAML 锚点去重：PyYAML 的别名是同一个 dict 对象，LiteLLM 会往 model_info 里写各自的 id。
      - model_name: DeepSeek-V4.1-Flash-1017
        litellm_params: {model: openai/DeepSeek-V4.1-Flash-1017, api_base: "http://100.97.87.120:8000/v1", api_key: dummy, order: 1}
        model_info: {health_check_timeout: 30, health_check_max_tokens: 16}
      - model_name: DeepSeek-V4.1-Flash-1017
        litellm_params: {model: openai/Qwen3.8-27B-MLX-4bit, api_base: "http://100.98.220.75:8000/v1", api_key: dummy, order: 2}
        model_info: {health_check_timeout: 60, health_check_max_tokens: 16}
      - model_name: DeepSeek-V4.1-Flash-1017
        litellm_params: {model: openai/ornith-ai__Ornith-1.5-35B-A3B-MLX-4bit, api_base: "http://100.89.15.120:8000/v1", api_key: dummy, order: 3}
        model_info: {health_check_timeout: 60, health_check_max_tokens: 16}
      # ── 兼容别名 qwen3.8-flash-next-tp2（2026-11-15）──
      # 上一个 DGX 栈的名字。外发 key 的使用者还不知道已改名为 DeepSeek-V4.1-Flash-1017，客户端照旧发旧名，
      # 所以按旧名建一组，**三级上游始终与上面的裸别名保持一致**。4 把 ext-* key 和 ext-team-1 账户的白名单
      # 同日加回了这个名字（坑 A）。名字与实际模型对不上是刻意的代价，只为不动客户端。
      # 删它的条件：spend log 里连续两周没有旧名调用；删时同步从那 5 处白名单里拿掉，并从健康检查列表里删掉。
      - model_name: qwen3.8-flash-next-tp2
        litellm_params: {model: openai/DeepSeek-V4.1-Flash-1017, api_base: "http://100.97.87.120:8000/v1", api_key: dummy, order: 1}
        model_info: {health_check_timeout: 30, health_check_max_tokens: 16}
      - model_name: qwen3.8-flash-next-tp2
        litellm_params: {model: openai/Qwen3.8-27B-MLX-4bit, api_base: "http://100.98.220.75:8000/v1", api_key: dummy, order: 2}
        model_info: {health_check_timeout: 60, health_check_max_tokens: 16}
      - model_name: qwen3.8-flash-next-tp2
        litellm_params: {model: openai/ornith-ai__Ornith-1.5-35B-A3B-MLX-4bit, api_base: "http://100.89.15.120:8000/v1", api_key: dummy, order: 3}
        model_info: {health_check_timeout: 60, health_check_max_tokens: 16}
      # ── homelab 内部改道组 homelab/qwen3.8-27b（2026-11-15）：Studio → DGX → M2，与上面两组顺序相反 ──
      # 用户的分工：外发 key 用 DGX 的 DeepSeek-V4.1-Flash 当首选、Qwen3.8-27B 兜底；homelab 内部反过来。
      # 两边请求的是同一批名字（裸别名、兼容别名），按名字分不开，所以按 **key** 分：内部 key 在 Postgres 里带
      # key 级 aliases，把裸别名 / 兼容别名 / studio/qwen3.8-27b 三个名字改道到这一组，客户端一个字不用改。
      # 外发 key 不带 aliases，照旧落在上面两组（DGX 首选）；新发的 key 默认也是 DGX 首选。
      # 2026-11-15 用线上 1.103.1 临时 key 实测：白名单按客户端请求的**原名**查（只放行目标组名的 key 照样 403），
      # 改道后响应体的 `model` 仍是原名；谁答的看响应头 x-litellm-model-api-base 或 spend log 的 model_group。
      # ☠️ 这组不进任何白名单：只能经 aliases 到达，外发 key 指名调它是 403。哪些 key 带 aliases 不在 git 里，
      #    清单与回读命令见 docs/reference/litellm-gateway.md「按 key 分首选」。
      - model_name: homelab/qwen3.8-27b
        litellm_params: {model: openai/Qwen3.8-27B-MLX-4bit, api_base: "http://100.98.220.75:8000/v1", api_key: dummy, order: 1}
        model_info: {health_check_timeout: 60, health_check_max_tokens: 16}
      - model_name: homelab/qwen3.8-27b
        litellm_params: {model: openai/DeepSeek-V4.1-Flash-1017, api_base: "http://100.97.87.120:8000/v1", api_key: dummy, order: 2}
        model_info: {health_check_timeout: 30, health_check_max_tokens: 16}
      - model_name: homelab/qwen3.8-27b
        litellm_params: {model: openai/ornith-ai__Ornith-1.5-35B-A3B-MLX-4bit, api_base: "http://100.89.15.120:8000/v1", api_key: dummy, order: 3}
        model_info: {health_check_timeout: 60, health_check_max_tokens: 16}
      # ── M2 的 Ornith（指名别名；同一份权重也是裸别名的第 3 级，见上）──
      # 2026-08-25 由 Qwen3.6-35B 换为 Ornith-1.5-35B-A3B（OMLX 的 is_default 同日已指向它）。
      # ☠️ 只暴露一个 Mac 35B：OMLX 池天花板 30GB 装不下两个（19.95 + 19.08GB），
      #    两个别名并存会让交替调用持续换入换出（~18s/次，期间对请求回 "is busy"）。
      # Qwen3.6 仍在盘上、仍可直连 OMLX 指名调用，只是不再从网关暴露。
      - model_name: mac/ornith
        litellm_params:
          model: openai/ornith-ai__Ornith-1.5-35B-A3B-MLX-4bit
          api_base: http://100.89.15.120:8000/v1
          api_key: dummy
      # ── Mac 无思维链变体（OMLX 的 fast profile: enable_thinking=false）──
      # 给「小 max_tokens + 要求简短输出」的消费方（k8sgpt 就是）：思维链模型的
      # reasoning_content 切分依赖 </think> 闭合标签，token 用完标签不出现 → OMLX 的 parser
      # 失去切分依据、把整段思考原样放进 content（不报错、不告警，只是答案变成一坨思考）。
      # 与 mac/ornith 共用同一份驻留权重：profile 只覆盖 universal field，不触发引擎重载。
      - model_name: mac/ornith-fast
        litellm_params:
          model: "openai/ornith-ai__Ornith-1.5-35B-A3B-MLX-4bit:fast"
          api_base: http://100.89.15.120:8000/v1
          api_key: dummy
      # ── open-notebook 专用：别名 = OMLX 的模型 ID 原文（2026-11-11）──
      # 推理请求统一走网关后，open-notebook 两个凭据的 base_url 指向这里。它的模型按名字绑在凭据上，
      # API 没有 PUT，改名只能在 UI 里删了重建（还要先扫 SurrealDB 有没有引用），所以网关这边按它
      # 现有的名字逐字建别名，open-notebook 那边一个模型都不用动。
      # ⚠️ 第一条与 mac/ornith 是同一个上游，别为了"去重"删掉其中一个：两边的消费方指名不同。
      # ⚠️ TTS / ASR / embedding 的用法与限制见 docs/decisions/omlx-speech-model-selection.md。
      #    TTS 的音色白名单（/v1/audio/voices）是 OMLX 自己的端点，网关不代理。
      - model_name: ornith-ai__Ornith-1.5-35B-A3B-MLX-4bit
        litellm_params:
          model: openai/ornith-ai__Ornith-1.5-35B-A3B-MLX-4bit
          api_base: http://100.89.15.120:8000/v1
          api_key: dummy
      - model_name: mlx-community__Qwen3-Embedding-4B-4bit-DWQ
        litellm_params:
          model: openai/mlx-community__Qwen3-Embedding-4B-4bit-DWQ
          api_base: http://100.89.15.120:8000/v1
          api_key: dummy
        model_info:
          mode: embedding
      - model_name: mlx-community__Qwen3-TTS-12Hz-1.7B-CustomVoice-8bit
        litellm_params:
          model: openai/mlx-community__Qwen3-TTS-12Hz-1.7B-CustomVoice-8bit
          api_base: http://100.89.15.120:8000/v1
          api_key: dummy
        model_info:
          mode: audio_speech
      - model_name: mlx-community__Qwen3-ASR-1.7B-8bit
        litellm_params:
          model: openai/mlx-community__Qwen3-ASR-1.7B-8bit
          api_base: http://100.89.15.120:8000/v1
          api_key: dummy
        model_info:
          mode: audio_transcription
      # ── Mac Studio（M5 Max / 128G，第三个自托管上游，2026-10-03）──
      # OMLX 0.7 的模型 ID 不带 org（目录是 ~/.omlx/models/lmstudio-community/<name>/），
      # 所以这里写的是裸名，不是 M2 那种 org__name。
      # 同一份权重也是裸别名的第 2 级、homelab/qwen3.8-27b 的第 1 级（见上），同时仍可指名。
      # ⚠️ 2026-11-15 起 homelab 内部的流量（三台 Mac 的客户端、magpie、open-notebook、xiaogpt、calibre）默认都先到这里，
      #    外发 key 的流量在 DGX 挂掉时也降到这里，全部挤同一个 OMLX 进程（N=2 时总吞吐不涨、每路减半）。
      #    内部 key 指名 studio/qwen3.8-27b 也会被 aliases 改道到 homelab/qwen3.8-27b（多了 DGX 兜底）。
      # 和 mac/* 一样靠 Studio 上的 allow_unauthenticated_inference 才能用 dummy（omlx.yaml 管着）。
      # 冷装载 ~14s（16.9G），之后常驻：Studio 的池天花板 ~106G，不存在 M2 那种换入换出。
      # ☠️ 指名调用要进虚拟 key 的白名单（坑 A）；兜底跳转不看白名单，窄 key 不必为兜底加它。
      - model_name: studio/qwen3.8-27b
        litellm_params:
          model: openai/Qwen3.8-27B-MLX-4bit
          api_base: http://100.98.220.75:8000/v1
          api_key: dummy
      # ── OpenRouter（第三来源，独立透传，2026-08-16）──
      # 全部模型透传：openrouter/<任意 OpenRouter 模型 ID> 直接命中。
      # ⚠️ key 是真实付费凭据：用环境变量引用（os.environ/OPENROUTER_API_KEY），
      #    值由 Vault secret/homelab/litellm-openrouter → ESO → Deployment env 注入，不进 git。
      - model_name: "openrouter/*"
        litellm_params:
          model: "openrouter/*"
          api_base: https://openrouter.ai/api/v1
          api_key: os.environ/OPENROUTER_API_KEY
      # NVIDIA build.nvidia.com（原第四来源 `nvidia/*`）2026-10-04 删除：自 08-25 起全 404、
      # 无消费方，且给 /v1/models 灌进 200+ 个不存在的条目。原因见 litellm-gateway.md。
    # ── Codex 多 agent 兼容层（2026-09-08）──
    # codex 的 `multi_agent_version: "v2"` 会把 agent 间消息作为私有的 `agent_message`
    # item 发进 `input`；自托管上游（vLLM / OMLX）拿 openai-python 的 union 校验请求体，
    # 不认这个类型 → HTTP 400「N validation errors」，表现为「一派 subagent 就报错」。
    # 这个 hook 在转发前把它降级成普通 message。详见 codex_compat.py 的文件头。
    # ⚠️ 模块是按 **config 文件所在目录 + 模块名** 找的（get_instance_fn），所以
    #    codex_compat.py 必须 subPath 挂到 /app/ 下，与本文件同目录。
    # ── 健康检查剔除（2026-11-15）：裸别名三级降级的第二层，配合模型条目里的 order ─────────────
    # 后台每 30s 给下面列明的三组的每个上游发一条 16 token 的探测（单条超时见各条的 model_info），
    # 探不通的上游在选路时直接跳过，探通了自动回来。
    # ☠️ 超时按「坏」和「忙」区分：DGX 30s（引擎半起、推理挂住要判得出来）；Studio / M2 60s ——
    #    2026-11-15 上线当天用的是统一 15s，DGX 宕机、全部流量压到 Studio 时，一个 2.8 万 token 的预填充
    #    就让 16 token 的探测排队 10s 以上，Studio 两次被误判不健康，请求被降到 M2（会话中途换模型、缓存作废）。
    # ☠️ background_health_check_model_groups 必须列明：不列 = 探全部模型，包括 openrouter/*（真花钱）
    #    和 M2 上的 TTS / ASR / embedding（会让 OMLX 换入换出）。本地实测列明后范围外的组 0 次探测。
    # ☠️ staleness 必须大于「最长单条超时 + 间隔」（60 + 30）：健康状态一过期，过滤就整个失效、
    #    所有上游重新放行（源码 _async_filter_health_check_unhealthy_deployments）。默认是间隔 ×2 = 60s，太紧。
    # ⚠️ 别设 router 级 allowed_fails / allowed_fails_policy：设了以后这层过滤会被跳过（同一函数开头），
    #    而且所有单上游别名（studio/qwen3.8-27b、mac/ornith…）也会开始冷却。
    # ⚠️ custom_dgx/ 前缀那条**刻意不进**降级也不探活：它是给「我就是要打 DGX」的消费方用的，
    #    被静默换成别的模型反而是坏事，DGX 不通时如实报连接错误。
    general_settings:
      background_health_checks: true
      health_check_interval: 30
      health_check_staleness_threshold: 180
      background_health_check_model_groups: ["DeepSeek-V4.1-Flash-1017", "qwen3.8-flash-next-tp2", "homelab/qwen3.8-27b"]
    router_settings:
      enable_health_check_routing: true

    # ── 客户端 IP（2026-10-03）──
    # 公网请求到 LiteLLM 时 TCP 对端已经是集群内地址，spend log 的 requester_ip_address
    # 全记成 10.42.0.152。client_ip hook 改用 Cloudflare 写的 CF-Connecting-IP。
    # ⚠️ 别改成 general_settings.use_x_forwarded_for：那会把整条可伪造的 XFF 链存成一个字符串。
    #    理由与信任边界见 client_ip.py 的文件头。
    # ── 上游兼容改写（2026-11-14）──
    # DGX 会对两种请求回 400（对话中间的 system 消息、不认识的 reasoning_effort 档位），
    # 裸别名的兜底把它们静默转给当时的兜底 Ornith。upstream_compat 按上面 model_info 的声明在转发前改写。
    # 详见 upstream_compat.py 的文件头；同样必须 subPath 挂到 /app/。
    litellm_settings:
      callbacks: ["codex_compat.codex_compat_handler", "client_ip.client_ip_handler",
                  "upstream_compat.upstream_compat_handler"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      annotations:
        # E1(b): 上面 config.yaml 块的 sha256 前 16 位 —— config 一变模板就变，ArgoCD 自然滚动重启。
        # ☠️ 没有它就是静默失效：subPath 挂载不接收 ConfigMap 更新 + LiteLLM 只在启动时读 config
        #    ⇒ ArgoCD Synced/Healthy、pod Running、探针全绿，而网关按**旧路由表**继续跑。
        #    2026-08-25 实际踩过一次（改了 mac/ornith 后必须手动 rollout restart 才生效）。
        # 值由 `just gen-embedded-scripts` 写入（scripts/check-embedded-scripts.py 的 STAMP_ONLY），别手改。
        checksum/config: "68cf5a01ff04080b"
        # 同理，但盯的是 codex_compat.py（litellm-codex-compat ConfigMap）：
        # 也是 subPath 挂载 + 只在启动时 import，改了不重启就是静默跑旧代码。
        checksum/codex-compat-py: "e5da4a39d90243d4"
        # 同理，盯 client_ip.py（litellm-client-ip ConfigMap）。
        checksum/client-ip-py: "73ac6eb0b2a145f1"
        # 同理，盯 upstream_compat.py（litellm-upstream-compat ConfigMap）。
        checksum/upstream-compat-py: "8333687bb362acb1"
      labels:
        app: litellm
    spec:
      # ⚠️ 网关必须钉在控制面：只有它能直连 DGX/Mac OMLX ——
      # worker-106 是 tagged-device，netmap 里没有这两个源（见 decisions/cluster-placement 与
      # storage106-as-homelab-worker）。被调度到 worker 会既连不上上游、又在那台 3G VM 上 OOM。
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: litellm
          # 官方 Python proxy（Rust 网关当前仅 /v1/realtime）。这个 digest 是 litellm 1.103.1
          # （2026-10-28 在 pod 内用 importlib.metadata 核过；旧注释写的 v1.94.1 是错的）。
          image: litellm/litellm@sha256:df15400b5b80925c45d3fd53f8f7a6c0eaa8a25a86833e1b358002e129018943
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: litellm-secret, key: master-key }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: litellm-db-secret, key: database-url }
            - name: UI_USERNAME
              valueFrom:
                secretKeyRef: { name: litellm-secret, key: ui-username }
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef: { name: litellm-secret, key: ui-password }
            # OpenRouter 第三来源的付费 key（Vault → ESO → 此处 env；config.yaml 用 os.environ 引用）
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: { name: litellm-openrouter-secret, key: openrouter-api-key }
            # DB 迁移失败即退出（fail-closed），避免无表静默跑
            - name: ENFORCE_PRISMA_MIGRATION_CHECK
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            # 必须落在 /app/（= config.yaml 所在目录），否则 callbacks 那行 import 不到。
            - name: codex-compat
              mountPath: /app/codex_compat.py
              subPath: codex_compat.py
              readOnly: true
            - name: client-ip
              mountPath: /app/client_ip.py
              subPath: client_ip.py
              readOnly: true
            - name: upstream-compat
              mountPath: /app/upstream_compat.py
              subPath: upstream_compat.py
              readOnly: true
          resources:
            # memory 512Mi → 1400Mi（2026-09-09）：**这不是为了防它自己 OOM**（limit 2Gi、
            # 零重启），是因为 512Mi 让调度器把它低估了 2.4 倍。
            # 实测 7d：RSS 峰 1231Mi、稳态基线 1060Mi，而页缓存只占 6%（WS 峰 1305Mi）——
            # 也就是说这 1.2G 是**真的匿名内存**，不是缓存虚高。逐日峰值 1060/1060/1060/
            # 1060/1060/1133/1231 平稳，非泄漏。取 RSS 峰 ×1.15 ≈ 1415，圆到 1400Mi。
            # 后果不在它自己身上：Burstable 容器长期超 request 900Mi，kubelet 驱逐排序里
            # 它和被挤到同节点的邻居一起危险。抬 request **不多占一分内存**（那 1.2G 本来
            # 就在用），只是让调度器不再自欺。k8s-node requests 60%→67%，余量充足。
            # ⚠️ 别顺手照 KRR 把 limit 从 2Gi 降到 1425Mi：WS 峰已 1305Mi，只剩 9% 余量，
            #    而下面那条 1Gi OOM 的教训正是首启 migration 尖峰顶爆的。
            requests: { cpu: 200m, memory: 1400Mi }
            # ⚠️ limit 1Gi 实测 OOMKilled（Python proxy 首启 Prisma migration + 依赖载入峰值高，
            #    2026-08-16 在 worker-106 上 exit 137）。抬到 2Gi 给 migration/burst 余量；
            #    控制面有 ~6GB available，2Gi limit 占得起。
            limits: { cpu: "1", memory: 2Gi }
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: codex-compat
          configMap:
            name: litellm-codex-compat
        - name: client-ip
          configMap:
            name: litellm-client-ip
        - name: upstream-compat
          configMap:
            name: litellm-upstream-compat
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
      name: http
---
# 跨集群入口（2026-08-29）—— 供 **oracle-k3s** 的作业经 Tailscale 直连本网关。
#
# 为什么需要：oracle 是 tagged 设备，拿不到用户级共享的 DGX，必须经 homelab 上的代理；
# 本网关就是那个代理（旧的 nginx `dgx-proxy` 已于 2026-08-08 退役）。
# 首个消费者：cloud/oracle/manifests/calibre-metadata/metadata-llm.yaml
#
# 为什么不走公网 `llm.meirong.dev`：那条路实测可达，但 Cloudflare 会对非浏览器
# 客户端返回 **`error code: 1010`（403）**，只有伪装浏览器 UA 才 200 —— 靠绕自家 WAF
# 维生太脆，WAF 一收紧就再次静默失效。走 Tailscale 不经 Cloudflare，也省掉 UA 伪装。
#
# 范式与 cloud/oracle/manifests/monitoring/monitoring-external.yaml 一致（独立
# `-external` Service，不动上面那个 ClusterIP，避免改动波及集群内既有消费者）。
# ⚠️ NodePort 监听节点所有网卡，不只是 Tailscale —— 敢这么开的前提是
# **LiteLLM 强制 virtual key 鉴权**（无 key 一律 401，实测越权模型 403）。
# 端口 31400 取自服务端口 4000，便于对照；homelab 侧已占用 31090/31093/31505/31952/32379。
apiVersion: v1
kind: Service
metadata:
  name: litellm-external
  namespace: litellm
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 31400
      name: http
