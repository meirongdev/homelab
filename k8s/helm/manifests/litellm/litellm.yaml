# LiteLLM — self-hosted LLM gateway (homelab).
#
# Public surface: llm.meirong.dev (Cloudflare Tunnel → Cilium Gateway → HTTPRoute).
# Auth model (此前的 oauth2-proxy 已不需要 — LiteLLM 管理面自带认证):
#   - inference (/v1/*, /openai, /anthropic, /genai): master key + virtual keys,
#     Authorization: Bearer sk-…  (LITELLM_MASTER_KEY 已设 ⇒ 默认强制 key 鉴权)
#   - admin UI (/ui): LiteLLM 自带登录 (UI_USERNAME/UI_PASSWORD, Vault→ESO)
# Config: config.yaml in git (model_list); keys/spend live in Postgres —— 2026-08-25 起
#   是共享实例 `databases/apps-pg` 的 litellm 租户，不再是本 ns 自带的 litellm-pg。
# 双自托管上游: DGX (qwen38-flash-next, 主) + MacPro M2 OMLX (Ornith-1.5-35B, 兜底),
#   fallbacks 键 = 严格的"主→兜底"链（见 docs/plans/apps/2026-08-01-litellm-gateway-migration.md §3 决策 6）。
# 升版：改 image digest + 注释 tag → git push。不要追 main-stable。
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  # ⚠️ api_base 必须带 /v1 后缀 —— LiteLLM 不会自动补。
  # api_key: dummy 不是机密（DGX vLLM 与 Mac OMLX 都忽略鉴权，"any token works"），因此可留在 git。
  # 强制 key 鉴权由 env LITELLM_MASTER_KEY 实现（general_settings.master_key 语义=require a key for all calls）。
  config.yaml: |
    model_list:
      # ── DGX（主；custom_dgx/ 前缀是历史约定，保留）──
      # 2026-09-02 DGX 换栈：DeepSeek-V4-Flash → Qwen3.8-Flash-Next NVFP4（RadixArk 权重、
      # 双节点 TP=2、官方 vllm/vllm-openai 镜像，不再吊在个人 fork 上）。api_base 不变，
      # 只有 served name 变，而旧名已从 /v1/models 消失 —— 旧别名一律 404，那不是"配置没生效"。
      # ☠️ max_model_len 从 1M 掉到 262144：按 1M 做过长上下文规划的下游要重算
      #    （已知受影响：open-notebook 的 large_context_model，见 docs/reference/open-notebook.md）。
      - model_name: custom_dgx/qwen38-flash-next
        litellm_params:
          model: openai/qwen38-flash-next
          api_base: http://100.97.87.120:8000/v1
          api_key: dummy
      # ── 无前缀别名 qwen38-flash-next：DGX 主 + Mac 兜底（fallbacks 键 = 严格的"主→兜底"，非轮询）──
      # 与裸 vLLM 同名是刻意的（下游改 base_url 即可绕过网关），代价是换模型时两边都得动。
      # ☠️ 改别名必须同步改 Postgres 里各虚拟 key 的 models 白名单，否则「清单正确 + Synced + 调用全 403」。
      - model_name: qwen38-flash-next
        litellm_params:
          model: openai/qwen38-flash-next
          api_base: http://100.97.87.120:8000/v1
          api_key: dummy
          fallbacks: ["mac/ornith"]
      # ── Mac 兜底（也是独立可用的实际模型）──
      # 2026-08-25 由 Qwen3.6-35B 换为 Ornith-1.5-35B-A3B（OMLX 的 is_default 同日已指向它）。
      # ☠️ 只暴露一个 Mac 35B：OMLX 池天花板 30GB 装不下两个（19.95 + 19.08GB），
      #    两个别名并存会让交替调用持续换入换出（~18s/次，期间对请求回 "is busy"）。
      # Qwen3.6 仍在盘上、仍可直连 OMLX 指名调用，只是不再从网关暴露。
      - model_name: mac/ornith
        litellm_params:
          model: openai/ornith-ai__Ornith-1.5-35B-A3B-MLX-4bit
          api_base: http://100.89.15.120:8000/v1
          api_key: dummy
      # ── Mac 无思维链变体（OMLX 的 fast profile: enable_thinking=false）──
      # 给「小 max_tokens + 要求简短输出」的消费方（k8sgpt 就是）：思维链模型的
      # reasoning_content 切分依赖 </think> 闭合标签，token 用完标签不出现 → OMLX 的 parser
      # 失去切分依据、把整段思考原样放进 content（不报错、不告警，只是答案变成一坨思考）。
      # 与 mac/ornith 共用同一份驻留权重：profile 只覆盖 universal field，不触发引擎重载。
      - model_name: mac/ornith-fast
        litellm_params:
          model: "openai/ornith-ai__Ornith-1.5-35B-A3B-MLX-4bit:fast"
          api_base: http://100.89.15.120:8000/v1
          api_key: dummy
      # ── OpenRouter（第三来源，独立透传，2026-08-16）──
      # 全部模型透传：openrouter/<任意 OpenRouter 模型 ID> 直接命中。
      # ⚠️ key 是真实付费凭据：用环境变量引用（os.environ/OPENROUTER_API_KEY），
      #    值由 Vault secret/homelab/litellm-openrouter → ESO → Deployment env 注入，不进 git。
      - model_name: "openrouter/*"
        litellm_params:
          model: "openrouter/*"
          api_base: https://openrouter.ai/api/v1
          api_key: os.environ/OPENROUTER_API_KEY
      # ── NVIDIA（第四来源：build.nvidia.com 免费 API，独立透传，2026-08-16）──
      # ☠️ 这条现在是坏的（2026-08-25 查清）：`openai/nvidia/*` 会让发给上游的模型名
      #    多带一层 `nvidia/`，实测 404 page not found。key 和上游都没问题 ——
      #    pod 内直连 NVIDIA：裸名 meta/llama-3.3-70b-instruct 回 200，
      #    带前缀的 nvidia/meta/llama-3.3-70b-instruct 回同样的 404。
      #    修法是把 model 改成 "openai/*"（让捕获的通配内容单独成为模型名）。
      # ⚠️ 这把 key 不是单模型授权：查 NVIDIA 的 /v1/models 返回 102 个模型。
      #    授权问题回 401/403，404 page not found 是路由/模型名对不上，别混。
      # ⚠️ nvidia 不是 LiteLLM 原生 provider，需用 openai/ 前缀声明 OpenAI 兼容调用。
      #    详情与取模型清单的命令见 docs/reference/litellm-gateway.md。
      # ⚠️ key 是真实凭据：环境变量引用（os.environ/NVIDIA_API_KEY），
      #    值由 Vault secret/homelab/litellm-nvidia → ESO → Deployment env 注入，不进 git。
      - model_name: "nvidia/*"
        litellm_params:
          model: "openai/nvidia/*"
          api_base: https://integrate.api.nvidia.com/v1
          api_key: os.environ/NVIDIA_API_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      annotations:
        # E1(b): 上面 config.yaml 块的 sha256 前 16 位 —— config 一变模板就变，ArgoCD 自然滚动重启。
        # ☠️ 没有它就是静默失效：subPath 挂载不接收 ConfigMap 更新 + LiteLLM 只在启动时读 config
        #    ⇒ ArgoCD Synced/Healthy、pod Running、探针全绿，而网关按**旧路由表**继续跑。
        #    2026-08-25 实际踩过一次（改了 mac/ornith 后必须手动 rollout restart 才生效）。
        # 值由 `just gen-embedded-scripts` 写入（scripts/check-embedded-scripts.py 的 STAMP_ONLY），别手改。
        checksum/config: "235883358d522dc8"
      labels:
        app: litellm
    spec:
      # ⚠️ 网关必须钉在控制面：只有它能直连 DGX/Mac OMLX ——
      # worker-106 是 tagged-device，netmap 里没有这两个源（见 decisions/cluster-placement 与
      # storage106-as-homelab-worker）。被调度到 worker 会既连不上上游、又在那台 3G VM 上 OOM。
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: litellm
          # litellm/litellm:v1.94.1 @ 2026-08-01（官方 Python proxy；Rust 网关当前仅 /v1/realtime）
          image: litellm/litellm@sha256:29b7f41dd84601550354b98a8e7c767256a18300ad20a5821fbb652ec0a3ea93
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: litellm-secret, key: master-key }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: litellm-db-secret, key: database-url }
            - name: UI_USERNAME
              valueFrom:
                secretKeyRef: { name: litellm-secret, key: ui-username }
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef: { name: litellm-secret, key: ui-password }
            # OpenRouter 第三来源的付费 key（Vault → ESO → 此处 env；config.yaml 用 os.environ 引用）
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: { name: litellm-openrouter-secret, key: openrouter-api-key }
            # NVIDIA 第四来源的免费 API key（Vault → ESO → 此处 env）
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef: { name: litellm-nvidia-secret, key: nvidia-api-key }
            # DB 迁移失败即退出（fail-closed），避免无表静默跑
            - name: ENFORCE_PRISMA_MIGRATION_CHECK
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            # ⚠️ limit 1Gi 实测 OOMKilled（Python proxy 首启 Prisma migration + 依赖载入峰值高，
            #    2026-08-16 在 worker-106 上 exit 137）。抬到 2Gi 给 migration/burst 余量；
            #    控制面有 ~6GB available，2Gi limit 占得起。稳定后可下探（见 KRR）。
            limits: { cpu: "1", memory: 2Gi }
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
      name: http
---
# 跨集群入口（2026-08-29）—— 供 **oracle-k3s** 的作业经 Tailscale 直连本网关。
#
# 为什么需要：oracle 是 tagged 设备，拿不到用户级共享的 DGX，必须经 homelab 上的代理；
# 本网关就是那个代理（旧的 nginx `dgx-proxy` 已于 2026-08-08 退役）。
# 首个消费者：cloud/oracle/manifests/calibre-metadata/metadata-llm.yaml
#
# 为什么不走公网 `llm.meirong.dev`：那条路实测可达，但 Cloudflare 会对非浏览器
# 客户端返回 **`error code: 1010`（403）**，只有伪装浏览器 UA 才 200 —— 靠绕自家 WAF
# 维生太脆，WAF 一收紧就再次静默失效。走 Tailscale 不经 Cloudflare，也省掉 UA 伪装。
#
# 范式与 cloud/oracle/manifests/monitoring/monitoring-external.yaml 一致（独立
# `-external` Service，不动上面那个 ClusterIP，避免改动波及集群内既有消费者）。
# ⚠️ NodePort 监听节点所有网卡，不只是 Tailscale —— 敢这么开的前提是
# **LiteLLM 强制 virtual key 鉴权**（无 key 一律 401，实测越权模型 403）。
# 端口 31400 取自服务端口 4000，便于对照；homelab 侧已占用 31090/31093/31505/31952/32379。
apiVersion: v1
kind: Service
metadata:
  name: litellm-external
  namespace: litellm
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 31400
      name: http
