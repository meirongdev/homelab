# Vault → K8s Secret（ESO）。
# ⚠️ ClusterSecretStore vault-backend 的 provider.path 已是 "secret"（KV v2 挂载点），
#    所以 remoteRef.key 用 `homelab/litellm`（不带 secret/ 前缀），与 jobs-sg / open-notebook 一致。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secret
  namespace: litellm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: master-key
      remoteRef: { key: homelab/litellm, property: master_key }
    - secretKey: ui-username
      remoteRef: { key: homelab/litellm, property: ui_username }
    - secretKey: ui-password
      remoteRef: { key: homelab/litellm, property: ui_password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-secret
  namespace: litellm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database-url
      remoteRef: { key: homelab/litellm-db, property: database_url }
    - secretKey: postgres-password
      remoteRef: { key: homelab/litellm-db, property: db_password }
---
# OpenRouter 第三来源的付费 key（独立路径，与其它 litellm secret 分开管理/轮换）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-openrouter-secret
  namespace: litellm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-openrouter-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: openrouter-api-key
      remoteRef: { key: homelab/litellm-openrouter, property: api_key }
---
# NVIDIA 第四来源的 key（build.nvidia.com 免费 API，独立路径便于轮换）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-nvidia-secret
  namespace: litellm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-nvidia-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: nvidia-api-key
      remoteRef: { key: homelab/litellm-nvidia, property: api_key }
