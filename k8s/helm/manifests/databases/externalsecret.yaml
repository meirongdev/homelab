---
# 共享实例的口令。Vault → K8s Secret（ESO）。
# ⚠️ ClusterSecretStore vault-backend 的 provider.path 已是 "secret"（KV v2 挂载点），
#    所以 remoteRef.key 不带 secret/ 前缀（与 litellm / jobs-sg / open-notebook 一致）。
#
# ☠️ **两个租户口令刻意从各自应用自己的 Vault 路径取，不在这里另存一份副本。**
#    litellm 与 multica 的连接串里用的就是这两个值；抄一份到 secret/homelab/databases
#    就等于给同一个口令造了第二个真相源，改一处另一处静默过期。
#
# ⚠️ 改 Vault 里的口令**不会**改已初始化实例里的角色口令 —— 下面的 initdb 脚本只在
#    数据目录为空时跑一次。轮换口令要手工 `ALTER ROLE <t> PASSWORD ...` 再改 Vault
#    （与 multica-secret.yaml 文件头记的同一个坑）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apps-pg-bootstrap
  namespace: databases
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: apps-pg-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # 实例超级用户。只用于运维与建租户，没有任何应用拿它连库。
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: homelab/databases, property: postgres_password }
    # 租户口令 —— 真相源在各应用自己的路径里（见文件头）。
    - secretKey: LITELLM_PASSWORD
      remoteRef: { key: homelab/litellm-db, property: db_password }
    - secretKey: MULTICA_PASSWORD
      remoteRef: { key: homelab/multica, property: postgres_password }
    - secretKey: NAKAMA_PASSWORD
      remoteRef: { key: homelab/nakama, property: db_password }
