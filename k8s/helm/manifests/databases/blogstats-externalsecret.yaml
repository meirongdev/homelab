---
# blogstats 租户的两个口令（owner + 只读）。Vault → K8s Secret（ESO）。
#
# ☠️ **刻意不并进同目录的 externalsecret.yaml（apps-pg-bootstrap）**：ESO 里任何一个
#    remoteRef 取不到就整个 ExternalSecret 同步失败。并进去等于让「Vault 里还没写
#    homelab/blogstats」把正在用的三个租户口令一起拖成 stale —— Secret 有
#    deletionPolicy: Retain 不会消失，但从此不再更新，而且不报错。
#    单独一个对象 = 失败面只有它自己，代价是多一个文件。
#
# ⚠️ remoteRef.key 不带 `secret/` 前缀（ClusterSecretStore 的 provider.path 已是 `secret`），
#    与同目录 externalsecret.yaml 一致。两种写法在本集群都能同步，同一个目录里别混。
#
# ⚠️ **改 Vault 里的口令不会改已初始化实例里的角色口令** —— initdb 里那两个函数都是
#    `WHERE NOT EXISTS` 守着的。轮换要手工 `ALTER ROLE blogstats PASSWORD ...` 再改 Vault
#    （同 externalsecret.yaml 文件头记的那个坑）。
#
# ── 一次性：在**已经跑着**的实例上建这个租户 ─────────────────────────────────
# initdb 脚本只在数据目录为空时执行，改它对现有实例无效。但那个脚本本身是幂等的
# （建角色/建库都带 `WHERE NOT EXISTS`），而且它就挂在跑着的 pod 里（whole-volume 挂载，
# ConfigMap 一变文件就跟着变），所以不用另抄一份 SQL —— 把它再跑一遍即可：前三个租户
# 原地跳过，只多出 blogstats。整条命令与两个口令的取法见
# docs/decisions/blog-pageview-rollup-store.md 的「激活」一节（R6：命令只留一处）。
#
# ⚠️ 跑完去 backup/overlays/homelab/backup-script.yaml 确认 2f) 那段在（已随本次改动
#    加好）—— 漏了就是静默不备份，H4 查不出「实例里多了个库」。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apps-pg-blogstats
  namespace: databases
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: apps-pg-blogstats
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # 键名用大写下划线：它们直接当 apps-pg 容器的 env 名（同 apps-pg-bootstrap 的风格）。
    - secretKey: BLOGSTATS_PASSWORD
      remoteRef: { key: homelab/blogstats, property: owner_password }
    - secretKey: BLOGSTATS_RO_PASSWORD
      remoteRef: { key: homelab/blogstats, property: readonly_password }
