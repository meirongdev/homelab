# Open Notebook 模型接线的 GitOps 化 —— 声明式 provisioner（照抄 uptime-kuma-provisioner 的房子模式）
#
# 为什么存在：credentials / models / defaults 本来只能在 Settings UI 里配，落 SurrealDB——
# 又一份"活在 DB、不在 git"的运行时状态（旧 LLM 网关 PVC-SQLite 同款债）。上游 API
# （/api/credentials、/api/models、/api/models/defaults）足够完整，2026-08-01 已对活实例
# 全程干跑验证（create → test → delete 全通，DGX 的 model test 拿到了真实补全）。
#
# 行为：
#   - 幂等 reconcile：credential 按 name、model 按 (name,type) 对账，缺则建，漂移则改/告警
#   - defaults 每次同步都 PUT（七个默认位全部指向下面声明的模型）
#   - 播客 profiles（episode 的 outline/transcript 模型 + speaker 的 TTS 模型与音色）
#     按 name 对账、read-modify-write。**这是与 defaults 分开的第二套接线**：不配它，
#     Podcasts 页就常驻 "Setup required" 横幅，defaults 配得多全都没用（2026-08-22 补）
#   - **不 prune**：UI 里手工加的实验性模型/凭据只告警不删（与 uptime-kuma 的 prune 相反——
#     哑监控项会永久变红，孤儿模型无害）
#   - 连通性 test 只告警不失败：DGX/Mac 是外部机器，它们睡着不该把 personal-services
#     整个 App 的 sync 打成失败
#
# 已知现状（2026-08-01 晚，Mac 侧经 macbook/ansible 排障后）：7 个 test 里 6 个绿。
#   - 之前 embedding 500 / "No module named mlx_audio.*" 的根因是 **omlx-server 旧进程**
#     （venv 里 mlx-audio 其实装着，进程重启后全部消失）——不是缺依赖。
#   - ⚠️ **想换 STT/TTS 型号先读 docs/decisions/omlx-speech-model-selection.md**：
#     TTS 只能收音色名（空音色表的模型直接出局），STT 单次请求要吃满 10 分钟音频
#     （content_core 的分段长度写死在库里），两个新 ASR 在这个长度上都是 HTTP 200 的静默失败。
#   - 唯一常驻 WARN：TTS 的 model test。Open Notebook 的 test 硬编码 voice='alloy'，
#     Qwen3-TTS 只有 serena/vivian/uncle_fu/ryan/aiden/ono_anna/sohee/eric/dylan。
#     功能本身是好的（voice=serena 直打出真 WAV，STT 能转录回来）。
#     ⚠️ 2026-08-22：这不只是 test 的显示问题 —— 上游 seed 的 speaker profile 里
#     voice_id 也是 OpenAI 音色名，真去生成播客同样 500。现由 SPEAKER_VOICES 纳管，
#     白名单从 OMLX 的 /v1/audio/voices 现取（不写死，模型换了不会静默失真）。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-notebook-provisioner-script
  namespace: personal-services
data:
  provision.py: |
    import json, os, sys, urllib.parse, urllib.request, urllib.error

    API = os.environ.get("API", "http://open-notebook.personal-services.svc:5055/api")
    PW = os.environ["OPEN_NOTEBOOK_PASSWORD"]

    # ---- 期望状态（改这里 + git push = 改配置）----
    # 2026-11-11 起两个凭据都指向 LiteLLM 网关（集群内 Service），不再直连 DGX / M2 的 Tailscale IP；
    # personal-services 的网络策略随之只放行 litellm:4000。api_key 是网关的虚拟 key
    # （key_alias=open-notebook，白名单 = 下面 MODELS 的五个名字），Vault secret/homelab/open-notebook
    # 的 litellm_key → Secret open-notebook-litellm → env LITELLM_KEY。
    # ⚠️ 凭据的 GET 只回 has_api_key、读不回原值，所以 api_key 每次 sync 都写一遍（幂等）：
    #    轮换 key 只要改 Vault，下一次 sync 自动跟上。
    LLM_GATEWAY = "http://litellm.litellm.svc.cluster.local:4000/v1"
    LITELLM_KEY = os.environ["LITELLM_KEY"]
    CREDENTIALS = [
        # ⚠️ 凭据名 `dgx-vllm` 只是个标识符（2026-09-19 那一栈曾是 SGLang，2026-09-30 起又是 vLLM），
        #    **刻意不改名**：本 provisioner 只增不删，改名只会在 UI 里多出一条新凭据、
        #    旧那条变成没人用的死条目，还得手动删。它只是个标识符，不参与路由。
        #    同理 `mac-omlx` 现在也指向网关；两个名字都只剩"这组模型原来来自哪"的含义。
        # DGX 换栈、换端口都只改网关（litellm.yaml），这里不用动。
        {"name": "dgx-vllm", "provider": "openai_compatible",
         "modalities": ["language"],
         "api_key": LITELLM_KEY, "base_url": LLM_GATEWAY},
        {"name": "mac-omlx", "provider": "openai_compatible",
         "modalities": ["language", "embedding", "speech_to_text", "text_to_speech"],
         "api_key": LITELLM_KEY, "base_url": LLM_GATEWAY},
    ]
    MODELS = [
        # 2026-09-19 DGX 换主力栈：qwen38-flash-next → qwen3.8-flash-next-tp2
        # （Qwen3.8-27B-Uncensored NVFP4 + SGLang + DFlash2，单节点）。
        # ☠️ 2026-11-11 起这里的名字是 **LiteLLM 的别名**（经网关），必须同时满足两件事：
        #    在 litellm.yaml 的 model_list 里存在，且在 open-notebook 那把虚拟 key 的白名单里（坑 A）。
        #    写错会当场 400（网关不认），不再像直连 SGLang 时那样静默回显。
        #    这个名字是裸别名，带兜底：DGX 出错时网关改由 M2 的 Ornith 作答（交互场景这正是想要的）。
        # ⚠️ 本 provisioner 只增不删（unmanaged models 只打 note）：改模型名之后**旧条目会
        #    留在 UI 里**，git push 带不走它，得手动删。
        # ☠️ **旧条目的危害在 2026-09-19 换成 SGLang 之后变大了**：vLLM 时代选中死条目会当场
        #    404（"选中即报错"，本注释的旧说法），而 **SGLang 接受任意 model 名并原样回显** ——
        #    实测选中 `qwen38-flash-next` 回 **200**，`model` 字段照抄那个不存在的名字，
        #    实际跑的是当前加载的模型。即它不再报错，而是**静默给出挂着错名字的结果**。
        #    所以换栈后清理旧条目从"卫生"升级成"必须"。
        #    ✅ 2026-09-19 已删掉 qwen38-flash-next（2026-09-03 那次删的是 deepseek-v4-flash）。
        #    删前的扫法：**直接查 SurrealDB 全部 19 张表**，别只扫 API
        #    （`SELECT * FROM <table>` 逐表 grep model id；API 有 404 的端点，扫不到不等于没有）。
        #    三次扫下来外部引用都是 0。
        #    ✅ 2026-11-11 删掉 qwen3.8-27b-sglang 与 mlx-community__Qwen3.6-35B-A3B-nvfp4（推理改走网关后
        #    两个名字网关都不认；Qwen3.6 的备选位由下面的 studio/qwen3.8-27b 接替）。
        {"name": "qwen3.8-flash-next-tp2", "type": "language", "credential": "dgx-vllm"},
        # 备用对话模型（非默认）：DGX 是跨境共享机器且暂无告警（ROADMAP #4），
        # 它不可达时在 UI 里一键切到这个本地 35B（262k ctx）兜底。
        # ⚠️ 下面四个名字是 OMLX 的模型 ID 原文。经网关后照样能用，是因为网关按这些原名建了同名别名
        #    （litellm.yaml「open-notebook 专用」那段）—— 这里的模型按名字绑在凭据上、API 没有 PUT，
        #    改名就得在 UI 里删了重建，所以是网关迁就这边，不是反过来。
        # 2026-08-25 由 Qwen3.6-35B 换为 Ornith-1.5-35B-A3B（OMLX 的 is_default 同日已指向它）。
        {"name": "ornith-ai__Ornith-1.5-35B-A3B-MLX-4bit", "type": "language", "credential": "mac-omlx"},
        # 第二备选对话模型（非默认，2026-11-11 接替 Qwen3.6-35B）：Mac Studio 的 Qwen3.8-27B（262k ctx，常驻、
        # 不与 M2 抢内存）。名字是网关别名原样（带 studio/ 前缀），所以它的请求走 Studio 而不是 M2；
        # 挂在 mac-omlx 凭据下只是分组（两个凭据都指向网关）。网关别名不在任何兜底链里：Studio 不通就如实报错。
        # ☠️ 它在 open-notebook 那把 key 的白名单里是单独加的（坑 A），改别名要连 key 一起改。
        {"name": "studio/qwen3.8-27b", "type": "language", "credential": "mac-omlx"},
        {"name": "mlx-community__Qwen3-Embedding-4B-4bit-DWQ", "type": "embedding", "credential": "mac-omlx"},
        {"name": "mlx-community__Qwen3-TTS-12Hz-1.7B-CustomVoice-8bit", "type": "text_to_speech", "credential": "mac-omlx"},
        {"name": "mlx-community__Qwen3-ASR-1.7B-8bit", "type": "speech_to_text", "credential": "mac-omlx"},
        # 刻意不纳管的 Mac 模型：
        #   - Qwen3-Reranker-0.6B-4bit —— OMLX /v1/rerank 已验证（真实相关性分数），但
        #     Open Notebook v1.14 没有 rerank 消费位（providers 无该 modality、defaults 无该
        #     字段、search.py 无重排步骤），注册进来只会是个假接线。留给未来的网关/RAG 消费方。
        #   - gemma-4 / diffusiongemma —— mlx-learning 项目的实验模型，不属于这套阅读栈。
        #   ☠️ 2026-08-22 起 Mac 上另有 4 个**看着像升级、实测全部不可用**的语音模型。
        #     逐项数字与复现见 docs/decisions/omlx-speech-model-selection.md，摘要：
        #   - Qwen3-TTS-...-VoiceDesign-8bit —— /v1/audio/voices 返回 []，要 `instruct`
        #     描述音色；podcast_creator/nodes.py:273 只发 text/voice/output_file，发不出去。
        #   - chatterbox-multilingual-v3 —— 同样空音色表，要参考音频做零样本克隆，
        #     没有「按音色名选人」的入口。这两个换上去横幅照样消失、只在合成那步 500。
        #   - Mega-ASR-8bit —— 短句/退化英文比现役略准（1.3–2.1%），但 420s 起长音频
        #     重复崩塌（571s: 7475 token / 172.8s / WER 470%）。而 content_core 是按
        #     **10 分钟**切段送 STT，正好落在崩塌区。
        #   - GLM-ASR-Nano-2512-8bit —— 硬截断在约 45 秒：103s 样本 102 token、571s 样本
        #     112 token，输出量与输入时长无关。10 分钟音频只转出 8%，且 HTTP 200。
    ]
    DEFAULTS = {  # 值是上面 MODELS 里的 name
        "default_chat_model": "qwen3.8-flash-next-tp2",
        "default_transformation_model": "qwen3.8-flash-next-tp2",
        # ⚠️ max_model_len 仍是 262144（2026-09-19 换栈后不变，实测 /v1/models 确认）：
        #    长上下文角色有真实上限，整本书一次性塞进去会超窗。
        #    兜底的 Mac Ornith 也是 262k，换过去拿不到更多窗口。
        "large_context_model": "qwen3.8-flash-next-tp2",
        "default_tools_model": "qwen3.8-flash-next-tp2",
        "default_embedding_model": "mlx-community__Qwen3-Embedding-4B-4bit-DWQ",
        "default_text_to_speech_model": "mlx-community__Qwen3-TTS-12Hz-1.7B-CustomVoice-8bit",
        "default_speech_to_text_model": "mlx-community__Qwen3-ASR-1.7B-8bit",
    }
    # 播客 profiles 的接线 —— 与上面 DEFAULTS 是**两套东西**：Podcasts 页的
    # "Setup required" 横幅只看 episode 的 outline_llm/transcript_llm 与 speaker 的
    # voice_model（frontend/src/lib/types/podcasts.ts::needsModelSetup），defaults 配得
    # 再全也不影响它。上游首启 seed 出来的三个 episode + 三个 speaker 这三个字段全是 null。
    EPISODE_PROFILE_LLMS = {   # profile 名 -> 出大纲/台本的 language 模型
        # ⚠️ 同样受 262k 限制（这里曾按旧栈 1M 写「整本书塞得进去」）。长书出大纲
        #    若开始截断/报错，先看是不是超窗，别先怀疑上游挂了。
        "tech_discussion": "qwen3.8-flash-next-tp2",
        "business_analysis": "qwen3.8-flash-next-tp2",
        "solo_expert": "qwen3.8-flash-next-tp2",
    }
    PODCAST_TTS = "mlx-community__Qwen3-TTS-12Hz-1.7B-CustomVoice-8bit"
    PODCAST_LANGUAGE = None    # None = 沿用上游默认（英文）；要中文播客填 "zh"
    # ☠️ seed 的 speaker.voice_id 是 **OpenAI 音色名**（nova/alloy/echo/shimmer/ash），
    # Qwen3-TTS 收到直接 500 `Speaker 'nova' not supported`。只补 voice_model 会让横幅消失、
    # 播客却在合成那步才炸 —— 音色必须一起换掉，否则修的是症状。
    # 白名单见下面的 TTS_VOICES（2026-11-11 起写死，原因在那里）。
    # 同 profile 内不重复分配（两人同音色听不出谁在说）。性别是按名字推的，没逐个试听。
    SPEAKER_VOICES = {         # speaker profile 名 -> {speaker 名: 音色}
        "tech_experts": {"Dr. Alex Chen": "eric", "Jamie Rodriguez": "aiden"},
        "business_panel": {"Marcus Thompson": "ryan", "Elena Vasquez": "serena",
                           "Johny Bing": "dylan"},
        "solo_expert": {"Professor Sarah Kim": "vivian"},
    }
    # ----------------------------------------------

    def req(method, path, body=None, timeout=30):
        r = urllib.request.Request(
            API + path, method=method,
            headers={"Authorization": "Bearer " + PW, "Content-Type": "application/json"},
            data=json.dumps(body).encode() if body is not None else None)
        try:
            with urllib.request.urlopen(r, timeout=timeout) as resp:
                raw = resp.read()
                return resp.status, json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            raw = e.read()
            try: parsed = json.loads(raw)
            except Exception: parsed = raw.decode(errors="replace")[:200]
            return e.code, parsed

    fatal = 0

    def must(status, payload, what):
        global fatal
        if status >= 400:
            print(f"[provision] FATAL {what}: HTTP {status} {payload}")
            fatal += 1
            return False
        return True

    # 1) credentials：按 name 对账
    st, existing = req("GET", "/credentials")
    if not must(st, existing, "GET /credentials"): sys.exit(1)
    by_name = {c["name"]: c for c in existing}
    cred_ids = {}
    for want in CREDENTIALS:
        have = by_name.get(want["name"])
        if have is None:
            st, resp = req("POST", "/credentials", want)
            if must(st, resp, f"create credential {want['name']}"):
                cred_ids[want["name"]] = resp["id"]
                print(f"[provision] created credential {want['name']} -> {resp['id']}")
        else:
            cred_ids[want["name"]] = have["id"]
            drift = {k: want[k] for k in ("base_url", "modalities")
                     if have.get(k) != want[k]}
            # api_key 读不回来（GET 只回 has_api_key），每次都随 PUT 写一遍，见 CREDENTIALS 上方的说明。
            st, resp = req("PUT", f"/credentials/{have['id']}", {**drift, "api_key": want["api_key"]})
            if must(st, resp, f"update credential {want['name']}"):
                print(f"[provision] credential {want['name']}: "
                      f"{'updated ' + str(sorted(drift)) if drift else 'up-to-date'}, api_key synced")
    unmanaged = sorted(set(by_name) - {c["name"] for c in CREDENTIALS})
    if unmanaged:
        print(f"[provision] note: unmanaged credentials (left alone): {unmanaged}")

    # 2) models：按 (name,type) 对账。API 无 PUT——漂移只告警，人来决定删重建
    st, existing = req("GET", "/models")
    if not must(st, existing, "GET /models"): sys.exit(1)
    by_key = {(m["name"], m["type"]): m for m in existing}
    model_ids = {}
    for want in MODELS:
        key = (want["name"], want["type"])
        have = by_key.get(key)
        if have is None:
            body = {"name": want["name"], "type": want["type"],
                    "provider": "openai_compatible",
                    "credential": cred_ids[want["credential"]]}
            st, resp = req("POST", "/models", body)
            if must(st, resp, f"create model {want['name']}"):
                model_ids[want["name"]] = resp["id"]
                print(f"[provision] created model {want['type']}: {want['name']}")
        else:
            model_ids[want["name"]] = have["id"]
            if have.get("credential") != cred_ids.get(want["credential"]):
                print(f"[provision] WARN model {want['name']} points at a different credential "
                      f"({have.get('credential')}); not auto-fixed (no PUT route) — delete & resync to adopt")
            else:
                print(f"[provision] model {want['name']} up-to-date")
    unmanaged = sorted(set(by_key) - {(m["name"], m["type"]) for m in MODELS})
    if unmanaged:
        print(f"[provision] note: unmanaged models (left alone): {unmanaged}")

    # 3) defaults：解析 name -> id，整组 PUT（幂等）
    want_defaults = {k: model_ids[v] for k, v in DEFAULTS.items() if v in model_ids}
    st, resp = req("PUT", "/models/defaults", want_defaults)
    if must(st, resp, "PUT /models/defaults"):
        print(f"[provision] defaults set: {sorted(want_defaults)}")

    # 4) 播客 profiles：read-modify-write。PUT 收的是 *Create* 模型（整体替换，不是 patch），
    #    所以要把 seed 的文案/backstory 原样回填，只覆盖上面声明的那几个字段 ——
    #    好处是几十行上游 prose 不必抄进 git，坏处是 prose 仍只活在 DB（可接受：它是
    #    上游默认值，不是我们的决策；真要改文案就在 UI 改，provisioner 不会覆盖回去）。
    #    **不创建**：profile 由应用首启 seed，缺了只告警（说明库是空的或被手工删过）。
    # 音色白名单。原来 provision 时直接问 OMLX 的 /v1/audio/voices 现取；2026-11-11 推理改走网关后，
    # 这个 Job 所在的 ns 按网络策略碰不到 tailnet，而 /v1/audio/voices 是 OMLX 自己的端点、网关不代理。
    # 现取会永远失败、校验永远被跳过，等于死代码，所以改成写死（值是当天从 OMLX 现取的原样）。
    # ☠️ 换 TTS 模型时必须一起更新：从能连 tailnet 的机器跑
    #      curl -s "http://100.89.15.120:8000/v1/audio/voices?model=$PODCAST_TTS" | jq -c .voices
    #    换型号前先读 docs/decisions/omlx-speech-model-selection.md。
    TTS_VOICES = {"aiden", "dylan", "eric", "ono_anna", "ryan", "serena", "sohee", "uncle_fu", "vivian"}

    def live_voices():
        return TTS_VOICES

    tts_id = model_ids.get(PODCAST_TTS)
    if tts_id is None:
        print(f"[provision] WARN TTS model {PODCAST_TTS} not registered; skipping speaker profiles")
    else:
        allowed = live_voices()
        st, existing = req("GET", "/speaker-profiles")
        if must(st, existing, "GET /speaker-profiles"):
            by_name = {p["name"]: p for p in existing}
            for name, voices in SPEAKER_VOICES.items():
                have = by_name.get(name)
                if have is None:
                    print(f"[provision] WARN speaker profile {name} absent (app seeds it on first boot); skipped")
                    continue
                bad = sorted(v for v in voices.values() if allowed is not None and v not in allowed)
                if bad:
                    # 不写已知坏值：voice_model 保持 null，UI 横幅继续亮 —— 那就是告警
                    print(f"[provision] WARN speaker profile {name}: voice(s) {bad} not offered by the "
                          f"backend (has {sorted(allowed)}); left unchanged, banner stays as the alarm")
                    continue
                # 过滤无名 speaker：sorted() 混 None 与 str 会 TypeError，把整个 hook 炸掉
                unmapped = sorted(n for n in {s.get("name") for s in have["speakers"]}
                                  if n and n not in voices)
                if unmapped:
                    print(f"[provision] WARN speaker profile {name}: speaker(s) {unmapped} have no voice "
                          f"in SPEAKER_VOICES; keeping the seeded voice_id (an OpenAI name → TTS will 500)")
                speakers = [dict(s, voice_id=voices.get(s.get("name"), s.get("voice_id")))
                            for s in have["speakers"]]
                if have.get("voice_model") == tts_id and speakers == have["speakers"]:
                    print(f"[provision] speaker profile {name} up-to-date")
                    continue
                st, resp = req("PUT", f"/speaker-profiles/{have['id']}",
                               {"name": have["name"], "description": have.get("description", ""),
                                "voice_model": tts_id, "speakers": speakers})
                if must(st, resp, f"update speaker profile {name}"):
                    print(f"[provision] updated speaker profile {name}: voice_model + "
                          f"voices {[s['voice_id'] for s in speakers]}")
            unmanaged = sorted(set(by_name) - set(SPEAKER_VOICES))
            if unmanaged:
                print(f"[provision] note: unmanaged speaker profiles (left alone): {unmanaged}")

    st, existing = req("GET", "/episode-profiles")
    if must(st, existing, "GET /episode-profiles"):
        by_name = {p["name"]: p for p in existing}
        for name, llm in EPISODE_PROFILE_LLMS.items():
            have = by_name.get(name)
            if have is None:
                print(f"[provision] WARN episode profile {name} absent (app seeds it on first boot); skipped")
                continue
            llm_id = model_ids.get(llm)
            if llm_id is None:
                print(f"[provision] WARN episode profile {name}: model {llm} not registered; skipped")
                continue
            if have.get("speaker_config") is None:
                # PUT 的必填字段，null 补不出来（该 profile 的 speaker 被删过）
                print(f"[provision] WARN episode profile {name} has no speaker_config (orphaned); skipped")
                continue
            if (have.get("outline_llm") == llm_id and have.get("transcript_llm") == llm_id
                    and have.get("language") == PODCAST_LANGUAGE):
                print(f"[provision] episode profile {name} up-to-date")
                continue
            st, resp = req("PUT", f"/episode-profiles/{have['id']}",
                           {"name": have["name"], "description": have.get("description", ""),
                            "speaker_config": have["speaker_config"],
                            "outline_llm": llm_id, "transcript_llm": llm_id,
                            "language": PODCAST_LANGUAGE,
                            "default_briefing": have["default_briefing"],
                            "num_segments": have["num_segments"],
                            "max_tokens": have.get("max_tokens")})
            if must(st, resp, f"update episode profile {name}"):
                print(f"[provision] updated episode profile {name}: outline+transcript -> {llm}")
        unmanaged = sorted(set(by_name) - set(EPISODE_PROFILE_LLMS))
        if unmanaged:
            print(f"[provision] note: unmanaged episode profiles (left alone): {unmanaged}")

    if fatal:
        print(f"[provision] {fatal} fatal error(s)"); sys.exit(1)

    # 5) 连通性冒烟（只告警：外部机器睡着不该 fail 掉整个 sync）
    for name, cid in cred_ids.items():
        st, resp = req("POST", f"/credentials/{cid}/test", None, timeout=20)
        ok = isinstance(resp, dict) and resp.get("success")
        print(f"[provision] test credential {name}: {'OK' if ok else 'WARN'} "
              f"{(resp or {}).get('message', resp) if isinstance(resp, dict) else resp}")
    for name, mid in model_ids.items():
        st, resp = req("POST", f"/models/{mid}/test", None, timeout=60)
        ok = isinstance(resp, dict) and resp.get("success")
        msg = (resp or {}).get("message", "") if isinstance(resp, dict) else str(resp)
        print(f"[provision] test model {name}: {'OK' if ok else 'WARN'} {str(msg)[:140]}")

    print("[provision] DONE")
---
# Vault → open-notebook-litellm：open-notebook 调 LiteLLM 网关的虚拟 key（2026-11-11，推理请求统一走网关）。
# key 由 LiteLLM `/key/generate` 发出（key_alias=open-notebook），先写进 secret/homelab/open-notebook 的
# litellm_key 再提交本对象。只有下面的 provisioner 读它：它把 key 写进 open-notebook 的两个凭据，
# 应用本身从自己的库里取，不读这个 Secret。
# ☠️ 刻意不并进 open-notebook.yaml 的 open-notebook-secret：ESO 的 data 全有全无，这把 key 取不到时
#    会连 encryption-key / app-password 一起停止同步。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-notebook-litellm
  namespace: personal-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: open-notebook-litellm
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: litellm-key
      remoteRef:
        key: homelab/open-notebook
        property: litellm_key
---
# PostSync hook：personal-services App 每次 sync 后跑一遍（幂等，~10s）。
# 成功即删（BeforeHookCreation,HookSucceeded），失败保留 Job 供排查并使 sync 标红。
apiVersion: batch/v1
kind: Job
metadata:
  name: open-notebook-provisioner
  namespace: personal-services
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: provision
          image: docker.io/library/python:3.12-alpine
          command: ["python3", "/scripts/provision.py"]
          env:
            - name: OPEN_NOTEBOOK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-notebook-secret
                  key: app-password
            # 写进两个凭据的网关虚拟 key（见脚本里 CREDENTIALS 上方的说明）。
            - name: LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: open-notebook-litellm
                  key: litellm-key
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: open-notebook-provisioner-script
