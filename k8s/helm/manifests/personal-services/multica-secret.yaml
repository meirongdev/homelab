---
# Multica 的密钥 —— chart 的 existingSecret 指向它（k8s/helm/values/multica.yaml）。
#
# ⚠️ chart 用 `envFrom: secretRef` **整个** 注入 backend 容器，所以这个 Secret 里的
#    每一个 key 都会直接变成一个环境变量。加 key = 加 env，不用改 chart。
#    MULTICA_VCS_SECRET_KEY 就是这么进去的（chart 的 values 里没有它的位置）。
#
# 前置手工步骤（ESO 拉不到会一直 SecretSyncedError，backend 停在
# CreateContainerConfigError）。不用切 kubectl context，vault.meirong.dev 走隧道可直连，
# 但 VAULT_ADDR 不设会去连 127.0.0.1:8200：
#
#   export VAULT_ADDR=https://vault.meirong.dev
#   pw="$(openssl rand -hex 16)"
#   vault kv put secret/homelab/multica \
#     jwt_secret="$(openssl rand -hex 32)" \
#     postgres_password="$pw" \
#     database_url="postgres://multica:$pw@apps-pg.databases.svc:5432/multica?sslmode=disable" \
#     vcs_secret_key="$(openssl rand -base64 32)" \
#     resend_api_key=""
#
# ⚠️ postgres_password 与 database_url 里的口令是**同一个值的两份写法**（2026-08-25
#    合并到共享实例后如此）。上面故意先算进 $pw 再两处引用 —— 分别 openssl 两次
#    必然对不上，而症状是 backend 连库 28P01 而 ESO 一切正常。
#    ⚠️ 共享实例是**已初始化**的：改这里的口令不会改 PG 里的角色口令，
#       必须同时 `kubectl -n databases exec deploy/apps-pg -- psql -U postgres
#       -c "ALTER ROLE multica PASSWORD '<新值>'"`。
#
# ☠️ vcs_secret_key 必须是 **base64 编码的 32 字节**（`-base64 32`，44 字符），
#    不是 `-hex 32`。这个错误极其隐蔽：hex 串恰好只含合法 base64 字符，
#    所以能解码成功、只是得到 48 字节，长度校验失败 ——
#    而后端把**所有** LoadKey 错误都打成同一句
#    `vcs integration disabled (MULTICA_VCS_SECRET_KEY not set)`。
#    于是你明明设了值，日志却说 "not set"，看着像 ESO 没注入。
#    （2026-08-18 实测踩过。判据看 `server/internal/util/secretbox/secretbox.go`
#     的 LoadKey：base64 解码 + len == KeySize(32)。jwt_secret 不走这条路径，
#     hex 无所谓。）
#
# ⚠️ data 里列出的 property 一个都不能缺 —— ESO 的 data 项没有「可选」语义，少一个整个
#    Secret 就不生成。resend_api_key 允许是**空串**（见下），但 key 必须存在。
#
# ⚠️ jwt_secret 换掉 = 所有已登录会话立即失效（不影响数据）。
#    postgres_password 换掉 = 已初始化的 PG 数据目录里用户口令不会自动跟着变，
#    改它必须同时进 PG 里 ALTER USER，否则 backend 连不上库。
#
# resend_api_key 留空是**安全的降级**而不是故障（源码 email.go：apiKey=="" 时
# 不构造 resend client → 验证码改为打到 backend 的 stdout）。但注意代价：
# 本集群所有 pod 日志都进 Loki，等于把登录验证码索引进了日志库。
# 所以公网暴露下应尽快把真 key 填上。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multica-secrets
  namespace: personal-services
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: multica-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: secret/homelab/multica, property: jwt_secret }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: secret/homelab/multica, property: postgres_password }
    # 2026-08-25 合并到共享实例 databases/apps-pg 后，连接串**整条**由 Vault 给。
    # ☠️ 与 chart 自建 postgres 时的机制不同，别以为这是可选的冗余：
    #    values 里 postgres.external.enabled=true 时，chart 的 backend.yaml 不再注入
    #    `env: DATABASE_URL`（模板里那段有 `if not external.enabled` 守卫），
    #    POSTGRES_* 三个 env 也随 configmap 里的同名守卫一起消失 ——
    #    也就是说这一行是 backend 唯一的连库信息来源，缺了它 backend 直接起不来。
    #    反过来也成立：**它不会被 chart 的 env 遮蔽**（env 优先于 envFrom），
    #    所以不用担心撞上「同名 env 重复键」那类 SSA 硬失败。
    # ⚠️ 必须带 ?sslmode=disable —— 集群内 postgres 没开 TLS，而 Go 的 lib/pq
    #    默认 sslmode=require，漏了会连不上（chart 自己拼的串里也有这个参数）。
    - secretKey: DATABASE_URL
      remoteRef: { key: secret/homelab/multica, property: database_url }
    # 自建 VCS 集成（Forgejo/Gitea/GitLab）的加密密钥。values 里
    # vcsIntegrationEnabled: true 打开的是 UI 入口，没有这个 key 连接会失败。
    - secretKey: MULTICA_VCS_SECRET_KEY
      remoteRef: { key: secret/homelab/multica, property: vcs_secret_key }
    - secretKey: RESEND_API_KEY
      remoteRef: { key: secret/homelab/multica, property: resend_api_key }

    # ── 邮件发送：Gmail SMTP（2026-08-18 起生效）────────────────────────────
    # chart 的 values **没有** SMTP_* 字段 —— 能这么注入全靠 backend 用的是
    # `envFrom: secretRef`，Secret 里每个 key 都直接变成一个环境变量。不用改 chart。
    #
    # 后端投递优先级是 SMTP → Resend → stdout（server/internal/service/email.go
    # 的 SendVerificationCode）。所以 smtp_host 一旦有值，验证码就不再打进 pod
    # 日志（也就不再被 Loki 索引）—— 这才是配它的真正动机，不是为了「能发邮件」。
    # resend_api_key 保持空串无妨：SMTP 分支在它之前就 return 了。
    #
    # 为什么是 Gmail 而不是 Cloudflare（2026-08-18 实测定的）：Cloudflare 的
    # Email Sending 在 **Workers Free 档定价表里写的是 "Not available"**；虽然文档
    # 另有「发给已验证收件地址所有套餐免费」的例外，但那条只在 REST API / Workers
    # binding 的上下文里出现，SMTP relay 走不走这条没有确证 —— 实测确实被挡在
    # `550 5.7.1 Email sending is not enabled for domain meirong.dev`。
    # Resend 免费档可行但要新账号 + DNS 记录，为几封验证码不值当。
    #
    # ⚠️ 两个只能这么填的约束：
    #   · SMTP_FROM_EMAIL **必须等于**认证的那个 Gmail 地址 —— Gmail 不允许用
    #     任意 From（所以这里不可能写 noreply@meirong.dev），邮件是自己发给自己。
    #   · SMTP_EHLO_NAME 必须显式给：net/smtp 默认 EHLO "localhost" 被严格 relay 拒，
    #     而代码的兜底是 os.Hostname()，在 pod 里那是 pod 名、不是 FQDN。
    #
    # ⚠️ 安全代价（明确接受的取舍）：Gmail 应用专用密码**不是只能发信的**，同一串
    #    密码也能走 IMAP/POP 读该邮箱的全部邮件。它不碰 Drive/Photos 且可单独吊销，
    #    但泄露即等于邮箱可读。更干净的做法是换成一个专用发信 Gmail（泄了是空邮箱）
    #    或换 Resend（API key 只能发信）。吊销入口 myaccount.google.com/apppasswords。
    #
    # ⚠️ 改这一组时顺序不能颠：**先 vault kv patch，再改本文件**。ESO 的 data 项
    #    引用了 Vault 里不存在的 property 时，**整个 Secret 都不生成** ——
    #    会连 JWT_SECRET 一起没掉，backend 直接起不来。
    - secretKey: SMTP_HOST
      remoteRef: { key: secret/homelab/multica, property: smtp_host }
    - secretKey: SMTP_PORT
      remoteRef: { key: secret/homelab/multica, property: smtp_port }
    - secretKey: SMTP_USERNAME
      remoteRef: { key: secret/homelab/multica, property: smtp_username }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: secret/homelab/multica, property: smtp_password }
    - secretKey: SMTP_FROM_EMAIL
      remoteRef: { key: secret/homelab/multica, property: smtp_from_email }
    - secretKey: SMTP_EHLO_NAME
      remoteRef: { key: secret/homelab/multica, property: smtp_ehlo_name }
