---
# Multica 的密钥 —— chart 的 existingSecret 指向它（k8s/helm/values/multica.yaml）。
#
# ⚠️ chart 用 `envFrom: secretRef` **整个** 注入 backend 容器，所以这个 Secret 里的
#    每一个 key 都会直接变成一个环境变量。加 key = 加 env，不用改 chart。
#    MULTICA_VCS_SECRET_KEY 就是这么进去的（chart 的 values 里没有它的位置）。
#
# 前置手工步骤（ESO 拉不到会一直 SecretSyncedError，backend 停在
# CreateContainerConfigError）。不用切 kubectl context，vault.meirong.dev 走隧道可直连，
# 但 VAULT_ADDR 不设会去连 127.0.0.1:8200：
#
#   export VAULT_ADDR=https://vault.meirong.dev
#   vault kv put secret/homelab/multica \
#     jwt_secret="$(openssl rand -hex 32)" \
#     postgres_password="$(openssl rand -hex 16)" \
#     vcs_secret_key="$(openssl rand -hex 32)" \
#     resend_api_key=""
#
# ⚠️ 四个 property 一个都不能缺 —— ESO 的 data 项没有「可选」语义，少一个整个
#    Secret 就不生成。resend_api_key 允许是**空串**（见下），但 key 必须存在。
#
# ⚠️ jwt_secret 换掉 = 所有已登录会话立即失效（不影响数据）。
#    postgres_password 换掉 = 已初始化的 PG 数据目录里用户口令不会自动跟着变，
#    改它必须同时进 PG 里 ALTER USER，否则 backend 连不上库。
#
# resend_api_key 留空是**安全的降级**而不是故障（源码 email.go：apiKey=="" 时
# 不构造 resend client → 验证码改为打到 backend 的 stdout）。但注意代价：
# 本集群所有 pod 日志都进 Loki，等于把登录验证码索引进了日志库。
# 所以公网暴露下应尽快把真 key 填上。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multica-secrets
  namespace: personal-services
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: multica-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: secret/homelab/multica, property: jwt_secret }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: secret/homelab/multica, property: postgres_password }
    # 自建 VCS 集成（Forgejo/Gitea/GitLab）的加密密钥。values 里
    # vcsIntegrationEnabled: true 打开的是 UI 入口，没有这个 key 连接会失败。
    - secretKey: MULTICA_VCS_SECRET_KEY
      remoteRef: { key: secret/homelab/multica, property: vcs_secret_key }
    - secretKey: RESEND_API_KEY
      remoteRef: { key: secret/homelab/multica, property: resend_api_key }
