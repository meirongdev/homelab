# blog-stats-rollup — 把博客按文章的日访问量从 Cloudflare 的 8 天窗口搬进 Postgres 长期表。
#
# 为什么需要它：`meirong.dev` 是 Cloudflare Pages 托管的博客（不在集群里，② cloudflared
# 和 ③ cilium-envoy 都看不到它），唯一看得见的是 ① Cloudflare 边缘。而边缘那份按 path
# 的数据**只留 8 天**（免费版 `httpRequestsAdaptiveGroups` 保留期 1w1d），Prometheus 也
# 只留 14 天 —— 「某篇文章累计被读了多少」按年算，两个都存不住。所以每天把
# cf-analytics-exporter 的 /pages.csv UPSERT 进一张永久表。
#   口径与免费版能力边界 → docs/reference/public-traffic-analysis.md
#   为什么落 Postgres 而不是抬 retention / 上 Umami → docs/decisions/blog-pageview-rollup-store.md
#
# ✅ **幂等**（上游 CronJob 页唯一用 "should" 写的要求）：exporter 每次都吐整个 8 天窗口，
#    主键 (day, path) + ON CONFLICT DO UPDATE 覆盖 → **≤8 天的中断下一轮自己补齐**，
#    不需要补数脚本。超过 8 天才是永久空洞，那由 BlogStatsRollupStale 告警兜。
# ☠️ **零行必须当失败**：exporter 首刷未完成时 /pages.csv 只有表头，静默写 0 行会被读成
#    「昨天没人访问」。所以脚本里那句 RAISE EXCEPTION 是**判据不是保险**，别删。
#
# ✅ 三步激活已于 2026-09-08 完成（Vault 口令 → apps-pg 建租户 → 首轮验证），
#    表里已有 3345 行 / 2026-08-31..09-06。重建集群时的重放步骤见 ADR 的「激活」一节。
#    ☠️ 首轮验证失败过一次，原因不在这三步里，而在下面 SQL 的载入方式：内联进 `args`
#    时 kubelet 的 `$(VAR)` 展开会把 `$$` 转义成单个 `$`（`DO $$` → `DO $`），psql 报
#    `syntax error at or near "$"`。git 与 CronJob 对象里存的都是对的，只有运行时那一刻
#    是坏的 —— 所以 SQL 现在挂在 ConfigMap 里，别内联回来（详见 blog-stats-rollup-sql）。
---
# blogstats 库的两个口令。刻意**不并进** apps-pg-bootstrap / grafana-admin-credentials
# 那两个已有 ExternalSecret：ESO 里一个 remoteRef 取不到就整个 ExternalSecret 同步失败，
# 并进去等于让「Vault 里还没写这个新路径」把正在用的 Postgres 口令或 Grafana 的 OIDC
# 密钥一起拖成 stale（Secret 本身有 deletionPolicy: Retain 不会消失，但从此不再更新，
# 而且不报错）。单独一个对象 = 失败面只有它自己。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blogstats-db
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: blogstats-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # owner：本 CronJob 写库用。
    - secretKey: owner-password
      remoteRef: { key: homelab/blogstats, property: owner_password }
    # 只读：Grafana 的 Postgres 数据源用（面板里的 SQL 只能 SELECT）。
    # 注入方式见 k8s/helm/values/kube-prometheus-stack.yaml 的 BLOGSTATS_PG_PASSWORD。
    - secretKey: readonly-password
      remoteRef: { key: homelab/blogstats, property: readonly_password }
---
# rollup 的 SQL。☠️ **必须留在 ConfigMap 里，不能内联回 `args`** —— 这不是风格问题：
# kubelet 对 command/args 做 `$(VAR)` 展开，而 `$$` 是「字面 $」的转义，所以内联时
# `DO $$ ... END $$;` 到了容器里会变成 `DO $ ... END $;`，psql 报
# `syntax error at or near "$"` —— 2026-09-08 首次激活时就这么失败的一轮。
# git 里和 CronJob 对象里存的都是正确的 `$$`，只有运行时那一刻是坏的，所以
# `kubectl get -o yaml` 比对不出来，只有真跑一轮才看得见。
# ConfigMap 的内容不经过那层展开，SQL 逐字送到 psql。
#
# ⚠️ 不进 check-embedded-scripts.py（E1）的 TARGETS：那条规则管的是「ConfigMap 副本
#    与外部源文件漂移」，这里 ConfigMap 就是唯一副本；(b) 的 checksum 注解也不需要 ——
#    CronJob 每轮都是新 pod，读的必然是当前 ConfigMap（长驻进程才有那个坑）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: blog-stats-rollup-sql
  namespace: monitoring
  labels: { app: blog-stats-rollup }
data:
  rollup.sql: |
    BEGIN;

    CREATE TABLE IF NOT EXISTS blog_pageviews (
      day              date        NOT NULL,
      path             text        NOT NULL,
      requests         integer     NOT NULL,
      browser_requests integer     NOT NULL,
      updated_at       timestamptz NOT NULL DEFAULT now(),
      PRIMARY KEY (day, path)
    );

    CREATE TEMP TABLE stage (
      day date, path text, requests integer, browser_requests integer
    ) ON COMMIT DROP;

    \copy stage (day, path, requests, browser_requests) FROM '/tmp/pages.csv' WITH (FORMAT csv, HEADER true)

    DO $$
    DECLARE n bigint;
    BEGIN
      SELECT count(*) INTO n FROM stage;
      IF n = 0 THEN
        RAISE EXCEPTION 'stage 零行 —— exporter 首刷未完成或 /pages.csv 变空，本轮不写库';
      END IF;
      RAISE NOTICE '[rollup] staged % rows', n;
    END $$;

    INSERT INTO blog_pageviews (day, path, requests, browser_requests)
    SELECT day, path, requests, browser_requests FROM stage
    ON CONFLICT (day, path) DO UPDATE
      SET requests         = EXCLUDED.requests,
          browser_requests = EXCLUDED.browser_requests,
          updated_at       = now();

    COMMIT;

    \echo '[rollup] table now:'
    SELECT count(*) AS rows, min(day) AS since, max(day) AS latest FROM blog_pageviews;
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: blog-stats-rollup
  namespace: monitoring
  labels: { app: blog-stats-rollup }
spec:
  # 三步激活已于 2026-09-08 完成（Vault 口令 / 租户 / 首轮验证），故为 false。
  suspend: false
  # 10:30 CST = 02:30 UTC：CF 的「昨天(UTC)」在 08:00 CST 就已封盘；同时避开三个
  # restic 夜备（02:00 / 03:00 / 03:30）。
  # ⚠️ 「留 2.5h 等 exporter 取到昨天」这个原意**并不成立**，别照这个假设去调时间：
  # exporter 是「启动即刷 + sleep 6h」，刷新相位取决于 pod 的启动时刻，每次重启都会漂，
  # 没有哪个固定 cron 时刻能保证落在某次刷新之后。实例：pod 起于 2026-09-07 15:58Z →
  # 刷新落在 03:58/09:58/15:58/21:58Z，则 02:30Z 这一轮读到的是 21:58Z 那次的结果，
  # 其 offset=1 天是前天，于是表里最新的一天比「昨天」落后 1 天（09-08 01:50Z 实测
  # /pages.csv 最新为 09-06）。
  # ✅ 这不是缺数：exporter 每次吐整个 8 天窗口 + 主键 UPSERT，某天只要在窗口内被取到过
  # 就会补齐，落后一天之后自然填上。真正的永久空洞只有「连续 >8 天没成功」，那由
  # BlogStatsRollupStale 兜。所以此处刻意不追刷新相位，也不缩 REFRESH_SECONDS。
  schedule: "30 10 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  # Forbid + 自动触发 → 两个 deadline 都必须有（decisions/cronjob-and-job-hygiene.md）：
  # 没有 activeDeadlineSeconds，卡死的 Job 会让后续每次排期记成 missed，累到 100 次
  # CronJob 永久停摆且不自愈。
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  # 3 而不是默认 1：失败的那次日志就是排查材料（同 backup / krr）。
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 断卡死的开关，不是性能预算：实测一轮 = 一次 wget + 1600 行 COPY，秒级。
      # 600s 给到 ~60× 余量，仍远小于 24h 排期间隔。
      # ☠️ 必须挂在 jobTemplate.spec 下；写到 CronJob.spec 下是未知字段、静默丢弃。
      activeDeadlineSeconds: 600
      # 允许一次重试：唯一预期内的瞬时失败是撞上 exporter 正在刷新窗口。
      backoffLimit: 2
      template:
        metadata:
          labels: { app: blog-stats-rollup }
        spec:
          restartPolicy: Never
          priorityClassName: bulk
          # 无状态周期作业 → 106 worker（同 krr 的分担通道）。只连集群内两个 Service，
          # 无 PVC、无 hostPath、无节点语义。
          # ⚠️ 后果与 krr 不同的一点：这个作业漏跑**有**告警覆盖
          # （BlogStatsRollupStale），节点下线不会静默。
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-106
          securityContext:
            runAsNonRoot: true
            runAsUser: 70          # alpine 变体里的 postgres 用户是 70，不是 999
            runAsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: rollup
              # 只用到 psql + busybox wget，两者都在这个镜像里（实测 psql 17.11 /
              # /usr/bin/wget）。多架构 index digest（amd64 + arm64/v8 皆在）。
              # ⚠️ registry 前缀 `docker.io/` 必须显式写：Kyverno 的
              #    restrict-image-registries 是字面前缀匹配，省略它虽然能跑但会留一条
              #    静默的 Audit 违规。
              image: docker.io/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
              env:
                - name: PGHOST
                  value: apps-pg.databases.svc.cluster.local
                - name: PGUSER
                  value: blogstats
                - name: PGDATABASE
                  value: blogstats
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: blogstats-db, key: owner-password }
                # path 里有 URL 编码过的中文 tag，显式定 client encoding，别赌容器 locale
                - name: PGCLIENTENCODING
                  value: UTF8
                - name: SRC
                  value: http://cf-analytics-exporter.monitoring.svc.cluster.local:9901/pages.csv
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  # 先落盘再入库，是为了让日志分得清「取数失败」和「入库失败」
                  # （wget 非零退出直接结束本轮，psql 压根不会连库）。
                  echo "[rollup] fetch $SRC"
                  wget -q -T 30 -O /tmp/pages.csv "$SRC"
                  echo "[rollup] csv = $(wc -l < /tmp/pages.csv) lines"

                  # SQL 在 ConfigMap 里，不内联 —— 见上面 blog-stats-rollup-sql 的
                  # 文件头注释（内联会被 kubelet 的 $$ 转义吃掉一个 $）。
                  psql -v ON_ERROR_STOP=1 -f /sql/rollup.sql
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: sql, mountPath: /sql, readOnly: true }
              resources:
                # 2026-09-08 实测（真实载荷 3345 行，非空载）：cgroup v2 `memory.peak`
                # = 4255744B ≈ 4.1Mi，`memory.current` 收尾 0.83Mi。
                # ☠️ 判据是 `memory.events` 全 0（尤其 `max 0` / `oom_kill 0`）——证明这个
                #    peak **没有被 limit 截断**；测量时刻意把 limit 抬到 512Mi 就是为此，
                #    否则「peak == max」只说明撞顶、不是真峰值。
                # ⚠️ 别用 `kubectl top` 或 kubelet summary 的 rssBytes 复核这个作业：它只跑
                #    ~2s，远短于那两者 10–15s 的采样周期，压根采不到（会得到"0/无数据"
                #    这种看起来像已验证的假结果）。要重测就读 cgroup 的 memory.peak。
                # 峰值不随行数涨：`\copy` 是流式，TEMP 表在服务端，客户端只有 wget + psql
                # 的固定开销，所以 path 数翻倍也不用调这里。
                requests: { cpu: 10m, memory: 16Mi }   # ~4x 实测峰值
                limits: { memory: 64Mi }               # ~15x，留给镜像/客户端版本变动
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: tmp
              emptyDir: {}
            - name: sql
              configMap:
                name: blog-stats-rollup-sql
