---
# readlist alerting — the "site returns 200 but the data is a month old" class of failure.
#
# Why this file exists: readlist is a **nightly-pipeline** service. Its three CronJobs
# (snapshot 01:05 → ingest 01:20 → score 01:40) can all stop working while the web pod
# keeps serving HTTP 200 from the last published run, forever. Probes pass, Uptime Kuma is
# green, the homepage tile is green — and the rankings quietly rot. Uptime monitoring
# cannot see this by construction; only these metrics can.
#
# Same lesson as clustermesh-alerts.yaml (2026-08-05): losing a capability silently is bad,
# being unable to date the loss afterwards is worse.
#
# Metrics come from the readlist web pod's /metrics on oracle-k3s, scraped by that
# cluster's OTel Collector (`prometheus/readlist` receiver in
# cloud/oracle/manifests/monitoring/otel-collector-config.yaml) and remote-written to the
# homelab Prometheus with cluster="oracle-k3s" — same path as opencost/trivy/clustermesh.
# There is no Prometheus Operator on oracle-k3s, so no ServiceMonitor.
#
# ⚠️ **Only write rules against metrics the DEPLOYED image actually emits.** A rule on a
#   non-existent series never fires and looks identical to "all healthy". Verify with
#   `curl <pod>:8080/metrics | grep readlist_`, not by reading upstream source — the
#   working tree runs ahead of the released tag (that exact trap cost us two rules on
#   2026-08-05, when v0.1.0 turned out to emit only 5 of the families the source showed).
#
#   v0.2.0 (deployed 2026-08-06) emits 14 families, verified on the running pod:
#     works_total · lists_total · runs_retained · grade_counts{grade}
#     last_score_unix · last_snapshot_unix · last_ingest_unix        ← 三个作业各自的新鲜度
#     orphan_rows · pubdate_source{source} · dim_measured{dim}
#     ingest_requests · ingest_cache_hits · ingest_throttled · ingest_budget_exhausted
#
# ⚠️ The freshness metric reads the **run table**, not the CronJob's exit status. That is
# deliberate and stronger: a Job that "succeeded" but wrote nothing still shows as stale.
# Do not replace it with kube_job_* rules.
#
# All `warning`: a public but non-critical personal site — stale rankings are not an
# outage. The `release` label is REQUIRED for the kube-prometheus-stack ruleSelector.
#
# Deployed via the ArgoCD `monitoring-dashboards` Application (git push → 3-min sync).
# Runbook for every alert below: docs/runbooks/readlist-bootstrap.md
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: readlist-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: readlist
      rules:
        # (1) Rankings are stale. THE alert for this service — per the upstream spec
        # (FR-60) this is the only signal separating "fine" from "silently frozen".
        # 36h tolerates one missed night (transient 429/OOM retries next night) and fires
        # on two consecutive misses. A value of 0 = never scored, which also fires — right.
        #
        # ⚠️ This does NOT cover a stale *corpus* or stale *evidence* — score re-scores a
        # month-old snapshot every night and keeps this metric fresh. That is why
        # ReadlistSnapshotStale and ReadlistIngestStale below exist as separate rules.
        - alert: ReadlistScoreStale
          expr: time() - readlist_last_score_unix > 129600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "readlist: 榜单已 >36h 未重算（站点仍返回 200）"
            description: >-
              readlist_last_score_unix 距今 >36h（0 = 从未成功打分）。公开站会继续用
              最后一次发布的 run 正常服务，探针与 Uptime Kuma 全绿，但榜单不再更新。
              查 `kubectl --context oracle-k3s -n personal-services get cronjob
              readlist-score` 与最近一个 Job 的日志。引导/重建见
              docs/runbooks/readlist-bootstrap.md。

        # (1b) The CORPUS is stale even though scoring still succeeds nightly. Added with
        # v0.2.0, which finally emits last_snapshot_unix. This is the rule ReadlistScoreStale
        # provably cannot替代: `score` reads the local DB and will happily re-score a
        # month-old snapshot forever, keeping last_score_unix green the whole time.
        # What it catches: the snapshot Job losing the calibre volumes — books PVC detached,
        # metadata.db remounted read-only ("attempt to write a readonly database", because
        # WAL reads also write -shm), or calibre-web moving its data.
        - alert: ReadlistSnapshotStale
          expr: time() - readlist_last_snapshot_unix > 129600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "readlist: calibre 快照已 >36h 未成功（语料在变旧，打分可能照常绿）"
            description: >-
              readlist_last_snapshot_unix 距今 >36h（0 = 从未成功）。注意这**不会**被
              ReadlistScoreStale 覆盖 —— score 会继续给旧语料打分并保持那条指标常绿。
              典型原因是 snapshot Job 碰不到 calibre 的卷：calibre-books-local 挂载丢失，
              或 metadata.db 变成只读挂载（WAL 的读路径也要写 -shm）。看
              `kubectl --context oracle-k3s -n personal-services logs job/<readlist-snapshot-*>`。

        # (1c) External evidence has stopped refreshing. Added with v0.2.0 (last_ingest_unix).
        # 3d rather than 36h on purpose: ingest is quota-bounded and its evidence has a
        # ~180-day refresh cycle upstream, so one or two missed nights是无害的 —— but a key
        # that got revoked or an egress block should not stay invisible for a week.
        # Distinct from ReadlistNoExternalEvidence below: this fires when ingest stops
        # succeeding at all; that one fires when it succeeds but yields nothing.
        # `for: 3h` (not 1h) on purpose. Two reasons, both about avoiding a false page:
        #   - On a 3-DAY staleness threshold the debounce is free — delaying detection by
        #     a couple of hours costs nothing, while a tight `for` buys nothing.
        #   - `last_ingest_unix == 0` means "never succeeded", which legitimately fires.
        #     But right after the v0.1.0→v0.2.0 upgrade it reads 0 as an ARTIFACT: v0.1.0
        #     never wrote the ingest run row that v0.2.0's metric reads, so the value stays
        #     0 until the first ingest run **under v0.2.0** (verified 2026-08-06: the job
        #     had succeeded hours earlier, yet the metric was 0). 1h would have paged ~30min
        #     before the nightly 01:20 UTC run cleared it; 3h rides that out and still fires
        #     if the run genuinely fails to land.
        - alert: ReadlistIngestStale
          expr: time() - readlist_last_ingest_unix > 259200
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: "readlist: 外部证据摄入已 >3d 未成功"
            description: >-
              readlist_last_ingest_unix 距今 >3d（0 = 从未成功）。A 维(读者评分)与
              F 维(时效)会逐渐失去判别力，但站点一切照常返回 200。先看最近一个
              readlist-ingest Job 的日志与 readlist_ingest_throttled（429 计数），
              再核对 Secret readlist-secrets 里的 GOOGLE_BOOKS_KEY 是否还有效。

        # (2) Published an EMPTY library. Exactly the failure §4.1 of the upstream deploy
        # doc warns about: on an empty DB, init/serve self-heals by publishing a 0-book
        # run — nothing crashes, everything returns 200, the site is just blank. Also
        # covers "readlist-data was recreated and lost its contents".
        - alert: ReadlistPublishedEmptyLibrary
          expr: readlist_works_total == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "readlist: 已发布的 run 里有 0 本书 —— 站点是空的"
            description: >-
              readlist_works_total == 0。空库上 init/serve 会自愈发布一个 0 本书的 run，
              不崩、全部 200，但站点没有内容。最可能是 readlist-data 被重建或清空。
              按 docs/runbooks/readlist-bootstrap.md 重新引导，别等次日凌晨。

        # (3) Nothing external has EVER landed — the only ingest-health signal available
        # from v0.1.0's metric set. Grade D means "no external evidence"; if literally
        # every work is D for 3 days straight, ingest has contributed nothing at all
        # (no Google Books key, quota wall, egress blocked, or the Job never running).
        #
        # Deliberately `== works_total` (all of them) rather than a ratio: ~1,000–1,300
        # books in this library have neither ISBN nor google id and are **intentionally
        # skipped** upstream, so a high-but-not-total D share is normal and a ratio
        # threshold would be guesswork. Total D is unambiguous.
        # 3d because the first full ingest legitimately spans 2 nights (INGEST_BUDGET=800
        # per run vs 1,000–1,500 requests needed).
        # ⚠️ `ignoring(grade)` 是**必须的**，不是风格问题：`readlist_grade_counts` 带
        # `grade` 标签而 `readlist_works_total` 不带，默认的 vector matching 要求两边
        # 标签集完全一致 → 不加就永远匹配不上、**永远返回空、永远不触发**，
        # 而那看起来和"一切正常"一模一样。2026-08-05 实测确认：
        #   `D <= works_total`          → 0 results（假的"没问题"）
        #   `D <= ignoring(grade) works` → 1 result（真的比较）
        - alert: ReadlistNoExternalEvidence
          expr: readlist_grade_counts{grade="D"} >= ignoring(grade) readlist_works_total
          for: 3d
          labels:
            severity: warning
          annotations:
            summary: "readlist: 全部 works 仍是 D 级 —— ingest 三天没产出任何外部证据"
            description: >-
              每一本书的证据等级都是 D（无外部证据）已持续 3 天，说明 ingest 完全没有
              产出：GOOGLE_BOOKS_KEY 失效/未注入、配额撞墙、出网被拦，或 Job 根本没跑。
              后果是 A 维(读者评分)与 F 维(时效)全空，依赖它们的榜单静默为空。
              先看 `kubectl --context oracle-k3s -n personal-services logs
              job/<最近的 readlist-ingest-*>`，再核对 Secret readlist-secrets。
              注意：D 占比高本身是正常的（约 1,000–1,300 本无 ISBN 也无 google id，
              上游刻意跳过）——只有**全部**为 D 才异常。

        # (3b) calibre book id drift. orphan_rows = reading-status rows that no longer join
        # to any work. Added with v0.2.0 (orphan_rows). Silently distorts to-read-next /
        # read-and-loved — the two lists that make the site worth visiting — without any
        # error anywhere. Usual cause: a calibre metadata re-import rewrote book ids.
        # ⚠️ Threshold from the 2026-08-05/06 measured baseline: **3 orphans out of 63
        # reading rows**. >10 is a clear step change, but re-tune once there is a week of
        # data rather than treating 10 as derived from anything.
        - alert: ReadlistOrphanRowsHigh
          expr: readlist_orphan_rows > 10
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "readlist: {{ $value }} 行阅读状态 join 不上书目（book id 漂移）"
            description: >-
              readlist_orphan_rows = {{ $value }}，基线是 3（全库阅读状态约 63 行）。
              calibre 的 book id 发生漂移，阅读状态与书目对不上 → to-read-next /
              read-and-loved 会失真而不会报错。核对 CALIBRE_USER_ID 与最近一次
              calibre 元数据导入（`calibre-metadata` App 的 enrich Job）。

        # (4) The blind spot itself — no readlist metrics arriving at all. Without this,
        # rules 1-3 go silent exactly when things are most broken (pod gone, scrape
        # misconfigured, oracle→homelab remote-write down). 30m so it does not flap on a
        # Recreate rollout or an OTel Collector restart.
        - alert: ReadlistMetricsAbsent
          expr: absent(readlist_works_total{cluster="oracle-k3s"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "readlist: 指标完全没上来 —— 上面 3 条告警此刻是瞎的"
            description: >-
              readlist_works_total{cluster="oracle-k3s"} 缺失 >30m。可能是 web pod 挂了、
              OTel Collector 的 prometheus/readlist 抓取坏了，或 oracle→homelab 的
              remote-write 断了。先看 `kubectl --context oracle-k3s -n personal-services
              get pods -l app=readlist`，再看 monitoring ns 里 otel-collector 的日志。

# ── DELIBERATELY NOT ALERTED ─────────────────────────────────────────────────
# v0.2.0 also emits these. They were evaluated and left off on purpose — adding them would
# be alert sprawl, and diluted warnings are worse than none:
#
#   readlist_pubdate_source{source="mtime-fallback"}  (PRD §5 guardrail, should trend → 0)
#     A slow-moving DATA-QUALITY trend, not an operational failure, and ingest actively
#     drives it down — so any fixed threshold is either never hit or permanently hit.
#     Measured 2026-08-06: 37 fallback + 5 missing (the upstream data-baseline doc still
#     claims 477; it is stale — calibre-metadata enrich repaired most). Watch on a
#     dashboard; alert only if a calibre re-import makes it jump.
#
#   readlist_dim_measured{dim}   (per-dimension discriminating power)
#     Genuinely useful, but "a dimension is thin" is a product judgement with no obvious
#     threshold — D/P legitimately sit at 0 until LLM labelling ships. Would fire forever.
#
#   readlist_ingest_{requests,cache_hits,throttled,budget_exhausted}
#     budget_exhausted is EXPECTED nightly during the initial backfill, and throttled>0 is
#     already reachable from ReadlistIngestStale's runbook text. Alerting on them would
#     page for normal operation. Useful as dashboard panels / for diagnosis.
