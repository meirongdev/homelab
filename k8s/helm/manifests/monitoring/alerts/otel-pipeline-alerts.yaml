# oracle-k3s 遥测管道死亡告警 —— 关闭一个 fail-silent 缺口。
#
# oracle 的全部可观测性（日志/指标/追踪）都经由单个 otel-collector DaemonSet
# 跨 Tailscale 推到 homelab。它死掉时没有任何东西会主动报错：
# remote-write 的序列只是悄悄变陈旧（stale），eso-alerts/external-dns-alerts 等
# 依赖 cluster="oracle-k3s" 指标的规则全部静默失明。
#
# 检测方式：oracle collector 的 prometheus/node-exporter 接收器每 15s 合成一条
# up{job="node-exporter", cluster="oracle-k3s"} 并 remote-write 过来 ——
# 它 15 分钟内完全缺席 = 管道断流（collector 挂 / Tailscale 断 / oracle 整机下线，
# 后者同时会触发 Uptime Kuma 侧的探活，两个信号可交叉定位）。
#
# severity warning → Alertmanager 路由到 Telegram（见 alertmanager-config.yaml）。
# `release` 标签是 kube-prometheus-stack ruleSelector 采纳本规则的必要条件。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-pipeline-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: otel-pipeline
      rules:
        - alert: OracleTelemetryPipelineDown
          expr: absent_over_time(up{cluster="oracle-k3s", job="node-exporter"}[15m])
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "oracle-k3s 遥测断流 ≥15 分钟"
            description: >-
              homelab Prometheus 已 15 分钟没有收到 oracle-k3s 的 remote-write
              （up{job="node-exporter"} 缺席）。oracle 的日志/指标/追踪全部经由
              monitoring/otel-collector DaemonSet 推送——先查该 pod
              （kubectl --context oracle-k3s -n monitoring get pods），
              再查 Tailscale 链路；若 Uptime Kuma 同时报 oracle 服务 DOWN，
              则是整机/整链路问题而非 collector。
