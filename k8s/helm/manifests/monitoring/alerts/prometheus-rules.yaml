---
# Supplementary PrometheusRules for homelab-specific alerts.
# kube-prometheus-stack ships 150+ default alerts; these cover gaps:
#   - Cold-backup target 106 (restic 夜备 + vzdump 周备的目标机)
#   - Vault sealed state (blocks ESO → blocks secret sync → cascades)
#   - Backup CronJobs not running on schedule
# Label release=kube-prometheus-stack required for Prometheus Operator to pick up.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-infrastructure
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: storage-nodes
      rules:
        # 2026-07-11 起 106 降级为纯冷备份目标（restic 夜备 + vzdump 周备），
        # 无运行时依赖（NFS PVC 已全部迁 local-path）——宕机不影响在线服务，
        # 只影响备份窗口，故 warning + for 15m（原 NFSStorageNodeDown critical/2m）。
        - alert: BackupTargetNodeDown
          expr: up{job="node-exporter-metal-nodes", instance="192.168.50.106:9100"} == 0
          for: 15m
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "Backup target 192.168.50.106 is unreachable"
            description: |
              node-exporter on storage-node-1 (192.168.50.106) has been down for more than 15 minutes.
              该机仅作冷备份目标：homelab/oracle restic 夜备与 pve vzdump 周备会失败，在线服务不受影响。
              Check: `ping 192.168.50.106` from k8s-node, then SSH and ZFS pool on the storage host.

        - alert: ProxmoxHostDown
          expr: up{job="node-exporter-metal-nodes", instance="192.168.50.4:9100"} == 0
          for: 2m
          labels:
            severity: critical
            component: infrastructure
          annotations:
            summary: "Proxmox host 192.168.50.4 is unreachable"
            description: |
              The Proxmox host hosting the homelab K3s VM has been down for 2+ minutes.
              The entire homelab cluster may be inaccessible.
        # zpool/SMART health alerts live in storage-alerts.yaml (storage-health-alerts):
        # SmartHealthFailed / ZpoolNotOnline / media-error, NVMe-wear and scrub-overdue
        # rules against the metric names the exporters actually emit
        # (smartctl_device_smart_status, node_zfs_zpool_state). A 2026-07-19 attempt to
        # re-add them here used non-existent names (node_zfs_zpool_healthy,
        # smartctl_device_smart_healthy — both return empty) and was removed.

    - name: vault
      rules:
        - alert: VaultSealed
          expr: vault_core_unsealed == 0
          for: 1m
          labels:
            severity: critical
            component: vault
          annotations:
            summary: "Vault is sealed — ESO cannot sync secrets"
            description: |
              Vault has been sealed for 1+ minute. All ExternalSecrets will fail until unsealed.
              Run: `just vault-unseal` (from k8s/helm/) or `kubectl exec -n vault vault-0 -- vault operator unseal $key`

        - alert: VaultUnreachable
          expr: up{job=~".*vault.*"} == 0
          for: 5m
          labels:
            severity: warning
            component: vault
          annotations:
            summary: "Vault is unreachable from Prometheus"
            description: "Prometheus has been unable to scrape Vault for 5+ minutes."

        # ☠️ 2026-08-30 加：上面两条的**数据来源守卫**。
        # 在此之前，这两条 critical 自上线起从没有可能响过 —— `vault_*` 整个指标族不存在、
        # `up{job=~".*vault.*"}` 是空集，因为 values/vault.yaml 从没开过 telemetry，
        # 也没有 ServiceMonitor 指向 Vault。而 `== 0` 在**序列不存在**时永远不评估，
        # 外观与「Vault 一切正常」完全一致。本月同形状的第三次
        # （另两次：ContainerMemoryNearLimit 的分子、TrivyExposedSecretFound 的指标名）。
        # 现已补齐：values 的 telemetry 段 + manifests/monitoring/vault-servicemonitor.yaml。
        # 本条守的就是「那两样东西之一被回滚/改坏」这件事。
        # ⚠️ 判据用 `vault_core_unsealed` 而不是 `up`：ServiceMonitor 的 keep 正则把
        #    `vault_core_unsealed` 滤掉时 `up` 仍在，VaultSealed 照样静默失效。
        # ⚠️ Vault 是 manual-helm：改了 values 不 `just deploy-vault` + 删 pod（STS 是
        #    OnDelete）就不生效，本条会在 30 分钟后提醒你这件事。
        - alert: VaultMetricsAbsent
          expr: absent(vault_core_unsealed) == 1
          for: 30m
          labels:
            severity: warning
            component: observability
          annotations:
            summary: "vault_core_unsealed 已停止入库 —— VaultSealed 正在静默失效"
            description: |
              Vault 的 telemetry 没有进 Prometheus，`VaultSealed` 与 `VaultUnreachable`
              两条 critical 因此不可能触发（序列不存在时比较式永不评估），
              而这与「Vault 一切正常」外观完全一致。
              依次查：
                1. ServiceMonitor 还在吗 —— `kubectl -n monitoring get servicemonitor vault`
                   （必须带 label release=kube-prometheus-stack，否则被 Operator 静默忽略）；
                   它的 keep 正则是否还含 `vault_core_unsealed`。
                2. Vault 的 telemetry 还开着吗 —— `kubectl -n vault get cm vault-config -o yaml`
                   里应有 telemetry{prometheus_retention_time} 与 listener 内的
                   telemetry{unauthenticated_metrics_access}。values 改了要
                   `cd k8s/helm && just deploy-vault` + `kubectl -n vault delete pod vault-0`。
                3. ServiceMonitor 是否指向了 Service `vault` —— **不能是 `vault-active`**，
                   那个在封印时会被摘掉 vault-active 标签、端点清空（见该文件头注释）。
              兜底：ESO 的 ClusterSecretStoreNotReady 仍能在 Vault 封印时报警（10 分钟）。

    - name: backups
      rules:
        - alert: BackupNotRunning
          expr: |
            (time() - kube_cronjob_status_last_schedule_time{cronjob=~".*backup.*"}) > 32 * 3600
          for: 1h
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "Backup CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not run in 32h"
            description: |
              Expected daily restic backups (homelab 03:00 / oracle 03:30, Asia/Shanghai). If this fires,
              the scheduler missed runs or the CronJob is suspended. Check: `kubectl get cronjob -A` and
              recent Job status.

        - alert: BackupJobFailed
          expr: kube_job_failed{job_name=~".*backup.*"} > 0
          for: 5m
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "Backup Job {{ $labels.job_name }} failed"
            description: "Inspect pod logs: `kubectl logs -n {{ $labels.namespace }} job/{{ $labels.job_name }}`"

        # 2026-08-13 加：homelab 双节点后的备份边界护栏。restic 夜备钉在 control-plane
        # （backup/base/cronjob.yaml 的 nodeSelector），备份的是**所在节点**的
        # /var/lib/rancher/k3s/storage —— local-path PVC 落到其它节点上时，数据完全
        # 在备份路径之外，而备份任务本身照常全绿（假绿）。CI 的 H4 只保证"进白名单"，
        # 保证不了"落对节点"，这条告警负责把缺口变响。
        # 已知局限：kubelet_volume_stats 只在有 pod 挂载时存在——负载缩到 0 后告警会
        # 自行恢复，但数据还躺在该节点盘上；处置时别只看告警消没消。
        #
        # 2026-08-16 更新：k8s-worker-106 已有**自己的**夜备路径
        # （backup/overlays/homelab/worker-cronjob.yaml，02:00，--host homelab-worker），
        # 故从本告警排除 —— 它不再是"无备份节点"。排除是**按节点名写死**的，不是按角色：
        # 将来再加节点，它会照常被这条抓到（那正是要的），除非也给它建一条备份路径并在此登记。
        - alert: PVCOnUnbackedNode
          expr: |
            count by (cluster, node) (
              kubelet_volume_stats_capacity_bytes{cluster="homelab", node!="", node!="k8s-worker-106"}
            )
              unless on (node) kube_node_role{cluster="homelab", role="control-plane"}
          for: 30m
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "homelab 节点 {{ $labels.node }} 上出现 PVC，但该节点没有任何备份路径"
            description: |
              该节点上有 local-path PVC 正被 kubelet 统计，而 restic 备份 Job 只覆盖
              control-plane（base）与 k8s-worker-106（worker-cronjob.yaml）——
              这些 PVC **不在任何备份里**，且备份任务自身完全正常。
              处置：把负载迁回已被覆盖的节点（local-path 数据不跟随调度，按
              runbooks/stateful-service-cross-cluster-migration.md 的节点内变体走），
              或照 worker-cronjob.yaml 的样子给该节点建一条备份路径，再把它加进上面的排除。
              背景：docs/reference/storage.md。

        # ── 月度恢复演练（2026-08-13 上线）─────────────────────────────────────
        # 演练本体：backup/overlays/homelab/restore-drill-{cronjob,script}.yaml。
        # 它每月真恢复一遍并跑 8 条判据（仓库结构、两集群快照新鲜度、vault raft 快照、
        # jobs.db integrity、两个 pg dump 的收尾标记、raw 归档实解压）。
        # 判据的**敏感度已用损坏数据实测**：7 种真实坏法全部判出、零漏报（上线当天）。
        #
        # ⚠️ 这三条是一套，别只留其中一条：
        #   Failed  → 演练跑了但判据不过（备份存在却恢复不出来，最坏的那种）
        #   Stale   → 演练太久没成功过（调度坏了/被 suspend）
        #   NeverRan→ **序列根本不存在**时 Stale 永远不会 fire（absent series 不参与比较，
        #             本仓库栽过两次），故必须有 absent 兜底
        - alert: RestoreDrillFailed
          expr: kube_job_failed{namespace="backup", job_name=~"restic-restore-drill.*"} > 0
          for: 5m
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "恢复演练 {{ $labels.job_name }} 失败 —— 备份的可恢复性存疑"
            description: |
              月度恢复演练有判据未通过。这**不是**"备份没跑"，而是"备份跑了但恢复出来
              的数据过不了检查"——夜备的绿灯对此完全无感。
              先看是哪条判据：
              `kubectl --context k3s-homelab -n backup logs job/{{ $labels.job_name }} | grep DRILL-FAIL`
              每条判据对应的坏法与处置见 backup/overlays/homelab/restore-drill-script.yaml
              的头注与 docs/runbooks/backup-recovery.md。
              ⚠️ 若报的是 `restic ls 执行失败` 一类，那是演练自身受阻（多半仓库锁没释放，
              见脚本里 RETRY 处的说明），不等于数据坏了 —— 别照着删数据。

        - alert: RestoreDrillStale
          expr: |
            time() - max(kube_job_status_completion_time{namespace="backup", job_name=~"restic-restore-drill.*", cluster="homelab"})
              > 40 * 24 * 3600
          for: 1h
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "已 {{ $value | humanizeDuration }} 没有成功的恢复演练"
            description: |
              演练是月度任务（每月 1 日 04:00 CST），40 天阈值留了一次调度失败的余量。
              超期意味着"备份能恢复"这件事已经很久没被证明过。
              查：`kubectl --context k3s-homelab -n backup get cronjob restic-restore-drill`
              （是否被 suspend）与最近的 Job 列表。
              手动补跑：`kubectl --context k3s-homelab -n backup create job
              --from=cronjob/restic-restore-drill restic-restore-drill-manual-$(date +%m%d)`
              ⚠️ 名字必须以 restic-restore-drill 开头，否则本组告警的正则匹配不到它。

        - alert: RestoreDrillNeverRan
          expr: absent(kube_job_status_completion_time{namespace="backup", job_name=~"restic-restore-drill.*", cluster="homelab"})
          for: 24h
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "恢复演练从未成功过（或 Job 对象全被清掉了）"
            description: |
              找不到任何成功的演练 Job。两种原因：① 演练从未跑成功过；
              ② Job 对象被清掉了 —— ☠️ 特别注意**别给这个 CronJob 加
              ttlSecondsAfterFinished**：月度任务若 7 天后就删 Job，序列随之消失，
              RestoreDrillStale 会永远查不到数据而静默失效（本条就是它的兜底）。
              保留窗口靠 successfulJobsHistoryLimit: 3（≈3 个月）。

    - name: capacity
      # 2026-08-13：替代 chart 的 KubeCPU/KubeMemoryOvercommit（已在 values 的
      # defaultRules.disabled 关掉，理由见彼处：N-1 语义在 1大+1小 的不对称双节点上
      # 恒真）。这里改测真实饱和——requests 占**总** allocatable 的比例。
      # 写入时实测（与 kubectl describe node 的 kubelet 视图对过账）：CPU 20% / 内存 52%。
      # ⚠️ 分母必须限定 job="kube-state-metrics"：opencost 也吐同名
      # kube_node_status_allocatable，不过滤会让分母翻倍、比值减半（写本组时抓到的现行）。
      # ⚠️ 本组三条**都覆盖两个集群**（2026-08-24 起）。曾有一段时间 CPU/内存 那两条
      # 写死 cluster="homelab"，注释给的理由是"oracle 的序列不进中枢 Prometheus
      # （otel 白名单只放行 KRR 所需）"—— 复核发现**那个理由已经不成立**，两边都有
      # 序列，而逼近阈值的恰恰是没被覆盖的 oracle。教训：写死集群的选择器要定期复核，
      # 它会在采集面变化后静默失效 —— 规则照常评估、health=ok、不报错，只是永远看不到
      # 另半个舰队。同类的 external-dns 元故障告警也在同日修掉（原开放项 #7），但改法
      # 不同：absent() 只能断言一个具名标签集缺失，那条改成拿参照序列做
      # `count by (cluster) (...) unless count by (cluster) (...)`，自维护、不硬编码集群名。
      rules:
        # 2026-08-24：替代 chart 的 KubeQuotaAlmostFull + KubeQuotaFullyUsed
        # （已在 values 的 defaultRules.disabled 关掉，理由见彼处：那两条是 info，
        # 而 Alertmanager 只放行 critical|warning，于是配额满了几乎无覆盖）。
        # 表达式照抄 chart 的形状 —— `topk by(cluster,...)` + `max without(instance,job,type)`
        # 是它对付「多集群 + 多 KSM 副本」的去重手法。
        # ☠️ 别改成 `on(namespace,resourcequota,resource)`：两个集群都上报
        # kube_resourcequota 且 personal-services 两边都有，join 会直接报
        # `found duplicate series for the match group`（2026-08-24 实测踩到）。
        # ⚠️ 与本组其它规则不同，这条**不限定 cluster="homelab"**：oracle 的
        # kube_resourcequota 确实进了中枢 Prometheus（实测 7 个 series 覆盖两集群），
        # 不像 CPU/内存那些被 otel 白名单挡在外面。
        # 阈值 >= 0.9 不设上界：chart 分成 >0.9<1 与 ==1 两条，恰好满的那一刻
        # 前者停响、后者是 info，会出现"最糟时反而没告警"的空洞。
        # 写入时实测：命中 0（最高是 jobs-sg 的 count/pods 62.5%），7 天历史峰值 75%。
        - alert: ResourceQuotaNearlyExhausted
          expr: |
            topk by (cluster, namespace, resource, resourcequota) (1,
              max without (instance, job, type) (kube_resourcequota{job="kube-state-metrics", type="used"}))
              / on (cluster, namespace, resource, resourcequota) group_left ()
            topk by (cluster, namespace, resource, resourcequota) (1,
              max without (instance, job, type) (kube_resourcequota{job="kube-state-metrics", type="hard"}) > 0)
              >= 0.9
          for: 30m
          labels:
            severity: warning
            component: capacity
          annotations:
            summary: "{{ $labels.cluster }}/{{ $labels.namespace }} 配额 {{ $labels.resource }} 已用 {{ $value | humanizePercentage }}"
            description: |
              ResourceQuota {{ $labels.resourcequota }} 的 {{ $labels.resource }} 逼近上限。
              满了之后准入层会**静默**拒绝建 pod：Job 对象建得出来、active=0、永远没有
              pod、只刷 FailedCreate，且不会被标记成 failed —— KubeJobFailed 与
              KubeJobNotCompleted 都不会响。所以这条是那种情形唯一的前置信号。
              先看 `kubectl -n {{ $labels.namespace }} describe quota`；若是终态 pod
              占额，注意 `count/pods` 不排除终态、`pods` 才排除。

        # 2026-08-24（开放项 #14）：由 Homelab* 改名为 Cluster*、按 cluster 分组，
        # 从此覆盖两个集群。改名不是洁癖 —— 旧名与旧 annotation 里"迁负载去 oracle"
        # 的建议都是 homelab 专属，对 oracle 自己讲不通。
        # ⚠️ 分母仍必须限定 job="kube-state-metrics"（opencost 吐同名
        # kube_node_status_allocatable，实测两集群各 2+2 series，不过滤则分母翻倍）。
        # 阈值/for 未改，实测依据（6d 回放，5min 步长 1729 点）：
        #   homelab  CPU 25.2–28.3%   内存 57.9–64.8%
        #   oracle   CPU 60.1–71.2%   内存 73.6–**85.2%**   ← 逼近阈值的是它
        #   >90% 采样点 0（零误报）；oracle 内存 >85% **只持续 5 分钟**（单点，
        #   rollout 期间新旧 pod requests 并存的尖峰，for:30m 正好滤掉），
        #   而 >75% 有过 115 分钟连续 —— 即 90% 既够不着又不会哑火。
        - alert: ClusterCpuRequestsSaturated
          expr: |
            sum by (cluster) (namespace_cpu:kube_pod_container_resource_requests:sum)
              / sum by (cluster) (kube_node_status_allocatable{resource="cpu", job="kube-state-metrics"})
              > 0.9
          for: 30m
          labels:
            severity: warning
            component: capacity
          annotations:
            summary: "{{ $labels.cluster }} CPU requests 已达总 allocatable 的 {{ $value | humanizePercentage }}"
            description: |
              {{ $labels.cluster }} 的 CPU requests 占总 allocatable 超过 90%——新负载
              将开始排不进去（实际可用还要再扣节点碎片：单 pod 的 requests 必须整块
              塞进某一个节点）。
              先核对 requests 是否虚高（对照实占，见 k8s-qos-resource-management.md），
              再决定砍 requests 还是挪负载。⚠️ **两个集群的出路不对称**：homelab 满了
              可按 cluster-placement 决策把轻量无状态挪去 oracle；而 **oracle 满了没有
              这个出路** —— 它已单向缩容到 2 OCPU/12GB（A1 长期无容量，涨不回去），
              只能砍 requests 或退役服务。
        - alert: ClusterMemoryRequestsSaturated
          expr: |
            sum by (cluster) (namespace_memory:kube_pod_container_resource_requests:sum)
              / sum by (cluster) (kube_node_status_allocatable{resource="memory", job="kube-state-metrics"})
              > 0.9
          for: 30m
          labels:
            severity: warning
            component: capacity
          annotations:
            summary: "{{ $labels.cluster }} 内存 requests 已达总 allocatable 的 {{ $value | humanizePercentage }}"
            description: |
              {{ $labels.cluster }} 的内存 requests 占总 allocatable 超过 90%。
              ⚠️ 判断真实内存压力永远看节点 `free -m` 的 available / rssBytes
              （requests 只反映申报）——这条只说明"排程账面"快满了：新 pod 会 Pending，
              与实占多少无关。见 docs/reference/k8s-qos-resource-management.md。
              ⚠️ oracle 满了没有"挪去另一个集群"的出路（已单向缩容），只能砍或退役。

    - name: workloads
      rules:
        - alert: PodStuckInUnknown
          expr: kube_pod_status_phase{phase="Unknown"} == 1
          for: 10m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in Unknown state for 10m"
            description: |
              Kubelet lost contact with the pod. Usually resolves on its own; if persistent, delete the pod
              so the controller recreates it.

        - alert: PVCPendingTooLong
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} stuck Pending"
            description: "Storage class may be misconfigured or backing storage is unreachable."

        # 2026-08-02 加：容器撞到**自身 memory limit** 被内核杀掉（exitCode 137）
        # 此前是完全的盲区——chart 自带的 KubePodCrashLooping 抓不到，因为 OOM 后
        # 容器干净重启、从不进 CrashLoopBackOff。argocd-application-controller 就这么
        # 静默 OOM 了（2026-08-02 10:01:47Z），是人工翻 lastState 才发现的。
        # 用 increase() 而非 ==1：last_terminated_reason 会一直停在 OOMKilled，
        # 直接等值判断会让告警永久挂着；这里只在**新发生**时触发。
        - alert: ContainerOOMKilled
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 0
              and on (cluster, namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} [{{ $labels.container }}] 被 OOMKilled（{{ $labels.cluster }}）"
            description: |
              容器撞到自身 memory limit 被杀（exitCode 137），已重启。不影响邻居 pod，
              但会中断该容器的服务，且**不会**触发 KubePodCrashLooping。
              先看 7d 曲线形状再动手：稳定爬升=泄漏（查代码），基线震荡+偶发尖峰=头寸不够（抬 limit）。
              Check: `kubectl --context k3s-homelab -n {{ $labels.namespace }} describe pod {{ $labels.pod }}`
              逼近 limit 的容器排名与判读见 docs/reference/k8s-qos-resource-management.md「检测 OOMKill」。

        # 上面那条的**交叉验证**。2026-08-18 重写：原本走 `container_oom_events_total`
        # （cAdvisor 口径），**实测该指标在本集群恒为 0，这条规则根本不可能烧**：
        #   count(container_oom_events_total)            → 156 条 series
        #   sum(container_oom_events_total)              → 0
        #   sum(increase(container_oom_events_total[30d])) → 0
        # 而同一天 multica-frontend 真实 OOMKilled 6 次（cgroup v2 的
        # memory.events `oom_kill 6` / `oom_group_kill 3`、kubectl 里 Reason=OOMKilled
        # exit 137 都对得上）。kubelet 内嵌 cAdvisor 在 cgroup v2 + 新内核
        # （本机 7.0.0-28-generic）下不填这个计数器。按本仓库自己的原则
        # 「永不触发的规则比没有告警更糟」，换成实测可用的口径。
        #
        # ✅ 换成 node-exporter 的 `node_vmstat_oom_kill`（读 /proc/vmstat，与内核同源）：
        #    2026-08-18 实测 k8s-node 上 24h **+6**，与 cgroup 的 oom_kill 6 完全吻合。
        # ⚠️ 代价：**node 级粒度**，没有 namespace/pod/container 标签，指不出是谁被杀。
        #    这对交叉验证够用 —— 它要回答的只是「内核杀了人，而 ContainerOOMKilled
        #    却没响」，也就是归因链路本身坏了。
        # ⚠️ 必须限定 `job="node-exporter"`：那是集群内 ServiceMonitor 抓的**两个真 k8s
        #    节点**（k8s-node / k8s-worker-106，无 nodename 标签）。cluster=homelab 里
        #    还有 pve 与 storage-106 两台**裸机宿主**（job=node-exporter-metal-nodes、
        #    带 nodename），它们上面的 OOM 与容器归因无关，pve 的 available 只剩 ~0.6G，
        #    不排除会真的 OOM —— 混进来就是恒亮误报。
        # ⚠️ `unless` 用 6h 长窗口而非 15m：ContainerOOMKilled 只烧几分钟
        #    （实测 2026-08-18 22:31→22:39），而 node 计数器的 increase 窗口会拖更久，
        #    短窗口两边错位就会在尾部假阳性。长窗口把这个竞态抹平，代价是同一集群 6h 内
        #    若有两次 OOM、其中一次被正确归因，另一次会被一并抑制 —— 可接受：
        #    本条查的是「归因机制是否还活着」，不是逐事件报警。
        # 复核指标是否还有效（换内核/升 kubelet 后值得重跑）：
        #   sum(increase(node_vmstat_oom_kill{job="node-exporter"}[24h]))
        - alert: OOMKillNotAttributedToContainer
          expr: |
            increase(node_vmstat_oom_kill{job="node-exporter"}[6h]) > 0
              unless on (cluster)
            max by (cluster) (
              max_over_time(ALERTS{alertname="ContainerOOMKilled", alertstate="firing"}[6h])
            )
          for: 10m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "{{ $labels.cluster }} 有节点发生 OOM kill，但没有任何 ContainerOOMKilled 与之对应"
            description: |
              内核在 6h 内杀过进程（node_vmstat_oom_kill 增长），而容器级归因规则
              ContainerOOMKilled 一次都没烧 —— **归因链路可能已失守**，别当成"没事发生"。
              1) 先确认确实有容器被杀：
                 `kubectl --context k3s-homelab get pods -A -o json | jq -r '.items[]|select(.status.containerStatuses[]?.lastState.terminated.reason=="OOMKilled")|.metadata.namespace+"/"+.metadata.name'`
              2) 若有，说明 kube-state-metrics 的 reason 标签值变了，查实际值：
                 `count by (cluster,reason) (kube_pod_container_status_last_terminated_reason == 1)`
              3) 若没有，可能是节点上的**非容器进程**被杀（宿主侧内存压力），查 dmesg。
              ⚠️ 注：`reason="OOMKilled"` 这个标签值 2026-08-18 已被实测证实可用
              （当天 ContainerOOMKilled 正常烧了），此前一直是未经验证的假设。

        # 2026-08-10 加：**事前**预警。上面两条都是事后的——容器已经被杀了才响。
        # 本条是这一层唯一能提前动手的信号，判据取自
        # docs/reference/k8s-qos-resource-management.md 的「>80% 就该抬 limit 或查泄漏」，
        # 阈值放到 85% 以降噪。
        # ⚠️ 两侧都必须先 max by(...) 聚合掉 id/image/job 等多余标签，否则直接除会报
        #    "many-to-one matching must be explicit"；分组键必须带 cluster，
        #    否则两集群同名 ns/pod 会串味。
        # ⚠️ 用 max_over_time 而非瞬时值：尖峰型负载看瞬时会整个漏掉——
        #    argocd-application-controller 2026-08-02 被杀时瞬时读数只有 0.67G，
        #    2d 窗口才照出 94%。
        # ⚠️ 2026-08-11 修**除数带 pod 造成的 CronJob 假阳性**：原式两侧都按
        #    (cluster,namespace,pod,container) join。CronJob 每晚换新 pod，改 limit 只
        #    影响新 pod，**旧 pod 的 spec 不可变**，于是老 limit 继续参与计算，直到
        #    successfulJobsHistoryLimit 把它挤掉。实例：backup 的 768Mi 已于 08-10 生效
        #    （新 pod 峰值 148Mi=19%），告警却仍按 08-09 那个 512Mi 的残留 pod 报
        #    90.03%，且会持续 2~3 晚。**每次给 CronJob 抬 limit 都会复现**，不是偶然。
        #    改法：分子保持 pod 粒度（排障要知道是哪个 pod 峰值最高），分母降到
        #    (cluster,namespace,container) 取 max = 该工作负载**当前**的 limit，
        #    用 group_left 做多对一。于是「历史峰值 vs 现行 limit」，语义才是对的。
        #    ⚠️ 反向代价：limit **调小**时会对着旧的大 limit 比，短暂漏报（Deployment
        #       滚完即恢复，CronJob 最多 3 晚）。抬 limit 远比压 limit 常见，认这个取舍。
        #    ⚠️ 别改回按 pod join 来「修」漏报——那样 CronJob 假阳性立刻回来。
        #    验证过：改前命中 repo-server 93.29% + backup 90.03%（后者是假的）；
        #    改后只剩 repo-server 93.29%，356 条 series 无 many-to-many 报错。
        # ☠️ 2026-08-30 换分子口径：`working_set` → **`rss`**，窗口 7d → 2d，阈值 85% → 80%。
        #    起因：08-29 宿主内核升级重启后本条对 monitoring/prometheus 报 **99.45%**，
        #    而那个容器的终止状态是 `exitCode 0 / Completed` —— 顶死 limit 也没被杀。
        #    峰值 3055Mi 里 **2652Mi 是页缓存**，同窗口 rss 峰值只有 810Mi = 26.4%。
        #    `working_set = memory.current − inactive_file`，**含 page cache**；干净的
        #    file page 永远先于 OOM 被回收，所以它逼近 limit 并不蕴含 OOM 风险。
        #    更糟的是这个读数由**节点页缓存冷热**决定：同容器 / 同数据 / 同 limit 重启三次，
        #    峰值 3072Mi(99.45%) → 2153Mi(70.1%) → 728Mi(23.70%)，跨度 5 倍。
        #    → records/2026-08-30-memory-alert-page-cache-false-alarm.md
        # ✅ **80% 是回放标定出来的，不是拍的**（做法同下面 CPU 节流那条）：
        #      唯一确证的真阳性 personal-services/frontend（multica，08-25，
        #        `memory.events max=69` 且 `memory.peak == memory.max`）：
        #        rss 峰值 **870Mi / 当时 limit 1024Mi = 85.0%**
        #      当前全舰队 rss 口径最高：litellm **71.1%** · trivy-operator 62.3% · 其余 <40%
        #    → 80% 正落在 71.1 与 85.0 中间，两侧各留 9 / 5 个点。
        #    ⚠️ 别升回 85%：那条线正好压在 multica 那次的读数上，真阳性变掷硬币。
        #    ⚠️ 别降到 75%：litellm 常态 71.1%，会变常亮黄灯。
        #    顺带把阈值拉回 reference/k8s-qos-resource-management.md 写的「>80% 就该抬 limit
        #    或查泄漏」——原先那 5 个点是给 working_set 的噪声留的余量，换 rss 后噪声源没了。
        # ⚠️ **认下的取舍**：`rss` 只是 cgroup v2 的 `memory.stat.anon`，不含 kernel/tmpfs/
        #    mlocked。本仓库没有 `medium: Memory` 的 emptyDir（jobs-sg/web 那处是特意用磁盘的），
        #    所以 anon 是这里唯一有分量的不可回收项；真被杀了还有 ContainerOOMKilled 兜底。
        #    ⚠️ 已知会漏的一类：`GOMEMLIMIT` 硬接 limit 的 Go 应用（08-24 grafana，
        #    第三种形状）—— 它是 GC 加班而不是 OOM，rss 未必到 80%。那一类的判据是
        #    `next_gc` / GC 频率，不归本条管。
        # ⚠️ 窗口 7d→2d：与 reference 里的排查查询统一（原先两边不一致）。代价是回看更短，
        #    收益是一次瞬态尖峰把告警钉住的时间从 7 天降到 2 天。
        #    `for: 30m` 在这里**不是去抖**（分子已是 2d 的 max，顶上去就是平台期），
        #    它只把首次投递推迟 30 分钟；要熄灭得等 2d 窗口滚过去。
        - alert: ContainerMemoryNearLimit
          expr: |
            max by (cluster, namespace, pod, container) (
              max_over_time(container_memory_rss{container!=""}[2d])
            )
            / on (cluster, namespace, container) group_left
            max by (cluster, namespace, container) (
              kube_pod_container_resource_limits{resource="memory"}
            ) > 0.80
          for: 30m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} 的 2d RSS 峰值已达 limit 的 {{ $value | humanizePercentage }}（{{ $labels.cluster }}）"
            description: |
              分子是 `container_memory_rss`（cgroup v2 的 anon），**不含页缓存**——响了通常
              是真的在逼近 OOM，现在抬 limit 还来得及。
              ⚠️ 控制面组件（ArgoCD / Kyverno / trivy / opencost）的峰值随**被管对象规模**
              增长而非流量增长——每次新增大 CRD 的 App 或扩容之后要回头复查这条。
              ⚠️ 排查时按 `id` 拆序列再看，别用聚合值：容器重启后 5 分钟内，旧容器的序列
              仍在 staleness 回看窗内，`max by (...)` 读到的是上一个容器的值。

        # ☠️ 2026-08-30 加：上一条的**分子来源守卫**。
        # ContainerMemoryNearLimit 依赖 `container_memory_rss`，而这个指标在 oracle 侧要靠
        # cloud/oracle/manifests/monitoring/otel-collector-config.yaml 的 keep 正则显式放行
        # （homelab 走 ServiceMonitor 抓 kubelet，天然就有）。那条正则被改窄或回滚 =
        # 分子无 series = 上一条在 oracle **恒不触发**，而「恒不触发」与「没有容器超阈值」
        # 在任何面板上都一模一样，不会有人发现 —— 这正是 08-30 那次排查里记下的坑。
        # ⚠️ 用 `absent()` 而不是 `count(...) == 0`：series 全没的时候 count 不产出任何样本，
        #    比较式永远不评估（同 reference/observability-alerting-slo.md 记的那类陷阱）。
        # ⚠️ 因此**改动顺序是硬的**：先上 oracle 的 keep 正则、确认 series 到货，再改规则。
        #    顺序反了这条会先烧 30 分钟。
        - alert: ContainerMemoryRssAbsent
          expr: |
            absent(container_memory_rss{cluster="homelab"}) == 1
            or
            absent(container_memory_rss{cluster="oracle-k3s"}) == 1
          for: 30m
          labels:
            severity: warning
            component: observability
          annotations:
            summary: "container_memory_rss 在 {{ $labels.cluster }} 已停止入库 —— ContainerMemoryNearLimit 正在该集群静默失效"
            description: |
              ContainerMemoryNearLimit 的分子没有 series，该集群的内存预警等于关闭，
              且外观与「没有容器超阈值」完全一致。
              oracle-k3s：查 cloud/oracle/manifests/monitoring/otel-collector-config.yaml
              的 `prometheus/cadvisor` keep 正则是否还含 `memory_rss`，以及 otel-collector
              DaemonSet 是否随 configMapGenerator 的哈希滚过。
              homelab：查 kube-prometheus-stack 的 kubelet ServiceMonitor / cAdvisor 采集。

        # 2026-08-18 加：CPU 节流的**可投递**版本。
        # 动机：upstream 的 `CPUThrottlingHigh` severity 是 `info`，而 Alertmanager 路由
        # 只收 `critical|warning`（info 由 InfoInhibitor 抑制）→ **它烧了也永远到不了
        # Telegram**。当天 multica-frontend 的故障里，它是唯一提前数小时指向真因（CPU
        # 被节流 66%、图片优化 2.3s、SSR 从 0.21s 退化到 0.77s）的信号，却被结构性丢弃；
        # 人只看到"首页有时要 4.5s"，查不到方向。
        # 不动 upstream 那条（沿用仓库既有做法：留着 info 版本做看板，另加 homelab 版本
        # 做投递，同 KubeletDown / KubeCPUOvercommit 的处理方式）。
        # ☠️ **阈值与窗口是实测标定出来的，别凭直觉改**。第一版写的是「10m 窗口 >50%
        #    持续 30m」，拿 7d 真实数据回放后发现**它什么都抓不到**：multica-frontend
        #    在 10m 窗口下的最长连续 >50% 只有 10 分钟（总计 35 分钟，是一阵一阵的），
        #    `for: 30m` 会把这个唯一的真信号全部滤掉 —— 规则看着合理，实际是装饰品。
        #    教训与内存那侧同构：**突发型负载要用长窗口平均，不能靠短窗口 + 长 for**。
        # ✅ 现行参数：**1h 平均窗口 · >25% · for 90m**。2h 粒度回放 48h 实测分离度：
        #      personal-services/frontend (multica, 768Mi 时代 jlbm5)  连续 **396 分钟**  → 烧
        #      trivy-system/{frontend,postgres,backend} 的 scan pod     58–60 分钟        → 滤掉
        #      personal-services/provision (open-notebook provisioner)  58 分钟           → 滤掉
        #      monitoring/exporter (cf-analytics)                       12 分钟           → 滤掉
        #      multica 修复后的新 pod                                   20–34 分钟        → 滤掉
        #    396 与 60 之间留着 30 分钟以上的余量，for=90m 落在中间，两侧都不贴边。
        # ⚠️ 那批 60 分钟的**不是噪声源而是标定基准**：trivy 的 scan job 是短命 pod，
        #    天生被 bulk 优先级挤到高节流，且 1h 窗口会让它死后再"拖尾"约 1 小时——
        #    所以任何 for < 60m 的取值都会把每晚的镜像扫描变成常亮黄灯。改小 for 之前
        #    先重跑上面那段回放。
        # ⚠️ 同理别把窗口从 1h 改小：窗口越短，突发型负载的比例越锯齿，for 就越抓不住。
        # ⚠️ 只对 homelab 生效：`container_cpu_cfs_throttled_periods_total` 在 oracle
        #    **压根不入库**（otel-collector 的 keep 正则只留 KRR 用的两个 container_* 指标，
        #    实测 by(cluster) 计数：homelab 62 条 / oracle 0 条）。不写死 cluster 的话，
        #    oracle 侧返回空结果，与"没有节流"外观完全一致 —— 2026-08-10 已据此误判过一次。
        # ⚠️ 分母用 periods_total 而非墙钟：节流率的判据是**周期比例**，不是 CPU 用量。
        #    `kubectl top` 在这里会给出个位数 m 的读数，看着像"完全没在用 CPU"。
        # ✅ 2026-08-30 放开到两集群：oracle 的 keep 正则已补
        #    `container_cpu_cfs_{,throttled_}periods_total`（各 42 条 series 实测到货），
        #    此前硬写 cluster="homelab" 纯粹是因为那边没有分子。oracle 只有 2 OCPU 而设了
        #    CPU limit 的容器比 homelab 还多（57 vs 53），比 homelab 更需要这条。
        #    下面的 ContainerCPUThrottlingMetricsAbsent 守卫这个新依赖。
        # ⚠️ oracle 侧的 1h 窗口从 keep 正则上线那刻起算，头一个小时内**只会少报**。
        - alert: ContainerCPUThrottlingSustained
          expr: |
            sum by (cluster, namespace, pod, container) (
              increase(container_cpu_cfs_throttled_periods_total{container!=""}[1h])
            )
            /
            sum by (cluster, namespace, pod, container) (
              increase(container_cpu_cfs_periods_total{container!=""}[1h])
            ) > 0.25
          for: 90m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} 的 CPU 节流率 {{ $value | humanizePercentage }}（1h 窗口），已持续 90m（{{ $labels.cluster }}）"
            description: |
              1h 窗口里超过四分之一的 CFS 周期在等配额，且已连续 90 分钟。症状通常是
              "服务没挂但很慢"，且**不会**触发任何可用性告警——对外可能一直是 200。
              先判是不是真的缺配额（而不是天生突发型采集器）：
                `kubectl --context k3s-homelab -n {{ $labels.namespace }} get pod {{ $labels.pod }} -o jsonpath='{.spec.containers[*].resources}'`
              抬 limit 前先想清楚这个容器的负载形状：
                · 按请求分配大块工作的（图片/PDF/视频转码、模板编译）→ 抬 limit 是对的，
                  且要同时看内存（这类负载内存也是突发型，见
                  records/2026-08-18-multica-frontend-idle-rightsizing-oom.md）。
                · 亚秒级突发的采集器/agent → 抬 limit 治不好，应考虑**不设 CPU limit**。
              ⚠️ 控制面是热笔记本（reference/homelab-host-power-thermal.md），抬 CPU 有热代价，
              别无脑往上加；优先抬到上游 chart 的默认值为止。

        # ☠️ 2026-08-30 加：上一条的**分子来源守卫**，同 ContainerMemoryRssAbsent 的口径。
        # oracle 的 cfs 指标靠 otel-collector-config.yaml 的 keep 正则显式放行；正则被改窄
        # 或回滚 = 分子无 series = 上一条在该集群恒不触发，而这与「没有容器被节流」在任何
        # 面板上都一模一样。
        # ⚠️ 与内存那条的一个**实打实的区别**：cAdvisor 只为设了 CPU quota 的容器吐这一族，
        #    所以「整个集群一个容器都没设 CPU limit」也会让本条烧起来。那种情况下它报的是
        #    真事（节流告警确实失去了覆盖），不是误报 —— 别因此给它加 cluster 限定。
        - alert: ContainerCPUThrottlingMetricsAbsent
          expr: |
            absent(container_cpu_cfs_periods_total{cluster="homelab"}) == 1
            or
            absent(container_cpu_cfs_periods_total{cluster="oracle-k3s"}) == 1
          for: 30m
          labels:
            severity: warning
            component: observability
          annotations:
            summary: "container_cpu_cfs_periods_total 在 {{ $labels.cluster }} 已停止入库 —— ContainerCPUThrottlingSustained 正在该集群静默失效"
            description: |
              CPU 节流告警的分子/分母没有 series，该集群的节流预警等于关闭，
              且外观与「没有容器被节流」完全一致。
              oracle-k3s：查 cloud/oracle/manifests/monitoring/otel-collector-config.yaml
              的 `prometheus/cadvisor` keep 正则是否还含 `cpu_cfs`，以及 otel-collector
              DaemonSet 是否随 configMapGenerator 的哈希滚过。
              homelab：查 kube-prometheus-stack 的 kubelet ServiceMonitor / cAdvisor 采集。
              也可能是**该集群所有容器都取消了 CPU limit** —— cAdvisor 只为有 quota 的容器
              吐这一族，那种情况下本条报的是真事。

        # 慢频崩溃循环（每轮存活数分钟的那种）。mixin 的 KubePodCrashLooping 罩不住它：
        # 那条规则看 waiting_reason{CrashLoopBackOff}，容器每轮 Running 的几分钟里序列
        # 断流，for: 15m 计时器被重置 —— 2026-08-19 opencost 事故实测该表达式最长连续
        # 成立仅 9.5 分钟，崩了 24 小时一次都没触发。
        # 本条改用 restarts_total 计数器：pod 存续期间序列无断流，长 for 才立得住。
        # 判据推导（2026-08-19，7d 回放实测）：
        #   · ≥3 次/1h：可捕最慢 20min/轮的循环。当前最慢的真实形态 =
        #     startupProbe 预算 10m + backoff 上限 5m = 15min/轮 = 4 次/h。
        #   · for: 90m：瞬时突发（修好就停的那种）的条件滞留上限 = 1h 回看窗；回放里
        #     4 个真实突发（multica OOM、节点重启后的 homepage 等）全部恰好 60.0min，
        #     90m 留 30min 余量。事故本尊连续满足 1,475min，1.5h 即触发。
        # 盲区（接受）：>20min/轮的更慢循环不在覆盖内，靠 KubePodNotReady 兜底。
        # 复盘：records/2026-08-19-opencost-bingen-replay-crashloop.md
        - alert: ContainerSlowCrashLoop
          expr: |
            increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[1h]) >= 3
          for: 90m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} 持续崩溃循环 ≥1.5h（{{ $labels.cluster }}，近 1h 重启 {{ $value | humanize }} 次）"
            description: |
              该容器连续 90 分钟保持每小时 ≥3 次重启 —— 是持续崩溃循环，不是瞬时抖动
              （瞬时突发最多让条件滞留 60 分钟，到不了这里）。每轮存活几分钟的慢循环
              KubePodCrashLooping 探测不到，本条就是为它设的。
              先分死因是探针杀还是进程崩：
                `kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}`
                （Events 里 Unhealthy+Killing = 探针杀；OOMKilled/Error = 进程自身）
              探针杀且日志"启动到一半就静默"的，参照复盘的取证手法
              （/proc/<pid>/io 判 I/O 类型 + fdinfo 采样抓文件）：
              records/2026-08-19-opencost-bingen-replay-crashloop.md

        - alert: CloudflaredAllReplicasDown
          expr: kube_deployment_status_replicas_available{deployment="cloudflared"} == 0
          for: 2m
          labels:
            severity: critical
            component: ingress
          annotations:
            summary: "All cloudflared replicas are down — external ingress is broken"
            description: |
              No cloudflared replicas are available. All `*.meirong.dev` services are inaccessible
              from the internet.

    - name: kubelet
      rules:
        # chart 自带的 KubeletDown 已在 values 里 disabled（见 kube-prometheus-stack.yaml
        # 的 defaultRules.disabled 注释）：它按 cluster 维度做 unless，而 oracle-k3s 上报
        # kube_node_info 却**故意只抓 kubelet 的 cadvisor 端点**（job=kubelet-cadvisor），
        # 永不存在 job="kubelet" → unless 恒成立 → 自 2026-08-02 起永久误报 critical。
        # 这里保留 homelab 侧的真实检测能力。
        # ⚠️ 别再把"显式锁 cluster=homelab"当本仓库的 absent 类约定 ——
        # external-dns 那条已于 2026-08-24 改成拿参照序列做
        # `count by (cluster) (...) unless count by (cluster) (...)`，覆盖两集群且不硬编码
        # 集群名（原开放项 #7）。本条锁 homelab 的理由是**另一个**：oracle 侧刻意
        # 只抓 cadvisor、不存在 job="kubelet" 的抓取，判据在此拓扑下不成立。
        # eso-alerts 那条仍锁 homelab，理由与 external-dns 旧注释同源（"oracle 是
        # best-effort OTel"）—— 那个理由已被实测推翻，见 docs/CHANGELOG.md 的 2026-08-24 条。
        # ⚠️ 若将来 oracle 也开始抓 kubelet /metrics，把这里改回按 cluster 聚合即可。
        - alert: KubeletDown
          expr: |
            count by (cluster) (kube_node_info{job="kube-state-metrics", cluster="homelab"})
              unless on (cluster)
            count by (cluster) (up{job="kubelet", metrics_path="/metrics", cluster="homelab"} == 1)
          for: 15m
          labels:
            severity: critical
            component: kubernetes
          annotations:
            summary: "homelab kubelet 已从 Prometheus 目标发现中消失"
            description: |
              homelab 集群不再有健康的 job="kubelet" 抓取目标（持续 15 分钟以上），
              但 kube-state-metrics 仍能看到节点对象。节点级指标（cadvisor/资源用量）
              会同时失效，多数依赖 kubelet 指标的告警将静默失效。
              Check: `kubectl --context k3s-homelab get --raw /api/v1/nodes/k8s-node/proxy/metrics | head`
              以及 ServiceMonitor kube-prometheus-stack-kubelet 是否仍存在。
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeletdown

    # 2026-08-02 加：kube-prometheus-stack 的 node-exporter mixin 规则
    # （NodeMemoryHighUtilization / NodeFilesystemAlmostOutOfSpace / CPU 那组）
    # 全部硬编码 job="node-exporter"，**只覆盖两个 K3s 节点**。裸机与外部主机跑在
    # node-exporter-metal-nodes / -dgx-spark / -macbook 下，一条都不匹配 →
    # 在此之前，承载整个 homelab 集群的 hypervisor 连内存/磁盘告警都没有。
    #
    # 刻意**不**统一放宽成 job=~"node-exporter.*"：几台机的正常态差别太大，
    # 一个阈值必然要么误报要么漏报，所以按主机分开定（阈值取自 2026-08-02 实测）。
    # ⚠️ 采集能力不齐，写新规则前先确认指标存在：
    #    - DGX ×2 **没有** node_filesystem_*（容器化 node_exporter 未挂宿主根）→ 磁盘只能靠 SMART
    #    - macbook **没有** node_memory_MemAvailable_bytes（darwin 无此指标）
    #    - pve 的 ZFS ARC 实测约等于 0（arc_size≈0），低 MemAvailable 是**虚拟机占用**，
    #      不是可回收缓存；106 反过来，ARC 3.8G 必须加回来才是真可用量
    - name: metal-nodes-resources
      rules:
        - alert: MetalNodeFilesystemLow
          expr: |
            100 * node_filesystem_avail_bytes{job="node-exporter-metal-nodes", fstype=~"ext4|xfs|zfs|btrfs"}
              / node_filesystem_size_bytes{job="node-exporter-metal-nodes", fstype=~"ext4|xfs|zfs|btrfs"} < 15
          for: 30m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "{{ $labels.nodename }} 的 {{ $labels.mountpoint }} 剩余空间 < 15%"
            description: |
              裸机主机文件系统吃紧（当前 {{ $value | printf "%.1f" }}% 可用）。
              注意 106 的 /storage/restic 是 restic 仓库——填满会让**双集群夜备同时失败**。
              Check: `ssh root@192.168.50.106 'zfs list -o name,used,avail'`（pve 换 192.168.50.4 + `df -h`）。
              基线：pve / = 79% 可用、106 /storage = 92%（2026-08-02 实测）；
              106 /storage/restic **2026-08-16 起 = 74% 可用**（配额 50G→100G，已用 26.2G）。
              ⚠️ /storage/restic 的分母是**配额**不是池子 —— 它"满"了池子还有 6T，
              处置多半是 `zfs set quota=` 抬一格（见 runbooks/backup-recovery.md），
              而不是去删备份。

        - alert: MetalNodeFilesystemCritical
          expr: |
            100 * node_filesystem_avail_bytes{job="node-exporter-metal-nodes", fstype=~"ext4|xfs|zfs|btrfs"}
              / node_filesystem_size_bytes{job="node-exporter-metal-nodes", fstype=~"ext4|xfs|zfs|btrfs"} < 8
          for: 15m
          labels:
            severity: critical
            component: infrastructure
          annotations:
            summary: "{{ $labels.nodename }} 的 {{ $labels.mountpoint }} 剩余空间 < 8%"
            description: |
              即将写满（当前 {{ $value | printf "%.1f" }}%）。ZFS 写满会让整个池转只读，
              备份与 vzdump 一起失效。立即清理或扩容。

        # pve：ARC≈0，低 MemAvailable 是 VM 分配的稳态，不是故障——用**绝对下限**而非百分比，
        # 否则永久误报。2026-08-02 实测 676Mi，7d 最低 522Mi，且已在用 1.07G swap。
        # 300Mi 触发说明比稳态又恶化了一截（多半是新开 VM 或宿主进程泄漏）。
        - alert: ProxmoxHostMemoryLow
          expr: node_memory_MemAvailable_bytes{job="node-exporter-metal-nodes", instance="192.168.50.4:9100"} < 300 * 1024 * 1024
          for: 30m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "Proxmox 宿主 pve 可用内存 < 300Mi"
            description: |
              pve 承载整个 homelab K3s VM（12.6GiB）。可用内存跌破稳态基线，
              继续恶化会触发宿主 OOM killer——被杀的可能就是 K3s VM 本身。
              Check: `ssh root@192.168.50.4 'free -h; qm list'`，看是否有新 VM/进程占用。

        # 106：ARC 是可回收缓存，必须加回来（减 arc_c_min 是 ARC 不会缩到的那部分）。
        # ⚠️ **余量已经不宽了**：2026-08-02 实测真可用 66%（4.98G/7.57G）；
        # 2026-08-16 把 ARC 砍到 1G、worker VM 加到 4G 之后，同一表达式实测 **16%**
        # —— 距离 10% 阈值只剩 6 个百分点。这不是配置错误，是这台 8G 机器被吃满了：
        # ARC 1G(arc_c_min 242Mi) + VM 4G + PVE 自身 ~2.6G。
        # 再往 worker VM 加内存、或在 106 上多跑任何东西之前，先看这条表达式的当前值。
        - alert: StorageNodeMemoryLow
          expr: |
            100 * (
              node_memory_MemAvailable_bytes{job="node-exporter-metal-nodes", instance="192.168.50.106:9100"}
                + node_zfs_arc_size - node_zfs_arc_c_min
            ) / node_memory_MemTotal_bytes{job="node-exporter-metal-nodes", instance="192.168.50.106:9100"} < 10
          for: 30m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "storage-106 真实可用内存 < 10%（已计入可回收 ZFS ARC）"
            description: |
              该表达式已把 ARC 当可回收算回去，所以触发意味着**真的**没内存了，
              不是 ARC 占着。106 内存不足会拖慢 restic 夜备与 ZFS。
              Check: `ssh root@192.168.50.106 'free -h; arc_summary | head -30'`。

        # ☠️ 2026-08-09：删掉 `DgxSparkMemoryLow`（MemAvailable < 4GiB / for 30m）。
        # 它 7 天烧了约 10 个窗口（3h~30h 不等），是当期最大的单一噪声源，而**它警示的
        # 危害一次都没发生**。7 天实测：
        #   MemAvailable 低于 4GiB 的采样占比：.120 = 48%、.92 = 32%
        #     （.120 min 0.8G / p25 1.6G / p50 7.3G；.92 min 1.8G / p25 2.6G / p50 9.8G）
        #   同期 node_vmstat_oom_kill 增量 = **0**
        #   同期 PSI 内存停顿 rate(node_pressure_memory_waiting_seconds_total[5m])
        #     p99 = 0.0000、max = 0.0010（即最坏时刻也只有 0.1% 的时间在等内存）
        # 结论：阈值压在正常工作带正中间。GB10 是 **128GB 统一内存**，模型常驻会把
        # MemAvailable 长期压低，但那既不产生内存压力也不触发 OOM ——
        # 在这台机器上 MemAvailable **对"会不会 OOM"没有预测力**，再怎么调低阈值
        # 都只是在挑一个不那么频繁的误报点。
        # ⚠️ 原注释「2026-08-02 实测 9.9G/11.2G，4GiB 有余量」是**单点采样**：
        # 它取到的是 p50 附近的一个瞬时值，看不见 p25 已经到 1.6G。
        # 定阈值要看分布，别看一次 `free -h`。
        #
        # 换成两条**有预测力**的规则，阈值同样由上面那份 7 天实测反推：
        - alert: DgxSparkMemoryPressure
          # 领先指标：任务真的在等内存。观测到的最大值是 0.0010，取 0.10 =
          # 高出实测天花板 100 倍 → 正常态绝不触发，触发即真有内存瓶颈。
          expr: rate(node_pressure_memory_waiting_seconds_total{job="node-exporter-dgx-spark"}[5m]) > 0.10
          for: 15m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "{{ $labels.nodename }} 内存压力持续 >10%（PSI stall）"
            description: |
              DGX Spark（GB10，128GB 统一内存）任务在等内存，推理吞吐会掉。
              ⚠️ 别再看 `MemAvailable` 判断（模型常驻使其长期低位，与压力无关），
              看 PSI：`ssh $dgx 'cat /proc/pressure/memory'`。
              Check: `ssh $dgx 'free -h; nvidia-smi'`，看是否有该卸载的模型常驻。
        - alert: DgxSparkOOMKill
          # 确定性指标：真的被杀了。0 容忍——7 天基线就是 0。
          expr: increase(node_vmstat_oom_kill{job="node-exporter-dgx-spark"}[1h]) > 0
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "{{ $labels.nodename }} 发生 OOM kill"
            description: |
              过去 1 小时内核 OOM killer 杀掉了进程（7 天基线为 0，任何一次都是异常）。
              Check: `ssh $dgx 'dmesg -T | grep -i "killed process" | tail'`。
              ⚠️ DGX 没有 node_filesystem_* 指标（容器化 node_exporter 未挂宿主根），磁盘只能看 SMART。

        # ☠️ 覆盖盲区（2026-08-09 补）：**两个集群在 08-08 各重启过一次，告警一声没吭**。
        #   oracle-k3s  boot 08-08 23:57 (+08)  —— zitadel/zitadel-pg 同秒 exit=255
        #                                          reason=Unknown，uptime-kuma/cloudflared 连带重启
        #   homelab     boot 08-08 15:01 (+08)
        # 而 `last -x` 显示 oracle **5 天重启 5 次**，其中 08-06 04:39、08-08 09:32、
        # 08-08 23:58 三次**没有对应的 shutdown 记录 = 非正常关机**（只有 08-05 20:39
        # 那次是干净的，对应已知的 shape 缩容）。
        # 为什么以前看不见：节点回来得快，KubeletDown/TargetDown 要么没到 for 时长，
        # 要么（oracle 的 KubeletDown）本来就被路由到 null 丢弃了 —— 于是"机器重启过"
        # 这件事**原理上没有任何一条规则在看**。重启会重置一切内存态（连带把
        # AlertmanagerFailedToSendAlerts 那串误报也一起制造出来），必须显式盯。
        #
        # ⚠️ 这里用统一的 `job=~...` 是**故意的**，与本文件上方"刻意不统一放宽 job"
        # 那条注释不冲突：那条讲的是**内存阈值**，几台机的正常态差别太大；
        # 而"开机时长"没有这种个体差异，重启就是重启。
        # 覆盖六台：两个 k3s 节点（job=node-exporter，homelab 与 oracle 共用此 job 名）
        # + pve/106（node-exporter-metal-nodes）+ 两台 DGX。
        # ⚠️ DGX **本来想排除**（"按需开关机的工作站"），2026-08-09 查完推翻了这个假设：
        # dgx-spark-2 七天缺席 56.3h 看着像关机，但登上去 `last -x` 显示它
        # **从 Jun 4 连续运行到 Aug 7 从没关过**。那 48h 是**网络断了**——
        # 断线期间 tailscaled 记的是 `netcheck: UDP is blocked` +
        # `report: udp=false v4=false icmpv4=false derp=0` +
        # `derp-20(hkg): network is unreachable`，即该站点整条出网路径不可达。
        # 所以两台 DGX 也是"应当长期在线"的（历史 uptime 60+ 天），纳入覆盖。
        # 它们 08-07 那串重启是**内核升级链**（6.11.0-1014 → 6.17.0-1014 → 6.17.0-1029，
        # 每次都有干净的 shutdown 记录），这种事值得在 Telegram 留一行。
        # macbook 仍排除：它是真正按需开合盖的笔记本。
        # 📌 dgx-spark-2 的登录方式是 `ssh -i ~/.ssh/vgio admin@100.67.164.92`
        # （用户名 **admin**，不是 ubuntu/matthew；它在另一个 tailnet
        # `kaixinhuang3307@gmail.com` / tailf63175.ts.net 下）。
        - alert: NodeRebooted
          # 窗口取 30m 而非更短：oracle 的指标要经 otel-collector 重新起来才 remote-write，
          # 开机头几分钟可能没有样本，窗口太窄会整个错过。
          expr: (time() - node_boot_time_seconds{job=~"node-exporter|node-exporter-metal-nodes|node-exporter-dgx-spark"}) < 1800
          for: 5m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "{{ $labels.cluster }} / {{ $labels.instance }} 刚重启（开机不足 30 分钟）"
            description: |
              节点重启了。若非你主动操作，就是**非正常关机**，需要查原因。
              oracle 的 journald 持久化**已启用**（`/var/log/journal` 存在，`Storage=auto`
              据此落盘；2026-08-14 实测 `journalctl --list-boots` 能看到 6 个历史 boot）。
              查崩溃现场：`journalctl -b -1 -n 25`。⚠️ 若最后几行是正常业务日志、
              **没有任何 shutdown 序列**，那**不是**宿主层重置的证据（2026-08-14 曾这样误判）——
              `panic_on_oops=1` 会让 guest 内核 panic 后在落盘前就重启，长得一模一样。
              客场全阴时去 hypervisor 侧取证：`oci compute console-history`（方法见
              records/2026-09-01-oracle-apparmor-af-unix-panic.md）。

        # ☠️ 存在理由 = 补一个我们自己弄哑的信号（2026-09-01）。
        # 给 oracle 设 `kernel.panic_on_oops=0` 之后，oops 不再重启机器 ——
        # 好处是不再全集群断 6~10 分钟，代价是**那次 oops 不会触发任何告警**，
        # 只在 dmesg 里留一行。已知残留暴露面：postgres/pg_isready 仍在访问带路径的
        # unix 套接字，理论上能踩到同一个空指针。本条把信号补回来。
        # 完整背景 → records/2026-09-01-oracle-apparmor-af-unix-panic.md
        #
        # 判据用内核 taint 位而不是数 dmesg：taint 是内核自己置的、零成本、绝不漏。
        # ⚠️ **本条会一直烧到你处理并重启** —— taint 位置位后保持到下次启动。这是刻意的：
        #    内核死过一次的机器不该让告警自己悄悄消失。处理 = 取证后重启。
        # ⚠️ **不能写 absent() 类判据**：`kernel_taint_die` 只有 oracle 有
        #    （由 kernel-health-metrics.timer 经 node-exporter textfile 导出，
        #    装在 cloud/oracle/ansible/playbooks/setup-k3s.yaml）。homelab 两个节点
        #    仍是发行版默认的 panic_on_oops=1，oops 会照旧重启并触发 NodeRebooted，
        #    信号没丢、不需要这套；对它们写 absent 只会永久误报。
        #    ⚠️ 但 k8s-node 的 7.0.0-30-generic 实测同样带 unix_fs_perm 符号 ——
        #    哪天也给它关了 panic_on_oops，必须同时把导出器搬过去。
        - alert: KernelOopsOccurred
          expr: kernel_taint_die == 1
          for: 5m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "{{ $labels.cluster }} / {{ $labels.instance }} 内核发生过 oops（taint D 位已置）"
            description: |
              内核在本次启动期间死过至少一次（oops/BUG）。机器还活着是因为
              `panic_on_oops=0`，**不是因为没事**。
              先看是不是已知的那个：`journalctl -k | grep -A30 "Internal error: Oops"`，
              栈里出现 `unix_fs_perm` / `aa_unix_file_perm` 就是 AppArmor af_unix 那个
              上游未修的空指针（records/2026-09-01-oracle-apparmor-af-unix-panic.md
              有完整签名、kprobe 定位法和上游报告草稿）。
              若是**新的**栈，按同一套路取证：`kernel_oops_recent` 看新鲜度，
              必要时 `oci compute console-history` 抓串口。
              本条要重启才会消（taint 位保持到下次启动），取证完再重启。
              重启后按 runbook 核不变量：`cd cloud/oracle && just verify-node`（只读）。

        # ☠️ 频次盲区（2026-08-14 补）：上面那条**每次重启都正常响过**，oracle 在
        # 08-10~08-13 就 firing 了 21 个样本 —— 但它是**逐次**告警，读不出
        # "这台机在反复重启"。而 2026-08-09 加 NodeRebooted 时注释里记的已经是
        # "oracle 5 天重启 5 次"，到 2026-08-14 复查又是**6 天 6 次**（全部无 shutdown
        # 记录、无 panic、无 OOM、无 crash dump，每次都从 EDK II 固件冷启动）
        # —— 即这是**持续 9 天以上的慢性故障**，却因为每次只留一条 warning
        # 混在日常噪声里，从没被当成一件事看。与 V4-Flash 那次同型：信号在，模式不在。
        # 阈值取 24h ≥3：正常运维（内核升级链）一天最多 2 次，且带干净 shutdown。
        - alert: NodeRebootLoop
          expr: changes(node_boot_time_seconds{job=~"node-exporter|node-exporter-metal-nodes|node-exporter-dgx-spark"}[24h]) >= 3
          for: 10m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "{{ $labels.cluster }} / {{ $labels.instance }} 24h 内重启 {{ $value }} 次——不是偶发"
            description: |
              这台机在反复重启，按单次 NodeRebooted 看不出来。先分清是哪一类：
              `journalctl -b -1 -n 25` 有干净 shutdown 序列 → 客场原因（内核升级/主动重启）；
              日志戛然而止且无 panic/OOM → **别停在这里**：这既可能是宿主层重置，
              也可能是 guest 内核 panic（`panic_on_oops=1` 时来不及落盘），两者客场同形。
              ☠️ 2026-08-14 就在这一步误判成宿主层、白白多崩了 2.5 个月。
              判据只能去 hypervisor 侧拿：`oci compute console-history` 抓串口缓冲区，
              有 panic 栈就是 guest 内核问题。oracle 已确诊为 AppArmor af_unix 空指针，
              并已设 `panic_on_oops=0` 止血（故此后 oracle 再反复重启 = 新问题，别套旧结论）。
              取证脚本与完整推理 → records/2026-09-01-oracle-apparmor-af-unix-panic.md

    # ☠️ 覆盖盲区（2026-08-13 补）：**V4-Flash 推理服务死了 3h10m，告警"响过"却没人动。**
    # 事故实录（全部可在本 Prometheus 复查，均在 7d 保留期内）：
    #   09:57:54  dgx-spark-2 整机硬挂 —— journal 戛然而止，无 shutdown / 无 panic / 无 OOM 记录
    #   09:58:30  leader 侧僵尸 TP 组成型：running=2 而 iteration_tokens_total_count
    #             冻在 6075 —— 但 :8000 仍 200、up==1、**指标一切正常**
    #   10:02:30  k8s liveness 探针杀掉 leader（探针原话：demand=2 but steps stuck at 6075）
    #   10:07     rank1 不在 → leader 组不成 TP 组 → 崩溃循环 40 次，:8000 连接被拒
    #   13:07     人工硬断电重启 dgx-spark-2（该次开机**无**对应 shutdown 记录）
    #   13:17     服务恢复
    # 为什么"响过却没人动"：内置 TargetDown 确实 firing 了 10:12–13:12（三条，
    # node-exporter / smartctl / vllm 各一条），但
    #   1. 语义太泛 —— "某个 job 的 target 掉了"读不出"推理服务没了"，也不含任何排查动作；
    #   2. severity=warning → repeatInterval **4h** → 3 小时的中断在 Telegram 里
    #      基本只留下**一条**消息，混在日常噪声里被划过去。
    # 即这里不是"缺信号"，而是**信号没有可操作性，且重复周期长于故障时长**。
    # 下面三条按事故的三个阶段分别定位，并把前两条升到 critical（repeat 30m + 🆘）。
    # ⚠️ 与 TargetDown 的重叠是**故意保留**的：TargetDown 是覆盖任何 job 的兜底，
    # 这三条是带 runbook 的定向规则。别为了"去重"把 TargetDown 关掉。
    # ⚠️ 这三条**只依赖 vllm-dgx-spark + node-exporter-dgx-spark 两个 job**：homelab
    # Prometheus 并不抓 dgx 集群的 kube-state-metrics，所以 KubePodCrashLooping /
    # PodStuckInUnknown 那类 Pod 级规则对 dgx **完全不生效**，别指望它们兜底。
    - name: dgx-spark-inference
      rules:
        - alert: DgxSparkVllmDown
          # 关键在 `and on(nodename)`：只在**宿主可达而引擎不可达**时才报，即确实是引擎问题。
          # 整机/tailnet 不可达是另一码事（见本文件 NodeRebooted 注释：dgx-spark-2 曾因
          # 断网缺席 56h 却从未关机），那种情况留给 TargetDown / NodeRebooted，
          # 免得一次网络抖动被误读成"引擎挂了"。
          # 2026-08-13 拿事故当时的数据实证过：11:00 该表达式返回 dgx-spark-1（会触发），
          # 健康态返回空（不会触发）。
          expr: up{job="vllm-dgx-spark"} == 0 and on(nodename) up{job="node-exporter-dgx-spark"} == 1
          # for 原本的 10m 是按旧栈（V4-Flash）实测 5m29s 恢复定的，留 ~2 倍余量。
          # ☠️ 2026-09-02 DGX 换主力栈 qwen38-flash-next：权重 126 GiB，冷启动实测 8–11 分钟，
          # 10m 会被一次**正常**的 `make qwen38fn-restart` 烧成 critical。抬到 15m。
          # 刻意不取 2 倍余量（那要 22m）：critical 多盲 7 分钟比误报一次更贵，而且重启成功
          # 那一半自有 DgxSparkVllmRestarted 兜住。08-13 那种真中断照旧抓得到
          # （10:07 起算 → 15m 后约 10:22，只比原阈值晚 5 分钟，故障是 3h10m 量级）。
          for: 15m
          labels:
            severity: critical
            component: inference
          annotations:
            summary: "dgx-spark vLLM 推理服务不可用（宿主在线，:8000 无响应）"
            description: |
              DGX 主力模型（2026-09-02 起 `qwen38-flash-next`）唯一的 API 端点
              100.97.87.120:8000 没了，而宿主机还活着。
              最常见成因（08-13 实录）：**对端节点 dgx-spark-2 死了**，leader 组不成
              TP=2 → 崩溃循环，日志为 `Engine core initialization failed`。
              先查对端在不在：`ssh -i ~/.ssh/vgio admin@100.67.164.92 uptime`
                （不通 = 整机硬挂，只能硬断电重启；journal 会在某一秒直接断掉，
                 事后**找不到** panic/OOM 记录，别在日志里挖根因）
              再看两个 rank：`cd ~/projects/meirongdev/nv-dgx-spark && make qwen38fn-status`
              日志：`make qwen38fn-logs`（rank0）/ `make qwen38fn-logs-worker`（rank1）
              ⚠️ 恢复必须整组重启 `make qwen38fn-restart`，**绝不能只重启一个 rank**
              （会造出僵尸 TP 组，见 DgxSparkVllmStuck）。加载 8–11 分钟（126 GiB 权重）。
              回滚到旧栈（V4-Flash，权重/镜像仍保留）：`make qwen38fn-rollback` 后
              `make v4flash-run` —— 但网关/作业/Open Notebook 的模型名要一起回退。
        - alert: DgxSparkVllmStuck
          # 僵尸 TP 组：**up==1 而引擎不干活**。这是多节点 TP serving 的签名故障 ——
          # /health 与 /v1/models 照常 200、指标照常被抓，但每个真实生成都超时。
          # 任何基于"抓得到就算活着"的告警（含 TargetDown）**原理上看不见这一段**。
          # 判据照抄 k8s liveness 探针（nv-dgx-spark/k8s/qwen38fn/configmap-launch.yaml
          # 里的 liveness.py）：有需求 + 进度不前进。08-13 的真实样本（本 Prometheus
          # 可复查 09:58:30–10:02:30）：running=2 恒定，iteration_tokens_total_count
          # 冻在 6075 整 4 分钟。
          # 指标缺失时表达式返回空 = 不告警，与探针的"missing data must pass"一致
          # （vLLM 的直方图在第一次迭代完成前根本不存在）。
          expr: |
            (vllm:num_requests_running + vllm:num_requests_waiting) > 0
              and increase(vllm:iteration_tokens_total_count[5m]) == 0
          # ⚠️ 明知打不过探针：`increase[5m]==0` + for 5m ≈ 停滞 10 分钟才报，而探针
          # （period 60s / failure 3）约 3.5 分钟就杀。所以这条是**兜底**，覆盖探针被
          # 关掉/失效、或回滚到 systemd 路径（那条路径没有任何探针）的情况。
          # 故意取保守窗口：误报一次是白响一个 🆘，晚 5 分钟发现几乎没有代价。
          # 若哪天探针被移除，把窗口收到 increase[3m] + for 2m。
          for: 5m
          labels:
            severity: critical
            component: inference
          annotations:
            summary: "dgx-spark vLLM 有请求积压但零进度（疑似僵尸 TP 组）"
            description: |
              引擎**看着是活的**（up==1、/health 200、/v1/models 200）但一步都没往前走。
              别拿 `/health` 或 `/v1/models` 判断，它们在这个故障里照样返回 200 ——
              发一个真实生成才能确认：`make qwen38fn-test`。
              成因几乎总是只重启了一个 rank（或一侧节点/进程单独死掉），
              存活那侧永久卡在集合通信里且**不退出**。
              恢复：`make qwen38fn-restart`（整组，加载 8–11 分钟）。
              现场取证：`curl -s http://100.97.87.120:8000/metrics | grep -E 'num_requests|iteration_tokens_total_count'`
        - alert: DgxSparkVllmRestarted
          # liveness 探针是**静默恢复**的 —— 这正是 08-13 没人察觉的另一半：探针
          # 10:02:30 杀掉了一个挂死的 leader，做得完全正确，但没有任何人被告知。
          # 与本文件 NodeRebooted 同一哲学：重启会重置一切内存态，必须显式盯。
          # 这里还有性能含义：重启后头几个请求实测 ~30% 慢（冷启动 + 一次性 Triton
          # JIT 编译），看到这条就知道那段时间的 tok/s 数字不能拿来引用。
          # process_start_time_seconds 2026-08-13 核对过：报 13:11:07，与容器
          # Started 13:11:08 一致，可信（它由 vLLM 的 prometheus_client 直接导出）。
          expr: (time() - process_start_time_seconds{job="vllm-dgx-spark"}) < 1800
          # for 5m：等引擎真起来再报，免得和 DgxSparkVllmDown 抢话。换栈后加载 8–11 分钟，
          # 指标出现得更晚，这条只会更靠后，不抢话；30m 窗口仍完整覆盖一次冷启动。
          # warning 而非 critical：重启**已经成功**了，属于事后知情，不是正在烧的火。
          # 会在每次主动 `make qwen38fn-restart` 时也响一声 —— 与 NodeRebooted 一样刻意接受。
          for: 5m
          labels:
            severity: warning
            component: inference
          annotations:
            summary: "dgx-spark vLLM 引擎刚重启（进程启动不足 30 分钟）"
            description: |
              引擎进程重启了。若非你主动 `make qwen38fn-restart`，那它是**被杀的** ——
              可能是 liveness 探针判定僵尸 TP 组（正确行为），也可能是 OOM 或 CUDA 错误。
              Check: `make qwen38fn-status`（RESTARTS 列即累计次数，08-13 那次崩溃循环烧到 40）。
              上一个容器为什么死（deploy/ 选择器，不用先查 pod 名；2026-08-13 实测可用）：
                `kubectl --kubeconfig ~/.kube/dgx-spark.yaml -n qwen38fn logs deploy/qwen38fn-leader --previous | tail -50`
              ⚠️ 刚重启后别做性能基准（冷启动 ~30% 慢，且首个请求含 Triton JIT 尖峰）。

        # ⚠️ 防过载/前兆规则（2026-08-15 落地，规格见 nv-dgx-spark/docs/auto-mitigation-cn.md §3）。
        # 这是规格 A4/A5 的实现；A1/A2（MemAvailable 百分比阈值）在 08-09 已按实测判定为
        # 误报陷阱而删除（GB10 统一内存里模型常驻把 MemAvailable 长期压低、对"会否 OOM"无预测力，
        # 见本组上方 DgxSparkMemoryPressure 的长注释），已由 PSI stall + OOM-kill 两条替代，
        # 这里**不**重新引入；A3（KV 缓存占用）2026-08-25 也按实测删除，见下方墓碑注释；
        # A6（SMART 失败）已由 storage-alerts.yaml 的 SmartHealthFailed /
        # SmartMediaErrors / NVMe 磨损规则覆盖（无 job 过滤 → 天然匹配 smartctl-dgx-spark）；
        # A7（load1>8 info）因 Alertmanager 路由只收 critical|warning、info 被丢弃，写了也是
        # 死规则，且 GB10 load 探针有噪音，故省略。
        #
        # ☠️ 2026-08-25：删掉 `DgxSparkKVCacheHigh`（A3，kv_cache_usage_perc > 0.90 / for 5m）。
        # 规则注释里那句「首月按实测回校」到期了，回校结论是删。它是当期最大的单一噪声源：
        # 7 天 firing 1368 个样本、6 个窗口（最长 7.3h；多数从凌晨 ~03:30 的批处理开始），
        # warning 4h repeat + sendResolved 下一周 ≈14 条 Telegram —— 而**它预警的危害
        # （排队/吞吐骤降）一次都没发生**。7 天实测：
        #   kv_cache_usage_perc：p50 .671 / p90 .810 / p99 .975 / max 1.0，
        #     >0.90 的时间占比 8.1% —— 0.90 压在正常工作带里。批处理把 KV 打满
        #     是 max_num_seqs=6 下的正常饱和（规则自己的 description 也这么写），自愈。
        #   同期 num_requests_waiting：7d max = 6、p99 = 2；最长那个 7.3h 窗口里
        #     max 也只有 3 —— 即 A4（waiting>4，真正的「排队挨饿」判据）同期 **0 触发**。
        # 结论与 08-09 删 DgxSparkMemoryLow 同型：KV 占用高对「会不会饿死请求」没有预测力，
        # 饱和是否有害只能看队列，而队列有自己的规则（下面的 A4）。
        # 回校成别的阈值也救不了：>0.98 仍占全周 0.73%（正常批处理照样常驻）；
        # avg_over_time[30m]>0.95 占 5.9%；avg[1h]>0.97 全周 0 触发，但「钉死打满 1h」
        # 要么伴随排队（A4 接住）要么零进度（DgxSparkVllmStuck 接住），单独成条不增加信息量。
        # KV 占用仍在 dgx-vllm dashboard 上，排查时去看图，不需要为它挨报。
        - alert: DgxSparkRequestsQueued
          # 排队饱和前兆：waiting>4 意味着并发上限被打满、有人在挨饿
          # （2026-08-02 事故类型——饱和时交互请求会被长批处理拖死）。
          # ⚠️ 2026-09-02 换主力栈后 `--max-num-seqs` 从 6 抬到 8，但阈值**刻意不动**：真正的
          #    并发上限已从"条数"换成"KV 池"——线上 cache_config 实测
          #    kv_cache_max_concurrency=5.34（gmu 0.75），它比 8 更早卡住，也和旧的 6 同量级。
          #    按 8 等比抬到 6 反而会把"有人在挨饿"那一段推迟。首月按实测回校。
          # ⚠️ 与 DgxSparkVllmStuck 语义**不同**：那条是"有需求但零进度"（僵尸 TP 组），
          # 这条是"引擎健康但队列挤爆"。heavy 批处理时 waiting 可瞬间上百，阈值按本集群
          # 实际（见上方 KV 上限）取 4，首月按实测回校。
          expr: vllm:num_requests_waiting{job="vllm-dgx-spark"} > 4
          for: 2m
          labels:
            severity: warning
            component: inference
          annotations:
            summary: "dgx-spark vLLM 排队请求 > 4（并发上限饱和）"
            description: |
              有 {{ $value }} 个请求在排队，引擎接近/达到并发上限（max_num_seqs=8，
              KV 池实测有效并发 5.34 —— 后者才是真瓶颈）。
              长批处理会把交互请求饿死。查当前占用：
              `cd ~/projects/meirongdev/nv-dgx-spark && make qwen38fn-load`
              长期高频触发 = 并发客户太多，考虑限流/减并发；偶发自愈则忽略。
        - alert: DgxSparkNodeDown
          # 覆盖盲区（2026-08-15 补）：S2 断电级死亡时，内置 TargetDown（severity=warning、
          # repeat 4h）语义太泛、读不出"推理机器整个没了"，且重复周期长于故障时长，3 小时的中断
          # 在 Telegram 里只留一条消息被划过去（08-13 尸检结论，见本组上方长注释）。
          # 这条是带 runbook 的定向 critical：`node-exporter-dgx-spark` 一个 target 不可达
          # = 整机或整条出网路径不可达（DGX Spark 无 BMC/IPMI，Wake-on-LAN 亦无效，只能物理回收）。
          # ⚠️ 与 DgxSparkVllmDown 互补：那条盯"宿主在线、引擎没了"；这条盯"宿主本身没了"。
          #   保留与 TargetDown 的重叠是**故意**的（业界同款哲学：TargetDown 是兜底，
          #   这条是带 runbook 的定向），别为了去重把任何一条关掉。
          # for 取 3m 而非规格建议的 1m：node_exporter 经 flaky 的 Tailscale DERP relay 抓取，
          # 1m 会被一次中继抖动误报 critical；3m 仍远短于 S2 那种小时级中断，且比 TargetDown
          # （repeat 4h）早得多叫醒人。
          expr: up{job="node-exporter-dgx-spark"} == 0
          for: 3m
          labels:
            severity: critical
            component: inference
          annotations:
            summary: "dgx-spark 节点掉线：{{ $labels.nodename }}（node-exporter 不可达）"
            description: |
              {{ $labels.nodename }} 的 node_exporter 被 Prometheus 抓不到了，整机或整条出网
              路径中断。先确认是不是整个 tailnet 抖动：另一台 dgx 还通吗？
              两台都通 = 网络/中继问题；只这台不通 = 大概率它自己硬挂了（断电级，参考 08-15 S2）。
              判断对端：`ssh -i ~/.ssh/vgio admin@100.67.164.92 uptime`
              （登录方式与 tailnet 归属见本文件 NodeRebooted 的长注释）。
              ⚠️ 无 BMC/IPMI + WoL 无效时，真断电只能物理到场硬重启，重启后
              `cd ~/projects/meirongdev/nv-dgx-spark && make qwen38fn-status && make qwen38fn-test`。

    - name: multicluster-telemetry
      rules:
        - alert: OracleTelemetryAbsent
          expr: absent(up{cluster="oracle-k3s"}) == 1
          for: 15m
          labels:
            severity: critical
            component: observability
          annotations:
            summary: "oracle-k3s telemetry stopped arriving at homelab Prometheus"
            description: |
              No metrics with cluster=oracle-k3s for 15+ minutes. The OTel push path from oracle
              (prometheusremotewrite → 100.94.186.7:31090; logs 31080 and traces 31317 likely
              share the fate) is broken — oracle data is being dropped, not queued.
              Check: `kubectl --context k3s-homelab get svc -n monitoring | grep external`
              (NodePort svcs from monitoring-external.yaml), then Tailscale reachability.
              Bit us 2026-07-07: monitoring-external.yaml fell out of every App's include glob
              and ArgoCD pruned the NodePort services — silent telemetry blackout for ~1 day.

        # ☠️ 死人开关**自身的失明窗口**（2026-08-14 补）。
        # alertmanager-config.yaml 里把 `AlertmanagerFailedToSendAlerts{integration=webhook}`
        # 路由到 null，理由写的是"死人开关是**自检**的：心跳停 → oracle 的 push monitor
        # (60s interval) 转 DOWN → 它自己从 oracle 直连 Telegram 报警"。
        # 那个前提**只在"发送侧/链路坏、接收侧活着"时成立**。2026-08-14 实测反例：
        #   08-13 17:21 UTC oracle 硬重启 → uptime-kuma 一起没了
        #   → monitor id=1 的心跳缺口 17:18:26 → 17:28:06（**9分40秒**，interval 才 60s）
        #   → 当天 important 翻转数 = **0**：没转 DOWN、没报警、库里不留痕迹
        # 因为 push monitor 的检查跑在 uptime-kuma **进程内**，它自己下线就没人检查；
        # 重启回来后 ~45s 内新推送就到了，看上去"一直 UP"。
        # 即**接收方和发送方一起挂时，死人开关静默失明**——而 oracle 正好每天硬重启。
        # 这条不是要推翻 2026-08-09 那个静默决定（那条针对的是 1.6% 失败率的抖动噪声，
        # 依然对）；这条只捞**持续 5 分钟以上的全量失败**，即"接收方真的没了"。
        # ⚠️ 阈值经线上 5 天双向实测：>=5/5m 在 5 次硬重启上全部命中（条件真实持续
        # 9.5~11 分钟），且**完全避开**所有小抖动（08-10 04:26 的 9 次/时、08-11 03:26
        # 的 5 次/时等一律不触发）。改阈值前请照同样方式两向复验。
        # ⚠️ 与上面 null 路由不冲突：那条按 alertname 匹配，本告警 alertname 不同，
        # 不会被一并丢弃。但若将来新增别的 webhook 接收器，`integration="webhook"`
        # 就不再唯一指向死人开关，这条要跟着改判别方式。
        - alert: DeadMansSwitchReceiverDown
          expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[5m]) >= 5
          for: 5m
          labels:
            severity: warning
            component: observability
          annotations:
            summary: "死人开关推送持续失败——此刻 homelab 挂了不会有人知道"
            description: |
              Watchdog 心跳推不到 oracle 的 Uptime Kuma，已持续 5 分钟以上。
              **这段时间死人开关是失明的**：它的自检兜底跑在 uptime-kuma 进程内，
              接收方自己下线时不会转 DOWN，事后也不留痕迹。
              最常见原因是 oracle 整机重启（查 NodeRebootLoop / NodeRebooted 是否同时响）。
              核实接收端：`kubectl --context oracle-k3s -n personal-services get pods | grep uptime-kuma`
              查心跳缺口是否真的没被记成 DOWN：
              `kubectl --context oracle-k3s -n personal-services exec deploy/uptime-kuma -c uptime-kuma -- sqlite3 /app/data/kuma.db "SELECT time,status FROM heartbeat WHERE monitor_id=1 ORDER BY time DESC LIMIT 20;"`

    - name: prometheus-self
      rules:
        # Prometheus 自身的基数看门狗（2026-08-20 加）。
        # 起因：decisions/prometheus-series-reduction.md 砍掉的 104,509 条 series 全靠
        # values 里两个 job 的 metricRelabelings 撑着，而那份配置有**两种静默回退**的方式：
        #   ① 升 kube-prometheus-stack 时 chart 默认 metricRelabelings 变了而我们没跟；
        #   ② YAML 的 list 是整体覆盖 —— 谁改这两个 key 时漏抄 chart 默认值，drop 就少一条。
        # 两者都**不报错、不改变任何服务行为**，只是 series 悄悄涨回去，直到 Prometheus
        # 撞 3Gi limit 才以 OOM 的形式暴露。那份 ADR 的「复核触发条件」此前只靠人记得，
        # 这条把它机械化。
        #
        # 阈值 180k 的双向校准（2026-08-20 拉 48h 实测，step 5m/15m 两档）：
        #   · 砍完后稳态 109k–114k；pod 换代时新旧序列并存于 head 造成瞬时峰 120.7k
        #     （即观测到的最大噪声 +11k，compaction 后回落）
        #   · 砍之前稳态 218k–222k，峰 243k
        #   180k 落在两者中间：真回退必触（离 pre-fix 下沿仍有 38k 余量），
        #   正常波动够不着（离观测到的最高噪声还有 60k）。改阈值请照同样方式两向复验。
        #
        # ⚠️ 这个数是**整个 head**，含 oracle 经 remote-write 写进来的部分（实测
        #   cluster=homelab 94.8k + cluster=oracle-k3s 21.2k）。它对应的正是本机
        #   Prometheus 的内存压力，所以就该取全量，**不要按 cluster 拆**。序列上的
        #   cluster=homelab 只表示"谁报的这个指标"，不是成员关系
        #   （同类误读见 reference/observability-multicluster.md 的 Cluster Label Strategy）。
        # ⚠️ 必须 `max by (cluster)` 折叠 instance：Prometheus 换 pod IP 后 `instance` 变、
        #   `pod` 名不变，裸查会同时看到新旧两条（实测 3 天内 3 个 instance 共存于回看窗），
        #   对裸指标做 min/avg 会读到已消失副本的陈旧值。
        # for: 2h —— 越过 head compaction 周期（~2h）与重启后 head 重新填满的爬升期；
        #   陈旧 instance 副本 5m 后失效，更够不到这里。
        - alert: PrometheusHeadSeriesHigh
          expr: |
            max by (cluster) (prometheus_tsdb_head_series{job="kube-prometheus-stack-prometheus"}) > 180000
          for: 2h
          labels:
            severity: warning
            component: observability
          annotations:
            summary: "Prometheus active series {{ $value | humanize }}（>180k 持续 2h）——指标裁剪可能已静默回退"
            description: |
              active series 已连续 2 小时高于 180k。砍 series 前的稳态正是 218k–222k，
              **首先怀疑 decisions/prometheus-series-reduction.md 的裁剪被回退了**
              （升 chart 后默认 metricRelabelings 变了，或改 values 时漏抄 chart 默认值 —
              两者都不报错）。
              ① 先看谁在涨。用 TSDB 内置统计，**零成本**；不要用
              `topk(20, count by (__name__)({__name__=~".+"}))`，那是全 head 扫描：
                `curl -s http://100.94.186.7:31090/api/v1/status/tsdb | jq '.data.seriesCountByMetricName[:10], .data.seriesCountByLabelValuePair[:10]'`
              ② 若榜首重新出现 kubelet 侧的 apiserver_*/etcd_* 副本，就是裁剪没生效。
              核对 k8s/helm/values/kube-prometheus-stack.yaml 的 kubelet / kubeApiServer
              两处 metricRelabelings，并照 ADR 的③在**抓取层**验证（不是看配置文件）：
                `sum by (job) (scrape_samples_post_metric_relabeling{job=~"kubelet|apiserver"})`
                基线 kubelet ≈18.2k / apiserver ≈27.3k；回退的表现是 kubelet 涨回 92.7k。
              ③ 确认是真实增长而非回退时，内存影响参照：234k series 时 7d 峰值
              2,715Mi / 3Gi（88%）。此时该继续按 ADR 的三层判据砍，**不是抬 limit** ——
              节点物理内存已见底。
