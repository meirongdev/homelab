---
# Supplementary PrometheusRules for homelab-specific alerts.
# kube-prometheus-stack ships 150+ default alerts; these cover gaps:
#   - Cold-backup target 106 (restic 夜备 + vzdump 周备的目标机)
#   - Vault sealed state (blocks ESO → blocks secret sync → cascades)
#   - Backup CronJobs not running on schedule
# Label release=kube-prometheus-stack required for Prometheus Operator to pick up.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-infrastructure
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: storage-nodes
      rules:
        # 2026-07-11 起 106 降级为纯冷备份目标（restic 夜备 + vzdump 周备），
        # 无运行时依赖（NFS PVC 已全部迁 local-path）——宕机不影响在线服务，
        # 只影响备份窗口，故 warning + for 15m（原 NFSStorageNodeDown critical/2m）。
        - alert: BackupTargetNodeDown
          expr: up{job="node-exporter-metal-nodes", instance="192.168.50.106:9100"} == 0
          for: 15m
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "Backup target 192.168.50.106 is unreachable"
            description: |
              node-exporter on storage-node-1 (192.168.50.106) has been down for more than 15 minutes.
              该机仅作冷备份目标：homelab/oracle restic 夜备与 pve vzdump 周备会失败，在线服务不受影响。
              Check: `ping 192.168.50.106` from k8s-node, then SSH and ZFS pool on the storage host.

        - alert: ProxmoxHostDown
          expr: up{job="node-exporter-metal-nodes", instance="192.168.50.4:9100"} == 0
          for: 2m
          labels:
            severity: critical
            component: infrastructure
          annotations:
            summary: "Proxmox host 192.168.50.4 is unreachable"
            description: |
              The Proxmox host hosting the homelab K3s VM has been down for 2+ minutes.
              The entire homelab cluster may be inaccessible.
        # zpool/SMART health alerts live in storage-alerts.yaml (storage-health-alerts):
        # SmartHealthFailed / ZpoolNotOnline / media-error, NVMe-wear and scrub-overdue
        # rules against the metric names the exporters actually emit
        # (smartctl_device_smart_status, node_zfs_zpool_state). A 2026-07-19 attempt to
        # re-add them here used non-existent names (node_zfs_zpool_healthy,
        # smartctl_device_smart_healthy — both return empty) and was removed.

    - name: vault
      rules:
        - alert: VaultSealed
          expr: vault_core_unsealed == 0
          for: 1m
          labels:
            severity: critical
            component: vault
          annotations:
            summary: "Vault is sealed — ESO cannot sync secrets"
            description: |
              Vault has been sealed for 1+ minute. All ExternalSecrets will fail until unsealed.
              Run: `just vault-unseal` (from k8s/helm/) or `kubectl exec -n vault vault-0 -- vault operator unseal <key>`

        - alert: VaultUnreachable
          expr: up{job=~".*vault.*"} == 0
          for: 5m
          labels:
            severity: warning
            component: vault
          annotations:
            summary: "Vault is unreachable from Prometheus"
            description: "Prometheus has been unable to scrape Vault for 5+ minutes."

    - name: backups
      rules:
        - alert: BackupNotRunning
          expr: |
            (time() - kube_cronjob_status_last_schedule_time{cronjob=~".*backup.*"}) > 32 * 3600
          for: 1h
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "Backup CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not run in 32h"
            description: |
              Expected daily restic backups (homelab 03:00 / oracle 03:30, Asia/Shanghai). If this fires,
              the scheduler missed runs or the CronJob is suspended. Check: `kubectl get cronjob -A` and
              recent Job status.

        - alert: BackupJobFailed
          expr: kube_job_failed{job_name=~".*backup.*"} > 0
          for: 5m
          labels:
            severity: warning
            component: backup
          annotations:
            summary: "Backup Job {{ $labels.job_name }} failed"
            description: "Inspect pod logs: `kubectl logs -n {{ $labels.namespace }} job/{{ $labels.job_name }}`"

    - name: workloads
      rules:
        - alert: PodStuckInUnknown
          expr: kube_pod_status_phase{phase="Unknown"} == 1
          for: 10m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in Unknown state for 10m"
            description: |
              Kubelet lost contact with the pod. Usually resolves on its own; if persistent, delete the pod
              so the controller recreates it.

        - alert: PVCPendingTooLong
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} stuck Pending"
            description: "Storage class may be misconfigured or backing storage is unreachable."

        # 2026-08-02 加：容器撞到**自身 memory limit** 被内核杀掉（exitCode 137）
        # 此前是完全的盲区——chart 自带的 KubePodCrashLooping 抓不到，因为 OOM 后
        # 容器干净重启、从不进 CrashLoopBackOff。argocd-application-controller 就这么
        # 静默 OOM 了（2026-08-02 10:01:47Z），是人工翻 lastState 才发现的。
        # 用 increase() 而非 ==1：last_terminated_reason 会一直停在 OOMKilled，
        # 直接等值判断会让告警永久挂着；这里只在**新发生**时触发。
        - alert: ContainerOOMKilled
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 0
              and on (cluster, namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} [{{ $labels.container }}] 被 OOMKilled（{{ $labels.cluster }}）"
            description: |
              容器撞到自身 memory limit 被杀（exitCode 137），已重启。不影响邻居 pod，
              但会中断该容器的服务，且**不会**触发 KubePodCrashLooping。
              先看 7d 曲线形状再动手：稳定爬升=泄漏（查代码），基线震荡+偶发尖峰=头寸不够（抬 limit）。
              Check: `kubectl --context k3s-homelab -n {{ $labels.namespace }} describe pod {{ $labels.pod }}`
              逼近 limit 的容器排名与判读见 docs/reference/k8s-qos-resource-management.md「检测 OOMKill」。

        # 2026-08-10 加：上面那条的**交叉验证**，只在 homelab 有数据。
        # 动机：30d 窗口内两集群的 last_terminated_reason 只出现过 Unknown/Error/Completed，
        # **从没有过 OOMKilled 样本**，所以上面那条的 reason 标签值拼写至今未经实测证实
        # （依据是 kubelet 透传、kube-state-metrics 原样导出）。本条走 cAdvisor 计数器，
        # 不依赖任何标签值。若某次本条响了而 ContainerOOMKilled 没响，就是那条的
        # 标签值写错了 —— 查实际值：
        #   count by (cluster,reason) (kube_pod_container_status_last_terminated_reason == 1)
        # ⚠️ 覆盖面注意：**没有独立部署 cAdvisor**——container_* 全部来自 kubelet 内嵌
        #    cAdvisor。homelab 经 kube-prometheus-stack 全量入库；oracle 的 otel-collector
        #    `prometheus/cadvisor` receiver 的 keep 正则只保留
        #    `container_(cpu_usage_seconds_total|memory_working_set_bytes)` 两个指标（为 KRR），
        #    所以 container_oom_events_total（homelab 116 条 / oracle 0 条）与
        #    container_cpu_cfs_throttled_*（homelab 41 条 / oracle 0 条）在 oracle 侧
        #    不进入中枢 Prometheus。对 oracle 跑这类查询返回**空结果**，与「值为 0」
        #    外观完全一致 —— 2026-08-10 据此误判过一次「oracle 无 CPU 节流」。
        - alert: ContainerOOMKilledCadvisor
          expr: increase(container_oom_events_total{container!=""}[15m]) > 0
          for: 0m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} [{{ $labels.container }}] 发生 OOM 事件（cAdvisor 口径，{{ $labels.cluster }}）"
            description: |
              cAdvisor 计数器口径，仅 homelab 有数据。与 ContainerOOMKilled 互为验证：
              本条响而那条没响 = 那条的 reason 标签值写错了，按本文件注释排查。

        # 2026-08-10 加：**事前**预警。上面两条都是事后的——容器已经被杀了才响。
        # 本条是这一层唯一能提前动手的信号，判据取自
        # docs/reference/k8s-qos-resource-management.md 的「>80% 就该抬 limit 或查泄漏」，
        # 阈值放到 85% 以降噪。
        # ⚠️ 两侧都必须先 max by(...) 聚合掉 id/image/job 等多余标签，否则直接除会报
        #    "many-to-one matching must be explicit"；分组键必须带 cluster，
        #    否则两集群同名 ns/pod 会串味。
        # ⚠️ 用 max_over_time 而非瞬时值：尖峰型负载看瞬时会整个漏掉——
        #    argocd-application-controller 2026-08-02 被杀时瞬时读数只有 0.67G，
        #    2d 窗口才照出 94%。
        # ⚠️ 2026-08-11 修**除数带 pod 造成的 CronJob 假阳性**：原式两侧都按
        #    (cluster,namespace,pod,container) join。CronJob 每晚换新 pod，改 limit 只
        #    影响新 pod，**旧 pod 的 spec 不可变**，于是老 limit 继续参与计算，直到
        #    successfulJobsHistoryLimit 把它挤掉。实例：backup 的 768Mi 已于 08-10 生效
        #    （新 pod 峰值 148Mi=19%），告警却仍按 08-09 那个 512Mi 的残留 pod 报
        #    90.03%，且会持续 2~3 晚。**每次给 CronJob 抬 limit 都会复现**，不是偶然。
        #    改法：分子保持 pod 粒度（排障要知道是哪个 pod 峰值最高），分母降到
        #    (cluster,namespace,container) 取 max = 该工作负载**当前**的 limit，
        #    用 group_left 做多对一。于是「历史峰值 vs 现行 limit」，语义才是对的。
        #    ⚠️ 反向代价：limit **调小**时会对着旧的大 limit 比，短暂漏报（Deployment
        #       滚完即恢复，CronJob 最多 3 晚）。抬 limit 远比压 limit 常见，认这个取舍。
        #    ⚠️ 别改回按 pod join 来「修」漏报——那样 CronJob 假阳性立刻回来。
        #    验证过：改前命中 repo-server 93.29% + backup 90.03%（后者是假的）；
        #    改后只剩 repo-server 93.29%，356 条 series 无 many-to-many 报错。
        - alert: ContainerMemoryNearLimit
          expr: |
            max by (cluster, namespace, pod, container) (
              max_over_time(container_memory_working_set_bytes{container!=""}[7d])
            )
            / on (cluster, namespace, container) group_left
            max by (cluster, namespace, container) (
              kube_pod_container_resource_limits{resource="memory"}
            ) > 0.85
          for: 30m
          labels:
            severity: warning
            component: workload
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} 的 7d 内存峰值已达 limit 的 {{ $value | humanizePercentage }}（{{ $labels.cluster }}）"
            description: |
              一次尖峰就会 OOMKill，而 OOM 后干净重启、无人察觉。现在抬 limit 还来得及。
              ⚠️ 控制面组件（ArgoCD / Kyverno / trivy / opencost）的峰值随**被管对象规模**
              增长而非流量增长——每次新增大 CRD 的 App 或扩容之后要回头复查这条。

        - alert: CloudflaredAllReplicasDown
          expr: kube_deployment_status_replicas_available{deployment="cloudflared"} == 0
          for: 2m
          labels:
            severity: critical
            component: ingress
          annotations:
            summary: "All cloudflared replicas are down — external ingress is broken"
            description: |
              No cloudflared replicas are available. All `*.meirong.dev` services are inaccessible
              from the internet.

    - name: kubelet
      rules:
        # chart 自带的 KubeletDown 已在 values 里 disabled（见 kube-prometheus-stack.yaml
        # 的 defaultRules.disabled 注释）：它按 cluster 维度做 unless，而 oracle-k3s 上报
        # kube_node_info 却**故意只抓 kubelet 的 cadvisor 端点**（job=kubelet-cadvisor），
        # 永不存在 job="kubelet" → unless 恒成立 → 自 2026-08-02 起永久误报 critical。
        # 这里保留 homelab 侧的真实检测能力，写法与 eso-alerts / external-dns-alerts
        # 的 absent 类告警一致：显式锁 cluster="homelab"。
        # ⚠️ 若将来 oracle 也开始抓 kubelet /metrics，把这里改回按 cluster 聚合即可。
        - alert: KubeletDown
          expr: |
            count by (cluster) (kube_node_info{job="kube-state-metrics", cluster="homelab"})
              unless on (cluster)
            count by (cluster) (up{job="kubelet", metrics_path="/metrics", cluster="homelab"} == 1)
          for: 15m
          labels:
            severity: critical
            component: kubernetes
          annotations:
            summary: "homelab kubelet 已从 Prometheus 目标发现中消失"
            description: |
              homelab 集群不再有健康的 job="kubelet" 抓取目标（持续 15 分钟以上），
              但 kube-state-metrics 仍能看到节点对象。节点级指标（cadvisor/资源用量）
              会同时失效，多数依赖 kubelet 指标的告警将静默失效。
              Check: `kubectl --context k3s-homelab get --raw /api/v1/nodes/k8s-node/proxy/metrics | head`
              以及 ServiceMonitor kube-prometheus-stack-kubelet 是否仍存在。
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeletdown

    # 2026-08-02 加：kube-prometheus-stack 的 node-exporter mixin 规则
    # （NodeMemoryHighUtilization / NodeFilesystemAlmostOutOfSpace / CPU 那组）
    # 全部硬编码 job="node-exporter"，**只覆盖两个 K3s 节点**。裸机与外部主机跑在
    # node-exporter-metal-nodes / -dgx-spark / -macbook 下，一条都不匹配 →
    # 在此之前，承载整个 homelab 集群的 hypervisor 连内存/磁盘告警都没有。
    #
    # 刻意**不**统一放宽成 job=~"node-exporter.*"：几台机的正常态差别太大，
    # 一个阈值必然要么误报要么漏报，所以按主机分开定（阈值取自 2026-08-02 实测）。
    # ⚠️ 采集能力不齐，写新规则前先确认指标存在：
    #    - DGX ×2 **没有** node_filesystem_*（容器化 node_exporter 未挂宿主根）→ 磁盘只能靠 SMART
    #    - macbook **没有** node_memory_MemAvailable_bytes（darwin 无此指标）
    #    - pve 的 ZFS ARC 实测约等于 0（arc_size≈0），低 MemAvailable 是**虚拟机占用**，
    #      不是可回收缓存；106 反过来，ARC 3.8G 必须加回来才是真可用量
    - name: metal-nodes-resources
      rules:
        - alert: MetalNodeFilesystemLow
          expr: |
            100 * node_filesystem_avail_bytes{job="node-exporter-metal-nodes", fstype=~"ext4|xfs|zfs|btrfs"}
              / node_filesystem_size_bytes{job="node-exporter-metal-nodes", fstype=~"ext4|xfs|zfs|btrfs"} < 15
          for: 30m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "{{ $labels.nodename }} 的 {{ $labels.mountpoint }} 剩余空间 < 15%"
            description: |
              裸机主机文件系统吃紧（当前 {{ $value | printf "%.1f" }}% 可用）。
              注意 106 的 /storage/restic 是 restic 仓库——填满会让**双集群夜备同时失败**。
              Check: `ssh root@192.168.50.106 'zfs list -o name,used,avail'`（pve 换 192.168.50.4 + `df -h`）。
              2026-08-02 基线：pve / = 79% 可用，106 /storage = 92%，106 /storage/restic = 51%。

        - alert: MetalNodeFilesystemCritical
          expr: |
            100 * node_filesystem_avail_bytes{job="node-exporter-metal-nodes", fstype=~"ext4|xfs|zfs|btrfs"}
              / node_filesystem_size_bytes{job="node-exporter-metal-nodes", fstype=~"ext4|xfs|zfs|btrfs"} < 8
          for: 15m
          labels:
            severity: critical
            component: infrastructure
          annotations:
            summary: "{{ $labels.nodename }} 的 {{ $labels.mountpoint }} 剩余空间 < 8%"
            description: |
              即将写满（当前 {{ $value | printf "%.1f" }}%）。ZFS 写满会让整个池转只读，
              备份与 vzdump 一起失效。立即清理或扩容。

        # pve：ARC≈0，低 MemAvailable 是 VM 分配的稳态，不是故障——用**绝对下限**而非百分比，
        # 否则永久误报。2026-08-02 实测 676Mi，7d 最低 522Mi，且已在用 1.07G swap。
        # 300Mi 触发说明比稳态又恶化了一截（多半是新开 VM 或宿主进程泄漏）。
        - alert: ProxmoxHostMemoryLow
          expr: node_memory_MemAvailable_bytes{job="node-exporter-metal-nodes", instance="192.168.50.4:9100"} < 300 * 1024 * 1024
          for: 30m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "Proxmox 宿主 pve 可用内存 < 300Mi"
            description: |
              pve 承载整个 homelab K3s VM（12.6GiB）。可用内存跌破稳态基线，
              继续恶化会触发宿主 OOM killer——被杀的可能就是 K3s VM 本身。
              Check: `ssh root@192.168.50.4 'free -h; qm list'`，看是否有新 VM/进程占用。

        # 106：ARC 是可回收缓存，必须加回来（减 arc_c_min 是 ARC 不会缩到的那部分）。
        # 2026-08-02 实测真可用 4.98G/7.57G ≈ 66%，10% 阈值有充分余量。
        - alert: StorageNodeMemoryLow
          expr: |
            100 * (
              node_memory_MemAvailable_bytes{job="node-exporter-metal-nodes", instance="192.168.50.106:9100"}
                + node_zfs_arc_size - node_zfs_arc_c_min
            ) / node_memory_MemTotal_bytes{job="node-exporter-metal-nodes", instance="192.168.50.106:9100"} < 10
          for: 30m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "storage-106 真实可用内存 < 10%（已计入可回收 ZFS ARC）"
            description: |
              该表达式已把 ARC 当可回收算回去，所以触发意味着**真的**没内存了，
              不是 ARC 占着。106 内存不足会拖慢 restic 夜备与 ZFS。
              Check: `ssh root@192.168.50.106 'free -h; arc_summary | head -30'`。

        # ☠️ 2026-08-09：删掉 `DgxSparkMemoryLow`（MemAvailable < 4GiB / for 30m）。
        # 它 7 天烧了约 10 个窗口（3h~30h 不等），是当期最大的单一噪声源，而**它警示的
        # 危害一次都没发生**。7 天实测：
        #   MemAvailable 低于 4GiB 的采样占比：.120 = 48%、.92 = 32%
        #     （.120 min 0.8G / p25 1.6G / p50 7.3G；.92 min 1.8G / p25 2.6G / p50 9.8G）
        #   同期 node_vmstat_oom_kill 增量 = **0**
        #   同期 PSI 内存停顿 rate(node_pressure_memory_waiting_seconds_total[5m])
        #     p99 = 0.0000、max = 0.0010（即最坏时刻也只有 0.1% 的时间在等内存）
        # 结论：阈值压在正常工作带正中间。GB10 是 **128GB 统一内存**，模型常驻会把
        # MemAvailable 长期压低，但那既不产生内存压力也不触发 OOM ——
        # 在这台机器上 MemAvailable **对"会不会 OOM"没有预测力**，再怎么调低阈值
        # 都只是在挑一个不那么频繁的误报点。
        # ⚠️ 原注释「2026-08-02 实测 9.9G/11.2G，4GiB 有余量」是**单点采样**：
        # 它取到的是 p50 附近的一个瞬时值，看不见 p25 已经到 1.6G。
        # 定阈值要看分布，别看一次 `free -h`。
        #
        # 换成两条**有预测力**的规则，阈值同样由上面那份 7 天实测反推：
        - alert: DgxSparkMemoryPressure
          # 领先指标：任务真的在等内存。观测到的最大值是 0.0010，取 0.10 =
          # 高出实测天花板 100 倍 → 正常态绝不触发，触发即真有内存瓶颈。
          expr: rate(node_pressure_memory_waiting_seconds_total{job="node-exporter-dgx-spark"}[5m]) > 0.10
          for: 15m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "{{ $labels.nodename }} 内存压力持续 >10%（PSI stall）"
            description: |
              DGX Spark（GB10，128GB 统一内存）任务在等内存，推理吞吐会掉。
              ⚠️ 别再看 `MemAvailable` 判断（模型常驻使其长期低位，与压力无关），
              看 PSI：`ssh <dgx> 'cat /proc/pressure/memory'`。
              Check: `ssh <dgx> 'free -h; nvidia-smi'`，看是否有该卸载的模型常驻。
        - alert: DgxSparkOOMKill
          # 确定性指标：真的被杀了。0 容忍——7 天基线就是 0。
          expr: increase(node_vmstat_oom_kill{job="node-exporter-dgx-spark"}[1h]) > 0
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "{{ $labels.nodename }} 发生 OOM kill"
            description: |
              过去 1 小时内核 OOM killer 杀掉了进程（7 天基线为 0，任何一次都是异常）。
              Check: `ssh <dgx> 'dmesg -T | grep -i "killed process" | tail'`。
              ⚠️ DGX 没有 node_filesystem_* 指标（容器化 node_exporter 未挂宿主根），磁盘只能看 SMART。

        # ☠️ 覆盖盲区（2026-08-09 补）：**两个集群在 08-08 各重启过一次，告警一声没吭**。
        #   oracle-k3s  boot 08-08 23:57 (+08)  —— zitadel/zitadel-pg 同秒 exit=255
        #                                          reason=Unknown，uptime-kuma/cloudflared 连带重启
        #   homelab     boot 08-08 15:01 (+08)
        # 而 `last -x` 显示 oracle **5 天重启 5 次**，其中 08-06 04:39、08-08 09:32、
        # 08-08 23:58 三次**没有对应的 shutdown 记录 = 非正常关机**（只有 08-05 20:39
        # 那次是干净的，对应已知的 shape 缩容）。
        # 为什么以前看不见：节点回来得快，KubeletDown/TargetDown 要么没到 for 时长，
        # 要么（oracle 的 KubeletDown）本来就被路由到 null 丢弃了 —— 于是"机器重启过"
        # 这件事**原理上没有任何一条规则在看**。重启会重置一切内存态（连带把
        # AlertmanagerFailedToSendAlerts 那串误报也一起制造出来），必须显式盯。
        #
        # ⚠️ 这里用统一的 `job=~...` 是**故意的**，与本文件上方"刻意不统一放宽 job"
        # 那条注释不冲突：那条讲的是**内存阈值**，几台机的正常态差别太大；
        # 而"开机时长"没有这种个体差异，重启就是重启。
        # 覆盖六台：两个 k3s 节点（job=node-exporter，homelab 与 oracle 共用此 job 名）
        # + pve/106（node-exporter-metal-nodes）+ 两台 DGX。
        # ⚠️ DGX **本来想排除**（"按需开关机的工作站"），2026-08-09 查完推翻了这个假设：
        # dgx-spark-2 七天缺席 56.3h 看着像关机，但登上去 `last -x` 显示它
        # **从 Jun 4 连续运行到 Aug 7 从没关过**。那 48h 是**网络断了**——
        # 断线期间 tailscaled 记的是 `netcheck: UDP is blocked` +
        # `report: udp=false v4=false icmpv4=false derp=0` +
        # `derp-20(hkg): network is unreachable`，即该站点整条出网路径不可达。
        # 所以两台 DGX 也是"应当长期在线"的（历史 uptime 60+ 天），纳入覆盖。
        # 它们 08-07 那串重启是**内核升级链**（6.11.0-1014 → 6.17.0-1014 → 6.17.0-1029，
        # 每次都有干净的 shutdown 记录），这种事值得在 Telegram 留一行。
        # macbook 仍排除：它是真正按需开合盖的笔记本。
        # 📌 dgx-spark-2 的登录方式是 `ssh -i ~/.ssh/vgio admin@100.67.164.92`
        # （用户名 **admin**，不是 ubuntu/matthew；它在另一个 tailnet
        # `kaixinhuang3307@gmail.com` / tailf63175.ts.net 下）。
        - alert: NodeRebooted
          # 窗口取 30m 而非更短：oracle 的指标要经 otel-collector 重新起来才 remote-write，
          # 开机头几分钟可能没有样本，窗口太窄会整个错过。
          expr: (time() - node_boot_time_seconds{job=~"node-exporter|node-exporter-metal-nodes|node-exporter-dgx-spark"}) < 1800
          for: 5m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "{{ $labels.cluster }} / {{ $labels.instance }} 刚重启（开机不足 30 分钟）"
            description: |
              节点重启了。若非你主动操作，就是**非正常关机**，需要查原因。
              ⚠️ oracle 的 journald 是 volatile（`#Storage=auto` 且 `/var/log/journal`
              不存在）→ **上一次启动的日志在重启时就没了**，事后无法复盘。
              要查崩溃原因得先让日志活过重启：`sudo mkdir -p /var/log/journal &&
              sudo systemd-tmpfiles --create --prefix /var/log/journal &&
              sudo systemctl restart systemd-journald`，之后 `journalctl -b -1` 才有内容。
              重启后按 runbook 核不变量：`cd cloud/oracle && just verify-node`（只读）。

    - name: multicluster-telemetry
      rules:
        - alert: OracleTelemetryAbsent
          expr: absent(up{cluster="oracle-k3s"}) == 1
          for: 15m
          labels:
            severity: critical
            component: observability
          annotations:
            summary: "oracle-k3s telemetry stopped arriving at homelab Prometheus"
            description: |
              No metrics with cluster=oracle-k3s for 15+ minutes. The OTel push path from oracle
              (prometheusremotewrite → 100.94.186.7:31090; logs 31080 and traces 31317 likely
              share the fate) is broken — oracle data is being dropped, not queued.
              Check: `kubectl --context k3s-homelab get svc -n monitoring | grep external`
              (NodePort svcs from monitoring-external.yaml), then Tailscale reachability.
              Bit us 2026-07-07: monitoring-external.yaml fell out of every App's include glob
              and ArgoCD pruned the NodePort services — silent telemetry blackout for ~1 day.
