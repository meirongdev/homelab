apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-health-alerts
  namespace: monitoring
  labels:
    # 必须带此 label 才会被 kube-prometheus-stack operator 的 ruleSelector 选中
    release: kube-prometheus-stack
spec:
  groups:
    - name: smart-disk-health
      rules:
        # SMART 整体健康失败（device_smart_status: 1=passed, 0=failed）
        - alert: SmartHealthFailed
          expr: smartctl_device_smart_status == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SMART 整体健康失败: {{ $labels.device }} @ {{ $labels.nodename }}"
            description: "smartctl_device_smart_status=0（磁盘自检报告失败）—— 尽快更换。instance={{ $labels.instance }}"
        # 介质错误（坏块）出现
        - alert: SmartMediaErrors
          expr: smartctl_device_media_errors > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SMART 介质错误: {{ $labels.device }} @ {{ $labels.nodename }}"
            description: "smartctl_device_media_errors={{ $value }} —— 磁盘出现坏块/介质错误，关注趋势。"
        # NVMe 寿命接近耗尽（percentage_used 越接近 100 越坏）
        - alert: NvmeWearHigh
          expr: smartctl_device_percentage_used > 90
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "NVMe 寿命告急: {{ $labels.device }} @ {{ $labels.nodename }}"
            description: "percentage_used={{ $value }}%（>90% 表示写入寿命接近耗尽）—— 计划更换。"
        # NVMe 可用备用块偏低
        - alert: NvmeSpareLow
          expr: smartctl_device_available_spare < 10 and smartctl_device_available_spare > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "NVMe 备用块偏低: {{ $labels.device }} @ {{ $labels.nodename }}"
            description: "available_spare={{ $value }}%（<10%）—— 备用块耗尽前更换。"
    - name: zfs-pool-health
      rules:
        # zpool 非 online（degraded/faulted/unavail/…）。node_zfs_zpool_state{state="online"}=0 即异常
        - alert: ZpoolNotOnline
          expr: node_zfs_zpool_state{state="online"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "ZFS 池非 ONLINE: {{ $labels.zpool }} @ {{ $labels.instance }}"
            description: "node_zfs_zpool_state{state=online}=0 —— 池处于 degraded/faulted 等状态。raidz1 仅容 1 盘，resilver 期第二盘故障会毁池；离站备份是最终安全网（见 backup-recovery runbook）。"

    - name: nvme-wear-trend
      # ⚠️ interval 必须显式设置（2026-08-02）：本组原先跟随全局 30s 评估间隔，实测单轮
      #    耗时 120s——超间隔 4 倍，是拖垮 Prometheus 的第三大消费者（前两名是已关掉的
      #    kube-apiserver-{burnrate,availability}.rules）。NVMe 磨损以"月"为尺度变化，
      #    每 30s 重算一次纯属浪费；1h 已远超需求精度，成本降到原先的 1/120。
      interval: 1h
      rules:
        # ⚠️ 窗口必须 ≤ retention（当前 7d，见 values/kube-prometheus-stack.yaml）。
        #    原先写的是 [14d] / [30d]：超出保留期的部分并不会报错，而是**静默截断**成
        #    实际可用的 ~7d 数据——既拿不到宣称的 14/30 天趋势（结果与注释不符），
        #    又要让每次评估全量扫穿整个 TSDB。改为 6d 留 1d 余量，避免边界抖动。
        # 每日磨损增量（percentage_used/天）。低写入负载下可能为 0。
        - record: nvme_wear_daily_rate
          expr: clamp_min(deriv(smartctl_device_percentage_used[6d]) * 86400, 0)
        # 基于 6 天线性趋势预测 90 天后的 percentage_used。
        # 6d→90d 是 15 倍外推，只当早期预警用；静态阈值 NvmeWearHigh(>90%) 才是最终确认。
        - record: nvme_predicted_wear_90d
          expr: predict_linear(smartctl_device_percentage_used[6d], 90 * 86400)
        # 趋势报警：90 天内预测 wear > 85%（写入加速时比静态阈值 NvmeWearHigh 更早预警）
        - alert: NvmeWearAccelerating
          expr: predict_linear(smartctl_device_percentage_used[6d], 90 * 86400) > 85
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} @ {{ $labels.nodename }} 磨损加速，90 天预测 >85%"
            description: |
              基于 6 天线性趋势（受 Prometheus retention=7d 限制），预测 90 天后 percentage_used ≈ {{ $value | humanize }}%。
              当前磨损值与日增速率见 smartctl_device_percentage_used / nvme_wear_daily_rate。
              如写入量持续，需计划换盘；NvmeWearHigh（静态 >90%）为最终确认。

    - name: zfs-scrub-overdue
      # ☠️ 2026-08-30 修：本组的三条表达式此前全部引用
      #    `node_zfs_zpool_scrub_last_scrub_timestamp_seconds` —— **这个指标从来不存在**。
      #    node_exporter 的 zfs collector 只导出 node_zfs_zpool_state 与一堆
      #    node_zfs_zpool_dataset_*（当天实测枚举过整族），没有任何 scrub 时间戳。
      #    于是记录规则恒为空、告警恒不触发，外观与「scrub 很及时」完全一致，
      #    自上线起没有可能响过。同月同形状的第四次（另三次：ContainerMemoryNearLimit
      #    的分子、TrivyExposedSecretFound 的指标名、Vault 从未采集）。
      #    现由 106 上的 textfile collector 提供，装置见
      #    proxmox/ansible/playbooks/node-exporter-deploy.yaml 的「zpool scrub 时间戳采集器」。
      # ⚠️ 指标名刻意不带 node_zfs_ 前缀：那是 node_exporter 自己的命名空间，
      #    混进去会让下一个人以为是官方 collector 提供的（同 tailscale_iprule_* 的取向）。
      rules:
        # 记录距离上次 scrub 的天数，供看板和告警使用
        - record: zpool_scrub_age_days
          expr: (time() - zpool_scrub_last_end_timestamp_seconds) / 86400
        # zpool 超过 35 天未 scrub（正常每月一次，35 天阈值留了 3-5 天余量）
        - alert: ZpoolScrubOverdue
          expr: (time() - zpool_scrub_last_end_timestamp_seconds) / 86400 > 35
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "ZFS 池 {{ $labels.zpool }} 已 {{ $value | humanize }} 天未 scrub @ {{ $labels.instance }}"
            description: |
              上次 scrub 距今 >35 天。先查排程是否还在：
                `systemctl list-timers 'zfs-scrub-*'`（⚠️ 别 grep scrub 就完事 ——
                 e2scrub_all / xfs_scrub_all 是 ext4/xfs 的，**与 ZFS 无关**，
                 2026-08-30 就差点因此误判成"排程还在"）。
              没有就 `systemctl enable --now zfs-scrub-monthly@<pool>.timer`，
              或重跑 proxmox/ansible/playbooks/node-exporter-deploy.yaml（已把它纳管）。

        # ☠️ 上面两条的**来源守卫**，同 ContainerMemoryRssAbsent / VaultMetricsAbsent 的口径。
        # 分成两条是因为两种坏法的处置完全不同：
        #   NeverScrubbed  → 池在、采集器也在，但这个池**从来没 scrub 过**（或只跑过
        #                    resilver）。此时上面两条因为分子无 series 而恒不触发 ——
        #                    「从没 scrub 过」反而比「35 天没 scrub」更该报，却更安静。
        #   CollectorFailed→ 采集器本身坏了/没在跑（脚本异常、timer 被停、node_exporter
        #                    的 textfile collector 被摘掉、106 宕机）。
        - alert: ZpoolNeverScrubbed
          expr: zpool_scrub_known == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "ZFS 池 {{ $labels.zpool }} 没有任何已完成的 scrub 记录 @ {{ $labels.instance }}"
            description: |
              采集器拿到了这个池，但读不到「上次 scrub 完成时间」——池从未 scrub 过，
              或只跑过 resilver。ZpoolScrubOverdue 对这种情况**恒不触发**（分子无 series），
              所以由本条覆盖。处置：`zpool scrub <pool>` 跑一次，并确认
              `zfs-scrub-monthly@<pool>.timer` 已 enable。

        - alert: ZpoolScrubCollectorFailed
          expr: zpool_scrub_collector_success == 0 or absent(zpool_scrub_collector_success)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "zpool scrub 采集器未产出数据 —— ZpoolScrubOverdue 正在静默失效"
            description: |
              zpool_scrub_collector_success 为 0 或整个消失，上面两条因此没有判据可用，
              而这与「scrub 一切正常」外观完全一致（这正是本组 2026-08-30 之前的状态）。
              在 106 上依次查：
                `systemctl status zpool-scrub-textfile.timer`
                `/usr/local/sbin/zpool-scrub-textfile; echo $?`（脚本会把失败写成 success 0）
                `cat /var/lib/node_exporter/textfile/zpool_scrub.prom`
                node_exporter 的 ExecStart 是否还带 --collector.textfile
              整个 106 宕机时本条也会响（absent 分支），那种情况另有 BackupTargetNodeDown。
