---
# AlertManager → Telegram 路由(homelab)。
# 2026-07-18: 从 Gotify bridge(druggeri/alertmanager_gotify_bridge)换成 Alertmanager
# 原生 telegramConfigs。原 bridge 有 `concurrent map writes` 崩溃 bug(全局无锁 metrics
# map,两个并发 webhook 即 fatal),且上游无维护、无修复镜像。Telegram 原生投递 = 零中间
# 桥、无并发崩溃、无版本绑定构建。详见 decisions/alerting-telegram-migration.md。
# 投到群 MatthewDaily 的「🚨 Homelab 告警」forum topic(chatID -1003981213530 +
# messageThreadID 2)。bot token: Vault secret/homelab/telegram → ESO
# (k8s/helm/manifests/monitoring/alerts/alertmanager-telegram-secret.yaml)→ k8s Secret
# monitoring/alertmanager-telegram key=bot-token。
# Gotify 本体已于 2026-07 彻底下线(不再是"仍服务 Falco"——Falco 也已迁到原生
# Telegram output,见 falco.yaml + decisions/alerting-telegram-migration.md)。
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: telegram
  namespace: monitoring
  labels:
    alertmanagerConfig: homelab
spec:
  route:
    receiver: telegram
    groupBy: ["alertname", "cluster", "severity"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    # 只接 critical|warning。info 由 InfoInhibitor 抑制,none(Watchdog 等)落回静态 null。
    matchers:
      - name: severity
        matchType: "=~"
        value: "critical|warning"
    routes:
      # KubeletDown on oracle-k3s 是已知误报(外部集群,kubelet 未被直抓)。丢弃。
      - receiver: "null"
        matchers:
          - name: alertname
            value: KubeletDown
          - name: cluster
            value: oracle-k3s
      # ☠️ 死人开关自己的投递失败**不是**"告警链路坏了"(2026-08-09 加)。
      # 2026-08-02~09 七天里这两条烧了 13 次(含 critical 🆘),而同期 Telegram
      # 投递 **186 条 0 失败** —— 报的全是 watchdog webhook:
      #   webhook 216 失败 / 13553 发送 = 1.6%,错误只有两种
      #   `530 error code:1033`(Cloudflare 隧道不可用)与 `503 no healthy upstream`
      #   (oracle 网关后面 uptime-kuma 正在重启)。
      # 即这条心跳 30s 一发、途经 公网→Cloudflare 边缘→隧道→oracle 网关→uptime-kuma,
      # 任一跳抖一下失败率就破 1% 阈值,于是"告警链路坏了"被喊出来 —— 而它恰恰是
      # 唯一健康的那条链路。**语义是反的**。
      #
      # 为什么可以直接丢:死人开关是**自检**的 —— 心跳停 → oracle 的 Uptime Kuma
      # push monitor(60s interval)转 DOWN → 它自己的「Telegram (dead-man)」通知
      # 从 oracle 直连 api.telegram.org 报警,完全不依赖 homelab。
      # 2026-08-09 查库实测过这条兜底是活的:monitor id=1 active=1、
      # push_token=alertmanager-watchdog-homelab、notification 已挂(is_default=1)、
      # 心跳每 45s 一条全 UP。所以 Alertmanager 这侧再喊一遍纯属重复且标签错误。
      #
      # ⚠️ 2026-08-14 修正:上面这个"自检"前提**只覆盖一半的故障**。
      # 它成立的条件是「发送侧或链路坏、**接收侧活着**」。当接收侧自己也没了时:
      #   08-13 17:21 UTC oracle 硬重启 → uptime-kuma 一起下线
      #   → monitor id=1 心跳缺口 17:18:26 → 17:28:06(**9分40秒**,interval 才 60s)
      #   → 当天 important 翻转数 = **0**。没转 DOWN、没报警、库里不留痕迹。
      # 原因:push monitor 的检查跑在 uptime-kuma **进程内**,它自己下线就没人做检查;
      # 重启回来后 ~45s 内新推送就到,看上去"一直 UP"。
      # 2026-08-09 那次实测验的是"配置正确 + 正在收心跳",**没有验"制造一个缺口会不会
      # 真的转 DOWN"** —— 配置对 ≠ 机制有效。
      # 本条 null 路由**保持不变**(它针对的抖动噪声判断依然对);
      # 失明窗口另由 prometheus-rules.yaml 的 `DeadMansSwitchReceiverDown` 覆盖
      # (只捞持续 5 分钟以上的全量失败,alertname 不同故不受本路由影响)。
      #
      # ⚠️ 只按 `integration="webhook"` 收窄(告警标签里没有 receiver 名,这已是最细粒度)。
      # 2026-11-06 起有第二个 webhook 接收器:alertmanager-trivy-triage.yaml 的
      # multica-trivy-triage(Stale CVE → Multica autopilot)。它的投递失败也被这条一并静默,
      # 评估后接受,理由与判据写在那个文件头。再加第三个之前先重新评估这条路由。
      # `integration="telegram"` 的失败**不受影响**,照常按 critical/warning 报。
      - receiver: "null"
        matchers:
          - name: alertname
            matchType: "=~"
            value: "AlertmanagerFailedToSendAlerts|AlertmanagerClusterFailedToSendAlerts"
          - name: integration
            value: webhook
      # Trivy Critical CVE(2026-11-06):安全态势告警,不是事故,4h 重发只会把人训练成忽略它。
      # 规则侧按 CVE ID 一条告警(见 trivy-alerts.yaml),组仍按 alertname+cluster 聚:
      # **新 CVE ID 进组 → groupInterval(5m) 内立刻发一条**,组成员不变时才按下面的 repeat。
      #   TrivyCriticalCVE       120h:宽限期内的知会,不催。⚠️ 不能写更长 —— Alertmanager
      #                          的通知日志只留 120h(spec.retention),过期后照样重发,写 7d 是假的。
      #   TrivyCriticalCVEStale  24h:厂商一周没重建,该处置了,每天提醒一次。
      - receiver: telegram
        matchers:
          - name: alertname
            value: TrivyCriticalCVE
        repeatInterval: 120h
      - receiver: telegram
        matchers:
          - name: alertname
            value: TrivyCriticalCVEStale
        repeatInterval: 24h
      # Critical → 更快重复(30m vs 4h)。同一 telegram 接收器,模板按 severity 标记
      # 🆘/⚠️(Telegram 无 Gotify 那种数字优先级,用 emoji + 更快 repeat 区分紧急度)。
      - receiver: telegram
        matchers:
          - name: severity
            value: critical
        groupWait: 10s
        repeatInterval: 30m
  # 同一 CVE 升级成 Stale 后,宽限期那条就别再出现在 TrivyCriticalCVE 的组里。
  # 被抑制只是从组里拿掉、不算 resolved,所以不会因此多发一条消息。
  inhibitRules:
    - sourceMatch:
        - name: alertname
          value: TrivyCriticalCVEStale
      targetMatch:
        - name: alertname
          value: TrivyCriticalCVE
      equal: ["cluster", "vuln_id"]
  receivers:
    - name: "null"
    - name: telegram
      telegramConfigs:
        - botToken:
            name: alertmanager-telegram
            key: bot-token
          # 群组 MatthewDaily(超级群/forum),告警投到「🚨 Homelab 告警」话题(thread 2)。
          # 私聊 chatID(1982853512)已弃用;群 ID 为负 int64。
          chatID: -1003981213530
          messageThreadID: 2
          parseMode: HTML
          sendResolved: true
          # 标题行按状态/严重度标 emoji + 加粗;正文列出各 alert 的 summary/description。
          # ⚠️ parseMode=HTML 对 annotation 正文有**硬约束**:Telegram 只认一个很小的
          # 标签白名单(b/i/u/s/a/code/pre/blockquote/em/strong/del/ins/tg-spoiler),
          # 任何其它 `<xxx>` 都会让 sendMessage 返回 400 `can't parse entities:
          # Unsupported start tag` —— **该条告警就永远发不出去**,而 Alertmanager 侧
          # 只表现为 notifications_failed_total 涨一格,没人会注意。
          # 反引号是 Markdown,在 HTML 模式下**不提供任何保护**,包在里面照样被当标签解析。
          # ✋ 所以 runbook 里的占位符**一律写 `$name`,不要写 `<name>`**。
          # 2026-08-13 修正:此处原注释断言"无 <>& → HTML 安全",但当时 prometheus-rules.yaml
          # 里实际有 4 处 `<...>`(DgxSparkMemoryPressure ×2、DgxSparkOOMKill ×1 的
          # `ssh <dgx>`,以及 **critical 的 VaultSealed** 的 `unseal <key>`)。
          # 它们一直没暴露,只因为这几条恰好都还没真正触发过 —— 属于"首次触发即静默失败"
          # 的埋雷,已全部改成 `$dgx` / `$key`。加新规则时别把这个模式带回来。
          # 注:裸 `&`(如 `a && b`)Telegram 容忍,今天 NodeRebooted 就带 `&&` 正常投递了。
          # 2026-11-06:逐条前缀按各自状态打 ✅/▸。标题按整组状态,组里只要还有一条 firing
          # 就是 WARNING;此前同组里已恢复的那条也印成 ▸,看起来像还在烧。按 CVE ID
          # 拆开的 TrivyCriticalCVE 一组常有多条,修好一个、其余还在是常态,必须分得出来。
          message: |-
            {{ if eq .Status "resolved" }}✅ <b>RESOLVED</b>{{ else if eq .CommonLabels.severity "critical" }}🆘 <b>CRITICAL</b>{{ else }}⚠️ <b>WARNING</b>{{ end }} · <b>{{ .CommonLabels.alertname }}</b>{{ if .CommonLabels.cluster }} @ {{ .CommonLabels.cluster }}{{ end }}
            {{ range .Alerts }}
            {{ if eq .Status "resolved" }}✅{{ else }}▸{{ end }} {{ .Annotations.summary }}{{ if .Annotations.description }}
            {{ .Annotations.description }}{{ end }}
            {{ end }}

---
# Dead-man's switch: routes the Watchdog alert to Uptime Kuma Push monitor on oracle-k3s.
# Homelab Alertmanager fires Watchdog → webhook → status.meirong.dev/api/push/... → Uptime Kuma.
# If homelab goes down, pushes stop → Uptime Kuma marks DOWN → Telegram fires (oracle side).
# See cloud/oracle/manifests/uptime-kuma/provisioner.yaml Push monitor definition.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: watchdog
  namespace: monitoring
  labels:
    alertmanagerConfig: homelab
spec:
  route:
    receiver: watchdog-webhook
    groupWait: 0s
    groupInterval: 15s
    repeatInterval: 30s
    matchers:
      - name: alertname
        value: Watchdog
  receivers:
    - name: watchdog-webhook
      webhookConfigs:
        # Push URL matching the token defined in the provisioner script.
        - url: "https://status.meirong.dev/api/push/alertmanager-watchdog-homelab?status=up&msg=OK&ping="
