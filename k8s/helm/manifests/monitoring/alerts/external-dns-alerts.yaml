---
# external-dns alerting.
#
# Closes the gap generic pod-level rules (KubePodCrashLooping/KubePodNotReady) leave open:
# external-dns can stay Running/Ready while silently failing to reconcile — a revoked or
# expired Cloudflare API token, API rate limiting, or an RBAC break on the HTTPRoute
# source. In that state existing records keep resolving (policy=upsert-only never deletes),
# but every newly-added/changed HTTPRoute never gets its DNS record and nobody is told.
#
# Metrics come from the external-dns controller (/metrics :7979) on BOTH clusters:
#   - homelab:    ServiceMonitor in values/external-dns.yaml (gets cluster=homelab via
#                 the Prometheus scrapeClasses relabel).
#   - oracle-k3s: scraped by its OTel Collector (prometheus/external-dns receiver) and
#                 remote-written with cluster=oracle-k3s.
# **All four rules below cover BOTH clusters** (the meta-failure one since 2026-08-24,
# ROADMAP #7); {{ $labels.cluster }} disambiguates.
# (oracle runs a separate instance, txtOwnerId=oracle-externaldns.)
#
# severity warning → routed by Alertmanager (see values/kube-prometheus-stack.yaml). The
# `release` label is REQUIRED so the kube-prometheus-stack ruleSelector adopts this rule.
#
# Deployed via the ArgoCD `monitoring-dashboards` Application (git push → 3-min sync).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-dns-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: external-dns
      rules:
        # The core blind spot: the controller keeps running but its last SUCCESSFUL sync
        # stops advancing — Cloudflare token expired/revoked, or the API is rate-limiting.
        # Existing records keep resolving, but new/changed HTTPRoutes silently fail to get a
        # DNS record. Healthy reconcile interval is 1m, so >10m stale means it is stuck.
        - alert: ExternalDNSReconcileStalled
          expr: time() - external_dns_controller_last_sync_timestamp_seconds > 600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "external-dns has not completed a successful sync in >10m on {{ $labels.cluster }}"
            description: "external_dns_controller_last_sync_timestamp_seconds has not advanced for >10m though the pod is Running/Ready — usually a revoked/expired Cloudflare API token or API rate limiting. New HTTPRoutes will not get DNS records. Inspect with `kubectl logs -n external-dns deploy/external-dns`."

        # The loop is running but each attempt to apply changes to Cloudflare is erroring
        # (token scope/validity, rate limit, or provider outage).
        - alert: ExternalDNSRegistryErrors
          expr: increase(external_dns_registry_errors_total[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "external-dns registry (Cloudflare) errors on {{ $labels.cluster }}"
            description: "external_dns_registry_errors_total increasing for >15m — external-dns cannot apply changes to Cloudflare (API token scope/validity, rate limiting, or a provider outage)."

        # Errors reading the source (Gateway API HTTPRoutes) — usually an RBAC regression or
        # the Gateway API CRDs / apiserver being unavailable. Desired state is then computed
        # from stale or empty input.
        - alert: ExternalDNSSourceErrors
          expr: increase(external_dns_source_errors_total[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "external-dns source (HTTPRoute) errors on {{ $labels.cluster }}"
            description: "external_dns_source_errors_total increasing for >15m — external-dns cannot read its HTTPRoute source (RBAC or Gateway API availability)."

        # Meta-failure: if external-dns metrics vanish the alerts above CAN'T fire (no data,
        # no alert). 2026-08-24 (ROADMAP #7): rewritten from
        # `absent(...{cluster="homelab"})` to a per-cluster comparison against a reference
        # series, so it covers BOTH clusters and needs no hardcoded cluster list.
        #
        # The old form's stated reason for excluding oracle was "metrics are best-effort via
        # OTel remote-write, so absent() would false-positive on a scrape/remote-write gap".
        # ⚠️ **Measured 2026-08-24 over 6d at 60s resolution, that no longer holds**:
        #   homelab    8641 samples, gaps >2min: **0**
        #   oracle-k3s 8637 samples, gaps >2min: **1, of 3 minutes**
        # A single 3-minute gap is absorbed by `for: 15m` five times over.
        #
        # Why compare against kube_deployment_status_replicas_available instead of absent():
        #   1. absent() can only assert that ONE named labelset is missing, so covering N
        #      clusters means hardcoding N cluster names. This form is self-maintaining —
        #      a third cluster is covered the day it appears.
        #   2. Sharper semantics. It fires only when the deployment IS running but its
        #      metrics are gone = **the telemetry path broke**. "Pod is down" is a different
        #      failure with its own owner (KubePodNotReady / KubePodCrashLooping, which do
        #      cover oracle — its kube-state-metrics arrives with cluster=oracle-k3s).
        #      The old absent() conflated the two.
        # Dependency: this needs kube-state-metrics to arrive. If oracle telemetry dies
        # wholesale the reference series goes too and this rule falls silent — that case is
        # owned by OracleTelemetryAbsent (`absent(up{cluster="oracle-k3s"})`, prometheus-rules.yaml).
        #
        # Validation (all three matter; a rule that never fires is indistinguishable from a
        # broken one until you force it):
        #   · current                          → 0 firing
        #   · metric name swapped for a bogus  → {homelab: 1, oracle-k3s: 1}  ← proves it detects
        #   · 6d replay at 5min step           → never matched (zero false positives)
        - alert: ExternalDNSMetricsAbsent
          expr: |
            count by (cluster) (kube_deployment_status_replicas_available{namespace="external-dns", deployment="external-dns"} > 0)
              unless
            count by (cluster) (external_dns_controller_last_sync_timestamp_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "external-dns metrics absent on {{ $labels.cluster }}"
            description: "external-dns is running on {{ $labels.cluster }} but has produced no external_dns_controller_last_sync_timestamp_seconds series for >15m — the scrape (homelab ServiceMonitor) or the OTel remote-write path (oracle) is broken. This masks every other external-dns alert on that cluster."
