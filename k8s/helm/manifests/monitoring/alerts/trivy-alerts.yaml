---
# Trivy Operator 安全发现告警。
#
# 指标来自 Trivy Operator 控制器（/metrics :8080，operator.metricsFindingsEnabled=true）：
#   - homelab:   ServiceMonitor 由 chart 启用（values/trivy-operator.yaml，带 release 标签）
#   - oracle-k3s: 本集群无 Prometheus Operator（CRD 为 0），由 otel-collector 直抓
#                 trivy-operator:8080 再 remote-write（cloud/oracle/values/trivy-operator.yaml
#                 里 serviceMonitor.enabled=false）
#   **2026-08-03 起双集群覆盖**：下列聚合规则本就写成 `sum by (cluster)`，
#   oracle 指标一到就自动生效，未改任何表达式；只有 MetricsAbsent 这类
#   "序列消失" 的元告警必须按集群各写一条（absent() 对不存在的 label 值无从判断）。
#
# severity warning|critical → 经 Alertmanager 原生 telegramConfigs 路由到 Telegram（见 values/kube-prometheus-stack.yaml）。
# `release: kube-prometheus-stack` 标签必需，否则 ruleSelector 不采纳本 PrometheusRule。
# 经 ArgoCD `monitoring-dashboards` Application 同步（git push → 3 分钟内）。
#
# ⚠️ 指标名核对：首次部署后用 `kubectl -n trivy-system port-forward svc/trivy-operator 8080:8080`
#    curl :8080/metrics 确认下列指标名（不同 chart 版本可能微调，如 exposedsecrets 系列）。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-operator-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: trivy-operator
      rules:
        # ── Critical CVE：按 CVE ID 拆开，先给厂商 7 天宽限（2026-11-06 重写）────────────
        # 取代原来的 `TrivyImageCriticalVulnerabilities`（`sum by (cluster) (...) > 0`，4h 重发）。
        # 旧写法量的其实是「上游厂商重建镜像的滞后」，不是可行动的风险：
        #   · 发行版底层包一出 CVE 就同时点亮一片镜像（2026-11-05 实测：两集群 35 份报告带
        #     Critical，只对应 3 个 CVE ID，libbrotli 一个就命中 19 个镜像）；
        #   · `ignoreUnfixed` 的「可修复」= 发行版出了修复包，不等于你用的厂商镜像已重建，
        #     这段时间只能等或豁免（两份 values 现有 66 条豁免，8 月以来真升镜像只有十来次）；
        #   · 不分新旧，剩一个就一直 firing，10-28 起连烧 9 天、每 4h 一条。
        # 新语义：
        #   TrivyCriticalCVE       新 CVE ID 出现 → 通知一次（新 ID 进组才再发，route 上 repeat 5d）
        #   TrivyCriticalCVEStale  同一 ID 6~7 天前就在、现在还在 → 厂商没重建，该人动手，每天提醒
        #   Stale 在 Alertmanager 里抑制同 (cluster, vuln_id) 的 TrivyCriticalCVE，不重复报。
        # 指标前提：两集群 values 开了 `operator.metricsVulnIdEnabled`，且抓取侧只留 Critical
        # （homelab ServiceMonitor metricRelabelings / oracle otel-collector metric_relabel_configs，
        # 两侧必须同一正则）。不过滤时 homelab ~1.7k、oracle ~5k 条，过滤后各几十条。
        # 处置 SOP：docs/runbooks/trivy-cve-alert-triage.md

        # 每个 (cluster, CVE ID) 一条序列，值 = 受影响的不同镜像仓库数。
        # 只留这两个标签：下面的 max_over_time / offset 才不会被报告名、版本号这类
        # 会变的标签拆成多条（见 PromQL 陷阱 #5）。
        - record: trivy:critical_cve:images
          expr: |
            count by (cluster, vuln_id) (
              count by (cluster, vuln_id, image_repository) (
                trivy_vulnerability_id{severity="Critical"}
              )
            )

        # [6h] 平滑是必须的：强制重扫（删报告 → 重启 operator）、报告 24h TTL 删除后排队重扫、
        # operator 重启，都会让序列断开几十分钟到几小时。不平滑的话每次重扫都会先发一遍
        # RESOLVED、再发一遍新告警。代价是修好后 RESOLVED 晚到最多 6h，验收看报告不看告警。
        - alert: TrivyCriticalCVE
          expr: max_over_time(trivy:critical_cve:images[6h])
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.vuln_id }}（{{ $value }} 个镜像）'
            # ⚠️ Telegram 走 parseMode=HTML：这里不许出现尖括号（见 alertmanager-config.yaml）。
            # 模板里的查询也套 last_over_time[6h]：断档时告警靠平滑还在，列表不能跟着变空。
            description: >-
              {{ with query (printf "count by (resource, installed_version, fixed_version) (last_over_time(trivy_vulnerability_id{cluster=%q,vuln_id=%q}[6h]))" $labels.cluster $labels.vuln_id) }}{{ with first . }}{{ .Labels.resource }} {{ .Labels.installed_version }} → {{ .Labels.fixed_version }}；{{ end }}{{ end }}镜像：{{ range $i, $s := query (printf "count by (image_repository) (last_over_time(trivy_vulnerability_id{cluster=%q,vuln_id=%q}[6h]))" $labels.cluster $labels.vuln_id) | sortByLabel "image_repository" }}{{ if lt $i 8 }}{{ if $i }}, {{ end }}{{ $s.Labels.image_repository }}{{ end }}{{ end }}{{ if gt $value 8.0 }} …{{ end }}。
              先等厂商重建，7 天后仍在会升级成 TrivyCriticalCVEStale。

        # 「现在还在」且「6~7 天前某个时刻也在」。故意不用 `for: 7d`：重扫/TTL 造成的断档
        # 会把 for 计时清零，用 offset 只看两头，对中间断档免疫。
        # ⚠️ 上线后前 6 天没有历史可比，这条不会响（从 vuln-id 指标首次入库那天算起）。
        # ⚠️ 依赖 Prometheus 保留期 ≥ 7d（现为 14d / 10GiB，先到先裁）。
        - alert: TrivyCriticalCVEStale
          expr: |
            max_over_time(trivy:critical_cve:images[6h])
              and on (cluster, vuln_id)
            max_over_time(trivy:critical_cve:images[1d] offset 6d)
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.vuln_id }} 已挂 7 天以上（{{ $value }} 个镜像）'
            description: >-
              厂商一周内没有重建，需要人工处置：升级到已修复的多架构 digest，或核实不可达后豁免。
              清单：just helm trivy-critical；SOP：docs/runbooks/trivy-cve-alert-triage.md

        # 元告警：报告里有 Critical，按 CVE ID 的序列却一条都没有。
        # 上面两条只读 trivy_vulnerability_id；它没了（values 被改回、抓取正则写错把 Critical
        # 也丢了、oracle collector 漏了这段配置），两条就同时哑火，外观与「没有 Critical」一样。
        # 两边出自同一次抓取、同一批 VulnerabilityReport，正常时不会一边有一边没有。
        - alert: TrivyVulnIdMetricsMissing
          expr: |
            sum by (cluster) (trivy_image_vulnerabilities{severity="Critical"}) > 0
              unless on (cluster)
            count by (cluster) (trivy_vulnerability_id{severity="Critical"})
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.cluster }} 有 {{ $value }} 个 Critical，但按 CVE ID 的指标缺失"
            description: "TrivyCriticalCVE / TrivyCriticalCVEStale 依赖 trivy_vulnerability_id，现在它们是瞎的。查 values 里 operator.metricsVulnIdEnabled，以及抓取侧（homelab ServiceMonitor / oracle otel-collector）的 severity 过滤正则。"

        # 扫描 Job 失败（2026-11-06）。失败的扫描不会重试，对应的镜像从此没有报告，按 0 计，
        # 上面所有告警都看不见它。最常见的是 DeadlineExceeded（超过 scanJobTimeout 被杀，
        # operator 不打任何日志），其次是 Docker Hub 匿名限流。
        # 失败的 Job 5m 后就被 scanJobTTL 收走，序列随之消失，所以不能写 for:15m（那正是
        # KubeJobFailed 永远不响的原因）；keep_firing_for 让它别 5 分钟后就发 RESOLVED。
        # 7 天回放：homelab 2 次、oracle 1 次，全是 DeadlineExceeded。
        - alert: TrivyScanJobFailed
          expr: max by (cluster, job_name) (kube_job_status_failed{namespace="trivy-system"}) > 0
          keep_firing_for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.cluster }} Trivy 扫描失败：{{ $labels.job_name }}"
            description: "失败的扫描不会自动重试，这个镜像的 CVE 现在看不见。原因看 kube_job_status_failed 的 reason 标签（DeadlineExceeded = 超过 scanJobTimeout）；缺哪个容器：just helm trivy-critical 末尾的覆盖率；重新排队：just helm trivy-rescan 0（会重启 operator）。"

        # 镜像内硬编码密钥被扫出——最高信号，几乎总是配置事故。
        # ☠️ 2026-08-30 修正指标名：原先写的 `trivy_exposedsecrets_findings` **在任何集群
        #    都不存在**（真名 `trivy_image_exposedsecrets`），所以这条 critical 自上线起
        #    **一次都没有可能响过** —— 表达式恒为空集，外观与「没有暴露密钥」完全一致。
        #    本文件头 17 行的「首次部署后 curl :8080/metrics 核对指标名」那一步没做过。
        #    同类陷阱：records/2026-08-30-memory-alert-page-cache-false-alarm.md。
        # ⚠️ 改名后立刻有 43 条 High 命中（全在 oracle），逐条读过 report 确认都是上游镜像
        #    自带的测试/自签夹具，已在 cloud/oracle/values/trivy-operator.yaml 的 ignoreFile
        #    按 **path** 精确豁免（不按 rule id 全局豁免——那会连真的私钥泄漏一起挡掉）。
        - alert: TrivyExposedSecretFound
          expr: sum by (cluster) (trivy_image_exposedsecrets{severity=~"High|Critical"}) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.cluster }} 镜像中发现暴露密钥"
            description: "Trivy 在运行镜像里扫出 High/Critical 暴露密钥。查看：`kubectl get exposedsecretreports -A`。立刻轮换该密钥并从镜像剔除。"

        # 配置审计高危（特权容器、缺资源限制、危险挂载等）。
        - alert: TrivyConfigAuditCritical
          expr: sum by (cluster) (trivy_resource_configaudits{severity="Critical"}) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.cluster }} 存在 {{ $value }} 个 Critical 配置审计问题"
            description: "工作负载配置存在 Critical 级问题。查看：`kubectl get configauditreports -A -o wide`。多数可由 Kyverno 策略在准入期拦截。"

        # 元告警：findings 指标整体消失 = operator 挂了或抓取断了，会静默掩盖以上所有告警。
        # for:2h 以越过首次扫描前的空窗（运行镜像总会被扫到，故此后该序列稳定存在）。
        - alert: TrivyOperatorMetricsAbsent
          expr: absent(trivy_image_vulnerabilities{cluster="homelab"})
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Trivy Operator 指标在 homelab 缺失"
            description: ">2h 无 trivy_image_vulnerabilities 序列——Trivy Operator 可能已宕或 ServiceMonitor 抓取中断，会掩盖所有漏洞/密钥告警。检查 `kubectl get pods -n trivy-system`。"

        # oracle 侧同款。⚠️ 不能合并成一条 `absent(trivy_image_vulnerabilities)` ——
        # 那样只要有**任一**集群还在上报就不告警，恰好掩盖"单集群扫描器挂了"这个场景。
        - alert: TrivyOperatorMetricsAbsentOracle
          expr: absent(trivy_image_vulnerabilities{cluster="oracle-k3s"})
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Trivy Operator 指标在 oracle-k3s 缺失"
            description: ">2h 无 cluster=oracle-k3s 的 trivy_image_vulnerabilities 序列——Trivy Operator 可能已宕，或 oracle otel-collector 的 prometheus/trivy-operator 抓取中断（该侧不走 ServiceMonitor）。检查 `kubectl --context oracle-k3s get pods -n trivy-system` 与 collector 日志。"
