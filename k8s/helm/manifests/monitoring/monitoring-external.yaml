---
# External NodePort services for cross-cluster observability
#
# ⚠️ 2026-08-02 起这里**只剩 Prometheus 一条**。Loki 与 Tempo 已迁往 oracle-k3s，
# 跨集群的日志/追踪方向随之反转（改成 homelab 写出去），对应的 NodePort 也搬到了
# cloud/oracle/manifests/monitoring/monitoring-external.yaml。
# 指标方向没变：oracle 的 OTel Collector 仍经 Tailscale prometheusremotewrite 到这里。
---
# Prometheus OTLP receiver — exposed for oracle-k3s OTel Collector (metrics push)
# Prometheus must have enableFeatures: [otlp-write-receiver] set
apiVersion: v1
kind: Service
metadata:
  name: prometheus-otlp-external
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: kube-prometheus-stack-prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 31090
      name: http
