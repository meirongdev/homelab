# KRR (robusta-dev/krr) — 资源 requests/limits 右尺寸推荐（homelab）
# 每周一 09:00 跑一次，结果以文本附件推到 Telegram「🚨 Homelab 告警」话题。
#
# KRR 是 CLI 工具，不导出 Prometheus 指标（只有 table/json/yaml/csv/html），
# 所以没有对应的 Grafana 面板 —— 报告即产物。
#
# 数据来源：本集群 kube-prometheus-stack（cAdvisor + KSM 均已就位）。
# 窗口显式取 168h(7d) 而非 KRR 默认的 336h(14d)，因为 Prometheus retention 就是 7d；
# 不传的话 KRR 不报错，只会静默用不足的数据。retention 提上去后这里同步改回 336。
#
# 对应的 oracle-k3s 侧在 cloud/oracle/manifests/monitoring/krr.yaml。
# 见 docs/plans/observability/2026-07-30-krr-rightsizing.md
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krr
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krr
rules:
  # 全部只读：KRR 只做推荐，不改任何工作负载（enforcer 组件未部署）
  - apiGroups: [""]
    resources: ["configmaps", "namespaces", "nodes", "pods", "replicationcontrollers", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: krr
subjects:
  - kind: ServiceAccount
    name: krr
    namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: krr
  namespace: monitoring
spec:
  schedule: "0 9 * * 1" # 每周一 09:00（oracle 侧错峰到 09:15）
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels: { app: krr }
          annotations:
            # 由 `just gen-embedded-scripts` 写入 krr-mem-profile.py 的 sha256 前 16 位。
            # CronJob 每轮都新建 pod、必然读到当前 ConfigMap，所以这里**不是**为了触发重启
            # （那是 Deployment 才有的问题）；留着是为了让「脚本改了」在 git diff 与 ArgoCD
            # 上可见，且与 E1 的另一半规则保持同一个形状。
            checksum/krr-mem-profile-py: "e9cf9040fa96348d"
        spec:
          restartPolicy: Never
          serviceAccountName: krr
          # 无状态 CronJob → 106 worker（2026-08-14）：KRR 无 PVC、无 hostPath、无节点
          # 语义（只查集群内 Prometheus + K8s API + 推 Telegram），任何节点都能跑。
          # 用它验证/固化「无状态周期扫描 → k8s-worker-106」这条分担通道（方案 A）。
          # ⚠️ 后果：KRR 调度自此依赖 106 worker 存活；该节点下线时本周报案静默缺失
          # （dead-man's switch 不覆盖 KRR——它不是 Checkmk 探针）。若 want all-green
          # 语义，改为调度回控制面即可（去掉这两行）。
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-106
          # KRR 先跑完写文件，notify 再读 —— initContainer 保证顺序
          # （同 Pod 的多个 containers 是并行的，不能用来做流水线）
          initContainers:
            - name: krr
              image: docker.io/robustadev/krr:v1.29.0
              command: ["python", "krr.py", "simple"]
              args:
                - --prometheus-url=http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
                # --prometheus-label 是标签「键」，-l 是标签「值」，别搞反
                - --prometheus-label=cluster
                # 短选项不支持 `-l=value` 语法（会被当成值 "=homelab"），必须拆成两项
                - -l
                - homelab
                - --history-duration=168
                - --max-workers=3
                # 输出是附件不是终端，放宽避免 namespace/容器名被截断成 "personal…"
                - --width=300
                - --formatter=table
                - --fileoutput=/out/krr.txt
                - --quiet
              volumeMounts:
                - { name: out, mountPath: /out }
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits: { memory: "1Gi" }
            # 内存构成附表：把 RSS/PSS/USS 追加到 KRR 报告尾部。
            # 为什么必须有它：KRR 的内存推荐是 max(working_set)+15%，而 working_set **含页缓存** ——
            # 它系统性地诱导上调。实测（2026-09-09）prometheus 的建议值 58% 是页缓存、vault 70%，
            # 而同一份报告里 litellm 的 +913Mi 是真的（页缓存仅 9%），两者在 KRR 表里长得一样。
            # 机械照抄的代价算过：homelab 净 +2345Mi、oracle 净 +3468Mi，而 oracle 只剩 2180Mi 余量。
            # 复用 KRR 自己的镜像（它就是 python 镜像）→ 零新镜像、零新 registry 拉取。
            # ⚠️ 脚本 fail-open：查不到指标只在报告里留一行说明，绝不让 Job 失败 ——
            #    报告发不出去比报告少一张附表严重得多。
            - name: mem-profile
              image: docker.io/robustadev/krr:v1.29.0
              command: ["python", "/scripts/krr-mem-profile.py"]
              env:
                - { name: PROM_URL, value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090" }
                - { name: CLUSTER, value: homelab }
                # 与上面 KRR 的 --history-duration=168 同窗口，否则两张表不可比
                - { name: WINDOW, value: 168h }
                - { name: OUT, value: /out/krr.txt }
              volumeMounts:
                - { name: out, mountPath: /out }
                - { name: mem-profile, mountPath: /scripts, readOnly: true }
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits: { memory: "256Mi" }
          containers:
            - name: notify
              # 8.21.0：8.11.1 的 alpine libssl3/libcrypto3 停在 3.3.2-r4，
              # 带 Critical CVE-2026-31789（需 ≥3.3.7-r0）。两集群的 krr 保持同版本。
              image: docker.io/curlimages/curl:8.21.0
              env:
                # 与 Alertmanager 共用同一个 bot token（ESO ← Vault secret/homelab/telegram）
                - name: BOT_TOKEN
                  valueFrom:
                    secretKeyRef: { name: alertmanager-telegram, key: bot-token }
                - name: CLUSTER
                  value: homelab
                # 群 MatthewDaily（forum）→「🚨 Homelab 告警」话题(thread 2)，与 Alertmanager 一致
                - name: CHAT_ID
                  value: "-1003981213530"
                - name: THREAD_ID
                  value: "2"
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  F=/out/krr.txt
                  if [ ! -s "$F" ]; then
                    echo "KRR 输出为空/缺失，判为失败" >&2
                    exit 1
                  fi
                  D=$(date +%F)
                  curl -sS --fail-with-body -X POST \
                    "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
                    -F "chat_id=${CHAT_ID}" \
                    -F "message_thread_id=${THREAD_ID}" \
                    -F "caption=📊 KRR 资源推荐 · ${CLUSTER} · ${D}
                  窗口 7d · strategy=simple（CPU p95 / 内存 max+15%）" \
                    -F "document=@${F};filename=krr-${CLUSTER}-${D}.txt" \
                    -o /dev/null -w "telegram HTTP %{http_code}\n"
              volumeMounts:
                - { name: out, mountPath: /out, readOnly: true }
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits: { memory: "64Mi" }
          volumes:
            - name: out
              emptyDir: {}
            - name: mem-profile
              configMap:
                name: krr-mem-profile
                defaultMode: 0755
