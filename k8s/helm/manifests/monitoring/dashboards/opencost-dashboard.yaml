# Grafana Dashboard: OpenCost 双集群成本归因
# 展示 homelab 与 oracle-k3s 的节点/命名空间成本与闲置率
# 数据源: Prometheus ← OpenCost :9003
#   - homelab   : ServiceMonitor（cluster 标签由 metricRelabelings 补，见 values/opencost.yaml）
#   - oracle-k3s: otel-collector prometheus/opencost receiver → remote-write
# 刻意只用 OpenCost 自身导出的指标（node_*_hourly_cost / container_*_allocation），
# 不掺 kube-state-metrics —— homelab 的 KSM 指标没有 cluster 标签，掺进来会算错。
# Auto-loaded via kube-prometheus-stack grafana-sc-dashboard sidecar
# 见 docs/plans/observability/2026-07-30-opencost-multicluster.md
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencost-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  opencost-overview.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "双集群 Kubernetes 成本归因：homelab（裸金属实测功耗+摊销）与 oracle-k3s（OCI Ampere A1 牌价影子定价）。数据源 OpenCost，见 docs/plans/observability/2026-07-30-opencost-multicluster.md",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": true,
          "icon": "external link",
          "keepTime": true,
          "tags": [
            "curated"
          ],
          "title": "📊 其他自建面板",
          "type": "dashboards"
        },
        {
          "asDropdown": true,
          "icon": "external link",
          "keepTime": true,
          "tags": [
            "kubernetes-mixin"
          ],
          "title": "☸️ K8s 资源详情 (下钻)",
          "type": "dashboards"
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "💰 成本总览（月度）",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "全部集群 · 月度成本",
          "description": "节点小时成本 × 730h。homelab 为实测功耗+硬件摊销，oracle-k3s 为 OCI 牌价影子定价。",
          "id": 101,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(node_total_hourly_cost{cluster=~\"$cluster\"}) * 730",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "currencyUSD",
              "decimals": 2,
              "custom": {},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
