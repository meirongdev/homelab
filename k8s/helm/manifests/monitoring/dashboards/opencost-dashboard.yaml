        {
          "type": "stat",
          "title": "闲置成本占比",
          "description": "1 - 已分配成本/节点总成本。单节点集群该值天然偏高（闲置容量确实在烧电/占额度），属真实情况而非归因失败。",
          "id": 104,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "1 - ((sum (container_cpu_allocation{cluster=~\"$cluster\"} * on(cluster,node) group_left() node_cpu_hourly_cost{cluster=~\"$cluster\"}) + sum (container_memory_allocation_bytes{cluster=~\"$cluster\"} / 1073741824 * on(cluster,node) group_left() node_ram_hourly_cost{cluster=~\"$cluster\"})) / sum(node_total_hourly_cost{cluster=~\"$cluster\"}))",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "percentunit",
              "decimals": 1,
              "custom": {},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.6
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
