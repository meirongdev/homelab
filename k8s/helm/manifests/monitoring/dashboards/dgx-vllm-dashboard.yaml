---
# Grafana Dashboard: DGX Spark 推理引擎
# 2× NVIDIA DGX Spark (GB10) 推理服务的引擎指标，homelab Prometheus 经 Tailscale 抓取
# (job `dgx-inference`；2026-11-15 起 dsv41：TensorFold 双机 TP=2，只有 S1 dgx-spark-1 :8000
#  一个 target（rank1 在 S2 上，没有自己的端点），指标前缀 `tensorfold:*`)。
#
# ☠️ **引擎会换，指标前缀与端口跟着换** —— 本面板最容易静默失效的地方：
#      ~2026-09-19   vLLM        :8000    `vllm:*`
#      2026-09-19 起 SGLang      :8888    `sglang:*`
#      2026-09-30 起 vLLM TP=2   :8000    `vllm:*`
#      2026-11-15 起 TensorFold  :8000    `tensorfold:*`   ← 当前
#   过期的前缀**不报错**：面板只是全部空白，与"最近没有流量"长得一模一样。
#   换栈后先 `curl -s http://<head>:<port>/metrics | head -1` 确认前缀，再改这里。
#   ☠️ TensorFold 的指标**没有 model_name 标签**，所以 2026-11-15 删掉了 `$model` 模板变量；
#   留着它会让每条带 `model_name=~"$model"` 的查询恒空。
#   口径变了的格子（KV 占用、prefix cache、排队 → prefill、HTTP 状态 → 结果计数、accept length）
#   各自的 description 里写了为什么换、与旧栈可不可比。
#   查询改完用线上 Prometheus 逐条实跑过，非空才算（2026-11-15）。
#
# ⚠️ uid 仍是 `dgx-vllm`（与当前引擎名实不符）**是刻意的**：uid 是 Grafana 的链接身份，
#   改了会打断已有书签与外链。标题/标签/查询都已改，只有 uid 与文件名不动。
#
# Follows the dgx-spark-node-dashboard pattern: sidecar auto-load via
# grafana_dashboard:"1" + grafana_folder annotation, synced by ArgoCD
# monitoring-dashboards App. cluster/nodename 由 scrape config 注入。查询里不含模型名，
# **只换模型名不用改本文件**，换引擎才要改。
apiVersion: v1
kind: ConfigMap
metadata:
  name: dgx-vllm-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Hardware"
data:
  dgx-vllm.json: |-
    {
      "annotations": {"list": []},
      "description": "DGX Spark 推理指标（2026-11-15 起 dsv41：DeepSeek-V4.1-Flash-1017，TensorFold 双机 TP=2，指标前缀 tensorfold:*）：并发与排队、KV 占用、token 吞吐、TTFT/端到端/逐 token/prefill 延迟、prompt 缓存、MTP 投机解码、rank 对健康与显存",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "schemaVersion": 39,
      "tags": ["curated", "inference", "tensorfold", "dgx-spark"],
      "title": "Hardware / DGX 推理",
      "uid": "dgx-vllm",
      "templating": {
        "list": [
          {"name": "datasource", "type": "constant", "query": "prometheus", "current": {"text": "prometheus", "value": "prometheus"}, "hide": 2},
          {
            "name": "nodename",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "query": "label_values(up{job=\"dgx-inference\"}, nodename)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {"text": "All", "value": "$__all"}
          }
        ]
      },
      "panels": [
        {"collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}, "id": 100, "title": "📊 概览 / Overview", "type": "row"},
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 90}]},
              "unit": "percent",
              "mappings": [],
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 1},
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "max by (nodename) (tensorfold:kv_cache_usage_ratio{job=\"dgx-inference\", nodename=~\"$nodename\"}) * 100",
              "legendFormat": "{{nodename}}",
              "refId": "A"
            }
          ],
          "title": "KV Cache 使用率 %",
          "type": "stat",
          "description": "TensorFold 口径：**每条流**的缓存占用 / 该流的上下文窗口，取最大的那条。不是全局 KV 池占用，与旧栈的 kv_cache_usage_perc / token_usage 不可比。"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]},
              "unit": "none",
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 1},
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (tensorfold:requests_running{job=\"dgx-inference\", nodename=~\"$nodename\"})",
              "legendFormat": "{{nodename}}",
              "refId": "A"
            }
          ],
          "title": "推理中 / Running",
          "type": "stat",
          "description": "正在 prefill 或 decode 的请求数。上限 4（/health 的 max_batch_size，2026-11-15）。"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]},
              "unit": "none",
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 1},
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (tensorfold:requests_waiting{job=\"dgx-inference\", nodename=~\"$nodename\"})",
              "legendFormat": "{{nodename}}",
              "refId": "A"
            }
          ],
          "title": "排队中 / Queued",
          "type": "stat",
          "description": "排队或等空闲通道的请求数。>4 持续 2 分钟会触发 DgxSparkRequestsQueued。"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": 0}, {"color": "green", "value": 1}]},
              "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}],
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 1},
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "max(up{job=\"dgx-inference\", nodename=~\"$nodename\"})",
              "legendFormat": "up",
              "refId": "A"
            }
          ],
          "description": "up == 1 只代表该节点的 /metrics 抓得到（S1 :8888 / S2 :18300，2026-09-20 起）。☠️ 它看不见「引擎活着但零进度」那一类故障（旧栈的僵尸 TP 组就是这样），那一类由 DgxSparkInferenceStuck 告警负责（覆盖双前缀）；SGLang 另有 /health_generate 会真跑一次生成，那个才有判别力（S2 的 vLLM 构建无 /health_generate，2026-09-21 实测 404）。",
          "title": "引擎状态 / Engine",
          "type": "stat"
        },
        {"collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5}, "id": 101, "title": "🧠 KV Cache / 请求队列", "type": "row"},
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"}
              },
              "unit": "percent",
              "min": 0,
              "max": 100,
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 90}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "id": 5,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "tensorfold:kv_cache_usage_ratio{job=\"dgx-inference\", nodename=~\"$nodename\"} * 100",
              "legendFormat": "{{nodename}} pool {{pool}}",
              "refId": "A"
            }
          ],
          "description": "TensorFold 口径：**每条流**的缓存占用 / 该流的上下文窗口，取最大的那条。不是全局 KV 池占用，与旧栈的 kv_cache_usage_perc / token_usage 不可比。",
          "title": "KV Cache 使用率 %",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"}
              },
              "unit": "none",
              "min": 0,
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "id": 6,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (tensorfold:requests_running{job=\"dgx-inference\", nodename=~\"$nodename\"})",
              "legendFormat": "running",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (tensorfold:requests_waiting{job=\"dgx-inference\", nodename=~\"$nodename\"})",
              "legendFormat": "waiting",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (increase(tensorfold:preemptions_total{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval]))",
              "legendFormat": "preemptions",
              "refId": "C"
            }
          ],
          "description": "running 顶在 4 而 waiting 持续 >0 = 通道打满。preemptions 是请求被迫把通道让给后来者的次数。jobs-sg 夜里（19:10 UTC，并发 4）一个作业就能占满。",
          "title": "并发 / Lanes（上限 4）",
          "type": "timeseries"
        },
        {"collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 14}, "id": 102, "title": "⚡ 吞吐 / 请求", "type": "row"},
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"}
              },
              "unit": "tokps",
              "min": 0,
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 15},
          "id": 7,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate(tensorfold:generation_tokens_total{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval]))",
              "legendFormat": "generation",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate(tensorfold:prompt_tokens_total{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval]))",
              "legendFormat": "prompt",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate(tensorfold:prompt_tokens_cached_total{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval]))",
              "legendFormat": "prompt (cached)",
              "refId": "C"
            }
          ],
          "description": "☠️ 这几个 counter 只在**请求结束时**累加（HELP: of finished requests），长请求会让曲线成块状、尖峰落在结束那一刻。实时生成速度看 `curl -s http://100.97.87.120:8000/health` 的 live.decode_tokens_per_second。",
          "title": "Token 吞吐 (tokens/s)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"}
              },
              "unit": "reqps",
              "min": 0,
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 15},
          "id": 8,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate(tensorfold:request_latency_seconds_count{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval]))",
              "legendFormat": "完成 req/s",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate(tensorfold:client_disconnections_total{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval]))",
              "legendFormat": "客户端提前断开",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate(tensorfold:pair_failed{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval]))",
              "legendFormat": "rank 对断开致失败",
              "refId": "C"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate(tensorfold:service_refused{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval]))",
              "legendFormat": "service refused",
              "refId": "D"
            }
          ],
          "description": "TensorFold 不导出 HTTP 状态码，换成这几个计数。rank 对断开致失败 >0 = 两台之间的 TP 链路出过事（与 DgxSparkInferenceStuck 的 pair_* 分支同源）。pair_failed / service_refused 是 counter 但名字没有 _total。",
          "title": "请求结果 / Requests",
          "type": "timeseries"
        },
        {"collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 23}, "id": 103, "title": "⏱️ 延迟 / Latency (histogram 分位)", "type": "row"},
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"}
              },
              "unit": "s",
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "id": 9,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "histogram_quantile(0.5, sum by (le) (rate(tensorfold:time_to_first_token_seconds_bucket{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "histogram_quantile(0.95, sum by (le) (rate(tensorfold:time_to_first_token_seconds_bucket{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "histogram_quantile(0.99, sum by (le) (rate(tensorfold:time_to_first_token_seconds_bucket{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "title": "TTFT / 首 token 延迟",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "none"}
              },
              "unit": "s",
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "id": 10,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "histogram_quantile(0.5, sum by (le) (rate(tensorfold:request_latency_seconds_bucket{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "histogram_quantile(0.95, sum by (le) (rate(tensorfold:request_latency_seconds_bucket{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "histogram_quantile(0.99, sum by (le) (rate(tensorfold:request_latency_seconds_bucket{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "title": "端到端延迟 / E2E latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 0,
