---
# Grafana Dashboard: DGX Spark 推理引擎
# 2× NVIDIA DGX Spark (GB10) 推理服务的引擎指标，homelab Prometheus 经 Tailscale 抓取
# (job `dgx-inference`；2026-09-20 起两台并跑：S1 dgx-spark-1 :8888 SGLang `sglang:*` 主力，
#  S2 dgx-spark-2 :18300 vLLM fndgx `vllm:*` 常驻；同 job 两前缀并存)。
#
# ☠️ **引擎会换，指标前缀与端口跟着换** —— 本面板最容易静默失效的地方：
#      ~2026-09-19   vLLM   :8000    `vllm:*`     (k3s, 2026-09-20 已随集群移除)
#      2026-09-19 起 SGLang :8888    `sglang:*`   ← S1 主力 (当前)
#      2026-09-20 起 vLLM   :18300   `vllm:*`     ← S2 fndgx 常驻 (当前)
#   过期的前缀**不报错**：面板只是全部空白，与"最近没有流量"长得一模一样。
#   换栈后先 `curl -s http://<head>:<port>/metrics | head -1` 确认前缀，再改这里。
#   2026-09-20 双引擎并存：口径可比的指标面板写成 `sglang:X{…} or vllm:Y{…}` 并集；
#   口径不可比的（prefix cache 请求数 vs token 数、投机解码、by-mode 拆分）保留
#   SGLang 原样并在面板 description 注明。⚠️ vLLM 侧标签只有 {engine, model_name}，
#   没有 is_streaming/moe_ep_rank 那组 —— 凡带 `sum by (nodename)` / `sum by (le)` 聚合的并集安全。
#
# ⚠️ uid 仍是 `dgx-vllm`（与当前引擎名实不符）**是刻意的**：uid 是 Grafana 的链接身份，
#   改了会打断已有书签与外链。标题/标签/查询都已改，只有 uid 与文件名不动。
#
# ⚠️ 从 vLLM 迁过来时有三个指标**没有等价物**（不是漏改，是换了口径，各面板 description 里写了）：
#   - vllm:engine_sleep_state             → SGLang 无 sleep 概念，改用 up
#   - vllm:num_requests_waiting_by_reason → 改成四个独立队列/状态计数
#   - vllm:prefix_cache_hits/queries      → SGLang 统计 **token 数**不是请求数，
#                                           口径按指标 HELP 原文的公式算，与旧栈数值不可比
# ☠️ 两个标签陷阱（踩了就是恒空，不报错）：
#   - `sglang:*_tokens_total` 带 is_streaming 维度、**不带** tp_rank 那组标签 → 必须 sum
#   - `sglang:http_responses_total` **没有 model_name** → 不能用 $model 过滤
#
# Follows the dgx-spark-node-dashboard pattern: sidecar auto-load via
# grafana_dashboard:"1" + grafana_folder annotation, synced by ArgoCD
# monitoring-dashboards App. cluster/nodename 由 scrape config 注入，model_name 由引擎自带
# 并经 label_values() 解析成模板变量 —— **只换模型名不用改本文件**，换引擎才要改。
apiVersion: v1
kind: ConfigMap
metadata:
  name: dgx-vllm-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Hardware"
data:
  dgx-vllm.json: |-
    {
      "annotations": {"list": []},
      "description": "DGX Spark 推理指标（2026-09-20 起双引擎并跑：S1 SGLang 主力 + S2 vLLM fndgx）：KV/token 占用、请求队列、token 吞吐、TTFT/端到端/逐 token/排队延迟、prefix cache、投机解码接受率",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "schemaVersion": 39,
      "tags": ["curated", "inference", "sglang", "vllm", "dgx-spark"],
      "title": "Hardware / DGX 推理",
      "uid": "dgx-vllm",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "constant",
            "query": "prometheus",
            "current": {"text": "prometheus", "value": "prometheus"},
            "hide": 2
          },
          {
            "name": "nodename",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "query": "label_values(up{job=\"dgx-inference\"}, nodename)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {"text": "All", "value": "$__all"}
          },
          {
            "name": "model",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "query": "label_values(sglang:num_running_reqs{job=\"dgx-inference\"} or vllm:num_requests_running{job=\"dgx-inference\"}, model_name)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {"text": "All", "value": "$__all"}
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "id": 100,
          "title": "📊 概览 / Overview",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "green", "value": null},
                {"color": "yellow", "value": 70},
                {"color": "red", "value": 90}
              ]},
              "unit": "percent",
              "mappings": [],
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 1},
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "(sglang:token_usage{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"} or vllm:kv_cache_usage_perc{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"}) * 100",
              "legendFormat": "{{model_name}}",
              "refId": "A"
            }
          ],
          "title": "KV Cache 使用率 %",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}, "unit": "none", "mappings": []},
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 1},
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sglang:num_running_reqs{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"} or vllm:num_requests_running{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"}",
              "legendFormat": "{{model_name}}",
              "refId": "A"
            }
          ],
          "title": "推理中 / Running",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}, "unit": "none", "mappings": []},
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 1},
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sglang:num_queue_reqs{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"} or vllm:num_requests_waiting{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"}",
              "legendFormat": "{{model_name}}",
              "refId": "A"
            }
          ],
          "title": "排队中 / Queued",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "red", "value": 0},
                {"color": "green", "value": 1}
              ]},
              "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}],
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 1},
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "max(up{job=\"dgx-inference\", nodename=~\"$nodename\"})",
              "legendFormat": "up",
              "refId": "A"
            }
          ],
          "description": "up == 1 只代表该节点的 /metrics 抓得到（S1 :8888 / S2 :18300，2026-09-20 起）。☠️ 它看不见「引擎活着但零进度」那一类故障（旧栈的僵尸 TP 组就是这样），那一类由 DgxSparkInferenceStuck 告警负责（覆盖双前缀）；SGLang 另有 /health_generate 会真跑一次生成，那个才有判别力（S2 的 vLLM 构建无 /health_generate，2026-09-21 实测 404）。",
          "title": "引擎状态 / Engine",
          "type": "stat"
        },

        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5},
          "id": 101,
          "title": "🧠 KV Cache / 请求队列",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisPlacement": "auto", "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}},
              "unit": "percent",
              "min": 0,
              "max": 100,
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 90}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "id": 5,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "(sglang:token_usage{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"} or vllm:kv_cache_usage_perc{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"}) * 100",
              "legendFormat": "{{model_name}} 全池",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sglang:full_token_usage{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"} * 100",
              "legendFormat": "{{model_name}} full-attn",
              "refId": "B"
            }
          ],
          "description": "SGLang 的 token_usage 与 vLLM 的 kv_cache_usage_perc 同形（0–1 占比）。⚠️ 但绝对值不可与旧栈比：新栈 KV 池 1,220,951 token（mem-fraction 0.80），对 262k 上下文约 4.6 路满窗并发 —— 打满已不再意味着饱和，饱和看队列（见告警 DgxSparkRequestsQueued 上方的墓碑注释）。",
          "title": "KV Cache 使用率 %",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisPlacement": "auto", "drawStyle": "line", "fillOpacity": 0, "gradientMode": "none", "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}},
              "unit": "none",
              "min": 0,
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "id": 6,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sglang:num_queue_reqs{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"} or vllm:num_requests_waiting{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"}",
              "legendFormat": "queued",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sglang:num_grammar_queue_reqs{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"}",
              "legendFormat": "grammar queue",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (sglang:num_paused_reqs{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"})",
              "legendFormat": "paused",
              "refId": "C"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (sglang:num_retracted_reqs{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"})",
              "legendFormat": "retracted",
              "refId": "D"
            }
          ],
          "description": "SGLang 没有 vLLM 的 waiting_by_reason。这里拆的是四个独立队列/状态计数：retracted（被回退重排）与 paused 长期非 0 = KV 压力；grammar 高 = 结构化输出的消费方（严格 JSON 那几个作业）在等语法编译。⚠️ paused/retracted 带 pid 标签，必须 sum 掉。2026-09-20 起 S2（vLLM fndgx）并跑：总排队那条（A）是双前缀并集；grammar/paused/retracted 三条是 SGLang 专有，S2 侧无对应指标（vLLM 用 waiting_by_reason，口径不同），S2 选中时这三条为空。",
          "title": "队列构成 / Queue breakdown",
          "type": "timeseries"
        },

        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 14},
          "id": 102,
          "title": "⚡ 吞吐 / 请求",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisPlacement": "auto", "drawStyle": "line", "fillOpacity": 0, "gradientMode": "none", "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}},
              "unit": "tokps",
              "min": 0,
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 15},
          "id": 7,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate((sglang:generation_tokens_total{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"} or vllm:generation_tokens_total{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"})[$__rate_interval]))",
              "legendFormat": "generation",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate((sglang:prompt_tokens_total{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"} or vllm:prompt_tokens_total{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\"})[$__rate_interval]))",
              "legendFormat": "prompt",
              "refId": "B"
            }
          ],
          "description": "☠️ sglang:*_tokens_total 带 is_streaming 维度、且**不带** tp_rank 那组标签 —— 不 sum 掉的话曲线会按流式/非流式劈成两条，看起来像吞吐掉了一半。2026-09-20 起 S2（vLLM fndgx）并跑：两路为双前缀并集（vllm:generation/prompt_tokens_total），口径相同（tokens/s）。",
          "title": "Token 吞吐 (tokens/s)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisPlacement": "auto", "drawStyle": "line", "fillOpacity": 0, "gradientMode": "none", "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}},
              "unit": "reqps",
              "min": 0,
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 15},
          "id": 8,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (status_code) (rate(sglang:http_responses_total{job=\"dgx-inference\", nodename=~\"$nodename\", endpoint=~\"/v1/.*\"}[$__rate_interval]))",
              "legendFormat": "{{status_code}}",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate(sglang:num_aborted_requests_total{job=\"dgx-inference\", nodename=~\"$nodename\"}[$__rate_interval]))",
              "legendFormat": "aborted",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate(vllm:request_success_total{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\", finished_reason=~\"stop|length\"}[$__rate_interval]))",
              "legendFormat": "vllm ok ({{nodename}})",
              "refId": "C"
            },
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "sum by (nodename) (rate(vllm:request_success_total{job=\"dgx-inference\", nodename=~\"$nodename\", model_name=~\"$model\", finished_reason=~\"abort|error\"}[$__rate_interval]))",
              "legendFormat": "vllm aborted+error ({{nodename}})",
              "refId": "D"
            }
          ],
          "description": "SGLang 没有 vLLM 的 request_success_total{finished_reason}，状态码是最接近的等价物。☠️ sglang:http_responses_total **不带 model_name**，硬加 $model 过滤会恒为空，所以本面板只按 job+nodename 过滤、不受 $model 影响。另附 aborted：客户端断开/超时放弃的请求，它在状态码里看不见（jobs-sg 那 300s 超时就落在这里）。2026-09-20 起 S2（vLLM）并跑：该构建无 status_code 计数器，C/D 两条用 vllm:request_success_total{finished_reason} 拆分，与 SGLang 状态码口径不同（请求数 vs 状态码），仅供 S2 参考。",
          "title": "请求结果 / HTTP responses",
          "type": "timeseries"
        },

        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 23},
          "id": 103,
          "title": "⏱️ 延迟 / Latency (histogram 分位)",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisPlacement": "auto", "drawStyle": "line", "fillOpacity": 0, "gradientMode": "none", "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}},
              "unit": "s",
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "id": 9,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
