---
# Grafana Dashboard: Mac OMLX 本地推理
# 数据源：集群内 json-exporter（monitoring ns）把 OMLX 的两个免鉴权 JSON 端点翻成指标，
# 由 homelab Prometheus 以 job omlx-status / omlx-models 抓取（经 Tailscale 打到
# mbp-m2-pro 100.89.15.120:8000）。**OMLX 自己没有 /metrics**。
#   端点/指标口径/陷阱 → docs/reference/omlx-inference-metrics.md（唯一真相源）
#   exporter 清单     → k8s/helm/manifests/monitoring/json-exporter/
#   抓取配置          → k8s/helm/values/kube-prometheus-stack.yaml
# 面板取舍：这台机器的故障模式是**换模型**（2026-08-22 播客整集失败），
# 所以「驻留时间线 + 换入换出事件 + 空闲 TTL」排在吞吐之前。
# 同 dgx-vllm-dashboard 的形态：sidecar 靠 grafana_dashboard:"1" 自动加载，
# grafana_folder 注解决定文件夹，ArgoCD monitoring-dashboards App 目录源自动同步。
apiVersion: v1
kind: ConfigMap
metadata:
  name: omlx-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Hardware"
data:
  omlx.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "Mac OMLX（mbp-m2-pro）本地推理：模型驻留/换入换出、30G 天花板、请求队列与 token 吞吐。指标由集群内 json-exporter 翻译两个 JSON 端点而来（OMLX 无原生 /metrics）。",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": true,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [
            "macbook"
          ],
          "title": "MacBook 主机面板",
          "type": "dashboards",
          "targetBlank": false
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "curated",
        "metrics",
        "inference",
        "omlx",
        "macbook"
      ],
      "title": "Hardware / Mac OMLX 推理",
      "uid": "omlx-inference",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "constant",
            "query": "prometheus",
            "current": {
              "text": "prometheus",
              "value": "prometheus"
            },
            "hide": 2
          },
          {
            "name": "model",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(omlx_model_loaded{job=\"omlx-models\"}, model)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "engine",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(omlx_model_loaded{job=\"omlx-models\"}, engine)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": [],
          "title": "📊 概览 / Overview",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "离线",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "在线",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "up{job=\"omlx-status\"}",
              "refId": "A"
            }
          ],
          "title": "服务状态 / OMLX",
          "type": "stat",
          "description": "up = 「json-exporter 活着 **且** Mac 应答」，两者分不开。笔记本合盖即 down，属预期。"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "omlx_uptime_seconds{job=\"omlx-status\"}",
              "refId": "A",
              "legendFormat": "{{version}}"
            }
          ],
          "title": "运行时长",
          "type": "stat",
          "description": "OMLX 进程 uptime；图例是 version 标签。**进程重启会把所有 *_total 归零**。"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "omlx_pool_loaded_count{job=\"omlx-models\"}",
              "refId": "A",
              "legendFormat": "驻留"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "omlx_pool_model_count{job=\"omlx-models\"}",
              "refId": "B",
              "legendFormat": "发现"
            }
          ],
          "title": "驻留 / 发现模型数",
          "type": "stat",
          "description": "发现 = 磁盘上注册的模型数；驻留 = 此刻真在内存里的。"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 85
                  },
                  {
                    "color": "red",
                    "value": 95
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 9,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "omlx_pool_current_memory_bytes{job=\"omlx-models\"} / omlx_pool_ceiling_bytes{job=\"omlx-models\"} * 100",
              "refId": "A"
            }
          ],
          "title": "内存占用 / 30G 天花板",
          "type": "stat",
          "description": "分子是 engine pool 按 **estimated_size** 的核算口径，不是实际 RSS —— 差多少因模型而异（实测 reranker 单个 +41%，它与 4B 嵌入模型同驻时合计只 +4%）。85%/95% 两档对应 settings.json 的 soft/hard threshold。"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  }
                ]
