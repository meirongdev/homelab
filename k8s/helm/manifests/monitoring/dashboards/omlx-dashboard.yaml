              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "time() - omlx_model_resident_last_access_seconds{job=\"omlx-models\", model=~\"$model\", engine=~\"$engine\"}",
              "refId": "A",
              "legendFormat": "{{model}}"
            }
          ],
          "title": "驻留模型空闲时长（TTL 900s 到点即卸载）",
          "type": "timeseries",
          "description": "只有驻留中的模型有这条线（未驻留时 OMLX 给 null，指标不存在）。model_settings.json 里语音/嵌入/重排模型的 `ttl_seconds` 都是 900：越线就会被卸载，下一次调用要重新装载（约 1s/GB）。两个 21G 的 VLM 没配 TTL，只受内存压力驱逐。"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
