              "expr": "(count by (cluster) (rate(kube_pod_container_status_restarts_total{cluster=~\"$cluster\", namespace=~\"$namespace\", container!=\"\"}[15m]) > 0)) or on() vector(0)",
              "legendFormat": "{{cluster}} containers restarted",
