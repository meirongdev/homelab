# Grafana Dashboard: Multi-Cluster Resource Overview
# 展示 homelab 和 oracle-k3s 两个集群的资源使用情况与服务状态
# 数据源: Prometheus (node-exporter + kube-state-metrics, cluster label 区分)
# Auto-loaded via kube-prometheus-stack grafana-sc-dashboard sidecar
#
# ⚠️ 「节点概览」「CPU/内存趋势」两行的 node_* 查询全部硬编码 job="node-exporter"，
#    别放宽成 job=~"node-exporter.*"。cluster="homelab" 不等于「homelab 集群成员」：
#    pve(192.168.50.4) 与 storage-106(192.168.50.106) 是**跑着这两个节点 VM 的宿主机**，
#    在 values/kube-prometheus-stack.yaml 的 additionalScrapeConfigs 里被写死
#    `cluster: homelab`（job=node-exporter-metal-nodes）。放宽后果实测：
#      - 节点在线数 homelab 报 4（真值 2）—— 2026-08-19 就是这么发现的
#      - 平均内存使用率 homelab 报 70.8%（真值 51.1%）：pve 96% + 106 85% 被平均进来
#    宿主机自己有专属 dashboard（proxmox-pve / storage-106），不该混进集群面板。
#    同一个坑在 alerts/prometheus-rules.yaml 里也记了一遍（搜 node-exporter-metal-nodes）。
#
# ⚠️ 「K8s 节点在线数」用 sum(up) 而不是 count(up)：抓取失败时 up 序列仍然存在、值为 0，
#    count 会把宕掉的节点一起数进去 —— 四台全挂也照样显示 4 且是绿的。
#
# ⚠️ 代价（已知并接受）：dgx-spark 与 macbook 这两个「伪集群」只有
#    job=node-exporter-dgx-spark / -macbook，没有 job=node-exporter，
#    因此在本 dashboard 的节点面板里是 No data。它们看 🌡️ DGX Spark /
#    macbook-node 专属 dashboard，宕机由 prometheus-rules.yaml 的 up==0 规则覆盖。
#
# 「📦 容器资源使用」行的四个面板刻意查**原始** cAdvisor 指标 + cluster=~"$cluster"，
# 不用 chart mixin 的 node_namespace_pod_container:* 录制规则 —— 那些规则选的是
# {job="kubelet", metrics_path="/metrics/cadvisor"}，而 oracle 的容器指标经 OTel
# remote-write 进来，job="kubelet-cadvisor" 且无 metrics_path 标签，两个条件都不匹配。
# 即 chart 内置的 Compute Resources 系列面板**选 oracle-k3s 恒为空**，本面板是它在
# oracle 侧的唯一替代。详见 reference/observability-multicluster.md。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multicluster-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  multicluster-overview.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "双集群资源概览：homelab k3s + oracle k3s 的 CPU/内存/Pod/节点状态",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": true,
          "icon": "external link",
          "keepTime": true,
          "tags": [
            "kubernetes-mixin"
          ],
          "title": "☸️ K8s 资源详情 (下钻)",
          "type": "dashboards"
        },
        {
          "asDropdown": true,
          "icon": "external link",
          "keepTime": true,
          "tags": [
            "node-exporter-mixin"
          ],
          "title": "🖥️ 节点详情 (下钻)",
          "type": "dashboards"
        },
        {
          "asDropdown": true,
          "icon": "external link",
          "keepTime": true,
          "tags": [
            "loki"
          ],
          "title": "📜 日志",
          "type": "dashboards"
        },
        {
          "asDropdown": true,
          "icon": "external link",
          "keepTime": true,
          "tags": [
            "dgx-spark"
          ],
          "title": "🌡️ DGX Spark",
          "type": "dashboards"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "title": "🖥️ 节点概览",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none",
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (cluster) (up{job=\"node-exporter\", cluster=~\"$cluster\"})",
              "legendFormat": "{{cluster}} nodes up",
              "refId": "A"
            }
          ],
          "title": "K8s 节点在线数 by Cluster",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              },
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg by (cluster) (1 - rate(node_cpu_seconds_total{job=\"node-exporter\", mode=\"idle\", cluster=~\"$cluster\"}[$__rate_interval]))",
              "legendFormat": "{{cluster}} CPU",
              "refId": "A"
            }
          ],
          "title": "平均 CPU 使用率 by Cluster",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              },
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg by (cluster) (1 - (node_memory_MemAvailable_bytes{job=\"node-exporter\", cluster=~\"$cluster\"} / node_memory_MemTotal_bytes{job=\"node-exporter\", cluster=~\"$cluster\"}))",
              "legendFormat": "{{cluster}} Memory",
              "refId": "A"
            }
          ],
          "title": "平均内存使用率 by Cluster",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.95
                  }
                ]
              },
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg by (cluster) (1 - (node_filesystem_avail_bytes{job=\"node-exporter\", cluster=~\"$cluster\", mountpoint=\"/\", fstype!=\"tmpfs\"} / node_filesystem_size_bytes{job=\"node-exporter\", cluster=~\"$cluster\", mountpoint=\"/\", fstype!=\"tmpfs\"}))",
              "legendFormat": "{{cluster}} Disk /",
              "refId": "A"
            }
          ],
          "title": "根分区磁盘使用率 by Cluster",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 101,
          "title": "📈 CPU / 内存趋势",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "id": 10,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - avg by (cluster, instance) (rate(node_cpu_seconds_total{job=\"node-exporter\", mode=\"idle\", cluster=~\"$cluster\"}[$__rate_interval]))",
              "legendFormat": "{{cluster}} / {{instance}}",
              "refId": "A"
            }
          ],
          "title": "CPU 使用率（每节点）",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - (node_memory_MemAvailable_bytes{job=\"node-exporter\", cluster=~\"$cluster\"} / node_memory_MemTotal_bytes{job=\"node-exporter\", cluster=~\"$cluster\"})",
              "legendFormat": "{{cluster}} / {{instance}}",
              "refId": "A"
            }
          ],
          "title": "内存使用率（每节点）",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1
              },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "id": 12,
          "options": {
            "legend": {
              "calcs": [
                "mean"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (cluster, instance) (rate(node_network_receive_bytes_total{job=\"node-exporter\", cluster=~\"$cluster\", device!~\"lo|veth.*|br.*|docker.*|cilium.*\"}[$__rate_interval]))",
              "legendFormat": "{{cluster}} / {{instance}} rx",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "- sum by (cluster, instance) (rate(node_network_transmit_bytes_total{job=\"node-exporter\", cluster=~\"$cluster\", device!~\"lo|veth.*|br.*|docker.*|cilium.*\"}[$__rate_interval]))",
              "legendFormat": "{{cluster}} / {{instance}} tx",
              "refId": "B"
            }
          ],
          "title": "网络 IO（每节点）",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1
              },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "id": 13,
          "options": {
            "legend": {
              "calcs": [
                "mean"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (cluster, instance) (rate(node_disk_read_bytes_total{job=\"node-exporter\", cluster=~\"$cluster\"}[$__rate_interval]))",
              "legendFormat": "{{cluster}} / {{instance}} read",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "- sum by (cluster, instance) (rate(node_disk_written_bytes_total{job=\"node-exporter\", cluster=~\"$cluster\"}[$__rate_interval]))",
              "legendFormat": "{{cluster}} / {{instance}} write",
              "refId": "B"
            }
          ],
          "title": "磁盘 IO（每节点）",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "id": 102,
          "title": "☸️ Kubernetes 工作负载状态",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 23
          },
          "id": 20,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (cluster) (kube_pod_info{cluster=~\"$cluster\", namespace=~\"$namespace\"})",
              "legendFormat": "{{cluster}} pods",
              "refId": "A"
            }
          ],
          "title": "Pod 总数 by Cluster",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
