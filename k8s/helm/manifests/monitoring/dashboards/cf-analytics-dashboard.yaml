# Grafana Dashboard: Cloudflare 公网流量（按域名的访问 IP 数 + 请求量 + 全站独立访客）
#
# 数据源: Prometheus ← cf-analytics-exporter（Cloudflare GraphQL Analytics API）
#   k8s/helm/manifests/monitoring/cf-analytics-exporter/
#
# ⚠️ 三个数字容易混，面板里也各自标了 description：
#   cf_analytics_daily_uniques{date}          Cloudflare 自己算的全站独立访客（edge 去重）
#   cf_analytics_daily_client_ips{host,date}  我们按 clientIP 去重数出来的**独立访问 IP 数**
#   cf_analytics_daily_requests{host,date}    请求数
#   前两者数值接近但不相等（2026-08-14: 2376 vs 2416）——来自两个不同数据集，
#   adaptive 那个有自适应采样。别拿它们互相"对账"。
#
# ⚠️ 两个窗口不一样长，这是 Cloudflare 免费版的保留期决定的，不是配置失误：
#   全站 uniques 14 天（httpRequests1dGroups，实测可读 30 天）
#   按域名   7–8 天（httpRequestsAdaptiveGroups 保留期 1w1d）
#   所以 $date 变量只从**按域名**的指标取值，避免选到一个没有域名数据的日子。
#
# ⚠️ date 是**标签不是时间戳**：exporter 每 6h 把同一批「完整 UTC 日」重报一遍。
#   所以趋势图用 barchart（instant 查询 + date 作 X 轴），不要用 Prometheus 时间轴——
#   按时间轴画出来是一堆平行的水平直线，看着像 bug。
#
# Auto-loaded via kube-prometheus-stack grafana-sc-dashboard sidecar
# （grafana_dashboard:"1" + grafana_folder annotation，与其它自建面板同款）
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cf-analytics-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  cf-analytics-overview.json: |-
    {
      "annotations": { "list": [] },
      "description": "Cloudflare 边缘视角的公网流量：每个域名有多少独立访问 IP、多少请求，以及全站每日独立访客。数据经 cf-analytics-exporter 从 Cloudflare Analytics API 桥接。按域名数据仅保留 7-8 天（免费版保留期）。",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": true,
          "icon": "external link",
          "keepTime": true,
          "tags": ["curated"],
          "title": "📊 其他自建面板",
          "type": "dashboards"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "keepTime": true,
          "tags": [],
          "targetBlank": true,
          "title": "入口流量（Cloudflare 之后 · 按服务）",
          "type": "link",
          "url": "/d/ingress-traffic-overview/"
        },
        {
          "asDropdown": false,
          "icon": "doc",
          "keepTime": true,
          "tags": [],
          "targetBlank": true,
          "title": "Cloudflare Tunnel 观测",
          "type": "link",
          "url": "/d/cloudflare-tunnel/cloudflare-tunnel-observability"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" },
            "hide": 2
          },
          {
            "name": "date",
            "label": "日期 (UTC)",
            "description": "只列出有按域名数据的日子（Cloudflare 免费版对该数据集只保留 7-8 天）。默认最新的完整一天。",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": {
              "query": "label_values(cf_analytics_daily_requests, date)",
              "refId": "StandardVariableQuery"
            },
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 2,
            "sort": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "🌐 全站（选定日期）",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "独立访问 IP（全站）",
          "description": "选定日期内访问过本 zone 的不同客户端 IP 数，跨域名去重。由 exporter 按 clientIP 维度拉取后本地去重得到 —— 原始 IP 不进指标。",
          "id": 101,
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max(cf_analytics_daily_client_ips{host=\"__total__\", date=\"$date\"})",
              "legendFormat": "IP",
              "refId": "A",
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "decimals": 0,
              "unit": "none",
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "独立访客（Cloudflare uniq）",
          "description": "Cloudflare 自己算的全站独立访客（edge 去重，口径不公开）。与左边的『独立访问 IP』来自两个不同数据集，数值接近但不会相等 —— 不要互相对账。",
          "id": 102,
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max(cf_analytics_daily_uniques{date=\"$date\"})",
              "legendFormat": "访客",
              "refId": "A",
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "green" },
              "decimals": 0,
              "unit": "none",
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "总请求数（全站）",
          "id": 103,
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max(cf_analytics_daily_requests{host=\"__total__\", date=\"$date\"})",
              "legendFormat": "请求",
              "refId": "A",
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "purple" },
              "decimals": 0,
              "unit": "none",
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "purple", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "有流量的域名数",
          "id": 104,
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "count(cf_analytics_daily_requests{host!=\"__total__\", date=\"$date\"} > 0)",
              "legendFormat": "域名",
              "refId": "A",
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "text" },
              "decimals": 0,
              "unit": "none",
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          }
        },
        {
          "type": "row",
          "title": "🔎 按域名（选定日期）",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 200,
          "collapsed": false
        },
        {
          "type": "bargauge",
          "title": "各域名的独立访问 IP 数",
          "description": "选定日期内，每个域名被多少个不同的客户端 IP 访问过。⚠️ 各域名之和 > 全站数：同一个 IP 经常访问多个子域，全站那格是跨域名再去重的。",
          "id": 201,
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "topk(15, max by (host) (cf_analytics_daily_client_ips{host!=\"__total__\", date=\"$date\"}))",
              "legendFormat": "{{host}}",
              "refId": "A",
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "continuous-BlPu" },
              "decimals": 0,
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "minVizWidth": 8,
            "valueMode": "color"
          }
        },
        {
          "type": "bargauge",
          "title": "各域名的请求量",
          "description": "选定日期内每个域名的请求数。与左图对照能看出「少数 IP 打很多请求」的域名 —— 通常是自建监控探测（Uptime Kuma / ArgoCD / Prometheus 抓外部端点），不是真实访客。",
          "id": 202,
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "topk(15, max by (host) (cf_analytics_daily_requests{host!=\"__total__\", date=\"$date\"}))",
              "legendFormat": "{{host}}",
              "refId": "A",
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "continuous-GrYlRd" },
              "decimals": 0,
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "minVizWidth": 8,
            "valueMode": "color"
          }
        },
        {
          "type": "table",
          "title": "域名明细（选定日期）",
          "description": "每域名的请求数与独立访问 IP 数，外加「人均请求数」= 请求数 / IP 数。这个比值越高越像机器人或自建探测。",
          "id": 203,
          "gridPos": { "h": 11, "w": 24, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (host) (cf_analytics_daily_client_ips{host!=\"__total__\", date=\"$date\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (host) (cf_analytics_daily_requests{host!=\"__total__\", date=\"$date\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (host) (cf_analytics_daily_requests{host!=\"__total__\", date=\"$date\"}) / max by (host) (cf_analytics_daily_client_ips{host!=\"__total__\", date=\"$date\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "C"
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "host", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "Time 3": true, "__name__": true },
                "renameByName": {
                  "host": "域名",
                  "Value #A": "独立 IP",
                  "Value #B": "请求数",
                  "Value #C": "人均请求"
                },
                "indexByName": { "host": 0, "Value #A": 1, "Value #B": 2, "Value #C": 3 }
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": { "show": false, "reducer": ["sum"], "fields": "" },
            "sortBy": [ { "displayName": "独立 IP", "desc": true } ]
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "filterable": true },
              "decimals": 0,
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "独立 IP" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "gradient" } },
                  { "id": "color", "value": { "mode": "continuous-BlPu" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "人均请求" },
                "properties": [
                  { "id": "decimals", "value": 1 },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "text", "value": null },
                        { "color": "yellow", "value": 50 },
                        { "color": "orange", "value": 200 }
                      ]
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "📈 趋势（忽略上方的日期选择）",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 },
          "id": 300,
          "collapsed": false
        },
        {
          "type": "barchart",
          "title": "全站每日独立访客（Cloudflare uniq · 14 天）",
          "description": "date 是标签不是时间戳，所以这里用柱状图按 date 排列，而不是 Prometheus 时间轴。窗口 14 天 —— 这个数据集的保留期比按域名那个长得多。",
          "id": 301,
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 27 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (date) (cf_analytics_daily_uniques)",
              "format": "table",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true }, "renameByName": { "Value": "独立访客" } } },
            { "id": "sortBy", "options": { "fields": {}, "sort": [ { "field": "date" } ] } }
          ],
          "options": {
            "xField": "date",
            "orientation": "auto",
            "showValue": "auto",
            "stacking": "none",
            "barWidth": 0.8,
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false },
            "tooltip": { "mode": "single" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "green" },
              "decimals": 0,
              "unit": "none",
              "custom": { "lineWidth": 1, "fillOpacity": 80, "axisPlacement": "auto" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "barchart",
          "title": "全站每日独立访问 IP / 请求数（7-8 天）",
          "description": "按域名数据集的保留期只有 1w1d，所以这里最多 7-8 根柱子；空白不是故障。请求数与 IP 数量级差得远，用双轴。",
          "id": 302,
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 27 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (date) (cf_analytics_daily_client_ips{host=\"__total__\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (date) (cf_analytics_daily_requests{host=\"__total__\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "B"
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "date", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "__name__": true },
                "renameByName": { "Value #A": "独立 IP", "Value #B": "请求数" }
              }
            },
            { "id": "sortBy", "options": { "fields": {}, "sort": [ { "field": "date" } ] } }
          ],
          "options": {
            "xField": "date",
            "orientation": "auto",
            "showValue": "auto",
            "stacking": "none",
            "barWidth": 0.8,
            "groupWidth": 0.7,
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "decimals": 0,
              "unit": "none",
              "custom": { "lineWidth": 1, "fillOpacity": 80, "axisPlacement": "auto" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "请求数" },
                "properties": [ { "id": "custom.axisPlacement", "value": "right" } ]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "🩺 采集健康",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 36 },
          "id": 400,
          "collapsed": true,
          "panels": [
            {
              "type": "stat",
              "title": "上次抓取",
              "description": "exporter 每 6h 调一次 Cloudflare API。红了看 alerts/cf-analytics-alerts.yaml 里几条告警的排查指引。",
              "id": 401,
              "gridPos": { "h": 4, "w": 8, "x": 0, "y": 37 },
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "${datasource}" },
                  "expr": "cf_analytics_scrape_success",
                  "legendFormat": "抓取",
                  "refId": "A",
                  "editorMode": "code",
                  "instant": true,
                  "range": false
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "mappings": [
                    { "type": "value", "options": { "0": { "text": "失败", "color": "red", "index": 0 }, "1": { "text": "正常", "color": "green", "index": 1 } } }
                  ],
                  "color": { "mode": "thresholds" },
                  "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "center",
                "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
                "textMode": "auto"
              }
            },
            {
              "type": "stat",
              "title": "数据年龄",
              "id": 402,
              "gridPos": { "h": 4, "w": 8, "x": 8, "y": 37 },
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "${datasource}" },
                  "expr": "time() - (cf_analytics_last_success_timestamp_seconds > 0)",
                  "legendFormat": "年龄",
                  "refId": "A",
                  "editorMode": "code",
                  "instant": true,
                  "range": false
                }
              ],
              "fieldConfig": {
                "defaults": {
