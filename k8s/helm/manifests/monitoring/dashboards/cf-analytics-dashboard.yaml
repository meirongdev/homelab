# Grafana Dashboard: Cloudflare 公网流量（按域名的访问 IP + 请求来源构成）
#
# 数据源: Prometheus ← cf-analytics-exporter（Cloudflare GraphQL Analytics API）
#   k8s/helm/manifests/monitoring/cf-analytics-exporter/
#
# 📖 **读数前先看 docs/reference/public-traffic-analysis.md** —— 分类法定义、
#    可信度分级、已知失真、常用 PromQL 配方都在那里，这里只放面板。
#
# ☠️ 三个 IP 数字含义不同，别混：
#   cf_analytics_daily_client_ips          全部去重（含爬虫、自监控、CF 预取）
#   cf_analytics_daily_client_ips_human    只数「发过疑似真人请求」的 IP  ← 通常你要的是这个
#   cf_analytics_daily_uniques             Cloudflare 自己算的 uniq（另一个数据集，别对账）
#   各 class 的 IP 数**不可相加**：同一 IP 可能既发浏览器请求又发 curl 请求。
#
# ⚠️ 两个窗口不一样长（Cloudflare 免费版保留期）：全站 uniques 14 天，按域名 7–8 天。
# ⚠️ date 是**标签不是时间戳** → 趋势图用 barchart + instant 查询，不要用时间轴。
#
# Auto-loaded via kube-prometheus-stack grafana-sc-dashboard sidecar
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cf-analytics-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  cf-analytics-overview.json: |-
    {
      "annotations": { "list": [] },
      "description": "Cloudflare 边缘视角的公网访问分析：每个域名有多少真实访客 IP、请求来自什么来源（真人/爬虫/自建监控）。⚠️ 自建监控约占全站请求 45%，读数前请看 docs/reference/public-traffic-analysis.md。按域名数据仅保留 7-8 天（免费版）。",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": true,
          "icon": "external link",
          "keepTime": true,
          "tags": ["curated"],
          "title": "📊 其他自建面板",
          "type": "dashboards"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "keepTime": true,
          "tags": [],
          "targetBlank": true,
          "title": "入口流量（Cloudflare 之后 · 按服务）",
          "type": "link",
          "url": "/d/ingress-traffic-overview/"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" },
            "hide": 2
          },
          {
            "name": "date",
            "label": "日期 (UTC)",
            "description": "只列出有按域名数据的日子（免费版对该数据集只保留 7-8 天）。默认最新的完整一天。",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": {
              "query": "label_values(cf_analytics_daily_requests, date)",
              "refId": "StandardVariableQuery"
            },
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 2,
            "sort": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "🌐 全站（选定日期）",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "疑似真人访客 IP",
          "description": "至少发过一次 browser/tool/unknown 请求的独立 IP —— 已剔除自建监控、已验证爬虫、自称爬虫、以及 Cloudflare 自己的 Early Hints 预取。⚠️ 尽力而为：伪装成浏览器的爬虫仍会算进来。",
          "id": 101,
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max(cf_analytics_daily_client_ips_human{host=\"__total__\", date=\"$date\"})",
              "refId": "A", "editorMode": "code", "instant": true, "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "green" },
              "decimals": 0, "unit": "none", "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "center",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "独立 IP 总数",
          "description": "不做任何剔除的去重 IP 数（含爬虫、自建监控、CF 预取）。与左边的差额就是被识别出来的非真人来源。",
          "id": 102,
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max(cf_analytics_daily_client_ips{host=\"__total__\", date=\"$date\"})",
              "refId": "A", "editorMode": "code", "instant": true, "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "decimals": 0, "unit": "none", "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "center",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "总请求数",
          "id": 103,
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max(cf_analytics_daily_requests{host=\"__total__\", date=\"$date\"})",
              "refId": "A", "editorMode": "code", "instant": true, "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "purple" },
              "decimals": 0, "unit": "none", "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "purple", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "center",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "自建监控占请求比",
          "description": "Uptime Kuma / Alertmanager 等自己的机器发的请求占比。它们走公网绕一圈回来，Cloudflare 无法区分，所以会被计入「访问量」。2026-08-14 实测 45%。",
          "id": 104,
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max(cf_analytics_daily_requests_by_class{host=\"__total__\", class=\"self_monitor\", date=\"$date\"}) / max(cf_analytics_daily_requests{host=\"__total__\", date=\"$date\"})",
              "refId": "A", "editorMode": "code", "instant": true, "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 0, "unit": "percentunit", "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.3 }, { "color": "orange", "value": 0.6 } ] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "center",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          }
        },
        {
          "type": "row",
          "title": "🧭 请求来源构成（选定日期）",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 200,
          "collapsed": false
        },
        {
          "type": "piechart",
          "title": "全站请求按来源",
          "description": "verified_bot = Cloudflare 反查 IP 验证过的爬虫（权威，伪造不了）· self_monitor = 我自己的机器 · cf_infra = Cloudflare 边缘的 Early Hints 预取 · unverified_bot = UA 自称爬虫但未验证（启发式）· tool = curl/脚本 · browser = UA 像浏览器（⚠️ 不等于真人）· unknown = 其余。定义见 docs/reference/public-traffic-analysis.md。",
          "id": 201,
          "gridPos": { "h": 9, "w": 8, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (class) (cf_analytics_daily_requests_by_class{host=\"__total__\", date=\"$date\"})",
              "legendFormat": "{{class}}",
              "refId": "A", "editorMode": "code", "instant": true, "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "decimals": 0, "unit": "none", "mappings": [],
              "custom": { "hideFrom": { "legend": false, "tooltip": false, "viz": false } }
            },
            "overrides": []
          },
          "options": {
            "pieType": "donut",
            "displayLabels": ["percent"],
            "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "values": ["value"] },
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "tooltip": { "mode": "single" }
          }
        },
        {
          "type": "bargauge",
          "title": "已验证爬虫按分类（全站）",
          "description": "Cloudflare 官方维护的验证爬虫名单，按 IP 归属反查确认，UA 伪造无效。空说明当天没有验证爬虫来访。",
          "id": 202,
          "gridPos": { "h": 9, "w": 8, "x": 8, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sort_desc(sum by (category) (cf_analytics_daily_bot_requests{date=\"$date\"}))",
              "legendFormat": "{{category}}",
              "refId": "A", "editorMode": "code", "instant": true, "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "continuous-YlRd" },
              "decimals": 0, "unit": "none", "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient", "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true, "minVizWidth": 8, "valueMode": "color"
          }
        },
        {
          "type": "table",
          "title": "域名 × 来源（请求数）",
          "description": "透视表：每个域名的请求分别来自哪些来源。请求数可以横向相加（IP 数不行）。",
          "id": 203,
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (host, class) (cf_analytics_daily_requests_by_class{host!=\"__total__\", date=\"$date\"})",
              "format": "table", "instant": true, "range": false,
              "refId": "A", "editorMode": "code"
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "date": true } } },
            { "id": "groupingToMatrix", "options": { "columnField": "class", "rowField": "host", "valueField": "Value" } }
          ],
          "options": { "showHeader": true, "cellHeight": "sm" },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "filterable": true },
              "decimals": 0,
              "color": { "mode": "continuous-BlYlRd" },
              "custom.cellOptions": { "type": "color-text" },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "🔎 按域名（选定日期）",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 },
          "id": 300,
          "collapsed": false
        },
        {
          "type": "bargauge",
          "title": "各域名的疑似真人访客 IP 数",
          "description": "已剔除自建监控与爬虫。⚠️ 各域名之和 > 全站数：同一个 IP 常访问多个子域，全站那格是跨域名再去重的。",
          "id": 301,
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "topk(15, max by (host) (cf_analytics_daily_client_ips_human{host!=\"__total__\", date=\"$date\"}))",
              "legendFormat": "{{host}}",
              "refId": "A", "editorMode": "code", "instant": true, "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "continuous-BlPu" },
              "decimals": 0, "unit": "none", "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient", "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true, "minVizWidth": 8, "valueMode": "color"
          }
        },
        {
          "type": "bargauge",
          "title": "各域名的请求量",
          "description": "含全部来源。与左图落差大的域名通常是自建监控在刷（见下表「自监控占比」列）。",
          "id": 302,
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "topk(15, max by (host) (cf_analytics_daily_requests{host!=\"__total__\", date=\"$date\"}))",
              "legendFormat": "{{host}}",
              "refId": "A", "editorMode": "code", "instant": true, "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "continuous-GrYlRd" },
              "decimals": 0, "unit": "none", "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient", "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true, "minVizWidth": 8, "valueMode": "color"
          }
        },
        {
          "type": "table",
          "title": "域名明细",
          "description": "「真人 IP = 0」而请求上千的域名，说明它只被你自己的监控访问 —— 例如 argocd/vault/auth。这与 decisions/slo-availability-targets.md 里「真实流量≈0」的结论一致。",
          "id": 303,
          "gridPos": { "h": 11, "w": 24, "x": 0, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (host) (cf_analytics_daily_client_ips_human{host!=\"__total__\", date=\"$date\"})",
              "format": "table", "instant": true, "range": false, "editorMode": "code", "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (host) (cf_analytics_daily_client_ips{host!=\"__total__\", date=\"$date\"})",
              "format": "table", "instant": true, "range": false, "editorMode": "code", "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (host) (cf_analytics_daily_requests{host!=\"__total__\", date=\"$date\"})",
              "format": "table", "instant": true, "range": false, "editorMode": "code", "refId": "C"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (host) (cf_analytics_daily_requests_by_class{host!=\"__total__\", class=\"self_monitor\", date=\"$date\"}) / max by (host) (cf_analytics_daily_requests{host!=\"__total__\", date=\"$date\"})",
              "format": "table", "instant": true, "range": false, "editorMode": "code", "refId": "D"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (host) (cf_analytics_daily_requests_by_class{host!=\"__total__\", class=~\"verified_bot|unverified_bot\", date=\"$date\"}) / max by (host) (cf_analytics_daily_requests{host!=\"__total__\", date=\"$date\"})",
              "format": "table", "instant": true, "range": false, "editorMode": "code", "refId": "E"
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "host", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "Time 3": true, "Time 4": true, "Time 5": true, "__name__": true },
                "renameByName": {
                  "host": "域名",
                  "Value #A": "真人 IP",
                  "Value #B": "IP 总数",
                  "Value #C": "请求数",
                  "Value #D": "自监控占比",
                  "Value #E": "爬虫占比"
                },
                "indexByName": { "host": 0, "Value #A": 1, "Value #B": 2, "Value #C": 3, "Value #D": 4, "Value #E": 5 }
              }
            }
          ],
          "options": {
            "showHeader": true, "cellHeight": "sm",
            "sortBy": [ { "displayName": "真人 IP", "desc": true } ]
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "filterable": true },
              "decimals": 0,
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "真人 IP" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "gradient" } },
                  { "id": "color", "value": { "mode": "continuous-BlPu" } }
                ]
              },
              {
                "matcher": { "id": "byRegexp", "options": ".*占比" },
                "properties": [
                  { "id": "unit", "value": "percentunit" },
                  { "id": "decimals", "value": 0 },
                  { "id": "custom.cellOptions", "value": { "type": "color-background", "mode": "gradient" } },
                  {
                    "id": "thresholds",
                    "value": { "mode": "absolute", "steps": [ { "color": "text", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "orange", "value": 0.9 } ] }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "📈 趋势（忽略上方的日期选择）",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 36 },
          "id": 400,
          "collapsed": false
        },
        {
          "type": "barchart",
          "title": "每日：真人 IP vs IP 总数（7-8 天）",
          "description": "两根柱子的差额 = 被识别出来的爬虫 + 自建监控 + CF 预取。窗口受免费版保留期限制,只有 7-8 天,空白不是故障。",
          "id": 401,
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 37 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (date) (cf_analytics_daily_client_ips_human{host=\"__total__\"})",
              "format": "table", "instant": true, "range": false, "editorMode": "code", "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (date) (cf_analytics_daily_client_ips{host=\"__total__\"})",
              "format": "table", "instant": true, "range": false, "editorMode": "code", "refId": "B"
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "date", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "__name__": true },
                "renameByName": { "Value #A": "真人 IP", "Value #B": "IP 总数" }
              }
            },
            { "id": "sortBy", "options": { "fields": {}, "sort": [ { "field": "date" } ] } }
          ],
          "options": {
            "xField": "date", "orientation": "auto", "showValue": "auto", "stacking": "none",
            "barWidth": 0.8, "groupWidth": 0.7,
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "decimals": 0, "unit": "none",
              "custom": { "lineWidth": 1, "fillOpacity": 80, "axisPlacement": "auto" },
              "mappings": [],
