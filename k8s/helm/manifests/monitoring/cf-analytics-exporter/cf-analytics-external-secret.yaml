---
# cf-analytics-exporter 的 Cloudflare API token —— Vault ← ESO。
#
# ⚠️ 为什么要单独一份：k8s Secret **不跨 namespace**。同一把 token 已经由
# k8s/helm/manifests/external-dns/external-dns-secret.yaml 取到 external-dns ns，
# 但 monitoring ns 的 pod 引用不到它（`secretKeyRef` 只在本 ns 解析，且不会报错——
# pod 会卡在 CreateContainerConfigError，看起来像镜像问题）。所以这里指向**同一个
# Vault 路径**再取一份，而不是新建第二把 Cloudflare token。
#
# 权限：该 token 是 Zone 级，已含 Zone > Analytics > Read（2026-08-15 实测可读
# httpRequests1dGroups 的 uniques 与 httpRequestsAdaptiveGroups 的 clientIP/host）。
# 轮换 token 时改 Vault 里的 secret/homelab/external-dns，两份 ExternalSecret 会
# 在各自 refreshInterval(1h) 内自动跟上。
#
# Vault: secret/homelab/external-dns  property=api_token
#        （homelab ClusterSecretStore vault-backend，path=secret，KV v2）
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-analytics-cloudflare
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cf-analytics-cloudflare
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: homelab/external-dns
        property: api_token
