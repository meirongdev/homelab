# json-exporter —— prometheus-community 的通用 JSON→指标转换器，当前唯一用途是
# 把 Mac OMLX（mbp-m2-pro，Tailscale 100.89.15.120:8000）的运行状态变成可抓取指标。
#
# 端点与口径 / 面板 / 陷阱 → docs/reference/omlx-inference-metrics.md（唯一真相源）
# 模块配置 → json-exporter-cm.yaml   抓取配置 → k8s/helm/values/kube-prometheus-stack.yaml
# 面板 → dashboards/omlx-dashboard.yaml
#
# 抓取形态是 blackbox 那一套：Prometheus 抓 **本 Service 的 /probe?module=…&target=…**，
# 由本 Pod 去打 Mac。因此 `up{job="omlx-*"}` = 「exporter 活着 **且** OMLX 应答」，
# 两者分不开（本 Pod 挂了和 Mac 合盖了看起来一样）。
#
# ☠️ **必须钉控制面**：worker-106 是 tagged-device，netmap 里没有 Mac 这个源
#    （同 litellm 的约束，见 manifests/litellm/litellm.yaml 的 nodeSelector 注释）。
#    调度到 worker 会 100% 抓不到，且表现为 target down 而不是报错。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: json-exporter
  namespace: monitoring
  labels: { app: json-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: json-exporter }
  template:
    metadata:
      labels: { app: json-exporter }
    spec:
      # 非核心：控制面内存吃紧时优先被挤掉（面板缺一格 ≪ 业务被 OOM）。
      priorityClassName: bulk
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: json-exporter
          # quay.io/prometheuscommunity/json-exporter:v0.8.0 @ 2026-08-13（多架构 index digest）
          image: quay.io/prometheuscommunity/json-exporter@sha256:3aad20d41a0b31dfaaf7ab1a091440e92a82a61ef68b76750eac0ad50a983652
          args: ["--config.file=/config/config.yml"]
          ports:
            - { name: http, containerPort: 7979 }
          # ⚠️ 探针只探「自己在监听吗」：/metrics 是 exporter 自身指标，不打 Mac。
          #    刻意**不**探 /probe —— 那是台会合盖睡觉的笔记本，拿它当 readiness 会让
          #    Mac 一睡就把 exporter 判死、连 up=0 这条信息都抓不到。
          readinessProbe:
            httpGet: { path: /metrics, port: http }
            periodSeconds: 30
          livenessProbe:
            httpGet: { path: /metrics, port: http }
            periodSeconds: 60
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
          resources:
            requests: { cpu: "10m", memory: "24Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: json-exporter-config }
---
apiVersion: v1
kind: Service
metadata:
  name: json-exporter
  namespace: monitoring
  labels: { app: json-exporter }
spec:
  selector: { app: json-exporter }
  ports:
    - { name: http, port: 7979, targetPort: http }
