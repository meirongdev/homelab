# OMLX API key —— Vault ← ESO，给 json-exporter 探 OMLX 的两个管理端点用（2026-09-30 起）。
# Vault: secret/homelab/omlx  property=api_key（homelab ClusterSecretStore path=secret, KV v2）。
# 产出 monitoring/json-exporter-omlx key=api-key，挂到 json-exporter 的 /secrets/omlx/，
# 被 json-exporter-cm.yaml 两个 omlx_* 模块的 `credentials_file` 引用。
#
# ⚠️ 同一个 key 也写在 Mac 的 ~/.omlx/settings.json（`auth.api_key`），**两边必须一致**；
#    轮换顺序与配法见 docs/reference/omlx-inference-metrics.md 的「鉴权」一节。
#    这边刷新后不用重启 pod：credentials_file 每次请求重读（本地实测改文件即生效）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: json-exporter-omlx
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: json-exporter-omlx
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: homelab/omlx
        property: api_key
