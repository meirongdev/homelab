apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jobs-sg

resources:
  - namespace.yaml
  - limits.yaml
  - rbac.yaml
  - pvc.yaml
  # 2026-08-03 重新启用：改为复用**已存在**的 Vault 路径 `secret/homelab/telegram`
  # （property bot_token，与告警共用同一个 bot），不再新造 secret/homelab/jobs-sg。
  # 因此无需任何手工写值，也不会重现之前「指向不存在的路径 → ExternalSecretNotReady
  # 持续告警 + ArgoCD 常驻 Degraded」那 40 分钟。
  # chat id / thread id 不是密钥，明文在 cronjob-report.yaml。
  - external-secret.yaml
  - cronjob-ingest.yaml
  - cronjob-enrich.yaml
  - cronjob-report.yaml
  - web.yaml
  - monitoring.yaml

# 镜像按 **manifest-list（OCI index）digest** 固定，不是某个架构的 digest ——
# 否则换架构就拉不到。homelab 是 amd64，但镜像同时构了 arm64，留着 oracle 迁移出口。
#
# Kyverno disallow-latest-tag 是 Enforce（不是 Audit），且策略 digest-aware：
# digest 与明确 tag 都放行，只拦 :latest。
#
# 升级镜像（只改这一行）：
#   TOKEN=$(curl -s "https://ghcr.io/token?scope=repository%3Ameirongdev%2Fjobs-sg%3Apull&service=ghcr.io" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $TOKEN" \
#     -H 'Accept: application/vnd.oci.image.index.v1+json' \
#     https://ghcr.io/v2/meirongdev/jobs-sg/manifests/sha-<short12> | grep -i docker-content-digest
#
# 当前 digest 与每次 bump 的理由都在下面 `images:` 块的注释里（按时间倒序链
# 「其前身」）。这里只留跨 bump 仍然成立的东西。
#
# 镜像里有 6 个二进制：4 个管线阶段（ingest/enrich/report/web，由 CronJob 和
# Deployment 拉起）+ 2 个运维工具 **没有任何 CronJob 跑它们**、靠一次性 Job 手动起：
#   jobs-sg-reclassify — 重放归档重算分类（is_swe/role_family/seniority/work_mode）
#   jobs-sg-retech     — 重放归档重算规则层技术栈（job_tech 的 source='rule'）
# 两者都**默认 dry-run**、`--apply` 才写，都要挂 jobs-sg-data 到 /data（可写）。
# 之所以必须进镜像：要 replay 的归档在节点 local-path 卷上、几百 MB，
# 「拷到本地跑」不是真选项。用法见 docs/reference/jobs-sg.md。
#
# eaf5db1（2026-08-08）修的是 reclassify 的缺口指标口径。
# 线上首次 dry-run 报「archived but not in jobs.db 190418」，看着像丢了 19 万条，
# 实际一条没丢 —— ingest 归档整块板但只有 IsCandidate 的才入库，那 19 万是新加坡
# 市场里的非 SWE 岗位，本来就不该入库；而且数的是**记录**不是岗位（每轮 reconcile
# 重归档整板，同一岗位出现几十次）。现在分成两行、按 uuid 去重：非候选（预期）与
# **候选却不在库里**（真缺口，另给警告）。后者才是「partial 那几轮丢了什么」的答案。
#
# 其前身 b6a3aaa（2026-08-08）：镜像里多了第 5 个二进制
# `jobs-sg-reclassify` —— 运维工具，**没有任何 CronJob 跑它**，靠一次性 Job 手动起。
# 它把 raw 归档重放一遍、用当前分类器重算 work_mode / role_family / seniority /
# is_swe / company_type，零 API 调用。之所以必须进镜像：要 replay 的归档在节点
# local-path 卷上、几百 MB，"拷到本地跑"不是真选项。
# **默认 dry-run**，`--apply` 才写；只写派生列，生命周期四列（closed_at /
# last_seen_at / first_seen_at / miss_count）绝不触碰。用法见
# docs/reference/jobs-sg.md 的「重放归档重算分类」。
#
# 其前身 730c6f3（2026-08-08）：写事务撞锁会重跑，不再把整轮标成 partial。
# 一次手动 ingest 里 13600 条只有 1 条 upsert 撞上 SQLITE_BUSY（对手是**只读**的
# web pod，它正在渲染聚合页），整轮就成了 partial。**加大 busy_timeout 没用**：
# rollback journal 下写者提交要把 RESERVED 升级成 EXCLUSIVE，此刻若仍有读者持
# SHARED，SQLite 立即返回 SQLITE_BUSY 而**不调用 busy handler**（在那儿睡可能死锁）
# —— 我们设的是 10s，照样输，唯一出路是重跑整个事务。
# 代价不对称才是重点：partial 的 reconcile 会**整个跳过关闭逻辑**，周日那轮 20 分钟
# 全 board walk 撞一次锁就静默损失一周的岗位寿命数据。
#
# 其前身 af34eed（2026-08-08）：在 90cd4e8 之上只多一个修复 ——
# work_mode 不再拿排班字段冒充办公地点。MCF 的 flexibleWorkArrangements 是**排班**
# 字段（500 条实测样本里只有 37 条带它，唯一的地点信号 Telecommuting 占 3 条，其余
# 全是 Flexi-Hours / Employees Choice of Days Off 之类），而旧代码匹配的
# remote/hybrid/onsite 一个都不存在，于是全部落到兜底 Onsite —— 首页与周报上那个
# 「办公模式分布」是编造出来的，等同于「值缺失就填 0」。现在没有地点信号就返回
# **Unknown**。
# ⚠️ 上线后**不会立刻变**：work_mode 由 ingest 的 upsert 重写，web 只读。要等下一轮
# 抓取；周日那轮 reconcile 走全board，会把所有在架岗位一次性刷新。已关闭/归档的
# 历史行与 weekly_metric 里已物化的历史周**不会追溯变对**。
#
# 其前身 90cd4e8（2026-08-08 升级，跨 81 个 commit 从 ff5e24e 跳上来）。
# 这一跳**不是只换镜像**，同批必须改的两处（漏了就是静默故障）：
#   ① `/metrics` 拆到独立监听器 9090 —— web.yaml 加 `--metrics-addr :9090` 与
#     `metrics` 端口、Service 开 9090、monitoring.yaml 的 ServiceMonitor 抓
#     `port: metrics`。只换 digest 会让 8080 上的 /metrics 变 404 →
#     operator 照旧抓 http → **指标全断且不报错**，所有告警一起变瞎。
#     副作用是好的：https://jobs.meirong.dev/metrics 从此**必须**是 404。
#   ② 两条告警随上游改：JobsSgIngestStale 同时匹配 incremental|full_reconcile
#     （周日那轮记成 full_reconcile，旧规则每周误报 ~12h）；
#     JobsSgEnrichBacklog（绝对值 >2000）→ JobsSgEnrichBacklogGrowing（地板抬升）。
#
# 指标改名（上游 04-operations §3.1）：`jobs_sg_jobs_total`→`jobs_sg_jobs`、
# `jobs_sg_jobs_new_total{week=}`→`jobs_sg_jobs_new`（去掉 week 标签，否则每周新增
# 一条永不退休的 series）、`jobs_sg_unmapped_tech_total`→`jobs_sg_unmapped_tech`。
# homelab 侧没有任何查询引用这三个（告警只用 last_success / ingest_errors_total /
# enrich_backlog，Grafana 面板本来就没做），所以改名无影响 —— 但**以后建面板用新名**。
#
# 内容上带来求职者向站点：`/` 实时市场快照、`/companies`、`/pay`、`/tech`、`/daily`，
# 周报重建在 metric 层；顺带修 store 重复关闭 MCF 仍在挂的岗位、回架岗位 reopen、
# 周日 reconcile 不再重归档整块板、丢岗位记 partial、web 并发构同页合并。
#
# schema 变化只有 4 条 `CREATE INDEX IF NOT EXISTS`（无新表/新列），**但 web 是
# 只读挂载、不跑 Migrate**：索引由下一次 ingest/enrich/report 建。sync 后到
# 18:15 UTC(02:15 SGT) 那轮 ingest 之间，新页面在 ~86k 行上全表扫且 CPU 限 200m
# → 手动补一次 `kubectl -n jobs-sg create job --from=cronjob/ingest ingest-migrate-1`
# 即可提前建好索引。
#
# 其前身 ff5e24e（修「/daily 天天 partial」两个根因：newPostingDate 是纯日期、
# 按 RFC3339 解析全部静默失败使增量早停成死代码；enrich_done 完成标记表补上
# 「处理过但零命中」的表达，~1.4k 条永久积压随首个 enrich run 经缓存排空）、
# 8259cba（Telegram message_thread_id 改发数字）、d45c8f6（/daily 统计页）。
#
# 其前身 472aaf5 加了 LLM_THINKING 开关。清单里**不设** LLM_THINKING
# （= 默认开 reasoning，保精度）；啃积压走一次性 Job，
# 见 docs/reference/jobs-sg.md 的「一次性积压回填」。
#
# 其前身 a17d39d 修的是超时：更早的镜像硬编码 60s，而真实调用要 66.5s
# → 几乎每条都超时 fail-open，排空只有 2.1 条/分钟。
#
# **不要回滚**：早于 738cb98 的镜像按每条岗位重扫整个归档（规则层 14 分钟只处理
# 75 条、CPU 顶满）；早于 2d7b9ad 的镜像 ingest 一律 panic。
# 三个坑的实测数据都在 docs/reference/jobs-sg.md。
images:
  - name: ghcr.io/meirongdev/jobs-sg
    # 73aa949 (2026-08-24)：规则层技术栈假阳性收口（8b3040a + dry-run 修复
    # 73aa949，一起上）。三个缺陷，两个会让「修好了」变成假的：
    #   ① 别名同时是普通英文词 → 大面积假阳性（`express` 精度 25% —— 命中的是
    #      Meta 简介 "express themselves" 和猎头签名档 "Recruit Express Pte Ltd"；
    #      `go` 65% —— "go-to-market"/"go-live"/"go-getter"）。加**词义门**：这类
    #      别名只在技术枚举上下文里算命中。上门后 express 5/5、go 16/17。
    #   ② `Seed()` 原是纯 upsert，而 `LoadTaxonomy` 读**表**不读代码 → 从
    #      `techSeeds` 删别名对已存在的库是空操作，别名照样命中。现在 Seed 会剪枝。
    #      ⚠️ 代价：手工 INSERT 进 tech_taxonomy 的别名会被下次 ingest/enrich 清掉。
    #   ③ enrich 积压跳过做过的岗位 → 改别名修不了历史。新增第 6 个二进制
    #      `jobs-sg-retech`（运维工具，无 CronJob）重放规则层，默认 dry-run。
    # ⚠️ **只换 digest 不修历史**，要两步收尾（都在 docs/reference/jobs-sg.md）：
    #   1. `jobs-sg-retech --apply` —— 已富化的 6749 条岗位仍带旧的假阳性行
    #      （实测 811 条要改）。`/`、`/tech`、`/pay` 随请求渲染，跑完立即正确。
    #   2. **`report --week` 逐周重算** —— `weekly_metric` 是物化的，retech 不碰。
    #      当前 3 周有 tech_freq：2026-08-03 / 08-10 / 08-17，三周的 `go` 都是靠
    #      假阳性挤进 top-30 的（rule 层报 132/95/152，独立的 LLM 层只认 49/42/65；
    #      修完 rule 变 47/40/73，三周全部掉出榜、让位给 kafka）。
    #      ⚠️ 重算历史周要用**不带 Telegram env 的 Job**（cmd/report 的推送是
    #      env-driven、unset 即跳过）—— `--from=cronjob/report` 会把 env 一起抄过来，
    #      等于把三份历史周报重新推一遍进 Telegram。
    # 顺带删了实测 100% 假阳性的三个别名：`ts`（命中 "IMDA TS RG-SEC"、URL 的
    # `?ts=`）、`pg`（幼儿园 playgroup "PG/Nursery Class"）、`tf`（`.tf` 是
    # Terraform 不是 TensorFlow）—— 三者各有无歧义别名覆盖真实情况。
    #
    # 73aa949 修的是 8b3040a 自己带的一个坑：retech 的 dry-run 路径也调 `Seed()`，
    # 而同一批改动刚让 Seed 会剪枝 → 「只报告不写库」实际改了 tech_taxonomy
    # （110→109 行）。现在 replay 读 `store.TechSeeds()`，`Seed()` 只在 --apply
    # 路径跑；实测 dry-run 前后三张表内容哈希一致。**别回滚到 8b3040a** ——
    # 那个版本的 dry-run 不是只读的。
    #
    # 其前身 4b91fe8 (2026-08-10 晚)：对账关闭闸门改读覆盖率 scanned/max(total) ≥ 80%
    # （2% 偏差对 ±10% 的 total 噪声带量级不配，末页凹陷会反向误跳）；且干净
    # 扫描的对账轮（含 close_skipped）照常盖 incremental 新鲜戳 —— 谨慎的周日
    # 不再点着 JobsSgIngestStale。
    #
    # 其前身 4af8944 修的是把关闭流程整个卡死的偏差守卫（拿全程峰值比逐页累加
    # 和，11580 条岗位一条没关）；该版起 ingest_run 多写 5 个审计列
    # （jobs_scanned/total_reported/total_min/total_max/close_skipped），由
    # store.addedColumns 在写者启动时 ALTER 补上。
    # ⚠️ 回滚到早于 4af8944 的镜像是安全的（多出来的列不碍旧代码），但审计列
    # 停更、/metrics 的 reconcile 偏差/覆盖率指标消失。
    digest: sha256:b2bf9299abd6418c009951cb6be359007797c3252d4bdda616816a86c0a2fa00
