apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jobs-sg

resources:
  - namespace.yaml
  - limits.yaml
  - rbac.yaml
  - pvc.yaml
  # ⚠️ external-secret.yaml 刻意**未注册** —— Vault 里 secret/homelab/jobs-sg 还没写。
  # ESO 对不存在的路径会一直 Ready=False，而 eso-alerts.yaml 的 ExternalSecretNotReady
  # (for: 15m) 会因此**持续告警**、ArgoCD 应用也一直 Degraded。2026-08-03 首次上线就这么
  # 响了 40 分钟。写完 Vault 再把下面这行取消注释即可（文件本身已就绪）：
  #   vault kv put secret/homelab/jobs-sg bifrost-vk=... telegram-bot-token=... \
  #     telegram-chat-id=-1003981213530 telegram-thread-id=''
  # 未注册期间唯一影响：周报不推 Telegram（HTML/MD 照常生成、站点照常服务；
  # LLM 富化直连 DGX，不用 bifrost-vk）。
  # - external-secret.yaml
  - cronjob-ingest.yaml
  - cronjob-enrich.yaml
  - cronjob-report.yaml
  - web.yaml
  - monitoring.yaml

# 镜像按 **manifest-list（OCI index）digest** 固定，不是某个架构的 digest ——
# 否则换架构就拉不到。homelab 是 amd64，但镜像同时构了 arm64，留着 oracle 迁移出口。
#
# Kyverno disallow-latest-tag 是 Enforce（不是 Audit），且策略 digest-aware：
# digest 与明确 tag 都放行，只拦 :latest。
#
# 升级镜像（只改这一行）：
#   TOKEN=$(curl -s "https://ghcr.io/token?scope=repository%3Ameirongdev%2Fjobs-sg%3Apull&service=ghcr.io" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $TOKEN" \
#     -H 'Accept: application/vnd.oci.image.index.v1+json' \
#     https://ghcr.io/v2/meirongdev/jobs-sg/manifests/sha-<short12> | grep -i docker-content-digest
#
# 当前 = jobs-sg 472aaf5（"feat(llm): LLM_THINKING toggle to skip chain-of-thought"）。
# 清单里**不设** LLM_THINKING（= 默认开 reasoning，保精度）；啃积压走一次性 Job，
# 见 docs/reference/jobs-sg.md 的「一次性积压回填」。
#
# 其前身 a17d39d 修的是超时：更早的镜像硬编码 60s，而真实调用要 66.5s
# → 几乎每条都超时 fail-open，排空只有 2.1 条/分钟。
#
# **不要回滚**：早于 738cb98 的镜像按每条岗位重扫整个归档（规则层 14 分钟只处理
# 75 条、CPU 顶满）；早于 2d7b9ad 的镜像 ingest 一律 panic。
# 三个坑的实测数据都在 docs/reference/jobs-sg.md。
images:
  - name: ghcr.io/meirongdev/jobs-sg
    digest: sha256:188f1a5c2b6968a398f03aada29ade10833dcafd98a842ae49566f14f169c78c
