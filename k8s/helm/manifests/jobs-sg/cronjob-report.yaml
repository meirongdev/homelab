---
# 周一 09:00 SGT = 01:00 UTC 出周报 + 推 Telegram。
#
# 三个 TELEGRAM_* 都标 optional：Vault 未写时 report 打一行
# "telegram disabled (env unset)" 后照常生成 HTML/MD（web 依然有内容可服务），
# 而不是整个 Job 起不来。telegram-thread-id 为空 = 发到群的 General 话题。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: jobs-sg
spec:
  schedule: "0 1 * * 1"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: jobs-sg
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: report
              image: ghcr.io/meirongdev/jobs-sg
              command: ["/usr/local/bin/jobs-sg-report"]
              args: ["--data-dir", "/data", "--base-url", "https://jobs.meirong.dev"]
              env:
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: jobs-sg-secrets
                      key: telegram-bot-token
                      optional: true
                - name: TELEGRAM_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: jobs-sg-secrets
                      key: telegram-chat-id
                      optional: true
                - name: TELEGRAM_THREAD_ID
                  valueFrom:
                    secretKeyRef:
                      name: jobs-sg-secrets
                      key: telegram-thread-id
                      optional: true
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 384Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: jobs-sg-data
