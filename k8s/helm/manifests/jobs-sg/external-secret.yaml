---
# ⚠️ **本文件当前未在 kustomization.yaml 里注册**，所以不会被部署。
# 原因：Vault 里 secret/homelab/jobs-sg 还没写，ESO 对不存在的路径会一直 Ready=False，
# 触发 eso-alerts.yaml 的 ExternalSecretNotReady(for: 15m) 持续告警 + ArgoCD 常驻 Degraded。
# 启用步骤：① 先写 Vault（命令见下）② 再把 kustomization.yaml 里那行取消注释。
# 顺序反了会再响一次。
#
# Vault → jobs-sg-secrets：**只有 report 的 Telegram 凭据**。
# LLM 富化直连 DGX vLLM（`cronjob-enrich.yaml` 的 LLM_BASE_URL），不经 Bifrost，
# 所以**不需要 bifrost-vk** —— 这是 2026-08-03 定下的接法，别再把它加回来。
#
# ⚠️ ESO 的 `data` 是全有全无的：Vault 里缺任何一个 property，整个 Secret 同步失败。
# 所以下面三个键必须都存在（`telegram-thread-id` 允许是空串 —— 空 = 发到群的
# General 话题，见 jobs-sg internal/report/telegram.go 的 ThreadID 注释）。
# 正因为这条，声明了却不用的键是**有害的**：多声明一个 bifrost-vk 就等于多一个
# 必须写进 Vault 的值，否则整个 Secret 同步不了。
#
# 写入方式：
#   vault kv put secret/homelab/jobs-sg \
#     telegram-bot-token='<与 secret/homelab/telegram 的 bot_token 同一个>' \
#     telegram-chat-id='-1003981213530' \
#     telegram-thread-id='<内容话题的 thread id>'
#
# chat-id 与告警用的是**同一个群**（MatthewDaily / forum），只靠 thread id 区分话题：
# 告警在 thread 2（🚨 Homelab 告警），周报应投到另一个内容话题。thread id 取法：
# Telegram 里右键话题 → 复制链接，`t.me/c/<内部 id>/<thread_id>` 的第二个数字。
#
# 若日后要切回 Bifrost：把 LLM_BASE_URL 改回 bifrost.bifrost.svc、删掉 LLM_MODELS，
# 并在这里补回 bifrost-vk 一项 + 同步写进 Vault（VK 只能在 Bifrost UI 建，
# 持久化在其 PVC 的 SQLite，不在 git；集群内走 svc 也要带 VK，绕不过 governance PreHook）。
#
# 消费侧的 secretKeyRef 都标了 optional: true：Vault 还没写时 Pod 照常启动并降级
# （report 打 "telegram disabled"，照常生成 HTML/MD），而不是 CreateContainerConfigError
# 卡住整条流水线。同 backup/overlays/homelab/open-notebook-external-secret.yaml 的取舍。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jobs-sg-secrets
  namespace: jobs-sg
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jobs-sg-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: telegram-bot-token
      remoteRef: { key: homelab/jobs-sg, property: telegram-bot-token }
    - secretKey: telegram-chat-id
      remoteRef: { key: homelab/jobs-sg, property: telegram-chat-id }
    - secretKey: telegram-thread-id
      remoteRef: { key: homelab/jobs-sg, property: telegram-thread-id }
