---
# Vault → jobs-sg-secrets：**只有 bot token**，且复用**已存在**的
# `secret/homelab/telegram`（property `bot_token`）—— 与 homelab Alertmanager、krr、
# oracle falcosidekick 共用同一个 bot。所以**不需要新建任何 Vault 路径、不需要手工写值**。
#
# 这是本仓库既有的分工，照抄即可（见 decisions/alerting-telegram-migration.md、
# reference/security.md）：
#   · token          → Vault + ESO（是密钥）
#   · chat id / thread id → 清单里明文（**不是密钥**，就是两个 ID）
# Alertmanager 就是这么做的（`chatID: -1003981213530` / `messageThreadID: 2` 直接写在
# alertmanager-config.yaml 里），falco 也是（明文配在 values/falco.yaml）。
# 所以 jobs-sg 的 chat id / thread id 在 cronjob-report.yaml 里明文给，不进这里。
#
# 因为引用的路径**已经存在并且在线同步**（alertmanager-telegram 长期 SecretSynced=True），
# 本文件可以直接注册，不会像之前那样出现「指向不存在的 Vault 路径 → ExternalSecretNotReady
# 持续告警 + ArgoCD 常驻 Degraded」。之前那次是因为我新造了一个 secret/homelab/jobs-sg
# 路径却没人去写值。
#
# ⚠️ ESO 的 `data` 是全有全无的 —— 正因如此这里只声明真正需要的那一个键。
# 声明了却不用的键不是惰性的，是硬要求（2026-08-03 曾多声明一个网关 virtual key，
# 等于逼着启用 Telegram 时必须连一个用不到的值一起写进 Vault）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jobs-sg-secrets
  namespace: jobs-sg
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jobs-sg-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: telegram-bot-token
      remoteRef: { key: homelab/telegram, property: bot_token }
