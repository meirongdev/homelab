---
# Vault → jobs-sg-secrets（enrich 的 Bifrost virtual key + report 的 Telegram 凭据）。
#
# ⚠️ ESO 的 `data` 是全有全无的：Vault 里缺任何一个 property，整个 Secret 同步失败。
# 所以四个键必须都存在（`telegram-thread-id` 允许是空串 —— 空 = 发到群的 General
# 话题，见 jobs-sg internal/report/telegram.go 的 ThreadID 注释）。
#
# 写入方式（Vault 里没有 `bifrost-vk` 时 enrich 仍 fail-open，只是退回纯规则模式）：
#   vault kv put secret/homelab/jobs-sg \
#     bifrost-vk='<Bifrost UI 里创建的 virtual key>' \
#     telegram-bot-token='<与 secret/homelab/telegram 的 bot_token 同一个>' \
#     telegram-chat-id='-1003981213530' \
#     telegram-thread-id=''
#
# Bifrost virtual key 只能在 Bifrost UI 建（持久化在其 PVC 的 SQLite，**不在 git**），
# 且集群内调用 bifrost.bifrost.svc 同样要带 VK —— governance PreHook 在入口之前生效，
# 走 svc 绕不过去。
#
# 消费侧的 secretKeyRef 全部标了 optional: true：Vault 还没写时 Pod 照常启动并降级
# （report 打 "telegram disabled"，enrich 退回规则模式），而不是 CreateContainerConfigError
# 卡住整条流水线。同 backup/overlays/homelab/open-notebook-external-secret.yaml 的取舍。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jobs-sg-secrets
  namespace: jobs-sg
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jobs-sg-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: bifrost-vk
      remoteRef: { key: homelab/jobs-sg, property: bifrost-vk }
    - secretKey: telegram-bot-token
      remoteRef: { key: homelab/jobs-sg, property: telegram-bot-token }
    - secretKey: telegram-chat-id
      remoteRef: { key: homelab/jobs-sg, property: telegram-chat-id }
    - secretKey: telegram-thread-id
      remoteRef: { key: homelab/jobs-sg, property: telegram-thread-id }
