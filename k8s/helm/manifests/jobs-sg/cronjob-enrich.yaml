---
# 每日技术栈富化（03:10 SGT = 19:10 UTC），排在 ingest 之后
# （baseline 全量扫描实测 29 分钟 / 884 页，所以 19:10 开始不会撞上）。
# fail-open：LLM 出错时保留规则结果并 exit 0；积压由 JobsSgEnrichBacklog 告警兜底。
#
# ⚠️ **直连 DGX vLLM，不经 Bifrost**：省掉 virtual key 这条 Vault 依赖。
# 模型 id 是后端相关的 —— Bifrost 路由用带 provider 前缀的名字
# （`custom_dgx/deepseek-v4-flash`），裸 vLLM 提供的是 `deepseek-v4-flash`，
# 写前缀名会 404。上游 2026-08-03 (d833623) 把模型链改成读 LLM_MODELS 后才可配。
# 实测（2026-08-03，jobs-sg ns 内的 pod）：DGX 可达、无需认证、`x-bf-vk` 头被忽略。
#
# 代价：没有 Bifrost 的 custom_m2 回退，也没有用量计量；DGX 是跨 tailnet 共享的
# 境内机器（RTT 66–83ms），不可用时 enrich fail-open 退回纯规则模式。
# （此前“切回 Bifrost”的改法已随 bifrost 2026-08-08 退役一并失效——直连 DGX 是当前
# 唯一形态，后续换 LLM 网关时另行规划。）
#
# BIFROST_VK 保留且标 optional：走 DGX 时它是空值且无害（vLLM 忽略该头），
# 留着让切回 Bifrost 只需改 base URL。Vault 未写时也不会 CreateContainerConfigError
# 卡死（见 external-secret.yaml）。
#
# activeDeadlineSeconds 3h + 并发 8。
#
# ⚠️ 并发**不是**性能瓶颈的答案 —— 2026-08-03 首次实测踩过这个坑：真正的瓶颈曾是
# 上游按「每条岗位重扫一遍归档」读描述（402MB 解压 × 每条），CPU 打满 500m limit、
# 14 分钟只处理 75 条；那时把并发从 3 提到 8 只是让更多 goroutine 抢同一份 CPU，
# 更慢。上游 738cb98 改成「每轮只扫归档一次」后：同一份归档、同样数据，规则层
# 75 条/14 分钟 → **4837 条/30 秒**，容器 CPU 降到 ~0%。
#
# 现在真正的瓶颈是 DGX 推理时间（实测真实岗位描述约 70s/条 —— 短 prompt 只要 15s，
# 真实描述长、deepseek 的 reasoning 输出也长）。并发 8 → 约 6.5 条/分钟，
# baseline 后约 4900 条积压要跑 ~4 个晚上收敛（每晚 3h 窗口约 1100 条，进度落库不丢）。
# 稳态每日新增几百条，约半小时跑完。
#
# 想更快只能加并发（现在 CPU 是空的，加并发确实有效）—— 但 DGX 是跨 tailnet 共享的
# 境内机器，同时在给 Open Notebook 供交互式推理，往上加会挤占它。8 是刻意保守的。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: enrich
  namespace: jobs-sg
spec:
  schedule: "10 19 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 10800
      # 历史回收的第二道闸，理由见 limits.yaml 的 count/pods 段（与 ingest 同款）。
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          serviceAccountName: jobs-sg
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: enrich
              image: ghcr.io/meirongdev/jobs-sg
              command: ["/usr/local/bin/jobs-sg-enrich"]
              args: ["--data-dir", "/data"]
              env:
                # DGX Spark vLLM（Tailscale IP，pod 直连；不是集群内 Service）。
                # 同一台机器也在给 Open Notebook 供模型，见 reference/open-notebook.md。
                - name: LLM_BASE_URL
                  value: http://100.97.87.120:8000
                # 裸 vLLM 的模型 id，不带 Bifrost 的 provider 前缀。
                - name: LLM_MODELS
                  value: deepseek-v4-flash
                - name: LLM_CONCURRENCY
                  value: "8"
                # ⚠️ 单次调用超时。上游原本硬编码 60s，而实测真实岗位描述一次要 **66.5s**
                # （2,326 字描述 / 497 prompt tokens / 937 completion tokens，reasoning 占大头）
                # —— 超时值恰好卡在真实耗时**下面**，是最糟的位置：几乎每次都差几秒超时，
                # 每条白烧 2×60s 后 fail-open 留在积压里，实测排空速率只有 2.1 条/分钟。
                # 且该端点非流式，生成完才回 header（错误信息是 "awaiting headers"），
                # 这个预算覆盖整个生成过程；客户端放弃也不会让服务端停止生成，白耗共享 GPU。
                # 显式写成 300s（= 上游 llm.DefaultTimeout），要调不用重新构镜像。
                - name: LLM_TIMEOUT
                  value: "300"
                # 这里**没有** BIFROST_VK：直连 DGX 不需要 virtual key，
                # external-secret.yaml 也不再声明该键。切回 Bifrost 时才需要补回
                # （改 LLM_BASE_URL + 删 LLM_MODELS + 两处加回 bifrost-vk）。
              # CPU limit 3000m：节点是 8 核 / 7600m allocatable，实测 idle 用量约 9%、
              # requests 合计仅 27%，容量宽裕（2026-08-03 核对）。
              #
              # ⚠️ 提高 CPU 只能加速**一次性的归档扫描**（500m 下约 150s → 3000m 下约 30s）。
              # 之后的 LLM 阶段实测 CPU 只有 1m —— 它在等 DGX 推理，不吃 CPU。
              # 也就是说：这条改动不会缩短占绝大部分时间的富化阶段，别指望它提速整体。
              # request 仍留 100m：这是每晚一次的批作业，不该常占调度配额。
              resources:
                requests: { cpu: 100m, memory: 192Mi }
                limits: { cpu: 3000m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: jobs-sg-data
