---
# 每日技术栈富化（03:10 SGT = 19:10 UTC），排在 ingest 之后
# （baseline 全量扫描实测 29 分钟 / 884 页，所以 19:10 开始不会撞上）。
# fail-open：LLM 出错时保留规则结果并 exit 0；积压由 JobsSgEnrichBacklog 告警兜底。
#
# ⚠️ **直连 DGX vLLM，不经 LLM 网关**：省掉 virtual key 这条 Vault 依赖。
# 模型 id 是后端相关的 —— 网关路由用带 provider 前缀的名字
# （`custom_dgx/qwen38-flash-next`），裸 vLLM 提供的是 `qwen38-flash-next`，
# 写前缀名会 404。上游 2026-08-03 (d833623) 把模型链改成读 LLM_MODELS 后才可配。
# ⚠️ 2026-09-02 DGX 换过主力模型（DeepSeek-V4-Flash → Qwen3.8-Flash-Next，ctx 1M→262k）。
#    本作业**直连** DGX，模型名不在 git 的网关清单里，只能靠改这里跟着换。
# 实测（2026-08-03，jobs-sg ns 内的 pod）：DGX 可达、无需认证、`x-bf-vk` 头被忽略。
#
# 代价：没有网关的 custom_m2 回退，也没有用量计量；DGX 是跨 tailnet 共享的
# 境内机器（RTT 66–83ms），不可用时 enrich fail-open 退回纯规则模式。
# 直连 DGX 是目前唯一形态（曾走 LLM 网关，已于 2026-08-08 随网关退役一并失效），
# 后续换路由时另行规划。
#
# 网关的 virtual key 环境变量不在此处：走 DGX 时它是空值且无害（vLLM 忽略该头）。
# Vault 未写时也不会 CreateContainerConfigError 卡死（见 external-secret.yaml）。
#
# activeDeadlineSeconds 3h + 并发 8。
#
# ⚠️ 并发**不是**性能瓶颈的答案 —— 2026-08-03 首次实测踩过这个坑：真正的瓶颈曾是
# 上游按「每条岗位重扫一遍归档」读描述（402MB 解压 × 每条），CPU 打满 500m limit、
# 14 分钟只处理 75 条；那时把并发从 3 提到 8 只是让更多 goroutine 抢同一份 CPU，
# 更慢。上游 738cb98 改成「每轮只扫归档一次」后：同一份归档、同样数据，规则层
# 75 条/14 分钟 → **4837 条/30 秒**，容器 CPU 降到 ~0%。
#
# 瓶颈是 DGX 推理时间，不在本作业这边。耗时按新模型回校过（上游 2026-09-03，
# 16 条真实岗位、并发 8）：开推理均值 18.7s / 最坏 58.7s / 15 条每分钟。
# 本仓库自己的口径：2026-09-03 那轮 244 条规则岗位、242 次 LLM 调用、35 分钟跑完
# （≈6.9 条/分钟）、超时 3 条（1.2%）。两个数不一致是**口径不同**（16 条抽样 vs 整轮
# 真实岗位，且共享 GPU 上还有别的租户），先照实记录，别拿其中一个替另一个。
# baseline 那 ~4900 条积压已排空（2026-09-03 `jobs_sg_enrich_backlog` = 3，
# 就是那轮超时的 3 条），所以"几个晚上收敛"这类排空预算从此不再适用。
# 进度逐条落库，中途被 activeDeadlineSeconds 杀掉不丢。
#
# 想更快只能加并发（现在 CPU 是空的，加并发确实有效）—— 但 DGX 是跨 tailnet 共享的
# 境内机器，同时在给 Open Notebook 供交互式推理，往上加会挤占它。8 是刻意保守的。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: enrich
  namespace: jobs-sg
spec:
  schedule: "10 19 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 10800
      # 历史回收的第二道闸，理由见 limits.yaml 的 count/pods 段（与 ingest 同款）。
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          serviceAccountName: jobs-sg
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: enrich
              image: ghcr.io/meirongdev/jobs-sg
              command: ["/usr/local/bin/jobs-sg-enrich"]
              args: ["--data-dir", "/data"]
              env:
                # DGX Spark vLLM（Tailscale IP，pod 直连；不是集群内 Service）。
                # 同一台机器也在给 Open Notebook 供模型，见 reference/open-notebook.md。
                - name: LLM_BASE_URL
                  value: http://100.97.87.120:8000
                # 裸 vLLM 的模型 id，不带网关的 provider 前缀。
                # ⚠️ 必须与 DGX 当前 serve 的模型同名，写错回 404（不是 401）。
                # 2026-09-02 由 deepseek-v4-flash 换为 qwen38-flash-next。
                # ☠️ 上游 0632049 起，换模型**只改这一行**（模型相关参数全部下沉成 LLM_*）：
                #    若新栈关思考的键名不是 enable_thinking，还要一起改 LLM_THINKING_KWARG。
                #    验收不用手写请求，上游带了一条默认跳过、不进 CI 的实测用例：
                #      LLM_LIVE_URL=http://100.97.87.120:8000 LLM_LIVE_MODEL=<新模型> \
                #        go test ./internal/llm -run Live -v
                #    它会真调一次并断言推理确实被关掉；挂了就换 LLM_LIVE_KWARG 试，
                #    试通的值就是要写进清单的那个。
                - name: LLM_MODELS
                  value: qwen38-flash-next
                - name: LLM_CONCURRENCY
                  value: "8"
                # 单次调用预算（= 上游 llm.DefaultTimeout，可配，不必重构镜像）。
                # 该端点非流式、生成完才回 header，所以这个预算覆盖**整个生成过程**
                # （错误信息里的 "awaiting headers" 就是它）；客户端放弃也不会让服务端
                # 停止生成，每次超时都白占一份共享 GPU。
                # ☠️ 历史上它曾**恰好卡在真实耗时下面**（硬编码 60s vs 旧模型实测 66.5s/条）：
                #    几乎每次都差几秒超时、每条白烧 2×60s，排空只剩 2.1 条/分钟，
                #    表现像"慢"不像"坏" —— 卡在边界上的超时最难发现。别把它调回 60。
                # 新模型实测（上游 2026-09-03）：均值 18.7s、最坏 58.7s。
                # ⚠️ 这个值只在推理被封顶时才有余量（封顶后实测最坏 22s，见下面
                # LLM_EXTRA_BODY）。没封顶时它没有余量可言：超时比例 1.2%（3/242）在
                # 2026-09-04 一夜之间变成 7.8%（21/269），而引擎读数与前夜一致
                # （每输出 token 0.043s、排队 0.06s、无抢占）。成因是推理跑飞，跑飞率随
                # 岗位长度上升（正文 <1500 字符 0/54，>3500 字符 15.9%）。
                # 调大这个值不解决问题：跑飞那条要 720s，而生成长度没有上界。
                - name: LLM_TIMEOUT
                  value: "300"
                # 关掉当场重试。留 0 的理由是推理封顶后本来就不该有超时；超时那几条是
                # fail-open 的，留在积压里第二天那轮也会再试。
                # ⚠️ 别沿用旧理由。本注释曾写"重试换回来的成功率几乎为 0"，那是 3 个样本
                # 得出的：把 2026-09-04 那轮超时的 21 条隔天重跑，16 条一次就过（76%）。
                # 同一条岗位每次都是重新抽签。封顶后若仍有残留超时，那时一次重试只值约
                # 20s（不再是 300s），改成 1 是便宜的保险。
                # 上游 runbook §5 结论一致：LLM_RETRIES=0 比加大超时或 LLM_MAX_TOKENS 封顶
                # 都划算 —— 封顶值必须落在很窄的带里（开推理正常抽取 p50 475 / p90 2631 /
                # max 4359 completion tokens），封低了模型先把推理写满、content 返回 null，
                # 一次慢成功变成硬失败。所以这里**不设** LLM_MAX_TOKENS。
                - name: LLM_RETRIES
                  value: "0"
                # 给推理封顶。qwen38-flash-next 会在个别岗位上把推理写飞，而 300s 换算成
                # token 只有约 7000：实测那条 OCBC 岗位不封顶要 16754 completion token
                # （16448 是推理，占 98.2%）、独占 GPU 跑 324s，夜里 8 并发折算约 720s。
                # 它的答案是对的，只是贵到 300s 内拿不到。
                # ☠️ 前任模型 deepseek-v4-flash 不出这个问题，靠的是自带天花板而不是速度
                # （它每 token 反而慢 50%）：三晚约 640 次调用 p99≈4700、无一超过 5000，
                # 刚好落在 300s 买得到的 ~4700 token 里边，余量≈0。2026-09-01 那晚 DGX 慢了
                # 70%、预算掉到 2737，当场挂 3 条。也就是说 300s 一直是贴着旧模型的分布
                # 上沿配的，换上会跑飞的模型后，这个值配多大都不够。
                #
                # 封顶只能封推理，不能封总输出：LLM_MAX_TOKENS 会让模型先把推理写满、
                # content 返回 null（实测 max_tokens=3000 → finish=length、content 空）。
                # ☠️ chat_template_kwargs 里的 thinking_budget / reasoning_max_tokens /
                # max_thinking_tokens 三个键全部静默无效（回 200、照样撞满上限）。
                # 生效的是顶层 reasoning_effort，经 LLM_EXTRA_BODY 透传（保留键只有
                # model/messages）。2026-09-04 实测：
                #   · 前一夜超时的 5 条 → 全部 8–22s 完成，抽词比默认更全（如 46→50 词）；
                #   · 8 条正常岗位 → 总耗时 244s→82s、推理 9763→3487 token，抽词几乎不变。
                # ⚠️ 换模型必须重验这个键。它的失效形态和别的键相反：值不被支持时回
                # HTTP 400（实测 minimal 就是），整轮全挂，而不是悄悄不生效。
                # 验收：`LLM_LIVE_URL=… LLM_LIVE_MODEL=… go test ./internal/llm -run Live -v`
                # 通过后，再对一条真实长岗位确认 reasoning_tokens 掉到几百量级。
                - name: LLM_EXTRA_BODY
                  value: '{"reasoning_effort":"medium"}'
                # 刻意**没有** LLM_THINKING —— 它是应急旋钮，不是常态配置：
                #  · 上游实测开推理 15 条/分钟，LLM_THINKING=false 是 154 条/分钟，
                #    代价是抽取略松（词仍过 tech_taxonomy 白名单，杂词落进 unmapped_tech）。
                #  · 现在没有积压要排（jobs_sg_enrich_backlog = 3），拿质量换速度不划算。
                #  · 键名旋钮是 LLM_THINKING_KWARG（默认 enable_thinking）。☠️ 换栈后旧键名
                #    `{"thinking":false}` 会回 200 但完全不生效；现在代码自己会打
                #    `reasoning was not disabled` 的 WARN，不再只能人肉比对 usage。
                # 真要应急排空：临时加 LLM_THINKING=false，排空后删掉（历史实测见
                # docs/reference/jobs-sg.md「真正的提速杠杆」）。
                # 这里**没有**网关的 virtual key：直连 DGX 不需要，
                # external-secret.yaml 也不再声明该键。若改走 LLM 网关才需要补回
                # （改 LLM_BASE_URL + 删 LLM_MODELS + 声明对应的 key）。
              # CPU limit 3000m：节点是 8 核 / 7600m allocatable，实测 idle 用量约 9%、
              # requests 合计仅 27%，容量宽裕（2026-08-03 核对）。
              #
              # ⚠️ 提高 CPU 只能加速**一次性的归档扫描**（500m 下约 150s → 3000m 下约 30s）。
              # 之后的 LLM 阶段实测 CPU 只有 1m —— 它在等 DGX 推理，不吃 CPU。
              # 也就是说：这条改动不会缩短占绝大部分时间的富化阶段，别指望它提速整体。
              # request 仍留 100m：这是每晚一次的批作业，不该常占调度配额。
              resources:
                requests: { cpu: 100m, memory: 192Mi }
                limits: { cpu: 3000m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: jobs-sg-data
