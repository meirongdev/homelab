---
# ResourceQuota 是护栏，不是容量规划：仓库先例里一个没设 history limit 的 CronJob
# 泄漏了 92 个卡住的 Job Pod，把单节点推过 110-pod 上限，**阻塞了全集群调度**。
# count/pods 封顶保证 jobs-sg 再怎么坏也炸不了别的应用。
#
# 单独一个 ns（而不是并进 personal-services）也是为这个：personal-services 的
# quota 限死 count/jobs.batch，三个 CronJob 的历史 Job 会挤占那份为事故加的护栏。
#
# ── 2026-08-17：count/pods 10 → 16 ──────────────────────────────────────────
# ⚠️ 前提知识（不直观，是这次的根）：`count/pods` 是**对象计数**配额，和 `pods`
#    这个资源不一样 —— 它**不排除终态**，Completed 的 pod 照样占额。实测当天
#    10 个 pod 对象里 9 个是 Completed，配额就报 used=10。
# 10 这个数是在 report（周任务）的历史攒满之前定的，稳态其实要：
#    enrich 3 + ingest 3 + report 3（各自 successfulJobsHistoryLimit）
#    + jobs-sg-web 1 = 10，再加建新 pod 时与待回收旧 pod 的瞬时重叠 → 必然超。
# 08-17 周一那轮 report 跑完，used 当场顶到 10/10，零余量。
# ☠️ 顶格之后的坏法**几乎没有告警覆盖**：配额在准入层拒绝建 pod，于是 Job 对象
#    建出来了、active=0、永远没有 pod、只无限刷 FailedCreate ——
#    但它**不会被标记成 failed**。逐条核对过：
#      · JobsSgCronJobFailed  查 kube_job_status_failed > 0    → 不会响
#      · KubeJobNotCompleted  要求 kube_job_status_active > 0  → 不会响
#      · KubeQuotaFullyUsed   会响，但 severity=info，Alertmanager 路由只放行
#                             critical|warning                → 进不了 Telegram
#      · KubeQuotaExceeded    判据 used/hard > 1，而准入控制保证 used 最多**等于**
#                             hard、比值封顶 1.0                → **结构上永不触发**
#                             （这条对集群里每个 ResourceQuota 都一样是死的）
#    真正兜底的只有 JobsSgIngestStale，而它要等 36h 才响 = 先丢一天半数据。
# 16 = 稳态 ~10 + 余量 6。护栏语义没变：真出现 92 个泄漏 pod 那种事故，仍然远在
# 节点 110-pod 上限之前就被拦下。
# ⚠️ **手工建的一次性 Job 不归 CronJob 的 history limit / TTL 管**：enrich-backfill
#    （08-03 建，无 ownerReferences 无 TTL）就这么白占了一个槽直到 08-17 手工清掉。
#    以后手工起 Job 请自带 TTL，例如
#    `kubectl create job --from=cronjob/ingest <name>` 之后补
#    `kubectl patch job <name> -p '{"spec":{"ttlSecondsAfterFinished":86400}}'`。
# ⚠️ **光有 TTL 不够，TTL 要短于「到下一次 cron 之前」**：2026-08-24 修技术栈假阳性
#    时一口气起了 5 个一次性 Job（retech dry/apply + 3 个 report 重算），每个都带了
#    86400s TTL，但当时距下一轮 ingest 只有约 16 小时 —— used 一度到 **15/16**，
#    再多一个就会静默卡住当晚的 ingest。手工 Job 跑完**当场删**，别指望 TTL；
#    要连开好几个就先 `kubectl -n jobs-sg describe quota jobs-sg-quota` 看余量。
apiVersion: v1
kind: LimitRange
metadata:
  name: jobs-sg-limits
  namespace: jobs-sg
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 500m
        memory: 384Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: jobs-sg-quota
  namespace: jobs-sg
spec:
  hard:
    # ── 2026-08-24：count/pods 16 → pods 12（换的是**类型**，不是余量）───────────
    # 前面 08-17 那次 10→16 是在给**错的维度**加余量。`count/pods` 是对象计数配额，
    # 不排除终态；实测当天 10 个槽里 **9 个是 Succeeded**（纯历史，零节点开销），
    # 真在跑的只有 web 那一个。于是 5 个手工一次性 Job 就把它顶到 15/16。
    #
    # `pods` 是「非终态 pod 数」，正好对应护栏想防的东西。临时 ns 实测两种语义：
    #        Succeeded pod → pods=0 / count/pods=1     ← 历史不再占额
    #        Pending   pod → pods=1 / count/pods=2     ← 卡住的照样计数，护栏不减弱
    # 而当年那 92 个泄漏由 count/jobs.batch 兜（personal-services 的注释就是这么写的）。
    #
    # 12 = 稳态非终态 1（web）的十几倍余量：三个 CronJob 全撞车 3 + web rollout 2
    # + 手工 Job 若干 ≈ 9，仍远低于节点 110-pod 上限。
    # 与舰队对齐：media 用 pods 15、personal-services（两集群）用 pods 30
    # + count/jobs.batch —— jobs-sg 此前是**全舰队唯一**用 count/pods 的 ns。
    pods: "12"
    count/jobs.batch: "25"
