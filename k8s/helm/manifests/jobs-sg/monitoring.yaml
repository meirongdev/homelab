---
# ServiceMonitor + PrometheusRule。
#
# ⚠️ 两者都必须带 label `release: kube-prometheus-stack` —— operator 的 selector 靠它
# 认领对象，漏了就被**静默忽略**：指标不采、告警不生效，且没有任何报错。
#
# Prometheus/Alertmanager 都还在 homelab（2026-08-02 只迁了 ArgoCD/Loki/Tempo 去
# oracle），所以本文件跟着 jobs-sg 一起落 homelab 是对的。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jobs-sg
  namespace: jobs-sg
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: { app: jobs-sg-web }
  endpoints:
    # ⚠️ 是 `metrics` 不是 `http`：2026-08-08 起 `/metrics` 绑在容器 9090 的独立
    # 监听器上，8080 只服务公共站点（web.yaml 的 `--metrics-addr`）。改回 http
    # 会静默不抓 —— 端口名对不上和漏 label 一样，operator 不报错。
    - port: metrics
      path: /metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jobs-sg
  namespace: jobs-sg
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: jobs-sg
      rules:
        # 最重要的一条：静默失效比崩溃更危险。ingest panic 了一整天也不会有人发现，
        # 除非有人盯着"最后一次成功"的时间戳 —— 这正是 2026-08-03 上线前踩到的坑。
        #
        # 2026-08-08：改成同时匹配两个 kind。周日那轮 ingest 把自己记成
        # `full_reconcile`（按 SGT 星期几判定），于是 `incremental` 系列每周固定断档
        # 48h > 36h 阈值 —— 只匹配 incremental 会让这条**最不该被噪音淹没**的告警
        # 每周误报约 12 小时（周日 06:45 UTC 到当日 18:15 UTC 下一轮增量）。
        # `min without(kind)` = 取两者中最近的一次成功，语义即「任何形式的采集
        # 都超过 36h 没成功过」。
        - alert: JobsSgIngestStale
          expr: 'min without(kind) (time() - jobs_sg_last_success_timestamp_seconds{kind=~"incremental|full_reconcile"}) > 36 * 3600'
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: jobs-sg 抓取已停滞 >36h（增量与 reconcile 都没成功）—— 可能静默失效
        # ☠️ 2026-08-08 修**结构性哑火**：原表达式只有 `time() - <series>`，而
        # `kind="full_reconcile"` 这条 series 在「reconcile 一次都没成功过」时
        # **根本不存在** —— `time() - <no data>` 算不出结果，于是这条告警在它最
        # 该响的场景下永远沉默（实测 `absent(...)` = 1，原式 = no data）。
        #
        # 这不是理论风险：关岗位只在周日 SGT 那轮做，且**被 `status==success`
        # 与 deviation<2% 双重门控**（上游 ingest.go:280）。reconcile 扫 ~867 页
        # 要 20 分钟，期间 web 只要在渲染聚合页就可能撞 SQLITE_BUSY（DELETE
        # journal，读者持 SHARED 锁挡住写者，2026-08-08 实测复现过一次）→ 该轮
        # 记成 partial → 关闭逻辑整个跳过 → 不写 full_reconcile 成功 → series
        # 仍不存在 → 告警继续哑火。失败会自我掩盖。
        #
        # 第二个分支补上「从来没成功过」这一格。`and on()` 那半是**冷启动闸门**：
        # 不能一上线就响（应用 08-03 才上线，首个周日是 08-09）。用累计抓取样本数
        # 当「我们已经观察了多久」的代理：60s 间隔满 10 天 = 14400，取 80% = 11520。
        # ⚠️ 必须 `sum()`：`count_over_time(up[10d])` 按 pod 实例分裂，pod 一滚动
        # 每条都只有几十到几千，不聚合的话这个门槛**永远够不着**，分支就成了死代码
        # ——那等于用一个新的哑火去修旧的哑火。
        #
        # 实测（2026-08-08，Prometheus 上跑过两个方向）：
        #   sum(count_over_time(up{job="jobs-sg-web"}[10d])) = 6267（≈4.4 天）
        #   门槛 11520 → no data（现在不触发，无冷启动误报）✅
        #   门槛 5000  → 1（分支活着，不是死代码）✅
        - alert: JobsSgReconcileStale
          expr: |
            (time() - jobs_sg_last_success_timestamp_seconds{kind="full_reconcile"} > 10 * 24 * 3600)
            or
            (
              absent_over_time(jobs_sg_last_success_timestamp_seconds{kind="full_reconcile"}[10d])
              and on() (sum(count_over_time(up{job="jobs-sg-web"}[10d])) > 11520)
            )
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: jobs-sg 全量 reconcile >10d 没成功过（含从未成功）—— 在架职位数可能失真
        - alert: JobsSgIngestErrors
          expr: 'increase(jobs_sg_ingest_errors_total[1d]) > 20'
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: jobs-sg 抓取错误上升 —— 可能是 MCF API 字段形状又变了
        # 2026-08-08：看**地板抬升**，不看绝对值（旧规则 `backlog > 2000` 已删）。
        # 绝对阈值在这里必然误报：首跑基线一次性把全部在架候选岗位（≈11k）灌进来，
        # 而 LLM 每晚只排掉约 420 条、每天又新进约 300 条 —— 上线第一晚就响，
        # 并持续响一到两个月直到烧完，正是 JobsSgIngestStale 那种「训练你忽略告警」。
        #
        # 稳态下积压是锯齿形（02:15 ingest 加、03:10 enrich 减），**每日低谷**才是
        # 信号：拿今天的低谷比昨天的低谷，问的是「管线还跟不跟得上」。DGX 停机、
        # 虚拟密钥过期、enrich 没跑都会把地板顶高一天的进量；正在稳步排空的大积压
        # 会把地板压低，保持安静。
        - alert: JobsSgEnrichBacklogGrowing
          expr: 'min_over_time(jobs_sg_enrich_backlog[1d]) - min_over_time(jobs_sg_enrich_backlog[1d] offset 1d) > 500'
          for: 2h
          labels: { severity: warning }
          annotations:
            summary: jobs-sg 富化积压地板每日抬升 >500 —— LLM 不可用或跟不上进量
        - alert: JobsSgCronJobFailed
          expr: 'kube_job_status_failed{namespace="jobs-sg"} > 0'
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: jobs-sg 有 CronJob 失败
