---
# ServiceMonitor + PrometheusRule。
#
# ⚠️ 两者都必须带 label `release: kube-prometheus-stack` —— operator 的 selector 靠它
# 认领对象，漏了就被**静默忽略**：指标不采、告警不生效，且没有任何报错。
#
# Prometheus/Alertmanager 都还在 homelab（2026-08-02 只迁了 ArgoCD/Loki/Tempo 去
# oracle），所以本文件跟着 jobs-sg 一起落 homelab 是对的。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jobs-sg
  namespace: jobs-sg
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: { app: jobs-sg-web }
  endpoints:
    # ⚠️ 是 `metrics` 不是 `http`：2026-08-08 起 `/metrics` 绑在容器 9090 的独立
    # 监听器上，8080 只服务公共站点（web.yaml 的 `--metrics-addr`）。改回 http
    # 会静默不抓 —— 端口名对不上和漏 label 一样，operator 不报错。
    - port: metrics
      path: /metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jobs-sg
  namespace: jobs-sg
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: jobs-sg
      rules:
        # 最重要的一条：静默失效比崩溃更危险。ingest panic 了一整天也不会有人发现，
        # 除非有人盯着"最后一次成功"的时间戳 —— 这正是 2026-08-03 上线前踩到的坑。
        #
        # 2026-08-08：改成同时匹配两个 kind。周日那轮 ingest 把自己记成
        # `full_reconcile`（按 SGT 星期几判定），于是 `incremental` 系列每周固定断档
        # 48h > 36h 阈值 —— 只匹配 incremental 会让这条**最不该被噪音淹没**的告警
        # 每周误报约 12 小时（周日 06:45 UTC 到当日 18:15 UTC 下一轮增量）。
        # `min without(kind)` = 取两者中最近的一次成功，语义即「任何形式的采集
        # 都超过 36h 没成功过」。
        #
        # 2026-08-08 二修：补上与 JobsSgReconcileStale 同一个洞。上面那个减法在
        # 两条 series **都不存在**时（空库、web 起不来、指标查询整体失败）同样是
        # `<no data>` → 这条「最重要的告警」在最彻底的故障下反而最安静。第二个
        # 分支用 absent_over_time 补这一格，`and on()` 是冷启动闸门，理由与量纲
        # 见下面 JobsSgReconcileStale 的长注释（36h 满窗 = 2160 样本，取 80%）。
        # ⚠️ 同样**必须 sum()**，否则 count_over_time 按 pod 分裂，门槛永远够不着。
        #
        # 实测（2026-08-08）：sum(count_over_time(up[36h])) = 2159（闸门已开）；
        # 真选择器下 absent 分支 = no data（不误报）；换成不存在的 kind = 1
        # （分支活着，不是死代码）。
        - alert: JobsSgIngestStale
          expr: |
            (min without(kind) (time() - jobs_sg_last_success_timestamp_seconds{kind=~"incremental|full_reconcile"}) > 36 * 3600)
            or
            (
              absent_over_time(jobs_sg_last_success_timestamp_seconds{kind=~"incremental|full_reconcile"}[36h])
              and on() (sum(count_over_time(up{job="jobs-sg-web"}[36h])) > 1728)
            )
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: jobs-sg >36h 没有一次**干净**成功（增量与 reconcile 都没有）—— 可能静默失效，也可能只是某轮被标 partial
            # ⚠️ 措辞别改回"抓取已停滞"（2026-08-09 修）。这条烧起来有**两种**成因，
            # 而旧措辞只描述了其中一种，会把人引去查错方向：
            #   ① 真停摆：CronJob 没跑 / panic / 指标整体消失 —— 查 Job 与 pod 日志。
            #   ② 跑了但被标 partial：`last_success` 只在干净结束时才写，任何
            #      `errors>0` 都不写 —— **数据其实是新的**。
            # 2026-08-09 实测的就是 ②：08-08 18:15Z 那轮 full_reconcile 跑满
            # 856 页、scanned 85487、new 81、updated 8977（数据完全刷新了），
            # 只因偏差守卫 `dev=4.5% > 2%`（seen 85487 / total 89531）拒绝关闭
            # 那 4044 个未见岗位 → errors=1 → status=partial → 不写 last_success
            # → 停在上一轮(42h 前)→ 击穿 36h。下一轮增量成功即自愈，
            # 所以历史上它总是烧 5~8h 就消失（08-05 烧 8.5h、08-09 烧 5.4h）。
            # ⚠️ 别为了消音把 36h 放宽：一个 partial 之夜会把间隔顶到 48h，要吞下它
            # 得放到 >48h，那等于把"这条最重要的告警"的探测延迟翻倍。
            #
            # ✅ 那个 4.5% 已定位并修复（2026-08-10，上游 4af8944）：偏差是拿
            # `max(page.Total)` 这个全程峰值去比逐页累加的 scanned，量纲不对，
            # 扫描 25 分钟里任何瞬时抬升都被永久固化 —— 那轮其实已翻到最后一页。
            # 根因全文与实测数据（含平静时段 865×100+10=86510=total 的精确核对）
            # → docs/reference/jobs-sg.md「全量 reconcile 从来没成功过」。
            # 阈值维持 36h：修好后 reconcile 能落成功戳，min without(kind) 自然补上
            # 周日那格；JobsSgReconcileStale(10d) 仍专盯 reconcile 长期失败。
            #
            # 二修（2026-08-10 晚，上游 4b91fe8）把 ② 收窄到只剩「真错误」：
            # 闸门改读覆盖率 scanned/max(total) ≥ 80%（total 噪声带实测 ±10%，
            # 2% 的紧判定量级不配），且干净扫描的对账轮即使放弃关闭（close_skipped）
            # 也照常盖 incremental 新鲜戳 —— 数据刚被全量刷新，凭什么喊停滞。
            # 从此这条烧起来 = 增量与对账**双双**出真故障，别再往闸门方向查。
        # ☠️ 2026-08-08 修**结构性哑火**：原表达式只有 `time() - <series>`，而
        # `kind="full_reconcile"` 这条 series 在「reconcile 一次都没成功过」时
        # **根本不存在** —— `time() - <no data>` 算不出结果，于是这条告警在它最
        # 该响的场景下永远沉默（实测 `absent(...)` = 1，原式 = no data）。
        #
        # 这不是理论风险：关岗位只在周日 SGT 那轮做，且**被 `status==success`
        # 与 deviation<2% 双重门控**（上游 ingest.go:280）。reconcile 扫 ~867 页
        # 要 20 分钟，期间 web 只要在渲染聚合页就可能撞 SQLITE_BUSY（DELETE
        # journal，读者持 SHARED 锁挡住写者，2026-08-08 实测复现过一次）→ 该轮
        # 记成 partial → 关闭逻辑整个跳过 → 不写 full_reconcile 成功 → series
        # 仍不存在 → 告警继续哑火。失败会自我掩盖。
        #
        # 第二个分支补上「从来没成功过」这一格。`and on()` 那半是**冷启动闸门**：
        # 不能一上线就响（应用 08-03 才上线，首个周日是 08-09）。用累计抓取样本数
        # 当「我们已经观察了多久」的代理：60s 间隔满 10 天 = 14400，取 80% = 11520。
        # ⚠️ 必须 `sum()`：`count_over_time(up[10d])` 按 pod 实例分裂，pod 一滚动
        # 每条都只有几十到几千，不聚合的话这个门槛**永远够不着**，分支就成了死代码
        # ——那等于用一个新的哑火去修旧的哑火。
        #
        # 实测（2026-08-08，Prometheus 上跑过两个方向）：
        #   sum(count_over_time(up{job="jobs-sg-web"}[10d])) = 6267（≈4.4 天）
        #   门槛 11520 → no data（现在不触发，无冷启动误报）✅
        #   门槛 5000  → 1（分支活着，不是死代码）✅
        - alert: JobsSgReconcileStale
          expr: |
            (time() - jobs_sg_last_success_timestamp_seconds{kind="full_reconcile"} > 10 * 24 * 3600)
            or
            (
              absent_over_time(jobs_sg_last_success_timestamp_seconds{kind="full_reconcile"}[10d])
              and on() (sum(count_over_time(up{job="jobs-sg-web"}[10d])) > 11520)
            )
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: jobs-sg 全量 reconcile >10d 没成功过（含从未成功）—— 在架职位数可能失真
        # report 是四个 kind 里最后一个裸奔的（2026-08-10 补）。JobsSgCronJobFailed
        # 只抓「跑了但失败」，抓不到「根本没被调度」——suspend 忘了恢复、schedule 写错、
        # CronJob 对象被误删，这三种都是静默的。周报每周一 01:00Z 跑一次，健康间隔
        # 恰好 7d；阈值 8d 给一天余量：周一那轮失败或没跑，周二 01:30Z 左右烧起来。
        # absent 分支与冷启动闸门的方法论同上两条（8d 满窗 = 11520 样本，取 80% = 9216；
        # ⚠️ 同样必须 sum()，否则按 pod 分裂永远够不着）。
        #
        # 实测（2026-08-10 02:30Z，port-forward 到 Prometheus 逐条跑过）：
        #   time() - last_success{kind="report"} = 5319（当天 01:00Z 刚跑完 W32）✅
        #   sum(count_over_time(up{job="jobs-sg-web"}[8d])) = 9557 > 9216（闸门已开）✅
        #   absent 分支真选择器 = no data（不误报）✅
        #   absent 分支换不存在的 kind + 低门槛 = 1（分支活着，不是死代码）✅
        - alert: JobsSgReportStale
          expr: |
            (time() - jobs_sg_last_success_timestamp_seconds{kind="report"} > 8 * 24 * 3600)
            or
            (
              absent_over_time(jobs_sg_last_success_timestamp_seconds{kind="report"}[8d])
              and on() (sum(count_over_time(up{job="jobs-sg-web"}[8d])) > 9216)
            )
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: jobs-sg 周报 >8d 没成功过 —— 周一 01:00Z 那轮失败或根本没被调度（suspend/排期/对象被删）
        - alert: JobsSgIngestErrors
          expr: 'increase(jobs_sg_ingest_errors_total[1d]) > 20'
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: jobs-sg 抓取错误上升 —— 可能是 MCF API 字段形状又变了
        # 2026-08-08：看**地板抬升**，不看绝对值（旧规则 `backlog > 2000` 已删）。
        # 绝对阈值在这里必然误报：首跑基线一次性把全部在架候选岗位（≈11k）灌进来，
        # 而 LLM 每晚只排掉约 420 条、每天又新进约 300 条 —— 上线第一晚就响，
        # 并持续响一到两个月直到烧完，正是 JobsSgIngestStale 那种「训练你忽略告警」。
        #
        # 稳态下积压是锯齿形（02:15 ingest 加、03:10 enrich 减），**每日低谷**才是
        # 信号：拿今天的低谷比昨天的低谷，问的是「管线还跟不跟得上」。DGX 停机、
        # 虚拟密钥过期、enrich 没跑都会把地板顶高一天的进量；正在稳步排空的大积压
        # 会把地板压低，保持安静。
        - alert: JobsSgEnrichBacklogGrowing
          expr: 'min_over_time(jobs_sg_enrich_backlog[1d]) - min_over_time(jobs_sg_enrich_backlog[1d] offset 1d) > 500'
          for: 2h
          labels: { severity: warning }
          annotations:
            summary: jobs-sg 富化积压地板每日抬升 >500 —— LLM 不可用或跟不上进量
        - alert: JobsSgCronJobFailed
          expr: 'kube_job_status_failed{namespace="jobs-sg"} > 0'
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: jobs-sg 有 CronJob 失败
