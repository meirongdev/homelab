# Cilium Gateway API — 入口基础设施（GatewayClass + Gateway 本体）。
# 每条对外路由拆在同目录的 route-<service>.yaml 里（一个服务一个文件，
# 与 oracle 侧「HTTPRoute 跟服务清单放一起」的惯例一致）。
# 新加子域名：新建一个 route-<service>.yaml 即可 —— 目录源自动纳管，
# DNS 由 external-dns 从 HTTPRoute 建，不要动 cloudflare/terraform。
---
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: cilium-nodeport-config
  namespace: kube-system
spec:
  service:
    type: NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-nodeport
spec:
  controllerName: io.cilium/gateway-controller
  description: Cilium NodePort GatewayClass for homelab
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: cilium-nodeport-config
    namespace: kube-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: kube-system
  annotations:
    # external-dns (gateway-httproute source) has no real LB address to read from this
    # Gateway (Cilium NodePort behind a Cloudflare Tunnel) — force every managed HTTPRoute's
    # CNAME target to the tunnel, matching what cloudflare_dns_record.subdomains creates in
    # terraform (cloudflare/terraform/main.tf). tunnel_id from cloudflare/terraform/terraform.tfvars.
    external-dns.alpha.kubernetes.io/target: ce9fd9fe-1dc4-430a-b797-b3b3fc931978.cfargotunnel.com
spec:
  gatewayClassName: cilium-nodeport
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
# auth.meirong.dev (ZITADEL) 路由已随其迁移到 oracle-k3s 移除（2026-07-06）；
# notify.meirong.dev (Gotify) 已彻底退役（2026-07，见 docs/decisions/alerting-telegram-migration.md）。
# 都在 cloud/oracle/manifests/base/gateway.yaml。
