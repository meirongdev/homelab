# ⚠️ 单副本是**结论不是疏忽**（2026-08-13 从 2 副本降下来，实测依据见文件尾注）。
# 隧道级冗余来自 cloudflared 自身：**单个进程就持有 4 条到 Cloudflare 边缘的连接、
# 分散在 3–4 个 colo**（`cloudflared_tunnel_ha_connections` = 4/pod）。副本数只加
# pod 级冗余，而 homelab 的 36 个业务负载全在 k8s-node 上（worker 只跑 DaemonSet），
# 入口多活在后端单点的前提下没有意义。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  replicas: 1
  # 滚动更新仍然无空窗：默认 25%/25% 在 1 副本下算出
  # maxUnavailable=floor(0.25)=0、maxSurge=ceil(0.25)=1 —— 新 pod ready 后旧 pod 才退。
  # 改 replicas 前先重算这两个数，别让 maxUnavailable 变成 1。
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      priorityClassName: high
      # ☠️ 必须钉在 control-plane（k8s-node），别删。
      # 2026-08-13 降副本时一并删掉了原来的 podAntiAffinity（单副本下自己跟自己反亲和
      # 是死配置），结果调度器立刻把**唯一**的入口 pod 放到了 k8s-worker-106 —— 就是
      # NAS(192.168.50.106) 上那台 2c/3G 的 VM，当天才入编、在另一个网段、还多一条 ip rule。
      # 为什么不能接受：homelab 的 36 个业务负载全在 k8s-node 上，入口跑到 worker 只会
      # 白白多一跳跨节点 VXLAN，并把 NAS 宿主机拉进入口的故障域（它还是每夜 restic 的
      # 备份目标）。入口应当和它所服务的后端同节点。
      #
      # 用 required 而不是 preferred 是**故意的**：preferred 在 k8s-node 重启后仍会漂到
      # worker 且不会漂回来，单副本经不起这种不确定性。required 的代价只是「k8s-node 挂了
      # 就 Pending」，而那时 36 个后端本来也全没了，留个能转发 502 的隧道毫无价值 ——
      # 反倒是 CloudflaredAllReplicasDown 直接告警的信号更干净。
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - name: cloudflared
          # 2026-08-26 digest 刷新：2026.7.2 → **2026.8.2**（当前 :latest 的多架构
          # index digest，实测含 linux/amd64 + linux/arm64，两个集群共用同一个 digest）。
          # 动因：当天 04:52Z 与 06:06–06:21Z 两次公网 530（Cloudflare 1033），
          # 后一次持续 **15 分钟** —— 6 个 homelab 服务全不可达，而 cloudflared 自己
          # 从头到尾认为 4 条边缘连接健康：`cloudflared_tunnel_ha_connections` 恒为 4，
          # 直到 06:21:07Z 才一次性 `Lost connection` 全部 4 条并立刻重连、服务即恢复。
          # 即**它握着 4 条僵尸连接却不自知**，本地指标一个都看不见这次故障
          # （抓到它的是 oracle 上 Uptime Kuma 的跨集群黑盒探测）。
          # ⚠️ 同期 homelab↔oracle 的 Tailscale 采样 211/211 零缺口，所以不是整体出网挂了，
          #    坏的是到 Cloudflare 边缘（sin* colo）那条路。
          # ⚠️ **升级不是已证实的修复**，只是唯一现成的杠杆 —— 旧版自己在日志里喊
          #    `Your version 2026.7.2 is outdated`。复发判据：再出现「530 期间
          #    ha_connections 仍为 4」就说明升级没解决，那时再评估换 `--protocol quic`
          #    （QUIC 对路径失效的探测比 http2 快，但会改变入口传输层，别顺手改）。
          image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
          ports:
            - containerPort: 2000
              name: metrics
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# cloudflared 指标的 ClusterIP service（无需 NodePort）
# ⚠️ 这行原本写的是「Scraped by OTel Collector running in-cluster」，**是错的**：
# homelab 的 OTel Collector 刻意没有 metrics 管道，这个 Service 在 2026-08-13 之前
# 从来没有任何采集方。现由 monitoring/cloudflared ServiceMonitor 抓
# （k8s/helm/manifests/monitoring/cloudflared-servicemonitor.yaml，抓 Endpoints 非 VIP）。
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflare
  labels:
    app: cloudflared
spec:
  type: ClusterIP
  selector:
    app: cloudflared
  ports:
    - port: 2000
      targetPort: 2000
      name: metrics
---
# ☠️ 这里**故意没有 PodDisruptionBudget**（2026-08-13 随降副本一并删除）。
# 单副本下 PDB 只有两种结果，都没用：
#   minAvailable: 1  → disruptionsAllowed = 0 → `kubectl drain` 永久卡死
#   maxUnavailable: 1 → disruptionsAllowed = 1 → 恒定放行，等于没有约束
# 想恢复 PDB 必须**先**把 replicas 提回 ≥2，否则就是在 deadlock 和 no-op 之间二选一。
#
# ── 降到单副本的实测依据（2026-08-13）──────────────────────────────
# 1. 每个副本自带 4 条边缘连接、跨 3–4 个 colo（sin07/sin11/sin18/sin20 等），
#    冗余在 cloudflared 内部，不在副本数上。
# 2. 历史上每一次 cloudflared 重启都是**节点级**事件，2 副本一次也没挡住：
#    homelab 两副本 2026-08-08 07:00Z 前后 3 分钟内同时重启（当日双集群重启）；
#    另见 records/2026-08-01-oracle-k3s-dns-outage.md 的「两副本相继退出」。
# 3. 7 天峰值并发 3 个请求，单 pod 实占 ~15Mi RSS / ~0m CPU —— 吞吐从不是理由。
# 唯一失去的能力：单 pod 独立崩溃时会有 ~15–25s 的 502（readiness
# initialDelaySeconds=10）。用 CloudflaredAllReplicasDown 告警兜底（== 0 在单副本下依然正确）。