# （本文件的 Namespace 已于 2026-08-03 拆到 namespace.yaml —— 理由见该文件头注）
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-bench
  namespace: kube-bench
  labels:
    app: kube-bench
spec:
  schedule: "0 5 * * 0"          # 每周日 05:00 UTC（错开 03:00/03:30 restic 备份）
  concurrencyPolicy: Forbid       # 不并发，避免热节点叠加扫描
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      # 2026-08-24 补：**断卡死的开关，不是性能预算**。concurrencyPolicy 是 Forbid，
      # 卡住的 Job 会一直占着「上一轮还在跑」把后续周更全顶掉，而没 deadline 就没人
      # 杀它（此前只能靠 KubeJobNotCompleted 12h 兜）。到点标 Failed →
      # KubeJobFailed(warning) 当晚响。
      # 实测两次运行都是 **6 秒**（14d 窗口内的全部样本）→ 600s ≈ 100x 余量；
      # 周更任务的可行区间宽到 168h，没有理由贴着实测值定。
      # ⚠️ 它是 JobSpec 字段，必须在 jobTemplate.spec 下（放 CronJob 的 spec 下会被
      #    静默丢弃）。判据：kubectl get cronjob -o custom-columns 从服务端回读。
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800   # 完成 7 天后清理 Job 对象
      template:
        metadata:
          labels:
            app: kube-bench
        spec:
          hostPID: true
          restartPolicy: Never
          # ⚠️ 必须钉在 control-plane（2026-08-13，homelab 变双节点后）：targets 里的
          # master/etcd/controlplane 检查项只有在控制面节点上才有意义。不钉节点时
          # Job 可能排到 worker——拿控制面基准审 agent，报告"看起来全绿"实为审错对象。
          # 代价（有意接受）：worker 的 node 级检查项暂无覆盖，见 reference/security.md 第 7 层。
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          # 容忍可能存在的控制面污点
          tolerations:
            - operator: Exists
          containers:
            - name: kube-bench
              image: docker.io/aquasec/kube-bench:v0.15.6
              command: ["kube-bench"]
              # k3s 基准；targets 覆盖控制面文件权限 + 节点 + 策略类检查
              args:
                - "run"
                - "--targets"
                - "master,etcd,controlplane,node,policies"
                - "--benchmark"
                - "k3s-cis-1.24"
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              volumeMounts:
                - { name: var-lib-kubelet,      mountPath: /var/lib/kubelet,        readOnly: true }
                - { name: var-lib-etcd,         mountPath: /var/lib/etcd,           readOnly: true }
                - { name: etc-systemd,          mountPath: /etc/systemd,            readOnly: true }
                - { name: lib-systemd,          mountPath: /lib/systemd/,           readOnly: true }
                - { name: etc-kubernetes,       mountPath: /etc/kubernetes,         readOnly: true }
                # k3s 专属配置/数据目录（控制面与 kubelet 配置实际所在）
                - { name: etc-rancher-k3s,      mountPath: /etc/rancher/k3s,        readOnly: true }
                - { name: var-lib-rancher-k3s,  mountPath: /var/lib/rancher/k3s,    readOnly: true }
          volumes:
            - { name: var-lib-kubelet,      hostPath: { path: /var/lib/kubelet } }
            - { name: var-lib-etcd,         hostPath: { path: /var/lib/etcd } }
            - { name: etc-systemd,          hostPath: { path: /etc/systemd } }
            - { name: lib-systemd,          hostPath: { path: /lib/systemd } }
            - { name: etc-kubernetes,       hostPath: { path: /etc/kubernetes } }
            - { name: etc-rancher-k3s,      hostPath: { path: /etc/rancher/k3s } }
            - { name: var-lib-rancher-k3s,  hostPath: { path: /var/lib/rancher/k3s } }
