---
# 自录 podcast 静态发布 —— nginx 直接伺服 read-only NFS 里的 mp3 + rss.xml + 封面。
#
# 数据：/storage/podcast（只读 NFS media-podcast）→ /podcast
#   · /podcast/episodes/*.mp3     分集音频
#   · /podcast/feed/rss.xml       播客 RSS（<enclosure> 指向 https://podcast.meirong.dev/episodes/…）
#   · /podcast/feed/cover.jpg     封面
# 发布流程：新分集 mp3 + rss.xml 经非 k8s 侧写进 106 → 本 nginx 直接伺服（只读，无写权）。
#
# 为什么静态 RSS 而非 Castopod：小范围（几十人内）订阅，家宽上行 + Cloudflare Tunnel 足够，
# 不上 PHP 全家桶（见 plan 决策 4）。rss.xml 需随分集更新 —— 人工/脚本维护，见 Task 4。
#
# PSA baseline：nginx 官方镜像跑非 root 新版，baseline 覆盖。镜像 multi-arch index digest。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podcast
  namespace: media
  labels: { app: podcast }
spec:
  replicas: 1
  selector:
    matchLabels: { app: podcast }
  template:
    metadata:
      labels: { app: podcast }
    spec:
      priorityClassName: bulk
      # 官方 nginx 镜像以 root 直跑会自己降权；作为非 root(101) 跑时它要写
      # /var/cache/nginx + /var/run/nginx.pid，配 emptyDir + chmod 太脆。
      # 静态站点零风险，直接 uid 0（同 media ns 的 jellyfin 一样）。PSA baseline 覆盖。
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          # nginx:stable-alpine multi-arch index @ 2026-08-16
          image: nginx@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: podcast
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: podcast
          persistentVolumeClaim: { claimName: media-podcast }
        - name: nginx-conf
          configMap:
            name: podcast-nginx-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: podcast-nginx-conf
  namespace: media
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        autoindex on;
        index index.html;
    }
---
apiVersion: v1
kind: Service
metadata:
  name: podcast
  namespace: media
spec:
  type: ClusterIP
  selector: { app: podcast }
  ports:
    - port: 80
      targetPort: 80
      name: http
---
# podcast.meirong.dev → podcast:80。同 ns 引用 Service，无需 ReferenceGrant。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podcast
  namespace: media
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: kube-system
      port: 80
  hostnames: ["podcast.meirong.dev"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: podcast
          port: 80
          weight: 1
