---
# Jellyfin — 视频播放（多媒体仓库 serving 层）。
#
# 数据分工：
#   · 媒体（movie/tv/anime）= 只读 NFS（media-* PV）→ /media/{music 不用, movie,tv,anime}
#   · config/cache/metadata = local-path PVC（可写，Jellyfin 需要：元数据库、转码临时目录、
#     图片缓存）。这个才是要备份的宿主数据。
#
# 播放策略：用户选手机/电脑标准浏览器 → 直放（direct play），**不配硬件转码**。
# Jellyfin 会把 1080p 直发客户端；只有在客户端不支持的 codec 时才需要转码，届时用 CPU
# （不烧 GPU，5600H 笔记本上转码是长期成本，设计上避免 —— 见 plan 决策「不上视频转码」）。
#
# PSA baseline（media ns）：Jellyfin 需要写 config 目录，跑非 root 太苛刻，
# baseline 的 privilege 集合对上（不强制非 root）。不 damesh do restricted。
#
# 镜像：jellyfin/jellyfin multi-arch index digest（amd64 主用于 homelab，arm64 留 oracle 出口）。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-local
  namespace: media
  annotations:
    # config 是运行时数据，禁止 ArgoCD prune 级联删除
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels: { app: jellyfin }
spec:
  replicas: 1
  selector:
    matchLabels: { app: jellyfin }
  template:
    metadata:
      labels: { app: jellyfin }
    spec:
      # 个人应用分档：bulk(-10) —— 可被驱逐排序在后，不抢控制面
      priorityClassName: bulk
      # 落 106 worker（2026-08-16）：视频本体在 106 的 ZFS 上，worker 就是 106 上的 VM ——
      # 几百 MB 的顺序读不再经 pve NAT 绕一圈 LAN。实测画像支持这次搬迁：
      # 峰值 380m CPU / 800Mi（初次扫库那段），稳态 1m / 332Mi，config PVC 仅 134M。
      # 为此把 VM 从 3G 加到 4G（ARC 2G→1G 让出来的，见 proxmox/terraform-storage/variables.tf）。
      # ☠️ **前提是不转码**：106 是 Celeron J4105（4 核 1.5GHz，VM 只分到 2 核），软解转码
      # 是死路；QSV 硬解要给 VM 直通核显，那是另一个项目。客户端必须直放
      # （plan 决策：docs/plans/apps/2026-08-16-multimedia-repository.md）。
      # 哪天真需要转码，第一步是把它搬回 master（5600H），不是在这台上调参数。
      # 备份归属：jellyfin-config 现由 worker 侧夜备（--host homelab-worker）覆盖。
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-106
      securityContext:
        runAsUser: 0       # jellyfin 官方镜像需要 root 跑（会自己降权）
        runAsGroup: 0
      # --- OIDC SSO 插件预置（2026-08-16）---
      # aussierk/jellyfin-plugin-oidc v1.0.7.0（targetAbi 10.11.0.0，与 Jellyfin 10.11.11 匹配）。
      # 插件不随 git 清单可装（Jellyfin 插件靠 GUI/自定义 repository/手放 dll），这里用
      # initContainer 幂等下载到 config PVC 的 plugins 目录，让换 PVC/重装后自动复现，
      # 避免只靠一次 kubectl cp 的漂移。
      # ⚠️ 只负责把 dll 放到位；Provider/Role 配置仍要在 Jellyfin Dashboard GUI 里填
      #    （无文件/环境接口可声明式预设）。
      initContainers:
        - name: install-oidc-plugin
          # busybox:latest multi-arch index（含 wget+unzip）@ 2026-08-16
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: PLUGIN_DIR
              value: "/config/plugins/SSO-OIDC Authentication_1.0.7.0"
            - name: PLUGIN_ZIP
              value: "/tmp/oidc-rbac.zip"
            - name: PLUGIN_URL
              value: "https://github.com/aussierk/jellyfin-plugin-oidc/releases/download/v1.0.7.0/oidc-rbac.zip"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -f "$PLUGIN_DIR/Jellyfin.Plugin.OIDC.dll" ]; then
                echo "[install-oidc-plugin] plugin already present, skip"
                exit 0
              fi
              mkdir -p "$PLUGIN_DIR"
              echo "[install-oidc-plugin] downloading $PLUGIN_URL"
              wget -q -O "$PLUGIN_ZIP" "$PLUGIN_URL"
              cd "$PLUGIN_DIR"
              unzip -oq "$PLUGIN_ZIP"
              rm -f "$PLUGIN_ZIP"
              echo "[install-oidc-plugin] installed:"
              ls
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
      containers:
        - name: jellyfin
          # jellyfin/jellyfin:latest multi-arch index @ 2026-08-16
          image: jellyfin/jellyfin@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "https://media.meirong.dev"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: movie
              mountPath: /media/movie
              readOnly: true
            - name: tv
              mountPath: /media/tv
              readOnly: true
            - name: anime
              mountPath: /media/anime
              readOnly: true
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          livenessProbe:
            httpGet: { path: /health, port: 8096 }
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8096 }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: jellyfin-config-local }
        - name: cache
          emptyDir: {}
        - name: movie
          persistentVolumeClaim: { claimName: media-movie }
        - name: tv
          persistentVolumeClaim: { claimName: media-tv }
        - name: anime
          persistentVolumeClaim: { claimName: media-anime }
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  type: ClusterIP
  selector: { app: jellyfin }
  ports:
    - port: 8096
      targetPort: 8096
      name: http
---
# media.meirong.dev → jellyfin:8096。同 ns 引用 Service，无需 ReferenceGrant。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: kube-system
      port: 80
  hostnames: ["media.meirong.dev"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: jellyfin
          port: 8096
          weight: 1
