---
# 要求容器配置 readinessProbe（健康检查，避免把流量打到未就绪/已僵死的 Pod）。
#
# ⚠️ 长期 Audit；部分 sidecar 合理地无 probe，提升 Deny 前先读
#    `kubectl get polr -A` 评估影响。仅要求 readinessProbe（liveness 争议较大，可后补）。
#
# 只查 Pod、且排除 Job 的 Pod：readiness 只对「有流量要接」的长驻负载成立，run-to-completion
# 的批处理没有 ready 概念。不排除的话每个 CronJob 的 Pod 都刷一条恒定误报（2026-08-13 /
# 09-08 两次收窄就是为了这个），把报告和 events 面变成噪音、掩盖真信号。
#
# 2026-11-19 从 ClusterPolicy 迁到 CEL ValidatingPolicy，对应关系见 disallow-latest-tag.yaml。
# Job 排除写了两层，**缺一不可**：
#   · objectSelector：只在 webhook 层生效（准入时根本不调 webhook）。它还是关掉 autogen
#     的开关：Kyverno 源码 CanAutoGen() 遇到非空 objectSelector 就整个跳过 autogen，
#     恰好复刻旧版现状（旧版 status.autogen 实测为空 = 只查 Pod）。
#   · matchConditions：引擎层，准入和后台扫描都走。☠️ 后台扫描**不认 objectSelector**：
#     迁移并跑时只写了 objectSelector，新版报告比旧版多出 25 个 fail，逐个核对全是
#     CronJob 的 Pod。加上这条后，新建的 Job Pod 不再进报告（已实测）。
#   只验「噪音没了」不够：写错会静默放过全部负载。改完双向验，Job Pod 无结果、
#   无 probe 的 Deployment Pod 仍报 fail。
# ⚠️ 刻意不排除系统 ns：Audit 只产报告，旧版后台扫描本来就覆盖 kube-system/kyverno，
#    保持报告面不缩。
# readinessProbe.periodSeconds ">0" → has(readinessProbe)：periodSeconds 由 apiserver 默认填 10，
# 旧条件实际判的就是「有没有 readinessProbe」。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Readiness Probe
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    admission: {enabled: true}
    background: {enabled: true}
  autogen:
    validatingAdmissionPolicy: {enabled: false}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    objectSelector:
      matchExpressions:
        - key: batch.kubernetes.io/job-name
          operator: DoesNotExist
  matchConditions:
    - name: exclude-job-pods
      expression: "!('batch.kubernetes.io/job-name' in object.metadata.?labels.orValue({}))"
  validations:
    - expression: "object.spec.containers.all(c, has(c.readinessProbe))"
      message: "每个容器应配置 readinessProbe。"
