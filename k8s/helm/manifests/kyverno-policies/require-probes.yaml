---
# 要求容器配置 readinessProbe（健康检查，避免把流量打到未就绪/已僵死的 Pod）。
#
# ⚠️ 先 Audit；部分 sidecar 合理地无 probe，提升 Enforce 前先读
#    `kubectl get polr -A` 评估影响。仅要求 readinessProbe（liveness 争议较大，可后补）。
#
# autogen 收窄到长驻控制器（2026-08-13）：Kyverno 默认把 Pod 规则扩写到全部 8 种
# 控制器，包括 Job/CronJob——而 readiness 语义上只对「有流量要接」的长驻负载成立，
# run-to-completion 的批处理根本没有 ready 概念。此前 monitoring/krr 每轮后台扫描
# （约 7 分钟）刷一条恒定误报的 PolicyViolation Warning 事件，把 events 面变成噪音。
# 用注解而不用 spec 字段：CRD 对未知字段静默剪枝（本仓库最恨的失效模式），注解是
# 跨版本文档化的机制；改完拿 `kubectl get cpol require-probes -o jsonpath=
# '{.status.autogen}'` 验证生成规则里再无 Job/CronJob。
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Readiness Probe
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    pod-policies.kyverno.io/autogen-controllers: "DaemonSet,Deployment,ReplicaSet,ReplicationController,StatefulSet"
spec:
  failurePolicy: Ignore
  background: true
  rules:
    - name: validate-readiness-probe
      match:
        any:
          - resources:
              kinds: ["Pod"]
      # 2026-09-08：把 Job 产生的 Pod 排除掉，补齐 2026-08-13 那次只做了一半的收窄。
      # 那次改的是 autogen（`autogen-controllers` 注解），它只影响 Kyverno 为控制器
      # 扩写出来的规则，**不影响上面这条直接 match `kinds: ["Pod"]` 的基规则** ——
      # 于是后台扫描的噪音没了，但每个批处理 Pod 在**准入那一刻**照旧刷一条恒定误报的
      # PolicyViolation event（2026-09-08 在 blog-stats-rollup 的 pod 上实测到）。
      # 理由与那次相同：readiness 只对「有流量要接」的长驻负载成立，run-to-completion
      # 的批处理没有 ready 概念，恒定误报会把 events 面变成噪音、掩盖真信号。
      # 判据用 Job 控制器自动打的标签（k8s ≥1.27 稳定，本集群 v1.35.8 实测 26 个 pod
      # 全带）；不用 ownerReferences 的 precondition 是因为标签选择器读起来更直白。
      # ⚠️ 只排除 Job 的 Pod：Deployment/StatefulSet/DaemonSet 两条路径（autogen 规则
      #    + 基规则）都照旧审计。改完双向验证过：批处理 Pod 无 event、无 probe 的
      #    Deployment 仍报违规（下面 exclude 写错会静默放过全部负载，这是本仓库最怕的
      #    那种失效，别只验「噪音没了」就收工）。
      exclude:
        any:
          - resources:
              selector:
                matchExpressions:
                  - key: batch.kubernetes.io/job-name
                    operator: Exists
      validate:
        failureAction: Audit
        message: "每个容器应配置 readinessProbe。"
        pattern:
          spec:
            containers:
              - readinessProbe:
                  periodSeconds: ">0"
