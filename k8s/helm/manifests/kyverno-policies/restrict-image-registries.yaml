---
# 镜像必须来自可信仓库白名单（供应链控制）。
#
# ⚠️ 本策略最易产噪 / 最可能需调整，故长期保持 Audit：
#    - 用裸镜像名（如 `nginx:1.25`，隐式 docker.io/library/nginx）会被标记——这正是
#      "请显式写全 registry" 的善意提示，但意味着提升 Enforce 前要先把所有镜像写全限定名。
#    - 提升 Enforce 前务必读 `kubectl get polr -A`，按需扩充下面的白名单。
# 白名单按本仓库实际拉取来源给的宽松默认；新增可信源就往 `|` 列表里加。
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
spec:
  failurePolicy: Ignore
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        failureAction: Audit
        message: "镜像必须来自可信仓库白名单（docker.io/ghcr.io/quay.io/registry.k8s.io/gcr.io/public.ecr.aws/cgr.dev/mcr.microsoft.com）。"
        pattern:
          spec:
            containers:
              - image: "docker.io/* | ghcr.io/* | quay.io/* | registry.k8s.io/* | gcr.io/* | public.ecr.aws/* | cgr.dev/* | mcr.microsoft.com/*"
---
# ⏳ CEL 迁移 Phase A（2026-11-19）：并跑，见 disallow-latest-tag.yaml 同段说明。本条本来就是 Audit。
# `a/* | b/*` → startsWith 白名单。⚠️ 不排除系统 ns，理由同 require-probes（报告面不缩）。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    admission: {enabled: true}
    background: {enabled: true}
  autogen:
    validatingAdmissionPolicy: {enabled: false}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          ['docker.io/', 'ghcr.io/', 'quay.io/', 'registry.k8s.io/', 'gcr.io/',
           'public.ecr.aws/', 'cgr.dev/', 'mcr.microsoft.com/'].exists(r, c.image.startsWith(r)))
      message: "镜像必须来自可信仓库白名单（docker.io/ghcr.io/quay.io/registry.k8s.io/gcr.io/public.ecr.aws/cgr.dev/mcr.microsoft.com）。"
