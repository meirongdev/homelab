---
# 镜像必须来自可信仓库白名单（供应链控制）。
#
# ⚠️ 本策略最易产噪 / 最可能需调整，故长期保持 Audit：
#    - 用裸镜像名（如 `nginx:1.25`，隐式 docker.io/library/nginx）会被标记，这正是
#      "请显式写全 registry" 的善意提示，但意味着提升 Deny 前要先把所有镜像写全限定名。
#    - 提升 Deny 前务必读 `kubectl get polr -A`，按需扩充下面的白名单。
# 白名单按本仓库实际拉取来源给的宽松默认；新增可信源就往列表里加。
#
# 2026-11-19 从 ClusterPolicy 迁到 CEL ValidatingPolicy，对应关系见 disallow-latest-tag.yaml。
# 并跑对比：245 个资源结论 0 差异。`a/* | b/*` → startsWith 白名单。
# ⚠️ 刻意不排除系统 ns：Audit 只产报告，旧版后台扫描本来就覆盖 kube-system/kyverno，
#    保持报告面不缩（准入时那两个 ns 仍被全局 webhook 选择器挡在外面）。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    admission: {enabled: true}
    background: {enabled: true}
  autogen:
    validatingAdmissionPolicy: {enabled: false}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          ['docker.io/', 'ghcr.io/', 'quay.io/', 'registry.k8s.io/', 'gcr.io/',
           'public.ecr.aws/', 'cgr.dev/', 'mcr.microsoft.com/'].exists(r, c.image.startsWith(r)))
      message: "镜像必须来自可信仓库白名单（docker.io/ghcr.io/quay.io/registry.k8s.io/gcr.io/public.ecr.aws/cgr.dev/mcr.microsoft.com）。"
