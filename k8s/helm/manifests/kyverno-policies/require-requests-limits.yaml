---
# 要求容器声明 CPU/内存 requests + 内存 limit。
# 动机：本单节点曾因无界 Pod 把节点推过 110-pod / 内存上限触发驱逐（见 personal-services-limits.yaml）。
#
# Deny（2026-11-18 提升）。判据是「本策略真正 gate 的 ns 里零违规」，不是 polr 原始计数：
# 当时 11 条违规全在 kube-system，而 kube-system 本来就不在准入范围内。
# ⚠️ cloudflare / databases / litellm / opencost 这 4 个应用 ns 没有 LimitRange 兜底，
#    本策略是它们唯一的边界；回滚 = validationActions 改回 [Audit]。
# 注：未要求 limits.cpu（CPU limit 会引入节流争议）；仅校验 containers（initContainers 可后补）。
#
# 2026-11-19 从 ClusterPolicy 迁到 CEL ValidatingPolicy，对应关系与验证见 disallow-latest-tag.yaml。
# 并跑对比：两边都覆盖的 195 个资源结论 0 差异；旧版多出的只有 kube-system/kyverno 的条目
# （本条 namespaceSelector 连后台扫描一起排除了，所以那 11 条 kube-system 违规不再进报告）。
# pattern `?*` → 键存在性检查：Quantity 在 CEL 里是 int-or-string，拿它和 '' 比会类型报错，
# 而 apiserver 本来就拒绝空 quantity，所以「键在」等价于旧版的「非空」。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require Requests and Limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  failurePolicy: Ignore
  evaluation:
    admission: {enabled: true}
    background: {enabled: true}
  autogen:
    validatingAdmissionPolicy: {enabled: false}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)
      message: "每个容器必须声明 resources.requests.cpu/memory 与 resources.limits.memory。"
