---
# 禁止使用 :latest tag（不可复现、难追溯、绕过 ArgoCD Image Updater 的 newest-build）。
#
# ⚠️ digest-aware：本仓库工作负载普遍用 digest 固定（`repo@sha256:...`，比 tag 更不可变/更安全）。
#    刻意 **不** 加 "必须有 tag" 规则，那会把 digest 固定的镜像误判为缺 tag，
#    Deny 时反而拦掉最佳实践。digest 与正常 tag 均放行，只拦 `:latest`。
#    (代价：裸浮动名如 `nginx`(无 tag 无 digest) 不会被本策略拦，本仓库无此用法。)
#
# Deny 自 2026-06-18（audit 零违规后提升）。failurePolicy=Ignore 保底：Kyverno 宕机时不阻断调度。
# 回退 = validationActions 改回 [Audit]。
#
# 2026-11-19 从 kyverno.io/v1 ClusterPolicy 迁到 CEL ValidatingPolicy：Kyverno v1.20 删光了
# legacy 准入路径，不迁就是升级后静默失效。迁移时与旧版并跑对比过后台扫描报告，
# 两边都覆盖的 195 个资源结论 0 差异。与旧版的逐项对应：
#   pattern `!*:latest`          → endsWith(':latest') 取反，只查 containers（与旧版一致）
#   resourceFilters 排除系统 ns  → 显式 namespaceSelector。CEL 策略的匹配走 matchConstraints；
#                                  configmap 里全局 webhooks 选择器虽也会被合并进 webhook，
#                                  但它只排除 kube-system/kyverno，且只管准入不管后台扫描
#   autogen 全部控制器           → 不写 podControllers（源码：nil = 全部，含 CronJob）
#   allowExistingViolations      → CEL 策略不支持。迁移时受管 ns 里零违规，无影响
#   不生成原生 VAP               → 生成后执行挪到 apiserver，失败语义随之改变，刻意关掉
# ⚠️ 验证别只看 READY：主动打一发该被拒的请求（runbooks/k3s-cluster-upgrade.md §9 ⑥）。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  failurePolicy: Ignore
  evaluation:
    admission: {enabled: true}
    background: {enabled: true}
  autogen:
    validatingAdmissionPolicy: {enabled: false}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno]
  validations:
    - expression: "object.spec.containers.all(c, !c.image.endsWith(':latest'))"
      message: "禁止使用 :latest tag（请用固定 tag 或 digest @sha256: 固定）。"
