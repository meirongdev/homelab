tempo:
  # ⚠️ chart(grafana/tempo)的镜像键是扁平的 tempo.repository/tempo.tag,没有
  # image: 层级——旧写法 tempo.image.tag 是无效键,恰好与 chart 1.24.4 的
  # appVersion(2.9.0)相同才看似生效。
  # 2.9.2:Go 1.26.2 + grpc 1.79.3,修复 CVE-2025-68121 / CVE-2026-33186,
  # 另含 Tempo 自身的 CVE-2026-21728(搜索结果集无上限)修复。
  repository: grafana/tempo
  tag: 2.9.2
  replicas: 1
  
  # 追踪数据保留期
  retention: 168h               # ✅ 7 天

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

  # 资源限制
  # 2026-08-10：CPU request 50m→10m。实测 7d p95 仅 2m —— tempo 在本环境写入量极小，
  # 50m 是纯占位，而 oracle 的 allocatable 只有 1800m，每一份 request 都是调度预算。
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

# 启用查询前端(镜像键同样是扁平的 repository/tag,与 tempo 版本保持一致)
tempoQuery:
  enabled: true
  repository: grafana/tempo-query
  tag: 2.9.2
  resources:
    requests:
      cpu: 15m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 96Mi

# ⚠️ persistence 是 chart 的**顶层**键，不在 tempo: 之下。
# 2026-08-02 迁 oracle 时发现：此段此前误写在 `tempo.persistence`，是静默无效键
# ——homelab 的 tempo STS `volumeClaimTemplates` 实测为空，即一直跑在 emptyDir 上，
# 每次 Pod 重启丢光全部 trace（与本文件宣称的「7 天保留」不符）。同 tempo.image.tag
# 那个坑：chart 的键是扁平的，写错层级不报错、只是不生效。
# local-path：trace 数据 7 天保留期，可丢，不用网络存储。
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi

# 配置追踪接收器
traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true
  jaeger:
    thriftHttp:
      enabled: true
  zipkin:
    enabled: true

# Overrides — expose gRPC receiver on NodePort for cross-cluster traces
server:
  grpc:
    port: 4317
  http:
    port: 4318