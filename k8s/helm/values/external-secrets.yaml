installCRDs: true

# 2026-08-10 补 resources —— 此前本文件一处 resources 都没有，三个 Deployment 全部
# 吃 chart 默认的 `{}` → **BestEffort**。QoS 是驱逐排序的**第一级**判据（先看是否超
# request，BestEffort 的 request 恒为 0 所以永远在"超"那一档），排在标了 `bulk`(-10)
# 的个人应用**前面**被驱逐 —— 与 reference/k8s-qos-resource-management.md 里
# 「谁该先被牺牲」的设计意图正好相反。webhook 挂掉会让 externalsecret-validate
# （failurePolicy: Fail）直接拒绝所有 ExternalSecret 写入。
#
# 数值按 Prometheus 实测 7d 峰值填（CPU p95 均 ≤2m，统一给 10m）：
#   webhook 130Mi · cert-controller 64Mi · controller 本体常态 <128Mi
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 384Mi

webhook:
  port: 9443
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 384Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi

# 如果需要 Prometheus 监控
metrics:
  service:
    enabled: true

# ServiceMonitor so kube-prometheus-stack scrapes ESO controller metrics.
# additionalLabels.release MUST equal the Helm release name (kube-prometheus-stack),
# else the operator's serviceMonitorSelector ignores it and nothing is scraped.
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
