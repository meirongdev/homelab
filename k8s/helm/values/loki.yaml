loki:
  auth_enabled: false
  
  commonConfig:
    replication_factor: 1
  
  storage:
    type: filesystem
  
  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 2h
    retention_delete_worker_count: 150

  limits_config:
    retention_period: 168h
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes:
              - cluster
  
  schemaConfig:
    configs:
      - from: 2025-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # 2026-08-11 启用 ruler —— 用于日志告警（目前唯一一条：Cilium Gateway API 控制器未初始化，
  # 见 cloud/oracle/manifests/monitoring/loki-rules.yaml 与
  # docs/records/2026-08-11-gateway-api-crd-stall.md）。
  #
  # ⚠️ **不需要新 pod**：下面 `ruler.replicas: 0` 指的是「不起独立的 ruler Deployment」，
  #    而 SingleBinary 模式的 loki-0 是 `-target=all`，ruler 本来就跑在里面
  #    （实测 /ruler/ring 返回 200）。别被那个 0 误导成「ruler 没启用」。
  #
  # ⚠️ 目录必须显式写成 /rules：chart 的规则 sidecar（loki-sc-rules，watch
  #    `loki_rule` 标签的 ConfigMap）把文件写进 emptyDir `/rules`，而 ruler 的
  #    `storage.type: local` 默认目录是 `/var/loki/rules` —— 两边对不上，规则永远不被加载
  #    （症状：`/loki/api/v1/rules` 返回 `unable to read rule dir /var/loki/rules/fake`）。
  #    `auth_enabled: false` ⇒ 单租户，租户名固定为 **fake**，所以规则要落在 /rules/fake/，
  #    靠 ConfigMap 上的 `k8s-sidecar-target-directory` 注解指定。
  rulerConfig:
    storage:
      type: local
      local:
        directory: /rules
    rule_path: /tmp/loki-rules-scratch
    # Alertmanager 在 **homelab**，Loki 在 oracle —— 跨 Tailscale 投递。
    # 该 NodePort 由 k8s/helm/manifests/monitoring/monitoring-external.yaml 定义。
    alertmanager_url: http://100.94.186.7:31093
    enable_alertmanager_v2: true
    ring:
      kvstore:
        store: inmemory

# ✅ 明确指定使用 SingleBinary 模式
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  # high(900)：双集群日志的唯一汇点（homelab 的 otel 也往这推）——被驱逐 = 两集群
  # 日志一起断流。与 homelab 侧 Prometheus=high 同一档位逻辑（2026-08-12 oracle 分档补齐）。
  priorityClassName: high

  persistence:
    enabled: true
    # ⚠️ local-path（节点本地盘），不用 nfs-client：SingleBinary + filesystem 存储把 chunks/
    #   index/WAL 全写在此 PVC 上；在 NFS 上 ingester 写路径会超时（实测 POST /push 500
    #   DeadlineExceeded、/ready 持续超时、pod 长期 1/2），同 grafana/prometheus 的 sqlite/
    #   TSDB 之痛（NFS 小文件写+fsync）。本地盘根治。日志为 P2 可丢数据。2026-07-04 迁移。
    #   ⚠️ 改此字段需删旧 STS+PVC 让 helm 以新 SC 重建（volumeClaimTemplate 不可变）。
    storageClass: local-path
    size: 5Gi
  
  # 2026-08-10 按 KRR + Prometheus 实测调整（oracle 是 CPU-request 紧的那个集群：
  # allocatable 只有 1800m，补完 BestEffort 后 requests 一度到 83%）：
  #   CPU request 50m→10m —— 实测 7d p95 仅 5m，50m 是纯占位
  #   memory limit 384Mi→512Mi —— 实测 7d 峰值 292Mi = 76%，逼近 reference 里的 80% 判据
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ✅ 禁用 chunks cache（节省 9.6GB 内存！）
chunksCache:
  enabled: false
  # 或者如果你想保留但减少内存：
  # allocatedMemory: 512  # MB，从 8192 降到 512
  # replicas: 0

# ✅ 禁用 results cache 或减少内存
resultsCache:
  enabled: false
  # 或者：
  # allocatedMemory: 256  # MB

# k8s-sidecar 版本 — 覆盖 chart 默认值 (2.5.0)，修复 CVE-2026-31789
sidecar:
  image:
    tag: 2.8.1
  # 2026-08-24: chart 默认 `resources: {}`，于是 loki-0 里的 loki-sc-rules 容器
  # 一直裸奔 —— 实测常驻 ~85Mi / 峰值 101Mi 对调度器完全隐身（oracle 内存 requests
  # 已 73%），且无 limit 可以无限涨。
  # ☠️ 这类漏网**逃得过 runbook §5 那条「数 BestEffort pod 收敛到 0」的判据**：
  #   QoS 是 pod 级的，主容器 loki 有 requests → 整个 pod 记作 Burstable，
  #   裸奔的 sidecar 不体现。要按**容器**扫 `.resources.requests.memory == ""`。
  #   同一天在 falco 的 falcoctl-artifact-follow 上抓到同样的形状。
  # 取值：memory limit 192Mi ≈ 峰值的 1.9 倍；CPU limit 100m ≈ 实测峰值 30m 的 3 倍
  #   （k8s-sidecar 是 ConfigMap watcher，突发只在启动时列一遍，节流也只是晚点加载
  #   规则，不影响 Loki 收日志）。⚠️ oracle 侧无法用节流率验证——otel-collector 不
  #   keep `container_cpu_cfs_throttled_*`，查询返回空与「无节流」外观相同。
  resources:
    requests: { cpu: 10m, memory: 128Mi }
    limits: { cpu: 100m, memory: 192Mi }

# ✅ 禁用 self-monitoring (grafanaAgent operator etc.)
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# ✅ 禁用 canary — chart 7.1.0 把路径从 monitoring.lokiCanary 移到顶层
lokiCanary:
  enabled: false # 禁用 canary, 节省资源

# ✅ 禁用 helm test —— 必须与上面 lokiCanary 一起关。
# chart 默认 test.enabled=true，其 templates/validate.yaml 硬性要求"跑 test 就得开 canary"，
# 否则 helm template 直接 FATAL（`Helm test requires the Loki Canary to be enabled`）。
# 之前只关了 canary 没关 test → ArgoCD 无法渲染 loki manifest → app 卡在 Unknown 同步态、
# 脱离 GitOps 管理（推 values 改动不生效、selfHeal 失效）。我们本就不跑 canary test，直接关掉。
test:
  enabled: false

# ✅ 确保禁用其他模式的组件
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

# Gateway
gateway:
  enabled: true
  replicas: 1
  # high(900)：它是日志写入的唯一入口（otel 推的是 gateway 不是 loki 本体），
  # 只保 loki-0 不保它，断流形态一样。
  priorityClassName: high
  resources:
    requests:
      cpu: 15m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # chart 默认给 gateway 配**硬性** podAntiAffinity（topologyKey kubernetes.io/hostname），
  # 那是为多节点 HA 设计的。单节点集群上它是**滚动更新死锁**：replicas=1 时
  # maxUnavailable 25% 向下取整为 0 → 旧 pod 不能先走；maxSurge 25% 起的新 pod
  # 又因为 anti-affinity 撞上旧 pod 而 Unschedulable。两边互等，永久 Pending，
  # 不是暂时现象。2026-08-05 改 gateway requests 时实测踩到（"1 node(s) didn't
  # match pod anti-affinity rules"，卡了 5 分钟没有自愈迹象）。
  # 置空而不是改 strategy: Recreate —— 后者在 live Deployment 上会报
  # "rollingUpdate: Forbidden"，得额外加 Replace=true sync-option。
  #
  # ⚠️⚠️ 必须写 `null`，写 `{}` **不生效**。模板是 `{{- with .Values.gateway.affinity }}`，
  # 看着 `{}` 是假值就该跳过，但 Helm 合并 values 时**空 map 不覆盖非空的 chart 默认值**
  # （coalesceTables 的既定行为），`.Values.gateway.affinity` 拿到的仍是 chart 那份
  # 硬编码 anti-affinity。只有显式 `null` 才会删掉这个键。
  # 2026-08-05 先写了 `{}`，ArgoCD 报 Synced、渲染结果一字未变、pod 继续 Pending ——
  # **"Synced" 只保证 live == 渲染结果，不保证渲染结果 == 你的意图**。
  # 改这类 nested map 覆盖后一定先 `helm template ... -f values/loki.yaml` 本地渲染核对。
  affinity: null

# 明确禁用分布式组件（重要！）
ingester:
  replicas: 0
distributor:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
ruler:
  replicas: 0


# Promtail 已由 OTel Collector DaemonSet 替代
promtail:
  enabled: false
