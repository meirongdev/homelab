# Sloth — SLO 生成器。监听 PrometheusServiceLevel CR，自动生成 PrometheusRule
# (SLI 录制规则 + 多窗口燃尽率告警)。运行在 monitoring namespace。
# 不改数据面，只生成规则，风险低。
sloth:
  defaultSloPeriod: "30d"
  # 生成的规则/PrometheusRule 带此 label，否则 kube-prometheus-stack 的
  # ruleSelector(默认 release=kube-prometheus-stack)会静默忽略，规则不会被加载。
  extraLabels:
    release: kube-prometheus-stack

# 关掉 commonPlugins 的 git-sync sidecar：我们用 raw events 查询，不依赖外部
# GitHub SLI 插件库，省一个 sidecar + 外部依赖。
commonPlugins:
  enabled: false

# Sloth 自身运行指标的 ServiceMonitor 也带 release label 才会被抓取
metrics:
  enabled: true
  prometheusLabels:
    release: kube-prometheus-stack

# 2026-08-10: CPU limit 50m→200m、request 5m→10m。
# 实测节流率 **20%**（非本次引入，是既有状态；当天查 node-exporter 回归时顺带发现）。
# sloth 的工作是「按 SLO CR 生成 recording rules」——变更时短促突发、平时接近 0，
# 50m 的天花板正好卡在突发上，把生成拖慢。200m 给 4 倍头寸，仍保留上限
# （符合 CLAUDE.md 热笔记本「控 CPU」的约束，它不是常驻负载）。
# ⚠️ 这类问题 `kubectl top` 和 1m 粒度的 rate 都看不出来（平均值极低），
#    只能看 container_cpu_cfs_throttled_periods_total / ..._periods_total。
resources:
  requests:
    cpu: 10m
    memory: 75Mi
  limits:
    cpu: 200m
    memory: 150Mi
