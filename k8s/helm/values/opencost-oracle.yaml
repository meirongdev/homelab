# OpenCost — 集群成本归因（oracle-k3s）
# Chart: opencost/opencost  (仓库 https://opencost.github.io/opencost-helm-chart)
# 由 homelab ArgoCD 经 Tailscale 部署到 **oracle 集群**（argocd/applications/opencost-oracle.yaml），
# dest ns: opencost（ns 由 oracle-k3s kustomize App 拥有，见 cloud/oracle/manifests/opencost/）
#
# 与 homelab 版（values/opencost.yaml）的差异仅三处：
#   ① defaultClusterId: oracle-k3s
#   ② customPricing 用 OCI Ampere A1 牌价做影子定价
#   ③ 无 ServiceMonitor —— oracle 没有 Prometheus Operator，改由 otel-collector 抓 :9003
#      （cloud/oracle/manifests/monitoring/otel-collector.yaml › prometheus/opencost）
#
# 方案见 docs/plans/observability/2026-07-30-opencost-multicluster.md

# ArgoCD 用 Application 名当 Helm release 名，而两个 App 同处 argocd ns 必须重名不冲突，
# 于是这边 release 叫 opencost-oracle，资源会被渲染成 opencost-oracle/opencost-oracle-pvc。
# 覆盖回 opencost，与 homelab 侧资源名对齐 —— otel 的抓取目标
# (opencost.opencost.svc.cluster.local:9003)、port-forward 命令、runbook 才能两集群通用。
fullnameOverride: opencost

opencost:
  exporter:
    defaultClusterId: oracle-k3s

    # 直采本地 kubelet，不查 Prometheus —— oracle 本地无 Prometheus，
    # 也因此不必跨 Tailscale 依赖 homelab 存活（故障域自治）。
    # ⚠️ collector 每次 scrape 落一个 ~250KB 的 .bingen WAL 到 emptyDir（CONFIG_PATH，
    #    与 PVC 无关），启动时**全量重放完才 bind :9003**；WAL 窗口 = 最长那档 retention
    #    （= retention1d）。30s×15d 的旧参数在 08-18 节点重启后重放 3m43s > 探针预算
    #    → 崩循环 24h 烧 1.1/2 核。机制与判据 →
    #    docs/records/2026-08-19-opencost-bingen-replay-crashloop.md
    collectorDataSource:
      enabled: true
      # 2m 而非默认 30s：WAL 文件量 ÷4（720/天）。成本归因不需要 30s 粒度，
      # 10m 一档 rollup 每桶仍有 5 个样本。
      scrapeInterval: 2m
      retention10m: 36 # 6h
      retention1h: 49 # ~2d
      # 7 而非默认 15：这就是 WAL 重放窗口。稳态 ≈5,040 个/1.2GB，重放 ≈50s
      # （A1 实测 ~107 文件/s）。看板与落点决策只用 ≤7d 窗口。
      retention1d: 7 # 7d = WAL 重放窗口

    # 重放期间 /healthz 不应答 → startupProbe 预算必须 ≥ 最坏重放时长。
    # 120×5s = 10min ≈ 12× 稳态重放；只作用于启动阶段，运行期无代价。
    startupProbe:
      failureThreshold: 120

    # 刻意不配 persistence：那个 PVC 挂 /mnt/export（CSV 导出目录），与 collector WAL
    # 无关，2026-07-30 建起到 2026-08-19 删除时始终 0 字节。WAL 落 emptyDir = pod 重建
    # 即历史归零，已接受（homelab 08-16 丢过一次，无人受影响）。想跨重建保历史得把
    # configPath 指到持久卷，但有 emptyDir 遮蔽坑 —— 见复盘"未做项"，别只改 values。

    # 2026-08-10: memory limit 384Mi→512Mi。实测 7d 峰值 338Mi = **88%**，
    # 过了 reference/k8s-qos-resource-management.md 的 80% 判据。
    # opencost 的内存随被观测对象数增长，而 oracle 的 pod 数还在涨。
    resources:
      requests:
        cpu: 10m
        memory: 200Mi
      limits:
        memory: 512Mi

  mcp:
    enabled: false

  customPricing:
    enabled: true
    provider: custom
    createConfigmap: true
    costModel:
      description: "oracle-k3s Ampere A1 (Always Free) — OCI 牌价影子定价"
      # 影子定价而非填 0：本看板的价值是"工作负载该放哪个集群"的比较决策，
      # 填 0 会让 oracle 永远赢。另外 Oracle 2026-07 已把 Free Tier A1 配额砍半
      # （当前 4 OCPU/24GB 是旧额度），影子定价正好量化这块暴露面。
      #
      # OCI Ampere A1 牌价：$0.01/OCPU-hr、$0.0015/GB-hr。
      # A1 无 SMT，1 OCPU = 1 vCPU，可直接用作 OpenCost 的 CPU 单价。
      # 本节点 4 OCPU / 23.4GB → 4×0.01 + 23.4×0.0015 = $0.0751/hr ≈ $54.8/月
      CPU: "0.01"
      RAM: "0.0015"
      # ⚠️ 待核实：OCI Block Volume 牌价（$/GB-月 ÷ 730）。
      # 实施时查 oracle.com/cloud/price-list 填入；本环境 storage 成本占比极小，先置 0 不阻塞。
      storage: "0"
      GPU: "0"
      spotCPU: "0.01"
      spotRAM: "0.0015"
      zoneNetworkEgress: "0"
      regionNetworkEgress: "0"
      # 出网在 10TB/月免费额度内，暂不计价
      internetNetworkEgress: "0"

  prometheus:
    internal:
      enabled: false
    external:
      enabled: false

  metrics:
    serviceMonitor:
      # oracle 无 Prometheus Operator（CRD 不存在，开启会同步失败）。
      # 指标由 otel-collector 的 prometheus/opencost receiver 抓取后
      # remote-write 到中枢 Prometheus，cluster 标签在那边打。
      enabled: false

  ui:
    enabled: true

# 2026-08-06：此前无 priorityClass，等于落在默认档 0 —— 比标了 bulk(-10) 的
# 个人应用还高。成本看板是纯观测组件，被驱逐只丢一段成本采样，不影响任何运行时依赖，
# 归 bulk 才符合四档模型的本意（见 docs/reference/k8s-qos-resource-management.md）。
# ⚠️ 键在**顶层**（chart 2.5.28 values 第 115 行），不是 opencost.* 下面。
priorityClassName: bulk
