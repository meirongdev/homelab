# OpenCost — 集群成本归因（homelab）
# Chart: opencost/opencost  (仓库 https://opencost.github.io/opencost-helm-chart)
# 由 ArgoCD Helm App 部署到 **homelab 集群**（argocd/applications/opencost.yaml），dest ns: opencost
#
# 数据源选型：collector（**不查 Prometheus**）。理由见
# docs/plans/observability/2026-07-30-opencost-multicluster.md
#   - oracle 侧 otel 未采 OpenCost 需要的 cAdvisor 指标（后来为 KRR 加的 cadvisor job
#     只 keep 了 2 个指标，不含 container_fs_* / container_network_*），
#     中枢 Prometheus 无法支撑 oracle 的 Prometheus 数据源
#   - collector 直读 kubelet stats/summary（经 apiserver proxy，chart 已含 nodes/proxy RBAC），
#     自带 7d 日粒度（2026-08-19 起收窄，见下），不给 5Gi/7d 的 TSDB 加压，且 oracle 不必依赖 homelab 存活
#
# 成本指标仍从 :9003 导出 → ServiceMonitor → 中枢 Prometheus → Grafana 按 cluster 聚合。

opencost:
  exporter:
    defaultClusterId: homelab

    # 不依赖 Prometheus 的数据源：直采 kubelet + K8s API，自持 10m/1h/1d 三级 rollup。
    # ⚠️ rollup 不在"进程内存里"（08-16 的旧结论只对了一半）：每次 scrape 落一个
    #    ~250KB 的 .bingen WAL 到 emptyDir（CONFIG_PATH），启动时**全量重放完才 bind
    #    :9003**，WAL 窗口 = retention1d。oracle 侧 30s×15d 积到 5.5GB，节点重启后
    #    重放超探针预算 → 崩循环 24h。本文件参数与 oracle 同步收窄；机制与实测 →
    #    docs/records/2026-08-19-opencost-bingen-replay-crashloop.md
    collectorDataSource:
      enabled: true
      # 2m 而非默认 30s：WAL 文件量 ÷4。成本归因不需要 30s 粒度。
      scrapeInterval: 2m
      retention10m: 36 # 6h
      retention1h: 49 # ~2d
      retention1d: 7 # 7d = WAL 重放窗口（这就是启动时要重放的量）

    # 重放期间 /healthz 不应答 → 预算必须 ≥ 最坏重放时长（10min ≈ 12× 稳态）。
    startupProbe:
      failureThreshold: 120

    # 2026-08-19 删掉了此前的 2Gi PVC：08-16 已实测它是 0 字节（chart 挂它到
    # /mnt/export = CSV 导出目录，与 WAL 的 CONFIG_PATH 无关），今日查清机制后
    # 定案移除。pod 重建 = emptyDir 清零 = 成本历史归零，已接受；想改见复盘"未做项"。

    # opencost ns 不在 namespace-guardrails 的 LimitRange 覆盖范围内（该 App 只管 4 个既有 ns），
    # 故在此显式声明。
    resources:
      requests:
        cpu: 20m
        memory: 200Mi
      limits:
        memory: 1Gi

  # 落 106 worker（2026-08-16）：纯观测组件，查的是 kubelet stats + K8s API（跨节点无所谓），
  # 腾出控制面上约 248Mi 常驻内存。它的 PVC 是空的（见上），搬走不损失任何数据 ——
  # 但 PVC 对象仍要删掉重建，local-path 卷不跟随调度。
  # ☠️ 层级三选一，全在这一个 chart 里，且**错了全是静默的**（Helm 忽略未知键）：
  #   · `opencost.nodeSelector`（本条，chart 2.5.28 values 第 868 行 / deployment.yaml:48）
  #   · 顶层 `priorityClassName`（第 115 行）
  #   · `opencost.exporter.*` 只管容器级的东西（resources / persistence / 数据源）
  # 第一次改这里就写成了 `opencost.exporter.nodeSelector` —— 渲染出来的 Deployment 里
  # 干脆没有 nodeSelector 字段，Pod 照样落回控制面，没有任何报错。判据是
  # `kubectl -n opencost get deploy opencost -o jsonpath='{.spec.template.spec.nodeSelector}'`。
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-106

  # chart 默认开启，会额外暴露一个供 AI agent 读成本数据的 HTTP 端点（:8081）。不需要。
  mcp:
    enabled: false

  customPricing:
    enabled: true
    provider: custom
    createConfigmap: true
    costModel:
      description: "homelab bare-metal (Ryzen 5600H) — 实测功耗 + 硬件摊销"
      # ⚠️ 全部用字符串：YAML 数值会被渲染成科学计数法（0.0000018 → "1.8e-06"）写进 ConfigMap。
      #
      # 推导（占位值，上线跑满 24h 后用 RAPL 实测回推替换）：
      #   整机 45W × 730h × ¥0.55/kWh = ¥18.1/月；硬件 ¥3500/48月 = ¥72.9/月
      #   合计 ≈ ¥91/月 ≈ $12.6/月 → 节点小时成本 $0.01726/hr
      #   CPU:RAM 按 AWS 默认单价对本规格反推 = 82.5 : 17.5
      #   CPU = 0.01726 × 0.825 / 8      = 0.0018
      #   RAM = 0.01726 × 0.175 / 12.66  = 0.00024
      #   storage: 1TB ¥450 / 48月 / 1000GB / 730h ≈ 0.0000018
      # 实测命令：avg_over_time(rate(node_rapl_package_joules_total{cluster="homelab"}[5m])[7d:])
      # （RAPL 只覆盖 CPU package+DRAM，整机墙上功率再加 15–20W）
      CPU: "0.0018"
      RAM: "0.00024"
      storage: "0.0000018"
      # 无 GPU / 无 spot —— chart 默认值非零（GPU 0.95 / spotCPU 0.006655），必须覆盖，
      # 否则将来节点被打上 spot 标签会算出离谱数字。
      GPU: "0"
      spotCPU: "0.0018"
      spotRAM: "0.00024"
      zoneNetworkEgress: "0"
      regionNetworkEgress: "0"
      internetNetworkEgress: "0"

  # collector 模式下 PROMETHEUS_SERVER_ENDPOINT 完全惰性（router.go 在
  # IsCollectorDataSourceEnabled() 时重新赋值数据源工厂，Prometheus 闭包永不执行），
  # 此处显式关闭仅为避免误读成"连了 Prometheus"。
  prometheus:
    internal:
      enabled: false
    external:
      enabled: false

  metrics:
    serviceMonitor:
      enabled: true
      scrapeInterval: 60s
      honorLabels: true
      additionalLabels:
        # Prometheus serviceMonitorSelector = {release: kube-prometheus-stack}，不加则不被发现
        release: kube-prometheus-stack
      # cluster 标签无需在此设置：prometheusSpec.scrapeClasses 有 default:true 的类，
      # 对所有 ServiceMonitor 统一打 cluster=homelab（见 reference/observability-multicluster.md）。
      # OpenCost 导出的指标自身确实不带 cluster 标签，但 oracle 侧由 otel target label 补、
      # homelab 侧由 scrapeClasses 补，两边都不需要 per-ServiceMonitor 配置。

  ui:
    enabled: true

# 2026-08-06：同 opencost-oracle.yaml —— 纯观测组件归 bulk，理由见那份注释。
# homelab 侧内存压力比 oracle 更紧（7d 最低 MemAvailable 3.31G/12.66G）。
# ⚠️ 键在**顶层**（chart 2.5.28 values 第 115 行），不是 opencost.* 下面。
priorityClassName: bulk
