# Trivy Operator —— oracle-k3s 实例（镜像 CVE / 配置审计 / RBAC / 暴露密钥 持续扫描）
# Chart: aqua/trivy-operator  ·  ArgoCD App: argocd/applications/trivy-operator-oracle.yaml
#
# 为什么 oracle 也要一份（2026-08-03 新增）：此前 trivy-operator 只在 homelab，
# 而 2026-08 的两轮迁移把 **ArgoCD 控制面 / Loki / Tempo / Calibre-Web** 都搬到了 oracle
# ——这些镜像随之脱离 CVE 扫描，形成盲区。oracle 上还常驻 ZITADEL(身份面)、KaraKeep、
# Miniflux 等公网服务，本就是更该被扫的一侧。
#
# 与 homelab 那份（values/trivy-operator.yaml）的**三处实质差异**：
#
#   1. serviceMonitor **必须关**：oracle 没有 Prometheus Operator
#      （实测 `kubectl get crd | grep monitoring.coreos.com` 为 0 条），
#      开着会让整个 App 渲染出无法识别的 CRD 而同步失败。
#      指标改由 oracle 的 otel-collector 直抓 :8080 再 remote-write 回 homelab Prometheus
#      （⚠️ 必须是容器端口 8080 而非 Service 端口 80——该 Service 是 headless，
#        DNS 直接给 pod IP，端口映射不生效；实测 :80 refused / :8080 200）
#      ——同 external-dns / opencost / ESO 的既有做法，见
#      cloud/oracle/manifests/monitoring/otel-collector-config.yaml。
#
#   2. scanJobsConcurrentLimit 从 1 抬到 **2**：homelab 那个 1 是为「5600H 笔记本
#      idle 74°C」的热约束设的，oracle 是 4 核云实例、实测 CPU 9%，没有该约束。
#      ⚠️ 原先以为抬并发能"顺带缓解 Complete 滞留 Job 占槽"——2026-08-03 首次部署
#      实测证否：滞留 Job 一样占满 limit=2，队列照样停摆（33 分钟零动静、零报错，
#      46 个负载只出 7 份报告）。抬并发只是把停摆门槛从 1 个滞留抬到 2 个。
#      真正的解法是把 scanJobTTL 从 1h 降到 5m 让槽位及时释放（见下方注释），
#      两个集群都已改。并发上限的职责回归本位：只管"同时跑几个"，不管吞吐。
#
#   3. accepted-risk CVE 列表按**镜像实际所在集群**重排（见下）。
#
# 其余（ClientServer + builtInTrivyServer 共享 DB、severity 只取 HIGH/CRITICAL、
# ignoreUnfixed、clusterComplianceEnabled=false）与 homelab 同口径，理由见那份 values。

# ⚠️ ArgoCD 用 Application 名当 helm release 名，不加这条的话本集群对象会叫
# `trivy-operator-oracle`，与 homelab 的 `trivy-operator` 不一致 —— 告警/看板/runbook
# 里的名字就得分两套写。对齐命名（同 oracle otel-collector 的既有做法）。
# 2026-08-03 实测教训：最初漏了这条，collector 抓 `trivy-operator.trivy-system.svc`
# 直接 NXDOMAIN。
fullnameOverride: trivy-operator

targetNamespaces: ""
excludeNamespaces: "kube-system,kube-public,kube-node-lease,trivy-system"

operator:
  # 见文件头 §2：oracle 无热约束，2 条并发 + 缓解滞留 Job 占槽
  scanJobsConcurrentLimit: 2
  # 见文件头 §2 的实测结论：滞留 Job 占槽要靠这个 TTL 回收，抬并发只是把停摆
  # 门槛从 1 个滞留抬到 2 个，并没有解决问题。5m 才是真正的解法。
  # 不要改回 1h —— 那等于把吞吐锁死在 2 个镜像/小时（46 个负载要 23 小时扫完）。
  scanJobTTL: "5m"
  metricsFindingsEnabled: true
  vulnerabilityScannerEnabled: true
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  configAuditScannerEnabled: true
  configAuditScannerScanOnlyCurrentRevisions: true
  rbacAssessmentScannerEnabled: true
  exposedSecretScannerEnabled: true
  clusterComplianceEnabled: false        # CIS 节点合规交给 kube-bench（homelab 侧）
  builtInTrivyServer: true

resources:
  requests:
    cpu: 25m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi                        # 同 homelab：256Mi 会 OOM（2026-07-16 实测）

trivy:
  mode: ClientServer
  ignoreUnfixed: true
  severity: "HIGH,CRITICAL"

  # trivy ≥0.72.0 必须：0.71 的临时目录名会让多容器 workload 的扫描 100% 撞名互删。
  image:
    tag: "0.72.0"

  # ---- Accepted-risk CVE 抑制 ----
  # ⚠️ 格式坑（改动前必读，与 homelab 那份同）：
  #   1. 必须 .trivyignore.yaml（YAML）格式——chart 把 ignoreFile 渲染成 "- CVE-xxx" 行，
  #      纯文本解析器会把行首的 "-" 当成 ID → 静默失效；
  #   2. 不能用 expired_at 字段——helm 的 YAML→JSON 往返会给日期加引号，
  #      而 trivy(yaml.v3) 只对不带引号的标量做 timestamp 解析 → 所有扫描 Job FATAL。
  #      复审日期只能写在 statement 里。
  ignoreFileName: ".trivyignore.yaml"
  ignoreFile:
    vulnerabilities:
      # --- ArgoCD（2026-08-02 从 homelab 迁入本集群）---
      - id: CVE-2025-68121
        statement: "Go stdlib, argocd v3.4.5 等上游重建镜像; v3.5 GA 约 2026-08-04, 2026-09 复审"
      - id: CVE-2026-33186
        statement: "grpc-go, argocd v3.4.5 无可用修复版, 等 v3.4.6/v3.5, 2026-09 复审"
      # --- Calibre-Web-Automated（2026-08-03 从 homelab 迁入本集群）---
      # 镜像内 kepubify 为 Go 1.17.8 构建，上游一直未重建
      - id: CVE-2023-24538
        statement: "CWA kepubify (Go 1.17.8), 上游未重建, 2026-11 复审"
      - id: CVE-2023-24540
        statement: "CWA kepubify (Go 1.17.8), 上游未重建, 2026-11 复审"
      - id: CVE-2024-24790
        statement: "CWA kepubify (Go 1.17.8), 上游未重建, 2026-11 复审"
      # --- 以下两条为 2026-08-04 TrivyImageCriticalVulnerabilities(73 条 Critical)分诊结论 ---
      # 两条 CVE 合计占那 73 条中的 35 条(48%),且都不是"升级镜像"能解的。
      #
      # CVE-2026-31789：24/73(33%),横跨 10 个镜像(cloudflared / excalidraw / it-tools /
      # alpine-k8s / meilisearch / nginx / rsshub / squoosh / wait4x / zitadel-login)。
      # **架构上不适用**：OpenSSL 官方公告(openssl-library.org, 2026-04-07)原文
      # "only 32 bit platforms are affected"，且触发需要 >1GB 的 X.509 证书被打印/记录，
      # 故官方定级 **Low**。NVD 却给了 9.8/Critical —— 典型的 NVD 过度评分。
      # 本集群节点 oracle-k3s 是 **arm64(64 位)**(kubectl get node -o wide 实测)，无法触发。
      # 不逐镜像等上游重建：那 10 个里 wait4x:3.6 / alpine-k8s:1.34.9 实测仍是 3.5.5-r0，
      # 上游没有已修版本可升。
      - id: CVE-2026-31789
        statement: "OpenSSL 官方定级 Low 且明确 only 32 bit platforms affected(需 >1GB 证书); 本集群 arm64 不适用; NVD 9.8 为过度评分, 2026-11 复审"
      # CVE-2026-59873：11/73(15%),横跨 6 个镜像(excalidraw-room / homepage / karakeep /
      # rsshub / uptime-kuma / zitadel-login)全是 npm 传递依赖 tar。修复版 7.5.19，
      # 这 6 个上游镜像**都还没重建到该版本**(homepage/excalidraw 已实测在 latest digest)。
      # 与 homelab 那份 values 里 open_notebook 的同 CVE 豁免同口径：gzip 炸弹 DoS，
      # 这些服务运行时都不解包不可信归档。
      - id: CVE-2026-59873
        statement: "npm tar 传递依赖(修复 7.5.19), 6 个上游镜像均无已修版本; gzip 炸弹 DoS 且运行时不解包不可信归档; 同 homelab open_notebook 口径, 2026-10 复审"
      #
      # --- uptime-kuma：升到 2.5.0 后只剩这一条（2026-08-05）---
      # 原先这里挂了三条（liquidjs RCE / fast-xml-parser XSS / protobufjs）。已升级到
      # 2.5.0，逐个进镜像核过：liquidjs 10.26.0（=修复版）、fast-xml-parser 5.8.0
      # （>修复版 5.3.5）→ 那两条已删。protobufjs 在 2.5.0 里**仍是 7.2.6**
      # （修复版 7.5.5），所以这条留着。
      # ⚠️ 这条原先也命中 rsshub。刷新 rsshub digest 后实测其 protobufjs 已是 7.6.5
      # → 本条现在只对 uptime-kuma 生效，不会掩盖 rsshub。若将来 rsshub 又报此条，
      # 说明 digest 回退了，别当成本豁免的正常覆盖范围。
      # 实际暴露面：protobufjs 注入需要能投喂 .proto 定义，uptime-kuma 里没有这条路径
      # （gRPC 监控类型的 proto 由已认证管理员配置），status.meirong.dev 不开放注册。
      - id: CVE-2026-41242
        statement: "protobufjs 7.2.6(修复 7.5.5); uptime-kuma 2.5.0 仍未 bump, 等上游; 投喂 proto 需已认证管理员, 2026-10 复审"
      #
      # --- uptime-kuma:2.5.0-slim 的 libgnutls30 两条（2026-08-05 新增）---
      # 背景：v2 裸镜像内置 chromium+mariadb-server，实测 121 条 Critical，故钉 -slim
      # （见 cloud/oracle/manifests/uptime-kuma/uptime-kuma.yaml 的长注释）。-slim 降到
      # 8 条，其中 6 条已被上面的 stdlib/tar/grpc/protobufjs 覆盖，只剩这两条。
      # 两条都是 libgnutls30 3.7.9-2+deb12u6（修复 u7）—— slim 基底比 Debian 当前
      # 安全更新落后一个补丁版，只能等 louislam 重建，我们无法自行升级。
      # **两条都需要本实例扮演它并不扮演的角色**（逐条读过公告原文）：
      #   · CVE-2026-33845：DTLS 握手分片重组的整数下溢，需要解析 DTLS 握手；
      #     uptime-kuma 是出向 HTTPS 监控客户端，不是 DTLS 服务端（也不收 UDP）。
      #   · CVE-2026-42010：仅当服务端配置 **RSA-PSK** 密码套件时，用户名 NUL 截断
      #     导致认证绕过；本实例不作为 TLS 服务端提供 RSA-PSK（入口 TLS 在
      #     Cloudflare/Gateway 终结，且不启用 PSK 套件）。
      # Red Hat 定级 7.5 / 7.1（High），NVD 给 9.1 / 9.8 —— 同 CVE-2026-31789 那条的
      # NVD 过度评分模式。
      # ⚠️ 覆盖范围警告：trivy ignoreFile 按 CVE ID **全集群**生效。这两条此前也命中
      # cnpg-postgresql 17.6 与 rsshub，但都已被 782a6cb/697ff50 的镜像升级真修掉
      # （现报告为 0），所以本豁免当下不掩盖任何已知问题；**若将来这两条又出现在
      # postgres/rsshub 上，说明镜像回退了，别当成本豁免的正常覆盖范围**（同上面
      # protobufjs 那条的口径）。
      - id: CVE-2026-33845
        statement: "libgnutls30 deb12u6(修复 u7); uptime-kuma:2.5.0-slim 基底待上游重建; DTLS 握手重组漏洞而本实例是出向 HTTPS 客户端非 DTLS 服务端; RedHat 定级 7.5, 2026-11 复审"
      - id: CVE-2026-42010
        statement: "libgnutls30 deb12u6(修复 u7); uptime-kuma:2.5.0-slim 基底待上游重建; 需服务端启用 RSA-PSK 套件, 本实例不作 TLS 服务端; RedHat 定级 7.1, NVD 9.8 过度评分, 2026-11 复审"
      #
      # --- 上游已停更、无已修镜像可升的三条（同批分诊，均已逐一实测确认）---
      # alpine-chrome: 实测 `latest` 与 `124` 是同一个 libxml2-2.11.8-r0（修复版 2.11.8-r1），
      # gcr 上数字 tag 也停在 124 → zenika 已不再重建，无处可升。仅 karakeep 抓取用。
      - id: CVE-2024-56171
        statement: "libxml2 UAF; zenika-hub/alpine-chrome 上游停更(实测 latest==124 同为 2.11.8-r0)无已修镜像, 2026-11 复审"
      # excalidraw-room 是自建镜像，但 minimist 来自 upstream 按 commit pin 的 yarn.lock
      # (ROOM_REF=03ff435, 2023-12)，重建不会变；要修得动 lockfile 或抬 ROOM_REF。
      # CVSS 仅 3.1（原型污染），不值得为它冒动 lockfile 的回归风险。
      - id: CVE-2021-44906
        statement: "minimist 原型污染(CVSS 3.1); excalidraw-room 的 yarn.lock 随 ROOM_REF 固定, 重建不改变, 修需抬 ROOM_REF, 2026-11 复审"
      - id: GHSA-7rqj-j65f-68wh
        statement: "@auth/core 同形字符 @ 绕过; karakeep 已钉 :release(上游最新)仍未 bump 到 0.41.3, 等上游, 2026-10 复审"
      # （原先这里有一条 CVE-2026-42945 的临时豁免——nginx 1.28.2-r1 任意代码执行。
      #   2026-08-05 已在源仓库 meirongdev/it-tools 把 base 钉到 nginx:1.30-alpine
      #   并重建（sha-ffb28a7），实测 nginx-1.30.4-r1 → 真修掉了，故删除该豁免。）

  # 扫描 Job（client）资源
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # 内置 Trivy server：持久化漏洞 DB。DB 可丢可重建（重下一次即可），
  # 故用 local-path 无妨；oracle 节点剩余 155GB，2Gi 无压力。
  storageClassName: local-path
  storageSize: 2Gi
  server:
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ⚠️ 见文件头 §1：oracle 无 Prometheus Operator，ServiceMonitor CRD 不存在，必须关。
serviceMonitor:
  enabled: false
