# Multica —— 把 issue 派给 Claude Code / Codex / Cursor 等编码 agent 的开源协作平台
# Chart: oci://ghcr.io/multica-ai/charts/multica   App: argocd/applications/multica.yaml
# 入口: https://multica.meirong.dev   路由: k8s/helm/manifests/gateway/route-multica.yaml
#
# ☠️ 本服务是**两半**的，这份 values 只部署 service 端（frontend + backend + Postgres）。
#    真正执行 agent 的是 daemon（`multica computer`），它**不在 k8s 里** ——
#    跑在 M2 MacBook 上，见 macbook/ansible/playbooks/multica-daemon.yaml。
#    daemon 只做 outbound 注册，不需要任何入站端口，所以它在 NAT 后面也无所谓。

# ESO 生成的 Secret（k8s/helm/manifests/personal-services/multica-secret.yaml）。
# chart 用 envFrom.secretRef 整个注入 backend，所以往这个 Secret 里加任何 key
# 都会直接变成 backend 的环境变量 —— MULTICA_VCS_SECRET_KEY 就是这么进去的。
existingSecret: multica-secrets

postgres:
  # ☠️ 2026-08-25：multica **不再自带 postgres**。库搬到了 homelab 的共享实例
  #    `databases/apps-pg`（租户 multica，见 decisions/shared-postgres-platform.md 决策四）。
  #    external.enabled=true 会让 chart 不渲染 postgres 的 Deployment/PVC/Service，
  #    **也不再注入 env DATABASE_URL**（templates/backend.yaml 里那段有守卫）——
  #    连接串改由 existingSecret 的 DATABASE_URL 经 envFrom 进来，
  #    真相源是 Vault `secret/homelab/multica` 的 `database_url`
  #    （清单：manifests/personal-services/multica-secret.yaml）。
  #
  # ⚠️ 下面刻意**不留** database/user/persistence/resources 那几项：
  #    external 模式下它们一行都不渲染，留着只会让人以为还有个自带库。
  #    历史值（PVC 10Gi local-path、requests 50m/192Mi、钉 control-plane）
  #    见 git 历史 —— 需要回滚就从那里取。
  #
  # ⚠️ 翻回 false 不等于回滚：那会起一个**空**的新库并跑一遍 migrate，
  #    旧 PVC 已随本次改动被 prune 掉了。回滚要先从 restic 的 multica.dump 恢复。
  external:
    enabled: true

backend:
  replicas: 1
  uploads:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path
      accessModes:
        - ReadWriteOnce
  config:
    appEnv: production
    appUrl: https://multica.meirong.dev
    frontendOrigin: https://multica.meirong.dev
    corsAllowedOrigins: ""
    cookieDomain: ""
    # ⚠️ 这个值**当前不生效**，留着只是为了不让它变成 chart 默认的 noreply@multica.ai。
    # 2026-08-18 起邮件走 **Gmail SMTP**，发信人由 `SMTP_FROM_EMAIL` 决定
    # （见 manifests/personal-services/multica-secret.yaml 的 SMTP 一段）：
    # 源码 resolveFromEmail() 在 SMTP_HOST 有值时优先取 SMTP_FROM_EMAIL，
    # 只有两者都空才回落到这里。改发信人请改 Vault 的 smtp_from_email，别改这行。
    resendFromEmail: onboarding@resend.dev

    # ── 注册闸门 ──────────────────────────────────────────────────────────
    # ☠️ 语义与官方文档**相反**，以源码为准（server/internal/handler/auth.go
    #    checkSignupAllowed，2026-08-18 读 main 分支确认）。判定顺序是：
    #      1. 命中 ALLOWED_EMAILS      → 直接放行
    #      2. 命中 ALLOWED_EMAIL_DOMAINS → 直接放行
    #      3. ALLOW_SIGNUP=false        → 拒绝
    #      4. 设了 allowlist 但没命中   → 拒绝
    #    也就是说 **allowlist 是 allowSignup:false 的旁路，不是它的收窄**。
    #    文档里"ALLOW_SIGNUP=false blocks all new account creation"那句在设了
    #    allowlist 时是错的。好处是不用做「先开后关」的引导舞蹈；
    #    代价是 allowlist 里的地址等于永久后门 —— 所以这里用**精确邮箱**而非域名。
    #    用 allowedEmailDomains 的话，该域下任何人都能注册进来。
    allowSignup: false
    allowedEmails: "meirongdev@gmail.com"
    allowedEmailDomains: ""

    # 设 true 后 POST /api/workspaces 对**所有调用者**返回 403，新人只能靠邀请加入。
    # ⚠️ 引导期必须是 false，否则第一个 workspace 就建不出来（对自己也 403）。
    #    2026-08-18 08:13 UTC workspace `homelab` 已建好，同日翻成 true 收口。
    #    ⚠️ 将来若要再建 workspace，得先把这里改回 false、push、等 backend 重启，
    #       建完再翻回来 —— 没有「管理员绕过」这种东西。
    #    ⚠️ 核对生效状态时注意**三处名字都不一样**，拿错了就查不到、看着像没生效：
    #         values         disableWorkspaceCreation
    #         env/ConfigMap  DISABLE_WORKSPACE_CREATION
    #         /api/config    workspace_creation_disabled   ← 词序是反的
    #       （2026-08-18 就是拿 `disable_workspace_creation` 去查 /api/config，
    #        字段压根不存在 → 恒为空 → 误判成「没生效」。）
    disableWorkspaceCreation: true

    # 自建 VCS 集成（Forgejo/Gitea/GitLab）。密钥 MULTICA_VCS_SECRET_KEY 由
    # multica-secret.yaml 经 envFrom 注入；没有它这个开关打开也连不上。
    vcsIntegrationEnabled: true

    googleClientId: ""
    googleRedirectUri: ""
    # 未接 S3：上传件落 uploads PVC，由 frontend 的同源代理 /uploads 提供
    s3Bucket: ""
    localUploadBaseUrl: https://multica.meirong.dev
  resources:
    # 实测（2026-08-18）：Go 二进制空载 rss 12.1Mi / workingSet 19.3Mi ——
    # 原先填的 128Mi request 过宽。64Mi 仍留 3 倍余量，DB 连接池上限 25 也吃不到。
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  affinity: &pin-control-plane
    # ☠️ 必须钉在 control-plane（k8s-node）。理由两条：
    #  1. worker（k8s-worker-106）allocatable 只有 1800m/3253Mi，且已用掉 63% 内存
    #     requests（跑着 media 三个服务 + tetragon/opencost/otel-agent）。
    #     multica 两个容器塞进去会挤掉 trivy 每次 1024Mi 的镜像扫描 Job。
    #  2. 库在 control-plane（databases/apps-pg，local-path PVC 绑死在那个节点），
    #     backend 跑到 worker 上等于每次查询多一跳跨网段（worker 在 LAN，
    #     控制面在 pve 的 10.10.10.0/24）。
    # ⚠️ 2026-08-25 起锚点定义在这里 —— 原先定义在 postgres.affinity 上，那段随
    #    「库搬到共享实例」一起删了。锚点是 YAML 级的，定义没了 frontend 的
    #    `*pin-control-plane` 会让**整份 values 解析失败**，症状是 helm template
    #    渲染出空文件（不是报错说少了 affinity）。
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: In
                values: ["true"]
  tolerations: []

frontend:
  replicas: 1
  config:
    # 留空 = 走本 release 的 backend Service（multica-backend:8080）。
    # frontend 自带 runtime proxy 转发 /api /auth /uploads /ws，
    # 所以**只需要暴露 frontend 一个域名**，不用给 backend 开第二个 api.* 子域。
    remoteApiUrl: ""
    docsUrl: ""
    publicApiUrl: ""
    publicWsUrl: ""
  compatibility:
    # 该 ExternalName Service 名字不带 release 前缀，一个 ns 只能有一个。
    # 当前镜像不需要它，保持 false，否则会和 ns 内其它东西抢名字。
    backendAlias: false
  resources:
    # ☠️ **这两个上限不能按空载实测来收**。2026-08-18 收过一次（memory 768Mi→512Mi，
    #    理由写的是"空载 workingSet 177.1Mi，仍留 3 倍余量"），当晚 frontend 就
    #    OOMKilled 崩循环：cgroup 里 memory.peak 顶死在 512Mi 整、memory.events 的
    #    max 累计 697 次、oom_kill 6 次、pod 13 分钟内重启 3 次。
    #    原因是 Next.js 的 /_next/image 优化器（sharp）是**突发型**负载：实测单个并发
    #    优化任务 +68Mi（144Mi→212Mi，做完立刻释放），空载采样**永远看不见**这一段，
    #    几个并发就能把 ~150Mi 的静息推过 512Mi。
    # ⚠️ CPU 同理，500m 太紧：实测 125 个周期里 82 个被 throttle（66%），单张图要 2.3s，
    #    且并发优化会把 SSR 的 / 从 0.21s 拖到 0.77s（集群内测）——公网上表现就是
    #    "打开很慢/服务有问题"。判据是 cAdvisor 的 throttled_periods 比例而非
    #    `kubectl top`，见 reference/k8s-qos-resource-management.md。
    # ☠️ 2026-08-26：memory 上限**高于 chart 上游默认**（1Gi → 1536Mi），这是实测结论。
    #    08-18 回到上游默认 1Gi 后不再 OOM，于是看起来"够了"——但那只是**回收还打得赢**，
    #    峰值其实一直顶在天花板上。判决书是 cgroup 三个数一起看（`kubectl top` 看不出来）：
    #      memory.peak   1073741824  ← 与 memory.max **完全相等** = 峰值是被上限截断的
    #      memory.max    1073741824
    #      memory.events max 69 / oom_kill 0  ← 撞顶后被迫回收 69 次，只是每次都回收成功
    #    cAdvisor 侧同期 7d workingSet 峰值 946.3Mi = limit 的 92.4%，触发
    #    ContainerMemoryNearLimit（08-25 07:16Z 起连烧一整天）。
    #    ⚠️ 946Mi 这个数**本身是被截断的**，真实需求未知且 ≥1Gi ——所以不能拿它当基准
    #    去算"留了多少余量"。1536Mi 是给突发型 sharp 负载的一档，不是标定值：
    #    复查判据仍是 `memory.events` 的 `max` 计数**是否还在涨**（涨 = 仍在撞顶，继续抬），
    #    别等 oom_kill（那是几百次 max 之后的事）。
    #
    # ☠️ **触发者不是"有人在用"——是匿名爬虫**，这点反直觉，别再按"没人用怎么会撞顶"
    #    去否定告警。08-25 06:45:45→06:46:15Z 的 45 秒里（15s 分辨率还原）：
    #      workingSet 250Mi → 660 → 946 → 693 → 落回 250；同分钟 CPU 0.442 core
    #      cloudflared 同秒连报 `context canceled`（客户端等不及自己断了）
    #      cloudflared_tunnel_concurrent_requests_per_tunnel 峰值 **13**
    #      pod 内 .next/cache/images 有 **4 条 mtime = Aug 25 06:46** 的新条目
    #    最后一条是关键实证：确实在做 /_next/image 优化，机制与 08-18 同源。
    #    ⚠️ 但**首页匿名访问时不引用任何 /_next/image**（08-26 curl 实测 0 个），
    #    所以"打开首页 = 触发优化"是错的推断，别照抄——是爬虫爬到了更深的路径。
    #    归属看 Cloudflare Analytics（reference/public-traffic-analysis.md）：
    #      multica.meirong.dev 2500–4700 req/天，其中 self_monitor 恒 1440（=Uptime Kuma
    #      60s 探测，1 个 IP），browser 类 1000–3100 req 却只有 4–12 个 IP
    #      —— 每 IP 每天几百次请求，不是人。且该域的 `/` 是 cf-cache-status: DYNAMIC，
    #      边缘一个字节都不缓存，每次爬取都打到 origin。
    #    → 抬上限只是"扛住"，治本是在边缘缓存 /_next/image（Cache Rule，不占 WAF 的
    #      Free 档 5 个自定义规则槽）。没做，因为那要动 cloudflare/terraform 且影响公网行为。
    #    requests 维持 50m/256Mi（静息实测 113–150Mi，本次实测 memory.current 209Mi）；
    #    k8s-node available 5230Mi，容得下这档突发。
    # 注：.next/cache/images 无持久卷，pod 每次重启都要重新付这 2.3s——崩循环期间
    #    等于人人都撞冷缓存，症状会自我放大。chart 没有给 frontend 暴露缓存卷或
    #    extraEnv 的口子（2026-08-26 查 `helm show values` 确认），所以这条只能靠抬上限，
    #    治本要么等上游给钩子、要么在 Cloudflare 边缘缓存 /_next/image。
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1536Mi }
  affinity: *pin-control-plane
  tolerations: []

ingress:
  # ☠️ 必须关。chart 默认 enabled:true + className:traefik，而本集群唯一入口是
  #    Cilium Gateway API，根本没有 traefik ingress controller ——
  #    开着会生成一个永远不被任何控制器认领的 Ingress 对象（静默无效）。
  #    真正的入口在 k8s/helm/manifests/gateway/route-multica.yaml。
  enabled: false

monitoring:
  prometheusRule:
    # 刻意不开，且这是**实测结论不是保守起见**：backend 的 `/metrics` 返回
    # **404**（2026-08-18 从集群内 curl `multica-backend:8080/metrics` 确认），
    # 它压根不暴露 Prometheus 指标。开了就是一组永不触发的告警规则 ——
    # 比没有告警更糟，因为它让人以为这个服务已被监控。
    # 存活探测由 Uptime Kuma 的公网探测覆盖（cloud/oracle/.../uptime-kuma/provisioner.yaml）。
    # ⚠️ 那条探测只证明 service 端活着；执行任务的 daemon 在 M2 上，它挂了探测**依然全绿**。
    enabled: false
