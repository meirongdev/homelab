# Tetragon — eBPF 运行时可见性/检测（homelab）
# Chart: cilium/tetragon  (仓库 https://helm.cilium.io/)
# 由 ArgoCD Helm App 部署（argocd/applications/tetragon.yaml），dest ns: tetragon
#
# 为何 homelab 选 Tetragon（而非 Falco）：Cilium 原生、**内核态(eBPF)过滤**只把命中事件上报用户态，
# 远比 Falco 用户态逐 syscall 处理省 CPU —— 适配 5600H 热笔记本，不加热。
#
# 本期(v1)范围：开启**默认进程可见性**（process exec/exit 事件由 export-stdout 容器打到 stdout
# → 现有 OTel→Loki 管道收集 → 按 pod=tetragon 查，可见容器内起 shell / kubectl exec / 异常进程）
# + Prometheus 指标。自定义 TracingPolicy（敏感文件/提权/异常外联检测）与基于其指标的告警留作
# 后续调优（避免一上来写错 kprobe 语法或加 CPU）。

# ⚠️ 2026-08-10 修：**顶层 `resources:` 是死配置** —— chart 1.7.0 根本没有这个键
# （`helm show values` 逐键确认：顶层无 `resources`，agent 的是 `tetragon.resources`，
# stdout 导出器的是 `export.resources`——注意**不是** `export.stdout.resources`）。
# 写错层级 Helm 静默忽略、不报错，于是 tetragon DaemonSet 一直是 **BestEffort**：
# 上一行注释写着「热节点严格受限」，而这台 5600H 笔记本上的 tetragon **从来没有过
# CPU limit**，与 CLAUDE.md「所有安全组件 fail-open + 控 CPU」的硬约束正好相反。
# 同类坑：kube-prometheus-stack.yaml 的 kubeStateMetrics/nodeExporter（2026-08-10 同日修）、
# kyverno.yaml 的 reportsController。发现途径与验证方法见
# docs/runbooks/krr-report-triage.md § 3。

# PriorityClass 分档补齐（2026-08-10）：tetragon agent 归 `bulk`(-10)。
# 依据是 k8s-qos-resource-management.md 对 trivy-operator 归 bulk 的同一条理由 ——
# CLAUDE.md 硬约束是「所有安全组件 fail-open + 控 CPU」，**被驱逐正是 fail-open**：
# tetragon 掉线只丢一段运行时可见性，不影响任何运行中的工作负载。
#
# ⚠️⚠️ **本 chart 的 priorityClassName 与 resources 层级正好相反**（1.7.0 逐键实证）：
#   resources          → 顶层**无效**，必须写 `tetragon.resources`（见下）
#   priorityClassName  → 顶层**有效**，`tetragon.priorityClassName` 不存在
# 两者挨着写、方向相反，是本文件最容易搞错的地方。改动前务必 `helm template --set` 验一次。
priorityClassName: bulk

# 进程事件已默认开启；保持精简，先不开 enableProcessCred/enableProcessNs（额外开销）。
tetragon:
  # --- agent DaemonSet 资源（热节点严格受限）---
  # 实测 7d 峰值 181Mi（超过原先想给的 128Mi request），故 request 给到 224Mi、
  # limit 384Mi。CPU 维持 50m/500m：沿用上面那条注释的原意，这次是真的生效了。
  resources:
    requests:
      cpu: 50m
      memory: 224Mi
    limits:
      cpu: 500m
      memory: 384Mi
  # Prometheus 指标（:2112）+ ServiceMonitor。labelsOverride 注入 release 让 kube-prometheus-stack 采纳。
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labelsOverride:
        release: kube-prometheus-stack

# --- stdout 导出器资源（实测 7d 峰值仅 2Mi，纯转发）---
# ⚠️ 键是 `export.resources`，**不是** `export.stdout.resources`（后者写了不生效）。
export:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# --- operator 资源（本段键名一直是对的，operator 也确实是 Burstable）---
tetragonOperator:
  # 同 agent 归 bulk：它只做 CRD/TracingPolicy 的 reconcile，掉了不影响已加载的策略。
  priorityClassName: bulk
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
