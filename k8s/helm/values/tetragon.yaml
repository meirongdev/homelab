# Tetragon —— homelab 专属 values（叠加在 security/tetragon/values-common.yaml 之上）
# 由 ArgoCD Helm App 部署（argocd/applications/tetragon.yaml），dest ns: tetragon
# 两集群共用的部分（导出过滤、argv 脱敏、优先级、导出器/operator 资源、选型理由）都在 values-common.yaml，
# 这里只放与 homelab 硬件有关的：agent 资源、ServiceMonitor。
# homelab 控制面是 5600H 热笔记本 —— 资源按实测给，CPU limit 必须有（CLAUDE.md「安全组件控 CPU」）。

tetragon:
  # --- agent DaemonSet 资源（热节点严格受限）---
  # 实测 7d 峰值 181Mi（超过原先想给的 128Mi request），故 request 给到 224Mi、
  # limit 384Mi。CPU 维持 50m/500m。
  #
  # ☠️ 2026-11-20 上线 TracingPolicy（security/tetragon/policies/）后重新定过 **limit**。
  # 实测要分清三个数，别混：
  #   · 创建/**更新**策略时的峰值：k8s-node 上 3 小时内 **373Mi，对着 384Mi 的 limit 只差 11Mi**。
  #     更新是 delete+add，新旧 sensor 会同时在内存里，所以每改一次策略都会重放这个尖峰。
  #     被 OOM 杀掉 = 检测静默失效，这才是调 limit 的理由。
  #   · agent **重启**时策略是预置的，峰值只有 233Mi（k8s-node）/ 167Mi（worker）。
  #   · 稳态（2026-11-22 定论，working set 口径，与上面 233/167Mi 同口径）：两个 pod 自 11-20 15:11
  #     重启后连跑 2 天、期间没改过策略，k8s-node p50 85Mi / p99 125Mi，worker 稳在 94–99Mi；RSS 只有
  #     33–41Mi。上线当天看到的 ~210Mi 确实是反复更新策略留下的堆，不是策略的固有代价。
  #   · CPU 没有稳态代价：加载时冲到 ~22m、几分钟内回到 2~4m 基线，上面 50m/500m 不动。
  #   · 宿主很宽裕（k8s-node 可用 5.3G、worker 可用 2.1G），涨的是上限不是占用。
  # limit 512Mi = 更新路径峰值 373Mi 的 1.37 倍，**不动**：每改一次策略都会重放那个尖峰。
  # request 256Mi → 160Mi（2026-11-22）：稳态 p99 125Mi 的约 1.3 倍。request 只影响调度记账与内存
  # 压力下的驱逐排序，不是占用；重启/更新时短暂超过 request 是 Burstable 的正常形态。
  # ⚠️ 峰值只能用 max_over_time 看：15 分钟步长的曲线把 373Mi 削成了 334Mi，差点据此少给。
  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # ServiceMonitor：labelsOverride 注入 release 让 kube-prometheus-stack 采纳。
  # oracle 没有 Prometheus（指标经 OTel 抓取后 remote write 到这边），所以只有 homelab 开。
  prometheus:
    serviceMonitor:
      enabled: true
      labelsOverride:
        release: kube-prometheus-stack
