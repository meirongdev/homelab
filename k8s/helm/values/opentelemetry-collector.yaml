# OTel Collector — homelab（DaemonSet 节点代理：容器日志 + 应用 OTLP 追踪）
# Chart: open-telemetry/opentelemetry-collector · ArgoCD `otel-collector` App（多源）
# 发行版: otel/opentelemetry-collector-k8s —— k8s 场景的官方裁剪发行版（组件面比
# contrib 小一个量级），2026 推荐的节点代理镜像。oracle 侧因需要
# prometheusremotewrite exporter（k8s 发行版不含）而保持 contrib，两侧同版本号。
#
# 管道: filelog/otlp → memory_limiter → k8sattributes → resource → batch
#        → Loki（native OTLP）/ Tempo（OTLP gRPC）
#
# ⚠️ 刻意没有 metrics 管道：homelab 指标由 kube-prometheus-stack 原生抓取
# （ServiceMonitor + additionalScrapeConfigs，含 cloudflared），collector 不做重复采集。
# 历史注记：本文件 2026-03 的旧版从未随任何 helm release 生效过
# （2026-07-31 实测：无 release、无 pod、Loki 无 homelab 日志）。
# 设计取舍全集见 docs/decisions/otel-2026-alignment.md

mode: daemonset

image:
  repository: otel/opentelemetry-collector-k8s
  tag: "0.156.0"          # = chart 0.165.0 的 appVersion；升级时与 oracle 侧 contrib 同步
command:
  name: otelcol-k8s       # k8s 发行版二进制名（chart 默认 otelcol-contrib，必须显式改）

fullnameOverride: otel-collector   # 全新部署（无既有 selector 可撞），对象名对齐 oracle 侧

# 节点日志代理要读 /var/log/pods 并写 /var/lib/otelcol checkpoint（hostPath, root:root）
# → 显式 root 运行（fluent-bit/promtail 同类惯例）。monitoring ns 本就是 PSA privileged
# （node-exporter 同住，见 justfile psa_privileged_ns）。
securityContext:
  runAsUser: 0
  runAsGroup: 0

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false   # 不采集自身日志，避免自激循环
    # filelog checkpoint 持久化到 /var/lib/otelcol（hostPath）：
    # 重启后从断点续读，不重复、不漏采。
    storeCheckpoints: true
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false    # 只提取 metadata 基本集，控制 Loki 标签基数

config:
  extensions:
    # storeCheckpoints preset 已挂 hostPath；create_directory 让配置自足（首次启动自建目录）
    file_storage:
      create_directory: true
  processors:
    # 顺序约定：memory_limiter 必须最前，batch 必须最后
    memory_limiter:
      check_interval: 5s
      limit_mib: 160
      spike_limit_mib: 40
    resource:
      attributes:
        # `cluster` 是本仓库全部 dashboard / PrometheusRule / SLO 的运营标签
        # （与 kube-prometheus-stack externalLabels 一致），保留不动；
        # `k8s.cluster.name` 是 OTel semconv 规范属性，供 OTLP 原生消费方用。
        # 两个都打，互不干扰（刻意不做破坏性改名，见 ADR）。
        - key: cluster
          value: homelab
          action: upsert
        - key: k8s.cluster.name
          value: homelab
          action: upsert
    batch:
      send_batch_size: 10000
      timeout: 5s

  exporters:
    # Loki 3.x 原生 OTLP 摄入端点（oracle 侧走 NodePort 到同一个 loki-gateway，
    # 这里是集群内直达；http 明文，无需 tls 段）
    otlphttp/loki:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp
    # Tempo OTLP gRPC（集群内明文）
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true

  service:
    pipelines:
      logs:
        receivers: [otlp, filelog]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/loki]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp/tempo]
      # 禁用 chart 默认 metrics 管道（理由见文件头）
      metrics: null

# 只开实际使用的端口；chart 默认还会开 jaeger/zipkin 一堆兼容端口，全关
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# ClusterIP Service：集群内应用把 OTLP 打到 otel-collector.monitoring.svc:4317/4318
service:
  enabled: true

# collector 自身遥测 :8888 → kube-prometheus-stack 抓取
# （queue 深度 / 丢弃计数 / exporter 失败率——管道自己的健康信号）
serviceMonitor:
  enabled: true
  extraLabels:
    release: kube-prometheus-stack   # serviceMonitorSelector 采纳所需（仓库固定约定）

# 5600H 单节点，fail-open 哲学：宁可丢遥测不抢业务 CPU
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
