# ArgoCD values for homelab K3s (single-node)
# 取代旧的 stock manifest 部署（argo-cd/stable/manifests/install.yaml）。
# Chart: argo/argo-cd (https://github.com/argoproj/argo-helm)
#
# 部署：cd k8s/helm && just deploy-argocd
# 升级：编辑本文件后重跑 just deploy-argocd

global:
  domain: argocd.meirong.dev

# Cloudflare Tunnel + Cilium Gateway 经 HTTP 路径转发，禁用 ArgoCD 自带 TLS。
# 等价于旧的 argocd/install/argocd-cm-patch.yaml。
configs:
  params:
    server.insecure: "true"
    # application-controller 限并发 —— 从源头压低内存峰值（单节点 10GiB 笔记本，且
    # 已有 Trivy/Kyverno 大 CRD）。默认 status=20/operation=10/parallelism=16 会让所有
    # App 的 CRD diff 同时算，叠出 OOM 峰值（512Mi 时曾把 controller 顶崩）。调小=同步略慢
    # 但内存峰值可控，对单用户 ~15 App 足够。配合 controller limit 1Gi 双保险。
    controller.status.processors: "8"
    controller.operation.processors: "4"
    controller.kubectl.parallelism.limit: "8"
  # Authz for SSO logins. policy.default grants every authenticated ZITADEL identity
  # full admin — acceptable here because ZITADEL is a single-user, locked-down IdP
  # (no self-registration; GitHub federation email-linked to one pre-existing user).
  # The local `admin` account is unaffected. To tighten later: drop policy.default
  # and map a specific subject, e.g.
  #   policy.csv: |
  #     g, <zitadel-sub-or-email>, role:admin
  #   scopes: '[email]'
  rbac:
    policy.default: role:admin
  # 允许通过 cm.url 让 OAuth/回调走外部 URL（即使没用 SSO 也保留 URL 自洽）
  cm:
    url: https://argocd.meirong.dev
    # --- ZITADEL native OIDC SSO (no dex). Local `admin` account stays enabled as a
    # fallback (no lockout). clientID/clientSecret are pulled from the ESO-managed
    # secret `argocd-oidc` (labeled app.kubernetes.io/part-of=argocd) via ArgoCD's
    # $<secret>:<key> value reference. Client provisioned by
    # zitadel/scripts/configure-oidc-app.sh (app "argocd", redirects
    # https://argocd.meirong.dev/auth/callback + http://localhost:8085/auth/callback).
    oidc.config: |
      name: ZITADEL
      issuer: https://auth.meirong.dev
      clientID: $argocd-oidc:oidc.clientID
      clientSecret: $argocd-oidc:oidc.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
    # ESO 的 ExternalSecret CRD 给 remoteRef 自动填默认值，ArgoCD 的 SSA diff 会
    # 把这视作 drift。这里忽略掉 ESO 自己默认的字段，避免每次写新 ExternalSecret
    # 都得手动复制 conversionStrategy/decodingStrategy/metadataPolicy。
    # nullBytePolicy 是新版 ESO 加的默认字段（2026-07 发现全量 ES OutOfSync）。
    resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
    # Cilium Gateway API health: a Gateway is Healthy once Programmed (or
    # Accepted on the cilium / cilium-nodeport classes — neither homelab nor
    # oracle-k3s has an external LB, so Programmed stays False / AddressNotAssigned
    # forever and Accepted=True is the real steady state). Without this, the
    # gateway Applications sit Progressing/Degraded (and PostSync-hook syncs hang
    # waiting for Gateway health). Previously applied imperatively to argocd-cm;
    # folded into values so Helm adoption doesn't drop it.
    resource.customizations.health.gateway.networking.k8s.io_Gateway: |
      hs = {}
      local accepted = false
      local programmed = false

      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Accepted" and condition.status == "True" then
            accepted = true
          end
          if condition.type == "Programmed" and condition.status == "True" then
            programmed = true
          end
        end
      end

      if programmed then
        hs.status = "Healthy"
        hs.message = "Gateway is programmed"
        return hs
      end

      if accepted and obj.spec ~= nil and (obj.spec.gatewayClassName == "cilium-nodeport" or obj.spec.gatewayClassName == "cilium") then
        hs.status = "Healthy"
        hs.message = "Gateway accepted (Cilium, no external LB on this cluster)"
        return hs
      end

      if accepted then
        hs.status = "Progressing"
        hs.message = "Gateway accepted but still waiting to be programmed"
        return hs
      end

      hs.status = "Degraded"
      hs.message = "Gateway has not been accepted by the controller"
      return hs

# CRDs 已由原始 stock-manifest 安装且 ArgoCD 正在使用（Application/AppProject/
# ApplicationSet）。收编进 Helm 时不让 chart 接管 CRD，避免对正在被 CR 使用的
# CRD 做有风险的 ownership 变更；CRD 继续独立存在，Applications 不受影响。
crds:
  install: false
  keep: true

# --- 禁用未使用的可选组件 ---
# Reason: SSO 已下线（CLAUDE.md），仓库内无 ApplicationSet CR，无 notifier 配置
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  # ⚠️ `enabled: false` 在 chart 10.1.4 上**没有真正禁用它** —— `helm get manifest`
  # 实证当前 release 仍渲染出 Deployment/Service/Role/RoleBinding/ServiceAccount 五个对象，
  # pod 也确实在跑（且集群里 0 个 ApplicationSet 对象，等于白跑）。
  # 因此这里必须补 resources：不补就是 `resources: {}` → BestEffort → 驱逐排第一档。
  # 实测 7d 峰值 163Mi、CPU p95 1m。
  # TODO: 真要停用得查 chart 10.x 里正确的禁用方式，属功能变更，未在本次资源调优范围内。
  enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 176Mi
    limits:
      memory: 384Mi

# --- 资源声明 ---
# application-controller 内存：512Mi 在加入 Trivy(~18 大 CRD)+Kyverno(更大 CRD) 两个
# Helm App 后被 dry-run/diff 峰值顶爆 OOMKilled(137)，全量 resync 时尤甚。曾抬到 1Gi。
# 2026-08-02 **同一故障在 1Gi 复发**（10:01:47Z exitCode 137）：App 数涨到 28，
# 又多了 CNPG/OpenCost 的大 CRD。实测不是泄漏——7d 曲线在 0.54–0.68G 平稳震荡，
# 是 reconcile 尖峰（5m 分辨率可见 0.85G，2d 峰值达 limit 的 94%）顶爆。
# 抬到 1.5Gi 给尖峰留头寸；request 维持 384Mi（节点 12.6GiB / MemAvailable 4.2G，
# limit 不是预留，抬它不占实际内存）。
# ⚠️ 控制面峰值随**被管对象规模**增长（App 数、CRD 大小），不随流量——每次新增
#    大 CRD 的 App 之后回头看一眼 `max_over_time(...[2d]) / limit`，别等它再炸。
#    查法见 docs/reference/k8s-qos-resource-management.md 的「检测 OOMKill」。
# 改后需 `cd k8s/helm && just deploy-argocd`（manual-helm，git push 不生效）。
# 2026-08-10（ROADMAP #3 收尾）：**同一故障在 1.5Gi 上第三次逼近** —— 实测 7d 峰值
# 1306Mi / limit 1536Mi = 85%，又过了上面说的 80% 判据。limit 抬到 2Gi。
# 同时把 request 从 384Mi 抬到 896Mi：上面那句「request 维持 384Mi」当时是对的
# （homelab 单节点无调度竞争），但控制面 2026-08-02 已迁到 oracle，那里 allocatable
# 只有 9080Mi、requests 实测已 78%。稳态 RSS ~1.3G 却只申报 384Mi，意味着它在 kubelet
# 驱逐排序里「超 request」近 1G —— 在**最紧的集群**上排在很前面。896Mi 是折中：
# 显著改善驱逐排序，又不像 KRR 建议的 1515Mi 那样一口吃掉 12% 的节点内存预算。
# CPU request 维持 100m：实测 p95 82m 尚在其下，且 limit 1000m 足够 burst，
# 不跟 KRR 抬到 128m（oracle 的 CPU request 才是真正稀缺的那个）。
controller:
  resources:
    requests:
      cpu: 100m
      memory: 896Mi
    limits:
      cpu: 1000m
      memory: 2Gi

repoServer:
  resources:
    requests:
      # 2026-08-11: 15m→25m。08-10 定 15m 的依据是「7d p95 11m」，一天后复测 p95 已经
      # **17m —— 高于 request 本身**（1m 峰值 166m，是 request 的 11 倍）。节点 CPU
      # requests 在 74%，多给 10m 只占 0.55%，但 cpu.shares 权重直接翻倍。
      # ⚠️ 别再往下砍：repo-server 的健康检查是 CPU 敏感的硬实时路径，见下方 probe 注释。
      cpu: 25m
      # 维持 128Mi：节点 memory requests 已到 **91%**，加 request 会挤占调度预算。
      # 抬 limit 不占预算，所以下面只动 limit。
      memory: 128Mi
    limits:
      cpu: 500m
      # 512Mi: 256Mi 在集中 refresh(21 app 并发 helm/kustomize 渲染)时 OOMKilled
      # (2026-07-07 观察到 exit 137)。request 不变，仅放宽突发上限。
      # 2026-08-11: 512Mi→768Mi。实测 7d 峰值 477.7Mi = **93.29%**，触发
      # ContainerMemoryNearLimit。⚠️ 但**这是症状不是病**：7d 内 last_terminated_reason
      # 从没出现过 OOMKilled，477Mi 那次尖峰紧跟一次冷启动后的 28 个 App 全量渲染
      # （14:26 START→14:32 449Mi；19:04 START→19:17 477Mi）。真因是下面的探针重启，
      # 修好探针后尖峰频率本身就会降。这里抬 limit 只是买保险。
      memory: 768Mi
  # 2026-08-11: 探针放宽。**这是本次的真修复**，不是调优。
  #
  # 症状：repo-server 24h 内重启 15 次，全部 exit code 0 / reason=Completed
  #      （不是 OOMKilled —— 内存告警是它的下游症状，别被带偏）。
  # 直接证据：
  #   level=error msg="Error serving health check request" component=healthcheck
  #   duration=1.171583629s error="rpc error: code = Canceled desc = context canceled"
  #   所有 duration 落在 **1.018s–1.284s**，而 chart 默认 timeoutSeconds: 1 ——
  #   只超时 20~280 毫秒，是刀尖上的配置。`/healthz?full=true` 内部要做一次 gRPC
  #   自查，稳态 <1s，一有 CPU 争抢就滑过 1 秒 → kubelet 取消 → 探针失败。
  # 死亡螺旋：连续 13 次重启，每次活 33–40 秒 = initialDelay 10 + failureThreshold 3
  #   × periodSeconds 10。被杀后冷启动（GPG keyring 生成、TLS 自签、Redis 连接）比
  #   稳态更慢，10 秒 initialDelay 内起不来 → 又被杀。最后靠 CrashLoopBackOff 退避
  #   （84s→167s→308s→~311s 封顶）拖到节点空下来才逃出。
  # ⚠️ 同一失败模式被触发过两次，两次都是 CPU 余量被削：2026-08-05 缩容到 2 OCPU
  #   （当天 +8 次重启）、2026-08-10 把 CPU request 砍到 15m（新 pod 起来 14 秒后就
  #   出现第一条超时）。所以这三项（request / timeout / startupProbe）是一套，别拆。
  #
  # startupProbe 接管冷启动：20 × 10s = 200 秒宽限期，期间 liveness/readiness 全部挂起，
  # 螺旋从根上断掉。走的是更轻的 /healthz（不带 full=true）。
  startupProbe:
    enabled: true
    timeoutSeconds: 5
  # 稳态超时：1s→5s。相对 1.28s 的实测最差值留 4 倍余量。
  livenessProbe:
    timeoutSeconds: 5
  # readiness 同样是 1s 默认值、同样的 /healthz。它失败不杀容器，但会把 repo-server
  # 摘出 Service endpoints → application-controller 拿不到清单 → 同步失败，一样要放宽。
  readinessProbe:
    timeoutSeconds: 5
  # Gate startup on real DNS resolution of the git host. On a fresh pod,
  # Cilium needs a moment to program the endpoint's eBPF datapath; ArgoCD
  # otherwise fires its first git fetch inside that sub-second window and the
  # lookup fails ("no such host" / "server misbehaving"), leaving Applications
  # stuck in ComparisonError until a later retry. Looping until github.com
  # actually resolves removes the race (busybox nslookup exits 0 only on a
  # real answer). Cap at 120s so a genuine internet outage doesn't block the
  # pod forever — ArgoCD's own retry then takes over.
  initContainers:
    - name: wait-for-dns
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          i=0
          until nslookup github.com >/dev/null 2>&1; do
            i=$((i+1))
            if [ "$i" -ge 120 ]; then
              echo "[wait-for-dns] github.com still unresolvable after 120s; starting anyway"
              exit 0
            fi
            echo "[wait-for-dns] waiting for github.com to resolve..."
            sleep 1
          done
          echo "[wait-for-dns] github.com resolves; starting repo-server"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi

server:
  # 2026-08-10: CPU request 25m→10m（实测 p95 1m）；
  # memory limit 128Mi→192Mi（实测 7d 峰值 97Mi = 76%，逼近 80% 判据）。
  # 2026-08-18: memory limit 192Mi→256Mi。实测 7d 峰值 **175Mi / 192Mi = 91%**，
  #   `ContainerMemoryNearLimit` 自 08-16 05:00 起在 oracle-k3s 连续烧 2 天。
  #   峰值从 08-10 的 97Mi 涨到 175Mi（+80%）——印证那条告警正文的提醒：
  #   控制面组件的内存随**被管对象规模**增长，不随流量增长。oracle available 3.94GiB。
  # ⚠️ 本 release 是 **manual-helm**（CLAUDE.md 的例外清单）：改这里 **git push 不会生效**，
  #    必须在 k8s/helm/ 跑 `just deploy-argocd`。
  # ⚠️ 且这是 GitOps 控制器给自己做升级，SSA 字段所有权冲突有先例（见 justfile 里
  #    argocd_chart_version 上方那段：application-controller 的 resources.memory 曾被
  #    field manager `kubectl-patch` 劫持，导致 values 里的声明**静默失效**）。
  #    若 helm 报 conflict，加 --force-conflicts 重跑，并回头核对 live 值真的变了。
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

redis:
  image:
    repository: docker.io/library/redis
    tag: 8.6.4-alpine
  resources:
    requests:
      cpu: 15m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
