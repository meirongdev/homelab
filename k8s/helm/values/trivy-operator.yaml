# Trivy Operator — 镜像 CVE / 配置审计 / RBAC / 暴露密钥 持续扫描
# Chart: aqua/trivy-operator  (仓库 https://aquasecurity.github.io/helm-charts)
# 由 ArgoCD Helm App 部署（argocd/applications/trivy-operator.yaml），dest ns: trivy-system
#
# 设计要点（单节点 5600H 笔记本，idle ~74°C，必须控 CPU）：
#   - scanJobsConcurrentLimit=1：串行扫描，杜绝热节点上的"扫描器风暴"
#   - ClientServer + builtInTrivyServer：内置长驻 Trivy server 持久化漏洞 DB（PVC），
#     避免每个扫描 Job 重新下载 ~几百 MB 的 DB（网络 + CPU 反复开销）
#   - severity=HIGH,CRITICAL + ignoreUnfixed：只报可修复的高危，降噪 + 省算力
#   - clusterComplianceEnabled=false：CIS 节点合规交给 kube-bench，避免 Trivy 重复跑 node-collector
#   - 排除系统 namespace，减少无意义扫描
# 指标经 ServiceMonitor(带 release 标签)被 kube-prometheus-stack 抓取；
# 告警在 manifests/trivy-alerts.yaml，看板在 manifests/trivy-dashboard.yaml。

# 扫描范围：空 targetNamespaces = 全集群；排除系统 ns
targetNamespaces: ""
excludeNamespaces: "kube-system,kube-public,kube-node-lease,trivy-system"

operator:
  scanJobsConcurrentLimit: 1            # 串行扫描（热节点关键）
  # ⚠️ 别把这个值调大回 1h —— 它不只是"清理时间"，还决定扫描吞吐。
  # Complete 状态的 Job 仍占着 scanJobsConcurrentLimit 的槽，直到被 TTL 回收，
  # 所以 **吞吐上限 ≈ limit ÷ TTL**：
  #     1h + limit=1 ⇒ 1 个镜像/小时 = 24 次/天（旧值）
  #     5m + limit=1 ⇒ 12 个镜像/小时（现值，散热不变）
  # 旧值下 29 个工作负载对着 24 次/天的天花板已经顶格，叠加 scannerReportTTL=24h
  # （报告 24h 过期需重扫）——再加几个负载就会出现"报告先过期、轮不上重扫"的盲区。
  # 2026-08-03 在 oracle 上实测确诊：2 个 Complete Job 占满 limit=2 后，
  # 队列静止 33 分钟、零日志零报错，46 个负载只产出 7 份报告。
  # 5m 只影响 Job 对象的回收速度，**不改变同时运行的扫描数**（散热约束仍由
  # scanJobsConcurrentLimit=1 独立保证，与 TTL 正交）。
  # ⚠️ 改这个值需要 operator 重启才生效（env 来自 configMapRef）——chart 带
  # checksum/config 注解，ArgoCD 同步 cm 时会自动滚动，无需手动 rollout。
  # 但**已存在的 Job 不受影响**：ttlSecondsAfterFinished 在创建时就写进 Job spec，
  # 旧 Job 仍按旧 TTL 滞留，要等它们自然回收后吞吐才真正提上来。
  scanJobTTL: "5m"                      # 完成后 5m 回收，及时释放并发槽
  metricsFindingsEnabled: true          # 暴露 trivy_image_vulnerabilities 等 findings 指标
  vulnerabilityScannerEnabled: true
  vulnerabilityScannerScanOnlyCurrentRevisions: true   # 只扫当前 ReplicaSet，省重复
  configAuditScannerEnabled: true
  configAuditScannerScanOnlyCurrentRevisions: true
  rbacAssessmentScannerEnabled: true
  exposedSecretScannerEnabled: true     # 镜像里硬编码密钥扫描（最高信号）
  clusterComplianceEnabled: false       # CIS 节点合规交给 kube-bench
  builtInTrivyServer: true              # 内置长驻 Trivy server（共享 DB 缓存）

# operator 自身（控制器）资源
# 2026-07-16 fix: 256Mi → 512Mi. 200 restart OOM (exit 137). Trivy plugin loading
# + concurrent reconciliation on single-node homelab exceeds 256Mi.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

trivy:
  mode: ClientServer                    # 配合 builtInTrivyServer
  ignoreUnfixed: true                   # 只报有修复版本的 CVE
  severity: "HIGH,CRITICAL"             # 只扫高危

  # trivy-server（builtInTrivyServer 的 StatefulSet，共享漏洞库）。2026-08-06 补。
  # ⚠️ 这是**第三个**位置：顶层 priorityClassName 管 operator、
  # trivyOperator.scanJobPodPriorityClassName 管扫描 Job、这个管 server。
  # 漏了它的话，一个纯粹为 operator 服务的组件反而比 operator 优先级高。
  priorityClassName: bulk

  # trivy ≥0.72.0 必须:0.71 的临时目录是 /tmp/trivy-<PID>,而扫描 pod 内所有
  # 容器共享 /tmp emptyDir 且 trivy 的 PID 相同 → 多容器 workload(loki、tetragon)
  # 扫描 100% 撞名,先扫完的容器清目录摧毁另一个 → Job 失败 + "Job failed to
  # complete" 告警。0.72.0 改为随机后缀(trivy-operator#2859)。
  image:
    tag: "0.72.0"

  # ---- Accepted-risk CVE 抑制(2026-07-17)----
  # 这些 CVE 的"修复版本"是 Go/grpc 层面的,vendor 尚未发布重建镜像,我们无法升级修掉;
  # 挂着只会让 TrivyImageCriticalVulnerabilities 永久 firing、淹没真正可行动的告警。
  # ⚠️ 格式坑(改动前必读):
  #   1. 必须用 .trivyignore.yaml(YAML)格式:chart 把 ignoreFile 列表渲染成
  #      "- CVE-xxx" 行,纯文本解析器取行首 fields[0]("-")当 ID → 静默失效;
  #   2. 不能用 expired_at 字段:helm values 的 YAML→JSON 往返会把日期变成带引号的
  #      字符串,而 trivy(yaml.v3)只对不带引号的标量做 timestamp 解析 →
  #      decode error → 所有扫描 Job FATAL。复审日期只能写在 statement 里。
  # ⚠️ 2026-08-03：ArgoCD 与 Calibre-Web 已迁 oracle-k3s，下面 5 条（CVE-2025-68121 /
  #    CVE-2026-33186 / CVE-2023-24538 / CVE-2023-24540 / CVE-2024-24790）在本集群
  #    **已无对应镜像**，理论上可删。刻意先留着：多余的 ignore 条目是无害的（永不匹配），
  #    而漏掉一条会立刻变成 firing 噪音。等 oracle 侧首轮扫描出结果、确认这些 CVE 确实
  #    只出现在那边之后，在下一次 CVE 复审（2026-09）时一并清理。
  #    oracle 侧的对应条目见 values/trivy-operator-oracle.yaml。
  ignoreFileName: ".trivyignore.yaml"
  ignoreFile:
    vulnerabilities:
      # Go stdlib(修复需 vendor 用 Go 1.24.13/1.25.7+ 重建):argocd v3.4.5(已是
      # 最新 stable)、CWA 内置 kepubify(alertmanager-gotify-bridge 已随 Gotify 一并下线,
      # 不再是需要豁免的对象)
      - id: CVE-2025-68121
        statement: "Go stdlib, 等上游重建镜像; argocd v3.5 GA 约 2026-08-04, 2026-09 复审"
      # grpc-go 1.79.3 才修复;argocd v3.4.5 仍带 1.72.1(tempo 已升 2.9.2 修掉)
      - id: CVE-2026-33186
        statement: "grpc-go, argocd v3.4.5 无可用修复版, 等 v3.4.6/v3.5, 2026-09 复审"
      # calibre-web-automated 镜像内 kepubify 为 Go 1.17.8 构建,上游一直未重建
      - id: CVE-2023-24538
        statement: "CWA kepubify (Go 1.17.8), 上游未重建, 2026-11 复审"
      - id: CVE-2023-24540
        statement: "CWA kepubify (Go 1.17.8), 上游未重建, 2026-11 复审"
      - id: CVE-2024-24790
        statement: "CWA kepubify (Go 1.17.8), 上游未重建, 2026-11 复审"
      # grafana 13.1.x 内置 kin-openapi v0.140.0(ValidationHandler fail-open 认证绕过, CVSS 9.1);
      # 修复在 0.144.0,但 grafana v13.1.1(最新)go.mod 仍钉 0.140.0 → 无可升级到的已修镜像。
      # grafana 自带认证栈,不走 kin-openapi 的 ValidationHandler 鉴权,实际不可利用。等上游 bump。
      - id: GHSA-r277-6w6q-xmqw
        statement: "grafana kin-openapi v0.140.0, 无已修镜像(v13.1.1 go.mod 仍 0.140.0), grafana 不走 kin-openapi 认证路径, 2026-09 复审"
      # open_notebook 镜像内打包的 npm tar 7.5.1/7.5.11(前端构建产物,两处副本),
      # 修复版本 7.5.19。1.14.0(2026-07-21)已是最新 stable —— 再往上只有 v1-dev,
      # 不适合钉在生产。无可升级到的已修镜像,故先豁免。
      # 实际风险低:该 tar 只在镜像构建期解包受信任的 npm 包,运行时不处理用户上传的归档。
      - id: CVE-2026-59873
        statement: "open_notebook 内置 npm tar 7.5.x(修复 7.5.19), 1.14.0 已是最新 stable 无已修镜像, 运行时不解包不可信归档, 2026-10 复审"
  # 扫描 Job（client）资源
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # 内置 Trivy server：持久化漏洞 DB（local-path，2026-07-11 从 nfs-client 迁移，
  # 消除对 106 的运行时依赖）；DB 可丢可重建，重下一次即可
  storageClassName: local-path
  storageSize: 2Gi
  server:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Prometheus 集成 —— ServiceMonitor 必须带 release 标签，否则被 operator 的 ruleSelector 忽略
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

# 2026-08-06：此前无 priorityClass，落在默认档 0 —— 比标了 bulk(-10) 的个人应用
# 还高。CLAUDE.md 的硬约束写着「所有安全组件 fail-open + 控 CPU」，而被驱逐正是 fail-open：
# 扫描停一会儿只是报告变旧，不影响任何运行时管控。归 bulk 与该约束一致。
#
# ⚠️ **两个键都要设，层级不同**（chart 0.33.1 逐键确认过）：
#   · 顶层 priorityClassName                    -> operator 本体（常驻，内存小头）
#   · trivyOperator.scanJobPodPriorityClassName -> **扫描 Job pod**，真正的瞬时内存消费者
#     只设前者等于漏掉了要管的那个。
priorityClassName: bulk

trivyOperator:
  scanJobPodPriorityClassName: bulk

  # 落 106 worker（2026-08-16）——**这一条才是真正的分担**：扫描 Job 是周期性 CPU 脉冲，
  # 把它从 5600H 热笔记本挪到 106 的 VM 上，正是 decisions/cluster-placement 里
  # 「无状态周期扫描 → k8s-worker-106」那条通道的本意。
  # 键名与顶层的 `nodeSelector`（管 operator 本体）**不是同一个**，两个都要设 —— 同
  # priorityClassName 那两处一样的层级坑。
  # ⚠️ 代价：worker 只有 2 慢核 / 2311Mi allocatable，scanJobsConcurrentLimit=1 必须保持串行；
  # 扫描会拉取镜像层，占 worker 的盘（29G，2026-08-16 时用了 26%）。
  # 若 worker 长期下线，扫描会停 —— 与 bulk 档一致的 fail-open 语义，报告变旧但不影响管控。
  scanJobNodeSelector:
    kubernetes.io/hostname: k8s-worker-106

# operator 本体（控制器，常驻）也落 worker：状态全在 CR（etcd）里，无 PVC、无节点语义，
# 掉线只是暂停扫描。腾出 master 上约 194Mi 常驻内存（2026-08-16 实测 RSS）。
nodeSelector:
  kubernetes.io/hostname: k8s-worker-106
