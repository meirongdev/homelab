---
# 共用逻辑在 tailscale/ansible/roles/tailscale_node（roles_path 见 ansible.cfg）。
# 本文件只保留 homelab 差异：tailscale up 的 SNAT/netfilter 参数 + ip rule 收敛器。
- name: Setup Tailscale on homelab K3s nodes
  hosts: k8s_cluster
  become: true
  vars:
    # 收敛器要断言的 ip rule 列表（每项直接拼进 `ip rule add`）。
    # 2026-08-13 起 master 与 worker 同一份（此前 5240 只给 worker，master 是漏配）：
    #   5200  Cilium identity-mark 撞 Tailscale fwmark 的防护（取证见下方 tasks 注释）
    #   5240  到 10.10.10.0/24 走 main 不进隧道 —— 两个节点各有各的死法：
    #         worker：--accept-routes 从 pve 学到该段进 table 52，到控制面 API 的
    #                 流量被劫进隧道（详见 setup-k3s-worker.yaml 文件头 ②）；
    #         master：自己就在这个网段，从 vmbr0 进来的连接（pve 的 ProxyCommand、
    #                 同段邻居）回包被劫进隧道，非对称直接超时 —— inventory 里
    #                 k8s-node 的唯一声明访问路径因此一直是坏的
    #                 （docs/records/2026-08-13-k3s-worker-join-106.md §4）。
    #   5260  LAN 直通（到 106 的 restic/vzdump 不舍近求远走隧道）
    #   ☠️ 优先级空位只有 5200/5220/5240/5260：tailscaled 自己占 5210/5230/5250/5270，
    #   且必须 < 5270（`from all lookup 52`）才抢得到。
    tailscale_assert_rules:
      - "5200 to 100.64.0.0/10 lookup 52"
      - "5240 to 10.10.10.0/24 lookup main"
      - "5260 to 192.168.50.0/24 lookup main"
    # ⚠️ This node must advertise NOTHING (2026-07-07). In particular NEVER advertise
    # its own IP 10.10.10.10/32: pve (a tailnet subnet router that TRANSITS this
    # segment's traffic) learns the route into table 52, which outranks its main table,
    # and hijacks all return traffic to this node into the tailnet — that killed the
    # node's entire v4 internet egress on 2026-07-07. The ClusterMesh underlay for
    # oracle→homelab rides pve's existing 10.10.10.0/24 advertisement instead.
    # Pod-CIDR advertisement also removed: cross-cluster pod traffic rides Cilium
    # ClusterMesh VXLAN, not Tailscale subnet routes. See docs/reference/tailscale-network.md.
    tailscale_advertise_routes: ""
    # No static peer-CIDR routes: once the peer stops advertising the CIDR they blackhole
    # host traffic (packets leave via tailscale0 but match no peer's AllowedIPs).
    tailscale_peer_routes: []
    # netfilter/SNAT 关闭：Tailscale SNAT 会重映射 NFS 源端口、破坏 exports 的 secure 标志
    # （见 git log 2026-06/07 tailscale snat breakage for nfs）
    tailscale_up_extra_args: "--accept-dns=false --netfilter-mode=off --snat-subnet-routes=false"
  roles:
    - tailscale_node
  tasks:
    # --- Tailscale 相关 ip rule 收敛器（2026-08-12 重构，取代两只 boot-oneshot）---
    # 守两条不变量（各自的取证全文在 docs/reference/tailscale-network.md）：
    #   5200  to 100.64.0.0/10 lookup 52      Cilium identity-mark 撞 Tailscale fwmark
    #         （2026-08-09 定性）：Cilium 把 identity 编进 skb->mark 高 16 位；Tailscale
    #         即使 netfilter-mode=off 也装 `fwmark 0x80000/0xff0000` 的 ip rule，掩码
    #         恰好压在 identity 低字节上 → `identity & 0xFF == 0x08` 的 pod（1/256 抽签，
    #         改标签就重抽）出向被劫进 main 表，CGNAT 包扔给 LAN 网关黑洞，
    #         到整个 100.64/10 全超时。别用"换标签"绕：下一个中签的照样断。
    #   5260  to 192.168.50.0/24 lookup main  LAN 直通（2026-07-06，历史名 NFS LAN-route）
    #         pve 合法通告 192.168.50.0/24、本机 --accept-routes，table 52 恒有该段路由；
    #         没有这条规则，到 storage-106 的 restic/vzdump 流量会舍近求远走隧道。
    #         pve 主机上有同款手工单元（无 pve playbook）。
    #
    # ☠️ 为什么从"开机 oneshot"改成"收敛器"（2026-08-12 review 发现两台节点全线失守）：
    # 单元 active(exited)"看起来修过"，规则却全没了，oracle 上 homepage（identity 低字节
    # 0x08）到 100.64/10 全超时。凶手不是 tailscaled，是 **systemd-networkd**：
    # `ManageForeignRoutingPolicyRules` 默认 yes —— networkd (重)启动/重配时清扫一切
    # 非它管理的 ip rule。8-11 清晨 unattended-upgrades 重启了两台节点的 networkd
    # （homelab 06:17 / oracle 06:40），防护规则同时被清；tailscaled 的四条(5210-5270)
    # 有 netlink 监听自愈，我们的没有守护者。pve 用 ifupdown2 不跑 networkd，其手工
    # 5260 幸存 —— 这条差异是破案线索。A/B 实测（oracle 2026-08-12）：默认配置重启
    # networkd → 5200 三秒内被清（抓现行）；装上下面的 drop-in 再重启 → 幸存。
    # 全程取证见 docs/records/2026-08-12-tailscale-iprule-guard-drift.md
    #
    # 防线一（根因）：networkd drop-in 关掉外来规则/路由清扫。
    # 防线二（兜底）：幂等断言脚本 + timer 每 5 分钟重申 —— 对**任何**删除者收敛，
    # 并写 node-exporter textfile 指标，失守可见可告警
    # （k8s/helm/manifests/monitoring/alerts/tailscale-iprule-alerts.yaml）。
    # master 上这个目录早就存在，新节点没有 —— 2026-08-13 加 worker 时才暴露。
    - name: Ensure networkd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/networkd.conf.d
        state: directory
        mode: "0755"

    - name: Stop systemd-networkd sweeping foreign ip rules/routes (root cause of the 2026-08-11 drift)
      ansible.builtin.copy:
        dest: /etc/systemd/networkd.conf.d/10-no-foreign-sweep.conf
        mode: "0644"
        content: |
          # ManageForeignRoutingPolicyRules 默认 yes：networkd (重)启动/重配时清扫一切
          # 非它管理的 ip rule —— 2026-08-11 unattended-upgrades 重启 networkd，把
          # 5200/5260 防护规则清掉（tailscaled 的规则有 netlink 监听自愈，这些没有）。
          # ManageForeignRoutes 同理设 no：table 52 与 Cilium 的路由对 networkd 也是"外来"的。
          # 见 docs/records/2026-08-12-tailscale-iprule-guard-drift.md
          [Network]
          ManageForeignRoutingPolicyRules=no
          ManageForeignRoutes=no
      register: networkd_sweep_conf

    - name: Restart systemd-networkd to load sweep config (only when changed; verified non-disruptive)
      ansible.builtin.service:
        name: systemd-networkd
        state: restarted
      when: networkd_sweep_conf.changed

    # ☠️ 断言行必须用 {% for %} 逐行展开成**真实换行**。
    # 2026-08-13 曾写成 `join('\n          ')`：在 YAML 块标量里 Jinja 拿到的是
    # 字面反斜杠+n，整段 assert 塌成**一行**——shell 把 `52\n` 吃成 `52n`，
    # `ip rule add` 每轮报 invalid table ID；第二条起的规则连 metric 序列都不产生。
    # 收敛器名存实亡而规则"看起来在位"（是 setup 时一次性加对的）。
    # 见 docs/records/2026-08-13-iprule-guard-render-bug.md。
    # 下面脚本尾部的 tailscale_iprule_rules_expected（Jinja 静态渲染的条数）
    # + 告警 TailscaleIpRuleSeriesIncomplete 就是给这类"塌行"上的对账锁。
    - name: Install assert-tailscale-ip-rules script
      ansible.builtin.copy:
        dest: /usr/local/sbin/assert-tailscale-ip-rules
        mode: "0755"
        content: |
          #!/bin/sh
          # Tailscale 相关 ip rule 收敛器 —— tailscale-ip-rules.timer 每 5 分钟执行。
          # ansible 管理（k8s/ansible/playbooks/setup-tailscale.yaml），别在节点上手改。
          set -u

          TEXTFILE_DIR=/var/lib/node_exporter/textfile
          STATE_FILE=/var/lib/tailscale-iprule-reasserts.count
          PROM_FILE=$TEXTFILE_DIR/tailscale_iprule.prom

          mkdir -p "$TEXTFILE_DIR"

          reasserted=0
          present_lines=""

          # assert <priority> <ip rule 匹配/添加参数...>
          assert() {
            prio=$1; shift
            n=$(ip rule show | grep -c "^${prio}:.*$*")
            if [ "$n" -eq 0 ]; then
              ip rule add "$@" priority "$prio" && reasserted=$((reasserted + 1))
              present=0
            else
              # 并发竞态可能留下重复规则；收敛到恰好一条
              while [ "$n" -gt 1 ]; do ip rule del "$@" priority "$prio"; n=$((n - 1)); done
              present=1
            fi
            present_lines="${present_lines}tailscale_iprule_present{priority=\"${prio}\"} ${present}
          "
          }

          {% for rule in tailscale_assert_rules %}
          assert {{ rule }}
          {% endfor %}

          total=$(cat "$STATE_FILE" 2>/dev/null || echo 0)
          case "$total" in *[!0-9]*|"") total=0 ;; esac
          total=$((total + reasserted))
          printf '%s\n' "$total" > "$STATE_FILE"

          TMP="$PROM_FILE.tmp.$$"
          {
            printf '# HELP tailscale_iprule_present 断言前该规则是否在位（0=本轮发现缺失并已补）\n'
            printf '# TYPE tailscale_iprule_present gauge\n'
            printf '%s' "$present_lines"
            printf '# HELP tailscale_iprule_reasserts_total 发现缺失并补齐的累计次数（状态文件持久）\n'
            printf '# TYPE tailscale_iprule_reasserts_total counter\n'
            printf 'tailscale_iprule_reasserts_total %s\n' "$total"
            printf '# HELP tailscale_iprule_rules_expected 应断言的规则条数（Jinja 静态渲染，与 present 序列数对账）\n'
            printf '# TYPE tailscale_iprule_rules_expected gauge\n'
            printf 'tailscale_iprule_rules_expected {{ tailscale_assert_rules | length }}\n'
          } > "$TMP" && mv "$TMP" "$PROM_FILE"

          if [ "$reasserted" -gt 0 ]; then
            echo "REASSERT: $reasserted ip rule(s) were missing and re-added"
          fi
          exit 0

    - name: Install tailscale-ip-rules service
      ansible.builtin.copy:
        dest: /etc/systemd/system/tailscale-ip-rules.service
        mode: "0644"
        content: |
          [Unit]
          Description=Assert Tailscale-related ip rule invariants (convergent guard)
          After=tailscaled.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          # 两遍断言夹 20s：覆盖"断言刚跑完就撞上一次清扫"（如开机 90s 处 timer 首跑
          # 撞云初始化的网络重配），失守窗口从"下个 tick(5min)"缩到 ~20s。
          # 刻意没有 RemainAfterExit（timer 触发才会真正重跑 ExecStart）、没有 ExecStop
          # （规则永不自动移除——旧单元的 ExecStop 正是迁移时的坑）。
          # ⚠️ 没有 PartOf=tailscaled：实测 restart 传播对已死的 oneshot 是空操作，
          # 且 tailscaled 重启本来就不清规则（清规则的是 networkd，已由 drop-in 根治）
          # —— timer 是唯一的、也是足够的重申机制。
          ExecStart=/usr/local/sbin/assert-tailscale-ip-rules
          ExecStart=/bin/sleep 20
          ExecStart=/usr/local/sbin/assert-tailscale-ip-rules

    - name: Install tailscale-ip-rules timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/tailscale-ip-rules.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Re-assert Tailscale ip rules every 5 minutes (convergence loop)

          [Timer]
          OnBootSec=90
          OnUnitActiveSec=5min

          [Install]
          WantedBy=timers.target

    # 旧单元退役。⚠️ 它们的 ExecStop 会顺手删规则——后面立即 start 断言服务补回。
    - name: Retire legacy one-shot rule units (superseded by convergent guard)
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - nfs-lan-route.service
        - tailscale-cgnat-route.service
      failed_when: false

    - name: Remove legacy unit files
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - nfs-lan-route.service
        - tailscale-cgnat-route.service

    - name: Enable and start the convergence timer
      ansible.builtin.systemd:
        name: tailscale-ip-rules.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Assert rules now (also repairs what legacy ExecStop just removed)
      ansible.builtin.systemd:
        name: tailscale-ip-rules.service
        state: started

    # --- Tailscale/CNI recursion guard (2026-07-07) ---
    # tailscaled advertises ALL local addresses as candidate WireGuard endpoints,
    # including Cilium's cilium_host IP. The peer cluster's node can then "reach"
    # us via ClusterMesh VXLAN (which itself rides Tailscale) and picks that as its
    # endpoint: WireGuard-over-VXLAN-over-WireGuard. Blocking 41641 to/from the CNI
    # ranges makes those candidates never validate, so the real public path wins.
    # Same guard exists on node0 via firewalld direct rules (oracle playbook).
    - name: Install tailscale-no-cni-endpoint recursion guard unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/tailscale-no-cni-endpoint.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prevent Tailscale from using CNI addresses as WireGuard endpoints (recursion guard)
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c "/usr/sbin/iptables -C INPUT -p udp --dport 41641 -d 10.42.0.0/16 -j DROP 2>/dev/null || /usr/sbin/iptables -I INPUT 1 -p udp --dport 41641 -d 10.42.0.0/16 -j DROP"
          ExecStart=/bin/sh -c "/usr/sbin/iptables -C OUTPUT -p udp --dport 41641 -d 10.52.0.0/16 -j DROP 2>/dev/null || /usr/sbin/iptables -I OUTPUT 1 -p udp --dport 41641 -d 10.52.0.0/16 -j DROP"
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start recursion guard unit
      ansible.builtin.systemd:
        name: tailscale-no-cni-endpoint.service
        enabled: true
        state: started
        daemon_reload: true
