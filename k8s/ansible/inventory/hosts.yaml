all:
  children:
    k8s_cluster:
      children:
        k8s_masters:
          hosts:
            k8s-node:
              ansible_host: 10.10.10.10
              tailscale_ip: 100.94.186.7
              ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -i ~/.ssh/vgio root@192.168.50.4"'
        # 2026-08-13 入编：storage-106 上的 VM 以 worker 身份加入本集群。
        # 与 master 不同，它直挂 LAN（192.168.50.0/24），无需经 pve 的 ProxyCommand。
        # 反向：它到控制面 10.10.10.10 靠一条静态路由经 pve 转发，见 setup-k3s-worker.yaml。
        k8s_workers:
          hosts:
            k8s-worker-106:
              ansible_host: 192.168.50.107
              tailscale_ip: ""   # 由 setup-tailscale 分配后回填
          # ip rule 断言清单已统一进 setup-tailscale.yaml 的默认 vars（2026-08-13）：
          # 原以为 5240（to 10.10.10.0/24 lookup main）只有 worker 需要，实际 master
          # 同样缺它 —— 自己网段的回包被劫进隧道，pve ProxyCommand 路径因此坏了一天
          # （docs/records/2026-08-13-k3s-worker-join-106.md §4）。两处清单必然漂移，
          # 故收敛为一份；各规则的存在理由见 playbook vars 注释。
      vars:
        ansible_user: ubuntu
        ansible_become: true
        ansible_ssh_private_key_file: ~/.ssh/vgio
    debian_nodes:
      children:
        storage_nodes:
          hosts:
            storage-node-1:
              ansible_host: 192.168.50.106
          vars:
            ansible_user: mr
            ansible_ssh_private_key_file: ~/.ssh/vgio
            # use pass for installation if key auth is not set up
            # ansible_ssh_pass: your_password_here
            # ansible_become_pass: your_password_here
        proxmox_nodes:
          hosts:
            proxmox-node-1:
              ansible_host: 192.168.50.4
          vars:
            ansible_user: root
            ansible_ssh_private_key_file: ~/.ssh/vgio
