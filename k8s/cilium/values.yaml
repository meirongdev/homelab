# Cilium Helm values — homelab cluster (source of truth for a previously manual install).
#
# Cilium was originally installed by hand with the Helm CLI (chart cilium/cilium),
# so its config lived ONLY in the live release. This file codifies it so it is not
# lost on reinstall. Apply with the commands in README.md.
#
# Chart: cilium/cilium  (live images are v1.20.0 by digest in-cluster; keep --version aligned.
#   Was v1.19.1 until the 2026-08-10 drift documented in k8s/helm/justfile — this comment
#   still said 1.19.1 until 2026-08-13.)
# Cluster: homelab (id 1), ClusterMesh peer: oracle-k3s @ 100.107.166.37:32379
#   ⚠️ id 1 and 2 are taken (homelab / oracle-k3s). dgx-spark also self-assigned id 1 and is
#   NOT joining the mesh — see docs/decisions/dgx-clustermesh-not-adopted.md.

cluster:
  id: 1
  name: homelab

k8sServiceHost: 10.10.10.10
k8sServicePort: 6443
kubeProxyReplacement: true
routingMode: tunnel
tunnelProtocol: vxlan

# MTU: deliberately NOT set (auto-detect from the lowest device, tailscale0 = 1280).
# ⚠️ Do NOT set an explicit MTU here: for explicit values Cilium does NOT subtract the
# tunnel overhead — pods and the vxlan device get the same number and the top 50 bytes
# of the range silently blackhole (bit us 2026-07-07 with MTU=1200: inner >1150 dropped
# before even reaching tailscale0).
# Live state and the usable-inner-packet numbers are documented ONCE, in
# docs/reference/tailscale-network.md ("MTU — do NOT set it explicitly"). Do not restate
# them here — a wrong copy lived in this comment until 2026-08-13.
# ⚠️ The chart key is `MTU` (uppercase). A lowercase `mtu:` is an unknown key that Helm
# silently ignores — that is exactly why dgx-spark's `mtu: 1200` never took effect.
# Cross-cluster underlay: oracle→homelab rides pve's 10.10.10.0/24 subnet route;
# homelab→oracle rides node0's self-advertised 10.0.0.26/32. k8s-node must NEVER
# advertise its own 10.10.10.10/32 — pve (a transit router for this segment) would
# learn it into table 52 and hijack ALL return traffic to the node into the tailnet
# (took homelab's entire v4 internet egress down on 2026-07-07).

ipam:
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.42.0.0/16

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Gateway API. enableAppProtocol=true 让 Cilium 尊重 Service appProtocol
# (kubernetes.io/h2c -> 显式 h2c upstream cluster)，任何 gRPC/h2c 后端过网关都需要。
# 历史：为 ZITADEL console 引入（无此设置时 grpc-web -> native grpc 走 HTTP/1.1，
# v1 gRPC 服务 404，见 docs/records/2026-06-07-zitadel-console-grpc-404.md）。ZITADEL 已于
# 2026-07 迁至 oracle-k3s，homelab 当前无 h2c 后端；设置无害且改动 CNI 需滚动，
# 刻意保留。
gatewayAPI:
  enabled: true
  enableAppProtocol: true

clustermesh:
  # ⚠️ **跑完 `just deploy-cilium` 必须接着跑一次**（2026-08-10 实测教训）：
  #   just connect-clustermesh 100.94.186.7:32379 100.107.166.37:32379
  # 本配方带 `--reset-values`，它会把 `cilium clustermesh connect` 交换来的
  # **跨集群 CA 信任**冲掉（两集群各自自签 CA，指纹不同；证书不入库所以本文件保不住它）。
  # 下面的 `clusters:` 只保住 endpoint 条目，保不住互信。
  # 断开后的形态极易误判：`cilium-dbg troubleshoot clustermesh` 六项全 ✅
  # （KVStoreMesh 下 agent 连的是本地 apiserver，那段本来就通）、NodePort 也 TCP 可达。
  # 真判据只有两个：`cilium status` 里 `remote configuration: retrieved=false`，
  # 以及**对端** clustermesh-apiserver 的 etcd 容器日志 `remote error: tls: bad certificate`。
  # 详细复盘见 cloud/oracle/values/cilium-values.yaml 同位注释。
  useAPIServer: true
  config:
    enabled: true
    clusters:
      - name: oracle-k3s
        ips:
          - 100.107.166.37
        port: 32379
  apiserver:
    service:
      type: NodePort
      nodePort: 32379
    podAnnotations:
      cilium.io/caBundleChangeRestartedAt: "2026-04-27T00:04:05+08:00"
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 500m, memory: 192Mi }
    etcd:
      resources:
        requests: { cpu: 50m, memory: 96Mi }
        limits: { cpu: 500m, memory: 256Mi }
    kvstoremesh:
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { cpu: 250m, memory: 128Mi }

hubble:
  enabled: true
  relay:
    enabled: true
    # 2026-08-10 补：此前无 resources → hubble-relay 是本集群仅剩的 BestEffort 之一。
    # 实测 7d 峰值 76Mi。
    resources:
      requests: { cpu: 10m, memory: 96Mi }
      limits: { memory: 192Mi }
  ui:
    enabled: false
  tls:
    enabled: true
    auto:
      enabled: true
      method: cronJob
      certValidityDuration: 365

envoy:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 192Mi }

operator:
  replicas: 1
  # 2026-08-10: memory limit 192Mi→320Mi、request 96Mi→192Mi。
  # 实测 7d 峰值 172Mi / 192Mi = **89%**，过 >80% 判据。cilium-operator 的内存随
  # **集群规模**（identity / endpoint / CiliumNode 数）增长，不随流量——加服务就会推高。
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 500m, memory: 320Mi }

# 顶层 resources = cilium-agent DaemonSet（本键在 chart 里是对的，实测已生效）。
# 2026-08-10: memory limit 512Mi→768Mi、request 256Mi→384Mi。
# 实测 7d 峰值 445Mi / 512Mi = **87%**。agent 的内存同样随集群规模走
# （每个 endpoint 的 eBPF map 状态 + identity 缓存）。
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { cpu: 1000m, memory: 768Mi }

# ClusterMesh CA bundle — NOT committed (crypto material, per repo secret-hygiene).
# This is the shared CA that homelab + oracle-k3s trust for ClusterMesh. On reinstall,
# either let Cilium generate a fresh CA (then reconnect clustermesh on both sides) or
# restore the existing one. Retrieve the live value with:
#   kubectl -n kube-system get secret cilium-ca -o jsonpath='{.data.ca\.crt}' | base64 -d
# and supply it at apply time via:  --set-file tls.caBundle.content=<file>
tls:
  caBundle:
    enabled: true
    # content: <inject at apply time — see note above>
