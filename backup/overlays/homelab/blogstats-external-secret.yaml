# blogstats 库的 owner 口令 —— 夜备脚本用它 pg_dump 博客访问量的长期表。
#
# ⚠️ 为什么单独一个 ExternalSecret，而不是往 restic-backup 里加一个 key：与
# open-notebook-external-secret.yaml 同一个理由 —— ESO 的 `data` 是全有全无的，
# Vault 里缺 `secret/homelab/blogstats` 会让**整个 restic-backup Secret 同步失败**，
# 而那个对象是整条夜备的凭据来源。顺带还会让 `ExternalSecretNotReady`（15m 就响）
# 指着 backup 命名空间报警 —— 一个还没激活的新功能不该让关键子系统的健康信号说谎。
# 拆开 + CronJob 里把卷标成 optional：Vault 还没写时最多是「这一项没备份」的 warn。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blogstats-pg
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: blogstats-pg
    creationPolicy: Owner
  data:
    # 与 blog-stats-rollup 写库用的是同一个值（Vault 里同一个 property）。
    - secretKey: BLOGSTATS_DB_PASSWORD
      remoteRef: { key: secret/homelab/blogstats, property: owner_password }
