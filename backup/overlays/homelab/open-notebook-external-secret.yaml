# Open Notebook 的 SurrealDB root 口令 —— 夜备脚本用它调 /export 做逻辑导出。
#
# ⚠️ 为什么单独一个 ExternalSecret，而不是往 restic-backup 里加一个 key：
# ESO 的 `data` 是全有全无的——只要 Vault 里缺 `secret/homelab/open-notebook`，
# 整个 restic-backup Secret 就同步失败，**夜备全挂**。这个仓库已经栽过一次同类跟头
# （zitadel 迁走后遗留的 pg_dump 步骤导致夜备失败，见 backup-script.yaml 注释）。
# 拆开 + CronJob 里把这个卷标成 optional，Vault 还没写时最多是"这一项没备份"的告警，
# 而不是整条备份链断掉。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-notebook-surreal
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: open-notebook-surreal
    creationPolicy: Owner
  data:
    - secretKey: SURREAL_PASSWORD
      remoteRef: { key: secret/homelab/open-notebook, property: surreal-password }
