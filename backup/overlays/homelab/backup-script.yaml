apiVersion: v1
kind: ConfigMap
metadata:
  name: restic-backup-script
  namespace: backup
data:
  backup.sh: |
    #!/bin/sh
    # homelab nightly backup → restic 仓库 (106 ZFS, sftp)
    # 逻辑 dump 保证一致性：Vault=raft snapshot API；
    # sqlite/文件 PVC=从 local-path 原样拷贝（restic 读原始文件，restore 时 sqlite 由 WAL 自恢复）；
    # calibre 书库已于 2026-08-03 迁往 oracle-k3s —— 本脚本不再备份它，
    # 现由 backup/overlays/oracle/backup-script.yaml 的 BOOKS_DIR 逻辑接手。
    set -eu

    echo "[backup] installing tools (restic/openssh/pg/curl/findutils)..."
    apk add --no-cache restic openssh-client postgresql-client curl findutils >/dev/null

    # --- SSH（走 ~/.ssh/config，避免每条命令重复 -o sftp.command）---
    install -d -m 700 /root/.ssh
    base64 -d /creds/SSH_KEY_B64 > /root/.ssh/id_ed25519   # b64 存储，保尾部换行
    chmod 600 /root/.ssh/id_ed25519
    cat > /root/.ssh/config <<EOF
    Host 192.168.50.106 100.110.27.111
      User root
      IdentityFile /root/.ssh/id_ed25519
      StrictHostKeyChecking accept-new
      UserKnownHostsFile /root/.ssh/known_hosts
    EOF
    chmod 600 /root/.ssh/config

    export RESTIC_PASSWORD="$(cat /creds/RESTIC_PASSWORD)"
    export RESTIC_REPOSITORY="sftp:root@192.168.50.106:/storage/restic"

    rm -rf /work/* 2>/dev/null || true
    mkdir -p /work/pvc

    # --- 1) Vault raft snapshot（token 先 renew-self，尽力）---
    echo "[backup] vault raft snapshot..."
    VT="$(cat /creds/VAULT_TOKEN)"
    curl -sf -X POST -H "X-Vault-Token: $VT" http://vault.vault.svc:8200/v1/auth/token/renew-self >/dev/null 2>&1 || echo "[warn] vault token renew-self failed (continuing)"
    curl -sf -H "X-Vault-Token: $VT" http://vault.vault.svc:8200/v1/sys/storage/raft/snapshot -o /work/vault.snap
    echo "[backup]   vault.snap = $(wc -c < /work/vault.snap) bytes"

    # （ZITADEL pg_dump 与 gotify 已于 2026-07-06 迁 oracle，改由 oracle 侧脚本备份；
    #   2026-07-07 从本脚本移除 —— homelab 的 zitadel ns 已删，遗留 dump 步骤导致夜备失败。）

    # --- 2) sqlite/config PVC（local-path；2026-07-11 起全部 PVC 已迁离 NFS）---
    # 只取 sqlite DB(+journal) 与小 json 配置；剪掉 cache 等可重建内容。
    #
    # ⚠️ `*.db-journal` 是 2026-08-03 补的：原模式只有 `*.db-wal` / `*.db-shm`，
    # 那是 **WAL 模式**的产物。jobs-sg 为了让只读挂载的 web 能打开库改用了
    # **DELETE(rollback) journal**，它的伴随文件叫 `jobs.db-journal`，一个模式都匹配不上。
    # 后果很隐蔽：若热拷贝正好撞上写事务，jobs.db 是写到一半的状态、而回滚日志没被带走
    # → 恢复出来的库可能不一致，且 SQLite 没有 journal 可回滚。
    # 正常时段（03:00 CST）没有写者，所以这是**窗口问题而非必然**，但恰好是那种
    # 「平时不出事、真出事时才发现备份是坏的」的坑。
    # ⚠️ 下面的 `for pat in ...` 是**显式白名单**——新增有状态应用必须往里加，否则静默不备份。
    # 该失效模式已由 CI 拦截（scripts/check-manifests.py 的 H4）；
    # 规则全文见 docs/reference/manifest-safety-checks.md。
    # （processed_books/thumbnails 的剪枝规则随 calibre 一并迁去了 oracle overlay，
    #   2026-08-03 起本集群不再有 calibre config PVC。）
    echo "[backup] copy sqlite/config files (*.db*/small *.json, prune cache)..."
    for base in /localpath; do
      [ -d "$base" ] || continue
      # open-notebook-data：/app/data 整体不备份（播客可重放），但其中
      # sqlite-db/checkpoints.sqlite 是对话线程状态（LangGraph checkpointer），
      # 不在 SurrealDB /export 里 —— 靠本圈的 *.sqlite* 模式捞走（2026-08-01 实测发现）。
      # jobs-sg-data：只捞走 jobs.db(+journal)。raw/ 归档是 *.jsonl.gz，**匹配不上**
      # 下面这组文件名模式 —— 它由第 3 步的 JOBS_ARCHIVE_DIR 整目录纳入，别以为这行
      # 就把 jobs-sg 备全了（上游 docs/04 §4 只写了加这一行，那是不够的）。
      # ⚠️ `navidrome-data` 与 `jellyfin-config` 自 2026-08-16 起在**本节点上匹配不到任何目录**
      # —— 两个 media 服务都已钉到 k8s-worker-106，它们的 PVC 由 worker 侧夜备
      # （worker-backup-script.yaml，整目录扫）覆盖。这两条留着是给 CI 的 H4 用的
      # （H4 只解析本文件的白名单），也留着以便将来搬回来。
      # 别因为"这里有它"就以为 master 这份快照里有它们 —— 恢复时按 --host homelab-worker 找。
      for pat in open-notebook-data jobs-sg-data jellyfin-config navidrome-data; do
        for d in "$base"/*"$pat"*; do
          [ -d "$d" ] || continue
          dest="/work/pvc/$(basename "$d")"
          find "$d" -maxdepth 3 \
            \( -name processed_books -o -name thumbnails -o -name cache -o -name .cache \) -prune -o \
            -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.db-journal' -o -name '*.sqlite*' -o -name '*.json' \) -size -80M -print 2>/dev/null | \
          while IFS= read -r f; do
            rel="${f#"$d"/}"
            mkdir -p "$dest/$(dirname "$rel")"
            cp -a "$f" "$dest/$rel" 2>/dev/null || true
          done
        done
      done
    done
    echo "[backup]   pvc files = $(find /work/pvc -type f 2>/dev/null | wc -l), size = $(du -sh /work/pvc 2>/dev/null | cut -f1)"

    # --- 2b) Open Notebook：SurrealDB 逻辑导出 ---
    # 上面那圈按 *.db*/*.json 抓文件的做法对 SurrealDB 无效：它的 rocksdb 是一组
    # .sst/MANIFEST/CURRENT，且被活着的单写者进程持有，热拷出来不一致。
    # 走 HTTP /export 拿 SurrealQL 全量（与 Vault raft snapshot 同样是"逻辑 dump"路子）。
    # 库里存着 notebooks/sources/向量 + 各模型凭据，量小，每晚全量即可。
    # 口令来自 optional 卷：Vault 未写时这里只 warn，不中断夜备（见 cronjob-patch.yaml）。
    echo "[backup] surrealdb export (open_notebook)..."
    SURREAL_PW="$(cat /creds-open-notebook/SURREAL_PASSWORD 2>/dev/null || true)"
    if [ -z "$SURREAL_PW" ]; then
      echo "[warn] SURREAL_PASSWORD absent (vault secret/homelab/open-notebook not written?) — Open Notebook NOT in this backup"
    elif curl -sf -u "root:$SURREAL_PW" \
        -H "Surreal-NS: open_notebook" -H "Surreal-DB: open_notebook" \
        -H "Accept: application/octet-stream" \
        http://open-notebook-surrealdb.personal-services.svc:8000/export \
        -o /work/open-notebook.surql; then
      echo "[backup]   open-notebook.surql = $(wc -c < /work/open-notebook.surql) bytes"
    else
      echo "[warn] surrealdb /export failed — Open Notebook NOT in this backup"
      rm -f /work/open-notebook.surql
    fi
    # 注：/app/data（open-notebook-data-local）的大文件（上传原件、播客音频）刻意不备份
    # ——可重放/书库里已有，与 calibre config PVC 剪掉 processed_books/thumbnails 同理。
    # 其中的 checkpoints.sqlite（对话状态）由上面第 2 步的 *.sqlite* 模式捞走。
    # ⚠️ 直接经 UI 拖拽上传、且不在书库里的原件是唯一真丢的东西（提取文本/向量在 DB 里）。

    # --- 2c) LiteLLM：Postgres 逻辑 dump（pg_dump）---
    # litellm 的 keys/spend 在 Postgres（litellm-pg, local-path）——数据目录**不能**像 sqlite
    # 那样原样拷贝（无 WAL 自恢复），必须 pg_dump 一致性 dump（与 ZITADEL/它的 DB 同哲理）。
    # backup 容器 alpine:3.22 自带 postgresql-client（pg17），与服务端版本匹配。
    # 凭据来自 external-secret.yaml 的 LITELLM_DB_PASSWORD（Vault secret/homelab/litellm-db → db_password）。
    echo "[backup] pg_dump litellm DB..."
    export PGPASSWORD="$(cat /creds/LITELLM_DB_PASSWORD 2>/dev/null || true)"
    if [ -z "$PGPASSWORD" ]; then
      echo "[warn] LITELLM_DB_PASSWORD absent (vault secret/homelab/litellm-db not written?) — litellm NOT in this backup"
    elif pg_dump -h litellm-pg.litellm.svc -U litellm -d litellm -Fc -f /work/litellm.dump 2>/dev/null; then
      echo "[backup]   litellm.dump = $(wc -c < /work/litellm.dump) bytes"
    else
      echo "[warn] pg_dump litellm failed — litellm NOT in this backup"
      rm -f /work/litellm.dump
    fi

    # --- 3) restic backup + 保留策略 ---
    # jobs-sg 的 raw/ 归档（raw/<date>/NNN.jsonl.gz）直接纳入，不经 /work 中转：
    # /work 是 emptyDir，每晚拷一遍会白吃节点临时盘。同 oracle overlay 的 BOOKS_DIR 做法。
    #
    # ⚠️ 这是本仓库**唯一不可重建**的数据：MCF API 只返回当前在架职位，下架的拿不回来。
    # 第 2 步的 *.db 白名单捞不到 .jsonl.gz（模式对不上），只有这里能保住它。
    # PVC 重建会变 pvc-<uid> 路径前缀 → restic 视为新路径重传一次，属预期。
    JOBS_ARCHIVE_DIR="$(ls -d /localpath/*jobs-sg-data*/raw 2>/dev/null | head -1 || true)"
    [ -n "$JOBS_ARCHIVE_DIR" ] || echo "[warn] jobs-sg raw/ archive not found under /localpath — jobs-sg archive NOT in this backup!"

    echo "[backup] restic backup..."
    restic cat config >/dev/null 2>&1 || restic init
    # 清理陈旧锁：activeDeadline 杀掉的上一次运行会留下 repo 锁（只清死进程的锁，安全）
    restic unlock 2>/dev/null || true
    restic backup /work ${JOBS_ARCHIVE_DIR:+"$JOBS_ARCHIVE_DIR"} --host homelab --tag nightly --cleanup-cache
    echo "[backup] forget/prune..."
    restic forget --host homelab --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
    restic snapshots --host homelab --latest 2
    echo "[backup] DONE"
