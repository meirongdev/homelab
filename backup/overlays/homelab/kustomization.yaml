# homelab 备份 overlay — 由 ArgoCD app `backup` 部署（argocd/applications/backup.yaml）。
# 备份对象：Vault raft snapshot、sqlite/config PVC（均 local-path）、
# Open Notebook 的 SurrealDB 逻辑导出（/export）。
# ZITADEL pg_dump 与 gotify 已随迁移改由 oracle 侧备份（见 backup-script.yaml 内注释）；
# calibre 书库 2026-08-03 迁 oracle 后同理，改由 oracle overlay 备份。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secret.yaml
  - open-notebook-external-secret.yaml
  - backup-script.yaml
  # 月度恢复演练（2026-08-13）：真恢复 + 跑判据，把"备份在跑"升级成"备份被证明能恢复"。
  # 只在 homelab 侧有一份 —— 它读的是同一个 106 仓库，一次演练同时覆盖两个集群的快照。
  - restore-drill-script.yaml
  - restore-drill-cronjob.yaml
  # worker 侧夜备（2026-08-16）：base 的 Job 钉 control-plane、只备**所在节点**的
  # hostPath，k8s-worker-106 上的 local-path PVC 因此一直不在任何备份里。
  # 这两个文件补上另一半覆盖（同仓库、--host homelab-worker、02:00 错峰）。
  - worker-backup-script.yaml
  - worker-cronjob.yaml
patches:
  - path: cronjob-patch.yaml
