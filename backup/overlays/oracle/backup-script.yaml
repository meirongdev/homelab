apiVersion: v1
kind: ConfigMap
metadata:
  name: restic-backup-script
  namespace: backup
data:
  backup.sh: |
    #!/bin/sh
    # oracle-k3s nightly backup → restic 仓库 (106 ZFS, sftp over Tailscale)
    # PG=逐库 pg_dump(apps-pg/miniflux + zitadel-pg/zitadel)；sqlite=local-path hostPath 原样拷贝。
    # 2026-08-14: karakeep-data/meilisearch-data 随 karakeep 退役移除白名单（Deployment
    # 与 PVC 均已删除，用户确认无需备份）。
    # calibre 书库(2026-08-02 从 homelab 迁入，~23G)以目录整体纳入 restic
    # ——增量去重，首晚全量后每晚近零成本。做法与迁移前 homelab 侧一致。
    set -eu
    echo "[backup] installing tools..."
    # postgresql17-client 显式钉版:两个库都是 PG17(CNPG),pg_dump 必须 ≥17
    apk add --no-cache restic openssh-client postgresql17-client findutils >/dev/null

    install -d -m 700 /root/.ssh
    base64 -d /creds/SSH_KEY_B64 > /root/.ssh/id_ed25519
    chmod 600 /root/.ssh/id_ed25519
    cat > /root/.ssh/config <<EOF
    Host 100.110.27.111
      User root
      IdentityFile /root/.ssh/id_ed25519
      StrictHostKeyChecking accept-new
      UserKnownHostsFile /root/.ssh/known_hosts
    EOF
    chmod 600 /root/.ssh/config

    export RESTIC_PASSWORD="$(cat /creds/RESTIC_PASSWORD)"
    export RESTIC_REPOSITORY="sftp:root@100.110.27.111:/storage/restic"
    rm -rf /work/* 2>/dev/null || true
    mkdir -p /work/pvc

    # --- 1) PG 逐库 pg_dump ---
    # ⚠️ 2026-08-06 起这是**显式清单**（同下面 sqlite 白名单的性质）：apps-pg 上每加一个
    # 租户，就必须在这里加一行 pg_dump，否则该库静默不备份。
    # 从 pg_dumpall 改成逐库 pg_dump 的原因：旧的 rss-postgres 里 miniflux 恰好是超级
    # 用户，pg_dumpall 才跑得通；apps-pg 是 CNPG 且 enableSuperuserAccess: false，
    # 应用用户只能 dump 自己的库。角色/权限已由 git 里的 Database/DatabaseRole CR 声明，
    # 不再需要 pg_dumpall 的 globals。
    echo "[backup] miniflux pg_dump (apps-pg)..."
    PGPASSWORD="$(cat /creds/PG_PASSWORD)" pg_dump \
      -h apps-pg-rw.databases.svc -p 5432 -U miniflux -d miniflux --no-owner --no-privileges -f /work/miniflux.sql
    echo "[backup]   miniflux.sql = $(wc -c < /work/miniflux.sql) bytes"
    # ZITADEL PG（CNPG 集群 zitadel-pg，2026-07-18 起；旧 bitnami zitadel-db 已退役）
    echo "[backup] zitadel pg_dump..."
    PGPASSWORD="$(cat /creds/ZITADEL_PG_PASSWORD)" pg_dump \
      -h zitadel-pg-rw.zitadel.svc -p 5432 -U zitadel -d zitadel --no-owner --no-privileges -f /work/zitadel.sql
    echo "[backup]   zitadel.sql = $(wc -c < /work/zitadel.sql) bytes"

    # --- 2) sqlite/config from local-path（cache 不含）---
    echo "[backup] copy sqlite/config files..."
    # ⚠️ 这是**显式白名单**——新增有状态应用必须往这里加，否则静默不备份。
    # 该失效模式已由 CI 拦截：scripts/check-manifests.py 的 H4 会把「清单里声明了 PVC
    # 但既不在本白名单、也没在检查器里写明豁免理由」判为违规。
    # 规则全文见 docs/reference/manifest-safety-checks.md。
    # calibre-web-automated-config：只取 sqlite(app.db/cwa.db 等)，
    # processed_books/thumbnails 是可重建缓存，与迁移前 homelab 侧同口径剪掉。
    # trends-data：2026-08-03 补入——H4 首次运行即抓到它自 2026-06-05 起静默未备份
    # （45MB SQLite，且 PVC 带 Prune=false，本就是当作要紧数据对待的）。
    # readlist-data：2026-08-05 随 readlist 上线加入。卷上有**不可再生**数据——
    # evidence(重建要烧 2–3 天 Google Books 配额)、publisher_map、overrides、
    # title_whitelist。readlist.db 是 sqlite，被下面的 *.db/-wal/-shm 规则覆盖；
    # /data/snapshot 下的快照是派生物，一起进来无妨（体积小）。
    # 2026-08-11: 移除 stirling-pdf-configs —— stirling-pdf 已被 bentopdf 取代，
    # 后者是纯客户端 WASM 应用，服务端零状态、没有 PVC，因此备份清单里不需要接替项。
    for pat in uptime-kuma-data timeslot-pvc calibre-web-automated-config trends-data readlist-data; do
      for d in /localpath/*"$pat"*; do
        [ -d "$d" ] || continue
        dest="/work/pvc/$(basename "$d")"
        find "$d" -maxdepth 3 \
          \( -name cache -o -name meili_data -o -name data.ms \
             -o -name processed_books -o -name thumbnails \) -prune -o \
          -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.sqlite*' -o -name '*.json' \) -size -512M -print 2>/dev/null | \
        while IFS= read -r f; do
          rel="${f#"$d"/}"
          mkdir -p "$dest/$(dirname "$rel")"
          cp -a "$f" "$dest/$rel" 2>/dev/null || true
        done
      done
    done
    echo "[backup]   pvc files = $(find /work/pvc -type f 2>/dev/null | wc -l), size = $(du -sh /work/pvc 2>/dev/null | cut -f1)"

    # --- 3) restic ---
    # 书库目录直接纳入（不经 /work 中转，避免每晚 23G 拷贝）；
    # PVC 重建会改变 pvc-<uid> 路径前缀 → restic 视为新路径重传一次，属预期。
    BOOKS_DIR="$(ls -d /localpath/*calibre-books-local* 2>/dev/null | head -1 || true)"
    [ -n "$BOOKS_DIR" ] || echo "[warn] calibre-books-local not found under /localpath — books NOT in this backup!"
    echo "[backup] restic backup (work + books)..."
    restic cat config >/dev/null 2>&1 || restic init
    restic unlock 2>/dev/null || true
    restic backup /work ${BOOKS_DIR:+"$BOOKS_DIR"} --host oracle-k3s --tag nightly --cleanup-cache
    echo "[backup] forget/prune..."
    restic forget --host oracle-k3s --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
    restic snapshots --host oracle-k3s --latest 2
    echo "[backup] DONE"
