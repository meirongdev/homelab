apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
  namespace: backup
spec:
  schedule: "0 3 * * *"           # 默认值；各 overlay 覆盖以错峰（homelab 03:00 / oracle 03:30）
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600   # 超 1h 视为卡住（如 NFS hang）→ 失败告警而非常驻
      backoffLimit: 2                 # 2026-07-16: 1→2 (transient SSH/Tailscale failures like 29732820)
      template:
        metadata:
          labels: { app: restic-backup }
        spec:
          restartPolicy: Never
          # ⚠️ 必须钉在 control-plane（2026-08-13，homelab 变双节点后）：本 Job 备份的是
          # **所在节点**的 hostPath /var/lib/rancher/k3s/storage。不钉节点时它可能被调度
          # 到 worker——那里该目录几乎为空，下面脚本的白名单循环对空目录静默 continue，
          # 产出「近空快照 + rc=0」的假阴性备份（漏备 == 已备）。oracle 单节点本身就是
          # control-plane，不受影响。worker 上一旦出现 PVC，由 PVCOnUnbackedNode 告警
          # 兜底（k8s/helm/manifests/monitoring/alerts/prometheus-rules.yaml）。
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          securityContext:
            runAsUser: 0             # 需 root 读 hostPath 各 uid 文件 + 写 /root/.ssh
          containers:
            - name: backup
              # 3.22: 提供 postgresql17-client —— oracle 侧 zitadel DB 已是 CNPG PG17,
              # pg_dump 16 会因 server version mismatch 拒绝 dump(2026-07-18 手动验证时抓到)。
              image: alpine:3.22
              command: ["sh", "/scripts/backup.sh"]
              resources:
                requests: { cpu: "50m", memory: "128Mi" }
                # limits 由各 overlay 设置（homelab 热节点收紧 / oracle 余量大）
              volumeMounts:
                - { name: script,    mountPath: /scripts,   readOnly: true }
                - { name: creds,     mountPath: /creds,     readOnly: true }
                - { name: work,      mountPath: /work }
                - { name: localpath, mountPath: /localpath, readOnly: true }
          volumes:
            - name: script
              configMap: { name: restic-backup-script }
            - name: creds
              secret: { secretName: restic-backup, defaultMode: 0400 }
            - name: work
              emptyDir: {}
            - name: localpath
              hostPath: { path: /var/lib/rancher/k3s/storage, type: Directory }
