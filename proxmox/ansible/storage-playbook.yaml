---
- name: Provision storage server (PVE node)
  hosts: storage
  gather_facts: true
  vars:
    zfs_pool_name: mrstorage
    zfs_mountpoint: /storage
    # 子数据集配额（`zfs get quota` 的原样字符串，比较用，别写成 "100GB"/"102400M"）
    zfs_dataset_quotas:
      - { dataset: "mrstorage/restic", quota: "100G" }
    nfs_exports:
      # `insecure` allows non-privileged (>1024) source ports. Required because the
      # k8s node has no LAN interface and reaches this server only through NAT
      # (pve masquerade / Tailscale subnet-router SNAT), which can remap NFS client
      # source ports out of the privileged (<1024) range that the default `secure`
      # flag demands — otherwise fresh mounts fail with "Operation not permitted".
      # See docs/runbooks + git log 2026-07-06.
      - path: /storage
        clients:
          - "192.168.50.0/24(rw,insecure,sync,no_subtree_check,no_root_squash)"
          - "100.89.15.120(rw,insecure,sync,no_subtree_check,no_root_squash)"
      - path: /storage/calibre
        clients:
          - "*(rw,insecure,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000)"
      # --- 多媒体仓库 serving 用的只读 export（2026-08-16 multimedia-repository plan）---
      # 只读 + all_squash：homelab 的 k8s serving 层（Jellyfin/Navidrome/静态 RSS）只能读，
      # 永远没有 106 的写权（所有写路径走非 k8s 侧）。媒体是顺序读，NFS 安全兜住的那类。
      # 授权 192.168.50.0/24 覆盖两个节点：k8s-node 无 LAN 接口，经 pve NAT 源 IP 落在
      # 192.168.50.1 / 192.168.50.0/24 内；worker = 192.168.50.107。
      # anonuid/anongid=1000（mr）与现有 /storage/calibre 的 all_squash 同规格，媒体属主兼容。
      # 复用现有目录（movie/tv/anime/music），不迁移不动原数据；podcast 为新建。
      - path: /storage/movie
        clients:
          - "192.168.50.0/24(ro,insecure,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000)"
      - path: /storage/tv
        clients:
          - "192.168.50.0/24(ro,insecure,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000)"
      - path: /storage/anime
        clients:
          - "192.168.50.0/24(ro,insecure,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000)"
      - path: /storage/music
        clients:
          - "192.168.50.0/24(ro,insecure,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000)"
      - path: /storage/podcast
        clients:
          - "192.168.50.0/24(ro,insecure,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000)"
    # mr_user_password is in vars/vault.yaml (ansible-vault encrypted)
  vars_files:
    - vars/vault.yaml

  tasks:
    - name: Import ZFS pool
      ansible.builtin.command:
        cmd: zpool import -f {{ zfs_pool_name }}
        creates: "{{ zfs_mountpoint }}"
      register: zpool_import

    - name: Ensure ZFS mountpoint is set
      ansible.builtin.command:
        cmd: zfs set mountpoint={{ zfs_mountpoint }} {{ zfs_pool_name }}
      when: zpool_import.changed

    # --- 子数据集的配额（2026-08-16 补进 IaC）---
    # 在此之前这些 `zfs set quota=` 只存在于 2026-07-06 那份 plan 的命令块里 ——
    # 也就是说重建 106 会**静默地**丢掉配额（dataset 无上限地吃池子，不会有任何报错）。
    # 配额的意义不是省空间（池子还有 6.29T），而是**给"备份仓库无限膨胀"划一条会响的线**：
    # /storage/restic 作为 ZFS dataset 会以 node_filesystem_* 出现在 node-exporter 里，
    # 配额就是它的 size → DiskSpaceLow(<15%)/DiskSpaceCritical(<8%) 才有分母可用。
    # 去掉配额 = 那两条告警对这个仓库永远不会响。
    # restic: 50G → **100G**（2026-08-16，已用 26.2G/52% 逼近一半时抬的；抬完 26%）。
    - name: Read current quotas
      ansible.builtin.command:
        cmd: zfs get -H -o value quota {{ item.dataset }}
      loop: "{{ zfs_dataset_quotas }}"
      register: zfs_quota_now
      changed_when: false
      tags: [zfs, quota]

    # 只在实际值与期望不符时才 set —— 这样 `changed` 是真的，不是 changed_when: false 糊出来的
    - name: Ensure quotas on mrstorage child datasets
      ansible.builtin.command:
        cmd: zfs set quota={{ item.item.quota }} {{ item.item.dataset }}
      loop: "{{ zfs_quota_now.results }}"
      loop_control:
        label: "{{ item.item.dataset }} {{ item.stdout }} -> {{ item.item.quota }}"
      when: item.stdout != item.item.quota
      tags: [zfs, quota]

    - name: Create mr user
      ansible.builtin.user:
        name: mr
        uid: 1000
        group: root
        groups: sudo
        shell: /bin/bash
        create_home: true
        password: "{{ mr_user_password }}"
        state: present

    - name: Create .ssh directory for mr
      ansible.builtin.file:
        path: ~mr/.ssh
        state: directory
        owner: mr
        group: root
        mode: "0700"

    - name: Copy vgio public key to mr's authorized_keys
      ansible.builtin.copy:
        src: ~/.ssh/vgio.pub
        dest: ~mr/.ssh/authorized_keys
        owner: mr
        group: root
        mode: "0600"

    - name: Ensure mr has passwordless sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/mr
        line: "mr ALL=(ALL) NOPASSWD: ALL"
        create: true
        mode: "0440"

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - sudo
          - nfs-kernel-server
          - htop
          - screen
          - lm-sensors
          - powertop
          - build-essential
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure NFS exports
      ansible.builtin.copy:
        dest: /etc/exports
        content: |
          # /etc/exports: managed by Ansible
          {% for export in nfs_exports %}
          {% for client in export.clients %}
          {{ export.path }}	{{ client }}
          {% endfor %}
          {% endfor %}
        mode: "0644"
      register: exports_file

    - name: Create /storage/calibre directory if not exists
      ansible.builtin.file:
        path: /storage/calibre
        state: directory
        owner: mr
        group: root
        mode: "0755"

    # 多媒体仓库 serving 目录（复用现有 movie/tv/anime/music，podcast 新建）
    - name: Ensure media serving directories exist
      ansible.builtin.file:
        path: "/storage/{{ item }}"
        state: directory
        owner: mr
        group: root
        mode: "0755"
      loop:
        - movie
        - tv
        - anime
        - music
        - podcast

    - name: Export NFS shares
      ansible.builtin.command:
        cmd: exportfs -ra
      when: exports_file.changed

    - name: Enable and start NFS server
      ansible.builtin.systemd:
        name: nfs-server
        enabled: true
        state: started

    - name: Enable and start ZFS Event Daemon
      ansible.builtin.systemd:
        name: zfs-zed
        enabled: true
        state: started

    # --- ZFS ARC 上限 1GiB（2026-08-16，给 worker VM 让内存到 4G）---
    # 历史：512MB →（2026-07-06 为 NFS 读缓存）4GB → 2GB（08-13）→ **1GB（08-16）**。
    # 4GB 是 NFS 运行时时代定的尺寸，而 NFS 五天后（07-11）就退役了。
    #
    # 为什么还能再砍一半（2026-08-16 实测账）：106 只有 8G，`free -m` available 仅 556MB
    # 且已在用 188MB swap —— **给 VM 加内存没有第二个来源**。而 ARC 在这台机上的收益本来就低：
    #   · 媒体只读 NFS = 几百 MB 的大文件顺序流，ARC 命中率接近零（读一次就过）
    #   · restic 仓库 26G，真正吃缓存的是索引/元数据（几百 MB 量级），1G 仍装得下
    #   · 白天 load ~0.3 纯空转，arcstat 读计数长期为 0
    # 代价：夜间 restic prune/check 会慢一些（只影响备份窗口时长，不影响正确性）。
    # 换来的 1GB 给 worker VM（2c/3G → 2c/4G），承接 jellyfin 这类需要内存的负载。
    # ⚠️ 再想给 VM 加内存就没得挪了：下一步只能是给 106 加物理内存（DDR4 SO-DIMM）。
    # 决策与内存账：docs/decisions/cluster-placement-for-new-services.md
    # 单独跑：just storage-arc-limit（--tags arc，不碰上面的 NFS/ZFS 任务）
    - name: Cap ZFS ARC at 1 GiB (persist across reboots)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/zfs.conf
        content: |
          # ansible 管理（proxmox/ansible/storage-playbook.yaml, tags: arc）——别手改。
          # 1GiB：备份目标的元数据缓存够用；让出的内存给 worker VM（k8s-worker-106，4G）。
          # 历史：512MB → 4GB（2026-07-06，NFS 读缓存，NFS 已于 07-11 退役）→ 2GB（08-13）→ 1GB（08-16）。
          options zfs zfs_arc_max=1073741824
        mode: "0644"
      tags: [arc]

    - name: Apply ARC cap at runtime (ARC evicts down within seconds)
      ansible.builtin.shell: echo 1073741824 > /sys/module/zfs/parameters/zfs_arc_max
      changed_when: true
      tags: [arc]
