---
# Play 1: storage server (106) — node_exporter + smartctl_exporter + RAPL
- name: Deploy node_exporter and smartctl_exporter on storage server
  hosts: storage
  gather_facts: true
  vars:
    # renovate: datasource=github-releases depName=prometheus/node_exporter
    node_exporter_version: "1.11.1"
    # renovate: datasource=github-releases depName=prometheus-community/smartctl_exporter
    smartctl_exporter_version: "0.14.0"
    node_exporter_port: 9100
    smartctl_exporter_port: 9633
    # 需要定期 scrub + 上报 scrub 时间戳的池。加池子时记得加进来
    # （`zpool list -H -o name` 现取；2026-08-30 只有 mrstorage 一个）。
    zfs_pools:
      - mrstorage

  tasks:
    # ── node_exporter ──────────────────────────────────────────────────────────
    - name: Create node_exporter system user
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /bin/false
        create_home: false

    - name: Download node_exporter archive
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"

    - name: Extract node_exporter
      ansible.builtin.unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    # ── RAPL permissions ───────────────────────────────────────────────────────
    # energy_uj is root-only since kernel 5.10 (PLATYPUS mitigation, CVE-2020-8694),
    # but node_exporter runs unprivileged — so --collector.rapl fails silently:
    # node_scrape_collector_success{collector="rapl"} 0 and zero node_rapl_* series,
    # which left the Grafana "Hardware / Power Overview" dashboard empty (found 2026-08-12).
    # udev's built-in MODE=/GROUP= only apply to /dev nodes, not to sysfs attributes,
    # so the permission change has to go through RUN+=. Read access goes to the
    # node_exporter group only, not world — the counters are still a power side channel.
    - name: Install udev rule granting node_exporter read access to RAPL counters
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-node-exporter-rapl.rules
        mode: "0644"
        content: |
          # Managed by Ansible — proxmox/ansible/playbooks/node-exporter-deploy.yaml
          SUBSYSTEM=="powercap", ACTION=="add|change", TEST=="/sys%p/energy_uj", RUN+="/bin/chgrp node_exporter /sys%p/energy_uj", RUN+="/bin/chmod g+r /sys%p/energy_uj"
      register: rapl_udev_rule

    # Runs every time (cheap, idempotent) so permissions self-heal if something reset
    # them; only reported as changed when the rule file itself changed.
    - name: Reload udev rules and re-trigger powercap devices
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - udevadm control --reload-rules
        - udevadm trigger --subsystem-match=powercap --action=add --settle
      changed_when: rapl_udev_rule is changed

    # textfile 目录必须先于 node_exporter 存在，否则该 collector 启动即报错。
    # root 写（zpool-scrub-textfile 以 root 跑）、node_exporter 组只读。
    - name: Create node_exporter textfile collector directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile
        state: directory
        owner: root
        group: node_exporter
        mode: "0755"

    - name: Create node_exporter systemd service (with RAPL + ZFS + textfile)
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter \
            --web.listen-address=:{{ node_exporter_port }} \
            --collector.zfs \
            --collector.rapl \
            --collector.systemd \
            --collector.processes \
            --collector.textfile \
            --collector.textfile.directory=/var/lib/node_exporter/textfile
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: restart node_exporter

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        daemon_reload: true
        enabled: true
        state: started

    # ── zpool scrub 时间戳采集器（2026-08-30 新增）─────────────────────────────
    # ☠️ 为什么需要它：node_exporter 的 zfs collector **不导出 scrub 时间戳**
    # （只有 node_zfs_zpool_state 与一堆 node_zfs_zpool_dataset_*，2026-08-30 实测）。
    # 而 alerts/storage-alerts.yaml 的 ZpoolScrubOverdue 与记录规则 zpool_scrub_age_days
    # 引用的是 node_zfs_zpool_scrub_last_scrub_timestamp_seconds —— **那个指标从来不
    # 存在**，表达式恒为空集，与「scrub 很及时」外观完全一致，自上线起没有可能响过。
    # ⚠️ 脚本刻意不用 node_zfs_ 前缀（那是 node_exporter 自己的命名空间），
    #    产出 zpool_scrub_last_end_timestamp_seconds / _known / _collector_success。
    - name: Install zpool scrub textfile collector
      ansible.builtin.copy:
        src: ../files/zpool-scrub-textfile
        dest: /usr/local/sbin/zpool-scrub-textfile
        owner: root
        group: root
        mode: "0755"

    - name: Create zpool-scrub-textfile service
      ansible.builtin.copy:
        dest: /etc/systemd/system/zpool-scrub-textfile.service
        mode: "0644"
        content: |
          [Unit]
          Description=Write zpool scrub timestamps as node_exporter textfile metrics
          After=zfs.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/zpool-scrub-textfile

    - name: Create zpool-scrub-textfile timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/zpool-scrub-textfile.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Refresh zpool scrub textfile metrics hourly

          [Timer]
          # scrub 以「天」为尺度变化，每小时绰绰有余；OnBootSec 保证重启后很快有数
          OnBootSec=2min
          OnUnitActiveSec=1h
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable and start zpool-scrub-textfile timer
      ansible.builtin.systemd:
        name: zpool-scrub-textfile.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Run the collector once now (so metrics exist without waiting for the timer)
      ansible.builtin.command:
        cmd: /usr/local/sbin/zpool-scrub-textfile
      changed_when: false

    # ⚠️ 2026-08-30 实测：本机**没有任何 ZFS scrub 排程** —— zfs-scrub-monthly@.timer
    # 与 zfs-scrub-weekly@.timer 均为 disabled；`systemctl list-timers | grep scrub`
    # 列出的 e2scrub_all / xfs_scrub_all 是 ext4/xfs 的，与 ZFS 无关，很容易看错。
    # 上次 scrub 停在 2026-08-09（发现时 21 天前），显然是人工跑的。10.9T 的 mrstorage
    # 同时承载媒体库与 restic 备份仓库，没有定期 scrub = 静默位腐风险。
    # ZpoolScrubOverdue 的 35 天阈值正是按「每月一次」定的，这里把排程补上。
    - name: Enable monthly ZFS scrub timer for each pool
      ansible.builtin.systemd:
        name: "zfs-scrub-monthly@{{ item }}.timer"
        daemon_reload: true
        enabled: true
        state: started
      loop: "{{ zfs_pools }}"

    # ── smartctl_exporter ──────────────────────────────────────────────────────
    # Remove Proxmox Enterprise repo files left from previous OS install
    # (they cause 401 errors on apt update since this host has no subscription)
    - name: Remove Proxmox Enterprise apt sources
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/ceph.list
        - /etc/apt/sources.list.d/pve-enterprise.sources
        - /etc/apt/sources.list.d/ceph.sources

    - name: Ensure smartmontools is installed
      ansible.builtin.apt:
        name: smartmontools
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Download smartctl_exporter archive
      ansible.builtin.get_url:
        url: "https://github.com/prometheus-community/smartctl_exporter/releases/download/v{{ smartctl_exporter_version }}/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/smartctl_exporter.tar.gz
        mode: "0644"

    - name: Extract smartctl_exporter
      ansible.builtin.unarchive:
        src: /tmp/smartctl_exporter.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Install smartctl_exporter binary
      ansible.builtin.copy:
        src: "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64/smartctl_exporter"
        dest: /usr/local/bin/smartctl_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Create smartctl_exporter systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/smartctl_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus smartctl Exporter
          After=network.target

          [Service]
          User=root
          ExecStart=/usr/local/bin/smartctl_exporter \
            --web.listen-address=:{{ smartctl_exporter_port }} \
            --smartctl.path=/usr/sbin/smartctl \
            --smartctl.interval=120s
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start smartctl_exporter
      ansible.builtin.systemd:
        name: smartctl_exporter
        daemon_reload: true
        enabled: true
        state: restarted

    # ── verify ─────────────────────────────────────────────────────────────────
    - name: Wait for node_exporter to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ node_exporter_port }}/metrics"
        return_content: false
      register: ne_check
      until: ne_check.status == 200
      retries: 6
      delay: 5

    - name: Wait for smartctl_exporter to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ smartctl_exporter_port }}/metrics"
        return_content: false
      register: se_check
      until: se_check.status == 200
      retries: 6
      delay: 5

    - name: Fetch node_exporter metrics for RAPL verification
      ansible.builtin.uri:
        url: "http://localhost:{{ node_exporter_port }}/metrics"
        return_content: true
      register: ne_metrics

    - name: Assert the RAPL collector is actually producing data
      ansible.builtin.assert:
        that:
          - "'node_scrape_collector_success{collector=\"rapl\"} 1' in ne_metrics.content"
          - "'node_rapl_package_joules_total' in ne_metrics.content"
        fail_msg: >-
          RAPL collector produced nothing. Check that 99-node-exporter-rapl.rules took effect:
          ls -l /sys/class/powercap/intel-rapl:0/energy_uj should be root:node_exporter with g+r.
        success_msg: "RAPL OK — node_rapl_* series present"

    - name: Report endpoints
      ansible.builtin.debug:
        msg:
          - "node_exporter    → http://192.168.50.106:{{ node_exporter_port }}/metrics"
          - "smartctl_exporter → http://192.168.50.106:{{ smartctl_exporter_port }}/metrics"

  handlers:
    - name: restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        daemon_reload: true
        state: restarted

# Play 2: Proxmox host (pve-1) — node_exporter (with RAPL) + smartctl_exporter
