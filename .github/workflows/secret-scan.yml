# 密钥泄露扫描（gitleaks，默认规则集 + .gitleaks.toml 的占位符放行）。
#
# 为什么需要它：这是公开仓库，此前 CI 只拦公网 IP，token / 私钥 / 口令全靠约定自觉。
# 来由与放行规则的取舍见 .gitleaks.toml 头注。
#
# ⚠️ 这一道是**兜底**，不是防线：它在 push 之后才跑，命中时密钥已经公开，只能轮换。
#    真正拦在前面的是本地 `just check`（pre-push 钩子），需要本机 `brew install gitleaks`。
# ⚠️ 刻意**不设 paths 过滤**（同 no-public-ip.yml）：密钥能落进任何文件类型。
# ⚠️ 扫**完整历史**而不是本次 diff：1000+ 提交实测 ~1s，没有省的必要；也顺带保证
#    「历史里没有」这条断言一直成立，而不是只对新提交成立。
# ⚠️ 必须 `--redact`：公开仓库的 Actions 日志也是公开的，不 redact 等于把命中的密钥
#    再打印一遍。
#
# 不用 gitleaks 官方镜像当容器 action：镜像的 `safe.directory=*` 写在 /root/.gitconfig，
# 而容器 action 会把 HOME 改成 /github/home，git 会因仓库属主不同报 dubious ownership。
# 直接下二进制、以 runner 用户跑，与 static-checks.yml 装 just 的做法一致。
name: secret scan

on:
  workflow_dispatch: {}
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      gitleaks_version: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 gitleaks（对 release 自带的 checksums 校验）
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}"
          tarball="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          cd /tmp
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${gitleaks_version}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: 扫描完整 git 历史
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .
