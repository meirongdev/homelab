# 静态检查：YAML 语法（含重复键）/ 清单安全规则 H1-H5 / 内嵌脚本一致性 E1 /
# justfile 可解析 / terraform fmt + validate / shellcheck（全等级，含引号类 SC2086）。
# 另有独立 job `render`：把 ArgoCD 真正会 apply 的对象渲染出来过 schema（scripts/render-manifests.py）。
# 目的：把踩过的坑（死配方、YAML typo、tf 格式、脚本引号、内嵌 Namespace 被 prune、
# Application 装错集群、PVC 静默不备份、ns 漏 PSA 标签静默吃 privileged、
# ConfigMap 内嵌脚本与源文件漂移）变成 CI 能拦的——
# 与 docs-check.yml 同一哲学：规则没有强制就会腐化。
name: static checks

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/justfile'
      - '**/*.tf'
      - '**/*.sh'
      - 'scripts/check-manifests.py'
      - 'scripts/check-version-pairs.py'
      - 'scripts/check-embedded-scripts.py'
      - 'scripts/render-manifests.py'
      # 内嵌脚本的源文件：改了 .py 但忘了重新生成 ConfigMap，正是 E1 要拦的情况
      - 'k8s/helm/manifests/**/*.py'
      - '.github/workflows/static-checks.yml'
  push:
    branches: [main]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/justfile'
      - '**/*.tf'
      - '**/*.sh'
      - 'scripts/check-manifests.py'
      - 'scripts/check-version-pairs.py'
      - 'scripts/check-embedded-scripts.py'
      - 'scripts/render-manifests.py'
      # 内嵌脚本的源文件：改了 .py 但忘了重新生成 ConfigMap，正是 E1 要拦的情况
      - 'k8s/helm/manifests/**/*.py'
      - '.github/workflows/static-checks.yml'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv（显式声明，不赌 runner 镜像内容）
        uses: astral-sh/setup-uv@v6

      - name: YAML 语法解析（含重复键）
        run: |
          # os.walk 覆盖隐藏目录（.github/ 等）——glob 的 ** 不匹配点开头目录，会漏掉 workflow 自己。
          uv run --with pyyaml python - <<'PY'
          import os, sys, yaml
          # SafeLoader 子类：映射里重复键直接报错（否则 a:1/a:2 会静默丢配置）。
          class UniqueKeyLoader(yaml.SafeLoader):
              def construct_mapping(self, node, deep=False):
                  seen = []
                  for key_node, _ in node.value:
                      key = self.construct_object(key_node, deep=deep)
                      if key in seen:
                          raise yaml.constructor.ConstructorError(
                              "while constructing a mapping", node.start_mark,
                              f"duplicate key {key!r}", key_node.start_mark)
                      seen.append(key)
                  return super().construct_mapping(node, deep)
          bad = 0
          files = []
          for root, dirs, names in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']  # 精确排除，不做子串匹配
              for n in names:
                  if n.endswith(('.yaml', '.yml')):
                      files.append(os.path.join(root, n))
          for p in sorted(files):
              try:
                  with open(p, encoding='utf-8') as f:
                      list(yaml.load_all(f, Loader=UniqueKeyLoader))
              except Exception as e:
                  print(f'{p}: {e}')
                  bad += 1
          if bad:
              sys.exit(f'{bad} 个 YAML 文件解析失败')
          print(f'✅ {len(files)} 个 YAML 文件全部可解析（含重复键检查）')
          PY

      - name: 版本配对断言 V1-V3
        # 把散在多处的同一个版本事实锁住：同名 chart 跨集群同版本、声明为同一事实的
        # 版本变量组一致、cilium↔gateway-api 符合兼容表。
        # 来由：2026-08-11 漏配 Gateway API CRD 静默停摆 30h，2026-08-13 又发现 oracle
        # 剧本仍钉着旧值而注释写着"与 homelab 一致" —— 注释拦不住，CI 可以。
        # 与 Renovate 的分工见 .github/renovate.json5 头注。
        run: uv run --with pyyaml python scripts/check-version-pairs.py

      - name: 清单安全规则 H1-H5
        # 把已经发生过的事故变成能拦的规则：Namespace/CRD 独占文件（2026-08-03 级联删除）、
        # Application path↔destination 同集群、ReferenceGrant v1beta1、PVC 有备份归属、
        # Namespace 显式声明 PSA 等级（zitadel ns 曾静默吃默认 privileged 一个多月）。
        # 规则全文 docs/reference/manifest-safety-checks.md —— 改检查器要同步改文档。
        run: uv run --with pyyaml python scripts/check-manifests.py

      - name: 内嵌脚本一致性 E1
        # ConfigMap 里内嵌的脚本 vs 同目录的源 `.py`，以及 pod 模板上的 checksum 注解。
        # 两者任一漂移都是同一种静默：git 干净、ArgoCD Synced、pod Running，跑的是旧代码。
        # 修复：cd k8s/helm && just gen-embedded-scripts
        run: uv run --with pyyaml python scripts/check-embedded-scripts.py

      - name: justfile 冒烟（just --list）
        run: |
          # 版本与本地开发机一致（just 1.58.0）；升级时两处一起改。
          # 拉官方 tarball 未做 sha256 校验——homelab 单用户场景可接受（记一笔）。
          curl -sSfL https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo mv /tmp/just /usr/local/bin/just
          for f in $(find . -name justfile -not -path './.git/*' | sort); do
            echo "== $f =="
            (cd "$(dirname "$f")" && just --list >/dev/null)
          done

      - name: 安装 terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform
          terraform_version: 1.15.5

      - name: terraform fmt 检查
        # -recursive . 自动覆盖新增模块；CI 干净 checkout 里 tfvars 全被 gitignore，等价于只查已跟踪 .tf。
        run: terraform fmt -check -recursive .

      - name: terraform validate（每个 root）
        # fmt 只管缩进；validate 才查引用了不存在的变量 / 属性名写错 / provider 参数不合法。
        # -backend=false：不碰 state（7 个 root 全是本地 state，CI 里根本没有），只装 provider。
        # 版本按各 root 的 .terraform.lock.hcl 钉死，所以这里下载的就是现网用的那一版。
        # 2026-09-02 加；此前 7 个 root 都没有任何语义校验，写错只在 plan 时才炸。
        run: |
          set -euo pipefail
          for d in $(find . -name '*.tf' -not -path '*/.terraform/*' -not -path './.git/*' -exec dirname {} \; | sort -u); do
            echo "== $d =="
            terraform -chdir="$d" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$d" validate -no-color
          done

      - name: shellcheck
        # 镜像 pin 0.11.0，不用 runner 自带的那个——理由同上面的 uv/just/terraform：
        # 不赌 runner 镜像内容。自带版本随镜像升级漂移，新等级的检查会突然在 main 上炸，
        # 且"实测零命中"的结论也就跟着失效。升级时改这里的 tag 并本地复跑一遍。
        # 默认全等级（含 info 级 SC2086 未加引号），0.11.0 实测全仓 *.sh 零命中。
        # ⚠️ 「零命中」是**带 scripts/verify-oracle-node.sh 里那条文件级 disable** 的结果。
        # 该文件 2026-08-05 加进来时带了 22 条 note 级命中（17 条是它 `cond && ok || bad`
        # 的核心写法），CI 从那天起一直红到 2026-08-10 才被发现——红了没人看，
        # 等于这一步白跑。再有新脚本让它变红，要么修脚本，要么在**那个文件里**写明理由
        # 豁免，别改这里的等级门槛（SC2086 是特意要的）。
        # find/sort 在 runner 侧跑（GNU 版，支持 -print0/-z）；容器里只跑 shellcheck 本身。
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | sort -z \
            | xargs -0 -r docker run --rm -v "$PWD:/repo" -w /repo \
                koalaman/shellcheck-alpine:v0.11.0 shellcheck

  # 渲染检查：与上面 static 并行。static 查的是文件与归属（结构），这里查的是 ArgoCD 真正会
  # apply 的对象（渲染结果）。三类已发生的静默失效只有它能拦：values 写错层级被 chart 静默忽略、
  # 多源 $values 渲染成空操作、kustomize 树漏登记。规则背景见 docs/reference/manifest-safety-checks.md。
  # 需要联网拉 chart（16 个 chart 源），约 2 分钟；helm / kubectl 用 runner 自带，kubeconform 钉版本。
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6

      - name: 安装 kubeconform
        # 钉版本，理由同 just / shellcheck：不赌 runner 镜像。升级时改这里的 tag 并本地复跑一遍。
        run: |
          # renovate: datasource=github-releases depName=yannh/kubeconform
          KUBECONFORM_VERSION=v0.8.0
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
          helm version --short
          kubectl version --client

      - name: 渲染全部 ArgoCD App 并过 schema
        run: uv run --with pyyaml python scripts/render-manifests.py
