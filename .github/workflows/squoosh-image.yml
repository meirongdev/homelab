# 构建 squoosh 的多架构镜像(arm64 + amd64)并推到 ghcr。
# 为什么要自建（上游 2022 停更 + 公网跑 EOL Node 16 + 15 条 Critical）——
# 见 images/squoosh/Dockerfile 的头注。
#
# 首次构建后,把 ghcr 包 meirongdev/squoosh 的可见性设为 Public
# (Packages → squoosh → Package settings → Change visibility),
# 否则 oracle 集群拉取需要 imagePullSecret(其它 meirongdev/* 镜像均为 public)。
#
# ⚠️ 本镜像的价值来自 base 的新鲜度(nginx:1.31-alpine)。base 出 CVE 时重跑
# workflow_dispatch 即可重建 —— 产物层是固定 digest 的上游镜像,内容不会漂。
name: squoosh image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - images/squoosh/**
      - .github/workflows/squoosh-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/squoosh
          platforms: linux/amd64,linux/arm64
          push: true
          # 1.12.0 = 产物来源的上游 squoosh 版本(与 Dockerfile 里 pin 的 digest 一致);
          # sha-* 是不可变 tag,给 manifest 钉用(同 meirongdev/it-tools 的既有做法)。
          tags: |
            ghcr.io/meirongdev/squoosh:latest
            ghcr.io/meirongdev/squoosh:1.12.0
            ghcr.io/meirongdev/squoosh:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
