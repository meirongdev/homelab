apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: homelab 集群的工作负载（控制面在 oracle-k3s，经 Tailscale 纳管）

  # ☠️ 一个 AppProject 只允许一个 destination（CI 规则 H2 强制）。
  # 2026-09-02 之前这里三条 destination 通配、namespace 全是 "*"，两个集群的 App 共用一个
  # project，于是「Application 写错 destination 把 homelab 全套装到 oracle」只有 CI 的 H2
  # 能拦；现在 ArgoCD 服务端自己会拒绝：`application destination server ... is not permitted`。
  # 背景与迁移顺序见 docs/decisions/argocd-project-per-cluster.md。
  destinations:
    # homelab 控制面 API，走 Tailscale（cluster Secret `homelab-cluster` 与 Application 均用此）
    - server: https://100.94.186.7:6443
      namespace: "*"

  # 只列 homelab 侧 Application 实际用到的 chart 源；新加 chart 得先加进这里，
  # 否则 Application 报 `repo ... is not permitted in project 'homelab'`（响亮，不是静默）。
  # 本文件由 `projects` App 托管（argocd/applications/projects.yaml）：改完 git push 即生效，
  # 不再需要手工 kubectl apply（首次装 ArgoCD 时 `just deploy-argocd` 仍会 apply 一次做 bootstrap）。
  sourceRepos:
    - https://github.com/meirongdev/homelab
    - https://kyverno.github.io/kyverno                      # kyverno
    - https://aquasecurity.github.io/helm-charts            # trivy-operator
    - https://helm.cilium.io/                               # tetragon
    - https://prometheus-community.github.io/helm-charts    # kube-prometheus-stack
    - https://kubernetes-sigs.github.io/external-dns/       # external-dns
    - https://open-telemetry.github.io/opentelemetry-helm-charts  # otel-collector
    - https://opencost.github.io/opencost-helm-chart        # opencost
    - https://slok.github.io/sloth                          # sloth
    # multica：全仓库第一个 OCI chart 源。ArgoCD 要求 repoURL **不带 `oci://` 前缀**
    # （官方文档原话 "note: the oci:// syntax is not included."）。公开 registry 无需
    # repository Secret —— 私有的才需要 enableOCI。
    - ghcr.io/multica-ai/charts

  # 允许管理集群级资源（Namespace、ClusterRole、Kyverno ClusterPolicy 等）
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # 孤儿资源监控 —— 找「在集群里、但不在 Git 里」的东西（与 CVE/成本报告互补:
  # 那些找的是「配置有问题」,这个找的是「配置压根没进 Git」)。
  #
  # 判定条件(ArgoCD 三者同时满足才算孤儿):
  #   1. 位于本 project 下某个 Application 的 destination namespace
  #   2. 没有 tracking 标记(本集群 ArgoCD v3.x 用注解 argocd.argoproj.io/tracking-id,
  #      不是 v2 的 app.kubernetes.io/instance label —— 排查时别看错)
  #   3. 没有 ownerReferences(所以 ReplicaSet/Pod/Job-from-CronJob 天然不会被误报)
  # 另有 3 条内置豁免:default SA、kube-root-ca.crt、default ns 的 kubernetes Service。
  #
  # ⚠️ warn: false 是刻意的。ignore 列表只支持 group/kind/name,**没有 namespace 字段**,
  # 而 kube-system / monitoring / external-secrets 三个 ns 里的组件
  # (cilium+k3s / kube-prometheus-stack 采纳前的残留 / ESO operator)都是手动 helm 装的,
  # 天然全部「无人认领」,且无法用 ignore 屏蔽。开 warn: true 会给 gateway/vault-eso 等
  # App 常挂黄色告警条,复刻 trivy 那种告警疲劳。warn: false 下孤儿仍在各 App 的资源树里
  # 可见,只是不产生 warning condition。
  # 若日后想要真告警,正确做法是把上述 ns 的 App 再拆到一个 platform project,而不是加 ignore。
  # 只列 homelab 集群上真实存在的那几类；oracle 的在 oracle-k3s.yaml 里单独列。
  orphanedResources:
    warn: false
    ignore:
      # Endpoints 由 endpoints controller 为每个 Service 自动创建,无 ownerRef、
      # 永远不会进 Git(EndpointSlice 有 ownerRef,已被条件 3 自动排除)。
      - group: ""
        kind: Endpoints
        name: "*"
      # Helm 自己的 release 状态存档,不是工作负载。
      - group: ""
        kind: Secret
        name: "sh.helm.release.v1.*"
      # kyverno 准入 webhook 的自签 TLS,由 cleanup-controller 运行时生成并轮转。
      - group: ""
        kind: Secret
        name: "kyverno-*.kyverno.svc.kyverno-tls-*"
      # trivy-server StatefulSet 的 volumeClaimTemplate 产物:PVC 不带 ownerRef,
      # 但它确实由 STS 管理。注意这里只豁免这一个具名 PVC —— PVC 整类不能豁免,
      # 「意外多出来的 PVC」正是最该被看见的孤儿(参见 calibre PVC 的 Prune=false 保护)。
      - group: ""
        kind: PersistentVolumeClaim
        name: "data-trivy-server-0"
      # 同上,Vault StatefulSet 的两个 volumeClaimTemplate(data / audit)产物。
      # 依旧是**具名**豁免,不豁免 PVC 整类。
      - group: ""
        kind: PersistentVolumeClaim
        name: "data-vault-0"
      - group: ""
        kind: PersistentVolumeClaim
        name: "audit-vault-0"
