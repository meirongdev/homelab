apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  sources:
    # Kyverno chart 版本 —— 部署前先 `helm search repo kyverno/kyverno --versions`
    # 确认该版本存在并按需调整（chart 3.x ↔ app v1.12+）。
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      # 2026-08-30: 3.8.2(app v1.18.2) → 3.9.0(app v1.19.0)。动因是两集群升到
      # k8s v1.35.8 —— Kyverno 官方**唯一 supported release** 是 v1.19，覆盖 k8s
      # v1.33–v1.35；v1.18 在 1.19 发布(2026-08)时即 EOL，其测试范围到不了 1.35。
      # ☠️ 越界的失败形态是**静默的**：resource webhook 是 failurePolicy: Ignore
      # （fail-open，符合 security.md 的设计），所以不兼容时不报错、不告警、
      # pod 全 Running，只是 4 条 ClusterPolicy 悄悄不再拦。验证只能主动打一发
      # 该被拒的请求，见 runbooks/k3s-cluster-upgrade.md §9 ⑥。
      # 已逐键核对本仓库 values 的 30 个路径在 3.9.0 全部存活
      # （serviceMonitor.additionalLabels 是自由 map，不是缺失）。
      # ⚠️ 下次升 k8s minor 前先查 kyverno.io/docs/installation/releases/ 的支持矩阵。
      targetRevision: "3.9.0"
      helm:
        valueFiles:
          - $values/k8s/helm/values/kyverno.yaml
    - repoURL: https://github.com/meirongdev/homelab
      targetRevision: main
      ref: values
  destination:
    server: https://100.94.186.7:6443
    namespace: kyverno
  # chart 的 CRD 无 spec.conversion，但 API server 默认补 conversion:{strategy:None}
  # → 11 个 policies.kyverno.io CRD 永远 OutOfSync（纯服务端默认，sync 改不掉）。忽略该字段。
  # labels/annotations: chart 3.8 的 kyverno-api 子 chart 渲染出空 map `{}`，而 API server
  # 会剥掉空 map → 同样永久 diff。select(length==0) 只在为空时忽略，不影响真实 labels。
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion
        - .metadata.labels | select(length == 0)
        - .metadata.annotations | select(length == 0)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno 的 report CRD 很大，必须用 SSA 避免 client-side apply 的 annotation 超长报错
      - ServerSideApply=true
