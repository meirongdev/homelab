---
# Root Application — App-of-Apps pattern.
# Watches argocd/applications/ and keeps every child Application in sync with Git.
# Bootstrap (run once): kubectl apply -f argocd/applications/root.yaml
# After that, editing any sibling *.yaml is enough — no more manual `kubectl apply`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # 内置 default project：root / projects 两个元 App 只写 argocd ns，若挂 homelab / oracle-k3s
  # 任一 project 会形成「App 管理自己所属 project」的自引用（CI 规则 H2 强制这一点）。
  # ⚠️ root 不自管，本文件改了得手工 `kubectl --context oracle-k3s apply -f` 一次（2026-09-02 已做）。
  project: default

  source:
    repoURL: https://github.com/meirongdev/homelab
    targetRevision: main
    path: argocd/applications
    directory:
      recurse: false
      # Exclude root.yaml so this Application doesn't try to manage itself
      # (managing yourself works but causes pointless reconciliation loops).
      exclude: "root.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
