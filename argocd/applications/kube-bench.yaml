apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-bench
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/meirongdev/homelab
    targetRevision: main
    # 目录即清单：放进该目录的 yaml 自动纳入同步，新增文件无需改本文件。
    path: k8s/helm/manifests/kube-bench
  destination:
    server: https://100.94.186.7:6443
    namespace: kube-bench
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # Namespace 由 manifest 自身渲染
      - ServerSideApply=true
