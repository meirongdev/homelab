apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dashboards
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  # App 名 "monitoring-dashboards" 是历史名，实际管 monitoring/ 整个目录
  # （dashboards + alerts + SLO + KRR + 抓取配置）。不改名：改 Application 名
  # 会触发 ArgoCD 删旧建新（tracking 标签变更），对告警链路有短暂中断，不值得。
  source:
    repoURL: https://github.com/meirongdev/homelab
    targetRevision: main
    # 目录即清单（含子目录）：放进 monitoring/ 的 yaml 自动纳入同步，无需再维护文件清单。
    path: k8s/helm/manifests/monitoring
    directory:
      recurse: true
  destination:
    server: https://100.94.186.7:6443
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
