apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetragon-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  # 与 tetragon 安装分离（同 kyverno-policies 的做法）：策略逐条加/改/删只动 git，
  # 不碰 Helm release；首次同步可能因 TracingPolicy CRD 尚未就绪短暂失败，待 tetragon App
  # 装好 CRD 后自动重试通过。
  # TracingPolicy 是集群级对象，destination.namespace 对它们无意义，仅占位。
  source:
    repoURL: https://github.com/meirongdev/homelab
    targetRevision: main
    # 两集群共用一份策略（security/ 是 H2 登记的共用树）；oracle 侧是 tetragon-policies-oracle。
    path: security/tetragon/policies
  destination:
    server: https://100.94.186.7:6443
    namespace: tetragon
  # TracingPolicy 的 CRD 会回填一批服务端默认值（kprobe 的 return、参数的 maxData / resolve /
  # returnCopy、matchBinaries 的 followChildren），git 清单里没有 → 永久 OutOfSync。
  # 2026-11-20 上线时逐字段对比过 git 与 live：差异**只有**这五个键，git 里写的内容一个字没被改。
  # 纯化妆性，忽略（同 kyverno.yaml 的先例）。
  # ⚠️ 新增策略用到别的可选字段时会再冒出新的默认值，OutOfSync 复现就照此法对比一次再补，
  #    别直接 `ignoreDifferences: *`。也别往清单里写这几个字段：改动不会被 diff 发现。
  ignoreDifferences:
    - group: cilium.io
      kind: TracingPolicy
      jqPathExpressions:
        - .spec.kprobes[]?.return
        - .spec.kprobes[]?.args[]?.maxData
        - .spec.kprobes[]?.args[]?.resolve
        - .spec.kprobes[]?.args[]?.returnCopy
        - .spec.kprobes[]?.selectors[]?.matchBinaries[]?.followChildren
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
