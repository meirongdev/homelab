---
# oracle-k3s 工作负载,由 homelab ArgoCD 经 Tailscale 纳管。
# 起步阶段故意不开 automated（先人工对账 diff，确认无意外删除后再开 prune+selfHeal，见 Task 7）。
# 集群凭据见 ESO oracle-k3s-cluster（Task 3），destination 走 Tailscale（Task 1/4）。
# 见 docs/plans/2026-06-04-oracle-k3s-argocd-gitops.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oracle-k3s
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: oracle-k3s

  source:
    repoURL: https://github.com/meirongdev/homelab
    targetRevision: main
    path: cloud/oracle/manifests # Kustomize 树

  destination:
    # oracle-k3s 自身 —— 2026-08-02 ArgoCD 控制面迁入本集群后，这里是 in-cluster
    server: https://kubernetes.default.svc
    namespace: default # 仅作无 namespace 资源的兜底；manifests 各自声明 ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # ☠️ **从本树往外拆 App 时，必须先把 prune 临时改成 false**（2026-09-08 实测出来的
      # 唯一零停机路径，开放项 #13 就是这么拆的）：
      # ArgoCD **不会**把已被本 App 拥有的对象让给新 App —— 新 App 只会报
      # `SharedResourceWarning` 并**永久 OutOfSync**（实测 10 个对象全部如此，且
      # `generation` 不变，说明两边并没有互相改写，只是新 App 在拒绝接管）。
      # 所以 runbook 原先的「新 App 同步一次就会抢到 tracking」是**错的**，
      # 交接只能发生在「本 App 不再渲染这些对象」的那一刻。
      # 那一刻若 prune 开着 → 对象先被删除、再由新 App 重建（无状态也有分钟级不可用）；
      # 关掉 prune → 对象原地不动，新 App 接管注解，**pod 一个都不重启**（已实测）。
      # 拆完记得改回 true，否则误删护栏永久失效。
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false # namespace 已在 kustomize 树内
      # 有状态 PVC（uptime-kuma-data-v2；karakeep-data/meilisearch-data 已于 2026-08-14
      # 随 karakeep 退役并删除，用户确认无需备份）
      # 2026-08-11: stirling-pdf 退役，其 PVC 已随之删除（接替者 bentopdf 是纯客户端应用，无 PVC）。
      # 带 argocd.argoproj.io/sync-options: Prune=false 护栏，防误删数据。
