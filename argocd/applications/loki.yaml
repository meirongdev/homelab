---
# Loki — 日志聚合（SingleBinary 模式），双集群唯一日志存储
# Chart: grafana/loki
# Values: k8s/helm/values/loki.yaml
# 2026-07-06: 从 Helm 直接管理迁入 ArgoCD（参照 falco.yaml 的 multi-source 模式）
# 2026-08-02: destination 从 homelab 迁 oracle-k3s。动机是 homelab 内存 76%/磁盘 66%
#   见底，而 Loki 是纯「写入-存储」组件，不像 Prometheus 需要贴着抓取目标；
#   附带收益：homelab 整机故障时**故障前的日志还在**（此前日志与被观测对象同归于尽）。
#   两集群 otel-collector 的 exporter 端点随之调整，见 docs/reference/observability-multicluster.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: "7.1.0"
      helm:
        valueFiles:
          - $values/k8s/helm/values/loki.yaml
    - repoURL: https://github.com/meirongdev/homelab
      targetRevision: main
      ref: values

  destination:
    # oracle-k3s 自身 —— 2026-08-02 ArgoCD 控制面迁入本集群后，这里是 in-cluster
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # monitoring ns 由 oracle-k3s kustomize App 拥有（含 PSA privileged 标签），
      # 故此处不重复创建/管理 ns，避免双重所有权（同 falco.yaml）。
      - CreateNamespace=false
      - ServerSideApply=true
