apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: oracle-k3s
  sources:
    # Falco chart 版本 —— 部署前 `helm search repo falcosecurity/falco --versions` 核对。
    # 9.2.2 = Falco 0.45.2（2026-11-24 从 9.1.0/0.44.1 升）：oracle 换 7.0 内核后 0.44.x 不再可用，
    # 上游 falco#3955（7.0 可抢占内核上 auxmap 处理出错 → 解析失败退出）在 libs 0.26.0 / Falco 0.45.0 修复。
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: "9.2.2"
      helm:
        valueFiles:
          - $values/cloud/oracle/values/falco.yaml
    - repoURL: https://github.com/meirongdev/homelab
      targetRevision: main
      ref: values
  destination:
    # oracle-k3s 自身 —— 2026-08-02 ArgoCD 控制面迁入本集群后，这里是 in-cluster
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # falco ns 由 oracle-k3s kustomize App 拥有（含 PSA 标签 + falcosidekick ESO secret），
      # 故此处不重复创建/管理 ns，避免双重所有权。
      - CreateNamespace=false
      - ServerSideApply=true
