apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  # 与 kyverno 安装分离，便于逐条把策略从 Audit 提升到 Deny（改 git 即可）。
  # 首次同步可能因 ValidatingPolicy CRD 尚未就绪而短暂失败，待 kyverno App 装好 CRD 后自动重试通过。
  source:
    repoURL: https://github.com/meirongdev/homelab
    targetRevision: main
    path: k8s/helm/manifests/kyverno-policies
    # 不写 directory.recurse=false: 它是默认值，ArgoCD 会从 live 对象规范化删除，
    # 写上反而让 root App 对本 Application 永久 OutOfSync。
  destination:
    server: https://100.94.186.7:6443
    namespace: kyverno
  # 2026-11-19 策略迁到 policies.kyverno.io ValidatingPolicy 后，旧的 ClusterPolicy
  # ignoreDifferences 已删：新类型不回填默认字段，并跑期间实测直接 Synced。
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
