apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bifrost
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/meirongdev/homelab
    targetRevision: main
    # 目录即清单：放进该目录的 yaml 自动纳入同步，新增文件无需改本文件。
    path: k8s/helm/manifests/bifrost

  destination:
    server: https://100.94.186.7:6443
    namespace: bifrost

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
