apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jobs-sg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/meirongdev/homelab
    targetRevision: main
    # kustomize 目录（不是 directory 源）：需要 images 转换器按 digest 固定镜像。
    path: k8s/helm/manifests/jobs-sg

  destination:
    # ☠️ 必须写显式 homelab API server。控制面 2026-08-02 迁到 oracle-k3s 后，
    # `kubernetes.default.svc` 在 Application 里指的是 **oracle**；上游 jobs-sg
    # docs/04 §1.3 的骨架就是那么写的（勘查早于迁移），照抄会把这套负载装到 oracle
    # 上 —— 那里是 arm64、没有 Prometheus/Vault、也没有本机数据。
    # CI 的 H2 规则（scripts/check-manifests.py）会拦这类 path↔destination 错配。
    server: https://100.94.186.7:6443
    namespace: jobs-sg

  # CronJob 生出来的 Job 被 job-controller 注入 suspend/selector/template labels，
  # git 清单里没有这些字段 → 完成的 Job 永久 OutOfSync。同 calibre-metadata。
  ignoreDifferences:
    - group: batch
      kind: Job
      jqPathExpressions:
        - .spec.suspend
        - .spec.selector
        - .spec.template.metadata.labels

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
