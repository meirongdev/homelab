---
# Tempo — 分布式追踪后端（SingleBinary + filesystem 存储），双集群唯一追踪存储
# Chart: grafana/tempo
# Values: k8s/helm/values/tempo.yaml
# 2026-07-06: 从 Helm 直接管理迁入 ArgoCD（参照 falco.yaml 的 multi-source 模式）
# 2026-08-02: destination 从 homelab 迁 oracle-k3s（与 loki 同批，理由见 loki.yaml 头注）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: "1.24.4"
      helm:
        valueFiles:
          - $values/k8s/helm/values/tempo.yaml
    - repoURL: https://github.com/meirongdev/homelab
      targetRevision: main
      ref: values

  destination:
    # oracle-k3s 外部集群（Tailscale 端点；与 oracle-k3s App 同）
    server: https://100.107.166.37:6443
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # monitoring ns 由 oracle-k3s kustomize App 拥有（同 falco.yaml / loki.yaml）
      - CreateNamespace=false
      - ServerSideApply=true
