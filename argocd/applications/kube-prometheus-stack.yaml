---
# kube-prometheus-stack — Prometheus + Grafana + Alertmanager + operator + exporters
# Chart: prometheus-community/kube-prometheus-stack
# Values: k8s/helm/values/kube-prometheus-stack.yaml
#
# 2026-07-31: 从 manual-helm（just deploy-prometheus）采纳进 ArgoCD。
# 采纳前逐对象验证（见 docs/decisions/manual-helm-to-argocd-adoption.md）：
#   live 98 对象 vs 渲染 105 对象 → **0 裁剪**、7 个新增全是 Helm hook（跑完即删）、
#   1 个差异是 Grafana PVC 的 live-only 字段 volumeName（ArgoCD 的 diff 不认它作变更）。
#
# ⚠️ Application 名必须保持 `kube-prometheus-stack`（= 现存 Helm release 名）。
# ArgoCD 拿 App 名当 release 名，而 release 名会进 Deployment/StatefulSet 的
# spec.selector（app.kubernetes.io/instance）——不可变字段，改名 = 同步失败。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  sources:
    # chart 版本必须 pin：不 pin 时会随 chart repo 更新意外整栈升级
    # （2026-07-04 曾因此从 86.3.2 意外升到 87.6.0，operator 滚动了 prometheus/alertmanager）。
    # 与 k8s/helm/justfile 的 kube_prometheus_stack_version 保持一致。
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "87.6.0"
      helm:
        valueFiles:
          - $values/k8s/helm/values/kube-prometheus-stack.yaml
        # ✅ **2026-09-08：`skipCrds` 已移除，CRD 交给 ArgoCD 接管**
        # （原 ROADMAP 开放项 #4 收口；采纳时刻意 skip 的理由见
        #  docs/decisions/manual-helm-to-argocd-adoption.md 决策二）。
        #
        # 背景：`helm upgrade` **从不**升级 chart 的 `crds/` 目录，所以 10 个
        # monitoring.coreos.com CRD 一直停在 operator v0.89.0，而运行的 operator
        # 是 v0.92.1。交给 ArgoCD 后 CRD 随 chart 版本自动跟进，这个漂移不会再攒。
        #
        # 动手前做的决定性安全检查（别跳过，换 chart 大版本时要重做一遍）：
        # **chart 里每个 CRD 的 `versions` 必须仍包含 live 的 `status.storedVersions`。**
        # 10 个 CRD 逐个核对过：v1 对 v1、v1alpha1 对 v1alpha1，无一被移除 ——
        # 所以升级不会孤立任何既有 CR。若哪天核对不过，那就**不是**改个开关的事，
        # 得走 CR 迁移，停下来单独规划。
        # 核对方法：把 chart pull 下来比对 `spec.versions[].name` 与
        # `kubectl get crd -o json` 的 `status.storedVersions`。
        # ⚠️ PyYAML 解析这些 CRD 会在 `=` 键上抛 ConstructorError（YAML 的 value 标签
        #    特例），要先 `add_constructor('tag:yaml.org,2002:value', ...)`。
        #
        # ⚠️ `ServerSideApply=true`（见下方 syncOptions）是前提：单个 CRD 近 1MB，
        #    客户端 apply 会撞 `last-applied-configuration` 注解的大小上限。
        #
        # ☠️ **接管的代价**：CRD 进了本 App 的清单集，而本 App `prune: true`。
        #    哪天 chart 移除某个 CRD，ArgoCD 就会 prune 它 → **级联删光该类型的全部 CR**
        #    （当前 72 个：26 ServiceMonitor + 41 PrometheusRule + Prometheus/Alertmanager
        #    /PodMonitor/2 AlertmanagerConfig）。chart 大版本升级时先 diff 一眼 crds/ 的文件数。
    - repoURL: https://github.com/meirongdev/homelab
      targetRevision: main
      ref: values

  destination:
    server: https://100.94.186.7:6443
    namespace: monitoring

  # admission webhook 的 caBundle 由 chart 的 admission-patch Job 在运行时注入自签证书，
  # git/chart 侧渲染为空 —— 不豁免的话 selfHeal 每次同步都可能把证书抹掉再等 Job 补回，
  # 白白抖动 webhook（failurePolicy 是 Ignore，不会挡准入，但没必要让它抖）。
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: kube-prometheus-stack-admission
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: kube-prometheus-stack-admission
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # 必须 SSA：本 chart 的对象多且大，client-side apply 会撞 annotation 长度上限。
      - ServerSideApply=true
