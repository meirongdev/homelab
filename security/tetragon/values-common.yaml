# Tetragon —— 两集群共用的 values（eBPF 运行时可见性/检测）
# Chart: cilium/tetragon  (仓库 https://helm.cilium.io/)
#
# 2026-11-24 起两集群统一用 Tetragon（oracle 此前是 Falco）。两个 Helm App 都先引用本文件、
# 再叠加各自集群的 values：
#   homelab → argocd/applications/tetragon.yaml        + k8s/helm/values/tetragon.yaml
#   oracle  → argocd/applications/tetragon-oracle.yaml + cloud/oracle/values/tetragon.yaml
# 本文件只放「两边必须一样」的东西（导出过滤、argv 脱敏、优先级、导出器/operator 资源）。
# 资源配额、ServiceMonitor 这类与集群有关的放各自文件。H2 把 security/tetragon/ 登记为两集群共用树
# （scripts/check-manifests.py 的 SHARED_TREES），所以两边的 App 引用它不算跨集群。
# chart 版本由 check-version-pairs.py 的 V1 保证两个 App 一致。
#
# 为何选 Tetragon：Cilium 原生（两集群的 CNI 本来就是 Cilium，版本节奏和内核兼容性跟着同一个
# 升级闸门走），**内核态(eBPF)过滤**只把命中事件上报用户态，远比 Falco 用户态逐 syscall 处理省 CPU。
# 取舍见 docs/reference/tetragon-runtime-detection.md。
#
# 范围：默认进程可见性（process exec/exit 由 export-stdout 容器打到 stdout → 各集群 OTel → oracle 上的
# Loki）+ Prometheus 指标 + 两条观察版 TracingPolicy（security/tetragon/policies/，独立 App）。
# 命中走 Loki ruler 告警、健康走 Prometheus。⚠️ 下面的 exportDenyList 会把 kube-system / cilium / 宿主 /
# apps-pg 的 pg_isready 探针事件挡在 Loki 之外：策略命中在这些范围内**看不到、也不会告警**。

# ⚠️ 2026-08-10 修：**顶层 `resources:` 是死配置** —— chart 1.7.0 根本没有这个键
# （`helm show values` 逐键确认：顶层无 `resources`，agent 的是 `tetragon.resources`，
# stdout 导出器的是 `export.resources`——注意**不是** `export.stdout.resources`）。
# 写错层级 Helm 静默忽略、不报错，于是 tetragon DaemonSet 一直是 **BestEffort**。
# 同类坑：kube-prometheus-stack.yaml 的 kubeStateMetrics/nodeExporter（2026-08-10 同日修）、
# kyverno.yaml 的 reportsController。发现途径与验证方法见
# docs/runbooks/krr-report-triage.md § 3。

# PriorityClass 分档补齐（2026-08-10）：tetragon agent 归 `bulk`(-10)。
# 依据是 k8s-qos-resource-management.md 对 trivy-operator 归 bulk 的同一条理由 ——
# CLAUDE.md 硬约束是「所有安全组件 fail-open + 控 CPU」，**被驱逐正是 fail-open**：
# tetragon 掉线只丢一段运行时可见性，不影响任何运行中的工作负载。
#
# ⚠️⚠️ **本 chart 的 priorityClassName 与 resources 层级正好相反**（1.7.0 逐键实证）：
#   resources          → 顶层**无效**，必须写 `tetragon.resources`（在各集群文件里）
#   priorityClassName  → 顶层**有效**，`tetragon.priorityClassName` 不存在
# 两者方向相反，是最容易搞错的地方。改动前务必 `helm template` 验一次。
priorityClassName: bulk

# 进程事件已默认开启；保持精简，先不开 enableProcessCred/enableProcessNs（额外开销）。
tetragon:
  # --- 导出降噪（2026-09-24）---
  # 实测 10 分钟 660 条事件（~2.6KB/条，k8s-node 容器日志总量的 91%）**100% 是噪声**，
  # otel-collector 每节点 ~55m CPU 基本都花在把它们搬进 Loki：
  #   ① runc 的 `init` 自我重执行（binary=/proc/self/fd/N，每次 exec 探针/容器启动一对）
  #      —— 任何 health_check 过滤都盖不到，因为它不是探针命令本身；
  #   ② 探针漏网：chart 默认的 {"health_check":true} 只认**绝对路径**的探针命令
  #      （v1.7.0 pkg/filters/health_check.go MaybeExecProbe：args 带 argv0，相对路径时
  #      不剥离 → 长度对不上 → 恒 false）。node-mem-profile 的探针已改绝对路径根治；
  #      apps-pg 的 `pg_isready` 为不重启共享库改在这里拦；
  #   ③ postgres 每条连接 fork 一个 backend，退出时报 PROCESS_EXIT（不 exec，只有 exit）。
  # ☠️ ① 必须三条件同时收窄（AND）：`/proc/self/fd/N` 本身就是 memfd 无文件执行的特征，
  #    单按 binary 拦会把真攻击一起静音。父进程是 runc 且 args 恰为 `init` 才算。
  #    Loki 的 TetragonSuspiciousExec 正是靠「过滤后仍出现 /proc/self/fd/N」来报无文件执行。
  # 下面前两行是 chart 默认值原样照抄（列表覆盖=整体替换，漏抄就丢默认过滤）。
  exportDenyList: |-
    {"health_check":true}
    {"namespace":["", "cilium", "kube-system"]}
    {"binary_regex":["^/proc/self/fd/[0-9]+$"],"parent_binary_regex":["/runc$"],"arguments_regex":["^init$"]}
    {"namespace":["databases"],"binary_regex":["^/usr/bin/pg_isready$"],"arguments_regex":["^/usr/bin/pg_isready -U postgres$"]}
    {"namespace":["databases"],"event_set":["PROCESS_EXIT"],"binary_regex":["^/usr/lib/postgresql/[0-9]+/bin/postgres$"],"parent_binary_regex":["^/usr/lib/postgresql/[0-9]+/bin/postgres$"]}
  # --- argv 脱敏（2026-10-24，10-27 补两条）---
  # 进程事件带完整命令行，经 export-stdout → Loki 落盘，任何能查 Loki 的人都看得到。
  # 当日在 Loki 里查到两处明文：krr 的 Telegram bot token（URL 里）与夜备的
  # SurrealDB 口令（`curl -u root:<口令>`），已在源头改成 curl --variable。
  # 这里是兜底：捕获组被替换为 *****。依次是 Telegram bot token · curl -u/--user 的口令 ·
  # Bearer token · URL 里的 user:pass@ · `-token`/`--token` 参数值 · `…Token:` 请求头的值。
  # RE2 语法，已用 Go regexp 对样例验过。
  # ☠️ 别以为进程只在启动时被记一次：Tetragon 自己重启时会给所有存量进程补发 exec 事件
  # （flags=procFS），进程退出时的 exit 事件也带完整 argv。
  # 10-27 补的两条，来由：
  #   ⑤ `--token`：cloudflared 带着 `--token <隧道 token>` 跑了 58 天，10-24 本文件改动触发的
  #      重启补发了一份，10-27 升级换 pod 时的 exit 事件又写了一份。源头已改成 env
  #      TUNNEL_TOKEN。`--token-file <路径>` 不匹配，路径不算密钥。
  #   ⑥ `token:`：为 ⑤ 查 Loki 时顺带查到，夜备每晚 `curl -H "X-Vault-Token: …"`，把那把
  #      period 720h、每晚自续期的备份 token 写了进来（7 天 28 行）。所有 `…Token:` 请求头
  #      一起盖住，误伤的只会是 `seed-token: kept` 这类提示文字。
  # ⚠️ 只是兜底：带空格且加引号的口令只能打掉一半，密钥别放进 argv 才是正解。
  # ⚠️ 2026-11-24 起 oracle 的 argv 也进 Loki（此前 oracle 只有 Falco，argv 只在 /proc 可见）。
  redactionFilters: |-
    {"redact": ["bot[0-9]{6,}:([A-Za-z0-9_-]{20,})"]}
    {"redact": ["(?:^|\\s)(?:-u|--user)(?:\\s+|=)\"?[^:\\s\"]*:([^\\s\"]+)"]}
    {"redact": ["(?i)authorization:\\s*bearer\\s+([^\\s\"]+)"]}
    {"redact": ["://[^:/\\s@]+:([^@/\\s]+)@"]}
    {"redact": ["(?:^|\\s)\"?--?token(?:\\s+|=)\"?([^\\s\"]+)"]}
    {"redact": ["(?i)token:\\s*([^\\s\"]+)"]}
  # Prometheus 指标（:2112）。怎么被抓走各集群不同（homelab 用 ServiceMonitor，oracle 由 OTel 抓），
  # 见各集群文件。
  prometheus:
    enabled: true

# --- stdout 导出器资源（实测 7d 峰值仅 2Mi，纯转发）---
# ⚠️ 键是 `export.resources`，**不是** `export.stdout.resources`（后者写了不生效）。
export:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# --- operator 资源（本段键名一直是对的，operator 也确实是 Burstable）---
tetragonOperator:
  # 同 agent 归 bulk：它只做 CRD/TracingPolicy 的 reconcile，掉了不影响已加载的策略。
  priorityClassName: bulk
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
