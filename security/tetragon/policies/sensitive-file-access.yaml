---
# 容器里打开凭据类文件（观察版：只上报，不拦截）。
#
# 钩子选 security_file_open 而不是 security_file_permission：后者每次 read/write 都触发，
# 前者只在 open 时触发，调用量低一到两个数量级。热节点（5600H 笔记本）上这是取舍，不是随手选。
# 路径用 Equal / Prefix 做**内核态**匹配，不命中的 open 不会上报到用户态。
#
# 命中的都是「正常业务进程几乎不会碰」的路径：
#   · /etc/shadow /etc/gshadow /etc/sudoers(.d) —— 只有 su / sudo / login / sshd 这类程序读
#   · /root/.ssh/ /root/.kube/ /root/.aws/ /root/.docker/ —— root 家目录下的凭据
# 刻意没有加 ServiceAccount token（/var/run/secrets/kubernetes.io/...）：每个调 K8s API
# 的 pod 都会读，不加白名单就是满屏误报，而「谁该读」恰恰是 Tetragon 看不出来的事。
#
# 作用范围：只看容器里的进程（matchNamespaces Pid NotIn host_ns）。宿主上 systemd 拉起带
# `User=` 的单元时会读 /etc/shadow 与 pam —— oracle 的 Falco 就因此刷过 500 条/天误报
# （docs/reference/tetragon-runtime-detection.md），宿主进程在这里不该出现。
#
# ☠️ 已知噪声：apps-pg 的就绪探针 `pg_isready -U postgres` 每次都会打开 /etc/shadow
# （2026-11-20 上线后第一次观察就抓到：100 秒 20 条，永远不会停）。
#   · **Loki 里没有它**：values/tetragon.yaml 的 exportDenyList 已按「namespace + 二进制 + 参数」
#     丢掉这个探针的事件，所以基于日志的告警天然没有这个噪声。
#   · **Prometheus 指标里有它**：策略命中数与 `tetragon_events_total{type="PROCESS_KPROBE",
#     binary="/usr/bin/pg_isready"}` 照常计数。要基于指标告警，必须在表达式里按 `binary` 排除。
# ☠️ **别想在策略里用 matchBinaries NotIn 把它排掉 —— 实测（Tetragon 1.7.0、内核 6.8/7.0）
#    不生效**：对照实验用一条临时策略 `matchBinaries NotIn ["/usr/local/bin/python3"]`，python3
#    读 /etc/hostname 的事件照样上报。上线时我就是这样写的、注释还写着「已排除」，实际一直在报，
#    直到用对照实验才发现。要排除就在告警表达式或 exportDenyList 里做，并且做完要拿真事件验证。
# ☠️ 同一次 open 会在日志里出现**两条**事件（原因未查）：告警按「有没有」判断，别按次数。
# ⚠️ 只观察、不拦截，理由同 container-escape-syscalls.yaml。
# ⚠️ 路径是**容器内视角**（进程自己的 mount namespace），不是宿主路径。
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-file-access
spec:
  kprobes:
    - call: "security_file_open"
      syscall: false
      message: "容器内打开凭据类文件"
      tags: ["runtime.credential-access"]
      ignore:
        callNotFound: true
      args:
        - index: 0
          type: "file"
      selectors:
        # 多个 selector 之间是 OR；同一个 selector 里的 matchNamespaces 与 matchArgs 是 AND。
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values: ["host_ns"]
          matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/etc/shadow"
                - "/etc/gshadow"
                - "/etc/sudoers"
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values: ["host_ns"]
          matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/sudoers.d/"
                - "/root/.ssh/"
                - "/root/.kube/"
                - "/root/.aws/"
                - "/root/.docker/"
