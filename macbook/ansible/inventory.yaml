# Apple Silicon Macs. The remote ones are reached over Tailscale: SSH key comes from ansible.cfg
# (~/.ssh/vgio); login user defaults to matthew there, a host that differs sets ansible_user here.
#
# Host vars live ONLY under `macs` / `workstation`; the role groups below just name the hosts.
# Playbooks target a role group, so a Mac gets exactly the roles it is listed in:
#   macs    → ping / node-exporter / power / os-update                  (remote headless fleet)
#   macbook → ai-clis (claude/qwen/codex) / multica-daemon               (M2 only)
#   omlx    → omlx / omlx-metrics                                        (OMLX inference nodes)
#   macmon  → macmon (power / temperature / fans, :9090)                 (both remote Macs)
#   base    → packages: Homebrew + base CLI + AWS/GCP CLI + oh-my-zsh/plugins + TPM;
#             ai-clis: Antigravity CLI                                   (every Mac)
#   dev     → mise: language runtimes
#   ops     → packages: k8s / IaC CLIs
#   herdr   → herdr server LaunchAgent + agent integrations               (Studio + M2: run M5's tasks)
#   qwen    → ai-clis: Qwen Code, pinned version                          (Studio + M2)
#   multica_restricted → multica-daemon-restricted (dedicated user `multica`) (Studio)
# Prometheus side: one node-exporter job per Mac in `macs` + both OMLX Macs as targets of the
# omlx-* jobs, + the macmon job (k8s/helm/values/kube-prometheus-stack.yaml).
macs:
  hosts:
    mbp-m2-pro:
      ansible_host: 100.89.15.120   # Tailscale IP (stable per-node); job node-exporter-macbook
    mac-studio:
      ansible_host: 100.98.220.75   # Tailscale IP; job node-exporter-mac-studio
      ansible_user: matstudio       # NOT matthew — macOS short name on this machine
      # Desktop, no battery: a power cut leaves it off until someone presses the button.
      pmset_autorestart: true

# The MacBook Pro M5 this repo is run from. Deliberately NOT in `macs`: that group gets
# power (disablesleep) / os-update (unattended reboot) / node-exporter, none of which belong
# on the machine you work on. Only the dev-env groups (base / dev / ops) include it.
workstation:
  hosts:
    m5:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

macbook:
  hosts:
    mbp-m2-pro:

omlx:
  hosts:
    mbp-m2-pro:
    mac-studio:

# A new Mac here also needs a target in the `macmon` scrape job, and a stress test to see
# which of its readings are broken (the M2's CPU temperature is — see macmon.yaml).
macmon:
  hosts:
    mbp-m2-pro:
    mac-studio:

base:
  hosts:
    m5:
    mbp-m2-pro:
    mac-studio:

dev:
  hosts:
    m5:
    mbp-m2-pro:
    mac-studio:                     # 2026-10-22: herdr runs M5's tasks here, needs the same toolchain

ops:
  hosts:
    m5:
    mbp-m2-pro:
    mac-studio:

# Machines M5 hands work to through herdr (`herdr --machine studio …`). Credentials come from
# chezmoi with role=agent (dotfiles README), not from here.
herdr:
  hosts:
    mac-studio:
    mbp-m2-pro:                     # also runs multica + OMLX; herdr's hooks no-op outside herdr panes

qwen:
  hosts:
    mbp-m2-pro:
    mac-studio:

# Multica executor running as a dedicated, credential-poor macOS user (read-only kubeconfig,
# no git/ssh/Vault). Not the `macbook` group: that one runs as the login user with everything.
multica_restricted:
  hosts:
    mac-studio:
