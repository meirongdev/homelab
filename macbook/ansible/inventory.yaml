# Apple Silicon Macs reached over Tailscale. SSH key comes from ansible.cfg (~/.ssh/vgio);
# login user defaults to matthew there, a host that differs sets ansible_user here.
#
# Host vars live ONLY under `macs`; the role groups below just name the hosts.
# Playbooks target a role group, so a new Mac gets exactly the roles it is listed in:
#   macs    → ping / packages / node-exporter / power / os-update   (every Mac)
#   macbook → ai-clis / multica-daemon                               (M2 only)
#   omlx    → omlx / omlx-metrics                                     (OMLX inference nodes)
#   macmon  → macmon (power / temperature / fans, :9090)              (both Macs)
# Prometheus side: one node-exporter job per Mac + both Macs as targets of the omlx-* jobs,
# + the macmon job (k8s/helm/values/kube-prometheus-stack.yaml).
macs:
  hosts:
    mbp-m2-pro:
      ansible_host: 100.89.15.120   # Tailscale IP (stable per-node); job node-exporter-macbook
    mac-studio:
      ansible_host: 100.98.220.75   # Tailscale IP; job node-exporter-mac-studio
      ansible_user: matstudio       # NOT matthew — macOS short name on this machine
      # Desktop, no battery: a power cut leaves it off until someone presses the button.
      pmset_autorestart: true

macbook:
  hosts:
    mbp-m2-pro:

omlx:
  hosts:
    mbp-m2-pro:
    mac-studio:

# A new Mac here also needs a target in the `macmon` scrape job, and a stress test to see
# which of its readings are broken (the M2's CPU temperature is — see macmon.yaml).
macmon:
  hosts:
    mbp-m2-pro:
    mac-studio:
