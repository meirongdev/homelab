---
# Multica daemon（`multica computer`）—— 真正执行 AI 编码任务的那一半。
#
# 架构：service 端（web/API/Postgres）跑在 homelab k3s 上
#   （k8s/helm/values/multica.yaml + argocd/applications/multica.yaml），
#   daemon 跑在这里（组 `multica`：M2 + Studio，各以登录用户身份）。daemon 对 service
#   **只做 outbound 连接**，不需要入站放行，所以它在 NAT/Tailscale 后面完全没问题。
#   它只在 127.0.0.1 上开一个本地健康检查/API 端口，给任务里的 `multica` CLI 用。
#   —— 这也是它不该进 k3s 的原因：它要的是一台装好并登录了 AI CLI 的真实机器。
#
# ☠️ 一台机器跑两份 daemon 必须用不同的 CLI profile：本地端口由 profile 名决定
#   （默认 profile 固定 19514，命名 profile = 19514 + 1 + 名字字节和 % 1000，
#   源码 cmd_daemon.go 的 healthPortForProfile），没有单独改端口的参数。Studio 上
#   专用用户 multica 的受限 daemon 已占着 19514，所以这里给 Studio 用 profile `full`
#   （19950），见 inventory 的 multica_profile。M2 只有一份，用默认 profile。
#
# ⚠️ 安全边界（上游文档原话："Tasks run with the full permissions of the user
#   running the daemon — they can read and write everything that user can."）：
#   本 playbook 跑在登录用户（M2 的 matthew、Studio 的 matstudio）下，这是**明确接受**
#   的取舍（M2 2026-08-18、Studio 2026-10-27 决定），不是疏忽。代价是被派发的任务能读写
#   该用户能读写的一切，包括 ~/.ssh、各 AI CLI 的凭据、以及本仓库。所以接 Telegram /
#   告警这类不可信输入的 agent 绑在 Studio 的受限 daemon 上
#   （multica-daemon-restricted.yaml），不绑在这里注册的 runtime 上。
#
# 前置：AI CLI 已装好并登录（daemon 靠探测 PATH 发现它们）。M2 的 claude/qwen/codex 来自
#   ai-clis.yaml；Studio 的 claude 是 matstudio 自己的原生安装（~/.local/bin，钥匙串登录，
#   LaunchAgent 在 GUI 域里读得到），qwen 来自 ai-clis.yaml 的 qwen 组，没有 codex。
# hermes 2026-10-11 起不再安装（三台都已卸载），下面 08-18 的实测记录里那一行仅作历史。
#
# 实测哪些 agent 真能注册（2026-08-18，`multica daemon status --output json` +
# 服务端 agent_runtime 表双向核对）：
#   ✅ claude 0s · qwen 0s · hermes 11s（慢但过）—— 三个 runtime status=online
#   ❌ codex  ：`codex --version` **永久挂住**（20s 看门狗打死也无输出），于是被
#              daemon 的版本探测超时 kill，报 "version detection failed: signal: killed"。
#              这是 codex 自身在这台机器上的问题，不是 multica 的 —— 别去调 multica。
#   ❌ cursor ：CLI 在但 `No Cursor IDE installation found`，装了 IDE 才有意义。
#   ❌ copilot：`--version` 返回空，版本解析不出来。
# ⚠️ 冷启动第一轮 status 里可能多出几个 skipped_agents（qwen/hermes 都出现过），
#    但下一轮心跳就正常了 —— 判据看**服务端 agent_runtime 表**，别只看首轮 status。
#
# 认证：**全自动，走 PAT**。`just multica-daemon` 会从 Vault
#   (secret/homelab/multica → daemon_pat) 现取 PAT 并以 `-e md_pat=...` 传进来，
#   未登录时自动 `multica login --token`。没传 md_pat 且未登录时，本 playbook
#   **刻意不 bootstrap LaunchAgent** —— 否则 KeepAlive 会把一个必然失败的进程
#   反复拉起（实测 last exit code = 1，日志刷 "not authenticated"），
#   而 UI 上什么都不会出现。
#   PAT 在 web UI 里生成（`mul_...`）；轮换后记得 `vault kv patch`。
#
# 幂等：重复跑安全（已认证时不会重复 login）。
- name: Multica daemon (LaunchAgent)
  hosts: multica
  gather_facts: true            # 需要 ansible_facts.user_dir
  # md_version / md_sha256（及为什么钉死、怎么升级）在这里，Studio 的受限 daemon 共用。
  vars_files:
    - ../vars/multica.yaml
  vars:
    homebrew_prefix: /opt/homebrew
    md_tarball: "/tmp/multica-cli-{{ md_version }}-darwin-arm64.tar.gz"
    md_stage: "/tmp/multica-cli-{{ md_version }}"
    md_label: ai.multica.daemon
    md_bin: "{{ ansible_facts.user_dir }}/.local/bin/multica"
    md_plist: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/{{ md_label }}.plist"
    # service 端入口。frontend 自带 runtime proxy 转发 /api /auth /ws，
    # 所以 server_url 与 app_url 是**同一个源**，不需要单独的 api.* 子域。
    md_server_url: https://multica.meirong.dev
    md_app_url: https://multica.meirong.dev
    # 主机差异只有这两项，在 inventory 的 macs 主机变量里（没设就用默认）：
    #   multica_device_name  默认 inventory 主机名（M2 = mbp-m2-pro，与 2026-08-18 起的一致）
    #   multica_profile      默认空 = 默认 profile；Studio 是 `full`（见文件头 ☠️）
    md_device_name: "{{ multica_device_name | default(inventory_hostname) }}"
    md_profile: "{{ multica_profile | default('') }}"
    # 所有要落到某个 profile 上的 CLI 调用（config/auth/login/daemon status）都用它。
    md_cli: "{{ md_bin }}{{ (' --profile ' ~ md_profile) if md_profile else '' }}"
    md_max_concurrent: "4"
    md_workspaces_root: "{{ ansible_facts.user_dir }}/multica_workspaces"

  tasks:
    - name: Ensure directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ansible_facts.user_dir }}/.local/bin"
        - "{{ ansible_facts.user_dir }}/.local/var/log"
        - "{{ ansible_facts.user_dir }}/Library/LaunchAgents"
        - "{{ md_workspaces_root }}"

    - name: Check installed multica CLI version
      ansible.builtin.command: "{{ md_bin }} version"
      register: md_ver
      changed_when: false
      failed_when: false

    - name: Install multica CLI binary (when missing or version mismatch)
      when: md_version not in (md_ver.stdout | default(''))
      notify: reload multica daemon
      block:
        - name: Download tarball (sha256-verified)
          ansible.builtin.get_url:
            url: "https://github.com/multica-ai/multica/releases/download/v{{ md_version }}/multica-cli-{{ md_version }}-darwin-arm64.tar.gz"
            dest: "{{ md_tarball }}"
            checksum: "sha256:{{ md_sha256 }}"
            mode: "0644"

        - name: Create a staging dir for extraction
          # 归档是扁平结构（multica / LICENSE / NOTICE / README*），没有顶层目录 ——
          # 直接解到 /tmp 会把这几个文件摊在那儿。
          ansible.builtin.file:
            path: "{{ md_stage }}"
            state: directory
            mode: "0755"

        - name: Extract the binary
          # ⚠️ 刻意**不用** ansible.builtin.unarchive：它在 macOS 上判定
          #    /usr/bin/tar 是 bsdtar 后直接报 "GNU tar required" 而拒绝处理
          #    （去掉 include: 也一样）。bsdtar 本身解这个 .tar.gz 毫无问题，
          #    所以直接调命令。幂等性由外层 block 的版本比对保证。
          ansible.builtin.command:
            cmd: "/usr/bin/tar -xzf {{ md_tarball }} -C {{ md_stage }} multica"
          changed_when: true

        - name: Install binary
          ansible.builtin.copy:
            src: "{{ md_stage }}/multica"
            dest: "{{ md_bin }}"
            mode: "0755"
            remote_src: true

        - name: Strip Gatekeeper quarantine xattr (Apple Silicon)
          ansible.builtin.command: "xattr -dr com.apple.quarantine {{ md_bin }}"
          changed_when: false
          failed_when: false

        - name: Clean up tarball + extracted binary
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ md_tarball }}"
            - "{{ md_stage }}"

    # `multica config set` 写的是 ~/.multica/config.json。先读回来比对，
    # 避免每次跑都报 changed（也避免在已登录实例上无谓地改配置）。
    - name: Read current CLI config
      ansible.builtin.command: "{{ md_cli }} config show"
      register: md_config
      changed_when: false
      failed_when: false
      environment:
        PATH: "{{ homebrew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"

    - name: Point the CLI at the self-hosted service
      ansible.builtin.command: "{{ md_cli }} config set {{ item.key }} {{ item.value }}"
      loop:
        - { key: server_url, value: "{{ md_server_url }}" }
        - { key: app_url, value: "{{ md_app_url }}" }
      when: item.value not in (md_config.stdout | default(''))
      changed_when: true
      notify: reload multica daemon
      environment:
        PATH: "{{ homebrew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"

    # ☠️ `multica auth status` **恒返回 rc=0**，未登录时只是往 stderr 打一行
    #    "Not authenticated. Run 'multica login' to authenticate."（0.4.28 实测）。
    #    按 rc 判断会误认为已登录 → 去 bootstrap 一个必然失败的 LaunchAgent，
    #    KeepAlive 把它反复拉起（实测 last exit code = 1，日志刷
    #    "not authenticated: run 'multica login' first"）。所以只认输出文本。
    #    （文档里列的 `multica whoami` 在 0.4.28 里不存在，别拿它当探针。）
    - name: Check whether the CLI is authenticated
      ansible.builtin.command: "{{ md_cli }} auth status"
      register: md_auth
      changed_when: false
      failed_when: false

    - name: Record authentication state
      ansible.builtin.set_fact:
        md_logged_in: >-
          {{ md_auth.rc == 0
             and 'Not authenticated' not in (md_auth.stderr | default(''))
             and 'Not authenticated' not in (md_auth.stdout | default('')) }}

    # 用 PAT 非交互认证。PAT 走 `-e md_pat=...` 传入，由 justfile 的
    # `multica-daemon` 配方从 Vault (secret/homelab/multica → daemon_pat) 现取。
    #
    # ☠️ 为什么不走浏览器 OAuth：`multica login` 的回调监听在**这台 Mac 的
    #    localhost**，在别处打开 `localhost:<port>` 是空端口；而 `--callback-host
    #    <TS IP>` 虽然端口确实可达，却有**认证等待超时窗口**，人机不同步就
    #    `timed out waiting for authentication`（2026-08-18 实测踩过）。
    #    PAT 没有窗口、非交互、可重复 —— headless 机器上这是唯一靠得住的路。
    #
    # ⚠️ 不用 community.hashi_vault 的 lookup：它要 python `hvac`，而这台控制机的
    #    brew python 是 externally-managed，为一处密钥装依赖不划算。仓库里其它地方
    #    也没有 ansible→Vault 的直连（k8s 侧统一走 Vault→ESO）。
    - name: Authenticate with the PAT when not logged in
      when:
        - not (md_logged_in | bool)
        - md_pat | default('') | length > 0
      ansible.builtin.command: "{{ md_cli }} login --token {{ md_pat }}"
      register: md_pat_login
      changed_when: true
      no_log: true          # 别让 PAT 进 ansible 输出

    - name: Re-check authentication after PAT login
      when:
        - not (md_logged_in | bool)
        - md_pat | default('') | length > 0
      ansible.builtin.command: "{{ md_cli }} auth status"
      register: md_auth2
      changed_when: false
      failed_when: false

    - name: Update authentication state after PAT login
      when: md_auth2 is defined and not (md_auth2 is skipped)
      ansible.builtin.set_fact:
        md_logged_in: >-
          {{ md_auth2.rc == 0
             and 'Not authenticated' not in (md_auth2.stderr | default(''))
             and 'Not authenticated' not in (md_auth2.stdout | default('')) }}

    - name: Install LaunchAgent plist
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/ai.multica.daemon.plist.j2"
        dest: "{{ md_plist }}"
        mode: "0644"
      notify: reload multica daemon

    # 未登录就不 bootstrap，并且要把可能残留的 agent 卸掉：
    # KeepAlive 会把一个必然失败的进程无限拉起（ThrottleInterval 只是限速，不会停）。
    - name: Ensure the LaunchAgent is NOT running while unauthenticated
      when: not (md_logged_in | bool)
      ansible.builtin.shell: |
        uid=$(id -u)
        if launchctl print "gui/${uid}/{{ md_label }}" >/dev/null 2>&1; then
          launchctl bootout "gui/${uid}/{{ md_label }}" 2>/dev/null || true
          echo BOOTED_OUT
        fi
      register: md_unload
      changed_when: "'BOOTED_OUT' in md_unload.stdout"

    - name: Explain why the daemon was not started
      when: not (md_logged_in | bool)
      ansible.builtin.debug:
        msg: >-
          multica CLI 未认证，且没有可用的 PAT —— CLI/配置/plist 都已就位，但
          LaunchAgent **刻意没启动**（启动了只会 crash-loop）。
          正常入口是 `just multica-daemon`，它会从 Vault 取 daemon_pat；
          若 Vault 里没有，先在 {{ md_app_url }} 的 web UI 生成一个 PAT，然后
          `vault kv patch secret/homelab/multica daemon_pat=mul_...` 再重跑。

    - name: Ensure LaunchAgent is loaded (bootstrap into the GUI domain)
      when: md_logged_in | bool
      ansible.builtin.shell: |
        uid=$(id -u)
        if ! launchctl print "gui/${uid}/{{ md_label }}" >/dev/null 2>&1; then
          launchctl bootstrap "gui/${uid}" "{{ md_plist }}"
          echo BOOTSTRAPPED
        fi
      register: md_load
      changed_when: "'BOOTSTRAPPED' in md_load.stdout"

    # 先让重载 handler 跑完再验收。没有这一步时，升级二进制后的验收读到的是**旧进程**
    # 的状态（2026-10-27 实测：升到 0.7.0 那次，验收打出的是 uptime 673h、cli 0.4.29）。
    - name: Flush handlers so the checks below see the reloaded daemon
      ansible.builtin.meta: flush_handlers

    # ☠️ 判据必须是 status 字段本身，不能是 rc。`daemon status` 在 daemon 根本
    #    没起来时照样 rc=0 并输出 {"status":"stopped"} —— 用 rc 当判据等于
    #    「没报错就算成功」，实测会让一个 crash-loop 的部署报绿。
    - name: Verify the daemon actually reached running state
      when: md_logged_in | bool
      ansible.builtin.command: "{{ md_cli }} daemon status --output json"
      register: md_status
      changed_when: false
      retries: 10
      delay: 3
      until: (md_status.stdout | default('{}') | from_json).get('status') == 'running'

    - name: Show daemon status
      when: md_logged_in | bool
      ansible.builtin.debug:
        var: md_status.stdout

  handlers:
    # bootout 是异步的：没等它退干净就 bootstrap 会报
    # "Bootstrap failed: 5: Input/output error"（同 node-exporter.yaml 的处理）。
    # ⚠️ 同样受 md_logged_in 保护：未登录时改 plist/升级二进制都会触发本 handler，
    #    不设这个条件就会绕过上面的闸门，把 crash-loop 拉回来。
    - name: reload multica daemon
      when: md_logged_in | default(false) | bool
      ansible.builtin.shell: |
        uid=$(id -u)
        label="{{ md_label }}"
        launchctl bootout "gui/${uid}/${label}" 2>/dev/null || true
        for _ in 1 2 3 4 5; do
          launchctl print "gui/${uid}/${label}" >/dev/null 2>&1 || break
          sleep 1
        done
        launchctl bootstrap "gui/${uid}" "{{ md_plist }}" 2>/dev/null || true
