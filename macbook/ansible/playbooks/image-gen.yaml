---
# 文生图服务：Qwen-Image-2.1 on mflux，OpenAI 兼容接口，接进 LiteLLM 网关。
#
#   tailnet ──► :8010 openai_images_shim.py ──► 127.0.0.1:4030 Orbiter/mflux-server ──► mflux 0.20.0 (MLX)
#                 /v1/images/generations            异步队列，一次只跑一个任务
#
# 为什么是这个形状（OMLX 不做文生图；现成服务各缺一块）→ docs/decisions/studio-image-generation.md
#
# ☠️ mflux-server 只监听 127.0.0.1：它的 /api/load 能切换模型并触发任意下载、/api/clear 能清队列，
#    而且没有鉴权。对 tailnet 只暴露转接层。要用它自带的网页界面：
#    ssh -i ~/.ssh/vgio -L 4030:127.0.0.1:4030 matstudio@100.98.220.75，然后开 http://localhost:4030
# ☠️ HF_HUB_OFFLINE=1：mflux 按 repo id 加载，不钉 revision。不离线的话，HF 上游一更新权重，
#    下次重启就会在后台悄悄再下 33 GB。升级权重是有意识的动作：去掉离线、重跑本 playbook。
# ☠️ 内存随「出现过的分辨率」单调增长、永不释放（2026-10-03 实测，Orbiter @7e26074 + mflux 0.20.0）：
#    第一张 1024² 后进程常驻 29 GB，之后**每个新尺寸 +13 GB**（开着 qwen21 context cache 时是
#    42 GB 起、每个新尺寸 +26 GB）。不设防的话，换几次尺寸就把 128G 推进 swap，1024² 从 55s 变成
#    3 分钟、经公网必然 524。所以两道闸：--no-qwen21-context-cache（增量减半）+ 转接层的
#    尺寸白名单 ig_sizes（最坏情况 ≈ 29 + 13×(尺寸数-1) GB）。已膨胀时 kickstart 一下即可回到 0。
#    OMLX 的池天花板（自动档 ~106 GB）**不知道这个进程的存在**，加尺寸或往 OMLX 多装模型前先算账。
#
# NO sudo。首次运行要下 33 GB 权重（几十分钟），之后幂等。
- name: Image generation (mflux + OpenAI shim)
  hosts: image_gen
  gather_facts: true
  vars:
    homebrew_prefix: /opt/homebrew
    ig_root: "{{ ansible_facts.user_dir }}/mflux"
    ig_server_repo: https://github.com/Orbiter/mflux-server.git
    # 钉提交：项目小（单人维护），requirements 钉着 mflux==0.20.0，一起钉住才可复现
    ig_server_version: 7e26074e4da5be36eb34d1c27ab50a9afa6cdabb
    ig_server_dir: "{{ ig_root }}/mflux-server"
    ig_python: "{{ ig_server_dir }}/.venv/bin/python"
    ig_model: qwen-image-2.1                  # mflux-server 的 registry 名
    ig_hf_repo: Qwen/Qwen-Image-2.1
    ig_server_port: 4030
    ig_shim_port: 8010
    # 对外允许的尺寸（第一个是默认）。每多一个，最坏常驻 +13 GB，见文件头。
    ig_sizes: ["1024x1024", "768x768", "1280x720", "720x1280"]
    # 上游未完成任务达到这个数就 429（+Retry-After）。一张 1024² 约 1 分钟、公网 100s 超时：
    # 排第二位已经会 524，再往后排只是在替 SDK 的自动重试白跑 GPU。
    ig_max_pending: 2
    ig_shim: "{{ ig_root }}/openai_images_shim.py"
    ig_server_label: com.meirongdev.mflux-server
    ig_shim_label: com.meirongdev.openai-images-shim
    ig_log_dir: "{{ ansible_facts.user_dir }}/.local/var/log"

  tasks:
    - name: Ensure directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: ["{{ ig_root }}", "{{ ig_log_dir }}", "{{ ansible_facts.user_dir }}/Library/LaunchAgents"]

    - name: Check out mflux-server at the pinned commit
      ansible.builtin.git:
        repo: "{{ ig_server_repo }}"
        dest: "{{ ig_server_dir }}"
        version: "{{ ig_server_version }}"
      notify: restart mflux-server

    - name: Create the venv (Python 3.12, as upstream requires)
      ansible.builtin.command:
        cmd: "{{ homebrew_prefix }}/bin/uv venv -q --python 3.12 .venv"
        chdir: "{{ ig_server_dir }}"
        creates: "{{ ig_python }}"

    - name: Install pinned requirements (mflux==0.20.0, mlx<0.33)
      ansible.builtin.command:
        cmd: "{{ homebrew_prefix }}/bin/uv pip install --python {{ ig_python }} -r requirements.txt"
        chdir: "{{ ig_server_dir }}"
      register: ig_pip
      changed_when: "'Installed' in ig_pip.stderr or 'Uninstalled' in ig_pip.stderr"
      notify: restart mflux-server

    # 首次 ~33 GB；已在缓存时只校验一遍元数据，几秒。不带 --revision：mflux 按 main 解析，
    # 只有这样 HF 缓存里才有 refs/main，离线模式（见文件头）才找得到它。
    - name: Download the weights into the HF cache (idempotent)
      ansible.builtin.command:
        cmd: "{{ ig_server_dir }}/.venv/bin/hf download {{ ig_hf_repo }} --quiet"
      environment:
        HF_HUB_DISABLE_XET: "1"
      register: ig_dl
      changed_when: false
      async: 7200
      poll: 30

    - name: Install the OpenAI shim
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/openai_images_shim.py"
        dest: "{{ ig_shim }}"
        mode: "0755"
      notify: restart openai-images-shim

    - name: Install the mflux-server LaunchAgent
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/{{ ig_server_label }}.plist.j2"
        dest: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/{{ ig_server_label }}.plist"
        mode: "0644"
      notify: restart mflux-server

    - name: Install the shim LaunchAgent
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/{{ ig_shim_label }}.plist.j2"
        dest: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/{{ ig_shim_label }}.plist"
        mode: "0644"
      notify: restart openai-images-shim

    - name: Ensure both LaunchAgents are loaded
      ansible.builtin.shell: |
        uid=$(id -u)
        for label in {{ ig_server_label }} {{ ig_shim_label }}; do
          if ! launchctl print "gui/${uid}/${label}" >/dev/null 2>&1; then
            launchctl bootstrap "gui/${uid}" "$HOME/Library/LaunchAgents/${label}.plist"
            echo "BOOTSTRAPPED ${label}"
          fi
        done
      register: ig_load
      changed_when: "'BOOTSTRAPPED' in ig_load.stdout"

    - name: Apply pending restarts before verifying
      ansible.builtin.meta: flush_handlers

    # 模型装载（33 GB 读进内存）要一两分钟；/api/ps 先能答，模型名对了才算装完
    - name: Wait for mflux-server to report the model
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ig_shim_port }}/v1/models"
        return_content: true
      register: ig_models
      retries: 60
      delay: 5
      until: ig_models.status == 200 and (ig_models.json.data[0].upstream_model | default('')) == ig_model

    # 端到端冒烟：用默认尺寸、2 步（最少允许值）真出一张图，几秒。证明 shim → server → mflux →
    # 取图整条链通。用默认尺寸是因为每个新尺寸都要多常驻 13 GB（见文件头），冒烟不该付这笔。
    - name: Smoke-test a tiny generation through the shim
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ig_shim_port }}/v1/images/generations"
        method: POST
        body_format: json
        body: { prompt: "a red cube on a white table", size: "{{ ig_sizes[0] }}", steps: 2, seed: 1 }
        timeout: 600
        return_content: true
      register: ig_smoke

    # 看 base64 前缀而不是解码：b64decode 过滤器按 UTF-8 解码，二进制 PNG 会炸。
    # PNG 魔数 89 50 4E 47 0D 0A 1A 0A 的 base64 恒以 iVBORw0KGgo 开头。
    - name: Assert a PNG came back
      ansible.builtin.assert:
        that:
          - ig_smoke.json.data[0].b64_json is match('iVBORw0KGgo')
        fail_msg: "shim answered 200 but data[0].b64_json is not a PNG"
        success_msg: "image-gen OK — model {{ ig_models.json.data[0].upstream_model }}, smoke image {{ (ig_smoke.json.data[0].b64_json | length) }} b64 chars"

  handlers:
    # bootout 是异步的：没等它消失就 bootstrap 会拿到 "Bootstrap failed: 5"（同 node-exporter.yaml）
    - name: restart mflux-server
      ansible.builtin.shell: |
        uid=$(id -u); label="{{ ig_server_label }}"
        launchctl print "gui/${uid}/${label}" >/dev/null 2>&1 || exit 0
        launchctl bootout "gui/${uid}/${label}" 2>/dev/null || true
        for _ in 1 2 3 4 5; do launchctl print "gui/${uid}/${label}" >/dev/null 2>&1 || break; sleep 1; done
        launchctl bootstrap "gui/${uid}" "$HOME/Library/LaunchAgents/${label}.plist"
    - name: restart openai-images-shim
      ansible.builtin.shell: |
        uid=$(id -u); label="{{ ig_shim_label }}"
        launchctl print "gui/${uid}/${label}" >/dev/null 2>&1 || exit 0
        launchctl bootout "gui/${uid}/${label}" 2>/dev/null || true
        for _ in 1 2 3 4 5; do launchctl print "gui/${uid}/${label}" >/dev/null 2>&1 || break; sleep 1; done
        launchctl bootstrap "gui/${uid}" "$HOME/Library/LaunchAgents/${label}.plist"
