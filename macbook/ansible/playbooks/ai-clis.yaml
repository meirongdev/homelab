---
# Install AI CLI tools. Idempotent — safe to re-run.
# Runs as the login user — Homebrew + npm refuse to run as root, so NO become.
#
# Tool → method → hosts:
#   claude (Claude Code)        npm @anthropic-ai/claude-code   macbook (M2)
#   qwen   (Qwen Code)          npm @qwen-code/qwen-code        macbook
#   codex  (OpenAI Codex)       brew cask codex                 macbook  (self-contained arm64 binary)
#   agy    (Antigravity CLI)    brew cask antigravity-cli       base     (every Mac)
#
# Prerequisites: Homebrew must already be installed (packages.yaml handles that).
- name: AI CLI tools
  hosts: macbook
  gather_facts: false
  vars:
    homebrew_prefix: /opt/homebrew
    homebrew_formulas:
      - node           # brings npm; required for claude + qwen
    homebrew_casks:
      - codex
    npm_global_packages:
      - "@anthropic-ai/claude-code"
      - "@qwen-code/qwen-code"

  tasks:
    - name: Ensure AI CLI Homebrew formulas are present
      community.general.homebrew:
        name: "{{ homebrew_formulas }}"
        state: present
        path: "{{ homebrew_prefix }}/bin"
        update_homebrew: false
      environment:
        PATH: "{{ homebrew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"

    - name: Ensure AI CLI Homebrew casks are present
      community.general.homebrew_cask:
        name: "{{ homebrew_casks }}"
        state: present
      environment:
        PATH: "{{ homebrew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"

    - name: Install npm global AI CLIs
      community.general.npm:
        name: "{{ item }}"
        global: true
        state: present
        executable: "{{ homebrew_prefix }}/bin/npm"
      loop: "{{ npm_global_packages }}"
      environment:
        PATH: "{{ homebrew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# cask 标了 auto_updates，`brew upgrade` 不会升它，这里也只管装上。M5 上 cask 那份停在初装的
# 1.1.7，PATH 上实际用的是官方安装器放的 ~/.local/bin/agy（.zprofile 里那段 PATH 就是它加的）。
- name: AI CLI tools on every Mac
  hosts: base
  gather_facts: false
  vars:
    homebrew_prefix: /opt/homebrew
    homebrew_casks:
      - antigravity-cli
  tasks:
    - name: Ensure Antigravity CLI is present
      community.general.homebrew_cask:
        name: "{{ homebrew_casks }}"
        state: present
        path: "{{ homebrew_prefix }}/bin"
      environment:
        PATH: "{{ homebrew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
