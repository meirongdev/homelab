---
# SSH 只允许公钥登录（所有 `macs` 主机：M2 + Studio）。
#
# 写一个 sshd drop-in：/etc/ssh/sshd_config.d/050-key-only.conf。
# ⚠️ 文件名必须排在系统自带的 100-macos.conf 之前 —— sshd 对同一个选项取**先读到**的值，
#    `050` < `100`，所以这里的 `no` 能压过后面的默认。改成 1xx 以上就静默失效。
# Studio 在 2026-11-03 已手工写过同名同内容的文件，所以对它是 no-op（changed=0）。
#
# 防自锁：写之前先确认登录用户的 authorized_keys 里至少有一把公钥，否则直接失败，
# 不动 sshd。注意这只证明「文件里有 key」，不证明那把 key 是你手上这把 —— 本 playbook
# 本身就是用 ~/.ssh/vgio 连进来的，所以能跑到这里就说明这把 key 可用。
# macOS 的 sshd 每个新连接都会重读配置，不需要重启服务，已有会话不受影响。
#
# 不影响「屏幕共享」「文件共享(SMB)」：它们不走 sshd，仍可用密码。
#
# 需要 root 写 /etc：  just ssh-key-only <host>  （带 --ask-become-pass）
- name: SSH key-only (no password / keyboard-interactive / root login)
  hosts: macs
  become: true
  gather_facts: false
  vars:
    sshd_dropin: /etc/ssh/sshd_config.d/050-key-only.conf
  tasks:
    - name: Refuse to continue unless the login user already has a public key installed
      # 以登录用户（非 root）身份读它自己的 ~/.ssh/authorized_keys。
      become: false
      ansible.builtin.shell: |
        set -o pipefail
        grep -cE '^(ssh-|ecdsa-|sk-)' "$HOME/.ssh/authorized_keys"
      args:
        executable: /bin/bash
      register: key_count
      changed_when: false
      failed_when: key_count.rc != 0 or (key_count.stdout | int) < 1

    - name: Install the key-only sshd drop-in (syntax-checked before it lands)
      ansible.builtin.copy:
        dest: "{{ sshd_dropin }}"
        owner: root
        group: wheel
        mode: "0644"
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          PubkeyAuthentication yes
        validate: /usr/sbin/sshd -t -f %s

    - name: Read the effective sshd settings
      ansible.builtin.command: /usr/sbin/sshd -T
      register: sshd_effective
      changed_when: false

    - name: Assert password logins are really off (catches a drop-in that is shadowed)
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"
          - "'permitrootlogin no' in sshd_effective.stdout_lines"
          - "'pubkeyauthentication yes' in sshd_effective.stdout_lines"
        fail_msg: "sshd -T 报的有效值不对：drop-in 被别的配置文件盖住了（检查 /etc/ssh/sshd_config.d/ 里排在 050 之前的文件）"
